    check. You may not modify anything under `pbg/` (PBG-FWK-013). **IF YOU FIND YOURSELF WANTING TO
    CHANGE THE TARGET TO PROVE A POINT, THAT WANT IS THE FINDING — WRITE IT DOWN INSTEAD.**
  and_one_specific_to_THIS_gate: >
    **YOU MAY NOT MAKE THE DOORS CHECK RED IN A THROWAWAY EXTRACTION AND REPORT THE RESULT AS THOUGH
    IT WERE THE TREE'S STATE**, any more than the last gate's seat could make it green. Experimenting
