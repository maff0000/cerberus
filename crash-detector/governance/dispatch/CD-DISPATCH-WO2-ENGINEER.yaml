#
# WHY THIS IS A DISPATCH RECORD AND NOT AN AUTHORITY RECORD (CD-FWK-004).
# `governance/authority/` admits exactly ONE record with status ACTIVE: a second one makes
# `pbg boot` return RED with "2 ACTIVE authority records; ambiguous assignment" for EVERY seat,
# including the Project Lead's. That was measured on this project at 2e116ec, not assumed — see
# the probe evidence in BL-20260819T023800Z-0003. The framework therefore cannot represent a
# Project Lead that is seated while a bounded Engineer seat acts. Rather than break boot for
# every seat, or close the PL's own authority while the PL is still causally responsible for the
# work (PBG-RT-004), the sub-agent seats are authorised HERE, durably, deriving from CD-AUTH-0001.
# The cost is disclosed rather than hidden: `pbg authority separation` continues to report
# "no ASSURANCE authority record exists ... This is NOT a pass", so PBG-SOD-001 is evidenced on
# this project by the Product Owner's ratified CD-D-002 named-actor route — distinct actor_ids on
# every seat, carried in this record, in the Build Log, and in the Assurance run record's
# `executed_by.party` — and NOT by the framework verifier. CD-FWK-004 is raised to the PO.

