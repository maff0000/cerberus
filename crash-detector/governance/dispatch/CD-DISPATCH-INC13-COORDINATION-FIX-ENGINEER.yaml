item_4_F05_PLUS_F11_THE_CARRIER_CORRUPTS_ITS_OWN_INPUT:
  finding: 'CD-ASR-WO2R3-06-F05 + F11 — **HIGH, AND THEY COMPOUND.** `launch.sh` mangles the write scope; `scope.py` then calls the mangled scope DISJOINT FROM ITS OWN SUBTREE. Together they manufacture a SILENT FALSE GREEN.'
  F05_the_unquoted_expansion: |
    launch.sh:52   --write-scope) LEASE_ARGS="$LEASE_ARGS --write-scope $2"; shift 2 ;;
    launch.sh:71   python3 -B "$ROOT/tools/coordination/lease.py" ... --pid "$$" $LEASE_ARGS
                                                                                ^^^^^^^^^^^ unquoted
    Unquoted expansion in POSIX `sh` performs field splitting AND PATHNAME EXPANSION. **A WRITE
    SCOPE IS A GLOB. THE SHELL EXPANDS THE SEAT'S DECLARED SCOPE AGAINST THE FILESYSTEM BEFORE
    `lease.py` EVER SEES IT.**
  F05_two_regimes_both_wrong:
    i_glob_matches_2_or_more: '**HARD FAILURE REPORTED AS A REFUSAL.** An argparse "unrecognized arguments" error prints to the operator as `LEASE REFUSED (rc=2)`, indistinguishable from a genuine scope collision. **COMMISSIONING THIS CARRIER WOULD REFUSE EVERY REAL LAUNCH AND TELL THE OPERATOR THERE WAS A CONFLICT.**'
    ii_glob_matches_exactly_1: '**SILENT SCOPE NARROWING -> FALSE GREEN. THIS IS THE DANGEROUS ONE.** A seat typing `docs/alpha/*` gets a lease recording `write_scope = [docs/alpha/only.md]`. A second seat then acquires `docs/alpha/other.md` and BOTH SUCCEED. **SAME REQUEST, OPPOSITE VERDICTS, AND THE ONLY VARIABLE IS WHETHER THE SCOPE PASSED THROUGH `launch.sh`.**'
  F11_the_algebra_half: |
    python3 -c "import sys;sys.path.insert(0,'tools/coordination');import scope as s;print(s.overlaps(['tools/coordination'],['tools/coordination/scope.py'])[0])"
      -> False        # DISJOINT. A DIRECTORY, DISJOINT FROM ITS OWN CONTENTS.
      overlaps(['a/*'],          ['a/b/c'])                                         -> False
      overlaps(['governance/*'], ['governance/coordination/ACCOUNTABLE-SEAT.yaml'])  -> False
    scope.py:299-306 returns DISJOINT whenever the shorter pattern is non-recursive, **WITHOUT
    ASKING WHETHER IT NAMES A DIRECTORY.** claim.py:90 partially compensates by refusing a bare
    existing-directory LITERAL — but the guard is
      if not p.recursive and not any(ch in "".join(p.segments) for ch in "*?[]{}")
    which **EXEMPTS EVERY WILDCARD FORM OF THE SAME HAZARD**, and `lease.py` has no such guard at all.
  say_the_good_part_too_because_an_unscoped_RED_is_as_useless_as_an_unscoped_PASS: >
    **`scope.py`''s ALGEBRA IS CORRECT** on every form the ninth seat put to it, including
    recursive-prefix detection, **and it printed the right answer even when its caller fed it
    corrupted input.** `F11` is a specific depth-rule gap, NOT a verdict on the automaton. **DO NOT
    REWRITE THE ALGEBRA.**
  why_the_existing_plant_missed_it_and_what_that_obliges_of_yours: >
    `PLANT-COORD-04` exercises exactly two scope forms: a LITERAL with no glob, and a glob matching
    NOTHING on disk. **THE ONLY TWO FORMS THAT CANNOT TRIGGER THE DEFECT.** The plant is 3/3 LIVE
    and certifies a deliverable that is broken for every glob matching a real path. **THIS IS THE
    STRONGEST INSTANCE IN THE WHOLE AUDIT OF A PLANT PROVING ITS OWN CHOSEN INSTANCE. YOUR PLANT
    MUST EXERCISE A GLOB THAT MATCHES ≥2 REAL PATHS AND A GLOB THAT MATCHES EXACTLY 1.**

