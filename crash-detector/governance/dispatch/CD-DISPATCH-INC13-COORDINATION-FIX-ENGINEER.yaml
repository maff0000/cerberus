       VERDICT: REFUSED — 1 scope violation(s) among 2 live claim(s)                            rc=1
  WHAT_ARM_1_ACTUALLY_IS_AND_READ_IT_TWICE: >
    Two live sessions, ONE identity, both holding the same shared record file. That is, VERBATIM,
    `VERDICT-META-ASSURANCE-01-SECOND-SEAT` §1.1: *"TWO PROJECT LEAD SESSIONS ALIVE SIMULTANEOUSLY
    ON `main`, BOTH WITH COMMIT AUTHORITY, **BOTH COMMITTING AS `PROJECT_LEAD_SEAT_01`**, NEITHER
