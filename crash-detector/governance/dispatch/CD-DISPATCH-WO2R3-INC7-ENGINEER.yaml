- id: ITEM_1
  title: '**THE REQUIRED IN-PROCESS REACHABILITY MEASUREMENT OF `_evaluate_dial`. IT GATES ITEM 2.**'
  authority: 'PO-DECISIONS-0012 ruling 4 (the assigned attack); PO-DECISIONS-0013 ruling 1 (REQUIRED).'
  the_question_verbatim_from_the_ruling: >
    *"can anything in-process reach `_evaluate_dial` without passing an established door, short of
    arbitrary code execution (outside the settled threat model)? Does the net's post-condition bind
    everything its open arity admits?"*
  what_you_do: >
    **MEASURE IT IN-PROCESS, AT RUNTIME, AND REPORT.** Both halves of the question are yours; they
    are separate and either one can fall on its own. Enumerate the routes you tried, including the
    ones that failed, and say which threat-model line each sits on. Build the probe under
    `variants/WO-2R3/` so it is corpus evidence and not a transcript claim.
  the_second_half_is_not_optional_and_is_easy_to_skip: >
    **"DOES THE NET'S POST-CONDITION BIND EVERYTHING ITS OPEN ARITY ADMITS?"** `guarded` takes
    `*extra, **extra_by_name` and passes them through to the evaluator, but
    `refuse_a_number_without_its_inputs(spec, usable, reading)` reads only THREE things. **SO ASK:
    can a caller put something in `*extra` or `**extra_by_name` that changes what the evaluator
    returns in a way the post-condition cannot see?** If yes, the net has a hole in exactly the
    dimension its arity-openness was defended on, and that is a finding of the first order.
  and_report_do_not_decide: >
    **YOU REPORT THE MEASUREMENT. YOU DO NOT RULE ON IT** (PBG-AUTH-003). PO-DECISIONS-0013 ruling 1
    already states the consequence and it is not yours to apply: *"If reachable without an
    established door, 0012 ruling 1 falls and `guarded` becomes a door with a redesigned CD-ASR-F03
    control."* **IF YOUR MEASUREMENT LANDS THAT WAY: STOP. DO NOT PROCEED TO ITEM 2. DO NOT
    REDESIGN CD-ASR-F03. COMMIT ITEM 1, BANK YOUR EVIDENCE, AND RETURN WITH THE STOP.** A redesign
    of a control on a seat's own reading of its own measurement is precisely the shape this project
    has spent five gates learning to refuse.
  what_a_pass_here_looks_like: >
    A measured, reproducible answer with a counterfactual arm (CD-D-079), NOT an argument. "I read
    the code and it is not reachable" is not a measurement. **CONSTRUCT THE REACH OR FAIL TO
    CONSTRUCT IT, AT RUNTIME, AND PRINT THE `tree:` LINE OF THE MODULE YOU ACTUALLY IMPORTED**
    (CD-PL-F98 — the Project Lead has already been caught by this exact hole).

- id: ITEM_2
  title: '**THE 0012 RECLASSIFICATION: DOORS MEMBERSHIP BY REACHABILITY, AND NETS AS A SECOND ASSERTED POPULATION.**'
  gated_by: 'ITEM_1. Do not start this until item 1 has landed and says the reclassification is true.'
  authority: 'PO-DECISIONS-0012 rulings 1, 2 and 3.'
  part_a_membership_by_reachability_not_name_prefix:
    the_ruling_verbatim: >
      *"The doors instrument's membership clause is corrected from NAME-PREFIX (a vocabulary —
      CD-PL-F74's own conviction) to REACHABILITY."*
    the_defect_being_corrected_PL_MEASURED_AT_YOUR_BASE: >
      `tools/register/check_judgement_path_doors.py:408` reads
      `def _is_public(name): return not name.startswith("_")`. **THE FIFTH ASSURANCE SEAT PROVED
      THIS NAME-DRIVEN BY THE PROJECT'S OWN RENAME TEST: renaming `guarded` to `_guarded` took the
      check from 1 violation to 0 and the suite from 2 failed to 1551 passed, WITH RUNTIME IDENTITY
      UNCHANGED.** The Project Lead reproduced that end to end. A check that a two-line rename
      silences is a vocabulary guard wearing a structural label.
    what_reachability_has_to_MEAN_and_this_is_the_hard_part: >
      **THE RULING GIVES YOU THE CRITERION AND NOT THE ALGORITHM, AND THE ALGORITHM IS YOURS.**
      Ruling 1's own reasoning names the properties: *"§D.1's class is PUBLIC entry points;
      `guarded` is a function-local binding, never importable, reachable only through doors that
      already establish."* So the operative question for each candidate is: **CAN A CALLER OUTSIDE
      THIS MODULE OBTAIN AND CALL THIS OBJECT WITHOUT FIRST PASSING SOMETHING THAT ESTABLISHES?**
      **DECLARE YOUR CRITERION IN THE INSTRUMENT'S HEADER, IN `required-tests.yaml` AND IN
      `contracts/execution/` (CD-RULE-004, all three places), AND MAKE IT SURVIVE ITS OWN RENAME
      TEST.** An instrument that replaces one name heuristic with a subtler name heuristic has
      changed the header text and not the code path, which is this dispatch's named prohibition.
    the_trap_the_previous_engineer_documented_and_you_must_not_walk_into: >
      It recorded the exemption it was TEMPTED by: extending "non-public enclosing class" to
      enclosing FUNCTIONS. That would exempt `guarded` and look like symmetry — **AND WOULD REOPEN
      THE FOURTH ASSURANCE SEAT'S OWN ESCAPE 4 ARM 4, a function-local `def` bound into a module
      dict, WHICH THAT SEAT DEMONSTRATED LIVE.** **IF YOUR REACHABILITY CRITERION EXEMPTS
      `guarded`, YOU MUST DEMONSTRATE THAT IT STILL CATCHES ESCAPE 4 ARM 4. THAT IS A REQUIRED
      CONTRAST, NOT AN OPTIONAL ONE.** Build it. If it cannot be built, your criterion is wrong.
  part_b_NETS_a_second_asserted_population:
    the_ruling_verbatim: >
      *"A second declared population is created: NETS — function-local post-condition guards on
      judgement paths — enumerated and asserted exactly as doors are, each with its post-condition
      named. 'Not a door' must never again mean 'not seen.' Zero unclassified interceptors on any
      judgement path."*
    what_this_requires_and_the_last_sentence_is_the_acceptance_test: >
      **"ZERO UNCLASSIFIED INTERCEPTORS ON ANY JUDGEMENT PATH" IS A CLOSURE CLAIM AND IT IS
      ASSERTED, NOT PRINTED.** Every interceptor the instrument finds on a judgement path is either
      a DOOR or a NET, by enumeration, with set equality asserted in both directions exactly as the
      Class-2 sweep's register is (`tools/sweep/delegated_judgement_sweep.py` is the model — read
      how it asserts, then do that). A NET whose declaration names no post-condition FAILS. A
      declared NET that no longer exists FAILS.
    name_the_post_condition_as_DATA_not_as_PROSE: >
      "each with its post-condition named" — a NET's declaration must name the callable that IS its
      post-condition, resolvable and checkable, not a sentence describing one. `guarded`'s is
      `refuse_a_number_without_its_inputs`. **A PROSE FIELD HERE IS A HAND-MAINTAINED SUMMARY AND
      THIS PROJECT HAS A NAMED DEFECT CLASS FOR THOSE.**
    and_declare_what_the_NETS_POPULATION_DOES_NOT_REACH: >
      CD-RULE-004. Every declared limit of the new population, in all three places, MEASURED. **AN
      UNDERSTATED RESIDUE IS THIS PROJECT'S MOST-FOUND DEFECT** and the sixth Assurance seat is
      being told to test your residues before your closures.
  part_c_the_RED_row_resolves_by_reclassification_and_by_nothing_else:
    the_ruling_verbatim: >
      *"The RED doors row and the two failing tests are resolved BY THE RECLASSIFICATION — after
      the next assurance pass, never by exemption or weakening."*
    the_two_tests: >
      `tests/test_judgement_path_doors.py::test_the_static_check_passes_and_is_not_vacuous` and
      `::test_the_collector_boundary_is_a_judgement_path_package_and_cd_bp_003_is_what_remains`.
      **THEY GO GREEN BECAUSE `guarded` IS CORRECTLY CLASSIFIED, NOT BECAUSE THEY WERE ADJUSTED.**
      If you find yourself editing an assertion in either test to accommodate your change, STOP and
      report — that is the weakening route and it is prohibited.

- id: ITEM_3
  title: '**THE `__wrapped__` PRODUCT DEFECT: REMOVED, THE TEST CORRECTED, EVERY LIVE INSTANCE ENUMERATED BY INSTRUMENT, THE HISTORIC ATTACK SET RE-RUN.**'
  authority: 'PO-DECISIONS-0013 ruling 2.'
  the_finding_PL_MEASURED_AT_YOUR_BASE: >
    In a pristine extraction of 9f7b764, `tree:
    /tmp/cd-base/src/crash_detector/engine/evaluate.py`, `hasattr(_evaluate_dial, "__wrapped__")`
    is **True**, and it resolves to the undecorated `_evaluate_dial`. **THE PROJECT DELETES THIS
    EXACT ATTRIBUTE IN TWO OTHER PLACES AND CALLS IT A BYPASS BOTH TIMES:**
    `src/crash_detector/admission.py:766` and `src/crash_detector/establishment.py:506`, and
    `admission.py:222` declares *"(b) THE `__wrapped__` ATTRIBUTE — THIS HALF IS CLOSED HERE."*
    **"HERE" MEANT `admits` ONLY, AND NOBODY HAD WRITTEN DOWN THAT THE THIRD DECORATOR WAS OPEN.**
  part_a_remove_it: >
    Remove the bypass from the CD-ASR-F03 guard **consistent with the project's own delattr
    practice at its two other sites** (ruling 2, in terms). Read both existing sites first — they
    carry a `try/except AttributeError` and a comment block explaining what the deletion does and
    what it explicitly does NOT close (the `__closure__` cell route, which is true of every Python
    decorator and is DECLARED LIMIT 6). **MATCH THAT PRACTICE INCLUDING ITS HONESTY: your comment
    must say what remains open, not only what closed.**
  part_b_correct_the_presence_asserting_test: >
    `tests/test_evaluate.py:692` —
    `assert hasattr(evaluate_module._evaluate_dial, "__wrapped__")` — inside
    `test_the_per_dial_evaluator_carries_the_post_condition`. **THE RULING: *"a test that requires a
    bypass to exist pins the bypass open, and a test that asserts a vulnerability is a defect in the
    test."*** The test's INTENT is sound and is stated in its own docstring: the guard is applied AT
    the function boundary, not written into the body. **KEEP THE INTENT. CHANGE THE INSTRUMENT.**
    Prove the post-condition is attached by a means that is not itself a way through it — the
    obvious candidate is to demonstrate the guard FIRING on the real `_evaluate_dial`, which tests
    the property the docstring actually claims. **AND ADD THE NEGATIVE: assert `__wrapped__` is
    ABSENT, as `tests/test_field_establishment.py:215` and `tests/test_admission.py:334` already do
    for the two closed sites.** Three sites, one practice, three carriers.
  part_c_enumerate_every_live_wrapped_BY_INSTRUMENT_not_by_memory: >
    The ruling is explicit: *"Every other live `__wrapped__` is enumerated BY INSTRUMENT, not by
    memory."* **A GREP IS NOT AN INSTRUMENT AND NEITHER IS THIS DISPATCH'S LIST.** Import the
    package and walk the live objects, because the question is about RUNTIME attributes on compiled
    objects and a source scan cannot answer it — that is exactly the reading that let this one
    survive. Whatever you find that is live and undeclared is a FINDING; if it is outside your
    writable scope, **REPORT AND STOP on that instance rather than widening your own scope.**
  part_d_re_run_the_historic_attack_set_at_the_NEW_HEAD: >
    *"the historic WO-2R `__wrapped__` attack set is re-run at the new head. Whether this reopens
    WO-2R routes is answered by that re-run, not by argument."* Start from
    `variants/WO-2R3/V24-wrapped-attribute-bypass.patch` and `variants/WO-2R/`, and **READ THE
    DIRECTORY AND NOT ONLY `MANIFEST.md` — CD-PL-F97 records that six executable probes landed
    under `variants/WO-2R3/` with ZERO rows in the manifest.** Report the result as a table with a
    before/after per route. **IF A WO-2R ROUTE REOPENS, THAT IS THE HEADLINE OF THIS INCREMENT AND
