- id: ITEM_5
  title: '**`admits`''s OWN ARITY-OPEN `door(*args, **kwargs)` — ADDRESSED, OR DECLARED AT ITS MEASURED REACH.**'
  authority: 'PO-DECISIONS-0013 ruling 6.'
  where: 'The `door` wrapper inside `admits`, `src/crash_detector/admission.py` (see line 742 `return entry_point(*args, **kwargs)`).'
  the_symmetry_that_makes_this_an_item: >
    PO-DECISIONS-0012 ruling 1 defended `guarded`'s arity-openness as LOAD-BEARING and made it the
    reason `guarded` is a net rather than a door. **`admits`''s own wrapper is arity-open too, and
    nobody has asked the same question of it.** The door binds and checks the parameters it was
    DECLARED, then forwards `*args, **kwargs` whole. So: **is there anything a caller can pass that
    reaches the entry point WITHOUT passing through the binding-and-refusal loop?** Consider at
    minimum the shapes this project has already been bitten by: parameters not in the declaration,
    the `_RECEIVER_NAMES` skip, `**kwargs` on the wrapped entry point itself, and positional/keyword
    mismatch against `signature.bind`.
  what_you_do: >
    **EITHER address it, OR declare it with the reach you MEASURED.** Both are acceptable; the
    ruling says "addressed or declared at measured reach" and means it. **WHAT IS NOT ACCEPTABLE IS
    A DECLARATION WITH AN ASSUMED REACH** — CD-RULE-004, and this project's most-found defect is the
    understated residue. If you declare, the declaration goes in all three places and names what you
    ran.
  a_warning_about_scope: >
    `admission.py` is open to you FOR THIS ITEM AND FOR ITEM 3's PRACTICE REFERENCE ONLY. **IF YOU
    FIND YOURSELF CHANGING WHAT `admits` DOES rather than what it declares, STOP AND SAY WHY.** A
    mechanism change to the admission door in a remediation increment is a different increment and
    needs a different ruling.

- id: ITEM_6
  title: '**THE CD-PL-F100 FINGERPRINT FIX — THE GITIGNORED SWEEP, LANDED AS A GOVERNED INSTRUMENT.**'
  authority: 'PO-DECISIONS-0013 ruling 5, parenthetically: *"F100''s gitignored-sweep fix lands in the remediation increment meanwhile"*.'
  the_defect_verbatim_from_the_finding: >
    **"THE FINGERPRINT RECIPE THIS SEAT PUT IN THE DISPATCH INCLUDES GITIGNORED FILES."**
    `find . -path ./.git -prune -o -type f -print | ... | sha256sum` sweeps `.pytest_cache/`, which
    is created by running `pytest` — **WHICH THE DISPATCH ORDERS THE SEAT TO DO.** The dispatch then
    tells the seat a moved fingerprint means *"something mutated under you and your verdict is about
    a tree that no longer exists"*. **SO THE INSTRUMENT FIRES ITS MAXIMUM-SEVERITY ALARM AT AN
    AUDITOR FOR OBEYING THE DISPATCH.**
  the_PROJECT_LEADS_OWN_MEASUREMENT_HANDED_TO_YOU_AS_EVIDENCE_AND_NOT_AS_A_DESIGN: >
    Taken in `/srv/crash-detector-wo2r3-audit5` at 9f7b764, which still carries the fifth seat's
    `.pytest_cache/` residue (`git status --porcelain --ignored` -> `!! .pytest_cache/`):
    **(a) the shipped recipe -> `24d66d0ef56634d973011e8793d208e92fc560ecf85473ca969786318a333c9c`
    — the FALSE ALARM, reproduced.
    (b) the fifth seat's ad-hoc `-path ./.pytest_cache -prune` arm ->
    `50b356ac2de1a404b75a6fb9e478fe5d4141c4fdc6ad34ddfbfcd4a5a92ee7b9`.
    (c) `git ls-files -z --cached --others --exclude-standard | sed -z 's|^|./|' | LC_ALL=C sort -z
    | xargs -0 sha256sum | sha256sum` -> `50b356ac...`, AN EXACT MATCH TO (b) AND TO THE VALUE
    DECLARED IN DISPATCH 05.**
  why_the_PL_thinks_c_is_structural_and_b_is_a_vocabulary_fix_AND_WHY_THAT_IS_YOURS_TO_ATTACK: >
    (b) names one directory. **APPLY THIS PROJECT'S OWN RENAME TEST TO IT: run pytest with a
    different cache directory and (b) stops pruning, because it is a name.** (c) delegates the
    question to `.gitignore` via `--exclude-standard`, so it excludes whatever the repository has
    declared ignorable. **THE PROJECT LEAD BELIEVES THAT IS THE STRUCTURAL FORM AND MAY BE WRONG.**
    Known properties of (c) that you should treat as attack surface, not as reassurance: it depends
    on `.gitignore` being CORRECT (a wrongly-ignored product file becomes invisible to the
    fingerprint — **THAT IS A REAL WEAKENING AND IT MUST BE DECLARED**); the `sed -z` prefix exists
    only to reproduce the historic `./` path spelling; and it silently does nothing useful outside a
    git worktree.
  what_you_do: >
    Land it as a **GOVERNED INSTRUMENT IN THE TREE**, not as a shell line pasted into the next
    dispatch — that is what made it un-reviewed and un-tested in the first place, and it is why this
    item exists at all. It gets a header that DECLARES its population and its limits like every
    other instrument here, a carrier that FAILS when it regresses (CD-RULE-006), and the
    counterfactual arm above as its evidence: **a tree carrying an ignored artefact must fingerprint
    identically to the same tree without it, and a tree with one byte of TRACKED content changed
    must not.** Both arms, measured.

