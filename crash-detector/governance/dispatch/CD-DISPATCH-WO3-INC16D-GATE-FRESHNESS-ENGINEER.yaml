# ================================================================================================== #
# WHAT YOU ARE BUILDING — FOUR ITEMS, IN THIS ORDER
# ================================================================================================== #

item_1_the_fourth_refusal_stage:
  where: src/crash_detector/publication/envelope_contract.py
  what: >
    `refuse_unless_publishable` today runs THREE stages in order — `_refuse_non_json`,
    `_refuse_classified_keys`, `_refuse_schema_violation`. **ADD A FOURTH: the FRESHNESS stage.**
    It runs AFTER `_refuse_schema_violation`, because a document that is not shaped like an envelope
    has no meaningful stamps to compare and the schema stage is what establishes the shape.
  the_predicate_stated_exactly: >
    *** **FOR EVERY NODE IN THE CANDIDATE DOCUMENT THAT CARRIES `detail_level: "calm"`, THAT NODE
    MUST PROVE FRESHNESS, AND IF IT CANNOT, THE ENVELOPE IS REFUSED.** ***

    Proving freshness means ALL of the following, and any one of them failing is a REFUSAL:
      (a) the document's root carries a `published_utc` that parses as the declared UTC pattern;
      (b) the document's root carries a `staleness_window_seconds` that is a real, finite number
          and is strictly positive;
      (c) the calm-bearing node itself carries AT LEAST ONE UTC timestamp property that parses;
      (d) `age = published_utc - <that stamp>` is **NOT NEGATIVE** — a stamp AFTER publication is
          data from the future, which is incoherent rather than fresh, and it FAILS CLOSED; and
      (e) `age <= staleness_window_seconds`.

    Where a calm-bearing node carries MORE THAN ONE parsable stamp, **the OLDEST governs** — "as
    fresh as its oldest input, never as fresh as the last time we asked" is the envelope's own
    declared doctrine for `as_of_utc` and this stage must not quietly adopt a laxer one.
  why_it_quantifies_over_NODES_and_not_over_DIAL_SLOTS: >
    *** READ THIS TWICE. IT IS THE WHOLE DESIGN AND IT IS WHY ITEM 3 COSTS YOU ALMOST NOTHING. ***

    The obvious implementation reads `candidate["equity_crash"]["as_of_utc"]` and
    `candidate["monetary_debasement"]["as_of_utc"]`. **DO NOT WRITE THAT.** It re-opens the exact
    problem Rule CC just closed: it hard-codes the document shape, so it knows about the two dial
    slots that exist today and is silent on the third one a contract edit adds tomorrow. Eleven
    consecutive audit rounds on this row have been lost to instruments that enumerate what they
    already know about.

    **QUANTIFY OVER THE DOCUMENT INSTEAD.** `_iter_nodes` already exists in this module, already
    walks objects AND arrays at every depth, and already yields RFC 6901 pointers — stage 1 already
    trusts it. Walk it. Any mapping node whose `detail_level` is `calm` is a calm-bearing node and
    must prove freshness, **wherever in the document it sits, at whatever depth, through however
    many arrays.** That is deny-by-default over the DOCUMENT rather than recognition over the
    CONTRACT, and it does not care what the contract declares.
  fail_closed_is_the_rule_at_every_branch: >
    A stamp that will not parse, a window that is not a number, a `published_utc` that is missing,
    a calm-bearing node with NO stamp at all, a comparison that raises — **every one of these is a
    REFUSAL and never a skip.** Where a check cannot reach its authentic target it must fail, never
    wave through (Standards Baseline §16, PBG-CI-002). There is no "cannot tell, so allow" branch in
    this stage and you must not write one.
  no_external_clock: >
    *** **THIS STAGE CALLS NO CLOCK. NOT `datetime.now`, NOT `time.time`, NOT `time.monotonic`, NOT
    `date`. IT TAKES NO CLOCK PARAMETER AND NO SPAN PARAMETER.** *** Both instants come out of the
    candidate document. That is what keeps this inside PO-DECISIONS-0029 ruling 1's
    "computed PURELY FROM THE DOCUMENT" and what stops it reopening BP-AMENDMENT-0001 §D.3's
    NO-CALLER-CLOCK rule, which is IN FORCE and which says in terms that **no parameter exists
    through which a caller clock, caller sleep or caller span can arrive.** Prove it in your return
    by grepping your own diff for the clock names and showing zero hits.
  the_refusal_token: >
    Add a new stable `reason_class` token beside the six that exist — `REFUSAL_STALE_CALM` is
    suggested and the name is yours. It carries the JSON POINTER to the offending node and the KEY
    NAME. **IT CARRIES NO VALUE FROM THE CANDIDATE — not the stamp, not the age, not the window.**
    `PublicationRefused` was built to make that impossible to get wrong (PBG-SEC-002); a refusal
    message that quotes the stamp is a defect, not a nicety.

item_2_the_predicate_is_the_SIMPLE_WINDOW_FLOOR_AND_NOTHING_MORE:
  ruled_by: PO-DECISIONS-0029 ruling 2
  what_you_build: >
    The comparand is the document's own root `staleness_window_seconds`. That field is REQUIRED at
    the root of BOTH closed contracts today, is typed `number` with `exclusiveMinimum: 0`, and its
    own description says it is *"the window that was applied, carried so every consumer judges
