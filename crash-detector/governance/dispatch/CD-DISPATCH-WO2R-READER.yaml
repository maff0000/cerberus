# --- the defect -------------------------------------------------------------------------------- #
the_defect:
  finding: 'CD-PL-F61 (MEDIUM), confirming the seat-raised CD-ENG-WO2R-F14 (MEDIUM).'
  minimal_reproduction: |
    printf 'top:\n  - key:\n      - nested\n' > /tmp/hang.yaml
    cd <pristine extraction of f22d120>
    timeout 20 python3 -B -c "import sys; sys.path.insert(0,'tools/register'); import _yamlmin; _yamlmin.load_yaml('/tmp/hang.yaml')"
    # -> exit 124. IT DOES NOT TERMINATE.
  verified_by_the_project_lead_at_the_dispatch_base: >
    Reproduced at f22d120 on 2026-08-19T17:11Z, exit 124. `git log be34fe4..f22d120 --
    tools/register/_yamlmin.py` is ZERO commits, so increment 5 did not touch it and the defect is
    exactly as recorded at increment 3b.
  three_facts_that_matter:
  - 'IT IS NOT AN EXOTIC SHAPE. PL-T5 was written to test value-position smuggling under an
    admissible key, not to find a hang. `declared_in` as a list of two authorities is an ordinary
    edit, and the Project Lead met the defect by accident on the first probe of that shape.'
  - 'IT AFFECTS BOTH CHECKS SHARING THE READER. On the PL-T5 tree, check_egress_no_broker.py exit
    124 AND check_base_image_digest_pin.py exit 124; on the clean tree both exit 0. TWO of the
    eleven declared gate commands return NO VERDICT on the same input.'
  - 'IT PREDATES THE AUDIT. _yamlmin.py has ZERO commits in ee8be6b..ba469b5, and the minimal
    document hangs at ee8be6b AND at 66681b2 — THE EXACT SHA THE FIRST AUDITOR WAS GIVEN. It was
    reachable throughout the WO-2 assurance run and was never met.'
  what_it_is_not: >
    NOT a false clean. A hang is not exit 0 and is fail-closed under any harness imposing a timeout.
    It is a check that cannot return a verdict, which is what PBG-CI-002's "never a skip, for any
    reason" is aimed at — a skip of indefinite length that also stops the pipeline behind it.

why_not_pyyaml:
  the_rule: >
    This is a decision already taken on this project and you are NOT re-taking it. The register
    checks are gates; a gate that depends on a third-party parser depends on that parser's version,
    its resolution rules and its own CVEs, and `yaml.safe_load` accepts documents this project
    deliberately refuses. Read the header of _yamlmin.py for the reasoning as recorded.
  what_you_may_do_instead: >
    Make the hand-rolled reader terminate. If you conclude it cannot be made correct within this
    scope, FAIL CLOSED and escalate with your evidence — do not substitute a dependency.

# --- what the repair must establish ------------------------------------------------------------ #
invariants_you_must_establish:
- 'TERMINATION IS STRUCTURAL, NOT PATCHED. The class is "an input on which the reader does not
  finish", not "the nested-sequence document". Do not fix the shape PL-T5 happens to use. Find WHY
  the loop fails to advance — a branch that consumes no input, or that re-enters at the same offset
  — and make progress a property of the loop rather than of the inputs it happens to meet. A reader
  that terminates because every known shape was enumerated is the exact defect four AMBER verdicts
  were about.'
- 'A DOCUMENT IT CANNOT PARSE RAISES, AND SAYS WHAT IT COULD NOT READ. The project standard is
  already set by the increment-3 reader behaviour COMMENDED at CD-D-048: it REFUSES TO GUESS rather
  than reading a hidden field as absent (PL-S2, exit 3). Silence and a partial parse are both worse
  than a refusal, because a partial parse of a gate''s subject makes the gate decide on a document
  nobody wrote.'
- 'NO VERDICT CHANGES ANYWHERE. Every register check must reach the SAME conclusion on the clean
  tree and on every existing variant that it reaches today, with the same assertion counts, except
  where it previously returned NO verdict. Prove it by running them, before and after, and put both
  columns in your Build Log entry. A silently shrinking assertion count is how a skipped arm hides
  (CD-ENG-WO2R-F16, adopted project method).'
- 'REGRESSION COVER EXISTS. Add pytest cover for the reader itself: the minimal hanging document,
  PL-T5''s shape, V30, deeper nesting than either, and at least two malformed documents that must
  RAISE. CD-PL-F63 was raised because an 892-line check rewrite added zero tests; do not repeat it.
  The node-id count must GROW and nothing may be removed.'

variants_and_proof:
  extraction_hygiene: >
    NEVER mutate the worktree to test a variant and NEVER create a git worktree for one. Extract with
    `git archive <sha> | tar -x -C <tmpdir>`, apply with `git apply -p1`, run, discard — a separate
    pristine extraction per variant. `python3 -B` everywhere so no __pycache__ is written into a
    governed tree (PBG-RT-001: mutation by EFFECT, not by label).
  use_a_timeout_on_every_arm: >
    `timeout 60` on every reader invocation, both arms. Exit 124 is the observation, and without a
    timeout you will hang your own session instead of measuring the defect.
  assert_the_reason_not_merely_the_exit: >
    CD-ENG-WO2R-F13, adopted project method: assert the expected RULE ID or exception, not merely a
    non-zero exit. A variant refused for a reason you did not intend has told you nothing, and
    `git apply` has silently truncated hand-written hunks on this project before.
  durable_variants: >
    Every variant lands as a `git apply`-able patch under variants/WO-2R/READER/ plus a row in
    variants/WO-2R/MANIFEST.md naming the document shape, what it attacks, the exact command line
    and the observed outcome. NOTHING under variants/ may be executable (PBG-ASSURE-001).
  minimum_set:
  - 'the three-line minimal document above — currently exit 124, must terminate'
  - 'PL-T5, at governance/reconciliation/WO-2R/PL-T1-T5-pending-closure-and-the-reader-hang.patch.txt (READ ONLY — copy it, do not edit it)'
  - 'V30, the seat-declared variant at boundary 8'
  - 'CD-ENG-WO2R-F19''s nested-anchor case, folded in here rather than left owed'
  - 'at least TWO new documents of your own that no one has tried, attacking termination by a
    different route than nesting depth'

commit_message_contract:
  requirement: >
    Every commit carries this block, filled in. A commit without it is not accepted at
    reconciliation, however good the code is.
  template: |
    CLASS CLOSED:  <the class of input on which the reader now terminates — as a class, not as a
                    list of document shapes>
    STRUCTURE:     <what makes progress a property of the loop. Name the invariant, not the diff.>
    WHY IT IS A CLASS CLOSURE: <why can no input fail to advance, rather than none of the inputs
                    tried?>
    PROVED BY:     <exact commands, exact observed outcomes, with timeouts>
    VARIANTS RE-RUN: <the minimum set above> -> each terminating, with the observed outcome
    NEW VARIANTS (>=2, mine): <route, and why it is a different route>
    NO VERDICT CHANGES: <every register check, before and after, with assertion counts in both
                    columns>
    CLEAN ARM:     <full declared command set + full pytest suite> -> exit 0, <N> passed
    ELEVEN PLANTS: <still applying? still contrasting?>
    DECLARED LIMIT (if any): <per CD-RULE-004, in the check header, the register entry and the
                    execution contract, consistently, each boundary with an executable example>

