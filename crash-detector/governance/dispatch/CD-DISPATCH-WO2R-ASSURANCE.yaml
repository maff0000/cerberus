# --- method notes adopted by this project -------------------------------------------------------- #
adopted_method_notes:
- id: F13
  note: >
    ASSERT THE RULE ID, NOT MERELY A NON-ZERO EXIT. A variant refused FOR THE WRONG REASON has told
    you nothing, and a probe you believe passed because the exit code was right is worse than no
    probe. THIS HAS NOW RECURRED FOUR TIMES ON THIS PROJECT, against the Engineer, against the
    Project Lead's own probes twice, and once against a PROSE measurement (CD-PL-F71). It caught the
    Project Lead a fifth time while this dispatch was being written: a pristine-clone boot probe read
    AMBER/CONTINUITY_DRIFT and looked like a real degradation, when the only variable that mattered
    was that the clone was on a DETACHED HEAD rather than branch main (CD-PL-F72). ASSUME IT IS
    PRESENT IN YOUR OWN WORK. A result that agrees with what you expected is the one to re-run.
- id: F16
  note: >
    A SHRINKING ASSERTION COUNT IS HOW A SKIPPED ARM HIDES. V26 once reported PASS at 52 assertions
    where clean was 53. Record assertion counts, not just verdicts, and treat a drop as a finding
    until explained.
- id: F18
  note: >
    A DERIVATION REFUSAL AT EXIT 3 ARRIVES BEFORE A REACH VIOLATION AT EXIT 1. An auditor asserting
    only "non-zero" learns less than the output actually holds. Distinguish PRECONDITION_NOT_MET
    from a real violation every time.
- id: CD-RULE-008
  note: >
    Any boot verdict you record is taken on a PRISTINE CLONE AT THE COMMITTED SHA, never a working
    tree, and the entry naming a verdict names the SHA it was taken at. And per CD-PL-F72: check it
    out ON THE RECORDED BRANCH, or continuity reads DRIFT for a reason that has nothing to do with
    the record.

# --- read-only by default ---------------------------------------------------------------------- #
prohibited_mutation:
  default: >
    Mutation of the target is PROHIBITED. Judge mutation by EFFECT, not by command label
    (PBG-RT-001): a read-only-sounding command that writes a cache, takes a lock or triggers a
    rebuild has mutated the target. Observe a lock; never take it.
  explicitly_permitted_safe_diagnostics:
  - id: SD-1
    action: Write your evidence and verdict artefacts under /srv/crash-detector-wo2r-evidence/.
    note: >
      That directory is OUTSIDE every git worktree, so the audited tree stays byte-identical to the
      SHA you audited. The Project Lead transports those artefacts into the repository unaltered;
      you author them, and nobody edits their contents.
  - id: SD-2
    action: Extract throwaway copies of the target under /tmp with `git archive | tar -x`.
    note: >
      Chosen deliberately over `git worktree add`, which writes into .git/worktrees and would mutate
      the audited repository's administrative state. RUN EVERYTHING IN THESE COPIES — including the
      clean baseline arms — so the audit worktree's fingerprint survives.
  - id: SD-3
    action: >
      Run ONE throwaway PostgreSQL container to read the grant matrix out of a live catalogue.
    bounds: >
      image postgres:16-alpine pinned BY DIGEST; container and volume names prefixed
      `cd-asr-wo2r-`; published on 127.0.0.1 on an ephemeral port; credentials generated at run time
      from the environment and never written down; destroyed with `docker rm -f` and
      `docker volume rm` before you return, with the removal evidenced.
    classification: MUTATION_CAPABLE_AUTHORISED — it creates and destroys a container and a volume.
    forbidden: >
      touching, inspecting into, stopping or restarting ANY container or volume on this host that
      does not carry the `cd-asr-wo2r-` prefix. OTHER PROJECTS ARE RUNNING ON THIS HOST. Do not
      reuse or inspect the Engineer's `cd-store-wo2-` store or the first auditor's `cd-asr-wo2-`
      prefix: build your own from the migrations in the target.
  forbidden_absolutely:
  - modifying anything in /srv/crash-detector, /srv/crash-detector-wo2, /srv/crash-detector-wo2-audit
    or /srv/crash-detector-wo2r-audit
  - modifying anything under pbg/ (PBG-FWK-013)
  - committing anything, on any branch, in any worktree
  - repairing any defect you find (PBG-SOD-004 — finding it does not make you the one who fixes it;
    fixing it forfeits your independence over this target). Report it; the Engineer repairs it.
  - granting acceptance. You supply evidence and a verdict; a PASS is not an acceptance (PBG-AUTH-003).
  - admitting your own run record into the register. You WRITE it (W9); admission is a separate act
    under CD-RULE-001 and is not yours.

# --- the run record ------------------------------------------------------------------------------ #
run_record:
  W9_produce_the_run_record: >
    Write the run record to /srv/crash-detector-wo2r-evidence/required-tests/runs/RTR-WO2R-0001.json.
    Shape, per REQUIRED-TEST-REGISTER-CONTRACT-v1 (read pbg/tools/pbg/required_tests.py for the
    exact reader):
      run_id: "RTR-WO2R-0001"
      executed_by: {party: "CD-ASR-WO2-02", independence_class: "SEAT_INDEPENDENT"}
      candidate: "50fc23177f790164c3fc3604ccee51663e755c70"
      results: [
        {test_id, mode: "NEGATIVE_CONTROL", arms: {baseline: {command, exit_code},
                                                   violated: {command, exit_code}}},
        {test_id, mode: "ACCEPTANCE", command, exit_code}
      ]
    The `command` strings in BOTH arms and in the ACCEPTANCE result must equal the register's
    declared `execute` string EXACTLY, character for character — the validator refuses evidence that
    ran something other than the test it purports to certify. Record what you actually ran and what
    it actually returned. NEVER adjust a recorded exit code, and never record an arm you did not run.
    CD-RULE-001 (Product Owner, NON-RELAXABLE): no run record is admitted without its PAIRED
    ASSURANCE VERDICT, and no criterion you hold not-PASS may compute PASS. Writing the record does
    not admit it. If your verdict is not PASS on a criterion, the record must not be capable of
    making that criterion read PASS — and if you find it would, THAT IS A HIGH FINDING against the
    framework, which is exactly how CD-FWK-005/IMP-015 was found the first time.

# --- verdict form ------------------------------------------------------------------------------ #
expected_verdict:
  values: [PASS, AMBER, RED, UNSUPPORTED, NOT_APPLICABLE]
  required_qualification: >
    Every verdict carries its CONFIDENCE and its SCOPE — what you examined, what you did not, and
    what you could not. A scoped PASS that names its limits is useful; an unscoped PASS is a
    liability. State the CONTINUATION IMPLICATION separately from the finding: what is true and what
    is safe to do next are different calculations. STATE YOUR DENOMINATOR on every count you report
    (CD-PL-F66).
  per_criterion: >
    A separate verdict line for each of CD-AC-001, 002, 003, 005 and 012, because the gate is per
    plant. The overall verdict is the worst of them. For each, say explicitly whether the guard
    closes the CLASS or only the INSTANCE, and on what evidence.
  on_the_declared_limits: >
    For each declared boundary you examined, state which of the three W6 tests it passes. A limit
    honestly drawn is a PASS-compatible finding; a boundary asserting an unmeasured carrier is not.
  next_safe_gate: >
    Name it explicitly. A verdict without a named next safe gate is incomplete (PBG-ASSURE-004).
  no_synthetic_green: >
    PBG-ASSURE-012. Do not weaken a check to obtain a verdict, do not accept a substitute target
    because the real one is awkward to reach, and do not narrow scope silently — if you examined
    less than dispatched, that belongs in the verdict, not in a footnote. Where you cannot refute a
    claim and cannot fully verify it either, say precisely that. An honest AMBER is worth more than
    a confident PASS resting on an unexamined assumption.
  a_note_on_courage: >
    The first auditor returned AMBER and failed this gate, and the Product Owner COMMENDED the
    project for refusing to admit the run record that would have made it read PASS. A second AMBER
    is a legitimate outcome of this dispatch and will be recorded as such. There is no institutional
    pressure here for a PASS and you should assume none.

expected_next_actor: PROJECT_LEAD
returns_to: >
  Project Lead (PROJECT_LEAD_SEAT_01), who reconciles the verdict, records the WO-2 gate outcome
  durably, and STOPS for Product Owner review either way. The Product Owner reviews before WO-3.
