    wrapper the project wrote to make verification convenient (PBG-ASSURE-001). Verify CONTENTS,
    never names: a file, role, grant, schema, boundary or test named correctly proves nothing about
    what is inside it. Confirm the SHA you audited matches the SHA dispatched, and say so in the
    verdict. Confirm `git status --porcelain` is zero lines before you start.

  W2_execute_every_declared_command_yourself: >
