    baseline arm), then apply that test's plant to a THROWAWAY COPY and run the SAME verbatim
    command there (the violated arm). Make every copy with
    `git archive <sha> | tar -x -C <tmpdir>` — do NOT create a git worktree and do NOT execute
    inside the audited tree (see target_tree_fingerprint.fair_warning). Apply the plant YOURSELF
    with `git apply` or an equivalent direct edit; you may not run any Engineer-supplied script that
    performs the arms for you, because an auditor verifying through the project's own wrapper is
    auditing the wrapper. There are ELEVEN plant patches under plants/ across the five criteria and
    a MANIFEST.md naming, per plant, the proposition violated and the literal command line.
    Record, for every arm: the exact command string, the exit code, and enough output to show WHY.
    CD-RT-003-GRANT-MATRIX-LIVE NEEDS A LIVE STORE and returns exit 3 PRECONDITION_NOT_MET without
    one. It has never been contrasted by anybody on this project — not by the Engineer, not by the
    first auditor, not by the Project Lead. See W5 and SD-3. IT IS YOURS TO CLOSE (CD-D-020), and if
    you cannot, it is UNDECIDABLE and CD-AC-003 CANNOT BE PASS ON THAT TEST. Say so rather than
    passing the criterion on its sibling.

  W3_attack_the_guards_adversarially_THIS_IS_THE_DISPATCH: >
    For EACH of the five criteria, devise and run VARIANT PLANTS OF YOUR OWN that violate the same
    PROPOSITION by a route NOT IN THE EXCLUSION SET, and report whether each guard catches the CLASS
    or only the instance (adversarial theme GUARD_THE_INSTANCE_NOT_THE_CLASS). At least two fresh
    variants per criterion; more where the structure invites it.
    THE EXCLUSION SET IS DEFINED BELOW AND IS LARGE. A variant that duplicates one of its members
    proves nothing new and costs you gate time — but DO NOT let its size deter you from an obvious
    route: if you independently arrive at an attack that turns out to be in the set, that is worth a
    sentence in the verdict, because independent rediscovery is evidence about the corpus.
    WHAT THE REWORK CLAIMS, so you know what to aim at. Each is CLOSED AS A CLASS *subject to you*:
      - CD-ASR-F02/F03 (increment 1): the question moved from "is this member numeric?" to "is this
        member DECLARED?", decided by SET EQUALITY in both directions at import, and the absence
        post-condition left the function body. Rule F denies by default over ONE declared permitted
        provenance. ATTACK: an undeclared provenance that is not a number and not a spelling.
      - CD-ASR-F01 (increment 2b): the closure moved from the EXIT to the RE-ENTRY. A DialMagnitude
        admits a DeclaredQuantity and nothing else — a finite float paired with the frozenset of
        dials its derivation touched, compared by SET EQUALITY. Any float that has left a magnitude
        by ANY route has lost its dials and cannot re-enter. RULE 4 denies by default over four
        declared admission sites. ATTACK: a FIFTH admission site, or a route that never leaves.
        NOTE THE DECLARED RESIDUE: object.__setattr__ on a constructed value is declared NOT PROVED
        TO BE CARRIED ANYWHERE AT RUNTIME (boundary 7 / boundary B). Hitting it confirms a declared
        limit rather than breaking a claim — which is still worth reporting, with that label.
      - CD-ASR-F04 (increments 3 and 3b): deny-by-default over a declared destination registry, and
        `pending` closed FROM ITS OWN MEANING — a pending entry is the record of an ABSENCE, so its
        key set is closed BY EQUALITY and no field can hold a destination. ATTACK: a destination
        that is neither a value in a closed key set nor a registry entry. Boundary 7 declares an
        address in pending PROSE is not refused; V29a is its executable example.
      - CD-ASR-F05 (increment 4): the walk root set is a UNION of roots DERIVED from the container's
        own entrypoint set plus the engine package. ATTACK: a service that reaches witness code from
        a root the derivation does not produce. PL-U6b did this once and is now refused; boundary 5
        distinguishes services BY PURPOSE while the code distinguishes BY NAME (CD-PL-F62, closed at
        increment 6 by DECLARATION).
      - CD-ASR-F06 (increment 5): the closure is NOT the ceiling. FreshnessEvidence makes the age
        comparison the ACT OF CONSTRUCTING the evidence, and agreement requires the evidence, so a
        route that skips the comparison does not exist rather than being caught. The 900.0s ceiling
        is DERIVED from PID §5's ratified 15-minute budget and written as a CEILING, NOT A SETTING.
        ATTACK: agreement without evidence, or a THIRD comparison site.
    Where a guard catches only the instance, that is a FINDING with a severity, not a footnote.
    Where it catches the class, say so — a guard proved to bite is worth recording as proved.

