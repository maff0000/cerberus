  W6_the_declared_limits_are_themselves_a_deliverable: >
    CD-RULE-004 permits a guard to CLOSE ITS CLASS **or** DECLARE ITS OWN LIMIT. Six of the nine
    guards discharge part of their obligation by DECLARATION, so the declarations are load-bearing
