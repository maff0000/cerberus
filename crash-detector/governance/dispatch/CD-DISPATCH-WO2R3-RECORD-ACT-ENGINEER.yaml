    both outputs in your return. A resolution check that has only ever seen resolvable ids, a
    closed-set check that has only ever seen members, a derivation that has never gone UNDECLARED —
    each of those is a check with no evidence that it checks.
  the_rename_test: >
    For any refusal credited to a STRUCTURE: does it survive renaming one identifier? Apply it to
    the redrafted word's `gates` check and report the result whichever way it falls.
  runtime_claims_need_runtime_proof: >
    "Resolves", "refuses", "derives" are RUNTIME claims. A static reading is not proof of one.
    **EVERY ESCAPE ON THIS PROJECT'S RECORD PASSED STATIC CHECKERS.**
  and_read_the_tree_line_every_time: >
