items:

- id: ITEM_1
  title: THE MINIMAL FINDINGS REGISTER — and it is FIRST because the other two resolve against it.
  ruling: >
    PO-DECISIONS-0014 ruling 1, verbatim — *"A MINIMAL findings register is created in the same act
    — id, raised_at (boundary SHA), status (OPEN / CLOSED / SUPERSEDED), nothing else — and
    `DEFECT_OPEN.finding` resolves against it or the row refuses. An index, not a system."*
  what: >
    ONE file. THREE fields per row. **`nothing else` IS PART OF THE RULING AND NOT A STYLE NOTE** —
    no title, no severity, no description, no owner, no date-in-prose. A findings register that
    carries prose becomes the hand-maintained summary it was created to stop, and this project has
    met that defect twice already (CD-PL-F86, and the `DEFECT_OPEN.finding` gap that produced this
    ruling). The finding's SUBSTANCE lives in the document that raised it. This index answers ONE
    question: does this id exist, and is it open?
  the_rows: >
    FOUR, from `governance/engineering/CD-THE-FIFTEEN-AND-THE-REDRAFT.md` §2 — CD-F-0001 (fifth
    seat T8 Category A), CD-F-0002 (sixth seat F-06-R), CD-F-0003 (sixth seat F-06-D as corrected in
    the WORSE direction by CD-PL-F103), CD-F-0004 (CD-PL-F104, raised at the issuing boundary).
    **ALL FOUR `OPEN`. NONE IS CLOSED BY THIS ACT OR BY ANY ACT YET SCHEDULED.**
  resolve_the_shas_yourself: >
    The content document claims `raised_at: af2accb` for all four. **RESOLVE EACH WITH
    `git rev-parse` AND CONFIRM A COMMIT OBJECT WITH `git cat-file -t`. NEVER TRANSCRIBE**
    (CD-PL-F36). If a full SHA does not resolve, that is a STOP and a finding, not a shrug.
  where_it_lives: >
    **YOURS TO CHOOSE, SUBJECT TO TWO CONSTRAINTS THAT ARE NOT YOURS.** (a) The sweep must resolve
    it **with no PYTHONPATH, no installed package and no wrapper, from a bare `git archive`
    extraction an auditor made itself** (PBG-ASSURE-001) — the constraint `_load_register` already
    meets for the sibling register. (b) It is ONE file and it carries the three fields and nothing
    else. **THE PROJECT LEAD'S PREFERENCE, WHICH IS EVIDENCE AND NOT A DESIGN: a sibling data module
    loaded exactly as `declared_dispositions.py` is loaded today. YOU ARE NOT OBLIGED TO ADOPT ITS
    SHAPE, AND IF A GOVERNANCE-DIRECTORY LOCATION IS RIGHTER, SAY SO AND TAKE IT.**
  the_carrier: >
    A test that a `DEFECT_OPEN` row naming an id **absent** from the register REFUSES, and a test
    that a row naming a **`CLOSED`** id refuses. **BOTH ARMS. A resolution check that only ever sees
    ids that resolve has never been shown to resolve anything.**

- id: ITEM_2
  title: THE REDRAFTED `UPSTREAM_OF_THE_PATH` — the contract, bound to the SITE register.
  ruling: >
    PO-DECISIONS-0014 ruling 1 — *"REJECTED AS DRAFTED, for exactly the reasons its own author
    measured: it binds the module register where its siblings bind the site register, and its fields
    are prose no machine can check. It is REDRAFTED to bind the SITE register with machine-checkable
    fields."*
  what: >
    `governance/engineering/CD-THE-FIFTEEN-AND-THE-REDRAFT.md` §1 is the specification. In outline,
    and read the document for the whole of it: the word is REMOVED from what
    `DECLARED_MODULE_DISPOSITIONS` may carry and admitted only in `DECLARED_ADMISSIONS`; its
    mandatory fields become `operand_origin` (**membership in a CLOSED set the instrument owns** —
    `SOURCE_DECLARATION` / `MODULE_CONSTANT` / `OWN_CONSTRUCTION` / `CALLER_SUPPLIED`) and `gates`
    (**a SITE KEY that must EXIST in the sweep's own measured site set and must be in a DIFFERENT
    module**); and if `operand_origin` is `CALLER_SUPPLIED` the row MUST also carry a `finding` that
    resolves `OPEN` in ITEM 1's register **or it refuses**.
  and_the_module_entries_are_DERIVED: >
    A module in the closure is DECLARED when EITHER it carries a `DECLARED_MODULE_DISPOSITIONS`
    entry in one of the original five words, OR **every one of its tier-2 sites carries a site
    entry**. `crash_detector.admission` and `crash_detector.establishment` take the second route and
    **get no module-level prose claim at all.** The instrument DERIVES the module answer from the
    site register; it does not accept a sentence about it.
  the_price_is_disclosed_not_discovered: >
    PL-MEASURED at `af2accb` from the sweep's own per-module output: `crash_detector.admission` **33**
    tier-2 occurrences, `crash_detector.establishment` **17**. Those collapse to some SMALLER number
    of distinct site keys because the register declares the EXPRESSION and not each occurrence.
    **THE PROJECT LEAD HAS NOT MEASURED THE KEY COUNT AND DOES NOT QUOTE 50 AS A ROW COUNT. MEASURE
    IT FIRST, BEFORE YOU WRITE A SINGLE ROW, AND REPORT IT.**
  the_stop: >
    **IF THE LITERAL READING IS UNBUILDABLE OR WRONG, STOP AND RETURN — DO NOT ENGINEER AROUND IT.**
    §1.4 of the content document names the cheaper reading the Project Lead did NOT take and says it
    can be taken in one sentence. A `STOPPED_AT_ITEM_2` return carrying the reason is a SUCCESS and
    will be put to the Product Owner as a question, not held against you.
  the_carriers: >
    For EACH machine check, an arm that PASSES and an arm that REFUSES: a `gates` key that does not
    exist; a `gates` key in the SAME module as the declaring site; an `operand_origin` outside the
    closed set; a `CALLER_SUPPLIED` row with no `finding`; a `CALLER_SUPPLIED` row whose finding does
    not resolve. **AND the derivation: remove ONE tier-2 site entry from a derived module and the
    module must go UNDECLARED again.** A derivation that cannot be made to fail has not been shown to
    derive anything.

- id: ITEM_3
  title: THE FIFTEEN DISPOSITIONS, written into the register.
  ruling: >
    PO-DECISIONS-0015 ruling 4 — *"THE ONE ACT DISPOSITIONS FIFTEEN, NOT ELEVEN … the instrument's
    count beats the ruling's prose … Category C's six sites are RE-DISPOSITIONED: their stated
    ground is falsified by CD-PL-F103, and a disposition whose reason has died does not survive on
    habit."*
  what: >
    Write the fifteen from `governance/engineering/CD-THE-FIFTEEN-AND-THE-REDRAFT.md` §3 into
    `tools/sweep/declared_dispositions.py`: **1 `DEFECT_OPEN`** (Category A, unchanged) · **3
    `CARRIER_ONLY`** (Category B, unchanged, already ratified) · **6 `DEFECT_OPEN`** (Category C,
    REVERSED from the draft's `OUT_OF_BOUND`) · **3 `DEFECT_OPEN`** (the `establishment` sites, read
    for the first time at the issuing boundary) · **2 modules** cleared by ITEM 2's derivation.
    **`OUT_OF_BOUND` COUNT AFTER THIS ACT: ZERO.**
  the_evidence_fields_are_not_decoration: >
    Every `DEFECT_OPEN` row carries `finding`, `measured_reach` and `counterfactual`, and the
    contract already REFUSES a row whose mandatory evidence is absent or empty. **THE FIELD TEXTS IN
    §3 ARE THE PROJECT LEAD'S CLAIMS. YOU ARE REQUIRED TO RE-MEASURE THE ONES THAT ARE MEASUREMENTS
    AND TO REPORT ANY DISAGREEMENT AS A FINDING** — particularly the `establishment` three, which
    rest on a probe run by the seat that dispatched you.
  what_it_must_NOT_do: >
    **IT MUST NOT MAKE THE SWEEP GREEN AS A GOAL.** If declaring all fifteen happens to take the
    sweep to EXIT 0, that is an ARITHMETIC CONSEQUENCE of every violation now being declared, and it
    is **NOT** evidence that anything is fixed. **TEN `DEFECT_OPEN` ROWS IS A REGISTER HONESTLY
    DESCRIBING A SYSTEM WITH TEN OPEN DEFECTS.** Say so in your return, in those terms, and do not
    let a zero exit code do the talking. A green exit here would be the single most misreadable
    number this project has produced and you are the seat that has to label it.
  and_the_thing_you_may_not_do_at_all: >
    **DO NOT FIX ANY OF THE FIFTEEN.** Not Category A's `__qualname__`. Not Category C's six. Not
    `establishment`'s `is_dataclass` gate. **NOT ONE LINE UNDER `src/`.** Their remediation is
    sequenced elsewhere and some of it is not yet authorised by anyone. Fixing a defect you were sent
    to RECORD destroys the evidence the seventh Assurance seat is being sent to attack.

