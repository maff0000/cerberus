- id: ITEM_1
  title: THE `CD-ASR-F03` REDESIGN. `guarded` IS A DOOR. FIRST, AND IT IS THE INCREMENT.
  ruling_verbatim: >
    PO-DECISIONS-0015 ruling 1 — *"`guarded` becomes a DOOR, and CD-ASR-F03 is REDESIGNED, not
    repaired. The acceptance properties (design-how is the Engineer's): (a) **no undecorated
    evaluator object exists at runtime** — the guard and the guarded are inseparable, and a wrapper
    that keeps the naked callable alive in a closure cell is the defect class, not an implementation
    choice; (b) the door's establishment is DERIVED FROM THE SIGNATURE, preserving the property the
    old net's open arity existed for — the guard survives arity growth because it derives, not
    because it gapes; (c) the CD-ASR-F03 post-condition is retained inside the same mechanism. And
    the doors criterion is redesigned to the same truth ground 1 named: membership moves on REAL
    PUBLIC BINDINGS AND MEASURED REACH, never on an underscore."*
  the_three_acceptance_properties_are_the_specification_and_the_design_is_YOURS: >
    **THIS DISPATCH NAMES NO IMPLEMENTATION AND WILL NOT.** PBG-AUTH-006: direction is not design.
    The properties are (a), (b) and (c) above, plus the criterion change. **HOW is entirely yours.**
  what_property_a_ACTUALLY_DEMANDS_said_plainly: >
    **THE MEASURED ATTACK IS: OBTAIN THE MODULE FROM `sys.modules`, REACH THE WRAPPER, AND PULL THE
    NAKED CALLABLE OUT OF ITS `__closure__`.** A redesign that leaves an undecorated evaluator alive
    in a cell and merely makes it harder to name **HAS NOT MET (a)** — the ruling calls that the
    DEFECT CLASS in terms. **YOUR CARRIER MUST BE THE ATTACK ITSELF**: a test that walks
    `__closure__` (and `__wrapped__`, and `__globals__`, and the module namespace) and asserts that
    what it finds cannot be called to reach the judgement without establishment. **A CARRIER THAT
    ONLY CHECKS THE DECORATOR IS PRESENT TESTS THE WRAPPER, NOT THE PROPERTY.**
  what_property_b_ACTUALLY_DEMANDS: >
    The old net had OPEN ARITY for a reason — it survived new parameters arriving. **A door with a
    hand-written parameter list loses that and gains a silent hole the day somebody adds an
    argument.** (b) says the establishment is **DERIVED FROM THE SIGNATURE** so the property is kept
    *by derivation*. **CARRIER: ADD A PARAMETER AND SHOW THE GUARD STILL COVERS IT, WITHOUT ANYONE
    EDITING THE GUARD.** That contrast is the whole of (b) and a redesign without it is unproven.
  the_criterion_half: >
    `check_judgement_path_doors.py`'s reachability clause currently **moves on an underscore** — that
    is Ground 1, and it is measured. It must move on **REAL PUBLIC BINDINGS AND MEASURED REACH.**
    **AND SEE `F-06-K`, WHICH IS ITEM 5 BELOW AND CONVERGES HERE:** `_module_bindings` cannot see a
    module-level binding written inside any block, so *"real public binding"* computed by that
    function is already wrong before you start. **DO ITEM 5 FIRST IF YOU FIND THEY COLLIDE, AND SAY
    SO — the order is the Product Owner's but a measured dependency between two items is a finding,
    not a licence.**
  the_declared_STOP: >
    **IF THE REDESIGN CANNOT MEET (a) WITHOUT AN EXEMPTION OR A WEAKENING, STOP AND RETURN.**
    PO-DECISIONS-0012 ruling 3 forbids both routes and that prohibition did not fall with ruling 1.
    A `STOPPED_AT_ITEM_1` return carrying the reason is a **SUCCESS**.

