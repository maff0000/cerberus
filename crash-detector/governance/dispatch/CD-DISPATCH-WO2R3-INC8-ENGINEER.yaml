  title: 'GROUND 3 / ESCAPE 3 — LIVE, UNMOVED AND UNDECLARED. THE FIFTH SEAT''S ITEM (a), UNTAKEN AFTER TWO GATES.'
  the_measured_escape: >
    A sink that does `object.__setattr__` on the `OK` it was handed **rewrites the outcome the
    collector then reads.** Identity confirmed: the `OK` handed to the sink and the `OK` on
    `CollectionResult` are the **SAME OBJECT**; normal setattr is refused (`FrozenInstanceError`) and
    `object.__setattr__` succeeds. `_record` is called inside a `finally:` at line 580 and
    `_reading_key` at 606 — **the read happens after the sink has run.** CONTROL: payload
    `{'reading': 0.25}`, key `('src.h','2026-08-22T11:59:59Z')`. ESCAPE: payload `{'reading': 999.0}`,
    `as_of` `2000-01-01`, **the ledger is asked for a key naming a period NO ROW RECORDS and answers
    `admitted`.** The sink returns `None` throughout so `_record`'s contract check is satisfied and
    **nothing refuses.** ARM5: the stored payload then **fails the schema it was judged by**, while
    the original passes it — so the failure is caused by the rewrite, not by a bad schema.
  the_two_shapes_the_auditor_named: >
    **Snapshot the outcome before `_record`, OR derive the reading key from the recorded row.**
    Either is acceptable; the choice and its reasoning are yours and belong in your return.
