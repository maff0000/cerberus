  the_ceiling_is_part_of_the_rule: >
    **DO NOT WRITE 0100 OR ABOVE.** main holds 0100-0199 and 0001-0059 is CLOSED to both parties
    (CD-D-132). If you reach 0099, STOP and escalate rather than counting on. CD-PL-F89 is why this
    is a RANGE and not a floor: a one-sided bound produced THIRTEEN landed collisions.
  timestamps: 'From `date -u` and from nothing else (CD-RULE-005). New entries only (PBG-CONT-003).'

commit_identity:
  rule: >
    Commit as you go, one commit per item. **EVERY COMMIT CARRIES THE BLOCK BELOW, FILLED IN. A
    commit without it is not accepted at reconciliation, however good the code is** (PO standing
    condition). Fields that do not apply are answered N/A WITH A REASON.
  the_block: |
    item: <ITEM_n>
    what_changed_in_the_code_path: <not the header text — the code path>
    the_contrast_that_proves_it: <command, both arms, both results>
    what_this_does_NOT_close: <the residue, MEASURED>
    instruments_run_and_their_exit_codes: <yours, not this dispatch's>
    findings_against_my_own_work: <or the word NONE, which is a claim>

proof_standard:
  runtime_claims_need_runtime_proof: >
    *"Unreachable"*, *"cannot be called"*, *"not importable"*, *"no undecorated evaluator exists"* are
    **RUNTIME claims and ITEM 1 IS ENTIRELY MADE OF THEM.** A static reading is not proof of one.
    **EVERY ESCAPE ON THIS PROJECT'S RECORD PASSED STATIC CHECKERS.**
  the_rename_test: >
    For any refusal credited to a STRUCTURE: does it survive renaming one identifier? **APPLY IT TO
    YOUR OWN ITEM 1 CRITERION AND REPORT THE RESULT WHICHEVER WAY IT FALLS.** The previous act's
    `gates` field failed this test and its author reported it — that is the standard.
  the_counterfactual_arm_CD_D_079: 'For every refusal credited to a structure, show the arm WITHOUT that structure failing to refuse.'
  the_CD_ENG_WO2R3_F12_standard: >
    **A PLANT IS EVIDENCE WHEN IT APPLIES, CONTRASTS, *AND FAILS AT THE LAYER ITS PROPOSITION NAMES*
    — never merely when it exits non-zero.** Two arms exiting 1 for different reasons look identical
    in a summary table and prove nothing.
  and_read_the_tree_line_every_time: >
    CD-PL-F98: two arms of a probe once resolved their import root from `__file__` and **BOTH ARMS
    IMPORTED THE SAME TREE**, printing identical output. **THE PROJECT LEAD VERY NEARLY REPEATED IT
    AT THE PREVIOUS BOUNDARY** — a compound shell command left an earlier `cd` in effect and the arm
    labelled "live worktree" read the clone and returned the reassuring answer. **IT WAS CAUGHT BY
    READING THE `pwd` LINE INSTEAD OF THE VERDICT LINE. RUN EACH TREE'S OWN COPY AND PRINT THE TREE
    EVERY TIME.**

return_contract:
  expected_return: READY_FOR_ASSURANCE
  and_the_other_acceptable_return: >
    **`STOPPED_AT_ITEM_n` — AND IT IS NOT A FAILURE.** Item 1 has a declared stop. Any item whose
    contrast cannot be built is a stop and a finding. **RETURNING THAT WITH THE EVIDENCE IS THE
    SINGLE MOST VALUABLE THING A SEAT CAN DO ON THIS PROJECT, AND THE RECORD PROVES IT TWICE.**
  what_your_return_must_carry:
  - 'the exact SHA of every commit you made, and `git status --porcelain` at ZERO lines at the end'
  - '**ITEM 1''s THREE PROPERTIES ANSWERED SEPARATELY**, each with the attack that tests it — and the
     `__closure__` walk for (a) and the added-parameter contrast for (b) quoted in full'
  - '**THE WHOLE REGISTER SET, TWELVE CHECKS, AT BASE AND AT TIP, AS TWO TABLES**'
  - 'per item: what changed in the code path, the contrast with BOTH arms, and the MEASURED residue'
  - '**WHETHER ITEM 5 HAD TO PRECEDE ITEM 1**, measured, and reported as a finding against the adopted
     order if so'
  - '**YOUR VIEW ON THIS DISPATCH, INCLUDING DISAGREEMENT.** It is written by a seat that shipped two
     specification defects in the previous act and was caught by the seat it dispatched.'
  - 'every instrument you ran with its exit code, measured by you'
  - 'findings against your own work — **TEN consecutive seats have done this** and it is the reason
     the record is worth anything'
  - 'anything you could NOT establish, said plainly, with what you ran and what stopped you'
  what_your_return_is_NOT: >
    **NOT AN ACCEPTANCE AND NOT A GRADE** (PBG-AUTH-003, PBG-SOD-001). You do not certify this work. A
    FRESH SEVENTH Assurance seat audits it, and the Product Owner dispositions the gate.

separation_of_duties:
  PBG_SOD_001: 'The Engineer and the Assurance Engineer are never the same agent. Non-waivable.'
  PBG_AUTH_006: 'The Project Lead writes neither the fix nor the assurance. Direction is not design.'
  PBG_AUTH_003: 'A PASS is not an acceptance and neither is a RED. Disposition is the Product Owner''s.'
  PBG_CONT_007: 'A sub-agent result that exists only in conversation is not project state. COMMIT IT.'

expected_next_actor: PROJECT_LEAD
returns_to: >
  The Project Lead reconciles your return **BY MEASUREMENT**, then dispatches the **SEVENTH FRESH
  ASSURANCE SEAT** over the whole of WO-2R3 with CD-D-129's clauses verbatim. **THE PROJECT LEAD WILL
  NOT ARGUE YOUR FINDINGS DOWN OR UP AND HAS NO AUTHORITY TO DO EITHER.** If your measurements
  contradict the reconciliation record, **THE RECORD IS WHAT GETS CORRECTED** — that has now happened
  twice in two boundaries, both times against this seat.
