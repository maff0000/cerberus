  V17: 'variants/WO-2R3/V17-constructor-body-escape.patch — the plant named by the Product Owner.'
  what_it_does: >
    Deletes the `type(spec) is not DialSpec` loop from `ConfigSnapshot.__post_init__` and adds an
    empty `judging/` package.
  its_state_at_your_baseline_PL_MEASURED_AT_ISSUE_TIME_AND_NOT_QUOTED_FROM_THE_RECORD: >
    Pristine extraction of 4ac159e (`git archive 4ac159e | tar -x -C /tmp/cd-v17`), then
    `git apply --check -p1` — APPLIES. Applied, then
    `python3 -B tools/register/check_judgement_path_doors.py --root .` — **EXIT 0, "PASS — 54
    assertions, 0 violations".** THE GUARD IS DELETED AND THE INSTRUMENT SAYS PASS. **THAT IS THE GAP
    AND IT IS THE WHOLE REASON THIS INCREMENT EXISTS.**
  what_you_must_show:
    baseline_arm: 'mechanism present -> the plant is REFUSED. Exception type and message, quoted.'
    violated_arm: >
      mechanism REMOVED -> the escape RETURNS. Not optional and not a formality: it is what
      distinguishes a guard that bites from a test that would pass anyway. Where "remove the
      mechanism" means deleting a type or a decorator, reconstruct the old shape in a THROWAWAY
      extraction and say so.
    the_layer_test_CD_ENG_WO2R3_F12_and_it_is_not_advice: >
      **A PLANT IS EVIDENCE WHEN IT APPLIES, CONTRASTS, *AND FAILS AT THE LAYER ITS PROPOSITION
      NAMES* — NEVER MERELY WHEN IT EXITS NON-ZERO.** This standard exists because of YOUR OWN
      finding against YOUR OWN first attempt at increment 4: a regeneration contrasted 0 -> 1 by
      raising a CD-AC-002 refusal and would have been recorded as a CD-AC-001 catch by anyone reading
      exit codes. READ THE FAILURE TEXT. Name the layer. Do not read the exit code.
    the_counterfactual_arm_CD_D_079: >
      A refusal credited to a structure carries a COUNTERFACTUAL ARM — remove the line or the type you
      credit and show the escape returning — or it says it has none, in those words.
  V17_is_the_floor_of_your_plants_and_not_the_ceiling: >
    V17 attacks ONE type through ONE field. Your mechanism claims a CLASS. **AT LEAST TWO NEW
    VARIANTS OF YOUR OWN, ON ROUTES V17 DOES NOT TAKE**, durable under variants/WO-2R3/ with manifest
    rows — the route, why it is a DIFFERENT route from anything in any corpus, and the refusal
    observed with its layer named. The obvious ones to consider, none of them mandatory and none of
    them sufficient: a NEW public judgement-path type added after your mechanism exists (the
    constructor-level P7 — does it arrive REFUSED or unguarded?); a subclass; a field added to an
    existing type without being declared to the mechanism; and the `__closure__`/attribute-surface
    route your own V24 opened one level up.

