step_1_the_instrument_before_any_mechanism:
  why_first: >
    **IF YOU BUILD THE MECHANISM FIRST, YOUR INSTRUMENT WILL ENUMERATE WHAT YOUR MECHANISM ALREADY
    COVERS.** That is not an enumeration of a class, it is a photograph of your own diff, and it
    would pass every check in this dispatch while proving nothing. The Product Owner ordered the
    enumeration recorded AT INCREMENT-5 START for this reason (CD-D-119).
  what_it_must_do:
  - 'DERIVE ITS SUBJECT FROM THE ARTEFACT, never from a list written into it. The increment-2 doors
     check is the precedent and the shape: it enumerates judgement paths from the tree and PRINTS ITS
     SUBJECT COUNT so a vacuous pass is visible.'
  - 'DEFINE "BODY-BORNE FIELD ESTABLISHMENT" AS A PROPERTY IT CAN TEST, and PRINT THAT DEFINITION in
     its own output. A reader must be able to disagree with the definition without reading the source.'
  - 'PRINT: the subject population, the count, and for each member WHY it is in or out. **A MEMBER
     EXCLUDED SILENTLY IS THE DEFECT THIS INSTRUMENT EXISTS TO PREVENT.**'
  - 'OBEY CD-RULE-004: it closes its class or it DECLARES ITS OWN LIMIT, in the check header, the
     register entry and the execution contract, each with an executable example.'
  - 'OBEY CD-RULE-009: the exact command that produces its count is recorded beside the count, in the
     commit, the Build Log entry and the register.'
  the_number_nobody_may_quote_in_advance: >
    **THE INSTRUMENT DOES NOT EXIST AND NO NUMBER FOR THE CLASS HAS BEEN QUOTED, ESTIMATED OR IMPLIED
    ANYWHERE IN THE RECORD (CD-D-119).** Not by the Product Owner, not by the Project Lead, not in
    ACTIVE_WORK.yaml. If the class turns out to be five members, that is a MEASUREMENT and it is
    fine. If it turns out to be thirty, that is also a measurement and it is also fine. **WHAT IS NOT
    FINE IS AN INSTRUMENT TUNED UNTIL IT RETURNS FIVE.**
  what_to_do_if_the_count_is_uncomfortable: >
    REPORT IT AND STOP, do not narrow the definition. If the instrument enumerates a population you
    cannot close inside this increment, THAT IS AN ESCALATION AND IT IS A VALUABLE ONE — the Project
    Lead would rather have a measured class of thirty with twelve closed and eighteen declared than a
    definition quietly shaved until the work fits. Say which members are closed, which are not, and
    why, and let the Project Lead and the Product Owner rule on the remainder.
  it_will_be_attacked_and_you_know_by_whom: >
    THE FOURTH ASSURANCE SEAT HAS YOUR INSTRUMENT'S OWN ENUMERATION ON ITS NAMED-TARGET LIST — target
    (4), placed there by the Product Owner at PO-DECISIONS-0008 ruling 2 BEFORE YOU BUILT IT. Write
    the definition for that reader. Point at the members you are least sure about and dare them to
    hit it. The seat that did exactly that at increment 2b is the one whose work was accepted.

step_2_the_mechanism:
  the_bound_transcribed_and_not_paraphrased: >
    "the `admits` idea one level down — establishment derived from the DECLARED FIELD LIST, refusing
    what it was not told, applied at the boundary so a body edit cannot remove it" (CD-D-110).
  what_that_rules_in_and_out: >
    IN: derivation from the declared fields, applied where a body rewrite cannot reach it.
    OUT: a body check, however good. **THE WHOLE POINT IS THAT `__post_init__` IS A BODY.** If your
    closure lives in a body, V17's successor deletes it and the class is open again.
  the_two_escapes_this_shape_EXISTS_to_prevent_restated: >
    Both were EDITS TO A BODY — CD-ASR-F03 (an edit to `_evaluate_dial`'s body) and the `*extra`
    fourth argument written to survive one. V17 is the third and it is the same move on a
    constructor. THAT IS WHY DERIVATION MUST HAPPEN AT THE BOUNDARY.
  the_conflicts_that_are_NOT_prototyped_and_you_must_report_rather_than_absorb: >
    Nobody has written this. The increment-2 dispatch warned that deriving establishment from a
    SIGNATURE might conflict with keyword-only arguments, *args, defaults or frozen dataclass
    constructors, and told that seat to REPORT the conflict rather than quietly weaken the rule to
    "annotate what you can". **THE SAME INSTRUCTION APPLIES HERE AND IT APPLIES HARDER**, because a
    DECLARED FIELD LIST has its own hazards the signature did not: inherited fields, `InitVar`,
    `field(default_factory=...)`, `ClassVar`, non-init fields, and `__post_init__` legitimately
    DERIVING a field rather than establishing one. **IF DERIVATION FROM THE DECLARED FIELD LIST
    CONFLICTS WITH SOMETHING REAL, REPORT THE CONFLICT. DO NOT WEAKEN THE RULE AND DO NOT INVENT A
    PRODUCT MEANING TO RESOLVE IT (CD-RULE-003).**
  the_legitimate_body_work_you_must_not_break: >
    Not everything in a `__post_init__` is field establishment. §C.5's three ConfigSnapshot invariants
    include CROSS-FIELD checks — a resolved spec's dial_id EQUALS the dial naming it; its input ids
    are a SUBSET of the naming DialSpec's declared inputs. **A CROSS-FIELD INVARIANT IS NOT
    ESTABLISHMENT OF A FIELD FROM ITS DECLARATION AND CANNOT BE DERIVED FROM ONE.** Decide explicitly
    what your mechanism covers, say so, and DECLARE THE RESIDUE under CD-RULE-004 with CD-RULE-006's
    carrier test applied — MEASURE the layer you claim carries it, or write "NOT PROVED TO BE CARRIED
    ANYWHERE". Do not let a cross-field invariant ride out of scope silently because it was in the
    same body as the fields.

