    Every increment-5 commit MUST carry this block, verbatim in shape, filled in. A commit without it
    is not accepted at reconciliation, however good the code is (PO standing condition).
  template: |
    STRUCTURE DELIVERED: <what now exists that did not before, as a structure. Not a list of edits.>
    STRUCTURAL INVARIANT: <REQUIRED BY THE PO. One sentence, TRUE OF THE SYSTEM after this commit and
                    not before. Test: could an auditor try to REFUTE it by execution? Write it
                    NARROWLY ENOUGH TO BE TRUE — CD-PL-F76 was raised for an invariant stated wider
                    than the closure it described.>
    THE INSTRUMENT: <its command, its printed DEFINITION of body-borne field establishment, the
                    SUBJECT POPULATION and COUNT, and for each member why it is IN or OUT. State
                    whether the count was measured BEFORE the mechanism existed.>
    WHY IT IS A CLASS CLOSURE: <one paragraph. Why can no route reach the violation, rather than none
                    of the routes tried? If the enforcement is a registry or a vocabulary, explain
                    what makes it CLOSED, or admit it is not.>
    THE FLOOR VS THE POPULATION: <are ConfigSnapshot, DialSpec, ModelSpec, PanelRow and AttemptRecord
                    all IN the enumerated class? What ELSE is in it? If the answer is "exactly those
                    five", say so and say WHY the instrument found no others — a floor that happens
                    to equal the population is a finding, not a coincidence.>
    V17: <BASELINE arm (mechanism present -> refused: exception type and message) and VIOLATED arm
                    (mechanism removed -> passes). Both arms, run, quoted. AND THE LAYER: which layer
                    refused it, read from the failure text and not from the exit code.>
    MY OWN VARIANTS (>=2): <one line each: the ROUTE, why it is DIFFERENT from anything in any corpus,
                    and the refusal observed with its layer named.>
    THE RENAME TEST: <for each refusal you rely on: does it survive renaming one identifier? State it.
                    Most of yours SHOULD — a refusal from a declared field list is structural. If one
                    depends on a NAME, you have rebuilt a vocabulary guard; say so.>
    THE COUNTERFACTUAL ARM: <CD-D-079, for every refusal credited to a structure — or the words "no
                    counterfactual".>
    FALSE POSITIVES CHECKED: <what legitimate code still works. A closure that forbids the product is
                    not a closure. Legitimate __post_init__ DERIVATION, cross-field invariants, the
                    empty-registry path rendering Unknown on both dials.>
    DECLARED LIMIT 1: <still printed by the doors instrument? narrowed? gone? QUOTE THE CURRENT TEXT.>
    CLEAN ARM: <the full declared command set> -> exit 0, <N> tests passed.
    NODE-ID RECONCILIATION: <1519 at 4ac159e; count now; N lost with old->new ids named; N replaced;
                    N added. A bare number is not a conservation claim. DIFF THE SETS, do not compare
                    the counts — the Project Lead does, and identical counts have hidden a swap before.>
    ELEVEN PLANTS: <still applying? still contrasting? still failing AT THE RIGHT LAYER? if one was
                    updated, which and why.>
    DECLARED LIMIT (any new): <CD-RULE-004, all three places, executable example. CD-RULE-006: MEASURE
                    the named carrier or write "NOT PROVED TO BE CARRIED ANYWHERE".>

# ================================================================================================== #
# WHAT "PROVED" MEANS HERE — unchanged from the parent dispatch, restated because it bites here
# ================================================================================================== #
proof_standard:
  runtime_properties_need_runtime_proof: >
    "Unconstructible", "structurally incapable", "cannot be admitted" are RUNTIME claims. A static
    checker exiting non-zero is not proof of one — EVERY escape on this project's record passed static
    checkers. WRITE THE PLANT, RUN IT, SHOW THE CONSTRUCTOR OR THE INTERPRETER REFUSING IT, record the
    exception type and message.
  extraction_hygiene: >
    NEVER mutate the worktree to test a variant and NEVER create a git worktree for one. Extract with
    `git archive <sha> | tar -x -C <tmpdir>`, apply with `git apply -p1`, run, discard. A SEPARATE
    PRISTINE EXTRACTION PER VARIANT so no variant contaminates another. `python3 -B` EVERYWHERE so no
    __pycache__ is written into any governed tree (PBG-RT-001 — mutation by EFFECT, not by label).
  generate_patches_with_git_diff: >
    CD-ENG-WO2R-F13, adopted: hand-written hunks get silently truncated by `git apply`. Generate every
    patch with `git diff`.

