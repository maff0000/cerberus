  correct_what_you_break_and_nothing_else: >
    Every declaration your closure invalidates, corrected in ALL THREE CD-RULE-004 places, each with
    an executable example. Correcting a boundary YOU broke is part of closing the class; going looking
    for boundaries you did not break is scope creep.
  CD_RULE_006_on_every_new_declaration: >
    A residue declaration naming another layer as carrying it MUST have MEASURED that layer refusing
