  LIST, AND NOTHING ELSE.

    THE CLASS — every public type in the frozen subject, on a judgement path, whose field
                establishment is BODY-BORNE.
    THE FLOOR — `ConfigSnapshot`, `DialSpec`, `ModelSpec`, `PanelRow`, `AttemptRecord`.
