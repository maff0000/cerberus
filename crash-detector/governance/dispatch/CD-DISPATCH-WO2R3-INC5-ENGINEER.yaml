  DECLARED_LIMIT_1_is_the_one_you_are_here_to_kill: >
    The instrument PRINTS IT TODAY: "DECLARED LIMIT 1 — CONSTRUCTORS ARE NOT SUBJECTS. ConfigSnapshot,
    DialSpec, ModelSpec and PanelRow establish their fields in __post_init__, which is a BODY. §D.2
    lists no constructor and this check does not invent that scope." PL-MEASURED AT ISSUE TIME in the
