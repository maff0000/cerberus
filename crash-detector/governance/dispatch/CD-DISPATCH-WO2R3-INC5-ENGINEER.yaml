    THE MECHANISM — "the `admits` idea one level down: establishment derived from the DECLARED FIELD
                LIST, refusing what it was not told, APPLIED AT THE BOUNDARY SO A BODY EDIT CANNOT
                REMOVE IT." (CD-D-110, transcribed and not paraphrased.)
    THE PLANT — V17, in BASELINE and VIOLATED arms.
    OUT — the three interpreter-borne refusals. A keyword for a field that does not exist has NO
                BODY, nothing to edit, and is outside this finding. Ruled at PO-DECISIONS-0007 in
                terms, on the Project Lead's own asymmetry measurement.

  Done means: the INSTRUMENT built and run FIRST with its command and count recorded (CD-RULE-009);
  the mechanism delivered and derived from the declared field list at the boundary; V17 shown in both
  arms; the clean arm green with no test node id lost against the MEASURED 1519; the eleven declared
  plants still applying and still contrasting and still failing at the layer their proposition names;
