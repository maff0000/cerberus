    closure and every run prints them. That none of them decides staleness, agreement or
    reading-ness is A CLAIM ABOUT THIS SHA MADE BY READING THEM. Read them yourself.
- id: RW-3
  title: 'CD-PL-F76 — GRADE CD-AC-005 AGAINST WHAT THE CLOSURE ACTUALLY HOLDS, NOT AGAINST THE INVARIANT AS WRITTEN.'
  why: >
    The structural invariant in commit 27e3794 says "No method defined by a caller-supplied class
    executes during the computation of an age". The increment's OWN CD-ENG-WO2R2-F04 is the
    counterexample and the Project Lead replicated it: a caller-supplied `tzinfo` — no subclass
