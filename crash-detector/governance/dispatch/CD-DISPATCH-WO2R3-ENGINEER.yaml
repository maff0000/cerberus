  - 'the structural invariant as landed for each increment, and whether the class is CLOSED or CLOSED IN PART'
  - 'all EIGHT plants with both arms, and confirmation that every one ran over EMPTY_MODEL_REGISTRY'
  - 'ASR3-F02, F04 and F05 each with its refusal AND THE REFUSING LAYER AND ITS SCOPE'
  - 'the rename-test result for every refusal you rely on'
  - 'the counterfactual arm for every refusal credited to a structure (CD-D-079), or the words "no counterfactual"'
  - 'your own new variants, durable, with manifest rows'
  - 'the clean arm numbers and the FULL node-id reconciliation against 1400'
  - 'every declared limit you wrote or corrected, and for each, the carrier MEASURED or the words
     "NOT PROVED TO BE CARRIED ANYWHERE"'
  - 'ANYTHING YOU COULD NOT CLOSE, said plainly. An honest NOT CLOSED is an acceptable return. A
     silence is not, and a guard built over a structural impossibility is worse than either.'
  a_build_log_entry_per_increment: >
    In the lane, under governance/engineering/build-log/, sequence continuing from the lane's last
    entry and taking a RESERVED BLOCK FROM 0060 UP (CD-D-036: a seat in a lane worktree can only see
    the branch-point copy of the build-log directory, so lane and main sequences collide unless the
    lane takes its own block; main continues from 0049). Timestamps from `date -u` and from nothing
    else (CD-RULE-005 — a lane entry was once stamped with local time carrying a Z suffix). New
    entries only, never an edit (PBG-CONT-003, non-waivable).
  what_happens_next_and_why_you_should_care: >
    Your return goes to a FOURTH FRESH ASSURANCE SEAT — none of CD-ASR-WO2-01, CD-ASR-WO2-02,
    CD-ASR-WO2R2-01, and no Engineer seat (PBG-SOD-001, non-waivable). THE PRODUCT OWNER HAS ALREADY
    GIVEN THAT SEAT ITS FIRST TWO TARGETS: **P7** (ruling 1 — "the fourth Assurance seat is directed
    to run it first") and **CD-BP-003, the adapter boundary** (ruling 4 — "the fourth Assurance seat's
    first target"). You know where it will look before it looks. Build accordingly, and do not build a
    façade in front of either.

