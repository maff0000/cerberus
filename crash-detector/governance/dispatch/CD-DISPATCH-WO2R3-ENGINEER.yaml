# ================================================================================================== #
# THE MANDATORY COMMIT BLOCK — mechanically checkable
# ================================================================================================== #
commit_message_contract:
  requirement: >
    Every increment commit MUST carry this block, verbatim in shape, filled in. A commit without it
    is not accepted at reconciliation.
  template: |
    STRUCTURE DELIVERED: <what now exists that did not before, as a structure — a type, a closed
                    enum, an absent field, a decorator applied at a boundary. Not a list of edits.>
    STRUCTURAL INVARIANT: <REQUIRED BY THE PO. One sentence, stating a property that is TRUE OF THE
                    SYSTEM after this commit and was not before. Test: could an auditor try to
                    REFUTE this sentence by execution? If not, it is a summary, not an invariant.
                    Write it NARROWLY ENOUGH TO BE TRUE — CD-PL-F76 was raised because an invariant
                    was stated wider than the closure it described.>
    WHY IT IS A CLASS CLOSURE: <one paragraph. Why can no route reach the violation, rather than
                    none of the routes tried? If the enforcement is a registry or a vocabulary, this
                    paragraph must explain what makes the REGISTRY closed, or admit it is not.>
    PLANTS IN THIS INCREMENT: <which of P1..P8, each with BASELINE arm (guard present -> refused,
                    exception type and message) and VIOLATED arm (guard removed -> passes). Both
                    arms, run, quoted. A guard nobody has seen refuse is a rumour and a guard
                    nobody has seen FAIL to refuse is an untested one.>
    ALL PLANTS OVER EMPTY_MODEL_REGISTRY: <yes/no, and if any plant needed a registered row, SAY SO
                    LOUDLY — it would contradict the PO's standing condition.>
    AUDITOR VARIANTS RE-RUN: <ASR3-ids> -> each REFUSED, WITH THE REFUSING LAYER NAMED AND SCOPED
                    (CD_PL_F74_ADOPTED), and the observed exception type and message.
    EXCLUSION-SET REGRESSION: <which prior variants were re-run and their outcomes. No regression.>
    NEW VARIANTS (>=2, mine): <one line each: the ROUTE, why it is a DIFFERENT route from anything
                    in any corpus, and the refusal observed with its layer named.>
    THE RENAME TEST: <for each refusal above: does it survive renaming one identifier? State it.>
    FALSE POSITIVES CHECKED: <what legitimate code you confirmed still works. A closure that forbids
                    the product is not a closure. Same-dial computation, ordinary datetimes, the
                    empty-registry path rendering Unknown on both dials.>
    CLEAN ARM:     <the full declared command set> -> exit 0, <N> assertions / <N> tests passed.
    NODE-ID RECONCILIATION: <1400 at f30e63c; count now; N lost to deleted subjects with old->new
                    ids named; N replaced; N added. A bare number is not a conservation claim.>
    ELEVEN PLANTS: <still applying? still contrasting? if a plant was updated, which and why.>
    DECLARED LIMIT (if any): <CD-RULE-004, in all three places, with an executable example.
                    CD-RULE-006: a named carrier is a CLAIM and needs its own executed evidence —
                    MEASURE IT or write "NOT PROVED TO BE CARRIED ANYWHERE".>

# ================================================================================================== #
# WHAT "PROVED" MEANS HERE
# ================================================================================================== #
proof_standard:
  runtime_properties_need_runtime_proof: >
    "Unconstructible", "structurally incapable", "cannot be admitted" are RUNTIME claims. A static
    checker exiting non-zero is not proof of one, because every escape on this project's record
    passed static checkers. WRITE THE PLANT, RUN IT, SHOW THE INTERPRETER OR THE CONSTRUCTOR REFUSING
    IT, and record the exception type and message.
  the_contrast_is_mandatory_in_both_directions: >
    Every plant gets a BASELINE arm (structure present -> refuses) and a VIOLATED arm (structure
    removed -> passes). The violated arm is not optional and is not a formality: it is what
    distinguishes a guard that bites from a test that would pass anyway. Where "remove the structure"
    means deleting a type, the violated arm may reconstruct the OLD shape in a throwaway extraction —
    say so and show it.
  extraction_hygiene: >
    NEVER mutate the worktree to test a variant and NEVER create a git worktree for one. Extract with
    `git archive <sha> | tar -x -C <tmpdir>`, apply with `git apply -p1`, run, discard. A separate
    pristine extraction per variant so no variant contaminates another. Use `python3 -B` everywhere so
    no __pycache__ is written into any governed tree (PBG-RT-001 — mutation by EFFECT, not by label).
  generate_patches_with_git_diff: >
    CD-ENG-WO2R-F13, adopted: hand-written hunks get silently truncated by `git apply` and six
    variants once briefly failed FOR THE WRONG REASON. Generate every patch with `git diff`.
  the_counterfactual_arm: >
    CD-D-079, standing: a refusal credited to a structure carries a COUNTERFACTUAL ARM — remove the
    line or the type you credit and show the escape returning — or it says it has none. A true
    observation from which a false inference follows is the exact shape that rule exists to stop.

# ================================================================================================== #
# THE INCREMENTS — FOUR, EACH COMMITTED WHOLE
# ================================================================================================== #
increment_discipline:
  why_four_and_not_one: >
    SEVEN RUNTIME TERMINATIONS have killed seats mid-work on this project. One died having completed
    four commits' worth of work and a 636-line Build Log entry that no committed record knew existed.
    COMMIT AS YOU GO. An increment that is committed survives you; one that is not, did not happen
    (PBG-CONT-007). If you die inside increment 2, increment 1 must still stand on its own.
  the_PO_named_this_as_the_price_of_scope: >
    "The material enlargement of WO-2R3 is a cost accepted here and PAID WITH THE PROJECT LEAD'S
    INCREMENT DISCIPLINE, not with a scope cut." Four increments IS that payment. Do not merge them.
  each_increment_is: 'code + its plants + its Build Log entry, committed together, clean arm green.'

increment_1_models_are_data:
  scope: 'BP-AMENDMENT-0001 §C in full — C.1 through C.6, and C.2.1.'
  deliver:
  - 'DELETE `ContributionModel` (the Protocol) and `CONTRIBUTION_MODELS` (the dict). Deleted, not
     repaired — amendment §C.2. There is no deprecation path and nothing re-exports them.'
  - '`ModelId` — a name, established on its own terms (own_str), like every other id in this codebase.'
  - '`MappingKind` — a CLOSED enum with EXACTLY ONE MEMBER, `UNSPECIFIED`, which computes nothing.
     Its executor branch RAISES `UnspecifiedMapping` — a named error — AND RETURNS NOTHING. No else,
     no fallthrough, no numeric return anywhere on that path. (PO-DECISIONS-0005 ruling 2; the names
     are fixed by the Project Lead at CD-D-090 and are not yours to change.)'
  - '`ModelSpec` — FROZEN DATA, NO CALLABLES, no methods that compute: model_id, dial_id (one of
     DIAL_IDS — this is what binds a model to ONE dial), required_input_ids, contributing_input_ids,
     mapping (a MappingKind, a NAME not a function), parameters (numbers, from config), provenance
     (ModelProvenance — SHAPE is yours, CONTENTS are CD-D-005''s and are not invented here).'
  - '`ModelRegistry` — frozen mapping ModelId -> ModelSpec, exact-typed like SourceRegistry, REQUIRED
     on the ConfigSnapshot WITH NO DEFAULT. A registry nobody chose is not evidence of anything.'
  - '`DialSpec.model_ref: ModelId | None` REPLACING `contribution_model`. A reference, not an object.
     THE FIELD THAT HELD AN OBJECT MUST NOT EXIST.'
  - 'Three ConfigSnapshot invariants (§C.5): (1) every model_ref RESOLVES; (2) a resolved spec''s
     dial_id EQUALS the dial naming it; (3) a resolved spec''s input ids are a SUBSET of the naming
     DialSpec''s declared inputs, each registered in the SourceRegistry with an agreeing criticality.'
  - '`engine.mapping.compute(spec: ModelSpec, payloads) -> ScoreComputation` — the executor. Dispatches
     on spec.mapping over payload values THE ENGINE RELEASED. Holds no state between dials or between
     runs. Takes ONE dial''s spec and ONE dial''s payloads and cannot span two. ScoreComputation
     survives unchanged — contributions are still required.'
  - '`EMPTY_MODEL_REGISTRY` — zero rows — shipped, joining EMPTY_SOURCE_REGISTRY.'
  plants: 'P1, P2, P3, P4, P8 — each in baseline/violated contrast form, ALL over EMPTY_MODEL_REGISTRY.'
  the_precedent_you_are_following_and_it_is_this_codebase_own: >
    `combine_within_one_dial`. Until increment 1 of WO-2R its `using` argument received a tuple of
    released floats and returned one, and it passed that return straight into the derivation door —
    which made it the public proxy through which ASR2-002-A published an equity 0.5 out of an equity
    0.9 and a monetary 0.1 with every static layer green. THE REPAIR WAS NOT A STRONGER CHECK ON THE
    CALLABLE. It was DELETING THE CALLABLE ARGUMENT and replacing it with a NAME from a closed set,
    executed by the module that owns the numbers. ASR3-F02 is the identical defect one level up,
    wearing a Protocol instead of a lambda. YOU ARE APPLYING THIS PROJECT'S OWN STRONGEST EXISTING
    CLOSURE TO THE BOUNDARY THAT NEVER HAD IT. Read `combine_within_one_dial` before you design.
  the_invariant_to_aim_at: >
    "There is no expression a caller can write that places code or a number where a dial's magnitude
    is computed, because no field, parameter or constructor on the dial path accepts a callable or a
    model object." Then try to refute it yourself before the auditor does.

increment_2_doors_require_their_value_types:
  scope: 'BP-AMENDMENT-0001 §D.1 and §D.2 for A2, A3, A4, A5. NOT A6 — that is increment 3.'
  deliver:
  - 'The `admits` mechanism: DERIVED FROM THE SIGNATURE, applied at the boundary, refusing on
     `type(value) is not declared` AND refusing ANY PARAMETER IT WAS NOT TOLD ABOUT. A new argument
     arrives REFUSED, never unguarded. The existing post-condition decorator is the precedent and the
     shape.'
  - 'A2 — `evaluate(config_snapshot)` requires exactly `ConfigSnapshot`.'
  - 'A3 — `evaluate(observations)` requires every element exactly `ObservationRecord` — the RECORD,
     not only the outcome, which is already exact-typed one level in.'
  - 'A4 — `resolve_panel(row)` requires exactly `PanelRow`, or None.'
  - 'A5 — `present_dial(reading)` requires exactly one of the sealed `Reading` members. NOTE: this
     parameter carries NO ANNOTATION AT ALL today, on the serving path, for CD-AC-001, and it has
     passed three gates. It was found by the Project Lead against work it had itself approved.'
  - 'THE STATIC CHECK — enumerates the judgement paths and FAILS on any public entry point that is not
     decorated. This is the acceptance test for the class, and it is what makes this a class closure
     rather than four fixes. It derives its subject FROM THE ARTEFACT and prints its subject count, so
     a vacuous pass is visible. It obeys CD-RULE-004: it closes its class or it declares its own limit.'
  plants: 'P5 (duck ConfigSnapshot, ASR3-F05), P6 (duck row whose `state` property answers AGREES while its stored state is UNAVAILABLE, ASR3-F04), P7 (a new parameter added to a decorated door without being declared to admits — REFUSED ON EVERY CALL).'
  P7_is_the_one_that_matters_most: >
    THE PRODUCT OWNER DIRECTED THE FOURTH ASSURANCE SEAT TO RUN P7 FIRST (ruling 1). It is what
    distinguishes "establishment derived from the signature" from "four type checks". If P7 does not
    fail on a door where you added an argument, you have not built the mechanism the ruling accepted.
  the_two_escapes_this_shape_exists_to_prevent: >
    Both were EDITS TO A BODY: CD-ASR-F03 (an edit to `_evaluate_dial`''s body) and the fourth
    argument `_absence_is_never_a_number` is deliberately written with `*extra` to survive. That is
    why the establishment must be derived from the signature at the boundary, where a rewrite of the
    body cannot remove it.

increment_3_the_collector_boundary:
  scope: 'BP-AMENDMENT-0001 §D.3, A6 — IN SCOPE BY PO-DECISIONS-0005 RULING 4, AND §D.3 IS ACCEPTED AS WRITTEN, BOTH PARTS.'
  why_it_is_here_at_all: >
    `collect(adapter, sink, ledger, clock, sleep, validator)` takes SIX caller-supplied objects plus a
    policy, and admits exactly ONE of them — `policy`, by `isinstance(policy, RetryPolicy)`, which is
    not even this project''s own exact-type standard, so a RetryPolicy subclass shadowing
    `max_attempts` with a property is admitted. EVERYTHING THE DIAL PATH LATER EVALUATES WAS WRITTEN
    BY OBJECTS THE COLLECTOR NEVER ESTABLISHED. The Product Owner ruled it in because excluding the
    largest member of the measured class "leaves 'by construction' true of the judgement half of the
    system and false of its input half".
  deliver:
  - 'PART 1 — `clock` and `sleep` STOP BEING CALLER CALLABLES. Same defect as `using`, same repair:
     `clock` becomes an engine-owned instant ALREADY ESTABLISHED BY `ensure_utc` and passed as a
     VALUE; `sleep` becomes a NAMED MEMBER of a closed `DelayKind`. A caller supplies neither.'
  - 'PART 2 — `adapter`, `sink`, `ledger` and `validator` KEEP THEIR `Protocol`s, and EVERY VALUE THEY
     RETURN IS ESTABLISHED AT THE POINT OF RETURN. `missing_adapter_members` already exists and is the
     right shape. Every FetchedResponse, every ObservationRecord and every validation verdict crossing
     back in is exact-typed ON ARRIVAL. The system cannot establish what an adapter IS; it can and must
     establish everything the adapter HANDS IT.'
  - '`policy` — bring it to this project''s own exact-type standard rather than isinstance, with the
     subclass-property reasoning written out as `ConfigSnapshot.dial_specs` already does.'
  - 'Extend the increment-2 static check to cover this entry point, or state why it cannot and declare
     the limit.'
  the_limit_you_must_declare_and_must_not_hide: >
    PART 2 IS A WEAKER GUARANTEE THAN §C''S AND THE AMENDMENT SAYS SO: it is a door that ADMITS, not an
    absence of a door. It is right here because the thing on the other side is genuinely foreign.
    DECLARE IT under CD-RULE-004 in all three places, as CD-BP-003, WITH AN EXECUTABLE EXAMPLE, and
    under CD-RULE-006 either MEASURE the layer you claim carries the residue or write "NOT PROVED TO BE
    CARRIED ANYWHERE". THE PRODUCT OWNER HAS NAMED THIS AS THE FOURTH ASSURANCE SEAT''S FIRST TARGET.
    Write the declaration for that reader: point at the soft spot and dare them to hit it. The seat
    that did exactly that at increment 2b is the one whose work was accepted.

increment_4_reconciliation_and_return:
  scope: 'NO NEW LOGIC. Declarations, register, plants, variants, evidence, return.'
  deliver:
  - 'required-tests.yaml — CD-AC-002''s trace becomes FOUR refusals with the FIRST STRUCTURAL;
     CD-AC-005 gains the `admits` door. latest_admitted_run STAYS NULL. No status-like key.'
  - 'Every declaration your closures invalidated, corrected in all three CD-RULE-004 places. Correcting
     a boundary YOU broke is part of closing the class; going looking for boundaries you did not break
     is scope creep.'
  - 'The ELEVEN declared plants: each still applies (`git apply --check`) and still contrasts. One that
     no longer applies is UPDATED to violate the SAME PROPOSITION against the new structure (CD-D-033).
     DELETING ONE IS PROHIBITED.'
  - 'variants/WO-2R3/ — your own variants as durable patches plus a manifest row each: test_id, patch,
     PROPOSITION violated, expected failure signature, and the literal command line. NOTHING under
     variants/ is executable (PBG-ASSURE-001).'
  - 'The full node-id reconciliation against 1400, in the form the commit contract requires.'
  - 'Your final Build Log entry and the READY_FOR_ASSURANCE return.'
  write_the_manifest_for_the_fourth_auditor: >
    It will read variants/ precisely so it can AVOID your routes. A manifest that makes that easy is
    worth more to this project than one more variant of your own.

