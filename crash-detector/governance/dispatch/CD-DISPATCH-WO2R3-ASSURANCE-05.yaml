the_evidence_standard_you_are_held_to_and_that_you_should_hold_the_record_to:
  the_CD_ENG_WO2R3_F12_standard: >
    **A PLANT IS EVIDENCE WHEN IT APPLIES, CONTRASTS, *AND FAILS AT THE LAYER ITS PROPOSITION
    NAMES* — never merely when it exits non-zero.** Two arms that both exit 1 for DIFFERENT reasons
    look identical in a summary table and prove nothing about the guard being credited.
  the_BITTEN_standard_PO_DECISIONS_0011_ruling_4: >
    **NEW, AND IT IS NOW THE STANDARD:** the arm applied FOR REAL, the failure signature REPRODUCED,
    and the instrument SHA-VERIFIED byte-identical to `git cat-file` at the SHA it was run from.
    "Bitten is henceforth the standard a plant is held to before its criterion is called guarded."
  runtime_claims_need_runtime_proof: >
    "Unconstructible", "structurally incapable", "cannot be admitted" are RUNTIME claims. A static
    checker exiting non-zero is not proof of one. **EVERY ESCAPE ON THIS PROJECT'S RECORD PASSED
    STATIC CHECKERS.** Construct the thing. Read the exception type and message. Name the layer that
    refused from the FAILURE TEXT.
  the_rename_test: >
    For any refusal credited to a STRUCTURE: does it survive renaming one identifier? If it depends on
    a NAME, it is a vocabulary guard wearing a structural label.
  the_counterfactual_arm_CD_D_079: >
    For every refusal credited to a structure, show the arm WITHOUT that structure failing to refuse.
  and_the_one_that_is_specific_to_a_REMEDIATION_gate: >
    **A FIX IS PROVED BY ITS RESIDUE AS MUCH AS BY ITS CLOSURE.** Every item in this increment
    declares what it does NOT reach. **TEST THE RESIDUE, NOT ONLY THE CLOSURE — an understated residue
    is this project's most-found defect and a fix that closed less than it says is worse than no fix,
    because the declaration is what a reader stops reading at.**

