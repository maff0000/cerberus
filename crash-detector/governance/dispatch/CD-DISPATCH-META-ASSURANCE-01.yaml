  numbers_not_adjectives: '`CD-RULE-003`, `CD-RULE-009`, `CD-PL-F91`. Run the command, read the number, never transcribe one from the record.'
  the_honest_residue_form: '`CD-RULE-006`. A residue declaration must name a layer MEASURED to hold it, or be written **NOT PROVED TO BE CARRIED ANYWHERE**.'
  what_this_pass_MUST_NOT_do: >
    *** **DO NOT PRODUCE ANOTHER HONEST CONFESSION.** *** The Product Owner's own diagnosis is that
    a self-raised finding per boundary *"ends with an audit, not with an infinite series of honest
    confessions"*. **A verdict that lists what the Project Lead already admitted, agrees with it, and
    praises the candour, IS THE FAILURE MODE — it would be the twelfth confession wearing an
    auditor's badge.**
    **THE DELIVERABLE IS A JUDGEMENT ABOUT WHETHER THE PRACTICE WORKS, AND WHAT WOULD HAVE TO CHANGE
    STRUCTURALLY FOR IT TO WORK.** Where a carrier is owed, say what it is and where it must live —
    including if the answer is `pbg/`, which no seat on this project may write and which is
    therefore the answer nobody has been able to give.

