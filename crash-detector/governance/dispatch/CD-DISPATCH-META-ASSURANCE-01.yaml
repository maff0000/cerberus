method_requirements:
  every_probe_prints_its_own_tree: '`CD-PL-F98`. Every command you run prints the tree it actually read (`pwd`), in its own invocation. **This is on your docket AND it is a rule you must follow, which is not a contradiction — it is the test of whether the rule is followable.**'
