gate:
  unchanged: 'Assurance PASS on all five planted criteria: CD-AC-001, 002, 003, 005, 012.'
  who_decides: >
    NOT YOU and NOT the Project Lead. A SEPARATE agent, CD-ASR-WO2-02, with a distinct actor_id,
    which has implemented no part of this and holds no commit on this branch (PBG-SOD-001,
    non-waivable). It will devise FRESH variants: the ten in the known set and the ones you write
    are, by then, the KNOWN set, and a guard that refuses only those proves nothing about the class.
    Design for the variant you have not thought of. That is the whole point of the exercise, and it
    is why the last gate failed.
  what_the_project_lead_does_with_your_return: >
    RECONCILIATION, not assurance: it re-runs your arms itself, re-runs the known-set variants
    itself, and writes fresh probes of its own. It may not certify your work and will not try. It
    audits your commit identities at every increment (CD-RULE-002) and it will not accept an
