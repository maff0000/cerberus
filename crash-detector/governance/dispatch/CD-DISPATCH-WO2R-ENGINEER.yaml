# --- runtime authorisation (PBG-RT-001, PBG-RT-004, PBG-RT-005) -------------------------------- #
runtime_authorisation:
  classification_rule: >
    Classify every planned observation BEFORE running it: NON_MUTATING_PROVEN,
    MUTATION_CAPABLE_AUTHORISED, FORBIDDEN or UNKNOWN_STOP. UNKNOWN halts (PBG-RT-005). Judge by
    foreseeable effect, never by command label (PBG-RT-001). Running pytest inside a governed tree
    writes __pycache__ and .pytest_cache and IS mutation by effect — use `python3 -B` and run in
    /tmp extractions.
  authorised_mutations:
  - id: RT-A
    action: >
      ONE throwaway PostgreSQL container, to re-evidence CD-RT-003-GRANT-MATRIX-LIVE's contrast
      after the increment-4 change, if and only if that increment touches anything the live check
      reads.
    bounds: >
      image postgres:16-alpine pinned BY DIGEST (resolve with `docker image inspect` and record it);
      container name prefix `cd-store-wo2r-`; port bound to 127.0.0.1 on an ephemeral port; named
      volume prefixed `cd-store-wo2r-`; credentials from environment variables generated at run time
      and NEVER written down; destroyed (`docker rm -f` plus `docker volume rm`) before you return,
      with the removal evidenced.
    mandatory_precondition_from_the_first_audit: >
      CD-ASR-N02. PostgreSQL role attributes and memberships are CLUSTER-wide, not database-scoped.
      A grant planted in one variant PERSISTS into every later variant on the same cluster and
      produces violations in trees that do not carry it. RESET THE CLUSTER BETWEEN VARIANTS. It
      fails loud rather than silent — inherited state produces EXTRA violations, never a false
      clean — but a contaminated result is not a result.
    forbidden: >
      touching, inspecting into, stopping, restarting or otherwise reaching ANY container or volume
      not carrying the `cd-store-wo2r-` prefix. Other projects run on this host. The previous
      Engineer's `cd-store-wo2-` and the previous auditor's `cd-asr-wo2-` prefixes are NOT yours.
  - id: RT-B
    action: Build container images for the application services.
    classification: FORBIDDEN IN WO-2R, as in WO-2.
    reason: >
      PBG-RT-010 keeps image creation and startup as separate risk-proportionate actions, and
      CONTAINER_READY_DESIGN with CONTAINER_BUILD_NOT_YET_AUTHORISED is a complete and valid state.
      Increment 4 reasons ABOUT the container from its declaration; it does not build one.

