        WITH THE V27 RE-MEASUREMENT, exactly as the reader seat itself recommended. DECLARE IT. DO NOT
        FIX IT. A commit here that changes _yamlmin.py parsing is out of bounds.

  no_new_code: >
    This increment changes no application logic. If you find yourself writing logic here, you have
    found a defect in an earlier increment: go back, fix it in its own commit, and say so.
  deliverables:
  - 'REGISTER AND CONTRACT SWEEP. Every register entry and every contracts/execution/ document
