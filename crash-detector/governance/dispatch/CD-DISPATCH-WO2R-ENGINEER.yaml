    whose verdict depends on the network is not reproducible, cannot be run by an auditor offline,
    and cannot be a gate. So "what it reaches" must be decided from DATA IN THE TREE.
  the_structure_this_dispatch_requires: >
    DENY BY DEFAULT OVER A DECLARED DESTINATION REGISTRY. An allowlist entry may only be an entry
    drawn from an explicit, in-tree registry of permitted destinations, each with its purpose and
    the service that needs it. Anything else — an IP literal, a CIDR, a URL, an unregistered
    hostname, a wildcard — is a VIOLATION BY DEFAULT because it is not a registered destination.
    Then "IP literal" is not a spelling to catch; it is simply not a destination anyone declared.
    The broker vocabulary and the known-operator denylist SURVIVE as a second layer over the
    registry itself, catching a REGISTERED destination that is a broker. Neither layer is sole.
    If you can see a better structure that resolves reach without the network, propose it in the
    Build Log and implement it — but it must be deny-by-default, and it must make E05 fail.
  note_on_the_current_true_state: >
