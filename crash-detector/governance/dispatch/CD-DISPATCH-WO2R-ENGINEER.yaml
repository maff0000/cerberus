# --- the mandatory commit block (PO Ruling 2, mechanically checkable) -------------------------- #
commit_message_contract:
  requirement: >
    Ruling 2 says the rework "must state IN THE COMMIT what CLASS is being closed and by what
    STRUCTURE". Every increment commit MUST therefore carry this block verbatim in shape, filled in.
    A commit without it is not accepted at reconciliation, however good the code is.
  template: |
    CLASS CLOSED:  <the class of violation that is now impossible, stated as a class — not as a
                    list of spellings. If it is a subclass of the finding rather than the whole
                    class, SAY SO HERE and declare the residue under DECLARED LIMIT below.>
    STRUCTURE:     <the structure that makes it impossible, and where it lives. Name the invariant,
                    not the diff.>
    WHY IT IS A CLASS CLOSURE: <one paragraph. Why can no route reach the violation, rather than
                    none of the routes tried?>
    PROVED BY:     <execution. Exact commands and exact observed outcomes.>
    KNOWN-SET VARIANTS RE-RUN: <E-ids from ESCAPED-VARIANTS-KNOWN-SET.md> -> each REFUSED, with
                    the refusal observed (exception type and message, or non-zero exit and the
                    line it named).
    NEW VARIANTS (>=2, mine): <one line each, naming the route and why it is a DIFFERENT route
                    from anything in the known set> -> each REFUSED, with the refusal observed.
    FALSE POSITIVES CHECKED: <what legitimate code you confirmed still works. A closure that
                    forbids the product is not a closure.>
    CLEAN ARM:     <the full declared command set> -> exit 0, <N> assertions / <N> tests passed.
    ELEVEN PLANTS: <still applying? still contrasting? if a plant was updated, which and why.>
    DECLARED LIMIT (if any): <per CD-RULE-004. If the class is not fully closed, the residue is
                    declared HERE and in the check header and in the register entry and in the
                    execution contract, consistently, each boundary with an executable example.>

# --- what "proved" means here ------------------------------------------------------------------ #
proof_standard:
  the_distinction_that_matters: >
    For F01 and F02 the Product Owner's words are "unrepresentable/unpublishable" and "structurally
    incapable". Those are RUNTIME properties. A static checker exiting non-zero is NOT proof of
    them, because the escapes that produced these findings all passed static checkers. The proof
    obligation is: WRITE THE VARIANT, RUN IT, AND SHOW THE INTERPRETER OR THE CONSTRUCTOR REFUSING
    IT. Record the exception type and message.
  for_guards_that_are_necessarily_static: >
    F03, F04 and F05 are guards over declarations and source. There, proof is the CONTRAST — the
    same declared command exiting 0 on the clean subject and non-zero on the violated one, run by
    you, on subject trees you extracted yourself. Additionally, for F04 and F05 the closure must be
    STRUCTURAL in the sense of deriving its subject from the artefact rather than from a constant;
    show that by changing the artefact and watching the guard's subject follow.
  extraction_hygiene: >
    NEVER mutate the worktree to test a variant, and NEVER create a git worktree for one. Extract
    with `git archive <sha> | tar -x -C <tmpdir>`, apply the variant there with `git apply -p1`,
    run, discard. A separate pristine extraction per variant, so no variant contaminates another.
    Use `python3 -B` everywhere so no __pycache__ is written into any governed tree (PBG-RT-001 —
    mutation by EFFECT, not by label; the first auditor tripped on exactly this and disclosed it).
  variants_must_be_durable: >
    A variant that exists only in your conversation is not project state (PBG-CONT-007). Every new
    variant lands as a `git apply`-able patch under variants/WO-2R/<finding-id>/ plus a row in
    variants/WO-2R/MANIFEST.md naming: variant id, finding, the PROPOSITION attacked, the ROUTE and
    why it differs from the known set, the exact command line, and the observed refusal. NOTHING
    under variants/ may be executable — no wrapper, no runner (PBG-ASSURE-001). The next auditor
    will read this directory precisely so that it can avoid your routes and devise fresh ones.

# --- the six increments ------------------------------------------------------------------------ #
# One per finding, each committed before the next begins (PBG-WORK-004: serialise mutation).
# F02 and F03 are ONE increment because the Product Owner ruled them the same class: "close together".
# Order: the two HIGH findings first, because they are the ones the PO said should be repaired before
# any work order writes new code on the dial path.

increment_1_F02_F03:
  findings: [CD-ASR-F02 (HIGH), CD-ASR-F03 (MEDIUM)]
  criterion: CD-AC-001
  known_set_variants_to_refuse: [E03, E04]
  the_class: >
    ABSENCE YIELDING A NUMBER. Not "the name `magnitude`", not "a property", not "a module-level
    constant" — ANY route by which a Reading that represents absence produces, exposes or is
    coerced into a numeric value, and any route by which a code path that did not get its inputs
    constructs a reading that carries one.
  the_structure_the_PO_named: >
    "Absence must be structurally incapable of yielding a numeric attribute; consider closing the
    Reading types against attribute addition entirely (the frozen-or-slotted invariant from the
    framework's own kernel lesson)."
  invariants_you_must_establish:
  - 'CLOSED ATTRIBUTE SURFACE. The three Reading constructors (Value, Degraded, Unknown) have a
    DECLARED member set, and the test asserts EQUALITY with it, not absence of a blacklist. The
    present test checks only that no name from ARITHMETIC_DUNDERS appears in vars(Unknown); that is
    a blacklist and it is why E03 was invisible. Any addition — dunder or not, numeric or not,
    property, classvar, method or slot — must FAIL, because it is not in the declared set.'
  - 'NO INSTANCE ATTRIBUTE INJECTION. Slots, or an equivalent, so `u.magnitude = 0.0` on an instance
    raises rather than sticking. Frozen already blocks assignment to declared fields; it does not
    block adding undeclared ones on a non-slotted dataclass.'
  - 'NO SUBCLASS ROUTE. `fold` and `is_value` dispatch on isinstance, so a subclass of Value or
    Unknown carrying a numeric member would be accepted everywhere a Reading is accepted while
    passing every check aimed at the three declared classes. Close it — refuse subclassing — or, if
    you keep it open, prove by execution that a subclass carrying a numeric member cannot reach any
    consumer, and declare the residue.'
  - 'ABSENCE CANNOT CONSTRUCT A VALUE. For F03: the missing-inputs path must be structurally
    incapable of returning a Value, whatever the number came from. Narrow the return of that path so
    a Value construction there is refused at runtime, not merely undetected by an AST enumeration.
    Note the existing partial structure you can build on: Value already refuses an empty
    inputs_used. That is the right shape; it is just not yet load-bearing for this path.'
  - 'THE AST GUARD STOPS ENUMERATING SPELLINGS. check_no_numeric_default.py currently enumerates
    `float | None`, `.get(k, 0)`, `or 0` and bare except. E04 walked past all four with a
    module-level constant. Invert it: on a missing-inputs branch, assert a POSITIVE permitted shape,
    so an unrecognised construction is a violation rather than a silence. If the guard cannot decide
    this statically for the whole class, DECLARE THE LIMIT (CD-RULE-004) and let the runtime
    structure carry the weight — but say which layer carries it and stop claiming the other does.'
  register_correction_required: >
    CD-RT-001-AST-NO-NUMERIC-DEFAULT declares `scope: CLASS`. Either make that true or change the
    declaration. Both are acceptable; claiming CLASS while enumerating spellings is not.

increment_2_F01:
  findings: [CD-ASR-F01 (HIGH)]
  criterion: CD-AC-002
  known_set_variants_to_refuse: [E01, E02]
  the_class: >
    A SCALAR DERIVED FROM BOTH DIAL TYPES. Not "an expression naming both markers", not "a call
    whose arguments are both dials" — ANY value, however computed, however many function calls away,
    however the attribute was reached, whose provenance includes both the equity dial and the
    monetary dial.
  the_structure_the_PO_named: >
    "The closure must make any scalar derived from both dial types unrepresentable/unpublishable as
    a class, not ban known spellings."
  why_static_analysis_cannot_be_the_closure: >
    Understand this before designing, because it determines the whole increment. The check's flavour
    propagation is INTRA-PROCEDURAL by design and purely STATIC. E01 moved the arithmetic one call
    away, into a function whose parameters are annotated `float`. E02 needed no allowlisted path at
    all: `getattr(dials, slot).value.score` over `_SLOTS = ("equity", "monetary")` means NO DIAL
    MARKER APPEARS IN ANY EXPRESSION, so nothing is ever flavoured. No amount of hardening to a
    static intra-procedural checker closes this class; the class is closed at the TYPE and at the
    PUBLICATION BOUNDARY, and the AST scan becomes a locator with a declared limit.
  invariants_you_must_establish:
  - 'UNREPRESENTABLE: no expression in Python produces a bare number from both dials. Today
    `.score` is a plain float, so the moment a caller holds two floats the type system is out of
    the conversation. Make a dial magnitude a NOMINAL, PER-DIAL, NON-COERCIBLE value — no
    arithmetic dunders, no __float__/__int__/__index__/__round__ — so `left + right`, `sum([...])`,
    `functools.reduce`, `statistics.mean` and anything else raise TypeError AT RUNTIME regardless of
    how the two values were reached. E01 and E02 must both raise when EXECUTED, and you must show
    the traceback.'
  - 'PROVENANCE IS CARRIED, NOT INFERRED. Wherever a number must eventually exist for publication,
    it carries which dial it came from as DATA. Cross-dial combination is refused at the point of
    combination by comparing provenance, so the refusal does not depend on anyone having read the
    code. A same-dial computation must still work — prove it.'
  - 'UNPUBLISHABLE: the publication boundary refuses any scalar whose provenance is not exactly one
    dial. The closed public envelope schema already refuses a combined FIELD and the auditor
    confirmed that mitigation HOLDS — keep it, and add the provenance refusal so a blend cannot even
    be offered to the envelope. Two independent layers, both structural.'
  - 'THE REGISTER ENTRY STOPS OVER-CLAIMING. CD-AC-002''s entry says "a blend that slips past any
    one layer must still fail the other two". The auditor REFUTED that specific claim by execution.
    Rewrite the entry so it claims exactly what the layers deliver, and give the AST no-blend check
    a DECLARED LIMIT in the CD-RT-012 pattern — check header, register entry, execution contract,
    consistently, each boundary with an executable example (CD-RULE-004). Its intra-procedural and
    static limitations are real, permanent and must be written down.'
  expect_this_to_reach_widely: >
    Every consumer of `.score` is affected. That is the cost of the ruling and the PO made it with
    the finding in front of them (risk CD-PL-F47). The clean arm is your net: run it constantly, and
    if the refactor forces a change in a test's EXPECTATION rather than its mechanics, say so
    explicitly in the commit — a quietly relaxed assertion is the failure mode here.

