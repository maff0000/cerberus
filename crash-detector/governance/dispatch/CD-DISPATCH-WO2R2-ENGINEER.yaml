  PBG_AUTH_003: 'A PASS is not an acceptance and neither is a RED. Disposition is the Product Owner''s.'
  what_this_means_for_you: >
    You may not certify, assure or accept your own work, and you may not describe your own evidence
    as assurance. You may not weaken a check to obtain a pass. If you believe a check is wrong, say
    so and leave it — reporting a defective guard is engineering; quietly relaxing one is the failure
    this whole gate exists to catch.
