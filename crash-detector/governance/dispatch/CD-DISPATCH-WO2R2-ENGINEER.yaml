increment_2_class_2_judge_values_never_types:
  the_PO_words_verbatim: >
    "CLASS 2 — JUDGE VALUES, NEVER TYPES. Staleness, agreement, reading-ness decided on content;
    isinstance is never a guard by itself (pandas.Timestamp defeated it)."
  criteria_carried: [CD-AC-005 (AMBER)]
  findings_carried: [CD-ASR-WO2R-F02 (HIGH)]
  auditor_variants_that_must_be_refused:
  - 'ASR2-005-A-datetime-subclass-lies-about-age.py.txt — a `datetime` SUBCLASS overriding
     `__rsub__` and `astimezone` survives `ensure_utc` (time_utc.py:44 admits by isinstance),
     survives `PanelRow.__post_init__` normalisation, and controls the subtraction in
     `age_seconds`. A row dated 2016-08-21 read in 2026 with a 600 s window renders WITNESS AGREES.
     CONTROL ARM: the identical instant as a plain datetime renders WITNESS UNAVAILABLE. The only
     variable is the concrete type of the timestamp. CD-RT-005 exit 0, 152 passed; whole suite 1325
     passed.'
  the_class_stated_at_the_right_altitude: >
    NOT "datetime subclasses". The class is: ANY JUDGEMENT THIS SYSTEM MAKES THAT DELEGATES ITS
    DECIDING OPERATION TO AN OBJECT THE SYSTEM DID NOT CONSTRUCT. The subtraction, the comparison,
    the equality, the ordering, the truthiness, the formatting — each is a method, and a method on a
    supplied object is that object's to define. `StalenessWindow` already knows this and says so in
    terms: "a subclass of a number is not a number: it may redefine what comparison means, and a
    window whose comparisons it controls is not a window at all." THE DOCTRINE WAS APPLIED TO ONE
    OPERAND AND NOT THE OTHER. A comparison has two.
  the_sibling_the_auditor_named_in_the_same_breath: >
    `witness_resolver._finite_measure` admits a measurement with `isinstance(observed, float)`,
    accepting a float subclass — the very type StalenessWindow refuses by exact type four modules
    away. The auditor reported it "not as a separate finding but as the same class". IT IS IN SCOPE
    HERE precisely because it is the same class; closing the timestamp and leaving the measurement is
    the instance game.
  invariants_you_must_establish:
  - 'THE SWEEP IS THE DELIVERABLE, NOT THE FIX. Enumerate EVERY isinstance / duck-typed admission on
     every path that decides staleness, agreement or reading-ness, and state for each whether the
     deciding operation is delegated to the supplied object. That enumeration, with its denominator
     and its method, is a required artefact. A fix to two sites with no sweep behind it is how a
     fourth constructor route existed after three were measured.'
  - 'THE ADMISSION ESTABLISHES THE VALUE ON THE SYSTEM''S OWN TERMS. Exact-type admission, or
     re-construction into a type this system built from primitives it read out of the supplied
     object, or an equivalent — the choice is yours and must be argued. What may not survive is a
     judgement computed by a method the caller supplied.'
  - 'NO ROUTE TO `Agrees` WITHOUT FRESHNESS EVIDENCE THE SYSTEM ITSELF COMPUTED. The FreshnessEvidence
     design is genuinely good and the auditor said so: the age comparison IS the act of constructing
     the evidence, and there is no third comparison site. Keep it. Make the arithmetic that feeds it
     unforgeable.'
  - 'FAIL CLOSED, NOT FAIL SILENT. A timestamp or measurement this system cannot establish on its own
     terms yields UNAVAILABLE with a stated reason — never AGREES, and never a silent default.'
  what_you_must_not_do: >
    Do not regress the six existing routes to Unavailable (absent, future-dated, stale, feed
    -unreachable, incoherent, unrecognised) — all six were verified by the first auditor and the
    render-table guard and the malformed-row catch were both proved to bite. And do not close this
    by banning subclasses at the API edge with a note saying callers must not pass them: `pandas
    .Timestamp` IS a datetime subclass, as are freezegun''s and several time libraries'. A collector
    handing the resolver one is not an attack, it is Tuesday. If your structure makes ordinary
    library timestamps unusable, you have traded a defect for a defect and must say so.
  boundary_3_must_be_corrected: >
    staleness.py boundary 3 says "THREE MEASURED, and three is the denominator, not a proof that a
    fourth does not exist". THAT HEDGE IS WHY THIS IS AMBER AND NOT RED, and it did its job. Now the
    fourth exists and the boundary must say what the denominator is AFTER your sweep, by what
    method it was taken, and what remains outside it. In all three CD-RULE-004 places, with an
    executable example, carrier MEASURED per CD-RULE-006.

