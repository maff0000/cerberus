# ================================================================================================== #
# WHAT "PROVED" MEANS HERE
# ================================================================================================== #
proof_standard:
  runtime_properties_need_runtime_proof: >
    "Unrepresentable", "structurally incapable", "cannot be admitted" are RUNTIME claims. A static
    checker exiting non-zero is not proof of one, because every escape on this project's record
    passed static checkers. WRITE THE VARIANT, RUN IT, SHOW THE INTERPRETER OR THE CONSTRUCTOR
    REFUSING IT, and record the exception type and message.
  for_guards_that_are_necessarily_static: >
    Proof is the CONTRAST — the same declared command exiting 0 on the clean subject and non-zero on
    the violated one, run by you, on subject trees you extracted yourself; plus the subject count
    printed, so a vacuous pass is visible; plus the derivation shown following the artefact where
    the guard claims to derive its subject.
  extraction_hygiene: >
    NEVER mutate the worktree to test a variant and NEVER create a git worktree for one. Extract with
    `git archive <sha> | tar -x -C <tmpdir>`, apply with `git apply -p1`, run, discard. A separate
    pristine extraction per variant so no variant contaminates another. Use `python3 -B` everywhere
    so no __pycache__ is written into any governed tree (PBG-RT-001 — mutation by EFFECT, not by
    label; the first auditor tripped on exactly this and disclosed it).
  generate_patches_with_git_diff: >
    CD-ENG-WO2R-F13, adopted: hand-written hunks get silently truncated by `git apply` and six
    variants once briefly failed FOR THE WRONG REASON. Generate every patch with `git diff`, and
    ASSERT THE EXPECTED RULE ID, never merely a non-zero exit.
  variants_must_be_durable: >
    A variant that exists only in your conversation is not project state (PBG-CONT-007). Every new
    variant lands as a `git apply`-able patch under variants/WO-2R2/<class>/ plus a row in
    variants/MANIFEST.md naming: variant id, class, the PROPOSITION attacked, the ROUTE and why it
    differs from BOTH corpora, the exact command line, the observed refusal, THE REFUSING LAYER AND
    ITS SCOPE, and the rename-test result. NOTHING under variants/ may be executable — no wrapper, no
    runner, mode 0664, no symlinks (PBG-ASSURE-001; the auditor verifies this independently).

# ================================================================================================== #
# INCREMENT 1 — CLASS 1. ADMISSION IS VALIDATION.
# carries CD-AC-002 (RED, ASR2-F01) and CD-AC-001's AMBER (ASR2-F03)
# ================================================================================================== #
increment_1_class_1_admission_is_validation:
  the_PO_words_verbatim: >
    "CLASS 1 — ADMISSION IS VALIDATION. No value crosses into the dial or publication path
    unvalidated. Every admission site validates VALUES against the target type's own invariants,
    deny by default. Label vocabularies are never the load-bearing check — the refuted RULE 4 text
    ('cannot avoid coming here') is withdrawn as a claim and must be replaced by a property that is
    true. Explicitly NOT scoped as 'add combine_within_one_dial to the vocabulary'."
  criteria_carried: [CD-AC-002 (RED), CD-AC-001 (AMBER)]
  findings_carried: [CD-ASR-WO2R-F01 (HIGH), CD-ASR-WO2R-F03 (MEDIUM)]
  auditor_variants_that_must_be_refused:
  - 'ASR2-002-A-derivation-door-launders-a-blend.py.txt — `combine_within_one_dial` passes an
     arbitrary closure''s return value straight into `derived_within_one_dial`, which validates
     nothing. Equity 0.9 + monetary 0.1 publishes as an equity 0.5, with check_no_blend PASS at 4873
     assertions (clean 4855 — it SCANNED the module and had nothing to say), schema PASS, type tests
     306 passed, whole suite 1325 passed.'
  - 'ASR2-001-A-fold-unknown-branch-returns-calm.py.txt — `fold`''s `on_unknown` branch returns 0.0
     on the DECLARED SCANNED PATH, using none of the enumerated spellings and none of the six
     declared boundaries'' reserved routes. An Unknown reading with reason REQUIRED_INPUT_MISSING
     renders as 0.0 — calm — which PID §3.2 forbids in terms.'
  the_class_stated_at_the_right_altitude: >
    NOT "a public function missing from a vocabulary". The class is: ANY VALUE ENTERING A TYPE THAT
    CARRIES A PRODUCT MEANING WITHOUT THAT TYPE HAVING ESTABLISHED THE MEANING IS TRUE OF IT. F01 is
    a magnitude admitting a number whose single-dial provenance was asserted by a label rather than
    established of the value. F03 is the same shape read backwards: a consumer answering an absence
    with a number that no type ever vouched for. Both are admission without validation; one on the
    way in, one on the way out.
  the_two_claims_now_under_audit_and_MEASURED_FALSE:
  - 'src/crash_detector/dials/magnitude.py boundary A: "the sum cannot come back ... no number so
     obtained can ever be a dial magnitude again." REFUTED BY EXECUTION at 50fc231. It comes back.'
  - 'check_no_blend.py RULE 4''s "cannot avoid coming here". WITHDRAWN AS A CLAIM by the Product
     Owner at CD-D-073. It must be REPLACED BY A PROPERTY THAT IS TRUE, not softened.'
  invariants_you_must_establish:
  - 'VALIDATION IS OF THE VALUE, NOT OF THE CALLER. A door''s guarantee must be established from
     what it is HANDED, not from where the handing came from or what the handing was called. If a
     door cannot establish its guarantee from the value, that door must not be able to construct the
     type — it must fail closed and say what it could not establish.'
  - 'THE ADMISSION SURFACE IS ENUMERABLE AND IT IS ENFORCED BY THE TYPE, NOT BY A SCANNER. Today the
     enumeration lives in a static AST registry over a NAME VOCABULARY, and a public re-exported
     function that is not in the vocabulary walks past it. Whatever you build, the question an
     auditor will ask is: CAN ANY PUBLIC FUNCTION REACH A DOOR THE REGISTRY GUARDS? Answer it
     structurally, and answer it in a way that survives someone adding a new public function
     tomorrow without reading your registry.'
  - 'THE STATIC LAYER IS DEMOTED TO WHAT IT CAN ACTUALLY DO, IN WRITING. A static, intra-procedural,
     name-based scanner is a LOCATOR with a declared limit. Keep it — it has value — but the closure
     may not REST on it, and RULE 4''s withdrawn sentence must be replaced in the check header, the
     register entry and the execution contract consistently (CD-RULE-004), with the carrier MEASURED
     (CD-RULE-006).'
  - 'ABSENCE IS ANSWERED, NOT MERELY UNCONSTRUCTED (the CD-AC-001 AMBER, riding here by CD-D-073).
     The criterion''s words are about RENDERING: "missing or stale input never renders as calm". The
     present structure closes CONSTRUCTION of numeric defaults and leaves CONSUMPTION open — `fold`
     guarantees a caller cannot FORGET Unknown, never that a caller cannot ANSWER Unknown with a
     number. Close the answering. A consumer that turns an Unknown into a number must be structurally
     unable to present that number as a dial reading — and note that the honest answer may be that
     `fold` is the wrong shape for the surface tier, not that `fold` needs another guard.'
  the_direction_the_project_lead_OFFERS_AND_DOES_NOT_IMPOSE: >
    DIRECTION, NOT DESIGN (PBG-AUTH-006; the Project Lead does not author the closure it will
    reconcile, and CD-D-038's precedent is not relaxed because the fix looks obvious). The
    observation is this. Increment 1 of WO-2R made a move that WORKED: it changed the question from
    "is this number blended?", which is undecidable, to "is this number's provenance DECLARED?",
    which is set equality. The defect now measured is that DECLARED was allowed to mean ASSERTED BY
    A LABEL rather than ESTABLISHED OF THE VALUE. So the candidate move is to make provenance
    something a value CARRIES through every arithmetic step rather than something a door STAMPS on
    it at the end — at which point `using(numbers)` returning a bare float is refused because a bare
    float has no provenance to carry, not because anyone recognised the function that produced it.
    YOU MAY REJECT THIS. If you do, say why in the commit and say what you did instead.
  false_positive_obligation: >
    Same-dial computation must still work end to end. A magnitude must still publish into its own
    slot. `repr` must remain useful to a developer in a debugger (the increment-2b argument stands
    and is not reopened). A dial that legitimately has no reading must still render UNKNOWN, not
    raise.
  register_corrections_required: >
