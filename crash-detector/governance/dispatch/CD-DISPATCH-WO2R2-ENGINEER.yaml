# THE STANDING METHOD RULE, ADOPTED PROJECT-WIDE AT CD-D-073 — READ THIS BEFORE YOU DESIGN
# ================================================================================================== #
CD_PL_F74_ADOPTED:
  the_rule: >
    A REFUSAL IS RECORDED WITH **WHICH LAYER** REFUSED IT AND **WHAT THAT LAYER'S SCOPE IS**, BEFORE
    ANY ACCEPTANCE CITES IT. Effective immediately, project-wide, ordered by the Product Owner.
  what_it_means_for_you_concretely: >
    Every "REFUSED" you write in a commit message, a manifest row or a Build Log entry must name the
    layer that did the refusing — this type's constructor, this AST rule, this schema, this test —
    and state what that layer is scoped to. "check_no_blend exit 1, 2 violations" is NOT a compliant
    record. "RULE 4 of check_no_blend refused it — a static, intra-procedural, deny-by-default
    registry over a NAME VOCABULARY; scope: names appearing literally in the scanned set" IS.
  why_it_costs_a_gate_when_it_is_skipped: >
    CD-D-040 accepted increment 2b on PL-R5's refusal. PL-R5 was refused by a name registry. The
    acceptance read it as evidence that the CLASS was closed. The Project Lead then measured PL-R6:
    PL-R5 with ONLY the door name swapped goes from FAIL to PASS and publishes the blend. The
    refusal was real; the inference from it was not. Six recurrences of probe-refused-for-the-wrong
    -reason are on this project's record and the sixth cost a gate.
  the_test_you_apply_to_your_own_evidence: >
    For every variant you record as refused, ask: IF I RENAME ONE IDENTIFIER, DOES IT STILL REFUSE?
    If the answer is no, you have measured a vocabulary and not a class, and you must say so in the
    row rather than let a reader infer otherwise. This is now a delivery obligation, not advice.

PO_STANDING_CONDITION:
  source: 'governance/decisions/PO-DECISIONS-0002.md, final paragraph. Product Owner, 2026-08-19.'
  each_closure_states_its_invariant: >
    "Each class closure states its structural invariant in the commit that lands it." A commit
    without it is not accepted at reconciliation, however good the code is.
  the_third_gate_clause: >
    "If a THIRD gate fails on a carrier/admission-shaped finding, implementation SUSPENDS and
    Blueprint §7 returns for architectural review." YOU ARE TOLD THIS DELIBERATELY. It is not a
    threat and it does not change what you may do; it tells you what is actually being decided, so
    that if you reach a point where the honest answer is "this class cannot be closed at this
    altitude without a §7 change", SAYING SO IS A VALID AND VALUABLE RETURN. Escalating a structural
    impossibility is worth more to this project than a fourth clever guard. What is NOT acceptable is
    discovering it and building the guard anyway.
  the_gate_is_unchanged: 'Assurance PASS on all five criteria. No waiver. latest_admitted_run null until CD-RULE-001 is satisfied.'

