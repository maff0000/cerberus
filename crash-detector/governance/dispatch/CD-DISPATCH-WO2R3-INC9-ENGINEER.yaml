        **F-06-J NAMED EIGHT OF THE THIRTEEN. THE FIVE IT DID NOT NAME ARE `_Admission`, `_Exactly`,
        `_EachOf`, `_EstablishedHere` AND `DeclaredQuantity`** — and **FOUR OF THOSE FIVE ARE PRIVATE
