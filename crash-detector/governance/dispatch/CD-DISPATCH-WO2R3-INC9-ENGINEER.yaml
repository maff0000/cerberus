items:

  ITEM_1:
    title: '**THE SEALING PROPERTY, REQUIRED OF THE CLASS, INSTRUMENT-ENUMERATED OVER ALL 99.**'
    what_the_property_is: >
      **A GOVERNED CLASS MUST NOT BE CONSTRUCTIBLE WITH FORGED STATE BY A ROUTE THAT EXECUTES NO
      PACKAGE CODE.** The route the record names is `Agrees.__new__(Agrees)` followed by
      `__dict__.update(...)`; the sibling route is `__setstate__`. The MECHANISM already used in
      this tree is `__slots__` **plus** an empty `__dictoffset__` — both, because slots alone does
      not close it if any base carries a `__dict__`. `dials/reading.py:426-440` is the existing
      local check, written for three types; `dials/provenance.py:763` is the same pair applied to
      one more. **THE MECHANISM IS NOT YOURS TO INVENT. THE POPULATION IS YOURS TO CLOSE.**
    the_measured_route_from_the_record: >
      `variants/WO-2R3/P-E23-what-the-in-package-execution-sentence-gets-wrong.py` arm 1 counts every
      line executed under `src/crash_detector/` with `sys.settrace`:
      **LINES OF PACKAGE CODE EXECUTED: 0 · package files touched: [] ·
      `type(smuggled) is exactly Agrees`: True · `smuggled.as_of_utc`: 'not a datetime' ·
      CONTROL through `Agrees(...)`: REFUSED TypeError, 36 LINES.**
      **36 LINES THROUGH THE FRONT DOOR AND A REFUSAL; 0 LINES AROUND IT AND AN OBJECT.**
    what_you_must_build:
    - '**AN INSTRUMENT** under `tools/register/` that ENUMERATES the same 99 classes
       `check_constructor_field_establishment.py` examines and, for EACH, prints a verdict on the
       sealing property. It exits non-zero when any class that the property is REQUIRED of is OPEN.'
    - '**THE ENUMERATION MUST BE DERIVED, NOT COPIED.** A hard-coded list of 99 names is a
       transcription and it rots at the next class anyone adds. Derive the population the way the
       constructor check derives it, or import and reuse its derivation — and **SAY WHICH, AND SAY
       WHAT HAPPENS WHEN THE TWO ENUMERATIONS DISAGREE**, because two independent readings of one
       class that must agree is exactly what `governed_types()` and the static check already are.'
    - '**EVERY EXCLUSION MEASURED AND DECLARED.** For every one of the 99 the property is NOT
       required of, the instrument prints the MEASURED PROPERTY that excludes it, evaluated at run
       time. **NOT A NAME. NOT A LIST. A PROPERTY.** See header item 2.'
    - '**THE SEAL ITSELF APPLIED** to the classes the property is required of and does not yet hold
       for. `@dataclass(frozen=True, slots=True)` is available (Python 3.11.2, PL-verified) and so
       is a manual `__slots__`. **WHERE A CLASS CANNOT BE SEALED, THAT IS A MEASURED EXCLUSION WITH A
       REASON — a base carrying `__dict__`, a field defaulting mechanism that needs one, whatever
       you actually find — AND IT IS DECLARED, NEVER ASSUMED.**'
    - '**A PLANT, IN THE ESTABLISHED CONTRAST FORM.** `plants/<CD-AC-NNN>/<CD-RT-NNN-NAME>.patch`,
       applied to a pristine `git archive` extraction with `git apply`, clean arm and violated arm,
       the declared command from `required-tests.yaml`, **EXIT CODE RECORDED ON BOTH ARMS AND
       `git apply`''s OWN EXIT CODE RECORDED AS A THIRD COLUMN** (header item 5). Its register row
       and execution contract go in at the same time (CD-RULE-004, all three places consistently).'
    - '**AND THE PLANT MUST FAIL AT THE LAYER ITS PROPOSITION NAMES, READ FROM THE FAILURE TEXT AND
       NOT FROM THE EXIT CODE** (the `CD-ENG-WO2R3-F12` standard). Two arms that both exit non-zero
       for DIFFERENT reasons look identical in a summary table and prove nothing.'
    the_reading_of_all_99_THIS_SEAT_MADE_AND_THE_PRODUCT_OWNER_MAY_CORRECT_IN_ONE_SENTENCE: >
      **THE RULING SAYS "required of the CLASS — instrument-enumerated over all 99 governed classes,
      exclusions MEASURED AND DECLARED never assumed."** Of the 99 the constructor check examines,
      **33 are IN its governed population and 66 are ruled OUT** by measured clauses (not public /
      not frozen / not on a judgement path). **THIS SEAT READS THE RULING AS: the instrument SWEEPS
      ALL 99 and REQUIRES THE SEAL, and every class it does not require it of carries a MEASURED,
      PRINTED EXCLUSION — so that "not required" can never again mean "not looked at".** The ruling's
      own denominator is 99 ("a remedy applied to 13 of 99"), which is why this reading and not the
      narrower one.
      **THIS IS A READING AND IT IS THIS SEAT'S, NOT THE PRODUCT OWNER'S.** It is recorded in the
      Build Log as a reading the Product Authority may correct in one sentence. **IF YOUR MEASUREMENT
      SHOWS THE READING IS WRONG — for example that requiring the seal of the 66 ruled-out classes
      forces an exemption or a weakening — THAT IS A DECLARED STOP: return `STOPPED_AT_ITEM_1` WITH
      THE MEASUREMENT, AND THE NEXT ACTOR IS THE PRODUCT OWNER AND NOT ANOTHER ENGINEER.**
