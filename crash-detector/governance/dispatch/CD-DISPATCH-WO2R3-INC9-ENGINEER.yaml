        DIFFERENCE and not smoothed into agreement (CD-RULE-009). **RE-TAKE IT. IF YOUR NUMBER IS
        NEITHER 77 NOR 86, SAY SO AND SAY WHAT YOU COUNTED.**
    and_the_thing_that_would_make_this_item_vacuous: >
      **A SEAL THAT IS NEVER TESTED IS A `__slots__` LINE.** For every class you seal, the plant or a
      carrier must show the ROUTE FAILING — `Cls.__new__(Cls)` then `__dict__.update(...)` raising,
      **with the exception type and the layer read from the failure text.** And run the counterfactual
      (CD-D-079): the same route at your BASE SHA succeeding. **A CONTRAST WHOSE BOTH ARMS FAIL FOR
      THE WRONG REASON IS THIS PROJECT'S MOST REPEATED MEASUREMENT DEFECT (F09, F15).**

  ITEM_2:
    title: '**CD-PL-F104 — `establishes` ADMITS A NON-DATACLASS AND A CALLER CAN MINT A FORGED GOVERNED TYPE THROUGH IT.**'
    added_by: 'PO-DECISIONS-0016 ruling 2, in terms. **NOT scope the Project Lead added.**'
    the_finding_verbatim: >
      *"`crash_detector.establishment.establishes` — A PUBLIC, EXPORTED DECORATOR — ADMITS A
      NON-DATACLASS, AND A CALLER CAN MINT A FORGED GOVERNED TYPE THROUGH IT. Its gate is
      `dataclasses.is_dataclass`, which is a `hasattr` probe; one class attribute
      (`__dataclass_fields__ = {}`) defeats it. The forged class then reports `is_establishing_type`
      **True**, `establishment_faults` **`()`**, and **ENTERS `governed_types()`** — the enumeration
      a governing carrier reads."*
    why_it_is_in_THIS_increment_and_not_another: >
      **BECAUSE ITEM 1'S INSTRUMENT READS AN ENUMERATION, AND THIS IS THE DEFECT THAT LETS A CALLER
      PUT A CLASS INTO ONE.** Sealing 99 classes while `governed_types()` will admit a 100th that
      a caller minted is a control scoped narrower than the class it names, one layer up — **which
      is the exact defect this whole increment exists to stop repeating.** The two items are one
      argument.
    the_measured_divergence_you_INHERIT_AND_MUST_RESOLVE: >
      `CD-ENG-WO2R3-04` measured the forged-entry population at **7 -> 8**; the Project Lead measured
      **23 -> 24**. **THE NUMBERS DIFFER AND THE FACT DOES NOT** — the population depends on which
      entry modules the process has imported, **and that is itself a note about `governed_types()`
      AS AN ENUMERATION**, recorded as a difference rather than smoothed (CD-RULE-009).
      **IF AN ENUMERATION'S SIZE DEPENDS ON IMPORT ORDER, SAY WHAT THAT MEANS FOR ANY CARRIER THAT
      READS IT — INCLUDING ITEM 1'S.**
    what_you_must_do: >
