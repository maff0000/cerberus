      THEM CLOSED** (`tools/sweep/declared_dispositions.py` is protected; see below).
    the_declared_stop: >
      **IF CLOSING IT REQUIRES A CHANGE TO WHAT `@establishes` MEANS, THAT IS PRODUCT INTENT AND NOT
      YOURS.** Return `STOPPED_AT_ITEM_2` with the measurement. Declaring a measured limit is always
      available and is never a failure.

