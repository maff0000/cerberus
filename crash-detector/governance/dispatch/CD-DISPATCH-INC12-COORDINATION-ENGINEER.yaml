      ARM_1_baseline_REFUSES: 'A second `claim` on an already-claimed task exits non-zero and names the holder.'
      ARM_2_violated_ADMITS: '**THE MUTATION IS NAMED AND IT IS THE REAL ONE: replace `O_CREAT|O_EXCL` with an `os.path.exists` pre-check and a plain write, then interleave two claimers across the window.** Expected: **BOTH SUCCEED. TWO SEATS HOLD ONE TASK.** Demonstrate the resulting state — read both claim files back and show the second overwrote the first, or show both processes returning success. **DO NOT ASSERT IT. SHOW IT.**'
      ARM_3_non_vacuity_ADMITS: 'Two claims on DIFFERENT tasks both succeed, concurrently, both live.'
    PLANT_COORD_02_disjoint_scope:
      ARM_1_baseline_REFUSES: 'Two live claims with overlapping write scopes -> `check_scope_disjoint.py` non-zero, naming both seats and the path.'
      ARM_2_violated_ADMITS: 'Mutation: `overlaps()` compares only the first path segment (or returns `False` when it cannot decide — **the fail-OPEN mutation, which is the one that would really happen**). Expected: the overlap is ADMITTED and the check exits 0.'
