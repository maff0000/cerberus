items:

  ITEM_1_THE_WORK_CLAIM_REGISTRY:
    delivers: 'PO-DECISIONS-0021 ruling 3(a) — *"A task is atomically claimed before it is worked; a launch refuses to start on an already-claimed task. Two seats can never take the same work."*'
    the_shape_and_WHY_IT_IS_NOT_A_LIST_FILE: >
      *** **THE REGISTRY IS A DIRECTORY, ONE FILE PER CLAIM — `governance/coordination/claims/<task-id>.claim.yaml`.
      IT IS NOT A SHARED YAML LIST.** *** A shared list file RE-CREATES THE EXACT CONTENTION THIS
      INCREMENT EXISTS TO REMOVE: two seats read it, both append, one write wins, and the loser's
      claim vanishes with no error anywhere. **THE DIRECTORY IS THE REGISTRY. THE FILESYSTEM IS THE
      LOCK.** If you find a reason this is wrong, say so and return it — do not quietly build the list.
    the_atomicity_requirement_STATED_AS_A_MECHANISM_AND_NOT_AS_A_GOAL: >
      **THE CLAIM IS TAKEN WITH `os.open(path, os.O_CREAT | os.O_EXCL | os.O_WRONLY)` AND THE
      `FileExistsError` IS THE REFUSAL.** **A `if os.path.exists(p): refuse` FOLLOWED BY A WRITE IS
      THE DEFECT, NOT THE CONTROL** — it is a TOCTOU window, and two seats interleaved inside it both
      succeed. **THIS DISTINCTION IS THE WHOLE ITEM AND YOUR PLANT MUST PROVE IT** (see ITEM 5).
    the_claim_file_records: >
      `task_id` · `seat_actor_id` · `pid` · `hostname` · `claimed_utc` (from `date -u`, CD-RULE-005) ·
      `base_sha` at claim time (resolved, never transcribed) · `branch` · `worktree` ·
      `write_scope` (path globs) · `read_scope` (path globs — **F134's material**) ·
      `build_log_id_block` · `dispatch_id` · `state` (`CLAIMED` / `RELEASED` / `ABANDONED`).
    the_commands: >
      `claim` (atomic, refuses on an existing claim, naming the holder, its PID and its claim time) ·
      `release --task --seat` (**ONLY THE HOLDING SEAT MAY RELEASE — a seat releasing another seat's
      claim is a refusal, and this matters because it is how a launch script papers over a collision**) ·
      `list` · `status --task`.
    the_stale_claim_question_ANSWER_IT_EXPLICITLY_DO_NOT_LEAVE_IT_IMPLICIT: >
      A claim whose PID is dead is STALE. **REAPING IT SILENTLY IS THE BUG THAT MAKES THE WHOLE
      REGISTRY WORTHLESS** — a wrapper hard-kill (which has happened on this project, an entire
      Assurance audit ceased to exist) leaves a claim behind, and if the next launch reaps it without
      trace nobody learns a seat died. **REAP EXPLICITLY, WRITE THE REAPING INTO THE CLAIM FILE WITH
      ITS REASON AND THE EVIDENCE OF DEATH, AND MAKE THE REAP A SEPARATE COMMAND FROM `claim`.**

  ITEM_2_DISJOINT_WRITE_SCOPES:
    delivers: 'PO-DECISIONS-0021 ruling 3(b) — *"Each concurrent seat gets its own worktree/lane for code and its OWN record files — per-seat build-log id blocks (closing IMP-023), no shared ACTIVE_WORK.yaml edit, no shared sequence. Parallel writers never touch the same bytes."*'
    part_a_the_scope_algebra: >
      `tools/coordination/scope.py` — parse a scope declaration (a list of path globs, repo-relative),
      normalise it, and answer `overlaps(a, b)`. **FAIL CLOSED (`CD-RULE-003`): IF THE ALGEBRA CANNOT
      PROVE TWO SCOPES DISJOINT, IT REPORTS THEM AS OVERLAPPING.** A "derive or refuse" answer, never
      a plausible one. **AND PRINT THE DECLARED LIMIT OF THE ALGEBRA ON EVERY RUN (`CD-RULE-004`):
      say exactly which glob forms it decides and which it refuses to decide.** Symlinks, `..`
      traversal and case-insensitive collisions are the obvious holes — **DECIDE THEM OR DECLARE THEM,
      and this project treats an undeclared limit as the finding, not the limit itself.**
    part_b_the_live_disjointness_check: >
      `tools/coordination/check_scope_disjoint.py` — over ALL LIVE claims, assert pairwise-disjoint
      write scopes. Non-zero exit NAMES the two seats and the overlapping path. **AND IT MUST ALSO
      ASSERT THE ASYMMETRIC CASE: one seat's WRITE scope against another seat's READ scope. THAT IS
      `CD-PL-F134` AND IT IS THE ONE EVERYBODY FORGETS, INCLUDING THE SEAT THAT RAISED IT.**
    part_c_PER_SEAT_BUILD_LOG_ID_BLOCKS_closing_IMP_023_and_CD_D_173: >
      `governance/coordination/BUILD-LOG-ID-BLOCKS.yaml` — the allocation table, plus
      `tools/coordination/check_build_log_blocks.py` which REFUSES (1) two blocks that overlap and
      (2) a Build Log entry whose id number falls outside its author's allocated block.
      **CURRENT ALLOCATION, MEASURED AND NOT ASSUMED — VERIFY EACH ONE YOURSELF:** `0001`-`0059`
      CLOSED (`CD-D-132`) · `0060`-`0099` CLOSED, exhausted (`CD-D-173`) · `0100`-`0199` PROJECT LEAD
      on `main`, currently at `0139` · `0200`-`0299` the WO-2R3 lane (`CD-D-173`) · **`0300`-`0399`
      YOURS (`CD-D-175`)**.
      *** **DECLARED STOP: IF CLOSING THIS REQUIRES RENUMBERING ANY EXISTING BUILD LOG ENTRY, STOP AND
      RETURN. Rewriting Build Log history is NON-WAIVABLE — corrections supersede, never edit.** ***
      **AND A DISCLOSURE YOU ARE OWED: `IMP-023` DOES NOT EXIST IN THIS REPOSITORY.** The Project Lead
      searched every tracked and untracked path; the string occurs in `PO-DECISIONS-0021.md` and
      NOWHERE ELSE. **THE ONLY DEFINITION AVAILABLE TO YOU IS THE RULING'S OWN CLAUSE, quoted above.
      BUILD TO THAT CLAUSE AND SAY IN YOUR RETURN THAT YOU COULD NOT READ THE REGISTER ENTRY.** This
      is an open Product Authority question (`Q13`) and it is NOT yours to answer.
    part_d_no_shared_ACTIVE_WORK_edit_and_no_shared_sequence: >
      `tools/coordination/check_no_shared_record_write.py` — TWO directions, both required:
      **(1) PROSPECTIVE** — refuse a claim whose declared `write_scope` includes
      `governance/engineering/ACTIVE_WORK.yaml` when the claiming seat is not the ACCOUNTABLE seat.
      **(2) RETROSPECTIVE, OVER A COMMIT RANGE** — refuse when a commit touching `ACTIVE_WORK.yaml`
      carries a non-accountable seat's identity. **PROSPECTIVE-ONLY IS A PROMISE; THE RETROSPECTIVE
      ARM IS WHAT MAKES IT A CONTROL.** Seat identity comes from the git author (`CD-RULE-002`).
    part_e_the_REAL_FIX_FOR_CD_PL_F132_AND_IT_GOES_HERE_BECAUSE_IT_IS_A_SEQUENCE_PROBLEM: >
      `tools/coordination/check_build_log_pointer_atomic.py` — **over a commit range, REFUSE any
      commit that ADDS a `governance/engineering/build-log/BL-*.yaml` entry WITHOUT moving
      `last_build_log_entry` in `ACTIVE_WORK.yaml` IN THAT SAME COMMIT, and REFUSE any commit where
      the pointer's new value does not name a Build Log entry that exists in that commit's tree.**
      **RUN IT BACKWARD OVER THIS PROJECT'S OWN HISTORY AND REPORT THE COUNT IT CATCHES.** The record
      says 4 failures in 91 applications at positions 76, 85, 90 and 91. **DERIVE THAT NUMBER, DO NOT
      COPY IT** — and if your instrument disagrees with the record, **YOUR INSTRUMENT'S NUMBER IS THE
      FINDING AND THE RECORD IS WHAT GETS CORRECTED.** *(The open question `WHEN A RULE IS ADOPTED, IS
      THE RECORD SWEPT BACKWARD FOR THE INSTANCES THAT MOTIVATED IT?` has been on this project's
      docket since `T23` and nobody has answered it. **YOUR BACKWARD RUN ANSWERS IT BY EXAMPLE.**)*

  ITEM_3_THE_MERGE_RECONCILIATION_STEP:
    delivers: 'PO-DECISIONS-0021 ruling 3(c) — *"A MERGE / RECONCILIATION step at the accountable seat that integrates disjoint results and asserts no two seats touched the same artefact."*'
    the_instrument: '`tools/coordination/merge_reconcile.py --base <sha> --claim <task-id> [--claim ...]`'
    the_three_assertions_ALL_REQUIRED: >
      **(1) CONTAINMENT** — for each claim, every path in `git diff --name-only <base>..<seat-tip>` is
      INSIDE that seat's declared `write_scope`. A seat that exceeded its lane is named with the path.
      **(2) NON-OVERLAP — THE ONE THE RULING NAMES** — the pairwise INTERSECTION of the seats'
      touched-path sets is EMPTY. Non-zero exit names the ARTEFACT and BOTH seats.
      **(3) IDENTITY** — every commit in each seat's range carries that seat's `actor_id` in the git
      author (`CD-RULE-002`). **TWO IDENTITIES INTERLEAVED IN ONE HISTORY IS `CD-RULE-002`'S EXACT
      FAILURE MODE AND IT IS WHAT "TWO PROJECT LEADS COMMIT AS ONE IDENTITY AND NOTHING DETECTS IT"
      MEANS IN PRACTICE.**
    it_emits_a_record_and_the_record_is_the_point: >
      `governance/coordination/merges/<utc>-<merge-id>.yaml` — the base, each seat's range and tip,
      each touched-path set, the intersection (empty or not), and the verdict. **`PBG-CONT-007`: a
      sub-agent result that exists only in conversation is not project state.** A merge that happened
      but was not recorded is indistinguishable from one that did not.
    and_the_honest_limit_you_must_declare: >
      `git diff --name-only` measures PATHS, not BYTES. Two seats editing disjoint REGIONS of one file
      is refused by this instrument, and two seats writing the same bytes THROUGH a path neither
      declared (a symlink, a generated file, a `.gitignore`d artefact) is NOT caught by it.
      **DECLARE THAT, PRINT IT ON EVERY RUN, AND DO NOT CLAIM THE STRONGER PROPERTY** (`CD-RULE-004`).

  ITEM_4_THE_LAUNCH_LEASE:
    delivers: 'PO-DECISIONS-0021 ruling 3(d) — *"A LAUNCH LEASE binding BOTH writers — the driver AND the PO''s own hand — refusing a launch whose task or write scope overlaps a live session''s; disjoint-scope launches proceed freely and in parallel."*'
    the_instrument: '`tools/coordination/lease.py acquire|release|list|reap`, leases under `governance/coordination/leases/`, ONE FILE PER LEASE, taken with the SAME `O_EXCL` mechanism as ITEM 1.'
    what_it_refuses_and_what_it_MUST_ADMIT: >
      **REFUSES** when the requested TASK overlaps a live lease's task; when the requested WRITE scope
      overlaps a live lease's WRITE scope; **or when the requested WRITE scope overlaps a live lease's
      READ scope** (`CD-PL-F134` — the auditor whose reading material moved under it).
      *** **ADMITS — AND THIS IS AN EQUAL REQUIREMENT — a launch whose task and scopes are disjoint,
      CONCURRENTLY, WITH THE OTHER LEASE STILL LIVE AND UNDISTURBED.** *** **A LEASE THAT SERIALISES
      IS A FAILED ITEM.**
    liveness_is_MEASURED_not_assumed: >
      A lease names a PID. Liveness is `/proc/<pid>` **plus a cmdline match** — a bare PID check is
      wrong the moment the OS recycles the number, and this project has already had a seat declared
      dead while it was alive and reading (`CD-PL-F143`, a HIGH finding the Project Lead raised
      against a live seat and then WITHDREW). **A STALE LEASE IS REAPED BY AN EXPLICIT `reap` COMMAND
      THAT WRITES WHY, NEVER SILENTLY BY `acquire`.**
    part_i_THE_DRIVER_BINDING: >
      `tools/coordination/launch.sh` — acquires the lease and **REFUSES TO `exec` THE SEAT IF THE
      LEASE IS REFUSED.** Non-zero exit, nothing launched, the refusal printed with the live lease it
      collided with. **THE PLANT MUST SHOW A SEAT NOT STARTING.**
    part_ii_THE_HAND_BINDING_AND_HERE_IS_THE_TRAP_READ_IT_BEFORE_YOU_START: >
      The natural carrier for "the PO's own hand" is a git `pre-commit` hook. *** **YOU CANNOT INSTALL
      ONE AND YOU MUST NOT TRY.** *** `git config core.hooksPath` is `pbg/tools/hooks` — **INSIDE THE
      PINNED, READ-ONLY FRAMEWORK (`PBG-FWK-013`)**. The tracked `pre-commit` there greps
      `^governance/authority/` and nothing else. **EXTENDING IT WOULD BE EDITING `pbg/` TO MAKE A
      CONTROL PASS, WHICH IS A BYPASS AND NOT A FIX. THE PROJECT LEAD WILL REJECT IT.**
      **WHAT YOU DO INSTEAD:** build `tools/coordination/check_lease_held.py` — a standalone,
      invocable check that a governed write is covered by a lease held by the committing identity —
      **AND THEN DECLARE, IN THE `CD-RULE-006` FORM, EXACTLY WHICH LAYER IS MEASURED TO HOLD IT.**
      If the answer is that nothing automatically invokes it, **THE REQUIRED WORDS ARE "NOT PROVED TO
      BE CARRIED ANYWHERE"** and you write them. **DO NOT DRESS AN UNINVOKED CHECK AS A BINDING. THAT
      IS THE `CD-PL-F132` SHAPE EXACTLY — A DISCIPLINE THAT LIVES IN A SEAT'S ATTENTION AND IS CALLED
      STRUCTURAL.** This gap is `Q12`, it is recorded, and it is NOT yours to close.

  ITEM_5_THE_FOUR_PLANTS_IN_CONTRAST_FORM:
    the_form: 'Each plant is a checked-in `git apply`-able patch under `governance/coordination/plants/` plus a runner that executes ALL THREE ARMS and records each arm''s command and `rc` (`CD-RULE-009`, `CD-PL-F131`).'
