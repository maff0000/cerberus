    calculation: "10-year real-earnings P/E, percentiled 0-100"
  - id: buffett_indicator
    name: "Buffett indicator"
    dial: equity_crash
    category: valuation
    tier: 1
    polarity: high_is_worse
    cadence: monthly
    staleness_window_seconds: 18144000  # ~210 days (WO-1.19 Owner ratification, 2026-10-16) - see note
    source: {feed: "Wilshire/GDP", provenance: "public series"}
    calculation: "Total market cap / GDP, percentiled"
    note: "WO-1.19 RELEVANCE WINDOW RATIFIED WIDER, from 3888000 s (45 days) to 18144000 s (210 days). Owner-confirmed (Matt, 2026-10-16), relayed through Trinity from a direct review of the REAL MEASURED release lag in evidence/wo119_release_lag_probe.json. THIS LINE IS THE RATIFIED FIGURE AND IS EDITED AS SUCH: it is NOT recorded in ingestion/catalog.py WINDOW_OVERRIDES, where every other widened window in this project lives, because those exist precisely BECAUSE the ratified document was never going to be edited to match an unconfirmed engineering judgement. This one WAS confirmed, by the Owner, on the numbers below, so the ratified figure moves. THE EVIDENCE: both wired legs were probed against real ALFRED vintages over 14 real quarters (2023-Q1..2026-Q2), asking for the earliest vintage that carried each quarterly observation - the date our own feed could first have seen it. NCBEILQ027S, the SLOWER leg (the Z.1 nonfinancial-corporate-equities series), measured 67 to 101 days FROM THE QUARTER END; GDP, the faster leg, 25 to 84. Both legs carry as_of_rule 'quarter_end' (ingestion/adapters.py), so a reading is aged FROM THE QUARTER END. THE PEAK AGE IS NOT THE LAG: this quarter's reading stays the CURRENT one until the next quarter's print supersedes it, which is one full quarter cycle (~91 days) plus that print's OWN lag after this quarter ended. With the slower leg's measured worst case that is a REAL PEAK OF UP TO ~192 DAYS, far past the 45 days this line declared and past the 120-day ceiling that preceded this change, so a HEALTHY feed read STALE between releases either way - the false STALE Matt read off cerberus-live's dial. WHY 210 AND NOT THE BARE ~200 SAID IN CONVERSATION: the Owner confirmed the DIRECTION and the BALLPARK, not a figure to the day. ~200 would leave the measured 192-day peak only ~8 days of cushion, and that peak is itself a 27-day OUTLIER against the slower leg's 67-74 day norm (2025-Q3, first carried by the 2026-01-09 vintage). A release that slipped the way that one did would re-open exactly the false STALE this change exists to close, so 210 days is adopted to give the measured worst case ~18 days of real headroom for release variance rather than a cushion thinner than the variance already on record. SCOPED, NOT BLANKET: only this row and sloos_bank_lending move; no other indicator's window changes. THIS IS NOW THE WIDEST WINDOW THIS MAPPING DECLARES, and crash_detector.staleness RELEVANCE_WINDOW_CEILING_SECONDS is DERIVED from that widest declaration, so the engine's hard relevance ceiling moves with this line, to 18144000 s. The ceiling's enforcement is unchanged: still REFUSED, never clamped. THE `cadence`, `source` AND `calculation` LINES ARE DELIBERATELY LEFT VERBATIM AS RATIFIED - a ratified declaration is recorded, not rewritten (the same discipline as monetisation_flag below). They still declare a MONTHLY Wilshire/GDP series; what is wired is the QUARTERLY Z.1 ratio, and that declared-vs-wired gap is carried onto the dial by ingestion/catalog.py SUBSTITUTED_FEEDS, which is where it belongs. Only the window was put to the Owner, so only the window moves. ingestion/catalog.py WINDOW_OVERRIDES NO LONGER CARRIES AN ENTRY FOR THIS ROW: that override existed solely to lift this line's 45 days to the old 120-day ceiling, and said in terms that widening further 'means raising a staleness ceiling, which is an Owner decision with external review'. This IS that decision, so the override is redundant and is removed rather than left to shadow the ratified figure. OPEN ITEM, deliberately not attempted here: 210 days is a FLAT window over a rhythm that is NOT flat, so between releases this row will now tolerate a reading older than the release calendar can actually justify, and a genuinely DEAD feed is covered for longer. Closing that needs a per-row RELEASE-CALENDAR MODEL (expected-next-release, not a flat age), which is the next round's work and the only thing that lets this number be tightened back down on evidence."
