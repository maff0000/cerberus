# Crash Detector — indicator mapping registration data (PO-authored, ratified by Matt 2026-08-24)
# This is the CONTENT of the ratified mapping (answers Q30). It is DATA the engine registers,
# not a fabric key — so it travels with the container (portable by construction).
# WEIGHTS are PROVISIONAL starting tiers (x3/x2/x1) — calibrated by BACKTEST, never trusted on assertion.
# DAILY WINDOWS (WO-1.9): 8d FRED business-day series, 7d market-day series; derivation in crash-detector/STATUS.md.
# STALENESS WINDOW is per-indicator RELEVANCE (how old its data may be for ITS cadence) — a DIFFERENT
# quantity from the assurance/publish liveness budget (Q32). A quarterly survey is not dead at 16 minutes.
# DIALS ARE NEVER BLENDED. A "both" indicator scores into each dial with its own polarity.
schema_version: "1.0.0"
provisional_weights_pending_backtest: true
dials: [equity_crash, monetary_debasement]

indicators:
