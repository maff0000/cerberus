    note: "WO-1.19 POLARITY CORRECTION on the monetary_debasement leg, Owner-confirmed (Matt, 2026-10-16, relayed from a direct review of the live dial). The leg read `low_is_better`, which under ingestion/wiring.py POLARITY is RISING_MEANS_MORE_RISK — it scored a RISING copper/gold ratio as MORE debasement. That is backwards: FALLING copper/gold is gold OUTPERFORMING copper, which is the debasement tell, so this leg is `low_is_worse`, the same direction as the equity leg but for a different reason (growth deterioration there, gold strength here) exactly as this row's own `calculation` line has said since ratification. The equity leg is unchanged. STILL HELD, AND NOW FOR A DIFFERENT REASON: the monetary binding is in ingestion/wiring.py HELD_BINDINGS, which held it on precisely this contradiction. The contradiction is resolved; what remains is that NO monetary band has ever been declared for this row in deploy/indicator-scaling.json, and declaring one puts a x2 weight on the monetary dial — a calibration act (Owner/backtest), not a wiring one. OPEN ITEM, deliberately not attempted in WO-1.19."
