# Crash Detector — indicator mapping registration data (PO-authored, ratified by Matt 2026-08-24)
# This is the CONTENT of the ratified mapping (answers Q30). It is DATA the engine registers,
# not a fabric key — so it travels with the container (portable by construction).
# WEIGHTS are PROVISIONAL starting tiers (x3/x2/x1) — calibrated by BACKTEST, never trusted on assertion.
# DAILY WINDOWS (WO-1.9): 8d FRED business-day series, 7d market-day series; derivation in crash-detector/STATUS.md.
# STALENESS WINDOW is per-indicator RELEVANCE (how old its data may be for ITS cadence) — a DIFFERENT
# quantity from the assurance/publish liveness budget (Q32). A quarterly survey is not dead at 16 minutes.
# DIALS ARE NEVER BLENDED. A "both" indicator scores into each dial with its own polarity.
schema_version: "1.0.0"
provisional_weights_pending_backtest: true
dials: [equity_crash, monetary_debasement]

indicators:
  # ---------------- EQUITY CRASH ----------------
  - id: shiller_cape
    name: "Shiller CAPE"
    dial: equity_crash
    category: valuation
    tier: 1            # x3
    polarity: high_is_worse
    cadence: monthly
    staleness_window_seconds: 3888000   # ~45 days
    source: {feed: "multpl/Shiller", provenance: "public series"}
    calculation: "10-year real-earnings P/E, percentiled 0-100"
  - id: buffett_indicator
    name: "Buffett indicator"
    dial: equity_crash
    category: valuation
    tier: 1
    polarity: high_is_worse
    cadence: monthly
    staleness_window_seconds: 3888000
    source: {feed: "Wilshire/GDP", provenance: "public series"}
    calculation: "Total market cap / GDP, percentiled"
  - id: hy_oas
    name: "High-yield OAS"
    dial: equity_crash
    category: credit
    tier: 1
    polarity: high_is_worse
    cadence: daily
    staleness_window_seconds: 691200    # 8 days (WO-1.9): FRED business-day series, worst-case 7d gap + 1d grace
    source: {feed: "FRED:BAMLH0A0HYM2", provenance: "ICE BofA US HY OAS"}
    calculation: "HY option-adjusted spread; 5.0% (500bps) red line"
  - id: ig_oas
    name: "IG corporate spreads"
    dial: equity_crash
    category: credit
    tier: 2            # x2
    polarity: high_is_worse
    cadence: daily
    staleness_window_seconds: 691200    # 8 days (WO-1.9): FRED business-day series, worst-case 7d gap + 1d grace
    source: {feed: "FRED:BAMLC0A0CM", provenance: "ICE BofA US Corp OAS"}
    calculation: "IG option-adjusted spread; widens before HY"
  - id: credit_stress_hyg_lqd
    name: "Credit stress (HYG/LQD)"
    dial: equity_crash
    category: credit
    tier: 2
    polarity: low_is_worse
    cadence: daily
    staleness_window_seconds: 604800    # 7 days (WO-1.9): market-day series, worst-case ~6d gap + 1d grace
    source: {feed: "market:HYG,LQD", provenance: "ETF prices"}
    calculation: "HYG/LQD price ratio; falling = HY underperforming"
  - id: private_credit_stress
    name: "Private credit stress"
    dial: equity_crash
    category: credit
    tier: 2
    polarity: high_is_worse
    cadence: quarterly_with_proxies
    staleness_window_seconds: 10368000  # ~120 days — LATENCY IS THE POINT; absence reads Unknown never calm
    source: {feed: "BDC NAV/non-accrual/PIK + public-spread proxy", provenance: "composite, per-source provenance; lagging"}
    calculation: "BDC NAV discount + non-accrual rate + PIK share; public spreads as fast proxy between marks"
    note: "Added on Matt's call 2026-08-24. Wide window deliberate; proxies bridge slow marks."
  - id: sloos_bank_lending
    name: "Bank lending standards (SLOOS)"
    dial: equity_crash
    category: credit
    tier: 2
    polarity: high_is_worse
    cadence: quarterly
    staleness_window_seconds: 10368000  # ~120 days (quarterly + grace)
    source: {feed: "FRED:DRTSCILM (auto, C&I) + manual NDFI (Fed SLOOS Table 2 Q14, avg 5 sub-cats)", provenance: "ARGUS playbook mechanism"}
    calculation: ">40% net tightening preceded every recession since 1990"
    status: registration_pending   # source identified; shows PENDING until wired, never a false green
  - id: yield_curve_10y3m
    name: "Yield curve (10Y-3M)"
    dial: equity_crash
    category: rates_curve
    tier: 1
    polarity: low_is_worse   # inversion (negative) is worse
    cadence: daily
    staleness_window_seconds: 691200    # 8 days (WO-1.9): FRED business-day series, worst-case 7d gap + 1d grace
    source: {feed: "FRED:T10Y3M", provenance: "NY Fed preferred"}
    calculation: "10y minus 3m; predicted every recession since 1960"
  - id: yield_curve_10y2y
    name: "Yield curve (10Y-2Y)"
    dial: equity_crash
    category: rates_curve
    tier: 1
    polarity: low_is_worse
    cadence: daily
    staleness_window_seconds: 691200    # 8 days (WO-1.9): FRED business-day series, worst-case 7d gap + 1d grace
    source: {feed: "FRED:T10Y2Y", provenance: "public series"}
    calculation: "10y minus 2y; inversion precedes ~89% of crashes"
  - id: real_rate_10y_tips
    name: "10Y real rate (TIPS)"
    dial: [equity_crash, monetary_debasement]   # BOTH
    category: rates_curve
    tier: 3            # x1
    polarity: {equity_crash: high_is_worse, monetary_debasement: high_is_better}  # high real rate = anti-debasement
    cadence: daily
    staleness_window_seconds: 691200    # 8 days (WO-1.9): FRED business-day series, worst-case 7d gap + 1d grace
    source: {feed: "FRED:DFII10", provenance: "10y TIPS yield"}
    calculation: "High real rates = equity headwind AND debasement suppressant (opposite polarity)"
  - id: jobless_claims_4w
    name: "Initial jobless claims (4w)"
    dial: equity_crash
    category: labour_activity
    tier: 2
    polarity: high_is_worse
    cadence: weekly
    staleness_window_seconds: 1209600   # ~14 days
    source: {feed: "FRED:IC4WSA", provenance: "public series"}
    calculation: "20-30% rise off trough preceded every recession since 1970"
  - id: sahm_rule
    name: "Sahm rule"
    dial: equity_crash
    category: labour_activity
    tier: 2
    polarity: high_is_worse
    cadence: monthly
    staleness_window_seconds: 3888000
    source: {feed: "FRED:SAHMREALTIME", provenance: "public series"}
    calculation: "Fires at 0.50; perfect pre-2024, one false signal Jul-2024"
  - id: ism_manufacturing
    name: "ISM manufacturing"
    dial: equity_crash
    category: labour_activity
    tier: 3
    polarity: low_is_worse
    cadence: monthly
    staleness_window_seconds: 3888000
    source: {feed: "ISM", provenance: "public series"}
    calculation: "Below 93 strongly recession-associated"
  - id: michigan_sentiment
    name: "Michigan sentiment"
    dial: equity_crash
    category: labour_activity
    tier: 3
    polarity: low_is_worse
    cadence: monthly
    staleness_window_seconds: 3888000
    source: {feed: "FRED:UMCSENT", provenance: "public series"}
    calculation: "Below 65 = signal; DEMOTED, unreliable post-2022"
  - id: breadth_rsp_spy
    name: "Breadth divergence (RSP/SPY)"
    dial: equity_crash
    category: volatility_internals
    tier: 1
    polarity: low_is_worse
    cadence: daily
    staleness_window_seconds: 604800    # 7 days (WO-1.9): market-day series, worst-case ~6d gap + 1d grace
    source: {feed: "market:RSP,SPY", provenance: "ETF prices"}
    calculation: "Equal- vs cap-weight S&P; falling = narrow leadership precedes tops"
  - id: constituent_breadth_200dma
    name: "Constituent breadth (% of 50 large-caps above 200dma)"
    dial: equity_crash
    category: volatility_internals
    tier: 3             # x1 -- lowest weight: provisional, sample-defined, never scored in the legacy engine
    polarity: low_is_worse
    cadence: daily
    staleness_window_seconds: 604800    # 7 days, same market-day window as breadth_rsp_spy (WO-1.9)
    source: {feed: "market:50-name large-cap sample (Yahoo chart, dividend-adjusted)", provenance: "stock prices; a DEFINED SAMPLE, not the S&P 500"}
    calculation: "Percent of a fixed 50-name large-cap sample whose latest close is above its own 200-day mean; needs >=30 of 50 to resolve"
    note: "WO-1.10 addition (NOT part of the 2026-08-24 ratified set; Matt's narrow-leadership concern, dispatched by Trinity). Direct breadth, where breadth_rsp_spy is an indirect proxy; both stay."
  - id: cboe_skew
    name: "CBOE SKEW"
    dial: equity_crash
    category: volatility_internals
    tier: 2
    polarity: high_is_worse
    cadence: daily
    staleness_window_seconds: 604800    # 7 days (WO-1.9): market-day series, worst-case ~6d gap + 1d grace
    source: {feed: "CBOE:SKEW", provenance: "public series"}
    calculation: "Tail-risk pricing; high SKEW + low VIX = danger"
  - id: vix_term_structure
    name: "VIX term structure"
    dial: equity_crash
    category: volatility_internals
    tier: 2
    polarity: high_is_worse
    cadence: daily
    staleness_window_seconds: 604800    # 7 days (WO-1.9): market-day series, worst-case ~6d gap + 1d grace
    source: {feed: "CBOE:VIX,VIX3M", provenance: "public series"}
    calculation: "VIX/VIX3M > 1.0 = backwardation = acute stress"
  - id: vix_level
    name: "VIX level"
    dial: equity_crash
    category: volatility_internals
    tier: 3
    polarity: high_is_worse
    cadence: daily
    staleness_window_seconds: 604800    # 7 days (WO-1.9): market-day series, worst-case ~6d gap + 1d grace
    source: {feed: "CBOE:VIX", provenance: "public series"}
    calculation: "Concurrent gauge; DEMOTED for term structure"
  - id: spx_vs_200dma
    name: "S&P 500 vs 200-day MA"
    dial: equity_crash
    category: volatility_internals
    tier: 3
    polarity: low_is_worse
    cadence: daily
    staleness_window_seconds: 604800    # 7 days (WO-1.9): market-day series, worst-case ~6d gap + 1d grace
    source: {feed: "market:SPX", provenance: "index"}
    calculation: "Below 200-DMA = bear; >15% above = overextended"
  - id: copper_gold
    name: "Copper/gold ratio"
    dial: [equity_crash, monetary_debasement]   # BOTH
    category: volatility_internals
    tier: 2
    polarity: {equity_crash: low_is_worse, monetary_debasement: low_is_worse}  # falling is worse on BOTH dials, for two different reasons
    cadence: daily
    staleness_window_seconds: 604800    # 7 days (WO-1.9): market-day series, worst-case ~6d gap + 1d grace
    source: {feed: "market:HG,GC", provenance: "futures"}
    calculation: "Falling = growth deterioration (equity) AND gold strength (debasement)"
    note: "WO-1.19 POLARITY CORRECTION on the monetary_debasement leg, Owner-confirmed (Matt, 2026-10-16, relayed from a direct review of the live dial). The leg read `low_is_better`, which under ingestion/wiring.py POLARITY is RISING_MEANS_MORE_RISK — it scored a RISING copper/gold ratio as MORE debasement. That is backwards: FALLING copper/gold is gold OUTPERFORMING copper, which is the debasement tell, so this leg is `low_is_worse`, the same direction as the equity leg but for a different reason (growth deterioration there, gold strength here) exactly as this row's own `calculation` line has said since ratification. The equity leg is unchanged. STILL HELD, AND NOW FOR A DIFFERENT REASON: the monetary binding is in ingestion/wiring.py HELD_BINDINGS, which held it on precisely this contradiction. The contradiction is resolved; what remains is that NO monetary band has ever been declared for this row in deploy/indicator-scaling.json, and declaring one puts a x2 weight on the monetary dial — a calibration act (Owner/backtest), not a wiring one. OPEN ITEM, deliberately not attempted in WO-1.19."
  - id: chicago_fed_nfci
    name: "Chicago Fed NFCI"
    dial: equity_crash
    category: financial_conditions_policy
    tier: 2
    polarity: high_is_worse
    cadence: weekly
    staleness_window_seconds: 1209600
    source: {feed: "FRED:NFCI", provenance: "public series"}
    calculation: "105 variables; positive = tighter; leads GDP 1-2 quarters"
  - id: fed_funds_rate
    name: "Fed funds rate"
    dial: [equity_crash, monetary_debasement]   # BOTH
    category: financial_conditions_policy
    tier: 2
    polarity: {equity_crash: high_is_worse, monetary_debasement: low_is_worse}  # easy policy = debasement
    cadence: daily
    staleness_window_seconds: 604800   # ~7 days
    source: {feed: "FRED:DFF", provenance: "public series"}
    calculation: "300+bps cumulative hikes = danger (equity); easy policy = debasement"

  # ---------------- MONETARY DEBASEMENT ----------------
  - id: gold_real_rate_cross
    name: "Gold real-rate cross"
    dial: monetary_debasement
    category: master_tells
    tier: 1
    polarity: high_is_worse
    cadence: weekly
    staleness_window_seconds: 1209600
    source: {feed: "market:GC + FRED:DFII10", provenance: "derived"}
    calculation: "Gold vs 10y TIPS divergence, normalised 0-100; the classic debasement tell"
  - id: monetisation_flag
    name: "Monetisation flag (balance-sheet growth + core CPI)"
    dial: monetary_debasement
    category: master_tells
    tier: 1
    polarity: high_is_worse
    cadence: quarterly
    staleness_window_seconds: 10368000
    source: {feed: "Treasury/BEA deficit + interest-cost", provenance: "derived, playbook"}
    calculation: "Deficit/GDP vs interest-cost/revenue, discriminated vs benign growth"
    note: "WO-1.19 RENAME, Owner-confirmed (Matt, 2026-10-16). THIS ROW WAS RATIFIED ON 2026-08-24 AS `fiscal_dominance`, name 'Fiscal dominance discriminator', and that name was WRONG ABOUT WHAT IS WIRED. What ingestion/engine actually compute for it is the legacy ARGUS crash-engine discriminator (ingestion.catalog SUBSTITUTED_FEEDS, crash_detector.engine.derivations FISCAL_CONJUNCTION): Fed balance-sheet (FRED WALCL) growth >= 10% over 12 months AND core CPI (FRED CPILFESL) >= 4% annualised over 3 months, as a 0/1 conjunction. That is a MONETISATION conjunction, a DIFFERENT QUANTITY from the deficit/interest-burden measure the `source` and `calculation` lines below describe. The Owner's direction is to stop claiming the deficit name for the monetisation figure, so the id and name say monetisation and the figure is unchanged. THE `source` AND `calculation` LINES ARE DELIBERATELY LEFT VERBATIM AS RATIFIED: a ratified declaration is recorded, not rewritten (the same discipline as ingestion.wiring WIRED_DESPITE_PENDING_STATUS), and the gap between what they declare and what is wired is the disclosure SUBSTITUTED_FEEDS exists to carry onto the dial. THE ID `fiscal_dominance` IS RESERVED, NOT RETIRED, and is NOT reused for anything else: the real Treasury/BEA deficit-and-interest-cost measure those two lines declare is still OWED, and the slot it belongs in already exists — `fiscal_master`, the IDENTITY master over this row in crash_detector.engine.statistics MONETARY_DEBASEMENT_MASTERS, which is one of the three masters DECISION-RULE.md's acute statistic maximises (governance/WO-1.3a-engine-spec.md: acute_monetary = max(fiscal_master, real_rate_master, currency_master)). When that indicator is built it takes the reserved id and that master's component, and `fiscal_master` keeps its name throughout — master ids are PERSISTED (evaluator/history_store.py acute_from_master_id, master_scores), so renaming one would break the recorded history of readings. OPEN ITEM. NOT BUILT HERE: no new row is added by WO-1.19 and nothing about the figure, the band (0 -> 1, the identity on a flag) or the WATCH-ONLY demotion of `fiscal_master` changes."
  - id: m2_yoy
    name: "M2 money supply YoY"
    dial: [monetary_debasement, equity_crash]   # BOTH
    category: money_currency
    tier: 2
    polarity: {monetary_debasement: high_is_worse, equity_crash: low_is_worse}  # expansion=debasement / contraction=bearish
    cadence: monthly
    staleness_window_seconds: 3888000
    source: {feed: "FRED:M2SL", provenance: "public series"}
    calculation: "Expansion = debasement; the 2022-23 contraction coincided with a bear market"
  - id: broad_dollar
    name: "Broad dollar (DTWEXBGS)"
    dial: monetary_debasement
    category: money_currency
    tier: 2
    polarity: low_is_worse   # dollar weakness = debasement
    cadence: weekly
    staleness_window_seconds: 1209600
    source: {feed: "FRED:DTWEXBGS", provenance: "public series"}
    calculation: "Trade-weighted broad dollar; sustained weakness = debasement"
  - id: gold_spot
    name: "Gold spot"
    dial: monetary_debasement
    category: money_currency
    tier: 2
    polarity: high_is_worse
    cadence: daily
    staleness_window_seconds: 604800    # 7 days (WO-1.9): market-day series, worst-case ~6d gap + 1d grace
    source: {feed: "market:XAUUSD (HERMES published H4 candle close, instrument XAU_USD, live OANDA spot)", provenance: "spot"}
    calculation: "Absolute gold trend; corroborates the real-rate cross"
    note: "WO-1.12 SOURCE CHANGE, NOT A FEED SUBSTITUTION: the ratified feed is still market:XAUUSD with provenance spot, and HERMES publishes live OANDA XAU/USD, which IS spot gold — not a futures contract and not a fix. It REPLACES the LBMA gold-fix endpoint, which answers HTTP 403 to this host and delivered no reading at all from WO-1.6 to WO-1.12. DISCLOSED MATURITY CAVEAT, stated rather than smoothed over: HERMES is a SEPARATE SYSTEM in another seat's domain and its publishing service is labelled NON_PROMOTED_ENGINEERING_CANDIDATE with ENVIRONMENT=DEV and RUN_ENV=STAGING — it is NOT a promoted production service. Its PRICE DATA is nevertheless real: it runs OANDA_ENVIRONMENT=live, so these are live OANDA quotes and not a demo feed. Matt accepted that maturity caveat explicitly ('good enough, will be maintained'). DISCLOSED COARSENING: the figure is the close of the FIRST H4 candle HERMES publishes each UTC day — a defined, reproducible once-a-day reference in the same spirit as the LBMA daily fix it replaces, NOT an intraday tick. Transport is a read-only Redis GET on a LAN peer, so it is declared in ingestion.catalog.NON_HTTP_PEERS and NOT in deploy/egress-destinations.yaml; the reason is recorded there. See ingestion.catalog (hermes.xau_usd.h4_close) and ingestion.adapters.HERMES_PEER."
  - id: cpi_yoy
    name: "CPI YoY"
    dial: monetary_debasement
    category: inflation
    tier: 3
    polarity: high_is_worse
    cadence: monthly
    staleness_window_seconds: 3888000
    source: {feed: "FRED:CPIAUCSL", provenance: "public series"}
    calculation: "Headline CPI year-over-year"
  - id: core_pce_yoy
    name: "Core PCE YoY"
    dial: monetary_debasement
    category: inflation
    tier: 3
    polarity: high_is_worse
    cadence: monthly
    staleness_window_seconds: 3888000
    source: {feed: "FRED:PCEPILFE", provenance: "public series; Fed preferred"}
    calculation: "Core PCE year-over-year"
  - id: breakeven_5y
    name: "5Y breakeven inflation"
    dial: monetary_debasement
    category: inflation
    tier: 2
    polarity: high_is_worse
    cadence: daily
    staleness_window_seconds: 691200    # 8 days (WO-1.9): FRED business-day series, worst-case 7d gap + 1d grace
    source: {feed: "FRED:T5YIE", provenance: "public series"}
    calculation: "5y nominal minus 5y TIPS; market-implied inflation expectations"
