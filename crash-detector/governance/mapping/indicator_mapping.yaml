    tier: 1
    polarity: high_is_worse
    cadence: quarterly
    staleness_window_seconds: 10368000
    source: {feed: "Treasury/BEA deficit + interest-cost", provenance: "derived, playbook"}
    calculation: "Deficit/GDP vs interest-cost/revenue, discriminated vs benign growth"
    note: "WO-1.19 RENAME, Owner-confirmed (Matt, 2026-10-16). THIS ROW WAS RATIFIED ON 2026-08-24 AS `fiscal_dominance`, name 'Fiscal dominance discriminator', and that name was WRONG ABOUT WHAT IS WIRED. What ingestion/engine actually compute for it is the legacy ARGUS crash-engine discriminator (ingestion.catalog SUBSTITUTED_FEEDS, crash_detector.engine.derivations FISCAL_CONJUNCTION): Fed balance-sheet (FRED WALCL) growth >= 10% over 12 months AND core CPI (FRED CPILFESL) >= 4% annualised over 3 months, as a 0/1 conjunction. That is a MONETISATION conjunction, a DIFFERENT QUANTITY from the deficit/interest-burden measure the `source` and `calculation` lines below describe. The Owner's direction is to stop claiming the deficit name for the monetisation figure, so the id and name say monetisation and the figure is unchanged. THE `source` AND `calculation` LINES ARE DELIBERATELY LEFT VERBATIM AS RATIFIED: a ratified declaration is recorded, not rewritten (the same discipline as ingestion.wiring WIRED_DESPITE_PENDING_STATUS), and the gap between what they declare and what is wired is the disclosure SUBSTITUTED_FEEDS exists to carry onto the dial. THE ID `fiscal_dominance` IS RESERVED, NOT RETIRED, and is NOT reused for anything else: the real Treasury/BEA deficit-and-interest-cost measure those two lines declare is still OWED, and the slot it belongs in already exists — `fiscal_master`, the IDENTITY master over this row in crash_detector.engine.statistics MONETARY_DEBASEMENT_MASTERS, which is one of the three masters DECISION-RULE.md's acute statistic maximises (governance/WO-1.3a-engine-spec.md: acute_monetary = max(fiscal_master, real_rate_master, currency_master)). When that indicator is built it takes the reserved id and that master's component, and `fiscal_master` keeps its name throughout — master ids are PERSISTED (evaluator/history_store.py acute_from_master_id, master_scores), so renaming one would break the recorded history of readings. OPEN ITEM. NOT BUILT HERE: no new row is added by WO-1.19 and nothing about the figure, the band (0 -> 1, the identity on a flag) or the WATCH-ONLY demotion of `fiscal_master` changes."
