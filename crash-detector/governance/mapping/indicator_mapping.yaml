    calculation: ">40% net tightening preceded every recession since 1990"
    status: registration_pending   # source identified; shows PENDING until wired, never a false green
    note: "WO-1.19 RELEVANCE WINDOW RATIFIED WIDER, from 10368000 s (120 days) to 12960000 s (150 days). Owner-confirmed (Matt, 2026-10-16), relayed through Trinity from a direct review of the REAL MEASURED release lag in evidence/wo119_release_lag_probe.json. THIS LINE IS THE RATIFIED FIGURE AND IS EDITED AS SUCH, not recorded as an ingestion/catalog.py WINDOW_OVERRIDES entry: those exist because the ratified document was never going to be edited for an unconfirmed engineering judgement, and this figure WAS confirmed by the Owner on the numbers below. THE EVIDENCE: both legs (FRED DRTSCILM, C&I, and DRTSCIS, the second leg added earlier in WO-1.19) were probed against real ALFRED vintages over 15 real quarters (2023-Q1..2026-Q3), asking for the earliest vintage that carried each quarterly observation. Each leg's own first-vintage lag measured 30 to 42 days FROM THE QUARTER START - identically on both legs, which print together as one SLOOS release. Both legs carry as_of_rule 'obs_date' (ingestion/adapters.py), so a reading is aged FROM THE QUARTER START, not from the date it was released. THE PEAK AGE IS NOT THE LAG: this quarter's reading stays the CURRENT one until the NEXT quarter's print supersedes it, which is one full quarter cycle (~91 days) plus that next print's OWN lag (up to 42 days) after THIS quarter started - a REAL MEASURED PEAK OF UP TO ~133 DAYS. The ratified 120 days therefore read STALE on a perfectly healthy feed for up to ~13 days before every release, which is the false STALE Matt read off cerberus-live's dial. 150 days covers the measured 133-day peak with ~17 days of margin for a release that slips - deliberately more than a token cushion, because the measured lag already varies by 12 days across the 15 quarters (30 to 42, the 42 being 2024-Q4's 2024-11-12 vintage) and 2026-Q3 was not yet carried by any vintage within the probe's 400-day horizon. SCOPED, NOT BLANKET: only this row and buffett_indicator move; no other indicator's window changes. This row is NOT the widest the mapping declares - buffett_indicator's 210 days is - so the engine's relevance ceiling is derived from that row, not this one. The `source` line is deliberately left VERBATIM AS RATIFIED and still names a manual NDFI leg that no longer exists; the declared-vs-wired gap is carried by ingestion/catalog.py SUBSTITUTED_FEEDS, and `status` is untouched here. OPEN ITEM, the same one buffett_indicator carries: 150 days is a FLAT window over a rhythm that is not flat, so between releases this row tolerates a reading older than the release calendar can justify and a DEAD feed is covered for longer. A per-row RELEASE-CALENDAR MODEL is the next round's work and the only thing that lets this number be tightened on evidence."
