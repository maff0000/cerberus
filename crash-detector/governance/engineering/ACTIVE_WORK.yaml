- '*** **Q32 — NEW AND OPEN, HIGH, AND IT BLOCKS 16B INDEPENDENTLY OF Q30. RAISED BY CD-ENG-WO3-03 AS
  F01 AND REPRODUCED BY THE PROJECT LEAD AGAINST THE LIVE CLASS AT BL-20260824T081819Z-0159. NEITHER
  SEAT CUTS IT.** *** **THE STALENESS CEILING IS 900 SECONDS AND IT REFUSES EVERY WINDOW THE RATIFIED
  MAPPING REQUIRES.** Measured: `src/crash_detector/staleness.py:382` `STALENESS_WINDOW_CEILING_SECONDS
  = 900.0`; `StalenessWindow(seconds=...)` -> hourly (3600) **REFUSED**, daily (86400) **REFUSED**,
  monthly (2592000) **REFUSED**, quarterly (7776000) **REFUSED**, all `StalenessWindowOutOfRange`.
  **PO-DECISIONS-0025 ruling 6 requires a WIDE window for private credit stress *"because its latency
  IS the point"*, and ruling 4 registers SLOOS''s NDFI leg as manual-QUARTERLY. BOTH ARE REFUSED BY
  CONSTRUCTION TODAY.** *** **AND THIS IS NOT A BUG A SEAT MAY FIX.** The ceiling is DERIVED and
  carries its own derivation as DATA — `STALENESS_WINDOW_CEILING_SOURCE`: *"PID.md §5, assurance
  latency budget, RATIFIED 2026-08-18 (CD-D-003 resolved): pipeline/publication failure independently
  detectable <= 15 minutes. A staleness window wider than the detectability budget renders a dead feed
  as fresh for longer than the product permits failure to go undetected."* **WIDENING IT WOULD BE A
  SEAT MOVING A RATIFIED PID NUMBER. THE ENGINEER REFUSED TO AND WAS RIGHT TO REFUSE.** *** **THE
  DIAGNOSIS, ADOPTED FROM THE ENGINEER AND STATED AS A READING AND NOT A RULING: TWO DIFFERENT
  QUANTITIES ARE SHARING ONE UNIT AND ONE CEILING.** The 900s bound reasons about **FEED LIVENESS** —
  how long a DEAD feed may masquerade as fresh before detection. A per-indicator relevance window
  reasons about **DATA CADENCE** — how often the underlying series actually moves. **A QUARTERLY
  LENDING SURVEY IS NOT A DEAD FEED AT SIXTEEN MINUTES.** Options, none chosen here: (a) separate the
  two concepts into different types with different bounds, leaving PID §5''s number untouched in its
  own meaning; (b) make the ceiling per-criticality or per-cadence-class; (c) read PID §5''s budget as
  governing the publication pipeline rather than every input series. **IT IS PRODUCT MEANING WITH A
  RATIFIED NUMBER UNDER IT AND THE PROJECT LEAD DOES NOT CUT IT.** *** **THE VALUE OF FINDING IT NOW:
  Q30 LOOKED LIKE THE ONLY THING BETWEEN THIS PROJECT AND ITS FIRST ROW. IT IS NOT. HAD 16A BEEN
  SKIPPED AND 16B ATTEMPTED THE MOMENT THE MAPPING ARRIVED, THIS WOULD HAVE SURFACED WITH THE CONTENT
  IN HAND AND A SEAT UNDER PRESSURE TO WIDEN A RATIFIED CONSTANT TO MAKE THE ROWS LAND.** Next actor
  PRODUCT_AUTHORITY. Silent execution PROHIBITED. ***'
- '*** **Q31 — NEW AND OPEN, AND IT DOES NOT BLOCK. RAISED AT BL-20260824T071442Z-0158.** *** **THERE
  IS NO REDIS IN THIS DESIGN AT ALL.** `grep -rin redis src/ deploy/ db/ contracts/` -> **NO MATCHES**,
  while `PO-DECISIONS-0025` ruling 2 makes binding *"independent Docker container; SQL + Redis in
