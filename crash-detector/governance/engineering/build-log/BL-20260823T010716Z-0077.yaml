  THE_STRUCTURAL_ANSWER_AND_IT_IS_WHY_THIS_IS_NOT_guarded_s_SHAPE: >
    **THE DOOR'S ARITY IS OPEN FOR EXACTLY ONE INSTRUCTION.** `signature.bind(*args, **kwargs)`
    binds against THE ENTRY POINT'S OWN REAL SIGNATURE, so the openness is ERASED AT THE FIRST
    STATEMENT and cannot admit anything that signature would not. **AND ARMS E AND F CLOSE THE
