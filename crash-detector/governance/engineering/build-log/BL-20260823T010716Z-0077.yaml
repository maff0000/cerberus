    OPEN CHANNEL fault and every call to it is refused. There is no shape in which a value reaches
    an entry point through this wrapper without being bound and checked.
    **`guarded` DIFFERS BECAUSE IT FORWARDS `*extra` TO A CALLEE WHOSE SIGNATURE IT DOES NOT BIND
    AGAINST.** That is the whole of the asymmetry, and it is the answer to the symmetry question
    ruling 6 asked — the two wrappers look alike and are not.
  arm_D_earns_its_row: >
    `bound.apply_defaults()` runs BEFORE the loop, so a door cannot ship a bad value in its own
    signature and escape by never being called wrongly. That is a real property nobody had asserted.

