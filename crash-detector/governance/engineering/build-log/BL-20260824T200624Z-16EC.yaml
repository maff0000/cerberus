      IN_PROGRESS, PAUSED_SAFE, PAUSED_AMBER, BLOCKED, WAITING_PRODUCT_AUTHORITY,
      WAITING_ASSURANCE, WAITING_EXTERNAL_DEPENDENCY, COMPLETE, SUPERSEDED, ABANDONED]` — and
