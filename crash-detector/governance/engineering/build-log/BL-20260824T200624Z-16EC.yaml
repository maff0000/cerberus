      field validates would be a BYPASS, not a fix** (`PBG-FWK-013`). The entry carries
      `status: WAITING_ASSURANCE` — the schema's own spelling of the same state — plus an explicit
      `return_status: READY_FOR_ASSURANCE` field and a comment at the point of the constraint.
      **`CD-ENG-WO3-12` MET THE IDENTICAL CONSTRAINT AND RESOLVED IT THE SAME WAY** at
      `BL-20260824T183401Z-16DF`, which is evidence that this is a standing framework property and
      not a one-off. Repairing PBG is a separate bounded dispatch and is not folded into an
      application increment (`pbg/roles/engineer.md`: *"do not repair PBG under an application
      dispatch"*).
    two_more_framework_observations_from_the_same_validation_pass: >-
      (i) `pbg.continuity.validate` resolves `schema_dir` to `<root>/schemas` by default, which does
      not exist on this project — the schemas are at `pbg/schemas/`. Validating an entry therefore
      requires passing `schema_dir` explicitly, and a seat that ran the default would get a
      `FileNotFoundError` rather than a verdict. (ii) The known-and-recorded `pbg log validate`
      false-green (it reports GREEN having validated ZERO entries) is why this seat validated by
      DIRECT CALL to `pbg.continuity.validate` with the git SHA set supplied, and reported the
      result above rather than a tool's summary.

