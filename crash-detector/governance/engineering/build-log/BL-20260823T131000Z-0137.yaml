  and_this_is_the_docket_shape_ARRIVING_AGAIN_MID_DISPATCH: >
    **`CD-PL-F111` -> `CD-PL-F112` -> `CD-PL-F132` is the sequence where a discipline living only
    in a seat's attention failed, was given "a structural fix", and then failed again at that
    fix's ninth application.** The dispatch on the desk at this very moment calls `CD-PL-F132`
    *"the measured half-life of a discipline that lives only in a seat's attention, and it is the
    single most load-bearing item on this docket"*. **THIS SEAT PRODUCED A FRESH INSTANCE OF THAT
    EXACT CLASS WHILE WRITING THE DISPATCH THAT AUDITS IT.** No commentary this seat could add
    would be worth more to the auditor than that fact stated plainly.
  the_remedy_this_seat_will_NOT_self_adopt: >
    **A CARRIER, NOT A RESOLUTION.** The obvious one is a uniqueness check over
    `governance/engineering/build-log/` that fails when an ID is minted twice — cheap, mechanical,
    and it would have caught this in under a second. **THIS SEAT IS NOT WRITING IT AT THIS
    BOUNDARY, AND THAT IS DELIBERATE:** `CD-PL-F112`'s remedy was *"a resolution not to forget"*
    and it failed; `CD-PL-F132`'s was a structural fix that this seat wrote FOR ITSELF and it
    failed at its ninth application. **A THIRD SELF-PRESCRIBED FIX WRITTEN BY THE SUBJECT, HOURS
    BEFORE THE AUDIT OF WHY SELF-PRESCRIBED FIXES KEEP FAILING, WOULD BE THE FOURTH INSTANCE OF
    THE PATTERN AND NOT A CURE FOR IT.** It goes to `CD-META-01` as evidence, and the carrier is
    designed after the auditor has said where such carriers must live.
  what_it_does_NOT_excuse: '**THE COLLISION IS THIS SEAT''S ERROR AND THE ABSENCE OF AN ALLOCATOR DOES NOT MITIGATE IT.** `grep` was available; this seat did not run it before minting.'

