what_changed_in_the_code_path:
  property_a__no_undecorated_evaluator_object_exists_at_runtime:
    the_code_path: >
      `_absence_is_never_a_number` no longer closes over the evaluator. `_body_materials` takes
      `(__code__, __globals__, __name__, __defaults__, __kwdefaults__)` and the function object is
      never referenced below that line, so it is unreachable and collected. `guarded` rebuilds a
      body with `types.FunctionType` PER CALL and drops it. A body with free variables is REFUSED
      AT IMPORT, because carrying its cells would be carrying exactly what the ruling calls the
      defect class.
    the_contrast_BOTH_ARMS: |
      tests/test_the_absence_door.py::test_the_attack_that_felled_the_ruling_finds_no_callable_at_all
      ARM 1  THE SHIPPED DOOR, obtained from `sys.modules` as the attack obtains it:
             __closure__ callables      : []
             __wrapped__                : [] (never created)
             __globals__ callables      : []
             module namespace callables : []
             door.__dict__ callables    : []
      ARM 2  THE CONTROL — the same walk, the same payload, a decorator built THE OLD WAY
             (`functools.wraps` over a cell holding the naked function):
             __closure__ callables      : NON-EMPTY, and calling one RETURNS A `Value` from a
                                          starved dial — the judgement reached with no door
             __wrapped__                : NON-EMPTY
      ONE AXIS: whether the mechanism carries the body as a `code` object or as a function object.
    what_it_does_NOT_close__MEASURED_AND_ASSERTED_TRUE: >
      **DECLARED LIMIT 10.** `types.FunctionType(code, globals)` over the materials still in the
      cells RECONSTITUTES a callable body, and calling it reaches the judgement with neither the
      establishment nor the post-condition applied. **THE CARRIER ASSERTS THIS RESIDUE *TRUE*** —
      `test_the_reconstitution_residue_is_real_and_is_declared_limit_10` performs the
      reconstitution and requires it to SUCCEED — so the paragraph cannot go stale in the
      reassuring direction. **PROPERTY (a) IS MET AS THE RULING STATES IT (no undecorated
      evaluator OBJECT EXISTS); THE `__closure__` REACH IS NOT CLOSED AND IS NOT CLAIMED CLOSED.**
      What changed is the COST: construct a callable rather than read one out of a cell.
  property_b__the_establishment_is_derived_from_the_signature:
    the_code_path: >
      `_establishment_derived_from` resolves the evaluator's annotations with
      `typing.get_type_hints` (they are STRINGS under `from __future__ import annotations`;
      reading them would be reading source text) and compiles one admission per parameter through
      `crash_detector.admission.declaration`. A union unwraps to `one_of(...)`; a subscripted
      generic to its origin; **anything else RAISES AT IMPORT**, uncaught. An OPEN CHANNEL and an
      UNANNOTATED parameter each raise `AdmissionFault` at decoration. **NOBODY WRITES A PARAMETER
      LIST.**
    the_contrast_BOTH_ARMS__THE_ADD_A_PARAMETER_ARM_THE_DISPATCH_CALLS_THE_WHOLE_OF_b: |
      tests/test_the_absence_door.py::test_adding_a_parameter_is_established_without_anyone_editing_the_guard
        def a_body_with_a_fourth_parameter(spec: DialSpec, usable: dict,
                                           now_utc: datetime, weighting: float) -> "Reading": ...
        door = evaluate._absence_is_never_a_number(a_body_with_a_fourth_parameter)   # UNEDITED
      ARM 1  THE DERIVED GUARD (no line of the mechanism mentions `weighting`):
             declared_admissions(door)          -> ['now_utc', 'spec', 'usable', 'weighting']
             ...['weighting'].describe()        -> 'float'
             door(spec, {}, NOW, 1.0)           -> Unknown          (admitted)
             door(spec, {}, NOW, "1.0")         -> NotAdmitted, and the message names `weighting`
      ARM 2  THE COUNTERFACTUAL — the OLD NET's shape, `*extra, **extra_by_name`, same body:
             gaping(spec, {}, NOW, "1.0")       -> Unknown          (ADMITTED UNESTABLISHED)
             is_admitting_door(gaping)          -> False
      ONE AXIS: whether the wrapper derives or gapes. **THE OLD NET'S OPEN ARITY BOUND NOTHING,
      AND THAT IS THE FINDING PO-DECISIONS-0015 RULING 1 RECORDS, RE-MEASURED HERE.**
  property_c__the_post_condition_is_retained_inside_the_same_mechanism:
    the_code_path: >
      One wrapper, one closure. `guarded` calls `refuse_a_number_without_its_inputs` BY THAT
      LITERAL NAME so `tools/register/declared_nets.py`'s third assertion is checked against this
      code and not against a sentence about it, and WHICH arguments it receives is derived from
      its own signature.
    the_contrast_BOTH_ARMS: |
      tests/test_the_absence_door.py::test_the_post_condition_still_refuses_a_number_a_rewritten_body_paid_for
      ARM 1  the mechanism applied to a body that pays a number for nothing -> AbsenceYieldedAValue
      ARM 2  the identical body with NO mechanism applied                   -> returns a `Value`
    honest_note: >
      **THIS IS THE ONE ARM OF THE ELEVEN THAT PASSES AT `314592c`, AND IT SHOULD.** (c) is a
      RETENTION property — the post-condition was already there and had to survive. A carrier that
      failed at the base would mean the redesign had introduced it, which is not the claim.
  the_criterion_half__membership_moves_on_real_bindings_and_measured_reach:
    what_moved__TWO_THINGS_AND_NO_MORE: |
      (i)  MEMBERSHIP. A module-level `def` is a subject if it is PUBLIC **or if its return
           annotation names a JUDGEMENT VALUE TYPE.** A callable that PRODUCES A JUDGEMENT is a
           judgement-path door whatever it is spelled. That is a property of the artefact and it
           survives renaming the identifier IN EITHER DIRECTION.
      (ii) THE ESCAPE-ROUTE DESTINATION TEST. It asked whether the destination's IDENTIFIER was
           public and treated a private one as a dead end — `guarded`'s reason line read
           *"reaches only ['_evaluate_dial'], every one of them non-public"*, the FALSE sentence
           Ground 1 falsified. It now asks whether the destination is ITSELF AN ENUMERATED
           SUBJECT with a def site to assert; if it is, the local's obligation is **RESOLVED**
           there — at the name a caller writes — rather than DENIED.
    the_second_door_form__because_a_derived_door_has_no_argument_list_to_compare: >
      `tools/register/declared_door_mechanisms.py`, NEW, and it is DATA CHECKED AGAINST THE CODE
      exactly as `declared_nets.py` is: the mechanism must EXIST, must read `inspect.signature`,
      must compile through `crash_detector.admission.declaration`, and must DECORATE SOMETHING —
      and at every subject it derives, EVERY PARAMETER ANNOTATED and NO VARIADIC. **A ROW IS NOT
      AN EXEMPTION AND BUYS A SUBJECT NOTHING.**
    the_measured_movement: |
      SUBJECTS ENUMERATED 27 -> 31.  DECORATED 27 -> 31.  ASSERTIONS 60 -> 72.
      The four new subjects, all four now doors:
        engine/evaluate.py        _evaluate_dial        DERIVED door (the mechanism)
        dials/magnitude.py        _established_quantity @admits(magnitude=DialMagnitude)
        dials/provenance.py       _new_quantity         @admits(dials=frozenset, value=ESTABLISHED_HERE(...))
        serving/dial_presentation.py _shown_from        @admits(dial_id=str, score=ESTABLISHED_HERE(...))
      ESTABLISHED_HERE uses 16 -> 18, across 9 -> 11 callables. MEASURED from my own run and its
      listing piped through `sort -u`; corrected in `admission.py`'s DECLARED LIMIT 1 with the
      superseded wording quoted in full.
    THE_RENAME_TEST_APPLIED_TO_MY_OWN_CRITERION__REPORTED_WHICHEVER_WAY_IT_FALLS: >
      **IT PASSES IN BOTH DIRECTIONS, AND THE OLD CRITERION PASSED IN ONLY ONE.** Renaming the
      function-local `guarded` -> `_guarded`: verdict and subject count unmoved (the pre-existing
      carrier, still green). Renaming the DESTINATION `_evaluate_dial` -> `evaluate_dial`: verdict
      and subject count unmoved — **NEW, and the old clause's own docstring conceded it could not
      survive this** (*"renaming the DESTINATION DOES change the verdict, and correctly"*). New
      carrier: `test_renaming_the_reachable_destination_does_not_move_the_verdict_either`.
    what_I_did_NOT_do_and_the_measurement_that_decided_it: >
      **I DID NOT ABOLISH PUBLICNESS ALTOGETHER**, which is the wide reading of *"never on an
      underscore"*. MEASURED on a pristine `git archive` extraction of `314592c` with
      `_is_public`'s body replaced by `return True`: **SUBJECTS 27 -> 68, FAIL — 42 violations** —
      41 private helpers becoming doors in one increment. Whether §D.1's *"public entry points"*
      class includes them is a PRODUCT-MEANING boundary and not an implementation one
      (PBG-AUTH-005), and the superseded DECLARED LIMIT 9 bullet had already handed exactly that
      question up. **I RAISE IT AGAIN RATHER THAN TAKE IT.** Probe:
      `variants/WO-2R3/P-N-what-abolishing-publicness-would-cost.sh`, two arms, each running its
      own tree's own copy and printing the tree (CD-PL-F98).

