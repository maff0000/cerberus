FINDINGS_AGAINST_MY_OWN_WORK:
  - id: CD-ENG-WO2R3-06-F01
    severity: MEDIUM
    what: >
      **I PUT AN EXACT-TYPE DOOR IN FRONT OF A NAMED REFUSAL AND SILENTLY DISCHARGED A PUBLIC
      DOOR'S DECLARED EXEMPTION AT A PRIVATE CALLABLE.** My first decoration of `_new_quantity`
      was `@admits(dials=frozenset, value=float)`. `observed_for_dial`'s OWN `ESTABLISHED_HERE`
      reason names `ScoreOutOfRange` as what refuses a bad `quantity`, and that refusal happens in
      `_install`, one level in. My door preempted it with a generic `NotAdmitted`.
    how_it_was_caught: '**BY RUNNING THE SUITE, NOT BY READING THE CODE.** `tests/test_dial_provenance.py::test_the_admission_door_refuses_anything_that_is_not_a_finite_float` went to **4 failed**.'
    what_I_did: 'Changed `value` to `ESTABLISHED_HERE` with the reason, the named error and the measured carrier written into the artefact, and recorded the near-miss in `admission.py`''s DECLARED LIMIT 1 rather than only fixing it. `dials` stays exact-typed: a `frozenset` has no named refusal here to preempt.'
    the_shape_it_is_an_instance_of: 'admission.py''s own DECLARED LIMIT 5 — *"Exact-typing them at the door would PREEMPT those named refusals ... and replace this project''s strongest closures with a coarser one"*. **I HAD REASONED ABOUT THAT FOR `_shown_from` AND WALKED INTO IT AT `_new_quantity` IN THE SAME COMMIT.**
      A rule you can quote and still break is a rule you have not applied.'
  - id: CD-ENG-WO2R3-06-F02
    severity: MEDIUM
    what: >
      **MY FIRST VERSION OF THE RESOLUTION CLAUSE BROKE THE ITEM-5 CARRIER THAT HAD JUST LANDED,
      AND IT BROKE IT IN THE EXACT DIRECTION ITEM 5 EXISTED TO FIX.** I removed the two
      `if _is_public(target): return True` branches outright, so a function-local escaping to a
      PUBLIC MODULE-LEVEL ASSIGNMENT — `public_evaluator = _install_evaluator()` — stopped being a
      DOOR and became an UNCLASSIFIED_INTERCEPTOR. Right exit code, **false diagnosis** — which is
      precisely what `CD-ENG-WO2R3-05` measured and repaired one commit earlier.
    how_it_was_caught: '`tests/test_module_level_traversal.py` — the previous seat''s own carrier — went to 2 failed. **The value of that seat committing as it went is not theoretical.**'
    what_I_did: >
      Made the resolution require a destination WITH A DEF SITE TO RESOLVE *TO*. A module-level
      `def` has a signature and a decorator for the check to assert; a module-level ASSIGNMENT has
      neither, so resolving to it would discharge an obligation onto nothing. That case falls
      through and the LOCAL is the door, exactly as before. The reason is written into the code at
      the branch, with the measurement.
  - id: CD-ENG-WO2R3-06-F03
    severity: LOW
    what: >
      **THE DERIVED-DOOR FORM IS RECOGNISED BY THE MECHANISM'S NAME IN THE SOURCE, AND THAT IS THE
      SAME LIMIT `admits` ALREADY DECLARES (DECLARED LIMIT 4) RATHER THAN A NEW ONE — BUT I AM THE
      SEAT THAT ADDED A SECOND INSTANCE OF IT AND I SHOULD SAY SO.** A do-nothing decorator named
      `_absence_is_never_a_number` in `engine/evaluate.py` would be recognised. The four
      source-checked assertions bound it (it must read `inspect.signature` and compile through
      `declaration`), and the failure direction is safe (rename it and TWO violations fire, never
      a silence) — **but "the mechanism is real" is asserted statically and the runtime carrier for
      it is `tests/test_the_absence_door.py`, not this check.** CD-RULE-006: a check reports, a
      carrier fails.
    not_repaired: 'Closing it means importing the product inside a static check, which is the property that lets an auditor run this instrument against a tree they extracted themselves. Raised, not taken.'

