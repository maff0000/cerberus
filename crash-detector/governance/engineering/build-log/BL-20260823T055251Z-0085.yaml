THE_QUARANTINED_PRIOR_DRAFT__WHAT_I_ADOPTED_AND_WHAT_I_MEASURED_TO_EARN_IT:
  ruling: 'CD-D-093. I read /srv/crash-detector-wo2r3-inc8-item1-salvage/ as an UNVERIFIED PRIOR DRAFT. I did not apply its patch. I own every line I committed.'
  design_ideas_adopted_and_named_as_adopted:
    - 'THE BODY CARRIED AS A `code` OBJECT rather than a function object. **Measured to earn it:** `[type(c.cell_contents).__name__ for c in _evaluate_dial.__closure__]` reads `[tuple, dict, NoneType, str, code, dict, tuple, Signature]` and the CALLABLE filter over it returns `[]`. The draft asserted this; I ran it, and then I built the attack that the draft cited and never wrote.'
    - '`functools.wraps` DROPPED ENTIRELY so `__wrapped__` is never created rather than created-and-deleted. **Measured:** `hasattr(_evaluate_dial, "__wrapped__")` is False, and `tests/test_the_absence_door.py` asserts it from the AST as well, so a `grep` cannot match this file''s own prose about the superseded implementation.'
    - 'ESTABLISHMENT DERIVED FROM RESOLVED ANNOTATIONS through `crash_detector.admission.declaration`, the project''s ONE vocabulary. **Measured:** `declared_admissions(_evaluate_dial)` reports `{spec: DialSpec, usable: dict, now_utc: datetime, model: ModelSpec or None}` and every object in it is the class `declaration()` produces.'
    - 'DERIVING THE POST-CONDITION''S ARGUMENTS from its own signature. **Measured:** `_post_condition_order(signature, refuse_a_number_without_its_inputs)` returns `("spec", "usable", None)`, and a post-condition with two outstanding parameters raises `AdmissionFault` at import.'
  what_I_did_NOT_take_from_it:
    - '**ITS TEST CHANGES.** The draft cited `tests/test_the_absence_door.py` as "THE FULL ATTACK" and that file had never existed. **I WROTE IT** — eleven arms, all four routes, with a counterfactual control arm built the old way. 10 of the 11 FAIL at `314592c`; the eleventh is property (c)''s, which is a RETENTION property and correctly passes at the base.'
    - '**ITS `DECLARED LIMIT 10`.** The draft cited that number three times, defined it nowhere, and put two different residues under it. I split them: **LIMIT 10** is the `types.FunctionType` reconstitution, **LIMIT 11** is the dropped generic subscript, and each is written in all three CD-RULE-004 places.'
    - '**ITS SILENCE ON THE SWEEP.** The draft left the suite RED because the Class-2 sweep moved and a test pinned the old count. I carried the consequence (below) rather than suppressing it.'
    - '**ITS TEST-SIDE EDITS TO `test_judgement_path_doors.py`.** Where the draft re-pinned a literal string, I located the call BY AST instead, so the carrier stops breaking on a spelling it is not about.'
  CD_PL_F109__DISPOSITIONED_DELIBERATELY_AND_MEASURED_NOT_ARGUED:
    the_change: '`_evaluate_dial`''s `usable`: `Mapping[str, OK]` -> `dict[str, OK]`. KEPT.'
    why_it_is_forced_and_not_incidental: 'The establishment is derived from the annotation BY EXACT TYPE. An abstract `Mapping` has no exact type to derive — `type(value) is Mapping` is false for every value there is — so the mechanism would have to FAULT the door. The annotation had to become honest about what the path requires.'
    the_finding_the_Project_Lead_raised: '"a `Mapping` that is not a `dict` becomes REFUSED AT THE DOOR where it was previously admitted."'
    what_I_MEASURED__TWO_ARMS_ONE_AXIS_BOTH_TREES: |
      probe: variants/WO-2R3/P-M-is-the-usable-annotation-narrowing-what-the-product-accepts.py
      TREE /tmp/cd06/base  (pristine `git archive 314592c`)
        ARM 1  plain dict  (control): ADMITTED -> Unknown
        ARM 2  Mapping, not a dict : REFUSED -> NotAdmitted: refuse_a_number_without_its_inputs: usable=NotADict ... requires exactly dict
      TREE /srv/crash-detector-wo2r3  (the lane, this work applied)
        ARM 1  plain dict  (control): ADMITTED -> Unknown
        ARM 2  Mapping, not a dict : REFUSED -> NotAdmitted: _evaluate_dial: usable=NotADict ... requires exactly dict
    the_conclusion: >
      **IT IS NOT A NARROWING OF WHAT THE PRODUCT ACCEPTS. THE ACCEPTED SET IS IDENTICAL AND ONLY
      THE POINT OF REFUSAL MOVES** — from AFTER the body has run to BEFORE it binds. The reason is
      that `refuse_a_number_without_its_inputs` has ALWAYS declared `usable=dict` at its own
      `@admits` door and has always fired on every call through the net, so a non-`dict` Mapping
      was already refused with `NotAdmitted` at the base. **THE FINDING WAS RIGHT TO BE RAISED AND
      THE MEASUREMENT ANSWERS IT IN THE PRODUCT'S FAVOUR.** Declared as DECLARED LIMIT 11 in all
      three CD-RULE-004 places, with this table, and carried by the probe above.
    what_I_ALSO_changed_for_the_same_reason: '`_latest_usable_ok`''s RETURN annotation, `Mapping[str, OK]` -> `dict[str, OK]`. Its body has always built and returned a `dict` literal. With the establishment now derived from annotations, an annotation wider than the truth is an establishment wider than the truth.'

