    Matt says so.
  owner: PRODUCT_AUTHORITY

risks:
- id: CD-SEC-001
  summary: >
    The commissioned pre-commit hook validates only the authority records a commit touches, and
    only on the supported commit path. `git commit --no-verify` bypasses it, as does writing objects
    with git plumbing. It guards the gate, not the archive. Recorded because the hook's own
    documentation states these limits and reporting the control as broader than it is would be the
    false-green class this framework exists to prevent (PBG-FWK-001, PBG-FWK-002).
  severity: LOW
  owner: PROJECT_LEAD
  disposition: accepted as designed — detection is unaffected, and prevention on the supported path
    moved from nil to enforced
- id: CD-BP-001
  summary: >
    The AST-based register checks proposed in BLUEPRINT.md §7 and §13 are the one novel instrument
    in the design and could prove brittle or evadable.
  severity: LOW
  owner: PROJECT_LEAD
  disposition: never the sole guard — every criterion in §13 carries at least two independent
