- id: CD-D-005
  summary: >
    The ingredient set — which inputs feed each dial — is not enumerated in the PID. Choosing it is
    choosing what the dial means, and doctrine §3.6 forbids unexplained mappings, so it is Product
    Owner content and not a PL inference from the ARGUS implementation (PBG-PID-003, PBG-AUTH-003).
  recommendation: >
    The Product Owner issues an ingredient register per dial — source, what it stands for,
    criticality — which becomes rows in raw.source_registry.
  default_safe_action: >
    WO-2 proceeds regardless. With zero ingredient sources registered every dial correctly reads
    UNKNOWN, which is doctrinally right and makes CD-AC-001's first planted violation trivially
    demonstrable. The register is needed before WO-3, not before WO-2.
  owner: PRODUCT_AUTHORITY
- id: CD-D-006
