the_instrument:
  id: CD-RT-002-CONSTRUCTORS-ESTABLISH-FROM-THE-DECLARED-FIELD-LIST
  file: tools/register/check_constructor_field_establishment.py
  command: 'python3 -B tools/register/check_constructor_field_establishment.py --root .'
  command_for_the_full_ledger: 'python3 -B tools/register/check_constructor_field_establishment.py --root . --why'
  the_definition_it_prints_at_every_run: >
    A class is IN when ALL FOUR hold. (1) PUBLIC: its name does not begin with '_'. (2) FROZEN
    SUBJECT: declared @dataclass(frozen=True, ...). (3) ON A JUDGEMENT PATH, by any of three unioned
    rules derived from the tree — RULE A: defined under src/crash_detector/{engine,serving,collectors}/;
    RULE B: its name appears in the @admits(...) declaration, a parameter annotation or the return
    annotation of any callable carrying @admits(...); RULE C: it is named in the declared field
    annotation of a type already reached, run to a FIXPOINT. RULES B AND C RESOLVE MODULE-LEVEL NAMES
    TO A FIXPOINT, because both reach types through a name — one_of(*READING_CONSTRUCTORS) spells no
    constructor and outcome: 'FetchOutcome' spells no outcome. (4) BODY-BORNE: it defines
    __post_init__ or __init__ IN ITS OWN CLASS BODY, and that body either names at least one DECLARED
    FIELD of the class or reaches the field list reflectively (dataclasses.fields /
    __dataclass_fields__ / __dict__ / vars). CLAUSE (4) IS A HEURISTIC AND OVER-INCLUDES BY DESIGN:
    no static reader can tell ESTABLISHMENT from DERIVATION, so a body that merely READS a field is
    counted IN. The error direction is toward a LARGER class, never a smaller one.
  the_defect_this_instrument_found_in_itself_and_did_not_hide: >
    THE FIRST DRAFT DID NOT RESOLVE MODULE-LEVEL NAMES AND MEASURED THE POPULATION AT 18. It missed
    Value, Degraded and Unknown — the three sealed Reading constructors, which reach the judgement
    path only through `one_of(*READING_CONSTRUCTORS)`, an expression that SPELLS NO CONSTRUCTOR —
    and it missed the nine types reachable only through the fields of types it had already reached.
    AN INSTRUMENT THAT STOPS AT THE SPELLING MEASURES A VOCABULARY, which is the error this entire
    increment is about, and it found it in itself first. The correction WIDENED the class from 18 to
    32 and is recorded in the check's own header rather than quietly applied.
  population: 32
  accounting: >
    96 classes examined across 38 modules. 35 of them are public frozen dataclasses.
    32 IN + 1 ADJACENT + 2 OUT = 35. EVERY ONE IS NAMED IN THE OUTPUT. A member excluded silently is
    the defect this instrument exists to prevent.
  by_rule: 'RULE A 14 · RULE B only 10 · RULE C only 9.'
  the_32:
  - 'RULE A — FetchedResponse, AttemptRecord, RetryPolicy, CollectionResult, DialSpec,
     ConfigSnapshot, ScoreComputation, DeclaredParameter, ModelProvenance, ModelSpec, ModelRegistry,
     Shown, NotShown, PanelRow'
  - 'RULE B only — DialSet, Value, Degraded, Unknown, OK, ObservationRecord, StalenessWindow, Agrees,
     Diverges, Unavailable'
  - 'RULE C only — Contribution, EquityCrashScore, MonetaryDebasementScore, FetchFailed, Malformed,
     SourceRecord, SourceRegistry, FreshnessEvidence, and (reached, then ruled ADJACENT) Empty'
  the_adjacent_1: >
    observations.py:157 `Empty` — clauses (1)(2)(3) hold by RULE C; clause (4) FAILS: it has NO
    __post_init__ and NO declared fields, so its establishment is ABSENT rather than body-borne and
    it is outside the class the Product Owner ruled. NAMED AND COUNTED, NEVER DROPPED. See
    CD-ENG-WO2R3-F17 below: this is a real hole and it is referred, not closed.
  the_out_2: >
    store/migrations.py `Migration` and store/migrate.py `AppliedMigration` — clause (3) fails on all
    three rules. They are BP-AMENDMENT-0001 §B.4 Class C, which §H places out of WO-2R3's scope.
    THE PROPERTY-BASED ENUMERATION AND THE AMENDMENT'S SCOPING AGREE HERE, which is a check on both
    and is stated as one rather than left as a coincidence. The dispatch instructed that if a
    property-based enumeration pulled a Class C type IN, that would be a finding to report and not
    to resolve. It did not.
  the_floor_versus_the_population: >
    THE PRODUCT OWNER'S FLOOR IS FIVE — ConfigSnapshot, DialSpec, ModelSpec, PanelRow, AttemptRecord.
    ALL FIVE ARE IN AND ALL FIVE ARE GOVERNED. THE POPULATION IS 32. THE FLOOR IS 5/32 AND IT IS NOT
    THE POPULATION, which is what PO-DECISIONS-0008 ruling 2 said would be true before it was
    measured. The 27 the floor does not name include the three sealed Reading constructors, the two
    sealed presentation constructors, both score types, all four FetchOutcome members, both
    registries, both staleness types and all three witness-panel constructors.

# ================================================================================================ #
# THE MECHANISM
# ================================================================================================ #
the_mechanism:
  commit_2_of_3: 66d1d6a069777b24ae3a8f07ddb9481080b66514
  tree: 3ae0205a5e692a69ad5724c8f8973375eecfa3ca
  file: src/crash_detector/establishment.py
  the_bound_transcribed_and_not_paraphrased: >
    "the `admits` idea one level down — establishment derived from the DECLARED FIELD LIST, refusing
    what it was not told, applied at the boundary so a body edit cannot remove it" (CD-D-110).
  what_it_does:
  - 'reads dataclasses.fields(cls) — THE DECLARATION ITSELF — at decoration;'
  - 'compares it with the declaration IN BOTH DIRECTIONS and FAULTS the type on any disagreement, so
     EVERY construction raises UndeclaredField. A NEW FIELD ARRIVES REFUSED, NEVER UNGUARDED;'
  - 'establishes every declared field by EXACT TYPE — type(value) is not declared, never isinstance —
     on every construction, from OUTSIDE the body;'
  - 'FAULTS on an InitVar rather than ignoring it: an InitVar reaches __init__ and is never an
     attribute, so this mechanism cannot establish it and says so. ZERO exist in the subject set and
     the check prints the count, so the premise is measured rather than assumed;'
  - 'shares ONE declaration vocabulary with `admits` (crash_detector.admission.declaration, made
     public for exactly this), rather than growing a second that could drift.'
  where_the_check_runs_and_why_it_is_AFTER_the_generated_init: >
    THE ORDERING IS A DESIGN DECISION WITH THREE MEASURED REASONS AND ONE DISCLOSED COST, and the
    cost is the more important half. REASONS: (1) almost every __post_init__ in this codebase
    CANONICALISES — own_str, ensure_utc, tuple(...), dict(...), float(...) — so a check on the
    ARGUMENTS would establish a value the object does not hold and would refuse
    StalenessWindow(seconds=600), which is a closure that forbids the product; (2) it reaches fields
    no argument carries (field(init=False), field(default_factory=...)); (3) it catches a body
    REWRITING a field to something else. COST: __post_init__ RUNS FIRST, so while a body-borne check
    exists it is the BODY that refuses and the boundary is never reached. A plant against this
    mechanism must be built to reach it, and a plant that merely exits non-zero has proved nothing
    about which layer refused — CD-ENG-WO2R3-F12, this seat's own finding against its own increment-4
    work. What the ordering does NOT cost is the closure: the exception propagates out of __init__
    and no object escapes the constructor.
  why_the_declaration_is_held_off_the_class: >
    FORCED BY THE ARTEFACT, AND AN IMPROVEMENT, AND BOTH HALVES ARE STATED. FORCED:
    dials/reading.py's DECLARED_MEMBER_SURFACE and serving/dial_presentation.py's
    DECLARED_PRESENTATION_SURFACE declare the COMPLETE attribute surface of Value, Degraded, Unknown,
    Shown and NotShown and assert it BY SET EQUALITY at import against frozenset(vars(cls)), with an
    independent copy of each table in the tests. FIVE of the thirty-two members of this class seal
    themselves that way, and a class attribute would break CD-ASR-F02's layer-1 closure. Replacing
    __init__ does not disturb the surface because __init__ is already in it. IMPROVEMENT:
    CD-ENG-WO2R3-F13 is this seat's own finding that `admits`'s __admits__ is a COPY taken at
    decoration and therefore LIES after V33; a module registry publishes no handle on the class at
    all. IT IS NOT A CLOSURE OF V33's ROUTE and is not claimed as one — see DECLARED LIMIT 3.
  structural_invariant_as_landed: >
    "For every one of the 32 types the instrument enumerates, deleting a type establishment from its
    __post_init__ does not make a wrong-typed field reachable, because the establishment that refuses
    it is not in the body." REFUTABLE BY EXECUTION: delete any body-borne type check from any of the
    32 and construct the value it used to refuse. Stated NARROWLY on purpose (CD-PL-F76): it says
    nothing about cross-field invariants, which DECLARED LIMIT 1 declares open, and nothing about a
    subclass, which DECLARED LIMIT 4 declares open.

