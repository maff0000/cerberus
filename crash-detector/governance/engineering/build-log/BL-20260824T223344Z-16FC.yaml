    `degraded_inputs`, `config_snapshot_id`, `as_of_utc`, `schema_version`, `classification` and
    the OTHER canonical dial slot are what exist today; a root property a future contract edit adds
    is covered the day it lands. The two VERDICT INPUTS (`published_utc`,
    `staleness_window_seconds`) are excluded BY NAME because the invariant is stated in terms of
    them, and every exclusion is printed as a COVERAGE note at every run.
