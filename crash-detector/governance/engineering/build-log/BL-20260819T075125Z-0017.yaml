    ONE container, as granted. Two DATABASES inside it — cdb4clean and cdb4plant — so the clean arm
    and the plant arm never share a catalogue. That is necessary rather than convenient: the check
    applies the subject tree's migrations to the database it connects to, so a shared database would
    have carried the plant's grant into the clean arm and destroyed the contrast. Roles are
    cluster-wide and are created idempotently by migration 0001 (`IF NOT EXISTS`), while every
