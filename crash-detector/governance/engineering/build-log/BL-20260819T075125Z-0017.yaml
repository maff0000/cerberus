      daemon. Observed assignment: 127.0.0.1:32791. Nothing was bound to 0.0.0.0 (CD-D-006).
    credentials: >
      GENERATED AT RUN TIME from /dev/urandom inside the single shell that ran the whole lifecycle,
      held only in that shell's memory, never echoed, never written to any file, and unset at the
      end. NO VALUE APPEARS ANYWHERE — not in this entry, not in the logs, not in the check output.
      Referenced BY ENV-VAR NAME ONLY: CD_CHECK_STORE_HOST, CD_CHECK_STORE_PORT, CD_CHECK_STORE_NAME,
      CD_CHECK_STORE_USER, CD_CHECK_STORE_PASSWORD (PBG-SEC-002, PBG-EVID-003, PBG-CONT-009, all
      non-waivable). The check prints its own confirmation of this: "credential by env-var name
      only". Verified afterwards: `grep -ci password` over both arm logs returns 0 and 0.
    isolation_of_other_projects: >
      HONOURED. Every docker query this seat ran was FILTERED to `--filter name=cd-store-wo2-`. No
      container or volume without that prefix was listed into, inspected, stopped, restarted or
