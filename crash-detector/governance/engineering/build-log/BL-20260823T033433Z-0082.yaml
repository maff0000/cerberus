findings_against_my_own_work:
  CD-ENG-WO2R3-04-F06: >
    **THE `CARRIER_ONLY` FINDING ABOVE CUTS AT MY OWN DISPOSITIONS TOO.** I wrote three tier-1 and
    seven tier-2 `CARRIER_ONLY` rows on the strength of an AST call-expression search. The
    instrument's own docstring declares that search a FLOOR — it cannot see an aliased call, a
    `getattr` on a module, or a call through a container — and my measurement used the same
    method. **`CARRIER_ONLY` IS AS STRONG AS THAT FLOOR AND NO STRONGER**, and I am the seat that
    just used it to qualify somebody else's finding.
  CD-ENG-WO2R3-04-F07: >
    **FIFTY OF THE SIXTY-THREE NEW ROWS ARE MY OWN READING OF TWO MODULES I DID NOT WRITE, AND THE
    CONTENT DOCUMENT SUPPLIES NO TEXT FOR ANY OF THEM.** The act ordered the rows to exist (§1.3)
    and left their content to the writing seat. So `operand_origin` on 50 sites is a claim by an
    Engineer who read `admission.py` and `establishment.py` once, in one sitting, at the end of an
    act — **the FIRST-AND-ONLY-READING shape that Category C has just been reversed for trusting.**
    The seventh Assurance seat should attack `operand_origin`, and the rows most likely to be wrong
    are the `OWN_CONSTRUCTION` ones, because that is the answer that ends the enquiry.
  CD-ENG-WO2R3-04-F08: >
    **THE CONVENTION I USED FOR `operand_origin` IS MINE AND IS NOT WRITTEN IN THE RULING.** Where
    the recorded operation is `is`/`is not` I recorded the origin of the constant side and noted
    that identity is not delegable; where a container was rebuilt in scope I recorded
    `OWN_CONSTRUCTION` even though its ELEMENTS are caller-influenced. **Both are defensible and
    both are choices**, and a different seat reading the same 50 sites could reasonably produce a
    different distribution. The convention is stated in the rows rather than left in my head.
  CD-ENG-WO2R3-04-F09: >
    **I MADE THE SWEEP GREEN AND I AM THE SEAT LEAST ABLE TO JUDGE WHETHER THAT WAS RIGHT.** The
    act''s instruction was to declare, and declaring produced EXIT 0. I have labelled it arithmetic
    in the instrument''s output, in this entry, in the commit message and in a test that fails if
    the instrument stops saying it. **NONE OF THAT MAKES IT SAFE.** The next reader of a CI
    dashboard sees a green tick.

