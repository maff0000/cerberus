  - id: CD-ASR-WO3-03-F03
    severity: MEDIUM
    against: D3 — WHAT THE PORTABILITY CHECK DOES NOT CATCH
    title: >-
      A DELL-SPECIFIC ABSOLUTE HOST PATH PASSES IF IT IS SPELLED AS AN ENV-REFERENCE DEFAULT,
      AND A DELL HOSTNAME PASSES IN ANY OF THE TWELVE `INTERNAL_CONSTANTS` KEYS.
    command: 'python3 -B deploy/check_portability.py --root .  over planted copies in /tmp/asr03/tip'
    output: |
      G1  CD_ARCHIVE_DIR: ${CD_ARCHIVE_DIR:-/srv/crash-detector/dell-only/archive}
          -> PASS — 1076 assertions, 0 violations      exit=0
      G2  CD_STORE_HOST: postgres.dell.matt.local   (line 404, plant verified landed)
          -> PASS — 1072 assertions, 0 violations      exit=0
      G2b CD_STORE_HOST: 10.0.0.7                   (same key, IPv4 instead)
          -> FAIL — 1 violation(s)                     <- THE PROBE IS LIVE
    statement: >-
      Rule 5 treats any string matching `\$\{[A-Za-z_]\w*` as "an env reference" and stops
      looking, so everything after `:-` is unexamined — the exact failure the dispatch
      hypothesised, now measured. Rule 3 catches IPv4 ANYWHERE (G2b proves it), but a DNS
      hostname is caught only by rule 5, and rule 5 is switched off for the twelve
      `INTERNAL_CONSTANTS` keys. `CD_STORE_HOST` is allowlisted on the reasoning *"a COMPOSE
      SERVICE NAME resolved by the compose network's own DNS; it travels with the file and
      names no host"* — and NOTHING VERIFIES THE VALUE ACTUALLY IS A DECLARED COMPOSE SERVICE
      NAME. That is a one-line strengthening (assert the value is a key of `services`).
    also_not_caught: >-
      IPv6 in an allowlisted key (same hole as G2 — a bare IPv6 in a NON-allowlisted key IS
      refused, by rule 5 incidentally rather than by rule 3); an image digest that resolves
      only in this host's local cache (unknowable from the file, correctly out of scope);
      `env_file:`, `configs:` and `secrets:` blocks, which rules 5/6 do not read at all —
      this file uses none of them today, so it is a future hole, not a present one.
    confidence: HIGH

