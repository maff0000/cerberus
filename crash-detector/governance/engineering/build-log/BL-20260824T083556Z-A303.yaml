Q32_the_staleness_ceiling:
  reproduced: true
  command: 'python3 -Bc "... admit_staleness_window(...)" over the real constructor'
  output: |
    STALENESS_WINDOW_CEILING_SECONDS = 900.0
      1 minute                            60 s  ADMITTED
      15 minutes / THE CEILING           900 s  ADMITTED
      16 minutes                         960 s  REFUSED [StalenessWindowTooWideForTheCeiling]
      hourly                            3600 s  REFUSED
      daily                            86400 s  REFUSED
      weekly                          604800 s  REFUSED
      monthly (30d)                  2592000 s  REFUSED
      quarterly (91d)                7862400 s  REFUSED
  the_engineer_and_project_lead_are_correct: >-
    A FEED-LIVENESS bound and a DATA-RELEVANCE window ARE two different quantities sharing one
    unit. This seat attacked the reading and could not refute it.
  and_it_is_stronger_than_either_of_them_stated: >-
    *** THIS PROJECT'S OWN STORE SCHEMA ALREADY SEPARATES THE TWO QUANTITIES. *** Measured:
    `raw.observation` carries `collector_run_id`, `attempt_number`, `requested_utc`,
    `observed_utc` and `outcome` — WHEN THE COLLECTOR LAST ACTUALLY REACHED THE FEED, which is
    LIVENESS — and, separately and nullably, `source_as_of_utc` — WHAT THE SERIES SAYS IT IS
    AS-OF, which is RELEVANCE. `raw.source_registry` already carries a per-source
    `cadence_seconds`, and `RegisteredSource.cadence_seconds` mirrors it in Python, bounded by
    nothing. The design already knows these are two things.
  but_the_ceiling_is_still_doing_real_work_today: >-
    *** NO CODE READS THE LIVENESS HALF. *** `grep` for `observed_utc` / `outcome` /
    `collector_run_id` as a liveness VERDICT across src/ returns only type definitions in
    `observations.py` and a docstring in `establishment.py` — no consumer. And
    `publication/cadence.py` cannot help: it measures the PUBLISHER, and it is deliberately
    built so that it CANNOT SEE THE AGE OF A NUMBER — *"there is no parameter through which the
    age of a number could reach it"*. `publication.heartbeat` is *"one row per successful
    publish"*, not per successful collection.
    **SO THE STALENESS WINDOW IS TODAY THE ONLY DEAD-UPSTREAM-FEED DETECTOR IN THIS SYSTEM.**
  this_seats_opinion_offered_to_the_product_authority: >-
    The answer is NEITHER "widen the ceiling" NOR "rethink the mapping". Widening it to admit a
    quarterly window would, as the code stands, mean a feed that died the day after its last
    publication renders FRESH for up to 91 days with nothing else in the system able to notice
    — because cadence is structurally blind to it and the liveness record has no reader. That
    would silently delete the only dead-feed detector that exists.
    The missing thing is a THIRD quantity on the D4 row, not a bigger number on the first: keep
    `staleness_window` meaning "how long may a dead feed masquerade as fresh" with its DERIVED
    900s ceiling intact, carry the quarterly/monthly cadence as the RELEVANCE quantity beside it
    (the slot already exists as `cadence_seconds`), and build the feed-liveness reader over
    `raw.observation.observed_utc`/`outcome`, which the store schema already supports. That
    unblocks 16B without reversing a derivation, which is what CD-RULE-003 is protecting.
    **THIS IS AN OPINION AND NOT A RULING. IT IS PRODUCT AUTHORITY'S (PBG-AUTH-005).**

