    severity: RED
    against: D2, AND THE PROJECT LEAD'S OWN CD-PL-F169 REMEDY
    title: >-
      AN UNKNOWN DIAL CARRYING `detail_level: "calm"` IS ADMITTED BY THE PUBLICATION GATE ON
      BOTH SURFACES. THE CONSTITUTIONAL CLAUSE IS ASSERTED BY THE ARTEFACT AND ENFORCED BY
      NOTHING THE ARTEFACT REACHES.
    command: 'python3 -B /tmp/asr03/probe_calm.py  (built on tests/publication_fakes.py)'
    output: |
      ARM A (control, admitting arm) — UNKNOWN dial, detail_level='elevated':
        public : *** ADMITTED *** (returned None)
        private: *** ADMITTED *** (returned None)

      ARM B (THE ATTACK) — UNKNOWN dial, detail_level='calm':
        public : *** ADMITTED *** (returned None)
        private: *** ADMITTED *** (returned None)

      ARM C (vacuity control) — detail_level='banana' (outside enum):
        public : REFUSED [SCHEMA_VIOLATION] at /equity_crash
      ARM D (vacuity control) — detail_level REMOVED from UNKNOWN dial:
        public : REFUSED [SCHEMA_VIOLATION] at /equity_crash
      ARM E — detail_level at ENVELOPE TOP LEVEL:
        public : REFUSED [UNKNOWN_KEY] at <root>

      DEGRADED branch (PID 3.2 covers STALE as well as MISSING):
        DEGRADED detail_level='acute'   : *** ADMITTED ***
        DEGRADED detail_level='elevated': *** ADMITTED ***
        DEGRADED detail_level='calm'    : *** ADMITTED ***
    the_probe_is_live: >-
      ARMS C, D and E all REFUSE. The instrument is not dead: it refuses an out-of-vocabulary
      level, a missing level, and a top-level attachment. It admits precisely the one thing
      PID §3.2 forbids.
    why_it_is_RED: >-
      `refuse_unless_publishable` is THE publication gate. Its own module docstring:
      *"the engine validates the public envelope against the closed schema BEFORE writing it
      ... Fail closed."* The project's stated pattern for constitutional prohibitions is to
      make them UNREPRESENTABLE IN THE SCHEMA — the `dial_reading` description says so of
      CD-AC-001 in terms: *"UNKNOWN declares no score property at ALL, so an unknown dial
      carrying a number is unrepresentable rather than merely discouraged — that is CD-AC-001
      held in the schema."* CD-AC-001 is held in the schema. PID §3.2 IS NOT, and the same
      description CLAIMS IT IS: *"It is REQUIRED in every branch of the union INCLUDING
      UNKNOWN ... PID §3.2 is constitutional — 'Missing data must never render as calm' — so
      the branch with no score is exactly the branch that must still say how loudly to render,
      and DetailPolicy REFUSES CONSTRUCTION when absent_data_level is calm."* That sentence
      delegates the guarantee to a module the envelope never consults. It is the schema
      vouching for a property the schema does not enforce.
    the_enforcement_has_no_caller: >-
      `grep -rn "detail_level_for" src/` returns FOUR hits and every one of them is inside
      detail_level.py itself (its own docstring, its own __all__, its own def). NO MODULE IN
      src/ CALLS IT. `tests/publication_fakes.py::unknown_dial()` hardcodes
      `"detail_level": "elevated"` as a LITERAL rather than deriving it. So there is no path
      today connecting the policy that refuses calm to the field that carries it, and
      hand-construction — which the schema exists to police — is the only construction route
      that exists.
    the_guard_is_indifferent_to_the_value_domain: >-
      Measured directly against the seat's own guard function, four mutations per contract:
      "detail_level moved to envelope top level" -> FAILS (live);
      "removed from $defs.dial_reading"          -> FAILS (live);
      "removed from ONLY the UNKNOWN branch"     -> FAILS (live);
      "UNKNOWN branch enum NARROWED to exclude 'calm'" -> **PASSES**, on both contracts.
      The replacement guard would neither require nor forbid the fix. It is a correct and
      non-vacuous guard OF PLACEMENT and it is silent on the constitutional question.
    it_is_the_third_instance_of_one_pattern: >-
      CD-PL-F169 found a guard enforced against the rejected option and unenforced against the
      proposed one. CD-ASR-WO3-02 F06/F07 found two tests that do not assert what they are
      cited for. THIS IS THE THIRD: `test_the_UNKNOWN_branch_carries_a_level_and_that_is_the_constitutional_half`
      is headed *"PID §3.2 — 'Missing data must never render as calm.'"* and asserts exactly
      `"score" not in unknown["properties"]` and `"detail_level" in unknown["required"]`.
      **IT IS NAMED FOR PID §3.2 AND DOES NOT TEST PID §3.2.**
    not_disclosed: >-
      Neither BL-...-16WA/16WB nor the Project Lead's BL-...-0159 records it. The Engineer's
      D4 end-to-end evidence — *"both dials exactly Unknown -> detail_level == absent_data_level
      and != calm"* — is a claim about the PRODUCER path, which is the path with zero callers.
      The gate was not attacked.
    mitigation_stated_honestly: >-
      NOT EXPLOITABLE TODAY. No envelope builder exists, `publish_cycle` has zero callers
      (CD-PL-F167), and `DetailPolicy.__post_init__` correctly REFUSES a policy whose
      `absent_data_level` is calm — I reproduced that refusal. This is a LATENT defect that
      goes live at the first line of the 16B envelope builder.
    remedy_available_and_cheap: >-
      One edit per contract: give `dial_reading_unknown` and `dial_reading_degraded` their own
      `detail_level` subschema with `enum: ["elevated","acute"]` (or `not: {const: "calm"}`)
      instead of `$ref`-ing the three-value vocabulary, and add the guard arm that fails when
      it is widened back. NOT THIS SEAT'S TO MAKE (PBG-SOD-004).

