Q30:
  question: >
    *** **THE RULING NAMES THE MAPPING BY FABRIC KEY. THE FABRIC KEY'S CONTENT IS NOT PRESENT IN ANY
    LOCATION THIS PROJECT CAN READ, AND WITHOUT IT NO ROW CAN BE REGISTERED WITHOUT A SEAT CHOOSING
    PRODUCT MEANING.** ***
  what_the_dispatch_believed: >
    The human dispatch instructed this seat to read "the mapping trinity fabric key content carried
    in the WO-3 scope". **IT IS NOT CARRIED THERE.** `WO-3-SCOPE.md` §7 is a FIELD LIST and says so
    in its own words at §0 and §9.1: *"THIS DOCUMENT THEREFORE NAMES NO INDICATOR, NO FEED, NO
    VENDOR, NO CADENCE AND NO CRITICALITY."* This seat reports the mismatch rather than resolving it
    by inventing the content, because inventing it is the one act every ruling since PO-DECISIONS-0020
    has forbidden.
  searched_and_measured: |
    grep -rl 'indicator_dial_mapping|architecture_portability|as_built:v1.0'  (repo, excl .git)
      -> governance/decisions/PO-DECISIONS-0025.md  AND NOTHING ELSE
    grep -rl 'DRTSCILM|NDFI|SLOOS|private credit' --include=*.md --include=*.yaml (repo, excl .git)
      -> governance/decisions/PO-DECISIONS-0025.md  AND NOTHING ELSE
    /srv/trinity-self-mirror  -> no crash_detector namespace; state/current.json stamped 2026-08-15
    no `trinity` or `fabric` resolver on PATH
  what_IS_reachable_and_why_it_is_not_an_answer: >
    `/srv/argus/evidence/WO-ARGUS-PLAYBOOK-0001/10-040-indicator-list.txt` carries EXACTLY 20 rows
    across 10 categories with FRED/IBKR series identifiers, ARGUS *continuous* weights (w=1.50 ...
