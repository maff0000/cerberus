    NOT REGISTER FROM IT, FOR TWO SEPARATE REASONS, AND BOTH ARE SUFFICIENT ON THEIR OWN:**
    (1) `PBG-PID-003` and `WO-3-SCOPE.md` §7.4 by name — *"NO SEAT MAY READ THE INDICATOR LIST OFF
    IT"*; and (2) **IT DOES NOT CONTAIN THE ANSWER ANYWAY.** It carries NO dial binding, NO polarity,
    and NO x3/x2/x1 tier — those three are exactly what `indicator_dial_mapping:v1` adds, and they
    are exactly what cannot be derived from an ARGUS list. A seat that "mapped" 20 ARGUS rows onto two
    dials would be authoring the product's meaning and calling it transcription.
  what_is_needed_field_by_field: >
    For each indicator in the ratified set: `source_id`; what it stands for (the doctrine §3.6
    account, which is the admission ticket and not documentation); adapter/series identifier;
    cadence; criticality (REQUIRED / CONTRIBUTING / DISPOSABLE — a statement about ENGINE BEHAVIOUR);
    **dial binding (equity | monetary | BOTH)**; **polarity per bound dial**; **provisional tier
    (x3 | x2 | x1)**; declared staleness window. Plus: the identity of the Quantical-reference
    additions, which the ruling names as a class and not as rows.
  status: 'OPEN. Next actor PRODUCT_AUTHORITY. Silent execution PROHIBITED.'
  what_it_does_NOT_block: >
