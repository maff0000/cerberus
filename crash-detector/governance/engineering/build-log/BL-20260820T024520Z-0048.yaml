# ================================================================================================ #
# 4. WHAT THE AMENDMENT PROPOSES, IN ONE PLACE
# ================================================================================================ #
the_design:
  the_rule: >
    A computational mapping enters this system as a NAME resolved against a registry, never as an
    object supplied by a caller. The engine resolves the name, the engine executes the mapping over
    values the engine released, and NO ARGUMENT EXISTS through which a caller's number or a caller's
    code can reach a dial. The difference from what stands today is not the strength of a check — it
    is that THERE IS NOTHING TO CHECK.
  the_precedent_it_rests_on: >
    `combine_within_one_dial(magnitudes, using)`. Until increment 1, `using` was a caller callable
    whose return value went straight into the derivation door, and it was the public re-exported
    proxy through which ASR2-002-A published an equity 0.5 out of an equity 0.9 and a monetary 0.1
    WITH EVERY DECLARED STATIC LAYER GREEN. The repair was not a stronger check on the callable. It
    was DELETING the callable argument and replacing it with a NAMED member of the closed
    SameDialReduction enum, executed by the module that owns the numbers. THE AUDITOR CALLED
    INCREMENTS 1–2 "THE STRONGEST CLOSURES I EXAMINED". This amendment is that closure generalised
    to the boundary that never had it, and it is this codebase's own instrument rather than a new
    one.
  what_replaces_ContributionModel: >
    ModelId (a name) · MappingKind (a CLOSED enum — members added deliberately and visibly, and NO
    WEIGHTED MAPPING SHIPS, because weights are product meaning and CD-D-005 is owed) · ModelSpec
    (frozen data, NO callable-typed field, BOUND TO ONE dial_id, carrying ModelProvenance per
    CD-D-005) · ModelRegistry (exact-typed, REQUIRED on ConfigSnapshot with NO DEFAULT, and WO-2R3
    ships it EMPTY). DialSpec carries `model_ref: ModelId | None` and NOT an object.
  how_the_plant_dies: >
    FOUR INDEPENDENT REFUSALS, THREE AT CONSTRUCTION AND ONE AT RESOLUTION, EVERY ONE DEMONSTRABLE
    AGAINST AN EMPTY REGISTRY: DialSpec construction (no such field); ModelSpec construction (no
    callable-typed field, and MappingKind membership is closed by the interpreter); ConfigSnapshot
    construction (a model is bound to ONE dial, so it cannot be named by both — which is ASR3-F02's
    exact mechanism); and resolution (EMPTY_MODEL_REGISTRY resolves nothing). The step the plant
    relied on — one stateful object seeing BOTH dials' payloads and blending them in its own memory
    — IS NOT REACHED, because the executor is a function of ONE dial's spec and ONE dial's payloads
    and has no reference to the other dial's payloads to close over.
  the_vacuity_dilemma_answered: >
    The auditor MEASURED a dilemma with no third branch: under the shipped config both dials read
    Unknown and no dial number exists, so "no blend" was satisfied by there being nothing to blend.
    The answer that survives an empty configuration is that CD-AC-002's closure becomes a property
    of THE TYPES AND THE RESOLUTION PATH, which exist and are testable with zero rows registered.
    All seven planted violations run against EMPTY_MODEL_REGISTRY. A criterion demonstrable on an
    empty configuration is not vacuous on an empty configuration.

