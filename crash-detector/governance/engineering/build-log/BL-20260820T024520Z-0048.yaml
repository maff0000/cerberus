# 6. WHERE THIS SEAT WENT BEYOND THE RULING, SAID SO, AND LEFT IT TO BE CUT
# ================================================================================================ #
beyond_the_ruling_and_flagged_as_such:
  section_D_of_the_amendment: >
    Ruling 2 closes THE MODEL BOUNDARY. §D of the amendment additionally requires that every
    REMAINING public entry point on a judgement path establish its arguments BY EXACT TYPE, with the
    establishment DERIVED FROM THE SIGNATURE rather than written into the body — so that a parameter
    added later arrives REFUSED rather than unguarded. The Project Lead's argument is that without
    §D the ruling's "by construction" is true of one boundary and not of the system, and that A2–A6
    are a measured class rather than an inference. BUT IT IS AN EXTENSION OF THE RULING AND IT IS
    LABELLED AS ONE at §J.1, FOR THE PRODUCT OWNER TO ACCEPT OR CUT.
  section_H_scope_boundary: >
    A7 (`fold`) and the Lifecycle callables are scoped OUT of WO-2R3 on THIS SEAT'S READING ALONE.
    The reading is stated with its residue (§D.4) and put to the Product Owner at §J.3 and §J.4
    rather than acted on.
  the_softest_surface_named_rather_than_hidden: >
    §D.3's adapter/sink/ledger/validator boundary keeps its Protocols, because the things on the
    other side are genuinely foreign and exact-typing them would be wrong. That is A DOOR THAT
    ADMITS, NOT AN ABSENCE OF A DOOR — a WEAKER guarantee than §C's, and the amendment says so and
    invites the FOURTH Assurance seat to attack it FIRST.
  the_concentration_risk_recorded_as_a_risk_not_a_win: >
    After the amendment the executor is THE ONLY PLACE A DIAL NUMBER IS COMPUTED, which makes it the
    single highest-value target in the product. The concentration is deliberate — one place with
    source beats seven doors without — but it is carried into BLUEPRINT §17 as CD-BP-002 rather than
    presented as an unmixed improvement. A MappingKind member that is wrong is a defect this
    architecture does not prevent; it makes it HAVE SOURCE, which is strictly weaker than "cannot
    happen" and is said in those words.

