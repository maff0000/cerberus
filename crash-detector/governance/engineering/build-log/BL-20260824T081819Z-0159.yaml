  measured: |
    src/crash_detector/staleness.py:382  STALENESS_WINDOW_CEILING_SECONDS: float = 900.0
    StalenessWindow(seconds=3600)      hourly      -> REFUSED  StalenessWindowOutOfRange
    StalenessWindow(seconds=86400)     daily       -> REFUSED  StalenessWindowOutOfRange
    StalenessWindow(seconds=2592000)   monthly     -> REFUSED  StalenessWindowOutOfRange
    StalenessWindow(seconds=7776000)   quarterly   -> REFUSED  StalenessWindowOutOfRange
  why_it_is_not_a_bug_to_be_fixed_by_a_seat: >
    **THE CEILING IS DERIVED FROM A RATIFIED NUMBER AND CARRIES ITS OWN DERIVATION AS DATA.**
    `STALENESS_WINDOW_CEILING_SOURCE`: *"PID.md §5, assurance latency budget, RATIFIED 2026-08-18
    (CD-D-003 resolved): pipeline/publication failure independently detectable <= 15 minutes. A
    staleness window wider than the detectability budget renders a dead feed as fresh for longer than
    the product permits failure to go undetected."* **WIDENING IT WOULD BE A SEAT MOVING A RATIFIED
    PID NUMBER. THE ENGINEER REFUSED TO, AND WAS RIGHT TO REFUSE.**
  the_diagnosis_this_seat_adopts: >
    **TWO DIFFERENT QUANTITIES ARE SHARING ONE UNIT AND ONE CEILING.** The 900s bound reasons about
    **FEED LIVENESS** — how long a DEAD feed may masquerade as fresh before detection. A per-indicator
    relevance window reasons about **DATA CADENCE** — how often the underlying series actually moves.
    **A QUARTERLY LENDING SURVEY IS NOT A DEAD FEED AT SIXTEEN MINUTES.** `PO-DECISIONS-0025` ruling 6
    requires a WIDE window for private credit stress *"because its latency IS the point"*, and ruling
    4 registers SLOOS's NDFI leg as manual-quarterly. **BOTH ARE REFUSED BY CONSTRUCTION TODAY.**
  the_options_stated_without_this_seat_choosing: >
    (a) the two concepts are separated — a liveness ceiling and a relevance window, different types,
    different bounds, and the 900s number keeps its ratified meaning untouched; or (b) the ceiling is
    per-criticality or per-cadence-class; or (c) PID §5's budget is read as applying only to the
    publication pipeline and not to every input series. **THIS SEAT DOES NOT CUT IT. IT IS PRODUCT
    MEANING WITH A RATIFIED NUMBER UNDER IT.**
