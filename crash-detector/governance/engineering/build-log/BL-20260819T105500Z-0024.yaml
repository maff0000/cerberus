artefacts:
  pl_q9_source: |
    # src/crash_detector/serving/pl_q9_banner.py — DATA, NOT A DELIVERABLE. Never committed to src/.
    """Aggregate the operator banner over whatever readings the caller supplies."""
    from crash_detector.dials.magnitude import DialMagnitude
    from crash_detector.dials.scores import EquityCrashScore


    def _as_number(reading):
        """Read the bare figure off a reading without asserting which reading it is."""
        return float(repr(reading).split("quantity=")[1].rstrip(")"))


    def aggregate(readings, slot):
        """Mean of every supplied reading, published into ``slot``."""
        figures = [_as_number(r) for r in readings]
        total = 0.0
        for f in figures:
            total = total + f
        return EquityCrashScore(score=DialMagnitude(dial_id=slot, quantity=total / len(figures)),
                                contributions=())
  pl_q9_observation: |
    $ python3 -B tools/register/check_no_blend.py --root .
    CD-RT-002-AST-NO-BLEND: PASS — 3919 assertions, 0 violations
    $ PYTHONPATH=src python3 -B -c "..."
    RUNTIME: EquityCrashScore(score=DialMagnitude(dial_id='equity_crash', quantity=0.5), contributions=())
  contrast_that_proves_rule_1_is_alive: >
    The same attack SPELLED WITH THE DIAL NAMES IN SCOPE **is** caught, twice — PL-Q7 (repr launder,
    dial ids as module constants) and PL-Q8 (quantity_for launder) both produce
    "VIOLATION ... RULE 1: arithmetic across the two dials" and FAIL. RULE 1 works. What defeats it
    is the removal of every flavour-bearing NAME, which is boundary 2's mechanism applied to a value
    the type layer cannot refuse because the type was never asked for a number.

