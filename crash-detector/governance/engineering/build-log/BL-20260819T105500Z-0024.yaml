findings_raised_by_the_project_lead:
  - finding_id: CD-PL-F54
    severity: HIGH
    against: 'WO-2R increment 2, lane a94ef97, CD-ASR-F01'
    title: 'The F01 closure does not close the class: repr is an undeclared release door, and the layer the declaration names as carrying the residue does not carry it'
    the_class_that_is_still_open: >
      A scalar derived from BOTH dial types, published wearing ONE dial's provenance, through source
      that names no dial and performs no arithmetic on a DialMagnitude.
    three_measured_facts:
      a_repr_releases_the_number_without_naming_a_dial: >
        `float(repr(m).split("quantity=")[1].rstrip(")"))` yields the bare quantity. MEASURED:
        0.4 and 0.6 recovered from the two magnitudes, summed to 1.0, no exception. The execution
        contract DISCLOSES that repr contains the quantity and argues it from debuggability —
        "hiding a value from a developer's own debugger would be obfuscation, and obfuscation is not
        structure", which is a defensible position. But the SAME contract, eight lines later, claims
        "reducing one to a number requires naming its single dial". BOTH CANNOT BE TRUE. repr
        reduces it to a number and names nothing. The disclosure and the claim contradict each other
        in one file, and the claim is the one the closure rests on.
      b_boundary_6_names_a_layer_that_does_not_carry_it: >
        tools/register/check_no_blend.py boundary 6 states: "THE PUBLICATION BOUNDARY CARRIES THIS:
        number_for_dial_slot accepts only a DialMagnitude whose provenance is exactly the slot's
        dial, so `blended` cannot be offered for publication; and the closed envelope schema has no
        third key for it." MEASURED FALSE. The blended float is re-wrapped —
        DialMagnitude(dial_id="equity_crash", quantity=blended) — whose provenance IS exactly
        frozenset({"equity_crash"}), and number_for_dial_slot("equity_crash", it) RETURNS 0.5.
        EquityCrashScore accepts it. The envelope needs no third key because the blend is wearing
        the first key's name. The check's own instruction to the auditor is the criterion that
        convicts it: "A variant that reaches the violation through a route a boundary above says is
        COVERED by the type layer or the publication boundary, and is nevertheless not refused when
        EXECUTED, is a defect in the closure and should be reported as one."
      c_pl_q9_escapes_both_layers_together: >
        A single plausible module, added under src/crash_detector/serving/, defeats the static arm
        and the runtime arm at once. Source is in the artefacts section below. It names no dial in
        any expression; it performs no arithmetic on any DialMagnitude; it launders each reading to
        a float through repr inside a helper that takes a generic parameter, accumulates with
        `total = total + f` over a list, and publishes the mean into a slot the CALLER names.
        MEASURED: check_no_blend PASS, 3919 assertions, 0 violations. Runtime:
        EquityCrashScore(score=DialMagnitude(dial_id='equity_crash', quantity=0.5), contributions=()).
    why_this_is_not_inside_the_declared_limit: >
      Boundaries 1, 2, 3 and 5 all end "THE TYPE LAYER CARRIES THIS", and for E01/E02 that is true —
      both raise TypeError when executed. PL-Q9 raises nothing, because it never asks the type for a
      number; it reads the number off the type's own text. Boundary 6 is the only boundary that
      could cover it and boundary 6 hands the residue to the publication boundary, which does not
      hold it. So PL-Q9 is not a route a declaration disclaimed. It is a route two declarations each
      assumed the other was covering.
    what_would_actually_close_it_structurally:
      note: 'DIRECTION, NOT DESIGN. The Engineer chooses the structure; a Project Lead that specifies the implementation has begun approving its own work.'
      first: >
        The provenance-forgetting step is the whole class. Any float that leaves a magnitude has lost
        its dial, and no downstream layer can recover it. So the closure has to be at the RE-ENTRY,
        not at the exit: a DialMagnitude constructed from a number whose own provenance is not
        established is the thing to make unrepresentable. That is the same structural move increment 1
        already made for absence and it worked there — the question changed from "is this number
        blended?", which is undecidable, to "is this number's provenance DECLARED?", which is set
        equality.
      second: >
        repr should not be a release door. Rendering the provenance and a redacted quantity keeps the
        debugger useful without making the number parseable; if the seat judges that the debugging
        value outweighs it, then the CLAIM "reducing one to a number requires naming its single dial"
        must be withdrawn from the contract and repr declared as boundary A-bis, and CD-ASR-F01 does
        not close on a declared limit that wide (CD-RULE-004 permits declaring a limit; it does not
        permit declaring the finding itself as the limit).
      third: >
        Boundary 6 must be corrected whatever else changes, because it currently tells an auditor
        that a layer holds something that layer does not hold. That is worse than no declaration.
  - finding_id: CD-PL-F55
    severity: LOW
    against: 'Build Log entry_id timestamps, project-wide'
    title: 'Entry ids are being stamped with LOCAL time carrying a Z suffix, so the log is not monotonic in real time'
    measured: >
      The lane's increment-2 entry is BL-20260819T113000Z-0041, written by a commit dated
      2026-08-19 11:41:56 +0100 — that is 10:41:56 UTC. The "Z" is British Summer Time wearing a UTC
      label, and 11:30:00Z had not yet happened when the entry claiming it was written. THIS ENTRY,
      0024, is stamped from `date -u` at 10:55Z, and therefore sorts EARLIER than an entry written
      BEFORE it. Ordering by entry_id is now wrong across the lane/main boundary.
    ruling: >
      NEITHER ENTRY IS EDITED (PBG-CONT-003, non-waivable). Corrections supersede. FORWARD RULE,
      effective now: every entry_id and timestamp_utc is taken from `date -u +%FT%TZ` and from
      nothing else. Recorded as CD-RULE-005 in governance/rules/PROJECT-RULES.md. Sequence numbers
      remain the reliable ordering within each of the two blocks (main from 0023, lane from 0040).

