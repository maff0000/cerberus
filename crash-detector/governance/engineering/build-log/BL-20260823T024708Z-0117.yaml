the_probe_this_seat_ran_and_why_it_ran_it:
  why: >
    The fifteen needed a disposition for three sites **no seat has ever read one at a time.** The
    fifth seat's T8 read the ten in `admission`; the four in `establishment` were carried as
    *"reported and not chased"* through three gates. **The SIXTH Assurance seat listed the governing
    question in its own §4 — whether the hostile declaration forms are reachable through
    `establishes(...)` from a caller — as something IT COULD NOT ESTABLISH.** A Project Lead that
    handed a dispatched Engineer three invented dispositions would be doing the exact thing this
    programme reversed Category C for.
  what: >
    `governance/reconciliation/WO-2R3/PL-AB0-establishment-forged-governed-type.py.txt`, stored as
    DATA and not as an executable (PBG-ASSURE-001). Five arms, pristine `git archive af2accb`
    extraction at `/tmp/cd-pl-probe/tree`, **OUTSIDE EVERY GOVERNED WORKTREE**, tree line printed on
    every arm (CD-PL-F98).
  measured:
  - '**ARM 1 — `establishes` IS PUBLIC AND IN `__all__`.** Ordinary in-process caller code decorates
     its own class and constructs it. **`cls` AT BOTH `_declared_field_list` DUCK SITES IS A
     CALLER-SUPPLIED OPERAND, AND THE SIXTH SEAT''S §4 ITEM 3 IS ANSWERED — AGAINST THE TREE.**'
  - '**ARM 2 — THE GATE ADMITS A NON-DATACLASS.** `dataclasses.is_dataclass` is itself a `hasattr`
     probe. A plain class carrying `__dataclass_fields__ = {}` passes it, and `establishes()(Hostile)`
     **SUCCEEDS** where the shipped docstring says it `:raises EstablishmentFault:` *"if the subject
     is not a dataclass … must stop the module importing"*.'
  - '**ARM 3 — STEERABLE.** A forged `_field_type.name` of `"_FIELD_INITVAR"` drives the InitVar
     refusal from caller-written data.'
  - '**ARM 4 — `self` IS CALLER-CONTROLLED.** `crash_detector.observations.OK`, a live governed type,
     **SUBCLASSES SUCCESSFULLY**.'
  - '*** **ARM 5, THE CONSEQUENCE ARM — A CALLER MINTS A FORGED GOVERNED TYPE.**
     `is_establishing_type(Hostile)` -> **True**; `establishment_faults(Hostile)` -> **`()`**, ZERO
     FAULTS; `establishment_field_list(Hostile)` -> `()`; and **`Hostile` ENTERS `governed_types()`,
     MEASURED 0 -> 1.** ***'
  the_limit_stated_rather_than_left_to_be_found: >
    The `governed_types()` count of **0-before** is measured under a **BARE IMPORT OF
    `establishment` ALONE**, not under a full package import. That is a limit of the probe and it is
    written down here rather than discovered by whoever re-runs it.
  what_it_is_not: >
    **NOT ASSURANCE** (PBG-SOD-001), **NOT A DESIGN**, and **NOT A FIX**. It is handed to
    CD-ENG-WO2R3-04 as EVIDENCE that seat is REQUIRED to re-measure and FREE to contradict — the
    precedent set for the fingerprint recipe at increment 7, and the reason that precedent exists is
    that concealing a measurement costs the next seat budget while mandating it is the Project Lead
    designing.

findings_raised_by_the_project_lead_at_this_boundary:
- id: CD-PL-F104
  severity: HIGH
  against: 'the tree — `crash_detector.establishment`, and this seat''s own three prior reconciliations of it'
  statement: >
    **`crash_detector.establishment.establishes` — A PUBLIC, EXPORTED DECORATOR — ADMITS A
    NON-DATACLASS, AND A CALLER CAN MINT A FORGED GOVERNED TYPE THROUGH IT.** Its gate is
    `dataclasses.is_dataclass`, which is a `hasattr` probe; one class attribute
    (`__dataclass_fields__ = {}`) defeats it. The forged class then reports
    `is_establishing_type` **True**, `establishment_faults` **`()`**, and **ENTERS
    `governed_types()`** — the enumeration a governing carrier reads.
  why_it_matters: >
    **IT IS `F-06-R`'s SENTENCE ONE MODULE ACROSS.** That finding's words were *"the mechanism
    applies its doctrine to values and violates it one level up, at the layer that decides what
    'established' means"*, written about `crash_detector.admission`. **IT IS TRUE OF
    `crash_detector.establishment` AS WELL, THROUGH A DIFFERENT PROBE, IN A PUBLIC EXPORTED ENTRY
    POINT, AND NO DOCUMENT SAID SO.** Category A, Category C and this are now ONE CLASS with three
    instances, and the class is: **the declaration vocabulary is admitted by a duck or isinstance
    probe while the value vocabulary is not.**
  and_against_this_seat: >
    **THIS SEAT HAS RECONCILED `establishment.py` THREE TIMES AND NEVER READ THESE THREE LINES.**
    They were inside a set it had accepted the name of — "the four", "reported and not chased" — and
    a name is not a reading. **THAT IS CD-PL-F86'S SHAPE FOR THE THIRD TIME: a set measured where a
    property was needed.**
  disposition: >
    **DISCLOSED, NOT FIXED.** It becomes `CD-F-0004` in the findings register the dispatched act
    creates, and the disposition of sites 11-13 is `DEFECT_OPEN` against it. **ITS REMEDIATION IS
    NOT AUTHORISED BY ANYTHING AND IS NOT IN THE ADOPTED TEN-ITEM GATE** — see the Product Authority
    note below.
- id: CD-PL-F105
  severity: LOW
  against: 'the sixth Assurance seat''s `F-06-I`, on its arithmetic only'
  statement: >
    `F-06-I` closes *"Fourteen sites and two modules need a disposition"*. **THAT IS SIXTEEN. THE
    INSTRUMENT PRINTS FIFTEEN — THIRTEEN SITES AND TWO MODULES**, PL-re-measured at `af2accb` at
    this boundary by running the sweep and reading its violation lines one at a time.
  why_it_is_LOW_and_recorded_anyway: >
    **THE FINDING'S SUBSTANCE IS UNAFFECTED AND CORRECT**, and this seat adopted its recommendation
    in full. It is recorded because `F-06-I` is ITSELF a finding about a count carried in prose
    instead of read off an instrument, and letting its own closing count go uncorrected would be the
    defect surviving inside the finding that named it.

