    answered by widening `STALENESS_WINDOW_CEILING_SECONDS` — the obvious remedy, and the one a
    hurried seat would have proposed — **the project would have lost its only dead-feed detector in
    the same act that made quarterly sources registrable, and nothing would have reported the loss.**
