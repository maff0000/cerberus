the_rulings_this_seat_made:
  - id: RULING ON AUDITOR F4 — CD-PL-F180 IS RE-SCOPED, AND THE AUDITOR IS RIGHT
    the_finding: >
      A THIRD route to an admitted calm-over-unknown needing NO environment variable.
      load_envelope_schema() re-reads the contract on every call and holds no cache (deliberately),
      and the deployed files are writable by the service account. The auditor measured it IN ONE
      PROCESS with CD_CONTRACTS_DIR unset throughout: BEFORE both surfaces REFUSED; the same process
      rewrites <root>/contracts/*.json in place; AFTER both surfaces ADMITTED. DECLARED LIMIT 1's
      precondition is SATISFIED on this route, so exit 3 never fires.
    ruled: >
      ADOPTED. CD-PL-F180 was scoped around a VARIABLE NAME and the route needs no variable.
      16D IS RE-SCOPED TO THE CONTRACT BYTES THE GATE LOADS AT PUBLISH TIME, not to
      $CD_CONTRACTS_DIR. The auditor also ruled BOTH LIMBS ARGUED that exit 3 is the right behaviour
      for the instrument and that scheduling to 16D is right, and this seat accepts both.
    still_open: 'YES. Nothing in this repository closes it, and 16B-FIX is forbidden from trying.'
  - id: RULING ON AUDITOR F6 — ACCEPT THE NAME COUPLING AND DECLARE IT
    the_finding: >
      D3's additive growth imported name-coupled brittleness into the register: a PURE refactor with
      zero behavioural change (absent_data_detail_level renamed, enum reordered, $defs reversed)
      leaves the instrument at PASS 67/0 — WHICH VINDICATES THE BEHAVIOURAL DESIGN BY MEASUREMENT —
      but fails 6 assertions in tests/test_detail_level.py, which the register now runs. The auditor
      offered two ways out and correctly called it a Project Lead judgement rather than taking it.
    ruled: >
      ACCEPT THE COUPLING AND DECLARE IT. Do not edit the tests. absent_data_detail_level is NOT an
      implementation detail on this project — both contracts' own prose names it as the enforcement
      point for a constitutional clause — so a rename that silently repoints it is exactly the change
      that SHOULD require someone to open the register and think. Loosening the assertion to follow
      the $ref would buy refactor comfort with constitutional visibility, and that is the wrong trade
      at this criterion. THE SEAT IS TOLD IT MAY CONTEST THE RULING IN ITS FINDINGS AND MUST FOLLOW
      IT ANYWAY.
    disclosed: 'The cost is real and is now priced in the record rather than discovered by whoever next renames that type.'

