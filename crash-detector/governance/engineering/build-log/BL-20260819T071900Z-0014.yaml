findings_raised:
- id: CD-ENG-F39
  severity: LOW-for-WO-2, MEDIUM-in-principle
  raised_by: CD-ENG-WO2-01
  confirmed_by: 'PROJECT_LEAD_SEAT_01, independently, probe p8'
  title: 'L3 prose suppression is far wider than advertised — an ordinary modal verb disables it'
  detail: >
    L3 does not read a sentence at all if it carries any of 46 negation words or any of 25
    hypothetical words. Those lists include `must`, `free`, `advisory`, `zero`, `say`, `check`,
    `example`, `criterion` and `were`. `must` is neither a negation nor a hypothetical in any
    ordinary sense, and it alone suppresses "The engine must send each instruction to the broker".
    The check header, before this increment, described the suppression as the obvious short list.
    The seat found this by COUNTING the lists in order to document them honestly, which is a
    property of the declared-limit exercise worth noting on its own.
  disposition: 'Ruled by CD-D-017 below — DECLARED, NOT FIXED, and owed as a bounded WO-3 item.'
- id: CD-ENG-F40
  severity: LOW
  raised_by: CD-ENG-WO2-01
  title: 'The note the check PRINTS still carries the old narrow description of L3 suppression'
  detail: >
    The header, the register entry and the execution contract are now correct and consistent. The
    runtime `note:` line the check emits on every run still says the suppression is `no`, `never`,
    `refuses`, `forbidden`, `if`, `would`, `planted`, `variant`, `guard`. The seat did not edit it
    because that changes what the check EMITS, and left it to the Project Lead to rule.
  disposition: >
    CORRECT TO FIX, and authorised in increment 6b. This is not hardening — no detection behaviour
    changes — it is a printed statement that is now false. It matters more than its severity
    suggests because the printed note is what an AUDITOR reads: CD-ASR-WO2-01 will see the check
    output long before it reads the source header, and a guard that understates its own suppression
    in the one place the auditor actually looks is misleading exactly the reader the declaration was
    written for.

decisions_closed:
- id: CD-D-017
  title: 'CD-ENG-F39 is DECLARED, not fixed — the bound holds even though it cost something'
  ruling: >
    ACCEPTED AS DECLARED for WO-2. Owed as a bounded correction at WO-3, before the CD-AC-012
    evidence is relied on for anything beyond this gate.

    The Project Lead considered authorising the fix and declined. The argument FOR was real and is
    recorded so the choice is legible: removing a word from an over-broad SUPPRESSION list is not
    the same act as adding a new pattern, vocabulary category or layer, and CD-D-014 bounded the
    latter. `must` is not a negation. It is arguably a defect in a list rather than a limit of the
    method, and it is the same class of defect as CD-PL-F35(c), which WAS fixed. Two lines.

    It was declined for three reasons. FIRST, the declaration is honest and specific: boundary 3 of
    the DECLARED LIMIT names `must` explicitly, quotes the measured escape verbatim, and states that
    a sentence needs no cunning to be suppressed, only an ordinary modal verb. A known escape that
    is written down in the guard itself is recorded scope, not a hidden hole — which is the entire
    purpose the declaration was commissioned for. SECOND, the mechanism must survive its first
    uncomfortable result. CD-D-015 ended the chase; overturning it within the hour, on the first
    finding the mechanism produced, would make the bound decorative and teach every later seat that
    a sufficiently good argument reopens it. A bound that only holds when it costs nothing is not a
    bound. THIRD, the suppression exists for a measured reason — this project charter says
    repeatedly in its own source that it places no orders, and a check whose output is mostly its
    own charter is a check nobody reads. Narrowing the lists is therefore NOT free: it needs its own
    false-positive measurement across the whole tree, which is a WO-3-sized piece of work, not a
    two-line edit done on the critical path to a gate.

    AND IT DOES NOT REACH THE GATE. The WO-2 gate is Assurance PASS on five planted violations. The
    CD-AC-012 plant is a `place_order` stub, caught by L1 on its name and by L2 on its field set,
    with prose playing no part. CD-BP-001 — risk-accepted by the Product Owner — already records
    that these AST checks are never a sole guard, and the lockfile denylist, the egress check and
    the network posture carry CD-AC-012 alongside this one.

    WHAT THIS RULING IS NOT. It is not a claim that the guard is complete. An auditor who plants a
    CD-AC-012 variant landing beyond a declared boundary should raise a finding against THE
    DECLARATION — was the limit honestly drawn? — and this seat would expect that finding to be
    that boundary 3 describes a defect in the tone of a design choice. That is a fair criticism and
    the Product Owner should see it at the WO-2 review, which is why it is written here in full
    rather than left in the check header where only a reader of source would find it.
  owed_at: 'WO-3, bounded: narrow the L3 negation and hypothetical lists to words that genuinely
    negate or hypothesise, MEASURED against the whole tree for new false positives, with the result
    written back into the DECLARED LIMIT whichever way it goes.'
- id: CD-D-018
  title: 'Increment 6a ACCEPTED; CD-PL-F35 CLOSED IN FULL; CD-D-014 DISCHARGED'
  ruling: >
    ACCEPTED on the evidence above: the clean arm passes with an assertion count identical to the
    pre-increment tree; CD-PL-F38 closes; the widening catches the class (p10) without making the
    guard noisy (p9); and none of (a), (b) or (c) regressed. The DECLARED LIMIT is delivered in
    three consistent places and the dangling forward reference that made the inherited candidate
    UNFINISHED now resolves.

    The seat also corrected a factual error in a docstring it was documenting — "twenty-nine
    sequence modifiers" where there are thirty-one — and DECLARED the correction rather than
    slipping it in. It changed no detection behaviour. That is the right instinct and it is recorded
    approvingly: leaving a known-false number inside a document about honest scope would have been
    the worse option.

    One constraint the seat respected rather than worked around is worth recording because the
    opposite is the classic bypass: the Required Test Register entry key set is a closed allowlist,
    so a `declared_limit:` key would have been REFUSED by the validator. The seat did not widen the
    contract and did not touch pbg/ to make room for its own deliverable. It carried the declaration
    in a YAML comment and the existing prose field, and the validator accepts the register
    unchanged. Editing the framework to fit the work is a bypass (PBG-FWK-013); this was the
    correct alternative.

