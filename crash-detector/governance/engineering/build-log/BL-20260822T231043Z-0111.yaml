CD_PL_F99_RAISED_AGAINST_THIS_SEATS_OWN_CONTINUITY_MODEL: >
  **A SUB-AGENT DISPATCH IS RECORDED AS ISSUED AND THERE IS NO RECORD FIELD THAT DISTINGUISHES
  "ISSUED" FROM "ISSUED AND ACTUALLY CARRIED".** BL-...-0110 wrote "THE FIFTH SEAT IS OUT" and the
  continuity check confirmed the record and the tree agreed — because they did. **THE ONE THING
  CONTINUITY DID NOT CHECK IS WHETHER AN AGENT WAS ALIVE TO DO THE WORK**, and PBG-CONT-007 already
  says a sub-agent result that exists only in conversation is not project state. **THE CONVERSE IS THE
  HOLE: A SUB-AGENT THAT EXISTS ONLY IN A DEAD CONVERSATION IS NOT WORK IN PROGRESS EITHER, BUT THE
  RECORD READS AS THOUGH IT WERE, AND "NOTHING MOVES WHILE IT IS OUT" THEN PARKS THE PROJECT
  INDEFINITELY ON A SEAT THAT WILL NEVER RETURN.** Found by looking, not by any control firing.
  **THIS IS THE PROJECT LEAD'S FOURTH NAMED METHOD DEFECT (CD-PL-F86, F94, F98, F99) AND THE LIST IS
  STILL NOT CLAIMED COMPLETE.**

the_evidence_that_a_first_carrier_STARTED_and_what_is_and_is_not_inherited:
  what_was_found_on_the_box: >
    `/tmp/audit5_pytest.txt`, mtime 22:43Z — **THREE MINUTES AFTER THE DISPATCH BOUNDARY COMMIT
    (22:40:54Z)** — containing a full suite run reading **`2 failed, 1549 passed in 15.63s`**, the two
    failures being the disclosed `tests/test_judgement_path_doors.py` pair. So a carrier for
    CD-ASR-WO2R3-02 **DID START, RAN AT LEAST THE SUITE, AND DIED WITH ITS CONTEXT.** The Project Lead
    carrier that dispatched it died in the same window (the operator wrapper's run-1 log reads
    `Execution error`).
  what_is_inherited_from_it: '**NOTHING. NOT ONE MEASUREMENT, NOT ONE GRADE, NOT ONE LINE.** PBG-CONT-007.'
  and_the_residual_risk_STATED_RATHER_THAN_OMITTED: >
    **THE DEAD CARRIER LEFT ARTEFACTS IN `/tmp` AND THE NEW CARRIER SHARES THAT FILESYSTEM.** A fresh
    seat that stumbles on `/tmp/audit5_pytest.txt` and reads it as its own measurement would be
    inheriting a dead agent's evidence without knowing it. **THE BRIEF THEREFORE ORDERS THE SEAT TO
    TRUST NO PRE-EXISTING `/tmp` ARTEFACT AND TO WORK IN A FRESH DIRECTORY OF ITS OWN.** Named here so
    that if it happens anyway, it is a graded failure and not a surprise.

decisions_taken_at_this_boundary:
- id: CD-D-148
  title: >
    **THE STANDING DISPATCH IS EXECUTED, NOT REISSUED. SAME AUTHORITY, SAME ACTOR_ID, SAME TARGET,
    SECOND CARRIER — AND THE RECORD SAYS "SECOND CARRIER" OUT LOUD.**
  the_question_it_answers: >
    The seat authorised by PO-DECISIONS-0011 ruling 5 was dispatched and its carrier died before it
    produced anything. Does the Project Lead issue a NEW dispatch with a NEW actor_id, or carry the
    issued one?
  the_ruling: >
    **CARRY IT. CD-DISPATCH-WO2R3-ASSURANCE-05 STANDS UNCHANGED AND UNEDITED, AND A SECOND CARRIER IS
    LAUNCHED UNDER IT.**
  why: >
    **(1) THE AUTHORITY IS THE PRODUCT OWNER'S AND NOTHING ABOUT IT EXPIRED.** Ruling 5 authorises a
    fifth fresh seat over the whole of WO-2R3 at the post-increment SHA. That is still exactly what is
    being launched. **(2) THE TARGET IS PROVABLY THE SAME TREE** — SHA, tree object, porcelain and the
    dispatch's own fingerprint all re-measured at this boundary and all identical. **(3) REWRITING THE
    BRIEF WOULD BE THE PROJECT LEAD RE-DRAFTING AN AUTHORISED DISPATCH WITH NO RULING TO DO SO**, and
    the 507-line brief contains disclosures and self-accusations that a rewrite could only weaken.
    **(4) THE INDEPENDENCE PROPERTY THAT MATTERS IS UNHARMED:** the new carrier is a genuinely fresh
    agent that has never read this surface, which is exactly what ruling 5 bought.
  how_it_could_be_wrong: >
    **THE ACTOR_ID NOW NAMES TWO DIFFERENT AGENT INSTANCES.** If a future reader treats
    `CD-ASR-WO2R3-02` as one continuous seat, they will believe the verdict's author ran the suite at
    22:43Z when in fact a dead predecessor did. **THAT IS WHY THIS ENTRY SAYS SECOND CARRIER IN TERMS
    AND WHY THE FIRST CARRIER'S ONLY ARTEFACT IS NAMED WITH ITS TIMESTAMP.** If the Product Owner
    prefers a distinct actor_id, that is a one-line correction to make and this seat will make it.
- id: CD-D-149
  title: '**THE SEAT WRITES ITS VERDICT DURABLY AS IT GOES, RATHER THAN ONCE AT THE END.**'
  the_question_it_answers: >
    A carrier has now died mid-audit once, costing everything it had measured. What stops the next one
    costing the same?
  the_ruling: >
    **THE BRIEF ORDERS INCREMENTAL, APPEND-AS-YOU-MEASURE WRITING** to its own verdict file under
    `governance/assurance/WO-2R3/` on `main`, which the dispatch already names as an explicitly safe
    artefact. A carrier death then costs the TAIL of the audit, not all of it.
  why: >
    This is a continuity fix, not an assurance instruction — **IT CHANGES WHEN THE SEAT WRITES, NEVER
    WHAT IT IS ALLOWED TO CONCLUDE.** The Project Lead has no authority over the latter and is not
    touching it.
  how_it_could_be_wrong: >
    **A PARTIAL FILE CAN BE MISREAD AS A VERDICT.** The seat is therefore ordered to head the file as
    IN PROGRESS and to write its verdict line only when it is genuinely finished — **AND THE PROJECT
    LEAD IS ORDERED BY THIS ENTRY NOT TO RECONCILE A FILE THAT STILL SAYS IN PROGRESS AS THOUGH IT
    WERE A RETURN.**

