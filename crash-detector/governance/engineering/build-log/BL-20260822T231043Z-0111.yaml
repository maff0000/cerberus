action_summary: >
  *** **THE FIFTH SEAT WAS DISPATCHED AND NEVER RAN TO A VERDICT. THE DISPATCH IS ISSUED; THE AUDIT IS
  NOT DONE. THIS BOUNDARY EXECUTES THE STANDING DISPATCH RATHER THAN ISSUING A NEW ONE, AND SAYS SO IN
  TERMS SO THE RECORD NEVER READS AS THOUGH ONE CONTINUOUS SEAT PRODUCED WHAT COMES BACK.** ***
  A new Project Lead carrier booted at 82d09d8 against the same operator instruction that produced
  BL-...-0109 and BL-...-0110. **BOTH ORDERED STEPS WERE ALREADY EXECUTED IN THE RECORD** — the
  bounded increment landed at `9f7b764` and was reconciled at BL-...-0109; the fifth seat was
  dispatched at BL-...-0110. **WHAT WAS NOT DONE, AND IS THE ONLY THING LEFT IN THE ORDER, IS THE
  AUDIT ITSELF.** `governance/assurance/WO-2R3/` holds three documents and all three are the FOURTH
  seat's. **NO FIFTH-SEAT ARTEFACT EXISTS ANYWHERE IN THE RECORD.**
  *** **A DISPATCH THAT IS ISSUED IS NOT AN AUDIT THAT HAPPENED, AND THE BOOT READS THE SAME EITHER
  WAY.** The record said "the fifth seat is OUT" and the tree agreed with that sentence, so continuity
  matched and the project booted GREEN — **WITH NOBODY ACTUALLY READING THE TREE.** That is a real hole
  in this project's continuity model and it is raised below as CD-PL-F99 against this seat's own
  practice.

