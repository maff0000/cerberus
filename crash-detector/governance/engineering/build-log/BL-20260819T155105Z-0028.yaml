findings:
  - id: CD-PL-F62
    severity: LOW
    status: OPEN
    title: "declared boundary 5 distinguishes services by PURPOSE while the code distinguishes by NAME, and does not contemplate a second engine-image service"
    detail: >
      Boundary 5 reads "ONLY THE ENGINE SERVICE'S PROCESS IS DERIVED AS A ROOT ... The other five
      services' entrypoints are RESOLVED ... but they are not walk roots, and witness code
      reachable from `cd-witness` is correct rather than a violation", with V42 (cd-witness) as
      its measured example. A SIXTH service built from the ENGINE'S OWN image is neither "the
      other five" nor a service whose job is witness code, so an auditor reading boundary 5 would
      not expect PL-U6b to escape. The boundary is INCOMPLETE.

      IT IS NOT FALSE, AND THAT IS THE WHOLE DIFFERENCE FROM CD-PL-F59. F59 was rejected because
      boundary 4 ASSERTED A COMPENSATING LAYER THAT DID NOT EXIST and the residue was carried by
      nothing. Here the residue is carried by a layer MEASURED refusing the variant — 8 suite
      failures. An incomplete boundary with a real carrier is a declaration to finish; a false
      boundary with no carrier is a closure to redo. Hence acceptance plus CD-D-055, not a
      re-open.
  - id: CD-PL-F63
    severity: LOW
    status: OPEN
    title: "an 892-line check rewrite added ZERO pytest tests, departing silently from the pattern increments 3 and 3b set"
    detail: >
      MEASURED: `git diff --stat ba469b5..be34fe4 -- tests/` is ZERO lines, and the node-id
      comparison is zero removed AND ZERO ADDED. Increment 3 added 32 tests and increment 3b
      added 5, both in tests/test_egress_destination_registry.py, for their own check changes —
      so the project has an established pattern of covering check behaviour from outside the
      check, and increment 4 departed from it without saying so.

      The check's own assertions grew 13 -> 23, but every one of those is asserted BY THE CHECK
      ITSELF. If the derivation regresses, only the check witnesses it, and the check is its own
      witness. This is the CD-PL-F57/F58 family — assertion counts moving without independent
      corroboration — and it is named for Assurance rather than treated as blocking, because the
      derivation IS proved by execution against fifteen durable variants, which is stronger
      evidence than a unit test would be. What is missing is REGRESSION cover, not proof.

engineer_self_raised_findings_confirmed:
