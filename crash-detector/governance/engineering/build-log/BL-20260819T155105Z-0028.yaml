the_deviation_that_had_to_be_measured: >
  THE SEAT DID NOT DO WHAT THE PRODUCT OWNER'S SENTENCE SAID, AND WAS RIGHT NOT TO. The PO's
  words are "the walk root must derive from the CONTAINER'S OWN entrypoint set, NOT a hard-coded
  path". The seat instead made the root set a UNION — derived roots ∪ the engine package —
  KEEPING the constant it was told to remove, and DECLARED the deviation rather than performing
  it quietly.

  A Project Lead must not accept a deviation from a PO-named structure on the seat's reasoning
  alone, so it was MEASURED. PL-U1 applies the LITERAL reading in one line —
  `roots = sorted(set(derived_roots))`, deleting the package arm — and then applies the
  project's OWN PRE-EXISTING CD-AC-003 PLANT on top:

    PL-U1 clean arm                                  -> exit 0, PASS 12 assertions, 1 root
    PL-U1 + plants/CD-AC-003/CD-RT-003-...patch      -> exit 0, PASS 12 — THE PLANT ESCAPES
    the SAME plant at be34fe4 (the union)            -> exit 1, FAIL 1 violation

  In WO-2 the engine container's process reaches crash_detector.runtime.lifecycle and NOT
  crash_detector.engine; the pre-existing plant is caught through the PACKAGE arm
  (panel <- corroboration <- engine.evaluate). Following the sentence to the letter would have
  DELETED A WORKING GUARD and traded one escape for another. The dispatch's own
  preserve_what_the_auditor_proved says "widening the root must not narrow the rules", and the
  union is what widening means. ACCEPTED on this evidence.

