      does it, and symbolically evaluating the path is interpreting code the check already says it
      will not follow. Declining a closure that would forbid the product is correct, and saying so
      is CD-RULE-004 option (ii) properly used.
  - id: CD-ENG-WO2R-F18
    severity: LOW
    disposition: >
      CONFIRMED and IMPORTANT FOR ASSURANCE. Five variants refuse at exit 3, not 1, even where a
      real reach exists in the tree, because the derivation refusal comes first. That ordering is
      correct fail-closed behaviour, but an auditor asserting only "non-zero" learns less than the
      output holds. Carried into the Assurance dispatch alongside CD-ENG-WO2R-F13.
  - id: CD-ENG-WO2R-F19
    severity: LOW
    disposition: >
      CONFIRMED. The anchor resolver follows top-level anchors only, so a legitimately nested
      fragment becomes a refusal rather than a read. Safe today — all three anchors are top level
      — and the seat correctly routes the proper repair to the _yamlmin dispatch that CD-D-051
      already schedules, rather than widening its own bound to reach it.

