    severity: LOW
    disposition: >
      CONFIRMED by execution — V44 exits 0 at the head, exactly as declared at boundary 6. The
      seat declared the residue of its OWN structure, named it "the residue of the derivation
      itself", and recorded that it CONSIDERED AND DECLINED two available closures with reasons:
