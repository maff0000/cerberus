findings_from_the_seat:
- id: CD-ENG-WO2R3-F01
  severity: MEDIUM
  what: >
    §C plus one non-computing member makes the VALUE-BEARING TAIL of `_evaluate_dial` UNREACHABLE
    from `evaluate`. Four propositions lose end-to-end coverage: a satisfied dial reading `Value`
    with its inputs named; a contributing-input absence rendering `Degraded` with its reason and
    missing source; a live evaluation stamping each dial's own score type; and a live `as_of_utc`.
  confirmed: >
    YES, and the mechanism is not in doubt: with `UNSPECIFIED` the only member, every route into the
    tail ends in `UnspecifiedMapping`, which the Project Lead executed itself (PL-A11). Three of the
    six replaced tests carry an explicit `what_was_lost` line saying so, in the seat's own record.
  ruling_CD_D_097: >
    IT IS A CONSEQUENCE OF PO-DECISIONS-0005 RULING 2, NOT A DEFECT IN THE SEAT'S WORK, AND IT MAY
    NOT BE ANSWERED BY ADDING A `MappingKind` MEMBER. A member that computes is product meaning and
    belongs to CD-D-005 (PBG-AUTH-005, CD-RULE-003); manufacturing one to restore test coverage
    would be constructing state so a control appears to pass — the thing this project's own
    non-waivable list forbids. THE SEAT WAS RIGHT NOT TO. The coverage returns when the Product Owner
    issues the register and the first computing member lands, by amendment to BLUEPRINT §16's owed
    list, exactly as ruling 2 sequences it.
  what_is_owed_because_of_it: >
    (1) DISCLOSED TO THE PRODUCT AUTHORITY here, because it is a visible narrowing of what WO-2's
    evidence covers and the PO should not meet it first in an auditor's report; (2) NAMED FOR THE
    FOURTH ASSURANCE SEAT, which will find that tail uncovered and should find it declared here
    first; (3) it is the same fact as the two failing CD-AC-001 plants, and increment 4 must reconcile
    them together rather than as separate items.
- id: CD-ENG-WO2R3-F02
  severity: LOW-as-raised, TAKEN AS BINDING ON INCREMENT 2
  what: >
    `engine.mapping.compute` is a NEW PUBLIC JUDGEMENT-PATH ENTRY POINT that POST-DATES §B's measured
    inventory of 44, and its establishment is written IN ITS BODY.
  why_the_project_lead_grades_it_higher_than_the_seat_did: >
    §D.1's rule is that establishment is DERIVED FROM THE SIGNATURE precisely because the two escapes
    this project has suffered on this class were both EDITS TO A BODY. A new door whose establishment
    lives in its body is the amendment's own stated failure mode, created by the increment that
    implements the amendment. It is harmless TODAY only because increment 2 has not run yet.
  ruling_CD_D_098: >
    ADOPTED AS A BOUND ON INCREMENT 2, IN TERMS: the static judgement-path check MUST ENUMERATE
    `engine.mapping.compute`, and `admits` must cover it like any other door. This is added to the
    increment-2 brief as a named first item. THE SEAT FOUND THE DOOR IT HAD JUST BUILT AND REPORTED
    IT RATHER THAN LEAVING IT FOR THE AUDITOR — which is the fourth consecutive seat on this project
    to disclose against itself, and the reason the disclosure is worth more than the finding.
- id: CD-ENG-WO2R3-F03
  severity: LOW
  what: '`ModelProvenance`''s SHAPE (stands_for, account, decided_by) is the seat''s construction under §C.6 and nobody has ratified it; CD-D-005 has not landed to test it against.'
  ruling_CD_D_099: >
    NOTED, NOT BLOCKING, AND CORRECTLY RAISED. §C.6 assigns the SHAPE to the Project Lead and the
    CONTENTS to the Product Owner's register, so a shape offered before the register exists is
    provisional BY DESIGN. It is disclosed to the PO alongside CD-D-005 rather than settled here, and
    a shape that turns out wrong when the register lands is a cheap correction — a shape invented to
    fit contents nobody has issued would not be.

