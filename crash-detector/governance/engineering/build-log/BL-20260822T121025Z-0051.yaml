the_headline_claim_replicated_not_relayed:
  driver: "/tmp/pl_a1.py — the Project Lead's own, written from the product's public API, not the seat's tests."
  PL_A1_A6_structure:
  - 'DialSpec fields: [dial_id, required_input_ids, contributing_input_ids, model_ref]. `contribution_model` ABSENT.'
  - 'ContributionModel exported from engine: False. From engine.model: False. CONTRIBUTION_MODELS: False.'
  - 'MappingKind members: [UNSPECIFIED]. Exactly one, as ruling 2 requires.'
  - 'ModelSpec callable-typed fields: NONE.'
  - 'EMPTY_MODEL_REGISTRY rows: 0.'
  PL_A7_the_auditors_plant: >
    ONE STATEFUL MODEL OBJECT — the ASR3-F02 shape, a class with a `compute` that remembers what it
    has seen — offered to DialSpec through FOUR keyword spellings. ALL FOUR REFUSED:
    `contribution_model`, `mapping` and `model` with `TypeError: DialSpec.__init__() got an
    unexpected keyword argument`, and `model_ref` with
    `NotEstablishedOnOwnTerms: a model reference is a NAME, and Plant is not a name`.
    THE FIRST THREE ARE THE INTERPRETER REFUSING A FIELD THAT DOES NOT EXIST — the strongest refusal
    available, because there is no guard to evade.
  PL_A8_enum_closure: >
    `class Sub(MappingKind)` -> `TypeError: <enum 'Sub'> cannot extend <enum 'MappingKind'>`. An enum
    with members is closed against subclassing BY THE INTERPRETER.
  PL_AA1_a_fresh_route_in_no_corpus: >
    THE PROJECT LEAD WROTE A PROBE THAT IS IN NEITHER AUDITOR'S SET NOR THE SEAT'S. `MappingKind`'s
    PRIVATE `_member_map_` IS MUTABLE at runtime — `MappingKind._member_map_["MEAN"] = Fake()`
    succeeds and `MappingKind["MEAN"]` then returns the Fake, which carries a `compute` returning 0.5.
    THIS IS THE POST-IMPORT CLASS-MUTATION FAMILY that WO-2R increment 1 declared as its residue, and
    it is the obvious way to attack "an enum is closed by the interpreter".
    IT BUYS NOTHING: `ModelSpec.mapping` refuses it at construction —
    `TypeError: ModelSpec.mapping must be a MappingKind member, got Fake`. THE REFUSING LAYER IS THE
    EXACT-TYPE CHECK ON ModelSpec's FIELD, scoped to values offered to that field, and NOT the enum's
    membership machinery (CD-PL-F74: the layer is named because the inference differs). The route is
    over-determined and the design holds where its own advertised weakness is.
  PL_A11_the_one_member_computes_nothing: >
    A well-formed ModelSpec over MappingKind.UNSPECIFIED handed to engine.mapping.compute raises
    `UnspecifiedMapping: model 'm' for dial 'equity_crash' declares MappingKind.UNSPECIFIED ... which
    NAMES THE ABSENCE of a declared mapping`. NO MAGNITUDE RETURNED.
  PL_A12_the_structural_version_of_the_same_claim: >
    `ast.parse` of `inspect.getsource(mapping.compute)`: VALUE-RETURNING `return` STATEMENTS: **ZERO**.
    That is not a test result and not a claim — it is a property of the source text, and it is the
    strongest form the "never returns a magnitude" half of ruling 2 can take while the enum has one
    non-computing member.

