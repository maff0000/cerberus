    SAID THEY WERE THE SAME WOULD BE OVERSTATING THE RESIDUE IN ONE DIRECTION AND UNDERSTATING IT
    IN THE OTHER.** Carried by
    `tests/test_admission_operator.py::test_a_frozenset_membership_needs_a_forged_hash_as_well`,
    which asserts BOTH results so neither can go stale.

