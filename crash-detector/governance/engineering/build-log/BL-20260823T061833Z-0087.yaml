    the lookup hashes first, so it also needs a `__hash__` forged to collide with a real member.
    Measured both ways: `A not in _CONSTRUCTOR_IDENTITIES` with `__eq__` only; `B in
    _CONSTRUCTOR_IDENTITIES` with `__eq__` AND a colliding `__hash__`.
  why_it_is_recorded: >
