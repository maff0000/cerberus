  - "F03: the contracts directory the live gate reads is a deployment-time input and nothing in the repository constrains it. The instrument refuses to run when it is repointed; it does not stop a deployment doing it. This is the same shape as the defect 16B was called to fix — a guarantee held in a document that something else decides whether to read — one layer further out, and it is open."
  - "A PLANT THAT STOPS APPLYING IS STILL INVISIBLE TO EVERY INSTRUMENT THIS PROJECT RUNS AT A BOUNDARY. The four patches in plants/WO3-INC16B/ touch contracts/{public,private}_envelope.schema.json, which 16C and 16D are both expected to edit (ruling 8's version discrimination in particular names the envelope contract). WHEN THAT HAPPENS THESE PATCHES WILL STOP APPLYING AND NOTHING WILL SAY SO — CD-ENG-WO2R3-06-F06, four recorded instances, CARRIER NOT PROVED TO BE CARRIED ANYWHERE. Whoever takes 16D should re-run this set by hand."
  - "The boot RED is unresolved and outside this seat's scope. governance/engineering/ACTIVE_WORK.yaml is byte-identical to the frozen base be0b355 and still carries continuity_record_commit: PENDING and still describes CD-WO-002 on branch wo-2-skeleton at /srv/crash-detector-wo2. EVERY SEAT ON THIS LANE WILL BOOT RED until a seat with that file in scope reconciles it."
  - "THIS SEAT DID NOT CERTIFY ANYTHING AND MAY NOT (PBG-SOD-001, non-waivable). Everything above is IMPLEMENTATION EVIDENCE. The instrument passing on the clean tree is not assurance that it is a good instrument; the arm to weigh it by is C4, and the seat that weighs it must not be this one."
