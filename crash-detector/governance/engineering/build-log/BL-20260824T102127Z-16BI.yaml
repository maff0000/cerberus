declared_limits:
  - "1 IT JUDGES THE CONTRACT THE GATE ACTUALLY LOADS, WHICH IS CONFIGURABLE. envelope_contract.contracts_dir() honours $CD_CONTRACTS_DIR, so the live gate can be pointed at a widened copy while this repository's contracts are byte-intact. EXECUTABLE EXAMPLE: plants/WO3-INC16B/C5-NO-PATCH-CONTRACTS-DIR-REPOINTED.sh, which MEASURES the gate admitting a calm UNKNOWN dial on both surfaces with both repository blobs unchanged. The instrument exits 3 with the reason when pointed that way and prints both contract digests at every run (CD-PL-F98). IT DOES NOT PREVENT THE ROUTE — NOT PROVED TO BE CARRIED ANYWHERE. Raised as F03."
  - "2 IT PROVES NOTHING ABOUT A VALUE READING THAT SHOULD NOT HAVE BEEN A VALUE. A dial whose inputs were missing but which was constructed as VALUE with a fabricated score renders calm legitimately as far as this contract is concerned, and THIS CHECK ADMITS IT — the VALUE/calm row says so out loud, and it must, or the check would be the vacuous kind C4 exists to catch. THE CARRIERS ARE THE TWO SIBLING ENTRIES: CD-RT-001-AST-NO-NUMERIC-DEFAULT (the provenance of the magnitude) and CD-RT-001-ABSENCE-RENDERS-UNKNOWN (the runtime post-condition refuse_a_number_without_its_inputs). THIS IS ONE OF THREE GUARDS ON CD-AC-001 AND NEVER A SOLE GUARD."
  - "3 IT SAYS NOTHING ABOUT STALENESS, WHICH IS HALF OF CD-AC-001'S OWN WORDS ('Missing OR STALE input never renders as calm'). Nothing in the instrument reads staleness_window_seconds, the age of as_of_utc, or any liveness/relevance quantity. MEASURED EXAMPLE, which exits 0 here: an envelope whose dials are UNKNOWN/elevated and whose as_of_utc is a year old is ADMITTED without comment. The stale half is CD-AC-009, and as a product model it is PO-DECISIONS-0026 ruling 5 — items 2-6 of ruling 7, which are 16C and later and explicitly NOT this increment. THE CRITERION IS THEREFORE STILL ONLY HALF-GUARDED BY LIVE INSTRUMENTS AFTER THIS INCREMENT, AND THAT IS SAID HERE RATHER THAN LEFT TO BE INFERRED FROM WHICH ARMS EXIST."
  - "4 IT IS NOT A CENSUS OF RENDERING PATHS. It drives every surface EnvelopeSurface declares at every dial slot the contracts declare — enumerated from the subject, so a third surface or a third dial is driven on the day it is added — but a path that never calls refuse_unless_publishable is outside it. MEASURED at this commit: the only callers in src/ are publication/publish.py lines 276-277, both surfaces, before any write. A future serving layer that renders a dial without publishing an envelope is NOT PROVED TO BE CARRIED ANYWHERE; the rendering layer is later WO work."
  - "5 IT IMPORTS THE SUBJECT TREE AND THEREFORE INHERITS IT. A runtime check, because 'refused' is a runtime claim and every escape on this project's record passed a static checker. The cost is --root's honesty, which is why the resolved crash_detector.__file__ and both contract SHA-256s are printed on every run (CD-PL-F98)."
  - "6 IT NEEDS jsonschema, BECAUSE THE GATE DOES, AND IT IS THEREFORE NOT STDLIB-ONLY LIKE THE OTHER STATIC CHECKS IN tools/register/. This is a real departure from the directory's stated norm and it is declared rather than left to be discovered: a behavioural check cannot be more stdlib-only than the behaviour it drives. Absent jsonschema it exits 3 with the reason, never a pass and never a skip (PBG-CI-002)."
  - "7 CD-CALM-PAIRED-004 PAIRS AGAINST WHICHEVER ADMITTED CANDIDATE OF THE SAME STATE THE MATRIX PRODUCED LAST, which is the 'acute' one. It therefore proves the refusal is caused by the VALUE of detail_level; it does not enumerate every admitted level as a pair. The elevated pairing is covered by the separate MUST ADMIT cell rather than by the diff."
  - "8 THE INSTRUMENT'S OWN SELF-CHECK (CD-CALM-VACUITY-000) DEFENDS THE TABLE, NOT THE FILE. Deleting the VALUE/calm row makes the instrument FAIL; deleting the whole assertion block, or the file, does not — nothing outside required-tests.yaml requires this instrument to exist. That is the same residue every register row on this project has, and it is not closed here."

findings:
  - id: CD-ENG-WO3-05-F01
    severity: LOW
    against: "the dispatch, §4 D2"
    finding: >-
      A STATEMENT IN THE DISPATCH IS INEXACT. §4 D2 says "MEASURED: all 18 criteria are
      UNDECIDABLE today for exactly this reason", the reason being an unresolvable
      negative_control.evidence_ref. MEASURED at 20fd1e1: SIXTEEN are UNDECIDABLE for that
      reason. CD-AC-017 and CD-AC-018 are UNDECIDABLE for a DIFFERENT reason — their
      execution_contract does not resolve: "CD-RT-017-ADMISSION-BY-DECLARED-DOOR-PROVENANCE:
      execution_contract 'contracts/execution/CD-RT-017-ADMISSION-BY-DECLARED-DOOR-PROVENANCE.md'
      does not resolve" and the same for CD-RT-018. THE CONCLUSION THE DISPATCH DRAWS IS
      UNAFFECTED — this seat's new row does compute UNDECIDABLE for the evidence_ref reason, and
      that is correct and was not engineered around. Reported because §7 requires it and because
      two register rows naming execution contracts that do not exist is a real open item nobody
      has booked: it means CD-AC-017 and CD-AC-018 would stay UNDECIDABLE even if every run
      record in the project existed.
  - id: CD-ENG-WO3-05-F02
    severity: LOW
    against: "the dispatch, §1 writable scope"
    finding: >-
      SCOPE ITEM DECLINED, WITH THE MEASUREMENT. §1 grants "plants/MANIFEST.md — the top-level
      index only, if it enumerates directories". IT DOES ENUMERATE DIRECTORIES, BUT ONLY THE
      WO-2 CRITERION ONES, under a heading that reads "One directory per PID §6 criterion
      delivered in WO-2", with per-directory plant counts and a TOTAL. MEASURED: plants/WO3-INC14
      and plants/WO3-INC15 already exist on disk and are BOTH ABSENT from that index — the two
      immediately preceding WO-3 plant sets did not touch it either. ADDING ONLY MINE WOULD MAKE
      A TWO-DIRECTORY-STALE INDEX LOOK COMPLETE, which is worse than leaving it visibly
      WO-2-shaped. NOT EDITED, AND DISCLOSED RATHER THAN QUIETLY SKIPPED. Reconciling that index
      across all three WO-3 sets is a bounded job for a seat that can re-measure every count in
      it (CD-RULE-009 requires the figures be read from the disk, not copied), and this seat's
      dispatch is item (i) and nothing else.
  - id: CD-ENG-WO3-05-F03
    severity: MEDIUM
    against: "the product"
    finding: >-
      *** THE CONTRACT THE PUBLICATION GATE JUDGES AGAINST IS A DEPLOYMENT-TIME INPUT, AND
      NOTHING GUARDS IT. *** envelope_contract.contracts_dir() returns $CD_CONTRACTS_DIR when
      set. MEASURED as contrast arm C5 with both repository schemas byte-identical to their
      committed blobs: with that variable pointed at a copy whose UNKNOWN branch is widened, the
      live gate ADMITS a calm UNKNOWN dial on BOTH surfaces. 16A-FIX narrowed the documents
      correctly and this is not a defect in it — it is that narrowing the documents and
      guaranteeing the running gate reads them are two different acts, and only the first has
      been done. No test asserts the variable is unset, no container manifest pins it, and no
      instrument reads it. CARRIER: NOT PROVED TO BE CARRIED ANYWHERE. The new instrument
      REFUSES TO RUN (exit 3) when pointed that way, which protects the CHECK and not the
      PRODUCT. NOT REPAIRED HERE: envelope_contract.py, deploy/ and the test suite's contract
      assertions are all outside this seat's writable scope, and whether the contracts directory
      should be configuration at all is a product question (PBG-AUTH-005). RAISED TO THE PROJECT
      LEAD.
  - id: CD-ENG-WO3-05-F04
    severity: LOW
    against: "the dispatch, §4 D1"
    finding: >-
      THE PROPOSITION TABLE IS INCOMPLETE AS A SPECIFICATION, AND WAS EXCEEDED RATHER THAN
      FOLLOWED. §4 D1's five rows do not include DEGRADED/elevated or DEGRADED/acute. An
      instrument built to exactly those five rows would assert that DEGRADED/calm is refused
      WITHOUT ever asserting that any DEGRADED dial is admissible at all — so a contract that
      refused every DEGRADED dial outright would satisfy the table. The instrument drives nine
      state/level rows at two dial slots on both surfaces (36 cells) for that reason, and
      CD-CALM-PAIRED-004 is what makes the addition load-bearing: it cannot pair a refusal
      against an admitted candidate of the same state if no such candidate exists, and it
      reports that as a violation in its own words. NOT A DEFECT IN THE DISPATCH'S INTENT — §4
      D1's surrounding prose is explicit that the admitting arms are the point — but the table
      as literally written is satisfiable vacuously in one direction, and a seat that
      implemented exactly the table would have shipped that hole.
  - id: CD-ENG-WO3-05-F05
    severity: LOW
    against: "the dispatch, §4 D4 C3"
    finding: >-
      AMBIGUITY RESOLVED AND DISCLOSED. C3 is specified as "Keep the $refs; add 'calm' back into
      the absent_data_detail_level enum", which does not say whether one surface or both. IT WAS
      BUILT ON BOTH, because the evasion C3 tests — a check that reads the $ref target's NAME and
      never opens it — is defeated identically on one surface or two, and the both-surfaces form
      is the stronger arm: it leaves NO refusing cell anywhere, so an instrument that passed it
      would be reading nothing at all. The one-surface variant of that evasion is already covered
      in the other axis by C2. Stated so an auditor rebuilding the set gets the same patch.
  - id: CD-ENG-WO3-05-F06
    severity: INFORMATIONAL
    against: "the increment itself"
    finding: >-
      THE SUITE DOES CATCH C4, AND SAYING SO CUTS BOTH WAYS. `pytest tests/ -q` on the C4 tree
      is "2 failed, 2005 passed", both in
      tests/test_detail_level.py::test_the_absent_data_branches_declare_a_vocabulary_that_EXCLUDES_calm.
      That is a STRUCTURAL assertion and it happens to catch the vacuity direction. BUT AT THE
      BASE TIP THAT FILE WAS RUN BY NOTHING THE GATE READS, so C4 was caught by nothing
      register-visible. After 16B it is caught twice, by D1 and by D3. Recorded because a reader
      could otherwise conclude from "the suite catches it" that D1 was unnecessary, and the
      order of those two facts is what makes the increment worth having.

