action_summary: >-
  INCREMENT 16B, ITEM (i) OF PO-DECISIONS-0026 RULING 7, AND NOTHING ELSE. THE CONSTITUTIONAL
  GUARANTEE 16A-FIX OBTAINED IS NOW CARRIED BY A LIVE REGISTER-WIRED INSTRUMENT (RULING 9).

  THE PROBLEM, REPRODUCED BY THIS SEAT ON ITS OWN EXTRACTION AND NOT INHERITED FROM THE
  DISPATCH: on a tree with all four "$ref": "#/$defs/absent_data_detail_level" restored to
  "#/$defs/detail_level" — the complete revert of 16A-FIX's narrowing — EVERY ONE OF THE
  FOURTEEN PRE-EXISTING REGISTER INSTRUMENTS EXITS EXACTLY AS IT DOES ON THE CLEAN TREE. The
  guarantee lived in tests/test_detail_level.py, which no execute: line in required-tests.yaml
  named (MEASURED at the baseline: 29 execute: lines, 15 naming tools/, 14 naming pytest files,
  and test_detail_level.py is not one of the 14). A memorial, not a guard.

  D1 — tools/register/check_missing_data_never_calm.py, NEW. A BEHAVIOURAL instrument. It
  imports crash_detector from <root>/src and drives refuse_unless_publishable — the function
  src/crash_detector/publication/publish.py calls on BOTH surfaces before it writes anything
  (lines 276-277) — with candidate envelopes, and records what the gate ACTUALLY DID. IT DOES
  NOT READ THE SCHEMAS AS DOCUMENTS, does not search for the string absent_data_detail_level,
  and does not assert that any $ref points anywhere. A structural read of schema keys is what
  let this class through three times here (CD-PL-F169, CD-ASR-WO3-02 F06/F07, CD-ASR-WO3-03),
  and contrast arm C3 is that exact evasion: the $ref keeps its name and loses its meaning.
  36 gate cells (2 surfaces x 2 dial slots x 9 state/level rows), 67 assertions, exit 0 clean.

  THE ADMITTING ARMS CARRY EQUAL WEIGHT AND ARE ASSERTED IN THE INSTRUMENT ITSELF: elevated
  and acute MUST still be ADMITTED on an UNKNOWN or DEGRADED dial, and calm MUST still be
  ADMITTED on a VALUE dial. CD-CALM-VACUITY-000 asserts THE INSTRUMENT'S OWN TABLE still holds
  the VALUE/calm admitting row, so the vacuity arm cannot be quietly deleted from the
  instrument that exists to carry it. CD-CALM-PAIRED-004 diffs every refused candidate against
  the ADMITTED candidate of the SAME state at the SAME slot on the SAME surface and requires
  EXACTLY ONE differing JSON pointer, /<slot>/detail_level — same document, one token moved,
  opposite outcome, so the refusal is attributable to the level and to nothing else.
  CD-CALM-REASON-003 requires the refusal to be SCHEMA_VIOLATION located at the mutated slot,
  because the right outcome from the wrong layer is this project's most-repeated defect
  (CD-PL-F74). CD-CALM-PRODUCER-005 adds the producer half: DetailPolicy refuses construction
  with absent_data_level "calm" and admits elevated and acute, and detail_level_for returns the
  policy's absent level for an Unknown reading — both arms, refusing and admitting.

  THE SURFACES, DIAL SLOTS AND LEVELS ARE ENUMERATED FROM THE SUBJECT AND NEVER TYPED IN — from
  EnvelopeSurface, from each contract's own properties that $ref #/$defs/dial_reading, and from
  the contract's own #/$defs/detail_level enum — so a third surface, a third dial or a fourth
  level is driven on the day it is added rather than silently unexercised.

  D2 — required-tests.yaml. CD-RT-001-MISSING-DATA-NEVER-CALM added under CD-AC-001, whose
  criterion text is literally "Missing or stale input never renders as calm", with its
  CD-RULE-004 DECLARED LIMIT comment (six boundaries, each with something an auditor can
  execute) in the form the two entries already there use. EXACTLY ONE test_id was added:
  29 -> 30. Criterion count unmoved at 18; no criterion_id, criterion, obligation, origin or
  pid_relation line was added, removed or reworded; the pid: block and latest_admitted_run: null
  were not touched.

  D3 — CD-RT-001-ABSENCE-RENDERS-UNKNOWN's declared command GREW by tests/test_detail_level.py,
  ADDITIVELY. Nothing removed, nothing reordered; the 124 assertions it already ran still run.
  Precedent, not invention: the same entry grew by tests/test_dial_presentation.py at WO-2R2
  increment 1c and its own comment records that "nothing was removed from the command". D3 IS
  SECONDARY AND IS NOT OFFERED AS D1 — a pytest file the gate happens to name is still a pytest
  file. The comment above the entry, the docstring of tests/test_detail_level.py and the
  register comment above the new row all say so in those words.

  D4 — plants/WO3-INC16B/, five arms, each from its own pristine git archive | tar -x
  extraction under /tmp. NO PLANT WAS EVER APPLIED TO THE WORKTREE (CD-PL-F154); the worktree
  is clean at every boundary. git apply's OWN exit code is a column of its own
  (CD-ENG-WO2R3-06-F06).

  D5 — the instrument exits 0 on the clean worktree with 67 assertions, and the suite is
  2007 passed / 0 failed, unchanged from the baseline.

  NOTHING ELSE WAS TOUCHED. Items 2-6 of ruling 7 (the three-quantity liveness/relevance model
  and STALENESS_WINDOW_CEILING_SECONDS, the structural no-blend closure, the host-coupling
  defaults, the version discrimination, and registering any indicator row from
  governance/mapping/indicator_mapping.yaml) are 16C and later and were not started. THE
  MAPPING FILE WAS READ AND NOTHING WAS REGISTERED FROM IT.

