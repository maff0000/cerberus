item_3_part_b_the_test_correction:
  the_ruling: '*"a test that requires a bypass to exist pins the bypass open, and a test that asserts a vulnerability is a defect in the test."*'
  what_was_there: >
    `tests/test_evaluate.py:692` — `assert hasattr(evaluate_module._evaluate_dial, "__wrapped__")`.
    **THE ONLY SHIPPED ASSERTION THAT THE CD-ASR-F03 GUARD WAS APPLIED WAS THE PRESENCE OF THE
    ATTRIBUTE THAT REMOVES IT.** The superseded assertion is QUOTED IN THE DOCSTRING, not deleted.
  the_intent_kept_the_instrument_changed_FOUR_ASSERTIONS:
  - '1. THE NEGATIVE — `not hasattr(..., "__wrapped__")` and `inspect.unwrap(x) is x`, matching
     `tests/test_admission.py:334` and `tests/test_field_establishment.py:215`. **THREE SITES, ONE
     PRACTICE, THREE CARRIERS**, which is what the ruling asked for.'
  - '2. THE GUARD FIRES ON THE REAL OBJECT — the module-level post-condition is replaced by a spy,
     the REAL `_evaluate_dial` is called, and the spy is asserted to have been called ONCE with the
     real (spec, usable, reading). **NOT "an attribute is present" — the post-condition OBSERVED
     RUNNING at the real boundary.**'
  - '3. THE GUARD SURVIVES ANY BODY — the docstring''s actual claim. The decorator is applied to a
     body that returns a value-bearing reading having received no inputs (CD-ASR-F03''s own shape)
     and must raise `AbsenceYieldedAValue`. **WITH THE COUNTERFACTUAL ARM (CD-D-079): the identical
     body UNDECORATED returns the bad `Value` happily.**'
  - '4. THE OPEN HALF ASSERTED OPEN — the closure cells still reach the undecorated function, and
     the assertion FAILS IF THAT EVER CLOSES, so the declared limit cannot go stale in the
     comfortable direction.'
  proved_non_vacuous_at_its_own_seam_PBG_ASSURE_017: |
    Two throwaway trees, the guard broken at each of its two seams:
      delattr REMOVED (bypass restored) -> FAILED, "the CD-ASR-F03 guard must not publish a
                                           documented way round itself", assert not True
      guard CALL removed               -> FAILED, "the post-condition was not called at the
                                           evaluator's boundary", assert 0 == 1
    **TWO SEAMS, TWO DISTINCT MESSAGES.** A single message for both would have been one assertion
    wearing four hats.

item_3_part_c_every_live_wrapped_BY_INSTRUMENT:
  instrument: 'tools/audit/enumerate_live_wrapped.py — NEW. EXIT 0.'
  why_it_imports_the_product_when_no_other_instrument_here_does: >
    **`__wrapped__` IS A RUNTIME ATTRIBUTE ON A COMPILED FUNCTION OBJECT AND APPEARS IN NO SOURCE
    FILE.** A source scan cannot answer this and A GREP IS NOT AN INSTRUMENT — that is precisely the
    reading that let this bypass survive three gates: everyone saw `@functools.wraps` and did not
    ask the object. The cost is DISCLOSED in the header: an auditor who trusts nothing in the
    implementation cannot trust this one, so it does not replace the static checks.
  THE_RESULT_AND_A_COUNT_IS_NOT_AN_ANSWER: |
    OBJECTS INTERROGATED: 808.  MODULES THAT FAILED TO IMPORT: 0.
    LIVE `__wrapped__` FOUND: 43 — classified by WHERE THE WRAPPER'S OWN CODE LIVES, derived from
    the object and never from a list of known-good names:
      **APPLIED BY THIS PROJECT'S OWN CODE — THE ONLY BUCKET THAT IS A FINDING : 0**
      `staticmethod`/`classmethod` objects, CPython's BUILT-IN descriptor            : 8
      wrapped by code OUTSIDE the package (`reprlib.recursive_repr` via `dataclasses`): 35
    **THE RAW 43 WOULD HAVE READ AS 43 PROJECT BYPASSES AND IT IS ZERO.** The 8 are
    `Sealed*Type.__new__` and friends, where `__wrapped__` is a CPython attribute on the
    `staticmethod` OBJECT and nothing applied `functools.wraps`; the 35 are every `@dataclass`
    `__repr__`, wrapped by `reprlib`.
  the_discriminator_and_why_the_OBVIOUS_one_is_WRONG: >
    The classifier reads `carrier.__code__.co_filename` — **where the WRAPPER'S code lives.** It
    does NOT read the target's `__module__`, and that matters: **`functools.wraps` COPIES
    `__module__` FROM THE WRAPPED FUNCTION**, so a `dataclasses` `__repr__` wrapped by `reprlib`
    reports `__module__` = the product module and would be MISFILED AS THIS PROJECT'S CODE by any
    check that trusted it. Measured — that is what this instrument's first version would have done.
  PROVED_NON_VACUOUS_and_this_is_the_arm_that_matters: |
    The same instrument, copied unchanged into a pristine extraction of 9f7b764:
      BEFORE  LIVE FOUND: 44   **PACKAGE DECORATOR: 1**
              crash_detector.engine.evaluate._evaluate_dial -> '_evaluate_dial'
              `_absence_is_never_a_number` — the CD-ASR-F03 guard   **PRESENT  <- A BYPASS**
      AFTER   LIVE FOUND: 43   PACKAGE DECORATOR: 0
              `_absence_is_never_a_number` — the CD-ASR-F03 guard   absent
    **44 -> 43, AND THE ONE THAT MOVED IS THE RIGHT ONE.** A "0 found" from an instrument that has
    never found anything is not evidence.
  what_it_does_NOT_reach_PRINTED_AT_EVERY_RUN: >
    an object reachable only from a function's CLOSURE CELLS; an object created LAZILY after import;
    a wrapper on an object inside a CONTAINER in a namespace; a class attribute more than ONE level
    of nesting in; anything in a module that fails to import (reported as a row, never skipped).

