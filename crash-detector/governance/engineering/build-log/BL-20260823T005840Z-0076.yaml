findings:
- id: CD-ENG-WO2R3-03-F11
  severity: HIGH
  against: 'THIS INCREMENT AGAINST ITSELF — item 2''s criterion versus item 3''s fix.'
  what_happened_MEASURED: >
    Item 2's reachability clause treated `PASSED_TO` as an escape and DENIED BY DEFAULT. Item 3's
    fix is `delattr(guarded, "__wrapped__")` — **A CALL WITH `guarded` AS AN ARGUMENT.** So the
    clause reclassified the CD-ASR-F03 net as a REACHABLE DOOR and the doors check went
    **PASS -> `FAIL — 2 violation(s)`** (`UNDECORATED_JUDGEMENT_PATH_DOOR` +
    `NET_DECLARED_BUT_ABSENT`) **ON THE INCREMENT'S OWN REPAIR.**
  why_it_is_HIGH: >
    **THAT IS THE EXACT OUTCOME PO-DECISIONS-0012 RULING 1 FORBIDS — `guarded` becoming a door —
    produced by the instrument written to implement ruling 2.** And both available escapes were
    worse than the defect: an exclusion list of "callees that do not retain" is A VOCABULARY, which
    is what ruling 2 exists to remove; decorating `guarded` is prohibited outright. **THE ONLY
    HONEST MOVE WAS TO CORRECT THE CRITERION.**
  how_it_was_found_and_this_is_the_uncomfortable_part: >
    **NOT BY DESIGN.** It surfaced while measuring ITEM 4's escape in a throwaway tree, where an
    unrelated plant produced two violations in `evaluate.py` that had nothing to do with the plant.
    Had item 3 landed in its own commit before item 4 was measured, **THE DOORS CHECK WOULD HAVE
    BEEN RED AT THAT COMMIT AND I WOULD HAVE BEEN DEBUGGING IT AS A REGRESSION RATHER THAN
    UNDERSTANDING IT AS A DESIGN ERROR.**
  the_correction: >
    `PASSED_TO` is TAGGED and NOT treated as an escape. The clause now answers the question actually
    asked — *can a caller outside this module obtain and call it* — rather than a broader one
    (*could anything at all happen to it*). Declared in all three CD-RULE-004 places, with this
    measurement, as a DELIBERATE WEAKENING and not as a neutral choice.
  WHAT_IS_LOST_AND_IT_IS_REAL: >
    **A CALLEE THAT STORES THE OBJECT SOMEWHERE REACHABLE IS NOT SEEN.** `register(decide)` where
    `register` appends to a module-level list is invisible to this clause. **CARRIER: NOT PROVED TO
    BE CARRIED ANYWHERE**, except that ON A JUDGEMENT PATH the NETS population denies by default and
    such a callable fails `UNCLASSIFIED_INTERCEPTOR` unless declared. Off a judgement path: nothing.
  regression_carrier: 'tests/test_judgement_path_doors.py::test_the_projects_own_delattr_fix_does_not_make_the_net_a_door, which also asserts the delattr is still in the shipped source so it cannot pass vacuously.'
  disposition: 'REPAIRED IN THIS COMMIT. **RAISED AT HIGH BECAUSE THE INTERACTION, NOT THE BUG, IS THE FINDING**: two items of one increment, each correct alone, wrong together.'

