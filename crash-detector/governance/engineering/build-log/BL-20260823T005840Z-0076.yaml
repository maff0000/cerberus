- id: CD-ENG-WO2R3-03-F13
  severity: LOW
  against: 'THE `__wrapped__` ENUMERATION INSTRUMENT — its first version would have lied.'
  what_is_measured: >
    The obvious discriminator for "is this wrapper ours" is the target's `__module__`. **IT IS
