# --- what was closed --------------------------------------------------------------------------- #

the_class_closed: >
  ABSENCE YIELDING A NUMBER. Not the name `magnitude`, not "a property", not "a module-level
  constant": any route by which a Reading representing absence produces, exposes or is coerced
  into a numeric value, and any route by which a code path that did not get its inputs constructs
  a reading carrying one.

  HALF (a), the absence OBJECT: CLOSED AS A CLASS. No route exists by which a Reading acquires a
  numeric — or any other undeclared — member through construction, class-body definition, class
  assignment, class deletion, a decorator, a metaclass, inheritance, instance assignment or
  object.__setattr__. ONE RESIDUE remains and is declared: post-import mutation of the class
  object through type.__setattr__.

  HALF (b), the code path: CLOSED AS A CLASS at runtime. A dial that did not get its required
  inputs cannot return a reading that carries a value, whatever the number is and wherever it came
  from, because the refusal never asks about the arithmetic — it checks the CLAIM against the
  inputs.

implemented:
- id: 'LAYER 1 — the declared attribute surface, asserted by EQUALITY'
  where: src/crash_detector/dials/reading.py
  what: >
    DECLARED_MEMBER_SURFACE names the complete class dictionary of each of Value, Degraded and
    Unknown. seal_reading_type() asserts set equality in BOTH directions during import, so an
    added OR removed member makes `import crash_detector.dials.reading` raise
    ReadingSurfaceViolated. A small enumerated TOLERATED_INTERPRETER_MACHINERY set admits the
    names CPython's dataclasses/type machinery may add depending on patch level (__getstate__,
    __setstate__, __replace__, __weakref__, __firstlineno__, __static_attributes__) — an
    allowlist, each with its reason, and __dict__ deliberately NOT among them because a __dict__
    descriptor re-opens instance injection.
  why_it_is_a_class: >
    The old test asked "is any name from ARITHMETIC_DUNDERS present?", which is a blacklist and is
    exactly why E03 was invisible. This asks "is the surface the declared one?", so a member
    nobody anticipated fails for NOT BEING DECLARED rather than passing for not being listed.
- id: 'LAYER 2 — no instance attribute injection'
  where: src/crash_detector/dials/reading.py
  what: >
    All three constructors declare __slots__ in the class body, so instances carry no __dict__.
    `reading.magnitude = 0.0` raises FrozenInstanceError and
    `object.__setattr__(reading, "magnitude", 0.0)` — which walks past the frozen dataclass's
    __setattr__ — raises AttributeError. Frozen alone never closed this: it refuses assignment to
    a DECLARED field and says nothing about adding an undeclared one.
  measured_design_choice: >
    __slots__ is declared MANUALLY rather than with @dataclass(slots=True). Measured, not
    preferred: slots=True makes dataclasses RE-CREATE the class, which in CPython 3.11.2 leaves
    the generated frozen __setattr__ closure pointing at the discarded class, and because
    typing._GenericAlias.__call__ swallows only AttributeError, `Value[int](...)` then raises
    TypeError instead of working. Manual __slots__ avoids the re-creation entirely and
    subscripted construction keeps working. This was found by running it, not by reading about it.
- id: 'LAYER 3 — no subclass route'
  where: src/crash_detector/dials/reading.py
  what: >
    The SealedReadingType metaclass refuses to create any subclass of a sealed constructor, and
    refuses class-attribute assignment and deletion once sealed. fold() and is_value() now
    dispatch on EXACT TYPE IDENTITY rather than isinstance. This was a real hole, not a
    hypothetical: the dispatch named it, and a subclass of Unknown carrying a numeric member would
    have been accepted everywhere a Reading is accepted while passing every check aimed at the
    three declared classes.
  design_note: >
    A METACLASS and not a base class, because reading.py's own docstring refuses a shared base as
    "somewhere a numeric accessor could later be added that all three constructors would inherit".
    A metaclass member is reachable on the class and NOT on an instance, so
    test_the_three_constructors_share_no_ancestor_but_object still passes unmodified.
- id: 'LAYER 4 — consumer-boundary re-verification'
  where: src/crash_detector/dials/reading.py, src/crash_detector/dials/dialset.py, tests/test_reading.py
  what: >
    fold(), is_value() and DialSet.__post_init__ re-verify the surface of the reading's actual
    class on every call and raise ReadingSurfaceViolated on a breach. tests/test_reading.py
    additionally imports EVERY module in the application package in a clean subprocess and then
    re-verifies all three surfaces — an assertion about the OUTCOME rather than about any route,
    so an in-tree module that breaches a surface is caught however it did it.
- id: 'LAYER 5 — the absence post-condition (CD-ASR-F03''s runtime closure)'
  where: src/crash_detector/engine/evaluate.py
  what: >
    refuse_a_number_without_its_inputs(spec, usable, reading), applied to the per-dial evaluator
    by the _absence_is_never_a_number decorator. It re-derives from the function's OWN ARGUMENTS
    whether the dial got its required inputs — three ways it can fail: no required inputs
    declared, no contribution model declared, or a declared required input not in the usable set —
    and raises AbsenceYieldedAValue if the returned reading carries a value anyway.
  why_it_is_a_class: >
    It never asks where the number came from, so the space of provenances it must anticipate is
    EMPTY. A literal, a module-level constant, a configuration default, an environment variable, a
    previous magnitude carried across a gap, a value read from the store and an expression nobody
    has thought of all fail identically. And because the guard sits at the function BOUNDARY and
    derives from the arguments, it survives any rewriting of the body — which is what CD-ASR-F03
    was: an edit to a body whose rules lived in that body.
  one_directional: >
    Deliberately. A body returning Unknown where a number was available is NOT refused; that is
    the safe direction, and a guard that compelled a number would push against PID §3.2 rather
    than for it. Tested in all three input states.
- id: 'LAYER 6 — RULE F, the positive shape (the AST guard stops enumerating spellings)'
  where: tools/register/check_no_numeric_default.py
  what: >
    Rules A-E are RETAINED and unweakened. RULE F is added and inverts the question: instead of
    enumerating ways a number can arrive it enumerates the ONE way a dial magnitude is PERMITTED
    to arrive — DECLARED_MAGNITUDE_SOURCES, the declared ContributionModel.compute applied to
    present inputs — and reports every other provenance. For each Value or Degraded construction
    on the scanned path, the magnitude is traced back through the assignments of its scope chain;
    a trace terminating anywhere other than a declared source is a violation, INCLUDING a
    terminus the check does not recognise at all. Deny by default: silence is a violation.
  doctrinal_basis: >
    PID §3.6 forbids unexplained mappings and BLUEPRINT §7 requires a reading to be explicable
    from its stored inputs, so a magnitude whose provenance the guard cannot name is already
    outside what the product permits. Rule F does not invent a rule; it enforces one already
    ratified.
- id: 'THE REGISTER CORRECTION and both execution contracts'
  where: required-tests.yaml, contracts/execution/CD-RT-001-*.md
  what: >
    Both CD-AC-001 entries rewritten to claim exactly what their guards deliver, each with a
    DECLARED LIMIT in the CD-RT-012-NO-EXECUTION-INTERFACE pattern — stated CONSISTENTLY in the
    check/module header, the register entry and the execution contract, each boundary carrying an
    example an auditor can execute, plus an explicit instruction not to read a clean run as proof
    of the proposition. CD-ENG-F40 was raised last time for exactly this inconsistency between
    the three; it was not repeated.
  the_scope_decision_and_why: >
    CD-RT-001-AST-NO-NUMERIC-DEFAULT RETAINS `scope: CLASS`. The dispatch permits either making
    CLASS true or changing the declaration and forbids only claiming CLASS while enumerating
    spellings. After RULE F the check no longer enumerates spellings — it denies by default — and
    the residue is a LAYER boundary (static versus dynamic), which is precisely what CD-RT-012
    declares and what an independent auditor judged honestly and conservatively drawn. The
    declaration now says which layer carries which half rather than claiming both. A reviewer who
    disagrees can change one word; this seat states the reasoning so the disagreement is cheap.

