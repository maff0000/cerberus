# --- declared limits ---------------------------------------------------------------------------- #

declared_limits:
- id: 'THE TYPE LAYER — post-import class mutation'
  statement: >
    type.__setattr__ installs a class attribute without going through a metaclass, and CPython
    offers no way to refuse it. After
    `type.__setattr__(Unknown, "magnitude", property(lambda self: 0.0))` the expression
    `Unknown(reason="R", since_utc=t, missing_inputs=()).magnitude` DOES evaluate to 0.0 for code
    that reads it directly without passing the reading to any consumer.
  what_is_closed: >
    fold(), is_value() and DialSet all raise ReadingSurfaceViolated on a reading of a mutated
    class, and the declared arm's package-import sweep fails for ANY in-tree mutator, whatever
    route it used. So absence cannot acquire a numeric member through construction, assignment,
    inheritance or definition, and a mutated class is refused wherever a reading of it would be
    used.
  what_is_not: >
    A mutation by code OUTSIDE the application package — an operator's script, a plugin, a
    debugger, an interactive session — and a direct attribute read that reaches no consumer.
  stated_in: 'reading.py header · required-tests.yaml CD-RT-001-ABSENCE-RENDERS-UNKNOWN ·
    contracts/execution/CD-RT-001-ABSENCE-RENDERS-UNKNOWN.md · variants/WO-2R/MANIFEST.md row V04'
- id: 'THE STATIC LAYER — six boundaries'
  statement: >
    (1) a construction RULE F cannot see as a construction, with V03 as the executable example;
    (2) tracing beyond one scope chain — reported, not followed, so deny by default rather than an
    escape, but a legitimate future helper must be DECLARED or it is reported; (3) anything outside
    the two declared tiers; (4) class A outside the dial path, printed as a note (CD-ENG-F26);
    (5) a magnitude legitimately computed but WRONG; (6) runtime, configuration and data.
  who_carries_what: >
    Boundaries 1 and 6 are carried by the RUNTIME layer and the declaration says so explicitly
    rather than implying both layers cover everything. Boundaries 2 and 3 are carried by nobody at
    WO-2 and say so.
  stated_in: 'check_no_numeric_default.py header · required-tests.yaml
    CD-RT-001-AST-NO-NUMERIC-DEFAULT · contracts/execution/CD-RT-001-AST-NO-NUMERIC-DEFAULT.md'

# --- findings against this seat's own work ------------------------------------------------------ #

findings_raised:
- id: CD-ENG-WO2R-F01
  severity: LOW
  against: 'this seat''s own work'
  what: >
    The CD-RT-001-ABSENCE-RENDERS-UNKNOWN plant used to be INVISIBLE to the sibling AST arm, and
    plants/MANIFEST.md reasoned from that fact to demonstrate that the two CD-AC-001 tests are not
    two spellings of one instrument. RULE F now catches that plant too, so the plant no longer
    demonstrates the arms' independence. The plant is still a valid negative control for its own
    arm; what it lost is a secondary property the manifest claimed for it.
  disposition: >
    DISCLOSED in its manifest row, not smoothed over. The property is now demonstrated by variant
    V03, which is executable, recorded, and lands squarely on the declared limit it illustrates. No
    plant was redesigned to restore the old demonstration, because the dispatch requires a plant to
    violate the SAME proposition by the same route and changing its route would be scope this seat
    does not have.
- id: CD-ENG-WO2R-F02
  severity: LOW
  against: 'this seat''s own closure'
  what: >
    The DECLARED_MEMBER_SURFACE table contains CPython dataclass and typing implementation members
    (__dataclass_fields__, __match_args__, __orig_bases__ and the rest). That makes the seal
    sensitive to the interpreter, not only to this project's code: a future CPython that adds a
    member this table does not list, and that TOLERATED_INTERPRETER_MACHINERY does not admit, makes
    the dial path FAIL TO IMPORT on that interpreter.
  assessment: >
    It fails CLOSED and it fails LOUDLY, which is the right direction — the alternative was
    tolerating a computed set, which would declare whatever it found including whatever an attacker
    added. But an auditor on a different interpreter may meet a ReadingSurfaceViolated that is
    about CPython and not about the tree, and should read the exception rather than assume a plant.
    The tolerance list is enumerated with reasons and holds six names.
- id: CD-ENG-WO2R-F03
  severity: LOW
  against: 'this seat''s own closure'
  what: >
    The absence post-condition can be removed by deleting one decorator line, and RULE F can be
    weakened by adding a name to DECLARED_MAGNITUDE_SOURCES. Both are guarded — a test asserts the
    per-dial evaluator carries __wrapped__, and the declared surface test carries an independent
    copy of its table — but neither guard is itself guarded, and this regress has to stop
    somewhere. It stops here, and the fact that it stops here is stated rather than left implicit.
- id: CD-ENG-WO2R-F04
  severity: INFORMATIONAL
  against: 'this seat''s own method'
  what: >
    This seat's FIRST runtime probe for the F03 variants used empty_config_snapshot, which takes
    the "no required inputs" branch and NEVER EXECUTES the missing_required branch the variants
    patch. It reported a clean Unknown and would have been recorded as "not reproduced" had it been
    trusted. The probe was rewritten to declare and register one REQUIRED source with a
    contribution model and then supply no observation.
  disposition: >
    Disclosed, and the corrected probe is written out IN FULL in variants/WO-2R/MANIFEST.md with
    this warning attached, so the next auditor does not repeat it. A probe that does not reach the
    planted branch produces a clean result for the wrong reason, which is the most expensive kind.
- id: CD-ENG-WO2R-F05
  severity: INFORMATIONAL
  against: 'the pre-existing register checks'
  what: >
    RULE F caught this seat's own first draft: `getattr(cls, "__dictoffset__", 0)` in reading.py
    tripped class B (numeric fallback in a lookup). The CODE was fixed and the CHECK was not
    touched. Recorded because it is direct evidence that the guard bites its author, and because
    the dispatch forbids weakening a check to obtain a pass — the temptation was real and is
    written down rather than resisted silently.

