the_carriage_is_VERIFIED_BY_COMMAND_IN_BOTH_ARMS:
# ================================================================================================== #
  instrument: 'tools/reconciliation/check_pid_carried_po_0020_verbatim.py — NEW FILE, third sibling of the 0018 and 0019 checks.'
  why_a_new_file_and_not_an_edit: >
    **EACH CHECK IS STANDING EVIDENCE FOR ONE CARRIAGE. MUTATING THE 0019 CHECK TO COVER 0020 WOULD
    HAVE DESTROYED THE EVIDENCE FOR v0.4.0 IN THE ACT OF PRODUCING EVIDENCE FOR v0.4.1.**
  primary_arm: '`python3 -B tools/reconciliation/check_pid_carried_po_0020_verbatim.py --root .` -> **EXIT 0**. 9/9 sentences resolving in BOTH the ruling and their target; 1335 normalised characters of Product Owner text carried; arm 2a REMOVED; arm 2b 4/4 survivals are quoted MENTIONS; arm 3 register MEASURED ABSENT.'
  counterfactual_arm: '`--counterfactual` -> **EXIT 1**, 11 checks failing: 9/9 sentences FAILED on one altered word, arm 2a caught the re-introduced construction, arm 2b caught the unquoted USE. **THE CHECK CAN FAIL, AND THAT IS PROVED AND NOT ASSERTED.**'
  the_hard_part_and_it_is_worth_naming: >
    **A DELETION CANNOT BE PROVED BY "THE STRING IS GONE", BECAUSE THE PRODUCT OWNER'S RULING
    QUOTES THE SENTENCE IT REMOVES AND THAT RULING IS CARRIED VERBATIM.** The string MUST still
    occur or the carriage would be incomplete. **SO THE ARM IS USE-VERSUS-MENTION: the original
    normative construction must be absent outright (2a), and every survival must sit inside
    quotation marks (2b). A NAIVE ABSENCE TEST WOULD HAVE BEEN UNPASSABLE AND A NAIVE PRESENCE TEST
    WOULD HAVE BEEN VACUOUS.**
  regression_checked_and_not_assumed: 'Both prior carriage checks re-run against the edited tree — `check_blueprint_carried_po_0019_verbatim.py` EXIT 0, `check_blueprint_carried_po_text_verbatim.py` EXIT 0. **EDITING `BLUEPRINT.md` COULD HAVE BROKEN EITHER AND THIS SEAT DID NOT ASSUME IT HAD NOT.**'

