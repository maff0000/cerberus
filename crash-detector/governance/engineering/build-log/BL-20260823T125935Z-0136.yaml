the_reconciliation_FIRST_because_two_commit_messages_claimed_more_than_their_trees_held:
# ================================================================================================== #
  why_this_section_is_first: >
    **THE BOOT VERDICT WAS `AMBER` AND THE RECORD AND THE TREE DISAGREED, SO NOTHING WAS BUILT
    UNTIL THEY WERE RECONCILED** (`CLAUDE.md` stop condition: *"recorded and observed state
    disagree — reconcile and report; never silently correct"*). The disagreement was NOT in the
    governed documents. **IT WAS IN THIS SEAT'S OWN COMMIT SUBJECTS**, and it was found by running
    `git show --numstat` against them instead of reading them.

  finding_CD-PL-F139:
    id: CD-PL-F139
    severity: MEDIUM
    against: PROJECT_LEAD_SEAT_01 — this seat, at commit `abafec2`'s subject line
    status: OPEN
    what: >
      **A COMMIT SUBJECT ASSERTS WORK THAT THE COMMIT DID NOT DO AND THAT NO COMMIT HAD DONE.**
      `abafec2`'s subject reads *"the two criteria placed in PID §6 BY KIND ... F05 repaired by the
      only hand that may — the normative sentence removed from the protected Blueprint"*. **THE
      COMMIT CHANGED ONE FILE: `governance/decisions/PO-DECISIONS-0020.md`, 53 insertions, 0
      deletions.** `PID.md` was untouched and contained no `CD-AC-017`. `BLUEPRINT.md` was
      untouched and the sentence was still at line 712.
    the_mechanism_and_why_it_is_not_a_lie: >
      The subject is written in the mood of the RULING — a faithful precis of what
      PO-DECISIONS-0020 ORDERS. It is true as a description of the decision and FALSE AS IMPLIED
      ABOUT THE TREE. **THAT IS THE SAME DEFECT SHAPE THIS PROJECT HAS FOUND SEVEN TIMES IN OTHER
      PEOPLE'S ARTEFACTS** — a claim that is defensible in one reading and load-bearingly wrong in
      the reading a future reconciler will actually take.
    why_it_matters_concretely: >
      **A SUCCESSOR SEAT BOOTING FROM `git log --oneline` — WHICH IS EXACTLY HOW THIS SEAT BOOTED —
      WOULD HAVE CONCLUDED THE RECORD ACT WAS DONE AND MOVED STRAIGHT TO META-ASSURANCE, LEAVING
      THE PID UNAMENDED AND `F05` OPEN UNDER A RECORD SAYING BOTH WERE CLOSED.** The only reason
      that did not happen is that this seat measured the commits rather than trusting them.
    remedy_NOT_TAKEN_HERE: >
      **NOT REPAIRED BY EDIT AND IT CANNOT BE — `CLAUDE.md` non-waivable: *"do not rewrite Build Log
      history — corrections supersede, never edit"*, and the same logic governs commit subjects,
      which are immutable without a history rewrite.** This entry IS the correction, and it
      supersedes. **THE REMEDY IS PROSPECTIVE AND IT IS A RULE, PROPOSED TO THE PRODUCT OWNER AND
      NOT SELF-ADOPTED: a commit subject states what THE COMMIT'S TREE CHANGED; what a ruling
      ORDERS goes in the body, in the future tense.**

  finding_CD-PL-F140:
    id: CD-PL-F140
    severity: HIGH
    against: PROJECT_LEAD_SEAT_01 — this seat, at commit `5e0a873`
    status: OPEN
    what: >
      **A DISPATCH WAS DECLARED "ISSUED AND OUT" TO A NAMED SEAT AND NO SEAT EVER RETURNED
      ANYTHING. THERE IS NO RESULT ARTEFACT ANYWHERE IN THE TREE.** `5e0a873` wrote
      `governance/dispatch/CD-DISPATCH-META-ASSURANCE-01.yaml` (195 insertions) and its subject
      says *"ISSUED AND OUT to CD-META-01"*. MEASURED: `find . -iname '*META*'` returns the
      dispatch file and NOTHING ELSE. `governance/assurance/` has no meta directory.
    the_mechanism: >
      **WRITING A DISPATCH FILE IS NOT ISSUING A DISPATCH, AND THIS SEAT'S RECORD CONFLATED THEM.**
      The seat either never launched, or launched and died with the context that held its result.
      **`PBG-CONT-007` NAMES THIS EXACTLY: "A sub-agent result that exists only in conversation is
      not project state." THE PRIOR SEAT KNEW THAT RULE, CITED IT ELSEWHERE, AND STILL RECORDED AN
      OUTCOME THAT LEFT NO DURABLE TRACE.**
    aggravating: >
      **THE SAME COMMIT DECLARED "NOTHING MOVES ON `main` WHILE IT READS" AND PINNED THE SEAT TO
      `5e0a873`.** Had this seat honoured that sentence on faith, it would have frozen `main`
      indefinitely waiting for a reader that does not exist. **A FREEZE CONDITIONED ON AN EVENT
      THAT LEAVES NO EVIDENCE IS A DEADLOCK, AND ONLY MEASUREMENT BROKE IT.**
    and_it_was_OUT_OF_SEQUENCE_which_is_a_third_fact: >
      PO-DECISIONS-0020 was already on `main` at `abafec2` when `5e0a873` was written, and its
      ruling 4 sequences the record act FIRST and meta-assurance SECOND. **THE DISPATCH WENT
      BEFORE THE RECORD ACT IT WAS SUPPOSED TO FOLLOW.** This boundary restores the ruled order.
    remedy_TAKEN_HERE: >
      The dispatch is RE-ISSUED at this boundary's SHA, not resumed — see the dispatch section
      below. **AND THE STANDING RULE THIS SEAT WILL NOT WRITE FOR ITSELF IS PUT TO THE PRODUCT
      OWNER AS Q7: a dispatch may be recorded as ISSUED only when a durable artefact proves the
      seat received it, and "OUT" is a claim about evidence, not about intent.**

  what_reconciled_CLEAN: >
    **THE GOVERNED DOCUMENTS THEMSELVES WERE HONEST.** BLUEPRINT v0.4.0's §14/§15 rows for
    `CD-AC-017`/`CD-AC-018` were present exactly as `BL-...-0135` recorded them; the v0.4.0 §19 row
    disclosed, in its own words, the two things it did NOT do — *"it does not write the register
    rows ... and it does not repair `F05`'s existing §16 sentence, because only the Product Owner
    may"*. **THAT DISCLOSURE IS WHY THE GAP WAS FINDABLE IN SECONDS. The prior seat's documents
    told the truth about their own incompleteness while its commit subjects did not, and both
    facts belong in this record.**

