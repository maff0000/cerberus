ruling_2_the_F05_repair_which_is_a_DELETION:
# ================================================================================================== #
  what_was_removed: '"not as a note, not as a residue paragraph, and not as a manual step" — BLUEPRINT.md §16, one sentence, welded to the FORGERY-DETECTION OBLIGATION statement.'
  by_whom: >
    **THE PRODUCT OWNER, AT THE PO LAYER.** Its own words: *"is MY prose that landed in
    BLUEPRINT.md, which CD-D-115 protects from every seat including me-via-a-seat — so no Engineer
    could remove it and none should have tried."* **THIS SEAT CARRIED A DELETION; IT DID NOT
    AUTHOR ONE.** `F05` was raised against a seat writing unattributed normative prose in a
    protected file, and repairing it by having a seat silently delete text would have reproduced
    the defect in the act of curing it.
  what_replaced_it: >
    **A POINTER, AND THE POINTER IS THE RULING ITSELF QUOTED VERBATIM AND ATTRIBUTED** — not this
    seat's paraphrase of it. The requirement now LIVES as `CD-AC-017`/`CD-AC-018` in the PID and
    the register.
  §17_UNTOUCHED: >
    `CD-BP-005` was READ and LEFT EXACTLY AS v0.4.0 WROTE IT. It already cites both criteria in its
    RISK/HANDLING columns, which is what the ruling requires of it. **MEASURED, not assumed.**
  a_LABEL_DISCREPANCY_DISCLOSED_RATHER_THAN_SILENTLY_RESOLVED:
    what: >
      **THE RULING LOCATES THE SENTENCE IN "the Blueprint's risk section" AND THE DISPATCHING BRIEF
      SAID §17. THE SENTENCE WAS IN §16.**
    how_it_was_resolved: >
      **BY BYTES, NOT BY LABEL.** The ruling identifies its target by quoting it exactly, and those
      bytes occurred EXACTLY ONCE in the file — at line 712, inside §16 *"What this Blueprint
      deliberately does not decide"*. `grep -c` confirmed the uniqueness before anything was
      deleted. **A UNIQUE QUOTED STRING IS AN UNAMBIGUOUS TARGET AND A SECTION NUMBER IS AN
      ANNOTATION; WHERE THEY DISAGREED THE QUOTATION GOVERNED.**
    why_it_is_recorded_and_not_just_fixed: >
      **BECAUSE A SEAT DECIDING WHICH HALF OF A PRODUCT OWNER'S INSTRUCTION TO BELIEVE IS EXACTLY
      THE MOVE THAT NEEDS WITNESSING, EVEN WHEN — ESPECIALLY WHEN — IT GETS IT RIGHT.** The
      disclosure is written into `BLUEPRINT.md` §16, the §19 row and here. If the Product Owner
      meant a different sentence in §17, **NOTHING WAS LOST: the removal is one `git revert` away
      and the original bytes are readable at `5e0a873`.**
  findings_discharged:
    CD-ASR-WO2R3-05-F05: 'DISCHARGED by the Product Owner''s act. **NOT closed by this seat''s judgement, and a seat could not have closed it** — the finding was against prose only the PO may touch.'
    CD-ASR-WO2R3-05-F03: 'DISCHARGED BY THE SAME ACT, on the ruling''s own reasoning: *"because the obligation now has the required form."* The obligation is no longer carried in the three forms `CD-D-172` forbids.'
  version_moved: 'BLUEPRINT.md 0.4.0 -> 0.4.1, with a §19 row. PATCH: no design decision changed, nothing was added — a sentence was removed and a pointer put in its place.'

