ruling_1_the_PID_amendment_CD-AC-017_NEW_and_CD-AC-018_STRENGTHENS:
# ================================================================================================== #
  the_authority: >
    `PID.md` frontmatter: *"amendment: PO only; sections marked CONSTITUTIONAL by Matt only"*.
    PO-DECISIONS-0020: *"both are the Product Owner's alone (PBG-PID-002, CD-D-115), authored here
    for verbatim carriage"*, and *"It enters PID §6 as NEW_REQUIREMENT, which is the route the
    framework blocks 'pending PO amendment of the PID' — so I amend the PID."*
    **THIS SEAT IS THE CARRIER AND NOT THE AMENDER. NO CONSTITUTIONAL SECTION (§1, §3) WAS OPENED.**

  what_landed_in_PID_§6:
    CD-AC-017: >
      **ONE NEW ROW, THE PRODUCT OWNER'S OWN, CARRIED VERBATIM** — *"Admission by declared-door
      provenance | plant: hand a judgement path a forged object of exact type that never left a
      declared door → admission refuses it; genuine article from the declared door → admitted.
      (RESISTED tier, §17 CD-BP-005.)"* **THIS IS THE FIRST CRITERION ADDED TO §6 SINCE MATT
      RATIFIED THE SET ON 2026-08-18**, and it exists because an Assurance seat's `RED` proved the
      declared perimeter false and the Product Owner corrected it rather than defending it.
    CD-AC-018: >
      **NO ROW, AND THE ABSENCE IS THE RULING AND NOT AN OVERSIGHT.** It is `STRENGTHENS
      CD-AC-004`. The ruling's own words are carried beneath the §6 table, attributed, so a reader
      who wonders why 018 is missing finds the reason at the point of the absence. Its durable home
      is the register's `pid_relation` field at WO-3.
    a_plural_that_resolved_to_one_and_is_DISCLOSED_not_smoothed: >
      **THE RULING'S LEAD-IN SAYS "The §6 rows (PO-authored, carried verbatim):" — PLURAL — AND
      THEN SUPPLIES EXACTLY ONE ROW.** This seat carried the one row the Product Owner wrote and
      **DID NOT INVENT A SECOND**. The reading is consistent: only `CD-AC-017` is a
      `NEW_REQUIREMENT` and only a `NEW_REQUIREMENT` needs a row. **BUT IT IS AN INFERENCE ABOUT
      PRODUCT INTENT MADE BY A SEAT, SO IT IS FLAGGED HERE RATHER THAN BURIED. If the Product Owner
      meant a second row, this boundary is short one and the correction is the PO's to make.**

  version_moved: 'PID.md 1.0.1 -> 1.1.0, with a §10 amendment-log row. MINOR and not PATCH: 1.0.1''s own row records "No criterion, semantics or doctrine changed" — this one adds a criterion.'
  pid_content_hash_MOVED_and_it_has_a_consequence:
    before: 'PID.md@441d83166b2f3d0c'
    after: 'PID.md@538e30f3bf4f1803'
    the_consequence_DISCLOSED: >
      **ANY REQUIRED TEST REGISTER PINNED TO THE OLD HASH IS NO LONGER A VALID INPUT AND MUST BE
      RE-PINNED.** `pbg/tools/pbg/required_tests.py` fails it with *"pid.content_hash does not match
      the referenced PID — the register's population was derived from a different document"*. **THE
      LANE REGISTER AT `be0b355` IS ONE SUCH.** It is not touched: the lane is frozen at a SHUT gate
      and `CD-RULE-002` forbids this seat writing a branch a dispatched identity owns. **THIS IS A
      REAL, DATED OBLIGATION ON WHOEVER OPENS WO-3, RECORDED HERE SO IT CANNOT BE DISCOVERED AS A
      SURPRISE.**

