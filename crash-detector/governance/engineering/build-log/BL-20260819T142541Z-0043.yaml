findings_raised:
- id: CD-ENG-WO2R-F12
  severity: LOW
  against: this seat's own work
  title: '`extra_hosts:` is a per-service name-to-address mapping this check does not read.'
  what: >
    A compose service may carry `extra_hosts: ["api.ibkr.com:198.51.100.24"]`, which writes an
    entry into the container's /etc/hosts. It is not an `x-egress` field, so CD-EGRESS-005's closed
    key set does not see it, and it is not a `hosts` entry, so CD-EGRESS-004 does not either. NO
    SERVICE IN THIS FILE DECLARES ONE TODAY and none ever has, so nothing is presently wrong; what
    is owed is coverage.
  why_it_is_declared_rather_than_fixed: >
    Closing it means asserting a closed key set over the SERVICE body itself, not merely over
    x-egress, and a compose service body legitimately carries two dozen keys across seven services
    plus a YAML anchor. Drawing that member set is a design decision with a real false-positive
    surface, it belongs with the WO-3 egress lane that will also have to reason about
    `network_mode`, `dns`, `links` and override files, and taking it here would be widening scope
    on this seat's own initiative rather than on a dispatch.
  disposition: 'DECLARED as boundary 5, NOT PROVED TO BE CARRIED ANYWHERE, and written into the
    variants manifest as the one route this seat looked for and did not close. Owed at WO-3.'
- id: CD-ENG-WO2R-F13
  severity: LOW
  against: this seat's own method, not the deliverable
  title: '`git apply` accepted hand-written patch hunks with wrong line counts and TRUNCATED them silently.'
  what: >
    This seat''s first six variant patches were written by hand with `@@ -128,4 +128,11 @@` style
    headers whose counts were one or two short. `git apply` exited 0 and applied a TRUNCATED hunk —
    the final added line was silently dropped — so a registry entry arrived with `services:` and no
    list under it. The variants still failed the check, but THEY FAILED FOR THE WRONG REASON:
    "a destination names no services" instead of the route being tested. Detected only because the
    violation text did not match the route.
  why_it_matters_beyond_this_increment: >
    A variant that fails for the wrong reason is a variant that proves nothing, and it fails
    QUIETLY, which is the same failure shape as CD-PL-F56 (`git -c` identity failing silently). Any
    seat or auditor hand-writing a patch on this project is exposed to it.
  what_was_done: >
    ALL EIGHT patches were regenerated with `git diff` in a scratch repository under /tmp, so the
    counts are machine-produced, then re-verified with `git apply --check` and RE-RUN at the
    committed SHA 4933376. Every refusal quoted in this entry and in the manifest is from a re-run
    of a regenerated patch. RECOMMENDATION, not a change taken: variants should be generated with
    `git diff`, never hand-written, and every row should assert the RULE ID it expected, not merely
    a non-zero exit.

