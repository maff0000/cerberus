# --- the closure ------------------------------------------------------------------------------ #

the_class_closed: >
  AN EGRESS ALLOWLIST ENTRY THAT REACHES A BROKER, closed as the class AN EGRESS ALLOWLIST ENTRY
  NOBODY DECLARED.

  The auditor's escape was `198.51.100.24` in place of `api.ibkr.com`, and the obvious repair — an
  IP-literal detector — was deliberately NOT written, because it reproduces the identical defect
  one level up. It would still recognise a SPELLING, and the next spelling is a CIDR, a URL, an
  unregistered hostname, a punycode host, a hex-dotted address or a container-network service name.

  What is now impossible is not "an address in an allowlist". It is AN ALLOWLIST ENTRY THAT NOBODY
  REGISTERED, in any spelling whatever, including spellings nobody has thought of — because the
  check performs NO RECOGNITION AT ALL on an entry that is not in the registry. There is no pattern
  to write around, so a new spelling is not a new route; it is the same violation.

  THIS IS A CLOSURE OF THE DECLARATION AND IS NOT CLAIMED TO BE MORE. Docker Compose has no
  per-host egress primitive; enforcement is owed at WO-3, every artefact says so, and the check
  says so on every run. The defect CD-ASR-F04 reported was in the DECLARATION the WO-3 enforcement
  lane will inherit, and it is that declaration this increment closed — which is what the Product
  Owner ordered be done BEFORE that lane exists.

the_structure: >
  DENY BY DEFAULT OVER A DECLARED, IN-TREE DESTINATION REGISTRY, exactly as CD-D-031 fixes it.

  THE INVARIANT: every entry in every service's `x-egress.hosts` is, character for character, the
  `host` of a destination registered in deploy/egress-destinations.yaml whose `services` list names
  that service. THE ADMISSIBLE SET IS DERIVED FROM THE ARTEFACT AND FROM NOTHING ELSE — there is no
  permitted host named anywhere in the guard and there cannot be one. Measured: V24 registers one
  destination and the check's assertion count moves 53 -> 67, because the registry IS the subject.

  Four supporting invariants keep the registry from becoming the hole the allowlist used to be:

    CD-EGRESS-004  deny by default, plus service scoping — a grant is to NAMED services, never a
                   global permit.
    CD-EGRESS-005  CLOSED KEY SETS, asserted by EQUALITY with a declared member set, on the
                   x-egress block, on a destination and on the registry document. This is
                   increment 1's lesson applied to a declaration: a blacklist is defeated by a
                   name nobody listed, and `hosts_extra:` is a name nobody listed.
    CD-EGRESS-006  a POSITIVE permitted hostname shape, uniqueness, an operator, a purpose, a
                   `declared_in` clause, and services that exist and declare ALLOWLIST.
    CD-EGRESS-002  the broker concept vocabulary and the known-operator denylist SURVIVE, applied
                   to every registered `host` and `operator`, to every allowlist entry as written,
                   and to every `pending` entry. NEITHER LAYER IS SOLE.

  ON THE HOSTNAME SHAPE, BECAUSE IT IS THE CLAUSE MOST LIKELY TO BE MISREAD AS AN IP DETECTOR IN
  DISGUISE: it never asks what a value IS. It asks whether the value is the one admissible shape,
  and an address, a CIDR, a URL, a wildcard, a port suffix, a trailing dot and a form nobody has
  thought of all fail the same clause. The REASON a hostname is the admissible shape is stated
  rather than assumed: the only offline evidence of what a destination reaches is its registrable
  domain, which is what the denylist reads; an address carries none, so it cannot be judged by
  layer 2 at all — and a destination nothing can judge must not be declarable.

  NO NETWORK. The check opens no socket and resolves no name (CD-PL-F48 and the dispatch's
  prohibited list). It says so in a note on every run.

why_it_is_a_class_closure: >
  The previous guard asked "does this entry look like a broker?" — a question about SPELLING, and
  undecidable offline. An address answered no. The question is now inverted to "did somebody
  DECLARE this destination, for this service, with an operator, a purpose and the clause of product
  intent that authorises it?", which is SET MEMBERSHIP and is decidable from the tree.

  That is the same move increment 1 made when it stopped enumerating spellings on the AST guard and
  asserted a declared member set by equality, and the same move increment 2b made when it changed
  "is this number blended?", which is undecidable, into "is this number's provenance DECLARED?",
  which is set equality. It is applied here to a declaration instead of to a type.

