THE_DEFECT_THAT_WAS_ALREADY_THERE_AND_IS_THE_REASON_THE_CONTRACT_IS_WORTH_HAVING:
  what: >
    **UNTIL THIS INCREMENT THE `DISPOSITIONS` TUPLE WAS CONSULTED ONLY TO PRINT THE SUMMARY TABLE.**
    A register entry carrying a word that was not in it was **silently accepted, counted into
    nothing, and never printed** — so the ONE THING THE VOCABULARY EXISTED TO CONSTRAIN, IT DID NOT
    CONSTRAIN. The five words were as unenforced as the three new ones would have been.
  how_it_was_found: 'By reading the code to find where to add the new words, and discovering there was nowhere — because nothing validated the old ones.'
  now: '`UNKNOWN_DISPOSITION`, and it binds the original five exactly as hard as the new three. Carried by `test_a_word_outside_the_vocabulary_is_rejected`.'

the_contract_and_what_makes_it_one:
  the_binding_constraint_verbatim: '**"NO NEW WORD MAY BE A SYNONYM FOR ''NOT LOOKED AT''. The instrument must REJECT a disposition whose mandatory evidence fields are absent."**'
  the_shape: >
    The five original words keep `(word, note)` — prose, unchanged. **AN ENTRY USING ONE OF THE
    THREE NEW WORDS IS `(word, EVIDENCE MAPPING)` AND NOT `(word, note)`.** Prose in the second
    position of an extended word is `DISPOSITION_EVIDENCE_MISSING`, and that case has its own test,
    because **it is the most likely way the contract would be defeated in practice**: use the new
    word, put a sentence where the evidence goes, and let it read as compliance.
  mandatory_fields:
    DEFECT_OPEN: 'finding · measured_reach · counterfactual'
    CARRIER_ONLY: 'callable · why_it_is_not_product_judgement'
    UPSTREAM_OF_THE_PATH: 'decides · route'
  AND_ONE_OF_THEM_IS_ACTUALLY_MACHINE_CHECKED: >
    **`CARRIER_ONLY` IS AN ENUMERATION, NOT A CLAIM, AND THE INSTRUMENT MAKES IT SO.** The declared
    `callable` is looked for as a CALL in every swept module other than the one that defines it, and
    a hit is `CARRIER_ONLY_HAS_A_PRODUCT_CALLER`. **MEASURED BOTH WAYS:** declaring `ensure_utc`
    CARRIER_ONLY — a callable product modules demonstrably do call — FAILS; declaring a name no
    module calls does not. That is the draft's own requirement met exactly: *"must break the build
    the day they add it."*
  and_what_that_check_does_NOT_see_declared_here: >
    It reads CALL EXPRESSIONS BY NAME. A call through an alias (`f = admission_faults; f(x)`),
    through `getattr` on a module, or through a container is invisible. **SO IT IS A FLOOR ON THE
    CALLER SET AND NOT A PROOF OF ITS EMPTINESS**, and it is declared in the function's own
    docstring rather than left to be found.

