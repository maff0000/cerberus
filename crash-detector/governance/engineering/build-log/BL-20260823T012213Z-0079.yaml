this_seats_view_on_the_draft:
  preamble: >
    **THE PROJECT LEAD DRAFTED THESE THREE AND SAID IT IS NOT CONFIDENT IN THEM, AND INVITED
    DISAGREEMENT.** *"A draft the implementer disagreed with silently is worse than no draft."* The
    Product Owner ratifies; nothing below is a decision.

  are_three_too_many_or_too_few:
    answer: >
      **TWO OF THE THREE EARN THEIR PLACE OUTRIGHT. THE THIRD IS IN THE WRONG REGISTER, NOT THE
      WRONG VOCABULARY** — see UPSTREAM_OF_THE_PATH below. So: three WORDS is right; **TWO of them
      belong in the TIER-1 site register and ONE belongs in the TIER-2 module register**, and the
      draft does not say that.

  DEFECT_OPEN:
    does_it_belong_in_a_disposition_register_at_all: >
      **YES, AND THE PROJECT LEAD'S OWN DOUBT IS ANSWERABLE.** A disposition register answers *"how
      is this site's deciding operand established?"* `DEFECT_OPEN` answers *"it is not, and here is
      the measurement"* — which IS an answer to that question, and the honest negative one. The
      register already contains `DELEGATED`, whose note says *"OPEN"*, so the form already admits
      negative answers.
    is_it_a_synonym_for_DELEGATED: >
      **NO, and the distinction is worth writing down.** `DELEGATED` says *an outside object decides,
      BY DESIGN, and here is whose authority left it open.* `DEFECT_OPEN` says *a caller can
      influence this and NOBODY INTENDED THAT.* Same openness, opposite intent, and a register that
      could not tell them apart would let a defect hide behind a design decision.
    my_one_disagreement_with_its_SHAPE: >
      **ITS MANDATORY FIELDS RESTATE A FINDING INSTEAD OF REFERENCING ONE.** `measured_reach` and
      `counterfactual` are exactly what a findings record already carries. Requiring them here
      creates **TWO COPIES OF ONE MEASUREMENT THAT CAN DRIFT**, which is this project's named
      hand-maintained-summary defect — the thing ruling 3 exists to prevent — reintroduced by the
      fix for it. **RECOMMENDATION: require `finding` to RESOLVE, and let the finding carry the
      reach and the counterfactual.**
      **AND THE REASON I DID NOT IMPLEMENT THAT: THERE IS NO FINDINGS REGISTER IN THIS TREE TO
      RESOLVE AGAINST.** Measured — `governance/` holds `authority`, `decisions`, `dispatch`,
      `engineering`; findings live in build-log prose and in assurance verdicts, neither of which is
      machine-resolvable. **SO `finding` IS TODAY AN UNCHECKED STRING, AND I AM SAYING SO RATHER
      THAN LETTING THE WORD "MANDATORY" IMPLY OTHERWISE.** Creating a findings register is a
      governance change and is not this seat's.

  CARRIER_ONLY:
    does_it_collapse_into_OUT_OF_BOUND: >
      **NO, AND THE DIFFERENCE IS CHECKABLE, WHICH IS THE STRONGEST ANSWER AVAILABLE.**
      `OUT_OF_BOUND` is a SCOPE claim — *"this increment does not cover it"* — and no instrument can
      falsify it. `CARRIER_ONLY` is a REACHABILITY claim — *"no module under `src/` calls this"* —
      and it is FALSIFIED BY AN IMPORT. **A word an instrument can disprove is categorically
      stronger than one it cannot, and collapsing the first into the second would trade a fact for
      a scope statement.**
    my_view: '**IT IS THE BEST OF THE THREE AND I WOULD KEEP IT EVEN IF THE OTHER TWO WERE DROPPED.**'
    one_caution: >
      Its `does_not_buy` says *"a carrier that asks an object about itself is a carrier that can be
      told anything"*. **TRUE, AND IT MEANS `CARRIER_ONLY` IS NOT A CLEAN BILL — it relocates the
      consequence, it does not remove it.** The word's own definition says this and the register
      must keep saying it, because "only the tests" reads as "harmless" to a tired reader.

  UPSTREAM_OF_THE_PATH:
    my_view: '**THIS IS THE ONE I DISAGREE WITH, AND THE DISAGREEMENT IS STRUCTURAL RATHER THAN ABOUT THE IDEA.**'
    the_idea_is_right: >
      The reasoning is the strongest in the draft. *"A tier-1 admission inside `admission` decides
      whether a judgement-path door establishes at all — that is not adjacent to the deciding path,
      it is upstream of every point on it."* **The fifth seat is right and the sweep denying by
      default was right.**
    the_structural_objection: >
      **IT IS DRAFTED FOR "the `crash_detector.admission` UNDECLARED MODULE entry" — WHICH IS A
      TIER-2 MODULE DISPOSITION, NOT A TIER-1 SITE DISPOSITION.** The other two words are site-level.
      This one is module-level, it lives in a DIFFERENT REGISTER
      (`DECLARED_MODULE_DISPOSITIONS`) with a different key shape and a WEAKER guarantee — the tool's
      own header says a module-level claim *"says how operands are established in that module, and a
      single site inside a module can contradict it without this file noticing"*.
      **PUTTING THREE WORDS IN ONE LIST WHEN ONE OF THEM BINDS A DIFFERENT REGISTER AT A DIFFERENT
      STRENGTH IS HOW A READER COMES TO BELIEVE THEY ARE THE SAME KIND OF CLAIM.**
      *(The contract as landed validates BOTH registers, so the word WORKS in either. The objection
      is that the DRAFT does not say which, and the answer changes what it is worth.)*
    the_second_objection_and_it_is_the_dispatchs_own_test: >
      **ITS TWO MANDATORY FIELDS ARE BOTH PROSE AND I CANNOT MAKE EITHER MACHINE-CHECKABLE.**
      `decides` and `route` are sentences. There is no instrument that can verify "is upstream of".
      The dispatch says: *"IF YOU CANNOT MAKE A WORD MACHINE-CHECKABLE, SAY SO — that is a finding
      against the Project Lead's draft and it is worth more than a compliant implementation."*
      **I AM SAYING SO. As drafted, `UPSTREAM_OF_THE_PATH` is a PROSE WORD IN A CONTRACT THAT EXISTS
      TO ELIMINATE PROSE WORDS.** What the contract can enforce is that the fields are PRESENT and
      NON-EMPTY, which stops silence but not a bad sentence.
    what_would_make_it_checkable_offered_as_options_not_as_a_decision: >
      (i) require `decides` to NAME A MODULE OR CALLABLE THAT RESOLVES, so the claim points at
      something that exists; (ii) require that the named downstream thing IS in the swept closure,
      which is checkable today; (iii) drop the word and let `crash_detector.admission` carry a
      `DELEGATED`-shaped module note whose text says the same thing — weaker, but honest about
      being prose. **THIS SEAT PREFERS (i)+(ii). IT IS THE PRODUCT OWNER'S TO RULE.**

  the_summary_the_product_owner_can_rule_on: >
    **KEEP `CARRIER_ONLY` UNCHANGED — it is checkable and it is the best of the three.
    KEEP `DEFECT_OPEN` BUT MAKE `finding` A REFERENCE THAT RESOLVES, WHICH NEEDS A FINDINGS REGISTER
    THAT DOES NOT YET EXIST.
    KEEP THE IDEA BEHIND `UPSTREAM_OF_THE_PATH` AND FIX ITS FORM: say which register it binds, and
    make `decides` name something that resolves — or accept, in writing, that one word in this
    vocabulary is prose.**
