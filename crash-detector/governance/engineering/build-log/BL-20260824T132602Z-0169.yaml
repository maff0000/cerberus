the_override_and_why_it_is_the_headline:
  what_the_dispatch_ordered: 'Make `_deref` spec-correct: a $ref with siblings is the target MERGED with those siblings, at every hop. Deny-by-default was offered only as a fallback "if full merge semantics are more than this row should absorb".'
  what_the_seat_did: 'Took deny-by-default AND SAID THE ORDERED REMEDY IS WRONG, not merely expensive.'
  its_argument: >
    $ref + siblings is a CONJUNCTION in 2020-12, not a merge. `additionalProperties` and the
    `unevaluated*` keywords are evaluated against their OWN schema object's annotations, so a
    merged object can admit documents NEITHER schema admits. A merge could therefore only ever
    WEAKEN the instrument, SILENTLY — which is exactly the shape of the defect it was closing.
    Deny can only over-report.
  this_seats_position: >
    THE ARGUMENT LOOKS RIGHT TO THIS SEAT AND THIS SEAT IS NOT THE ONE TO CERTIFY IT. It is made
    §3.2 of the Assurance dispatch in those terms: EITHER THE ARGUMENT IS CORRECT AND THIS DISPATCH
    WAS WRONG ON THE MECHANISM — which belongs on the record — OR IT IS A VERY WELL-DRESSED SHORTCUT
    AND THE VERDICT IS RED. Nobody has graded it.

