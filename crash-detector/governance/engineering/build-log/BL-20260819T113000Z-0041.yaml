new_variants_of_this_seat:

- id: V07
  patch: variants/WO-2R/CD-ASR-F01/V07-reflection-over-declared-fields.patch
  route: >
    Reflection over the container's own declared fields plus `statistics.mean`:
    `[getattr(dials, f.name) for f in dataclasses.fields(dials)]`.
  why_a_different_route: >
    E02 at least had the STRINGS "equity" and "monetary" in the source. This has NO dial name
    anywhere in any form, so a check that grew its marker set to include every dial spelling would
    still see nothing. It also uses `statistics.mean`, which never uses `+` — it reaches for
    `__float__` and `as_integer_ratio` — so it exercises a different coercion path from E02's.
  observed_refusal: >
    REFUSED. `TypeError: can't convert type 'DialMagnitude' to numerator/denominator`.
    check_no_blend.py exit 0 (declared, boundary 2).

- id: V08
  patch: variants/WO-2R/CD-ASR-F01/V08-json-round-trip-then-average.patch
  route: >
    Serialise every declared dial magnitude into one JSON document, average the parsed numbers in a
    second function that never sees a dial or a magnitude.
  why_a_different_route: >
    Neither known-set variant tries to LEAVE the type system rather than defeat it. This does no
    arithmetic on magnitudes at all: it converts them to a transport format first and does the
    arithmetic where no type survives. It is the shape that arrives when a banner is built by a
    front end rather than by the engine.
  observed_refusal: >
    REFUSED AT THE SERIALISATION BOUNDARY. `TypeError: Object of type DialMagnitude is not JSON
    serializable`. The document is never produced, so the averaging function is never reached.
    check_no_blend.py exit 0 (declared, boundary 2).

- id: V09
  patch: variants/WO-2R/CD-ASR-F01/V09-pickle-state-strips-provenance.patch
  route: >
    `copy.deepcopy(<magnitude>).__getstate__()` for every declared field, then average
    `state["quantity"]`.
  why_a_different_route: >
    It attacks the pickle/copy protocol rather than any arithmetic, comparison or aggregation.
    Nothing in the known set touches reflection.
  observed_at_a8a2781: >
    *** NOT REFUSED. RETURNED 0.5 *** from equity 0.9 and monetary 0.1, with check_no_blend.py
    exit 0. This was a REAL HOLE in this seat's own closure and it is recorded here in the same
    words as the rows that were refused. See findings_raised, CD-ENG-WO2R-F06.
  observed_refusal_after_repair: >
    REFUSED. `KeyError: 'quantity'` — the state carries no such key. check_no_blend.py exit 1,
    FAIL 1 violation, `RULE 3: reaching past the declared magnitude release` at
    src/crash_detector/publication/wire_state.py:14, naming `__getstate__`.

- id: V10
  patch: variants/WO-2R/CD-ASR-F01/V10-selection-not-arithmetic.patch
  route: >
    `max([<magnitude> for each declared field])` — "whichever dial reads highest", for a
    single-figure banner.
  why_a_different_route: >
    NO ARITHMETIC ANYWHERE, and the figure returned is one dial's own magnitude unaltered. Every
    other variant computes a new number; this one only CHOOSES — and the choice IS the blend, so
    the resulting scalar is still derived from both dials. A closure built only against arithmetic
    would let it through and a reviewer would find it hard to object to on the face of it.
  observed_refusal: >
    REFUSED. `TypeError: '>' not supported between instances of 'DialMagnitude' and
    'DialMagnitude'`. The ordering dunders are absent for exactly this reason: comparing the two
    dials presumes a shared scale, which is the premise CD-AC-002 denies.
    check_no_blend.py exit 0 (declared, boundary 2).

- id: V11
  patch: variants/WO-2R/CD-ASR-F01/V11-provenance-union-not-comparison.patch
  route: >
    Build a magnitude by `DialMagnitude.__new__` plus `object.__setattr__`, setting provenance to
    the UNION of the two dials' provenance and the payload to their mean, told as "provenance is
    preserved rather than discarded".
  why_a_different_route: >
    It does not try to defeat the provenance check — it tries to SATISFY it, which is the argument
    a thoughtful engineer would actually make. It attacks the invariant rather than the arithmetic,
    and it is the only variant that produces an object that exists.
  observed_outcome: >
    The merged object IS constructed: `__new__` and `object.__setattr__` walk past the constructor,
    as they do for any frozen object in Python (boundary B of the declared limit). It is then
    REFUSED AT THREE SEPARATE BOUNDARIES, each by comparing DATA:
      quantity_for('equity_crash')             -> CrossDialCombination, "this magnitude's
                                                  provenance is ['equity_crash',
                                                  'monetary_debasement'] and the caller asked for
                                                  it as 'equity_crash'"
      number_for_dial_slot('equity_crash', m)  -> DialProvenanceRefused, "... which is not exactly
                                                  one dial"
      EquityCrashScore(score=m, ...)           -> CrossDialCombination, "... this dial is
                                                  'equity_crash'"
    THE FORGED PROVENANCE MADE THE OBJECT LESS USABLE, NOT MORE, which is the direction boundary B
    declares. check_no_blend.py exit 1, FAIL 2 violations, both RULE 3.

false_positives_checked: >
  A closure that forbids the product is not a closure, so legitimate single-dial code was ASSERTED
  and not assumed.

  * `combine_within_one_dial` computes a rolling mean AND a maximum over four monetary magnitudes
    and returns a monetary magnitude (test_same_dial_computation_still_works). A same-dial helper
    works for one dial and refuses only when it is REUSED across both
    (test_a_same_dial_helper_reused_across_dials_fails_when_it_is_reused).
  * A magnitude publishes into its own slot and returns the number
    (test_a_dial_magnitude_publishes_into_its_own_slot).
  * `copy.deepcopy` and `pickle` round trips still WORK and return a magnitude of the right dial.
    Refusing to copy a reading would be an accidental restriction on the product, not a property
    CD-AC-002 asks for. That is why `__getstate__`/`__setstate__` exist at all — and CD-ENG-WO2R-F06
    is the price this seat paid for adding them carelessly the first time.
  * No range, unit or threshold was imposed on a magnitude; the existing range test is unchanged in
    what it asserts.
  * RULE 3 distinguishes a dunder name held as DATA from one REACHED, so `ARITHMETIC_DUNDERS` and
    `TOLERATED_INTERPRETER_MACHINERY` — both legitimate tables of dunder names, the second of them
    increment 1's work — are untouched. The first draft of RULE 3 DID fire on reading.py and was
    corrected; that is recorded because a rule that cannot tell a declaration from a reach would
    forbid the guards it stands beside.
  * THE FULL CLEAN ARM STAYED GREEN AT EVERY COMMIT, and no original pytest node id disappeared.

