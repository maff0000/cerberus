declared_limits:

- id: CD-AC-002-RESIDUE-A
  title: THE RELEASE IS A REAL DOOR AND IT IS THE ONLY ONE
  stated_in: >
    src/crash_detector/dials/magnitude.py header (boundary A);
    tools/register/check_no_blend.py header (boundary 6);
    required-tests.yaml, both the CD-RT-002-TYPE-NO-ARITHMETIC negative_control and the
    CD-RT-002-AST-NO-BLEND declared-limit comment;
    contracts/execution/CD-RT-002-TYPE-NO-ARITHMETIC.md and
    contracts/execution/CD-RT-002-AST-NO-BLEND.md.
    CONSISTENTLY IN ALL OF THEM, in the same words (CD-RULE-004).
  what: >
    A number obtained through `quantity_for(<one dial id>)` is an ordinary Python float, and two
    such numbers can be added by ordinary arithmetic. Nothing in a type system can prevent that.
  measured_example: >
    blended = (equity.score.quantity_for(EQUITY_DIAL_ID)
               + monetary.score.quantity_for(MONETARY_DIAL_ID)) / 2.0     # -> 0.5, not refused
  what_carries_it: >
    The result is UNPUBLISHABLE. `number_for_dial_slot` takes only a DialMagnitude whose provenance
    is exactly the slot's dial, and the closed public envelope schema has no third key. Asserted by
    tests/test_dial_provenance.py::test_a_released_number_cannot_be_published_as_a_dial, which
    computes the blend, shows it equals 0.5, and shows it cannot be published as either dial.

- id: CD-AC-002-RESIDUE-B
  title: object.__setattr__ REWRITES A SLOT
  what: >
    As for every frozen object in Python, `object.__setattr__(m, "provenance", ...)` walks past
    `__setattr__`. THE DIRECTION IS SAFE: a forged multi-dial provenance makes a magnitude LESS
    usable, never more — `quantity_for` refuses it by set equality, the score types refuse to carry
    it, and the publication gate refuses to publish it. There is no forgery of provenance that
    yields a number. Measured by variant V11 and by
    test_a_forged_multi_dial_provenance_yields_no_number.

- id: CD-AC-002-RESIDUE-C
  title: REFLECTION REACHES THE PAYLOAD, AS IT DOES IN EVERY PYTHON OBJECT
  what: >
    `m.__getstate__()`, `m.__reduce_ex__(2)` and `getattr(m, "_DialMagnitude__quantity")` all return
    the number at runtime and nothing in Python can prevent them. What IS true: the state dict is
    KEYED BY THE PRIVATE SLOT NAMES, so reading it in source names one and RULE 3 reports it; and a
    revived magnitude is validated exactly as a constructed one, so reflection is a way of READING
    the payload and never a way of FORGING a magnitude with no provenance, two dials' provenance or
    a non-finite number. This boundary exists because of CD-ENG-WO2R-F06, below.

- id: CD-RT-002-AST-NO-BLEND-LIMIT
  title: THE AST NO-BLEND CHECK IS A LOCATOR, NOT A CLOSURE
  stated_in: >
    the check header, the comment above the entry in required-tests.yaml, and
    contracts/execution/CD-RT-002-AST-NO-BLEND.md — CONSISTENTLY IN ALL THREE, each boundary with an
    example an auditor can execute, and all three carrying the instruction not to read a clean run
    as proof of the proposition and the CD-D-014 disposition rule for the auditor.
  scope_correction: >
    `scope` corrected from CLASS to INSTANCE. Deny-by-default is not available here the way RULE F
    made it available to CD-RT-001-AST-NO-NUMERIC-DEFAULT, because there is no single permitted
    provenance for an expression to be traced back to — every expression in the application is a
    candidate. Claiming CLASS while enumerating what a static intra-procedural checker can see IS
    the defect this finding reports. The CLASS closure is now claimed by
    CD-RT-002-TYPE-NO-ARITHMETIC, which delivers it at runtime.
  the_six_boundaries: >
    1 inter-procedural flow (measured example: E01 verbatim, exits 0);
    2 dynamic attribute access erases flavour entirely (measured example: E02 verbatim, exits 0);
    3 the RULE 2 allowlist is a real hole in RULE 2 by design, and E01 was planted in one of the six
      allowlisted paths;
    4 the scanned set is src/crash_detector/ and deploy/entrypoints/ only;
    5 it reads source, not behaviour;
    6 a number already released is an ordinary float.
    Both limitations behind these — STATIC and INTRA-PROCEDURAL — are PERMANENT. They are not
    defects to be repaired in a later work order; they are what a static intra-procedural checker is.

findings_raised:

- id: CD-ENG-WO2R-F06
  severity: MEDIUM
  against: THIS SEAT'S OWN INCREMENT-2 WORK
  status: FOUND AND REPAIRED IN THIS INCREMENT, in its own commit (cec82c0)
  what: >
    `DialMagnitude.__getstate__`, added at step 1 (a8a2781) so that `copy.deepcopy` and `pickle`
    would not raise on a slotted type that refuses `setattr`, returned
    `{"dial_id": ..., "quantity": ...}`. That handed out the number WITHOUT naming a dial and
    WITHOUT naming the private slot, so the release check never ran and RULE 3 had nothing to see.
  measured: >
    At a8a2781, on a pristine extraction with variant V09 applied:
      states = [m.__getstate__() for m in (equity_magnitude, monetary_magnitude)]
      blended = sum(s["quantity"] for s in states) / len(states)     # -> 0.5. NOT REFUSED.
    check_no_blend.py exit 0.
  repair: >
    The state is keyed by the private slot names, so reading it in source must name one and RULE 3
    reports it. `__setstate__` re-validates through the same `_install` path the constructor uses
    and refuses a provenance that is not a frozenset of exactly one dial, so a hand-written pickle
    is untrusted input like any other. RULE 3 gained the reflection reach (`__getstate__`,
    `__reduce__`, `__reduce_ex__`), as an attribute or as the second argument of
    getattr/setattr/delattr. Two tests added, both in the declared arm.
  why_it_is_recorded_this_prominently: >
    It is exactly the defect this rework exists to correct — a closure that refuses the routes its
    author thought of — committed by the seat correcting it, three commits into doing so. An auditor
    should read the repair sceptically and should assume the reflection route was tried.

- id: CD-ENG-WO2R-F07
  severity: LOW
  against: THIS SEAT'S OWN WORK
  status: DECLARED, NOT REPAIRED
  what: >
    The sealed-surface machinery in src/crash_detector/dials/magnitude.py — the metaclass, the
    declared member set, the import-time equality assertion, the slots/dictoffset check — is a
    near-duplicate of the same machinery in src/crash_detector/dials/reading.py, about forty lines.
    The duplication is deliberate and disclosed in the module header (generalising reading.py's
    declaration would be an edit to increment 1's accepted closure), but duplication is where two
    copies drift apart, and the second copy is the one a later author will forget to update.
  what_would_close_it: >
    A shared sealing helper, applied to both, with the declared surface passed in as data. That is a
    separate bounded change with its own before/after, not something to fold into a class closure.
  owed: WO-3, at Project Lead disposition.

- id: CD-ENG-WO2R-F08
  severity: LOW
  against: THIS SEAT'S OWN WORK
  status: DECLARED, NOT REPAIRED
  what: >
    The publication provenance gate `number_for_dial_slot` is delivered, tested and declared, but
    NOTHING IN THE APPLICATION CALLS IT — the publication layer is WO-3 and no envelope is built in
    WO-2. So the "unpublishable" half of CD-AC-002's closure is evidenced by tests over the gate and
    NOT by any live path through it, and a WO-3 envelope builder that assigns a bare number to
    `equity_crash.score` without coming through the gate would not be stopped by it. The module says
    so in terms, in a paragraph addressed to that builder.
  why_it_is_not_repaired_here: >
    Building the envelope is WO-3 scope. Widening into it would be exactly the silent scope
    expansion the dispatch prohibits.
  owed: WO-3. Recommend the WO-3 dispatch require the envelope builder to obtain every dial number
    through this gate, and a register test that asserts it does.

- id: CD-ENG-WO2R-F09
  severity: LOW
  against: THIS SEAT'S OWN WORK
  status: DECLARED
  what: >
    RULE 3 guards exactly one private name and three reflection dunders. It is therefore fitted to
    THIS closure's internals rather than to a class, and if the magnitude type is ever renamed or
    its slot re-spelled, RULE 3 silently guards nothing while still exiting 0. The check refuses if
    magnitude.py is ABSENT, which covers deletion, but not renaming the slot.
  what_would_close_it: >
    Derive the watched slot name from the module rather than declaring it as a constant in the
    check — read `DialMagnitude.__slots__` from the subject tree's own source. This seat did not do
    it because importing the subject tree into a register check makes the check execute the code it
    is auditing, which is a worse trade than a declared constant. Recorded so the trade is visible.
  owed: WO-3, at Project Lead disposition.

