# --- what was closed -------------------------------------------------------------------------- #

the_class_closed: >
  A SCALAR DERIVED FROM BOTH DIAL TYPES. Not "an expression naming both markers" and not "a call
  whose arguments are both dials": ANY value, however computed, however many function calls away,
  however the attribute was reached, whose provenance includes both the equity dial and the
  monetary dial.

  THE CLOSURE IS AT THE TYPE AND AT THE PUBLICATION BOUNDARY, AND IT IS NOT AT THE STATIC CHECK.
  That is a design conclusion drawn from the auditor's own root cause and not a convenience: the
  AST check's flavour propagation is INTRA-PROCEDURAL by design and purely STATIC, so moving the
  arithmetic one call away (E01) or reaching the attribute through `getattr` with a plain string
  (E02) erases the flavour entirely. No amount of hardening a static intra-procedural checker
  closes this class, and none was attempted. The check became a LOCATOR with a written declared
  limit, which is the thing the auditor's caveat said was missing.

  A dial magnitude is now a NOMINAL, PER-DIAL, NON-COERCIBLE value. Because the refusal is a
  property of the OBJECT, it holds however the two values were reached — through an attribute, a
  getattr over string slots, reflection over declared fields, a dict, a tuple, a comprehension, a
  JSON round trip, a pickle, a helper three calls away, or a route nobody has thought of. That is
  the difference between closing a class and refusing a list of spellings.

  PARTIAL, AND THE RESIDUE IS DECLARED. A number RELEASED for its one named dial is an ordinary
  Python float and two of them can be added. See declared_limits below.

implemented:

- id: THE-MAGNITUDE-TYPE
  where: src/crash_detector/dials/magnitude.py (new, 460 lines including its header)
  what: >
    `DialMagnitude`: provenance is a frozenset that is ALWAYS EXACTLY ONE DIAL, because the only
    constructor takes a single `dial_id` — a magnitude whose provenance names both dials is not
    something this module refuses to build, it is something the signature cannot express. The type
    defines NONE of ARITHMETIC_DUNDERS: no __add__ family, no __float__/__int__/__index__/__round__,
    no ordering. The payload lives in a private name-mangled slot (`_DialMagnitude__quantity`) and
    the only declared member that yields a bare float is `quantity_for(<dial id>)`, which compares
    provenance by SET EQUALITY. `combine_within_one_dial` is the declared point of combination and
    refuses anything but a single dial. `sole_dial_of` refuses a non-magnitude by EXACT TYPE
    IDENTITY and re-verifies the class surface at the boundary. The attribute surface is declared,
    asserted by set equality at import, slotted against instance injection and closed against
    subclassing by `SealedMagnitudeType` — increment 1's house style, applied here before anybody
    has to learn CD-ASR-F02's lesson twice.
  why_it_is_the_class: >
    The object does not know or care what expression is holding it. Every route the finding
    describes, and every route this seat could devise, ends at either an arithmetic dunder
    (absent), a coercion (absent), the declared combinator (provenance-compared) or the declared
    release (single-dial-named).

- id: THE-SCORE-TYPES-CARRY-PROVENANCE
  where: src/crash_detector/dials/scores.py
  what: >
    `score` is typed `DialMagnitude` and each score type refuses a magnitude that is not ITS dial's,
    by exact type identity and then by comparing provenance. So a bare number cannot become a dial
    reading at all — a blend computed anywhere cannot be re-wrapped and published as one — and a
    magnitude cannot be laundered from one dial into the other. `EQUITY_DIAL_ID` and
    `MONETARY_DIAL_ID` moved here from dialset.py, beside the types whose magnitudes carry them as
    provenance; dialset.py re-exports both, so every existing import site is unchanged.
  what_was_deliberately_not_done: >
    NO RANGE, NO UNIT, NO THRESHOLD was imposed. The `score` docstring's refusal to declare a range
    — "a declared range is a declared scale, and the scale of a dial is what the dial MEANS", owed
    to the Product Owner as CD-D-005 — was READ FIRST and is preserved verbatim in substance, with
    a paragraph added saying that this increment changed the TYPE of a magnitude and how it
    composes and decided nothing about what a magnitude means (CD-RULE-003, PBG-AUTH-005).
    `test_no_range_is_imposed_on_the_magnitude` still spans -5.0 to 42.0.

- id: THE-PUBLICATION-GATE
  where: src/crash_detector/publication/dial_scalar.py (new)
  what: >
    `number_for_dial_slot(slot, magnitude)` releases a number into a dial envelope slot ONLY from a
    magnitude whose provenance is exactly that slot's dial, and refuses a slot nobody declared, a
    non-magnitude, a provenance that is not exactly one dial, and the other dial's magnitude. It is
    the layer that closes the LIMIT the closed envelope schema declares about itself: the schema
    constrains SHAPE, so it cannot tell a blended number assigned to `equity_crash.score` from an
    honest one. Two independent structural layers on the public surface, and the auditor's own
    confirmation that the schema mitigation HOLDS is preserved and cited rather than re-claimed.

- id: THE-AST-CHECK-BECOMES-A-LOCATOR-WITH-A-DECLARED-LIMIT
  where: tools/register/check_no_blend.py, required-tests.yaml, contracts/execution/
  what: >
    Six declared boundaries, each with an example an auditor can execute and each naming the layer
    that carries it, stated CONSISTENTLY in the check header, the register comment and the
    execution contract. `scope` corrected from CLASS to INSTANCE. CD-AC-002's acceptance_semantics
    rewritten so the refuted claim — "a blend that slips past any one layer must still fail the
    other two" — is gone and each layer states what it does AND what it does not do. RULE 3 added:
    no expression in application source may name the private magnitude slot or call the pickle
    protocol that returns it, with no allowlist beyond the module that declares the slot. The check
    now REFUSES (exit 3) if magnitude.py is absent, so a tree that lost the closure cannot get a
    clean scan of the locator over it.

