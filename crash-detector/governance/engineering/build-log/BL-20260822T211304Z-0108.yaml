  scope_shape: >
    SEVEN ITEMS IN FIVE WORKSTREAMS, each independently checkable, each proved by a CONTRAST IN BOTH
    ARMS or not proved: **(A)** ESCAPE 1, the stored payload is not the validated payload — snapshot
    after validation, with the snapshot's DEPTH DECLARED as a limit. **(B)** both instruments to
    `ast.walk`; the count of classes examined ASSERTED from two independent derivations; residual
    reach limits DECLARED; **the CD-PL-F96 `--why` ledger language closed by name and proved on the
    auditor's nested plant**; and the one-indentation plant made a PERMANENT PLANTED VIOLATION with
    both arms, held to the BITTEN standard. **(C)** `ESTABLISHED_HERE` resolved through aliases and
    the stale EIGHT/FIVE declaration corrected to the seat's own measurement. **(D)** `@establishes()`
    on `Empty`, proved at RUNTIME and not statically. **(E)** the three declared limits REWRITTEN to
    measured reach, each re-measured, in all three CD-RULE-004 places with the superseded wording
    readable beside it.
  what_the_dispatch_deliberately_narrows: >
    **`src/` IS WRITABLE FOR THE FIRST TIME SINCE INC5C AND IS BOUNDED FILE BY FILE AND PURPOSE BY
    PURPOSE** — four named files, each carrying the item it is open for. `admission.py` and
    `establishment.py` are open for THEIR DECLARATIONS and not for their mechanisms. The sweep,
    the eleven Class-2 dispositions, F-A2/F-A3/F-A4, F-C1-F-C4, ESCAPE 3, the sink/ledger/validator
    table, the `adapter_id` double-read, CD-PL-F95 and T8/T9/T10 are ALL EXPLICITLY NOT THE
    ENGINEER'S — they travel to the fifth seat OPEN AND DECLARED. **Pre-empting an auditor by
    cleaning the surface it was dispatched to attack is how a gate stops meaning anything.**
  the_prohibition_that_is_new_at_this_increment: >
    **THIS IS THE FIRST INCREMENT WHERE THE ENGINEER MAKES INSTRUMENTS STRICTER**, and a stricter
    instrument may light up existing code nobody has dispositioned. The dispatch states in terms:
    **a new violation the widened walk finds in existing code is A FINDING AND A STOP — not a thing
    to quietly exempt and not a thing to fix on your own authority.**

