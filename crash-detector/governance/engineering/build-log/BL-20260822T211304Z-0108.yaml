action_summary: >
  *** **THE PRODUCT OWNER HAS DISPOSITIONED THE RED AND IT STANDS. THE REMEDIATION INCREMENT IS
  ISSUED TO A FRESH ENGINEER IDENTITY, CD-ENG-WO2R3-02, AGAINST 531c95c.** ***
  PO-DECISIONS-0011 (commit 99b7d18) answers all five Product Authority questions of entry 0107 in
  order. **THE RED STANDS** and the Product Owner calls it *"the most trustworthy verdict this
  programme has produced"*. The auditor's four-item increment is ACCEPTED IN SHAPE AND BOUND with
  ONE acceptance-language addition — **CD-PL-F96 IS CLOSED BY NAME**, which means a Project Lead
  self-raised finding became a condition of acceptance on the increment that answers it.
  **CD-D-134'S CLASS IS NOT RE-RULED: THE INSTRUMENT IS DEFECTIVE AGAINST A SOUND RULING**, and the
  Product Owner owned its own share of CD-PL-F94 on the record — *"I accepted contrast evidence
  without asking which axis it varied"* — harvesting it as IMP-024's second instance with the
  sentence **"a rule that binds seats binds their Product Owner."** THE THREE DECLARED LIMITS ARE
  ORDERED REWRITTEN TO MEASURED REACH, EACH RE-MEASURED. T6 STANDS AND **BITTEN IS NOW THE STANDARD**
  a plant is held to before its criterion is called guarded. A FIFTH FRESH ASSURANCE SEAT IS
  AUTHORISED over the WHOLE of WO-2R3 at the post-increment SHA.
  *** **THIS BOUNDARY ISSUES ONE BOUNDED ENGINEER DISPATCH AND NOTHING ELSE. IT DOES NOT IMPLEMENT,
  DOES NOT GRADE, AND DOES NOT WRITE THE ELEVEN CLASS-2 DISPOSITIONS.** ***

what_the_product_owner_ruled_and_what_this_seat_did_with_it:
  the_five_answers_in_one_line_each: >
    (1) THE RED STANDS; the four-item increment accepted in shape and bound, plus CD-PL-F96 closed by
    name. (2) CD-D-134 NOT re-ruled — the instrument is fixed against it, and the PO owns its share
    of F94. (3) the three declared limits REWRITTEN to measured reach, each re-measured. (4) the T6
    correction STANDS; GRANT-MATRIX-LIVE is a BITTEN control and bitten is the new standard. (5) a
    FIFTH FRESH ASSURANCE SEAT authorised over the whole, at the post-increment SHA.
  what_this_seat_did_NOT_do_with_them: >
    **IT DID NOT RE-ARGUE, SOFTEN, EXTEND OR RE-SEQUENCE ANY OF THE FIVE.** The sequence is ruling
    6's and it is followed literally: increment -> fifth seat -> T8 lands -> the eleven dispositions
    -> and only then the Product Owner's acceptance of WO-2R3. Nothing is merged, admitted or
    promoted meanwhile; CD-AC-002 and CD-AC-005 remain AMBER and NOT CLOSED; the WO-2 gate is SHUT.
  and_the_one_thing_it_added_which_is_its_own_and_is_declared_as_such: >
    **THE SEAT IDENTITY. CD-D-144, BELOW.** Ruling 6 leaves it to the Project Lead within
    PBG-SOD-001, and this seat took it rather than defaulting to it.

decisions_taken_at_this_boundary:
- id: CD-D-144
  title: >
    **THE REMEDIATION INCREMENT GOES TO A FRESH ENGINEER IDENTITY — CD-ENG-WO2R3-02, NOT
    CD-ENG-WO2R3-01 — AND THE COST OF THAT IS STATED RATHER THAN GLOSSED.**
  authority: >
    The Project Lead's own, within the latitude PO-DECISIONS-0011 ruling 6 leaves. CD-D-131 PERMITS
    one Engineer identity across the increments of one work order; it does not REQUIRE it, and it was
    reasoned about increments of a BUILD. This is a REMEDIATION after a RED.
  the_reasoning: >
    **THE DEFECT CLASS OF THIS INCREMENT IS "THE AUTHOR BELIEVED THEIR OWN DECLARATION".** Three of
    the seven items are declarations CD-ENG-WO2R3-01 wrote and measured wrongly or not at all; two
    more are a blind spot in an AST walk it authored and whose header described the ground as
    covered. **THE PARTY LEAST ABLE TO READ A SENTENCE AS A STRANGER IS THE PARTY WHO WROTE IT** —
    which is exactly what the auditor said about the declared limit that steered four parties, and
    what this seat accepted against itself at CD-PL-F94.
  what_it_is_NOT: >
    **NOT A JUDGEMENT ON CD-ENG-WO2R3-01, WHOSE RECORD IS FIVE INCREMENTS OF FINDINGS RAISED AGAINST
    ITS OWN WORK** — including CD-ENG-WO2R3-F17, which it declared, printed at every run, refused to
    close on its own authority, and routed up, and which came back ruled. The mechanism it built is a
    genuine runtime closure and the auditor verified it independently. None of that is withdrawn.
  the_cost_this_seat_is_knowingly_paying: >
    A fresh seat does not know this surface and will spend real time on two ~700-line instruments and
    two mechanism modules it has never read. **THE JUDGEMENT IS THAT THE PROOF BURDEN HERE IS
    EXECUTION AND NOT AUTHORSHIP** — every item is checkable by running a contrast — so familiarity
    buys speed while freshness buys a reader who has never been steered by these declarations.
  how_it_could_be_wrong: >
    If the increment stalls on unfamiliarity, or if the fresh seat re-derives a design decision
    already settled and settles it worse, **THIS DECISION WAS THE WRONG TRADE AND THE RECORD SHOULD
    SAY SO AT RECONCILIATION.** It is stated in advance so it can be graded, not defended.

