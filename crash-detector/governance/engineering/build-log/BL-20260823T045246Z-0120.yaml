- id: CD-PL-F110
  severity: MEDIUM
  against: PROJECT_LEAD_SEAT_01 (this seat), raised by this seat against itself
  summary: >
    **THE FIRST SHA256 MANIFEST THIS SEAT WROTE HASHED ITSELF AS EMPTY.** `find | xargs sha256sum >
    MANIFEST.sha256` creates the target before the hashing runs, so the manifest listed
    `./MANIFEST.sha256  e3b0c442...` — the hash of the empty string — **a manifest row that can
    never match the file it names.** Caught by reading the output rather than by any check, and
    regenerated to a temporary path before being moved into place. **RECORDED BECAUSE IT WAS CAUGHT,
    NOT BECAUSE IT WAS AVOIDED (the CD-PL-F98 precedent).** A quarantine whose integrity record is
    self-falsifying is the CD-D-093 failure mode arriving inside the CD-D-093 remedy.

- id: CD-PL-F111
  severity: MEDIUM
  against: PROJECT_LEAD_SEAT_01 (this seat), raised by this seat against itself
  summary: >
