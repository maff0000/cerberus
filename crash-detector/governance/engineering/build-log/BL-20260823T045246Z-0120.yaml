    and `git diff --cached --stat` all return **ZERO LINES**.
  the_quarantine_was_VERIFIED_TO_ROUND_TRIP_BEFORE_THE_WORKING_TREE_WAS_TOUCHED: >
    **A QUARANTINE THAT CANNOT REPRODUCE THE WORK IS A DELETION WITH PAPERWORK.** Before
    `git checkout --` was run on a single file, the patch was applied to a pristine `git archive`
