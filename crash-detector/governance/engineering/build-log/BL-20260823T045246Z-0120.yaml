    AT `BL-...-0119`, AND `pbg boot` RETURNED RED — `CONTINUITY_REFERENCE_INVALID/RESUME_BLOCKED`.**
    Five fields were updated by hand and the sixth was missed. **THE DEFECT IS NOT THE MISS; IT IS
    THAT HAND-EDITING THIS FILE BYPASSES THE FRAMEWORK'S OWN WRITE-THEN-READ-BACK PATH**, which is
    exactly the CD-PL-F64 mechanism recorded in this file at lines 1686-1701 after TWO checkpoints
    were written on top of a record the framework was already refusing. **THIS TIME THE BOOT WAS
    RE-RUN AFTER THE EDIT AND IT CAUGHT IT BEFORE THE COMMIT, WHICH IS THE WHOLE OF WHAT CD-PL-F64
    ASKED FOR.** Recorded because it was caught, not because it was avoided.

