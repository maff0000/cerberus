    (3) **THE MANDATED CARRIER DOES NOT EXIST.** ITEM 1 says *"YOUR CARRIER MUST BE THE ATTACK
    ITSELF"* — a `__closure__` / `__wrapped__` / `__globals__` / module-namespace walk — and *"A
    CARRIER THAT ONLY CHECKS THE DECORATOR IS PRESENT TESTS THE WRAPPER, NOT THE PROPERTY."* The
    delta's own `tests/test_evaluate.py` states *"THE FULL ATTACK IS `tests/test_the_absence_door.py`
