the_ruling_being_implemented_verbatim: >
  PO-DECISIONS-0014 ruling 1 — *"this project has finding IDs and NO FINDINGS REGISTER, so the
  `finding` field would be an unchecked string. A MINIMAL findings register is created in the same
  act — id, raised_at (boundary SHA), status (OPEN / CLOSED / SUPERSEDED), nothing else — and
  `DEFECT_OPEN.finding` resolves against it or the row refuses. An index, not a system."*

what_landed:
  the_register: >
    `governance/findings/findings-register.json` — FOUR rows, THREE fields each, nothing else.
    CD-F-0001 · CD-F-0002 · CD-F-0003 · CD-F-0004, all `OPEN`.
  the_loader: >
    `tools/sweep/delegated_judgement_sweep.py::_load_findings_register` — resolved from the TOOL's
    own location, not from `--root` and not from a PYTHONPATH, for the same reason `_load_register`
    is (`PBG-ASSURE-001`: an auditor runs this out of a tree it extracted itself).
  the_resolution_check: >
    `_finding_resolution_violations` — every `finding` cited by ANY extended-word entry, in EITHER
    register, must resolve to an `OPEN` row. Two distinct rules because they are two distinct
    mistakes: `FINDING_DOES_NOT_RESOLVE` and `FINDING_IS_NOT_OPEN`.
  the_carrier: 'tests/test_findings_register.py — 12 tests. tests/test_disposition_contract.py fixture widened to carry `governance/findings/`.'

WHY_JSON_AND_NOT_A_PYTHON_MODULE__A_DESIGN_CHOICE_THAT_IS_MINE_AND_IS_NOT_THE_PROJECT_LEADS:
  the_dispatch_said: >
    *"THE PROJECT LEAD'S PREFERENCE, WHICH IS EVIDENCE AND NOT A DESIGN: a sibling data module
    loaded exactly as `declared_dispositions.py` is loaded today. YOU ARE NOT OBLIGED TO ADOPT ITS
    SHAPE, AND IF A GOVERNANCE-DIRECTORY LOCATION IS RIGHTER, SAY SO AND TAKE IT."*
  what_this_seat_took_and_why: >
    **A GOVERNANCE-DIRECTORY LOCATION, AND JSON RATHER THAN PYTHON.** Two reasons, both of which
    are this project's own arguments rather than taste.
    (1) **A REGISTER THAT EXECUTES CAN COMPUTE ITS OWN ANSWER.** `declared_dispositions.py` is
    `exec`'d by `_load_register`; a findings register loaded the same way could derive its statuses
    at load time, and an index that computes is exactly the "system" the ruling refused. JSON cannot
    do anything but be read. This is the same reasoning `governance/reconciliation/README.md` gives
    for storing its own probes as `.txt` — *"so that they are DATA (PBG-ASSURE-001)"*.
    (2) **THE FINDINGS ARE NOT THE SWEEP'S.** CD-F-0001 comes from the fifth Assurance seat,
    CD-F-0002 and CD-F-0003 from the sixth, CD-F-0004 from a Project Lead reconciliation probe. Not
    one of them was raised by this instrument, and a later instrument that needs the same index
    should not have to reach into another tool's private data directory to get it.
  what_it_cost: >
    The tool now reaches OUT of `tools/` by three `parent`s. That is a real coupling and it is
    stated rather than hidden: move `delegated_judgement_sweep.py` and the register stops resolving.
    Verified to work from a `git archive` extraction with no PYTHONPATH — see the extraction arm.

the_three_fields_and_NOTHING_ELSE__ENFORCED_NOT_ASKED_FOR:
  what: >
    A row whose key set is not EXACTLY {id, raised_at, status} is REFUSED
    (`FINDINGS_REGISTER_ROW_MALFORMED`). **`nothing else` IS PART OF THE RULING AND IS NOW PART OF
    THE INSTRUMENT.** Both directions: a fourth field refuses, and a missing field refuses.
  why_that_is_the_load_bearing_check: >
    A findings register allowed to grow a `title` grows a `severity`, then an `owner`, and is the
    hand-maintained summary the ruling created it to stop. The check is what keeps it minimal
    against every seat that comes after this one, none of whom will have read this entry.

