  what_this_seat_ran: |
    $ git rev-parse af2accb
    af2accbfc950961bb7f7967d34ecf16414088228
    $ git cat-file -t af2accbfc950961bb7f7967d34ecf16414088228
    commit
  outcome: 'RESOLVES, and it is a COMMIT object. The register carries the FULL 40-character SHA, never the abbreviation.'
  and_the_instrument_checks_the_SHAPE_ONLY: >
    `FINDINGS_REGISTER_BAD_SHA` proves 40 lower-case hex characters and NOTHING MORE. It does not
    prove the object exists and it CANNOT — the sweep runs from an extraction with no repository.
    **A REGISTER FULL OF WELL-FORMED SHAs THAT NAME NOTHING WOULD PASS THIS CHECK. NOT PROVED TO BE
    CARRIED ANYWHERE** (CD-RULE-006); the carrier for existence is a human running `git rev-parse`
    and `git cat-file -t`, which is what this seat did and recorded above.

