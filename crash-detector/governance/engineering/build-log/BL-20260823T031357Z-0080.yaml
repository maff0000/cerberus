findings_against_my_own_work:
  CD-ENG-WO2R3-04-F01: >
    **THE `raised_at` FIELD IS THE WEAKEST OF THE THREE AND IT IS THE ONE THE RULING NAMED MOST
    PRECISELY.** The ruling says *"raised_at (boundary SHA)"*. All four rows carry the LANE HEAD
    `af2accb`, because that is what the content document claims — but CD-F-0001 was raised by the
    FIFTH Assurance seat and CD-F-0002/0003 by the SIXTH, at boundaries this seat did not resolve
    and was not given. `af2accb` is the SHA those findings were TARGETED AT, which is not obviously
    the same thing as the boundary they were RAISED AT. The instrument cannot tell the difference
    and neither can this entry. **Reported rather than smoothed.**
  CD-ENG-WO2R3-04-F02: >
    The register's location couples the sweep to a path three directories above itself. If a later
    seat moves the tool the register stops resolving — and it does NOT fail silently:
    `FINDINGS_REGISTER_ABSENT` fires and the run goes red. That is the safe direction, and it is
    stated here because the alternative reading (a sibling module) would have had no such failure
    mode at all, and this seat chose the coupling deliberately.

