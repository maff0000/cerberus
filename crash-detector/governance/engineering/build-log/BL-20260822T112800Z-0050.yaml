what_is_new_in_this_brief:
  the_deleted_subject_rule: >
    §C DELETES ContributionModel and CONTRIBUTION_MODELS, so "zero node ids lost" cannot mean "keep
    testing a type that no longer exists". Every prior dispatch could say LOSING A TEST IS PROHIBITED
    without qualification; this one cannot, and rather than leave the seat to discover the conflict
    mid-increment, the exception is STATED IN THE DISPATCH: a test whose SUBJECT is deleted is
    REPLACED, NOT DROPPED, and the replacement asserts THE SAME PROPOSITION against the new structure,
    with old id, new id and reason named in the commit. A test with no successor is escalated, not
    decided silently. The node-id report becomes a RECONCILIATION (lost/replaced/added), because a
    bare number is not a conservation claim.
  the_lane_reserved_sequence_block: >
    Lane Build Log entries take 0060 up; main continues from 0050. CD-D-036 was raised when a lane
    entry and a main entry collided on sequence 0022 because a seat in a lane worktree can only see
    the branch-point copy of the build-log directory. Stated up front this time.
  the_identity_check_with_its_own_worked_example: >
    CD-PL-F79 — raised ONE COMMIT AGO against the Project Lead's own predecessor, for skipping exactly
    the `git log -1` check CD-RULE-002 requires — is quoted INTO the dispatch's commit_identity
    section. A rule with a fresh worked failure attached to it is read differently from a rule that
    arrives as a list item.
  the_auditor_first_targets_told_to_the_engineer_in_advance: >
    The Product Owner named the fourth Assurance seat's first two targets in its rulings: P7 (ruling
    1) and CD-BP-003, the adapter boundary (ruling 4). THE ENGINEER IS TOLD BOTH, DELIBERATELY. It
    knows where the auditor will look before it looks. The dispatch says the obvious thing out loud —
    "build accordingly, and do not build a façade in front of either" — because an Engineer who knows
    the target and games it produces exactly the false green this project has caught three times.
  what_the_project_lead_has_NOT_verified: >
    A named section, as at the third gate: the 1400 is collected not run; the eleven plants were not
    re-applied; §C's blast radius outside writable_scope is not proved; and THE `admits` MECHANISM IS
    SPECIFIED BUT NOT PROTOTYPED — if deriving establishment from the signature conflicts with
    keyword-only arguments, *args, defaults or the frozen dataclass constructors, the seat is told to
    REPORT THE CONFLICT rather than quietly weaken the rule to "annotate what you can".

