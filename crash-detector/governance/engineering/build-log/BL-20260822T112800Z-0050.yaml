# ================================================================================================ #
# THE ONE CONSTRUCTION DECISION THIS BOUNDARY HAD TO MAKE, AND WHY IT IS THE PROJECT LEAD'S
# ================================================================================================ #
the_lane_decision:
  the_tension_stated_plainly: >
    PO-DECISIONS-0004 ruling 4 says f30e63c is "an EVIDENCE LANE, never a baseline. NOTHING BUILT ON
    IT." The same ruling's next sentence says "the closures survive into the re-architecture". The
    amendment's §I, which the Product Owner read and accepted, says the closures in dials/,
    own_terms.py, staleness.py, source_registry.py and publication/ "CARRY FORWARD SUBSTANTIALLY
    UNCHANGED". main carries NO application code at all — every line of WO-2 lives on wo-2-skeleton.
    So the code lineage cannot avoid f30e63c without discarding the entire WO-2 skeleton, which is
    the opposite of what the ruling says.
  the_reading_taken: >
    "NEVER A BASELINE" IS ABOUT ACCEPTANCE, NOT ABOUT THE GIT GRAPH. Nothing at f30e63c is inherited
    as VERIFIED: no criterion carries credit, no prior PASS, no prior declared limit, no prior
    structural invariant and no prior refusal is evidence about the new work. It is not merged, not
    promoted, and nothing proceeds as though WO-2 were done. That is what the ruling protects against
    — WO-3 building on an unassured tree — and it is fully honoured.
  what_was_done_CD_D_094: >
    A NEW BRANCH `wo-2r3` in a NEW worktree /srv/crash-detector-wo2r3, branched from f30e63c.
    wo-2-skeleton is FROZEN at f30e63c because that SHA is the subject of three audit worktrees, 39
    transported auditor artefacts and every finding in governance/assurance/WO-2R2/; moving the branch
    that names it would make a load-bearing pointer ambiguous. The separate branch also makes the git
    graph say what the record says: a re-architecture that INHERITS CODE and INHERITS NO VERDICT.
  why_this_is_construction_and_not_a_product_question: >
    The Product Owner ruled the SUBSTANCE twice — the closures survive (0004 ruling 4) and WO-2R3 is
    dispatched (0005 ruling 6) — and branch-and-worktree layout is PBG-GIT-001/003 construction, the
    Project Lead's under PBG-BP-001, exactly as it was for the three dispatches before this one.
    IT IS RECORDED AS A DECISION RATHER THAN DONE SILENTLY because it is the kind of choice that
    looks obvious in hindsight and contentious in retrospect, and because the ruling's own words can
    be read two ways. IF THE PRODUCT OWNER READS "NOTHING BUILT ON IT" MORE STRICTLY THAN THIS, THE
    LANE IS CHEAP TO REBUILD AND THE DISPATCH IS UNCHANGED BY IT — the Project Lead would rather be
    corrected here than have the question surface at the fourth gate.

