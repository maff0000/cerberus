# CD-ASR-WO2R-F01 — REPLICATES EXACTLY. THE AUDITOR IS CONFIRMED.
# ================================================================================================ #
replication_F01:
  finding_under_test: 'CD-ASR-WO2R-F01 (HIGH, CD-AC-002) — `combine_within_one_dial` is an unguarded proxy through the derivation door.'
  verdict: 'REPLICATES EXACTLY. CONFIRMED.'
  what_was_the_auditors_and_what_was_this_seats: >
    THE VARIANT IS THE AUDITOR'S, used verbatim — it is the artefact whose claim is being
    replicated, so substituting a different one would be measuring a different thing. THE DRIVER IS
    THIS SEAT'S OWN, written from the source at 50fc231: the inputs are built through the
    legitimate admission door `observed_for_dial`, and the publication attempt and every assertion
    are this seat's. Recorded as PL-R6-F01-driver.py.txt.
  structural_reading_before_execution: >
    magnitude.py:620-622 passes `using(numbers)` — an arbitrary caller callable's return value —
    straight into `derived_within_one_dial`, whose entire body (provenance.py:543) is
    `return DeclaredQuantity(dials=dials, value=value)`. IT VALIDATES THE DIAL SET AND NEVER LOOKS
    AT THE VALUE. The comment above the call site says as much in terms — "`using` may return any
    float it likes and cannot influence which dial the result is declared for" — which is TRUE and
    is exactly the gap: it need not influence the LABEL, only supply the VALUE.
  measured_static_and_behavioural_layers: >
    WITH THE VARIANT PRESENT, all exit 0: CD-RT-002-AST-NO-BLEND PASS 4873 assertions 0 violations;
    CD-RT-002-SCHEMA-CLOSED PASS 242; CD-RT-001-AST-NO-NUMERIC-DEFAULT PASS 377;
    CD-RT-002-TYPE-NO-ARITHMETIC 306 passed; WHOLE SUITE 1325 passed.
  the_F16_contrast: >
    CLEAN ARM on a separate extraction: CD-RT-002-AST-NO-BLEND PASS 4855 assertions. WITH THE
    VARIANT: 4873. THE COUNT ROSE BY 18. The check DID scan the new module and had nothing to say
    about it. This is not a skipped arm and not a shrunk denominator — it is a CLEAN PASS OVER A
    LIVE BLEND. Every one of these numbers is IDENTICAL to the auditor's.
  then_executed: >
    equity 0.9 and monetary 0.1 in; out came DialMagnitude(dial_id='equity_crash', quantity=0.5),
    EXACT type identity (not isinstance) True, provenance ['equity_crash'], quantity_for released
    0.5. The score type did NOT refuse it. The publication gate `number_for_dial_slot` did NOT
    refuse it and RETURNED 0.5. Equity 0.9 and monetary 0.1 PUBLISH AS AN EQUITY READING OF 0.5 —
    the failure PID §3.1 calls constitutional.
  the_proposition_measured_false: >
    magnitude.py:117-122, boundary A, verbatim: "the sum cannot come back … no number so obtained
    can ever be a dial magnitude again." THE CLAIM IS UNQUALIFIED AND IT IS FALSE AT THIS SHA.
    CD-RULE-006 forbids a boundary asserting a carrier that does not carry. The auditor's reading
    and its severity are both upheld.

