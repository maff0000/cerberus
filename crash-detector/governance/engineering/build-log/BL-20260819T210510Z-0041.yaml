  measured: >
    A row dated 2016-08-21 read at 2026-08-19 with a 600 s window. ATTACK ARM, as_of_utc a
    FeedInstant (datetime subclass): survives PanelRow normalisation as FeedInstant, resolves to
    Agrees, RENDERS "WITNESS AGREES". CONTROL ARM, the SAME decade-old instant as a plain datetime:
    resolves to Unavailable, RENDERS "WITNESS UNAVAILABLE". IDENTICAL DATA, IDENTICAL WINDOW,
    IDENTICAL CALL — THE ONLY VARIABLE IS THE CONCRETE TYPE OF THE TIMESTAMP.
  no_reflection_used: >
    No `object.__setattr__`, no reflection, no post-construction write anywhere in the driver. The
