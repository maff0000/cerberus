# ================================================================================================ #
# CD-PL-F74 — THE METHOD FINDING. WHY CD-D-040 ACCEPTED MORE THAN IT MEASURED.
# ================================================================================================ #
CD_PL_F74:
  finding: 'CD-PL-F74 (HIGH, METHOD) — PL-R5 was refused BY A REGISTRY, and its refusal was recorded as evidence about a CLASS. CD-D-040 accepted increment 2b on an inference wider than the measurement supported.'
  severity: HIGH
  why_it_was_looked_for: >
    NOT DISCOVERED BY ACCIDENT. The eighth seat's next_safe_action named it in advance: "ASR2-F01
    CONTRADICTS CD-D-040 … If PL-R5 was read as proving more than it did, that is a method finding
    about RECONCILIATION ITSELF and it must not be lost inside the repair." IT WAS. IT IS. This
    entry pays that debt with a measurement rather than an argument.
  step_1_PL_R5_refusal_reproduces: >
    PL-R5 replanted at src/crash_detector/publication/banner.py on a pristine extraction:
    CD-RT-002-AST-NO-BLEND FAIL — 2 violations, at banner.py:3 and banner.py:21, both RULE 4, 4887
    assertions. EXACTLY AS RECORDED. CD-D-040 accepted increment 2b on this refusal, "by structure
    at the re-entry PLUS a deny-by-default static layer at the doors".
  step_2_what_RULE_4_claims_in_its_own_words: >
    Quoted verbatim from the check's violation text at 50fc231: "a module that launders two dials
    into one figure need name no dial and perform no arithmetic on a magnitude … BUT IT CANNOT
    AVOID COMING HERE."
  step_3_the_one_variable_experiment: >
    PL-R6-banner-door-swapped.py.txt IS PL-R5 WITH EXACTLY ONE THING CHANGED — THE DOOR. Same
    intent, same mean, same accumulation loop, same publication into a slot. `observed_for_dial`
    becomes `combine_within_one_dial`. RESULT: PL-R5 FAIL 2 violations (4887 assertions); PL-R6
    PASS 0 violations (4882 assertions); and the banner publishes
    EquityCrashScore(score=DialMagnitude(dial_id='equity_crash', quantity=0.5)), with
    number_for_dial_slot returning 0.5. "IT CANNOT AVOID COMING HERE" IS FALSE, AND ONE IDENTIFIER
    IS THE WHOLE DIFFERENCE.
  the_ruling: >
    PL-R5 WAS NEVER EVIDENCE THAT THE CLASS WAS CLOSED. It was evidence that PL-R5 NAMED A DOOR
    THAT WAS IN THE VOCABULARY. A deny-by-default registry is only as closed as its vocabulary, and
    this vocabulary had a PUBLIC PROXY missing from it. The refusal was real; the INFERENCE DRAWN
    FROM THE REFUSAL was wider than the refusal supported, and CD-D-040 recorded that wider
    inference as an acceptance.
  the_pattern_and_its_count: >
    This is the CD-ENG-WO2R-F13 pattern — A PROBE REFUSED FOR THE WRONG REASON — and it is the
    SIXTH recurrence on this project, but the FIRST AIMED AT AN ACCEPTANCE rather than at a probe.
    The five prior instances (the Engineer twice, the PL's own probe, a prose measurement at
    CD-PL-F71, and CD-PL-F72) each cost a re-run. THIS ONE COST A GATE: increment 2b was accepted,
    the work order ran on, and an auditor found the same class open ONE FUNCTION ACROSS, two gates
    later.
  the_method_correction_OFFERED_AND_NOT_SELF_ADOPTED: >
    OFFERED TO THE PRODUCT AUTHORITY, NOT ADOPTED BY THIS SEAT, because a rule that binds future
    seats is not the Project Lead's to make on its own authority — which is the same principle
    CD-D-073 rests on and it would be incoherent to honour it there and breach it here. THE
    PROPOSED RULE: when a probe is REFUSED, the record must state WHICH LAYER refused it and WHAT
    THAT LAYER'S STATED SCOPE IS, before any acceptance cites it. A refusal by a registry is
    evidence about the REGISTRY'S VOCABULARY — never about the class. The question CD-D-040 never
    asked is the one that would have found this in a single line: "what is in the vocabulary, and
    what is a door that is NOT in it?"

