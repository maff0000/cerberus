# ================================================================================================== #
  source: governance/decisions/PO-DECISIONS-0030.md
  commit: 0e6f0946a4045e439d65fb7e1900c81e96995e10
  authored_by: Matt Scott — the Product Authority, and by NO SEAT
  ruling_1_verbatim: >-
    "Q35(a) — YES, the fourth refusal stage gets its OWN Required Test Register row, and it lands
    BEFORE 16C. This is ruling 9's principle (a constitutional guarantee is carried by a
    REGISTER-WIRED instrument, never test-only) applied to the freshness stage: the guarantee is
    proven today, but proven in tests is not proven in the register. Register-wire it — its own
    row, a negative control the gate reads, failing if stale-carrying-calm is ever admitted — and
    land it before 16C so the control is registered before the lane moves on."
  ruling_2_verbatim: >-
    "Q35(b) — the gate's limit is DECLARED, and source-honesty is the DETECTION tier, NOT
    'permanently outside enforcement.' ... the gate is PREVENTION of what is document-internal; a
    lying source is caught by DETECTION — witness divergence + provenance (CD-AC-018), where a
    source's claimed freshness is corroborated against witnesses and divergence is the alarm. So:
    16C's detector-side liveness carries the HONESTY OBLIGATION — stamps are provenance-backed and
    witness-corroboratable — and the guard's DECLARED SCOPE states the split honestly: gate
    enforces internal freshness, detection tier enforces source honesty. It is NOT recorded as
    unenforceable; it is enforced one tier out, owed at WO-3 when real sources and their witnesses
    land."
  what_this_seat_did_NOT_read_into_it: >-
    Ruling 3 names TWO substantive items and one preservation constraint. It does NOT re-order 16C,
    it does NOT authorise the indicator rows, and it does NOT release the memorial removal. This
    dispatch carries the two ruled items, plus TWO CONSEQUENTIAL ITEMS DISCLOSED BELOW RATHER THAN
    FOLDED IN SILENTLY.

