action_summary: >
  WO-2R INCREMENT 3 IS RECONCILED AND **NOT ACCEPTED** (CD-D-044). Every number the seat
  declared REPRODUCES EXACTLY on pristine extractions — the clean arm at 53 assertions, the
  defect reproduced at the old base at 44 assertions and exit 0 matching the auditor
  verbatim, the positive control at 67, the full suite 1155 -> 1187 passed, ZERO of the 1155
  original pytest node ids missing with 32 added, all ELEVEN plants applying, all four
  commits correctly seated as CD-ENG-WO2R-01 in BOTH author and committer, and all ten
  headings of the mandatory CLASS/STRUCTURE block present on every one of the four. The
  record is honest, the declared limit is the best-drawn in this project so far, and the
  seat's two self-raised findings are real.

  THE HEADLINE CLOSURE HOLDS. Deny-by-default over the `hosts` allowlist survived everything
  thrown at it, including three fresh Project Lead probes of routes the seat did not try:
  PL-S1 (an EIGHTH service declared with a broker allowlist) is refused twice over and moves
  the guard's `scanned:` count 7 -> 8, proving the subject is DERIVED FROM THE ARTEFACT and
  not from a constant; PL-S2 (a YAML anchor aliased into the allowlist) exits 3 because the
  reader REFUSES TO GUESS rather than reading a hidden field as absent; PL-S4 (a duplicate
  `hosts:` key) is refused by deny-by-default on the last-wins value.

  WHAT FAILS IS AN ADJACENT FIELD THE SEAT TOOK INTO SCOPE AND THEN GUARDED WITH THE WRONG
  LAYER. CD-PL-F59 (MEDIUM): an address literal in `pending` passes the check clean.

the_measured_contrast_that_decides_it: >
  PL-S3b puts `api.ibkr.com` in cd-collectors' `pending` list: REFUSED, exit 1,
  "CD-EGRESS-002: a pending entry names a broker host". PL-S3a puts `198.51.100.24` in the
  SAME SLOT: PASS, exit 0, 53 assertions, 0 violations. PL-S3c carries the same address on a
  `host:` key inside a `pending` mapping entry: PASS, exit 0.

  That is CD-ASR-F04 reproduced verbatim one field across. The auditor's own sentence — "the
  check recognises brokers BY NAME, and an IP literal has no name to recognise; the same slot
  carrying api.ibkr.com exits 1" — is now true of `pending` exactly as it was true of `hosts`
  before this increment.

why_this_is_not_out_of_scope: >
  The seat did not leave `pending` alone. It took the field INTO SCOPE deliberately: the
  check fires CD-EGRESS-002 on it at check_egress_no_broker.py lines 921-937, and the
  docstring at line 90 states the vocabulary applies "to every `pending` entry, because a
  pending entry is a host". Having decided the field was worth guarding, it applied ONLY the
  layer that CD-ASR-F04 proved insufficient and not the layer that replaced it.

  Nor is `pending` incidental. The x-egress contract in compose.yaml defines it as "endpoints
  BLUEPRINT §2 declares this service WILL NEED" — it is precisely the declaration that the
  WO-3 enforcement lane inherits, and this dispatch exists because "the defect is in the
  DECLARATION that the WO-3 enforcement lane will inherit", to be closed BEFORE that lane
  exists. "A pending entry grants nothing" is not a distinguishing defence: at WO-2 an
  allowlist entry grants nothing either, because both networks are internal:true. The whole
  increment is about declarations, not packets.

the_cd_rule_006_defect: >
  Declared limit boundary 4 reads: "a real brokerage whose registrable domain is on nobody's
  list ... passes LAYER 2. It does not pass LAYER 1 unless a human deliberately registers it,
  which is the whole point of deny by default: the escape now costs a signed edit to a
  reviewed registry file, not a quiet line in an allowlist."

  For `pending` THERE IS NO LAYER 1. An entry passing layer 2 in `pending` passes ENTIRELY,
  at the cost of exactly one quiet line and no registry edit at all. Boundary 4 names a
  compensating layer that does not compensate for this field. That is the same shape as
  CD-PL-F54 at increment 2 — a declaration naming another layer as carrying a residue that
  the layer does not carry — and it is the shape CD-RULE-006 was written to forbid.

  Under CD-RULE-004 a guard closes its class OR declares its own limit. For `pending` it did
  NEITHER: none of the six boundaries mentions the field. THAT, and not the escape's blast
  radius, is why increment 3 goes back.

