decisions:
  - id: CD-D-044
    ruling: >
      WO-2R increment 3 is NOT ACCEPTED. CD-ASR-F04 is NOT closed as a class. Increment 3 is
      RE-OPENED as increment 3b, bounded to CD-PL-F59 and nothing else, in the pattern that
      worked for increment 2 -> 2b. The lane is NOT reverted: a79d4b2..b60d153 stand, the
      deny-by-default structure over `hosts` is good work and is kept, and 3b extends it.
  - id: CD-D-045
    ruling: >
      The Project Lead does NOT write the fix. A Project Lead that authors the closure has
      made itself the implementer of work it will reconcile (PBG-AUTH-006). CD-D-038 set this
      precedent at increment 2 and it is not relaxed because the fix looks small. The seat is
      given the CLASS, the measured contrast and the rule it fails — not the code.
  - id: CD-D-046
    ruling: >
      The remedy is the seat's choice under CD-RULE-004, not the Project Lead's: either close
      `pending` under the same deny-by-default structure, or DECLARE IT as a seventh boundary
      in the CD-RULE-006 form. But if it declares rather than closes, it MUST ALSO CORRECT
      BOUNDARY 4, whose compensating-layer claim is measurably false for this field. A
      declaration that leaves boundary 4 standing would be the CD-PL-F54 defect a third time.
  - id: CD-D-047
    ruling: >
      PL-S1..PL-S4 are GIVEN to the Engineer as its minimum proof obligation for 3b rather
      than withheld, and are written to governance/reconciliation/WO-2R/ as DATA. They join
      the exclusion set, which is now the union of the WO-2 auditor's ten, the Engineer's
      seventeen plus eight, and the Project Lead's twenty-three plus six.

findings:
