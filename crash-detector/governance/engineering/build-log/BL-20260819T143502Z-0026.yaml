    severity: MEDIUM
    status: OPEN
    title: "an address literal in `pending` passes the egress check — CD-ASR-F04 surviving one field across"
    detail: >
      See the_measured_contrast_that_decides_it and the_cd_rule_006_defect above. Three
      measured facts: (a) PL-S3b proves the guard judges `pending` and treats a broker host
      there as a violation; (b) PL-S3a and PL-S3c prove it judges it BY NAME ONLY, so the
      auditor's own address passes; (c) declared limit boundary 4 asserts a layer-1
      compensation that does not exist for this field, and none of the six boundaries mentions
      `pending` at all, so the guard neither closed the class nor declared the limit
      (CD-RULE-004, CD-RULE-006).
  - id: CD-PL-F60
    severity: INFORMATIONAL
    status: DISCLOSED
    title: "increment 3 commit subjects carry the [CRASH-DETECTOR] prefix, not [CD-ENG-WO2R-01]"
