- id: CD-RT-012-NO-EXECUTION-INTERFACE
  criterion: CD-AC-012
  command: 'python3 <SUBJECT>/tools/register/check_no_execution_interface.py --root <SUBJECT>'
  clean_arm_exit: 0
  clean_arm_result: '23100 assertions, 0 violations, over 74 Python and SQL files'
  scanned_set: >
    Every Python module and every SQL file under src/, db/, deploy/, tests/ and tools/. In Python:
    the names of functions, classes, parameters, variables, attributes, keyword arguments and
    imports, plus string literals that look like an endpoint. In SQL: identifiers — table, column
    and function names — with comments, string literals and dollar-quoted bodies blanked first.
  boundary_stated: >
    DOCSTRINGS, COMMENTS AND PROSE ARE DELIBERATELY NOT MATCHED, and the check says so in its own
    output. A docstring saying "this system places no orders" is not an order interface; a
    function called `place_order` is. Matching prose would fill the findings with the project's
    own descriptions of what it refuses to do, and a check whose output is mostly noise is a check
    nobody reads.
    FOUR PATHS ARE EXCLUDED, all of them the register's own guards
    (_broker_vocabulary.py and the three checks that carry the vocabulary), because a guard must
    name what it forbids in order to forbid it. Every other file under tools/ IS scanned.
  how_it_judges_the_class: >
    Identifiers are tokenised — placeOrder, place_order and PLACE_ORDER all reduce to
    {place, order} — and judged by COMPOSITION, in tools/register/_broker_vocabulary.py: an
    execution VERB applied to an execution OBJECT; an execution object wearing an INTERFACE
    suffix; an execution object carrying an ORDER'S DATA MODEL; or a STANDALONE brokerage noun.
    Composition is what keeps the guard honest in both directions. A bare-token rule on `order`
    would condemn the existing, entirely English `test_every_shutdown_callback_runs_in_
    registration_order` and `test_the_filename_pattern_orders_lexically_and_numerically_the_
    same_way`; a rule on the literal string `place_order` would miss every other spelling. The
    composite rules fire on neither piece of English and on all ten variants below.
    `execute` is deliberately NOT a standalone noun, because it collides with `cursor.execute`,
    and a guard that cries wolf is a guard people learn to silence.
  variants_tested: >
    TEN. All ten now handled; ONE ESCAPED THE FIRST CUT and is recorded as CD-ENG-F28.
    EX-V1 `def place_order(symbol, quantity)` — the dispatch's named plant. CAUGHT (verb+object).
    EX-V2 `def submitTrade(instrument, size)` — camelCase, different verb, different object. CAUGHT.
    EX-V3 `class OrderGateway` — no verb anywhere. CAUGHT (object + interface suffix).
    EX-V4 `def _record(order_id, side)` — no verb, no interface suffix, just an order's DATA
      MODEL. CAUGHT (object + data model), on both the parameter and the name.
    EX-V5 `import ib_insync` — a broker SDK whose name contains no execution word at all. CAUGHT
      (module denylist). This is why the denylist exists ALONGSIDE the token rules.
    EX-V6 `_UPSTREAM = "https://api.example.com/v2/orders/new"` — an execution endpoint hidden in
      a URL, with every identifier around it innocuous. **ESCAPED THE FIRST CUT — see CD-ENG-F28.**
      Now CAUGHT.
    EX-V7 IN THE STORE rather than the code: a new forward migration creating
      `private.order_ticket (order_id, side, submitted_utc)`. CAUGHT (SQL identifier) — a table
      outlives every piece of code that reads it.
    EX-V8 `brokerage = None` in deploy/entrypoints/cd_private.py. CAUGHT (standalone noun).
    EX-V9 `def close_position(book)` in tests/ — an EXIT pathway is still an execution pathway,
      and tests/ is inside the scanned set. CAUGHT.
    EX-V10 `import ccxt as _x` — aliased to something bland. CAUGHT; the alias is irrelevant.

