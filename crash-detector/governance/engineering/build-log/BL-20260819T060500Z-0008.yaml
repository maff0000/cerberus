- id: CD-RT-001-AST-NO-NUMERIC-DEFAULT
  criterion: CD-AC-001
  command: 'python3 <SUBJECT>/tools/register/check_no_numeric_default.py --root <SUBJECT>'
  clean_arm_exit: 0
  clean_arm_result: '190 assertions, 0 violations, 2 disclosed notes'
  what_it_bans: >
    Five classes, each of which turns "we do not know" into a number: (A) nullable-number
    annotations — `float | None`, `Optional[float]`, `Union[float, None]` and their string forms;
    (B) a numeric fallback in a lookup — `.get(k, 0)`, `getattr(o, n, 0.0)`, `setdefault`, `pop`,
    `next`, and the `default=`/`fallback=` keyword forms; (C) `or <number>`; (D) a numeric default
    produced out of an except handler; (E) a conditional numeric default — `x if x is not None
    else 0` and the statement form `if x is None: x = 0`.
  scanned_set: >
    TWO TIERS, declared as data and not discovered, refusing if a declared path is missing so a
    deleted module shrinks the guard visibly rather than silently.
    DIAL PATH — src/crash_detector/dials/ and src/crash_detector/engine/. All five classes are
    violations. This is not a boundary this seat chose: both packages declare themselves the dial
    path in their own __init__ docstrings, and BLUEPRINT §13 words the criterion as "AST check
    bans float | None, or 0, .get(k, 0) IN THE DIAL PATH".
    ADJACENT PATH — src/crash_detector/serving/ and src/crash_detector/observations.py. Classes
    B, C, D and E are violations here too, because a number substituted for a failed lookup is
    wrong anywhere in this product and the criterion is about the substitution rather than the
    directory. Class A is REPORTED AS A NOTE with file and line. See CD-ENG-F26.
  variants_tested: >
    TEN, each a different expression of the same defect. All ten CAUGHT.
    ND-V1 `cache.get(dial_id, 0.0)` in engine/evaluate.py — the dispatch's own named plant. CAUGHT (B).
    ND-V2 `getattr(reading, "value", None) or 0` in dials/dialset.py. CAUGHT (C).
    ND-V3 `-> Optional[float]` in engine/config.py, imported form. CAUGHT (A).
    ND-V4 bare `except:` returning 0.0 in engine/evaluate.py. CAUGHT (D).
    ND-V5 THE SAME defect hidden behind a module constant `CALM = 0.0` and a broad `except
      Exception` rather than a bare one — this is the variant a literal-scanning check misses,
      because the number never appears at the return site. CAUGHT (D), via module-constant
      resolution.
    ND-V6 `score if score is not None else 0.0` in dials/scores.py — no `or`, no `.get`, no
      annotation. CAUGHT (E).
    ND-V7 statement form `if magnitude is None: magnitude = 0`. CAUGHT (E).
    ND-V8 `-> "float | None"` written as a STRING annotation. CAUGHT (A), by re-parsing the string.
    ND-V9 `Union[float, None]` on a variable annotation plus `getattr(reading, "value", -1.0)` —
      a NEGATED literal, which a naive constant test misses. CAUGHT (A and B).
    ND-V10 `cache.setdefault(dial_id, 0)` and `lookup(dial_id, default=0.0)`. CAUGHT (B, twice).
  boundary_stated: >
    An ordinary numeric parameter default such as `grace_seconds: float = 15.0` is NOT flagged.
    That is configuration with a declared value, not absence becoming a value. Stated in the
    check's own docstring so the boundary is visible rather than discovered.

- id: CD-RT-002-AST-NO-BLEND
  criterion: CD-AC-002
  command: 'python3 <SUBJECT>/tools/register/check_no_blend.py --root <SUBJECT>'
  clean_arm_exit: 0
  clean_arm_result: '1027 assertions, 0 violations'
  two_rules: >
    RULE 1 ARITHMETIC — no expression anywhere in the application source may combine an
    equity-flavoured value and a monetary-flavoured value under an arithmetic or bitwise operator,
    a comparison, an augmented assignment, or a numeric aggregate. THERE IS NO ALLOWLIST FOR THIS
    RULE, not even the container and the serving layer: holding two dials side by side never
    requires arithmetic between them.
    RULE 2 CO-OCCURRENCE — no single expression may consume both dial types at all, outside the
    allowlisted container and serving layer (BLUEPRINT §13: composition happens only at the
    serving layer). Six paths are allowlisted for RULE 2 only, each with its reason recorded in
    the check: dials/dialset.py (the container), dials/scores.py (the module that DEFINES both
    types and enumerates them as SCORE_TYPES so the guards can iterate), engine/evaluate.py (which
    BUILDS the container), the two package __init__ re-export surfaces, and serving/.
  the_escape_this_check_exists_to_close: >
    The obvious plant is `combined = (dials.equity.score + dials.monetary.score) / 2`, and a
    single-expression check finds it. The obvious ESCAPE is three statements — `e = ...equity...`,
    `m = ...monetary...`, `combined = (e + m) / 2` — where by the time the addition happens no
    dial marker is in the expression, and a single-expression check reports the tree CLEAN while
    the blend sits in it. So this check carries intra-procedural FLAVOUR PROPAGATION: within each
    function and at module level, a local name assigned from an equity-flavoured expression
    becomes equity-flavoured, through plain assignment, annotated assignment, augmented
    assignment, tuple unpacking, walrus, `for` targets, `with ... as` and comprehension targets;
    parameters are flavoured from their annotations.
  variants_tested: >
    TEN. All ten CAUGHT.
    BL-V1 `(dial_set.equity.value.score + dial_set.monetary.value.score) / 2` in publication/.
      The dispatch's named plant. CAUGHT (RULE 1 and RULE 2).
    BL-V2 THE THREE-STATEMENT ESCAPE, spelled exactly as above. CAUGHT (RULE 1) — this is the
      single most important line of evidence in this check, because it is the variant that
      distinguishes a guard from a tripwire.
    BL-V3 `max(equity.score, monetary.score)` — no operator at all. CAUGHT (RULE 1, aggregate).
    BL-V4 arithmetic INSIDE THE ALLOWLISTED SERVING LAYER. CAUGHT (RULE 1 has no allowlist).
    BL-V5 arithmetic INSIDE THE ALLOWLISTED CONTAINER, reached via the dial-id STRING LITERALS
      `history["equity_crash"]` and `history["monetary_debasement"]` rather than the slot names.
      CAUGHT (RULE 1).
    BL-V6 a COMPARISON rather than arithmetic — "which dial is worse", which presumes the shared
      scale CD-AC-002 denies. CAUGHT (RULE 1).
    BL-V7 propagation through a tuple unpack and an augmented assignment. CAUGHT (RULE 1 + 2).
    BL-V8 propagation through PARAMETER ANNOTATIONS only — `def fuse(a: EquityCrashScore, b:
      MonetaryDebasementScore)` with no dial-ish variable names anywhere. CAUGHT (RULE 1 + 2).
    BL-V9 `sum(parts) / len(parts)` over a list built from both. CAUGHT (RULE 1, twice).
    BL-V10 a walrus in the engine using the DIAL ID CONSTANTS rather than slot names. CAUGHT.
  scanned_set: >
    src/crash_detector/ and deploy/entrypoints/. tests/ is deliberately NOT scanned and the reason
    is stated in the check: the tests for CD-AC-002 must write `operator.add(equity, monetary)` in
    order to assert that it raises, and a check that failed the test proving the property would be
    nonsense.

- id: CD-RT-002-SCHEMA-CLOSED
  criterion: CD-AC-002 (with CD-AC-001 and CD-AC-006 riding on the same closure)
  command: 'python3 <SUBJECT>/tools/register/check_schema_closed.py --root <SUBJECT>'
  clean_arm_exit: 0
  clean_arm_result: '242 assertions, 0 violations'
  seven_propositions: >
    (1) every object-shaped schema node declares additionalProperties: false — at the root, in
    every properties entry, every $defs member, every oneOf/anyOf/allOf branch and every items;
    (2) no patternProperties and no unevaluatedProperties other than false; (3) the root
    properties are EXACTLY the declared allowlist, by set equality rather than by searching for a
    name somebody guessed; (4) required matches the allowlist, so a consumer never has to tell
    "absent" from "omitted"; (5) exactly ONE root property is scalar-numeric
    (staleness_window_seconds — a window, not a reading), which holds even if (3) were edited,
    because a blended headline must be a number somewhere and this counts the numbers; (6)
    $defs/dial_reading_unknown declares no `score` property, so an UNKNOWN dial carrying a number
    is unrepresentable — CD-AC-001 held in the schema; (7) $id is a urn and every $ref is a local
    # fragment, so no validator can be induced to fetch anything.
  variants_tested: >
    TEN, over both the public and the private envelope. All ten CAUGHT.
    SC-V1 add `combined_stress` to properties and required — the dispatch's named plant. CAUGHT (3, 4, 5).
    SC-V2 `additionalProperties: true` at the root — the other named plant. CAUGHT (1).
    SC-V3 open it with a SCHEMA rather than `true`: `additionalProperties: {"type": "number"}`,
      which still LOOKS constrained and admits every number under every name. CAUGHT (1).
    SC-V4 open a NESTED level only ($defs/dial_reading), leaving the root closed. CAUGHT (1).
    SC-V5 `patternProperties: {"^x_": ...}` as the escape hatch. CAUGHT (2).
    SC-V6 `unevaluatedProperties: true`. CAUGHT (2).
    SC-V7 a third number under an innocuous name — `market_temperature` — nothing like
      "combined". CAUGHT (3, 4, 5). This is the build-for-the-class case for propositions 3 and 5.
    SC-V8 give the UNKNOWN branch a `score`. CAUGHT (6).
    SC-V9 the same plant on the PRIVATE envelope instead of the public one. CAUGHT (3, 4, 5).
    SC-V10 a remote `$ref` to https://example.invalid/dial.json. CAUGHT (7).
  why_structural_and_not_a_validator_run: >
    A behavioural probe needs `jsonschema`, which is a declared dependency of the application but
    not of this stdlib-only register. The behavioural half is covered, and covered properly, by
    tests/test_envelope_contracts.py and tests/test_publication_refusal.py. The structural half is
    also the STRONGER half here: a probe only rejects the keys the prober thought of, while
    proposition (1) rejects every key at every level by construction.

