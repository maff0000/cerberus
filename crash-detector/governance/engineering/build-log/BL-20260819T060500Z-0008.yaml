# ================================================================================================
# THE EXIT-CODE CONTRACT, shared by every check (PBG-CI-002)
# ================================================================================================
exit_code_contract:
  '0': 'CLEAN — assertions were made, and all of them held.'
  '1': 'VIOLATION — at least one finding, each printed with its file and its line.'
  '2': 'USAGE — the command line was wrong.'
  '3': 'PRECONDITION NOT MET — the check could not do its job, with the reason stated.'
  the_rule_that_matters: >
    NO CHECK MAY SKIP. For any reason. Ever. A precondition that cannot be met is a NON-ZERO exit
    with a stated reason — never a pass and never a skip. A check that skips is a check that
    detects nothing while reporting success, which is worse than no check at all, because the
    register then carries a row somebody believes.
  the_vacuity_GUARD: >
    The rule has a second, less obvious half, enforced centrally in tools/register/_support.py by
    Check.done(): a check that made ZERO ASSERTIONS also refuses. Otherwise `exit 0` would mean
    "clean" and "I looked at nothing" indistinguishably, and pointing a check at the wrong
    directory would read as a pass. Every check counts the propositions it actually tested and
    prints the count, so a run that examined less than it should is visible in its own output.
  1_and_3_are_printed_differently: >
    Deliberately. An auditor reading only stdout must be able to tell a real violation from a
    broken check, so a violation prints VIOLATION lines with file:line on stdout and a refusal
    prints PRECONDITION_NOT_MET with its reason on stderr.

