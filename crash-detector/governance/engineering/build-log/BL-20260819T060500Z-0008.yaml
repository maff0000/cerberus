- id: CD-RT-012-EGRESS-NO-BROKER
  criterion: CD-AC-012
  command: 'python3 <SUBJECT>/tools/register/check_egress_no_broker.py --root <SUBJECT>'
  clean_arm_exit: 0
  clean_arm_result: '43 assertions, 0 violations, over 7 services and 2 networks'
  what_it_asserts: >
    CD-EGRESS-003 every service declares an x-egress block with a policy in {NONE, ALLOWLIST}, a
    hosts list and an enforced_by. A service with none is a VIOLATION and not a default.
    CD-EGRESS-001 cd-engine, cd-public, cd-private and cd-store declare policy NONE with an empty
    hosts list AND are attached only to networks declared `internal: true` — the topology is what
    makes "no egress" structural, and a service that gains a routed network has gained egress
    whatever its policy says.
    CD-EGRESS-002 no hosts entry and no pending entry, in any service, names a broker.
  how_it_judges_the_class: >
    CD-EGRESS-002's own wording demands it: "the question is what kind of thing lives there, not
    whether its name contains a string somebody thought of". A host is judged three ways and any
    one condemns it — (1) its domain labels and URL path segments, tokenised on `.`, `-`, `_` and
    `/`, against a vocabulary of brokerage and market-execution concepts; (2) every dotted suffix
    of its host part against a denylist of known broker and exchange OPERATORS, because ibkr.com
    contains no concept word at all and is the likeliest real instance; (3) the same vocabulary
    over the URL path, so an innocent host with an order endpoint is caught.
  refuses_on_an_unresolved_alias: >
    A posture supplied through an unresolved YAML merge would read as ABSENT to a literal reader,
    which is exactly how a posture hides behind an indirection. The check detects that case and
    REFUSES rather than reading the field as missing.
  variants_tested: >
    EIGHT. All eight handled.
    EG-V1 `api.interactivebrokers.com` in the collectors allowlist — the named plant. CAUGHT.
    EG-V2 `gateway.ibkr.com` — a broker with NO concept word and no famous word in the label.
      CAUGHT by the operator denylist. Build-for-the-class case for rule 2.
    EG-V3 `https://data.example.com/v1/orders/submit` — an innocuous host whose PATH is the order
      endpoint. CAUGHT by rule 3.
    EG-V4 change cd-engine's policy to ALLOWLIST with `exec.example.com`. CAUGHT three times.
    EG-V5 leave the POLICY saying NONE but make cd-net-public `internal: false`. CAUGHT —
      egress by ATTACHMENT, which is a route while a policy is only a declaration.
    EG-V6 add a WHOLE NEW SERVICE with no x-egress block at all — bypass by addition. CAUGHT.
    EG-V7 hide a broker host (`gateway.tradier.com`) in a PENDING entry, which grants nothing
      today and everything tomorrow. CAUGHT.
    EG-V8 an unrecognised policy value `DEFAULT`. CAUGHT — an unknown policy is a violation, not
      an unknown to be tolerated.
  what_this_check_does_not_claim: >
    It reads a DECLARATION and the topology behind it, and prints that fact as a note on every
    run. BLUEPRINT §2 and compose.yaml both disclose that Compose has no per-host egress
    primitive, so an ALLOWLIST is enforced by a lane owed at WO-3, and in WO-2 every network is
    internal so the effective egress of every service is none. No packet was observed and none is
    claimed. This is CD-ENG-R1, carried forward unchanged.

- id: CD-BASE-IMAGE-DIGEST-PIN
  criterion: 'BLUEPRINT §2 and §11; Standards Baseline §3'
  command: 'python3 <SUBJECT>/tools/register/check_base_image_digest_pin.py --root <SUBJECT>'
  clean_arm_exit: 0
  clean_arm_result: '13 assertions, 0 violations, over 2 declared pins, 1 compose service image and 6 Dockerfiles'
  built_to_a_contract_that_already_existed: >
    deploy/base-images.json carries a register_check_contract block written in increment 3, naming
    what this check must scan, what it must fail on, what it must accept and that it must not
    skip. This script implements that contract clause by clause AND READS IT OUT OF THE SUBJECT
    TREE AT RUN TIME — so a subject whose contract has been edited is checked against its own
    contract, and a DELETED clause is a violation rather than a clause the check quietly stops
    enforcing.
  variants_tested: >
    EIGHT. All eight handled.
    BI-V1 cd-store pinned BY TAG (`postgres:16-alpine`) — the named plant. CAUGHT.
    BI-V2 a BARE name `postgres` with no tag at all — an implicit `:latest`. CAUGHT.
    BI-V3 a digest of the WRONG LENGTH, which looks pinned at a glance. CAUGHT.
    BI-V4 `ARG CD_PYTHON_BASE=python:3.11-slim` — give the base ARG a DEFAULT, so the build
      succeeds and nobody is ever told the default was used. CAUGHT.
    BI-V5 `FROM python:3.11-slim` in a Dockerfile, bypassing the ARG mechanism entirely. CAUGHT.
    BI-V6 fill the UNRESOLVED cd-python-base pin with a plausible digest nobody observed. CAUGHT —
      this is base-images.json's own note about constructed evidence, made enforceable.
    BI-V7 DELETE the `must_fail_on` clause of the contract. CAUGHT (contract weakened).
    BI-V8 a new Dockerfile with `FROM ${BASE_REPO}/python:3.11` — an interpolation the check
      cannot resolve. CAUGHT, failing closed rather than passing on ignorance.

- id: CD-BUILD-CONTEXT-RESTRICTED
  criterion: 'CD-D-013; PBG-SEC-002; BLUEPRINT §2'
  command: 'python3 <SUBJECT>/tools/register/check_dockerignore.py --root <SUBJECT>'
  clean_arm_exit: 0
  clean_arm_result: '22 assertions, 0 violations; 47 patterns parsed'
  why_this_check_exists_at_all: >
    The dispatch left it to this seat's judgement whether a check belongs with the .dockerignore.
    It does, and a judgement call should carry its reasoning: every other protection in this
    project is enforced by something. An ignore file that nothing checks is a CONVENTION, and a
    convention is what you have instead of a control. The specific failure it prevents —
    governance/ and pbg/ uploaded to the Docker daemon and baked into image layers — is silent, is
    invisible in a passing build, and is not undone by noticing it later, because the layers are
    already published.
  how_it_judges_the_class: >
    It does NOT search for the text `governance`. Docker's ignore syntax has several spellings of
    one exclusion — `pbg`, `pbg/`, `pbg/**`, `**/pbg`, `./pbg` — and a negation `!governance` can
    re-include what an earlier broad pattern excluded. So the check IMPLEMENTS Docker's matching
    semantics (component-wise Path.Match with `*`, `?`, `**` and leading `!`, last-match-wins) and
    asks the question that matters: given this pattern set, is this path excluded? It also asserts
    the converse — that src/, deploy/entrypoints/, contracts/ and the dependency manifests are NOT
    excluded, because an ignore file that swallowed one behind a broad pattern would break the
    build in a way nobody would attribute to this file.
  variants_tested: >
    EIGHT. All eight handled.
    DI-V1 remove the `governance` line. CAUGHT (twice — the authority record and the Build Log).
    DI-V2 leave `pbg` in place but append `!pbg` to RE-INCLUDE it. CAUGHT — this is the variant a
      text search passes, because the required line is still in the file.
    DI-V3 delete the file. REFUSED, exit 3.
    DI-V4 empty the file but leave it present. REFUSED, exit 3 — an empty ignore file excludes
      nothing and is indistinguishable in effect from having none.
    DI-V5 add a broad `contracts` pattern that swallows something the build NEEDS. CAUGHT.
    DI-V6 replace `__pycache__` with a root-anchored `/__pycache__`, losing the nested case.
      CAUGHT.
    DI-V7 keep `.env` but drop the `.env*` family. CAUGHT.
    DI-V8 remove `plants`. CAUGHT.

behavioural_tests_run_through_pytest:
  note: >
    Three of the eleven required tests are behavioural and run through pytest rather than a
    bespoke script. The dispatch requires each to have a stable, SUBJECT-PARAMETERISED command
    line, and here they are. The form below names the subject TWICE and explicitly — once on
    PYTHONPATH and once in the node id — so nothing is inferred from the working directory. Node
    IDs are used rather than markers precisely so that block A needed no edit to make these
    runnable.
  command_form_verified: >
    `PYTHONPATH=<SUBJECT>/src python3 -m pytest -q -p no:cacheprovider <node ids>`. Verified
    against a tree extracted with `git archive`: pytest reported `rootdir: <SUBJECT>` and
    `configfile: pyproject.toml`, so the subject's own configuration governs the run.
    DISPLAY ARTEFACT, DISCLOSED so an auditor is not confused: when two extracted copies exist
    side by side, pytest's traceback lines may render a source path relative to a DIFFERENT copy,
    because it displays the shortest relative path it can compute. The NODE ID and the rootdir are
    authoritative and both name the arm under test; the traceback path is cosmetic.
  tests:
  - id: CD-RT-001-ABSENCE-RENDERS-UNKNOWN
    criterion: CD-AC-001
    command: |
      PYTHONPATH=<SUBJECT>/src python3 -m pytest -q -p no:cacheprovider \
        "<SUBJECT>/tests/test_evaluate.py::test_with_no_sources_declared_both_dials_read_unknown" \
        "<SUBJECT>/tests/test_evaluate.py::test_the_empty_state_is_unknown_even_when_observations_happen_to_be_present" \
        "<SUBJECT>/tests/test_evaluate.py::test_a_missing_required_input_forces_unknown" \
        "<SUBJECT>/tests/test_evaluate.py::test_a_stale_required_input_forces_unknown_and_never_the_previous_value" \
        "<SUBJECT>/tests/test_evaluate.py::test_a_future_dated_observation_is_not_treated_as_fresh" \
        "<SUBJECT>/tests/test_evaluate.py::test_a_missing_contributing_input_degrades_rather_than_hiding_the_damage"
    clean_arm_exit: 0
    clean_arm_result: '6 passed'
    negative_control: >
      BEH-1, applied to a THROWAWAY extracted copy in /tmp: replaced the empty-registry `Unknown`
      return in engine/evaluate.py with `Value(score=0.0, inputs_used=("none",))` — the dispatch's
      named "fall back to 0.0 on absence" plant. Result: 2 FAILED, 1 passed, exit 1. The guard
      bites (PBG-ASSURE-017).
  - id: CD-RT-002-TYPE-NO-ARITHMETIC
    criterion: CD-AC-002
    command: |
      PYTHONPATH=<SUBJECT>/src python3 -m pytest -q -p no:cacheprovider \
        "<SUBJECT>/tests/test_scores.py" "<SUBJECT>/tests/test_dialset.py"
    clean_arm_exit: 0
    clean_arm_result: '96 passed'
    negative_control: >
      BEH-2: added `__add__` to EquityCrashScore — the dispatch's named plant. Result: 4 FAILED,
      92 passed, exit 1. Note WHICH four failed: the whole-class dunder sweep, the ancestor sweep,
      and the parametrised binary-operator cases for `add` between the two dials and between a
      dial and a bare number. The suite caught the class, not only the one operator planted.
  - id: CD-RT-005-PANEL-UNAVAILABLE-NEVER-AGREES
    criterion: CD-AC-005
    command: |
      PYTHONPATH=<SUBJECT>/src python3 -m pytest -q -p no:cacheprovider \
        "<SUBJECT>/tests/test_witness_resolver.py" "<SUBJECT>/tests/test_witness_panel.py"
    clean_arm_exit: 0
    clean_arm_result: '65 passed'
    negative_control: >
      BEH-3: replaced the absent-row `Unavailable(reason="PANEL_ROW_ABSENT")` with
      `Agrees(divergence_measure=0.0, as_of_utc=instant)` — the dispatch's "default a missing panel
      to Agrees" plant. Result: 2 FAILED, 63 passed, exit 1, and the assertion message names the
      constructed `Agrees(...)` object, so the failure is about the proposition rather than an
      incidental signature error.

# ================================================================================================
# CD-OB-003 — the durable CD-RT-003-GRANT-MATRIX-LIVE check
# ================================================================================================
cd_ob_003:
  status: DISCHARGED
  what_was_owed: >
    Increment 3 proved the grant matrix against a live catalogue under RT-A with 150 assertions
    and 0 failures, but its probe instrument lived in /tmp. The criterion therefore had EVIDENCE
    and NO STANDING GUARD: reproducible in principle, and not runnable by anyone who was not that
    seat. CD-OB-003 required it be promoted to a check in the repository.
  what_was_delivered: 'tools/register/check_grant_matrix_live.py'
  it_takes_the_subject_tree_as_an_argument: >
    `--root <SUBJECT>`. It reads the migrations from <SUBJECT>/db/migrations/ and the declaration
    from <SUBJECT>/db/grant_matrix.json. It can therefore be run against a planted arm, which is
    the whole point of the requirement.
  it_takes_the_connection_target_from_the_environment_by_name_only: >
    CD_CHECK_STORE_HOST, CD_CHECK_STORE_PORT, CD_CHECK_STORE_NAME, CD_CHECK_STORE_USER,
    CD_CHECK_STORE_PASSWORD. NO VALUE APPEARS IN THE FILE, in this record, or anywhere governed
    (PBG-SEC-002, PBG-EVID-003, PBG-CONT-009, all non-waivable). The password is read by name at
    the point of use, and any occurrence of it in a driver error message is REDACTED before the
    message is shown — a defensive measure rather than a hope, because a connection failure is
    exactly when a driver becomes talkative.
  it_applies_the_migrations_itself_and_not_through_db_migrate_py: >
    Deliberate, and stated in the check. A check must not depend on the correctness of the thing
    it is checking: a migration runner that silently skipped a file would produce a store that
    agreed with a matrix nobody applied. db/migrate.py's own correctness is covered separately by
    tests/test_store_migrate_apply.py and was exercised under RT-A in increment 3.
  it_reads_the_grants_out_of_the_live_catalogue: >
    has_schema_privilege, has_table_privilege, has_sequence_privilege, has_function_privilege,
    information_schema.column_privileges and table_privileges, pg_namespace.nspacl,
    pg_auth_members, pg_default_acl, pg_class.relowner, pg_proc.proowner, pg_roles and pg_authid —
    plus, independently of every catalogue query, a real session opened with SET LOCAL ROLE
    cd_engine in which PostgreSQL itself refuses.
  how_it_fails_closed:
  - 'an UNSET environment variable -> exit 3, naming every variable that is unset. VERIFIED.'
  - 'an UNREACHABLE store -> exit 3, quoting the driver''s reason with the credential redacted.
     VERIFIED against 127.0.0.1:59999: "connection to server ... failed: Connection refused".'
  - 'psycopg2 NOT IMPORTABLE -> exit 3, stating that a live catalogue has no substitute.'
  - 'a MIGRATION THAT FAILS TO APPLY -> exit 3 with the SQLSTATE, because the store could not be
     built and nothing about its grants has been established.'
  - 'a CONNECTION THAT CANNOT READ pg_authid -> exit 3. A check whose own privileges hide part of
     the catalogue is reporting on its blind spot: it could not establish that the six roles carry
     no password, and it must say so rather than record an absence it did not observe.'
  - 'ZERO ASSERTIONS MADE -> exit 3, via the shared vacuity guard.'
  - 'NONE OF THESE IS EVER A SKIP. The dispatch calls this out by name and it is the property this
     check was built around: a check that skips when the store is down reports success on every
     host where nobody started a database, which is most of them.'
  the_stdlib_exception_disclosed: >
    B1 requires stdlib-only checks. This one imports psycopg2, and there is no way around it: the
    criterion is "read the grants OUT OF THE LIVE CATALOGUE", and a live catalogue needs a
    protocol client. The dispatch's own A1 constraint resolves it — every check must run on this
    host's interpreter with NO install step, "stdlib plus what is already present (jsonschema
    4.10.3, psycopg2 2.9.11)". psycopg2-binary==2.9.11 is a declared dependency in
    requirements.txt and requirements.lock. The other nine checks are stdlib-only with no
    exception. Disclosed here rather than left for an auditor to notice.
  the_assertion_this_seat_had_to_correct: >
    CD-GM-005 initially read as "publication.review declares no numeric column" and FAILED the
    clean arm, naming review_id and public_envelope_id — a surrogate key and a foreign key. The
    invariant's actual words are "no numeric DIAL column for a headline to be written into": a
    magnitude, not an identifier. The assertion was WRONG; the implementation was right. It is
    restated as a class rule and NOT as an exemption for the two columns that happen to exist —
    real-valued types (double precision, real, numeric) are forbidden outright, and integer types
    are permitted only as identifiers judged by an `_id` name suffix. A planted `combined_stress
    bigint` therefore still fails, which is proved by negative control GM-V10 below. Recording
    this because correcting one's own assertion to match the specification is legitimate, and
    correcting it to obtain a pass is not, and the difference is only visible if the reasoning is
    written down.

# ================================================================================================
# RT-A — the authorised runtime action, used to prove the durable check works
# ================================================================================================
rt_a:
  classification: MUTATION_CAPABLE_AUTHORISED — RT-A, exactly as bounded in the dispatch record
  purpose: >
    To establish that the DURABLE check is true of a running store, not merely written. This is
    the seat's own implementation evidence and it is NOT assurance (PBG-SOD-001, non-waivable):
    the store was built from migrations this seat's predecessor wrote, by a check this seat wrote.
    CD-RT-003-GRANT-MATRIX-LIVE's admitted evidence remains RTR-WO2-0001, which only CD-ASR-WO2-01
    may produce.
  bounds_observed:
    image: >
      postgres@sha256:cf78e76683b9ca8c5733cbbdce6c9262b45b6767934dd0a95e671f9a0fc20685 — BY
      DIGEST. Verified on this host before use with
      `docker image inspect postgres:16-alpine --format '{{.Id}} {{range .RepoDigests}}{{.}}{{end}}'`
      -> exit 0, digest identical to deploy/base-images.json. The digest, not the tag, was the run
      reference.
    container_names: 'cd-store-wo2-inc4, and cd-store-wo2-gm1 .. cd-store-wo2-gm13 for the
      negative controls. EVERY ONE carries the cd-store-wo2- prefix.'
    volume_names: 'cd-store-wo2-inc4-data, cd-store-wo2-gm1-data .. -gm13-data. Same prefix.'
    port: '`-p 127.0.0.1::5432` — an EPHEMERAL port on LOOPBACK ONLY. Observed 127.0.0.1:32775 and
      32776 on the two clean runs. Nothing was bound to any other address (CD-D-006).'
    credentials: >
      Generated at run time with secrets.token_urlsafe(32), held only in the runner shell's
      environment, and passed to Docker with `-e NAME` (no `=`) so no value ever appeared on a
      command line or in the host process table. No value appears in any file, log, evidence or
      record, including this one. Destroyed with the container.
    prefix_discipline: >
      EVERY docker command issued was either prefix-filtered by cd-store-wo2- or named a
      cd-store-wo2- object explicitly. No container or volume outside that prefix was touched,
      stopped, restarted, inspected into or listed. `docker image inspect postgres:16-alpine`
      reads an IMAGE, which is neither a container nor a volume, and is what the digest
      verification required.
    instrument: '/tmp/rt_a_inc4.sh — the runner. Deliberately in /tmp (non-governed scratch): it
      provisions a store, which is the AUDITOR''s job to do their own way. The durable artefact is
      the CHECK, which takes a store as an argument. Delivering a provisioning wrapper would be
      delivering the thing PBG-ASSURE-001 forbids.'
  clean_run:
    command: 'bash /tmp/rt_a_inc4.sh'
    exit: 0
    result: >
      CD-RT-003-GRANT-MATRIX-LIVE: PASS — 138 assertions, 0 violations. Authentic target
      recorded by the check itself: "PostgreSQL 16.15 on x86_64-pc-linux-musl, compiled by gcc
      (Alpine 15.2.0) 15.2.0, 64-bit", postgres@127.0.0.1:32776/crash_detector, 7 migrations
      applied from the subject tree in filename order.
  negative_controls:
    why: >
      A probe that has never been seen to refuse anything is a rumour (PBG-ASSURE-017). Thirteen
      controls, each a separate one-migration plant applied to a THROWAWAY COPY of the tree under
      /tmp and run through a fresh container. THE WORKTREE WAS NEVER MUTATED. Seven of the
      thirteen attack CD-GM-001 along its seven DIFFERENT ROUTES, which is the build-for-the-class
      evidence for the invariant db/grant_matrix.json calls out by name: "a check that only looks
      for a direct GRANT catches the instance and not the class".
    results:
    - 'GM-V1 direct grant on schema + table (the dispatch''s named plant) -> exit 1, 7 violations
       across schema-privilege, table-privilege, column-privilege, the live SET ROLE refusal,
       CD-GM-002 and both whole-matrix comparisons.'
    - 'GM-V2 THE PUBLIC ROUTE — `GRANT ... TO PUBLIC`, in which cd_engine is never named at all
       -> exit 1, 6 violations including both dedicated PUBLIC routes.'
    - 'GM-V3 THE MEMBERSHIP ROUTE — `GRANT cd_witness TO cd_engine` -> exit 1, 2 violations
       (CD-GM-001 membership, CD-GM-006). No grant on witness was added at all.'
    - 'GM-V4 THE DEFAULT-PRIVILEGE ROUTE — grants nothing today and everything on the next object
       created -> exit 1, 3 violations.'
    - 'GM-V5 THE OWNERSHIP ROUTE — `ALTER SCHEMA witness OWNER TO cd_engine`. An owner needs no
       grant -> exit 1, 4 violations.'
    - 'GM-V6 THE SUPERUSER ROUTE — `ALTER ROLE cd_engine SUPERUSER`. A superuser holds every
       privilege in the cluster and appears in NO grant table -> exit 1, 40 violations.'
    - 'GM-V7 THE COLUMN-LEVEL ROUTE — `GRANT SELECT (source_id) ON witness.observation` -> exit 1,
       4 violations. NOTE, and this is the point of having the route: the whole-matrix table
       comparison stayed SILENT, because information_schema.table_privileges does not show a
       column-only grant. The dedicated column route and the behavioural refusal are what caught
       it.'
    - 'GM-V8 CD-GM-003 — `GRANT UPDATE ON dial.history TO cd_engine` -> exit 1, 3 violations.'
    - 'GM-V9 CD-GM-004 — `GRANT SELECT ON publication.private_envelope TO cd_public` -> exit 1,
       3 violations.'
    - 'GM-V10 CD-GM-005 — `ALTER TABLE publication.review ADD COLUMN combined_stress bigint`, an
       INTEGER rather than a real, chosen specifically to test the corrected assertion -> exit 1,
       1 violation. The corrected rule still bites.'
    - 'GM-V11 CD-GM-006 — a role given a password in a migration -> exit 1, 1 violation. The
       planted literal was the string PLANTED-NOT-A-SECRET, in a /tmp throwaway only: it is
       manifestly not a credential, it was never committed, and no real secret value exists
       anywhere in this project to plant (PBG-SEC-002).'
    - 'GM-V12 CD-GM-002 — REVOKE the witness''s read of publication.public_envelope, SHUTTING the
       one-way valve -> exit 1, 3 violations. The valve is asserted in BOTH directions: it must be
       open this way and shut the other, and a check that only asserted the prohibition would pass
       a store in which the witness can corroborate nothing.'
    - 'GM-V13 CD-GM-007 — `ALTER TABLE dial.history OWNER TO cd_engine` -> exit 1, 7 violations.'
  destruction:
    when: 'before this seat returned, on every one of the 15 runs, via a shell EXIT trap so a
      failure could not leave residue'
    commands_and_exit_codes:
    - 'docker rm -f cd-store-wo2-inc4              -> exit 0   (x2, the two clean runs)'
    - 'docker volume rm cd-store-wo2-inc4-data     -> exit 0   (x2)'
    - 'docker rm -f cd-store-wo2-gm<N>             -> exit 0   for N = 1..13'
    - 'docker volume rm cd-store-wo2-gm<N>-data    -> exit 0   for N = 1..13'
    residue_check_after: >
      `docker ps -a --filter name=cd-store-wo2- --format '{{.Names}}'` -> exit 0, EMPTY.
      `docker volume ls --filter name=cd-store-wo2- --format '{{.Name}}'` -> exit 0, EMPTY.
      Run after every cycle by the EXIT trap, and again as the last runtime act of this increment.
      NO RESIDUE.

# ================================================================================================
# FINDINGS
# ================================================================================================
findings:

- id: CD-ENG-F26
  severity: DISCLOSURE
  what: >
    Two nullable-number annotations exist OUTSIDE the declared dial path and are reported as notes
    by CD-RT-001-AST-NO-NUMERIC-DEFAULT on every run rather than failing it:
    src/crash_detector/observations.py:99 `http_status: Union[int, None]` on FetchFailed, and
    src/crash_detector/serving/witness_resolver.py:168 `_finite_measure(...) -> Union[float, None]`.
  how_it_was_found: >
    By writing the check with a WIDER scanned set than the criterion names, running it, and
    getting two hits on a clean tree.
  disposition: >
    NEITHER IS A VIOLATION, and neither was made to disappear. BLUEPRINT §7 and §13 scope the
    nullable-number ban to the DIAL PATH, which src/crash_detector/dials/__init__.py and
    src/crash_detector/engine/__init__.py both declare themselves to be, in docstrings written
    before this seat arrived. Narrowing the failing tier to the declared dial path is aligning the
    check with a ratified scope, not weakening it to obtain a pass — and the evidence that it is
    not weakening is that both sites are still PRINTED, with file and line, on every clean run.
    On the merits: FetchFailed carries no payload and no source_as_of_utc, and evaluate() only
    ever considers OK outcomes, so http_status cannot become a dial reading by any route.
    _finite_measure is a private serving helper whose own docstring states the confinement, whose
    two callers both branch on `is None` immediately, and whose None means PANEL_ROW_INCOHERENT.
  owed_to: >
    Nobody, as an action. Recorded so that a later reader finding a `float | None` in this
    codebase does not conclude the guard is asleep. If the Project Lead wishes the ban widened to
    the serving layer, that is a Blueprint clause change and is theirs, not this seat's
    (PBG-AUTH-005, PBG-BP-001).

- id: CD-ENG-F27
  severity: DEFECT IN THIS SEAT'S OWN CHECK — FOUND AND FIXED
  what: >
    The first cut of CD-RT-003-ENGINE-NO-WITNESS-REACH PASSED variant IG-V3, `from ..witness
    import panel as _p` in src/crash_detector/engine/model.py. The relative-import resolver used
    one anchor rule for every module. For a PLAIN module, level 1 means the containing package;
    for a PACKAGE (__init__.py), level 1 means the package itself. Getting it wrong resolved the
    import to the non-existent `crash_detector.engine.witness`, which matched no module in the
    map, so the edge was dropped and the graph read CLEAN.
  why_it_matters_more_than_the_bug: >
    This is the exact failure mode the dispatch warns about, in the guard rather than the code: a
    check that catches the instance (`import crash_detector.witness`) and not the class (the same
    import written relatively). It would have passed an auditor's plant and reported the product's
    most consequential separation intact. It was found ONLY because the variant was written and
    run — reading the resolver would not have found it, and neither would testing the one plant
    the dispatch names.
  fix: >
    The resolver now takes `is_package` and anchors accordingly, with the reasoning and the
    variant ID recorded in its docstring. Re-tested: all eight variants now caught, and the clean
    tree still passes with the same 11 assertions.

- id: CD-ENG-F28
  severity: DEFECT IN THIS SEAT'S OWN CHECK — FOUND AND FIXED
  what: >
    The first cut of CD-RT-012-NO-EXECUTION-INTERFACE PASSED variant EX-V6, `_UPSTREAM =
    "https://api.example.com/v2/orders/new"`. The composite identifier rules require a partner
    token — an execution object alone is not enough, deliberately, so that English like
    `test_..._in_registration_order` does not fire. Applied to a URL path segment, that same
    caution let a bare `orders` resource through.
  fix: >
    A PATH SEGMENT IS A RESOURCE, NOT ENGLISH. In `/v2/orders/new`, `orders` is the thing the
    endpoint acts on and no partner is needed to know it. Endpoint literals are now judged by a
    bare execution object as well as by the composite rules; identifiers are not. Re-tested: all
    ten variants caught, clean tree unchanged.

- id: CD-ENG-F29
  severity: OPEN — OWED, NOT DONE. Raised to the Project Lead.
  what: >
    Increment 3's RT-A probe asserted more than the grant matrix. It also established, against a
    LIVE catalogue: that the dial.history first_published_utc trigger refuses all three attack
    shapes while permitting an unrelated UPDATE; that dial.history refuses NaN, Infinity and
    -Infinity while admitting a real number (and that PostgreSQL holds `NaN = NaN` TRUE, which is
    why the idiomatic guard is wrong); that publication.public_envelope's allowlist refuses an
    eleventh key; that publication.witness_panel refuses AGREES with no measurement and refuses
    UNAVAILABLE carrying one; and that raw.source_registry's DISPOSABLE prohibition bites in both
    directions.
  the_gap: >
    Those assertions have EVIDENCE (BL-20260819T052200Z-0006) and NO STANDING GUARD — precisely
    the condition CD-OB-003 was raised about, for a different set of propositions. This seat did
    NOT fold them into check_grant_matrix_live.py: that check's charter is CD-GM-001..007, and a
    check named GRANT-MATRIX-LIVE that also asserted NaN handling would be a check whose identity
    nobody could state, which is how a register entry stops meaning anything. They belong in a
    companion live-store check serving CD-AC-010, CD-AC-002 and CD-AC-005.
  recommendation: >
    A bounded increment for a companion check, e.g. CD-RT-010-STORE-CONSTRAINTS-LIVE. NOT taken
    here: it is outside B1's stated deliverable and taking it would be widening scope by
