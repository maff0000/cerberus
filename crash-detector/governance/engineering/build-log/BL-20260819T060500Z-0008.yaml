- id: CD-ENG-F30
  severity: DEFECT IN BLOCK A — FOUND AND FIXED
  what: >
    tests/test_deploy_container_set.py::test_every_secret_is_referenced_by_name_and_never_carries_
    a_value read EVERY file under deploy/ as UTF-8. On any tree where an entrypoint had ever been
    imported, deploy/entrypoints/__pycache__/_service.cpython-311.pyc made all eight parametrised
    cases raise UnicodeDecodeError. Observed: 8 failed, 896 passed in the worktree, while the same
    commit extracted with `git archive` gave 904 passed — because .pyc files are gitignored and
    the archive does not carry them.
  provenance: >
    The .pyc has mtime 2026-08-19T06:28 local, which is BEFORE this seat's first commit at 06:48
    and consistent with increment-3-era activity. The defect was LATENT, not introduced here. It
    is recorded rather than quietly fixed because a suite that is green from a clean checkout and
    red in a working tree is exactly the kind of discrepancy that gets attributed to the wrong
    change later.
  why_it_was_fixed_under_a_B1_dispatch: >
    The dispatch permits reopening block A for a genuine defect and forbids refactoring it for
    taste. This is a defect: it makes the secret guard — one of the project's PBG-SEC-002
    instruments — fail for a reason that has nothing to do with secrets, on any developer machine.
    A guard that fails spuriously is a guard people learn to ignore, which is worse for a secret
    sweep than the thing it protects against.
  fix_STRENGTHENS_rather_than_relaxes: >
    __pycache__ is excluded WITH ITS REASON — a .pyc is compiled output of a .py this sweep
    already reads, so no coverage is lost. Any OTHER undecodable file under deploy/ is now an
    explicit AssertionError naming the file, rather than a crash: a binary blob is exactly where a
    credential would not be looked for, and the sweep must not pass over what it cannot read
    (PBG-CI-002). This is the opposite of adding a skip.
  mutation_proved_both_ways: >
    904 passed with the .pyc present. A planted `deploy/.probe.bin` containing non-UTF-8 bytes made
    all eight parametrised cases FAIL with the new stated reason, exit 1. Removing it returned
    them to 8 passed. The new refusal has been seen to refuse.

