findings_against_this_seats_dispatch:
  F01_upheld:
    seat_claim: '**A STATEMENT IN THE FIX DISPATCH IS FALSE.** §4 ordered *"Rule 1 must reach inside `${VAR:-DEFAULT}`"*. `rule_1_and_2_mounts` is MOUNT-scoped and never inspects an environment value.'
    this_seats_verification: |
      git show 53f639a:deploy/check_portability.py | sed -n '/def rule_1_and_2_mounts/,/^def /p' \
        | grep -ic "environment|env"   ->  0
      rule functions at 53f639a: rule_1_and_2_mounts, rule_3_addresses, rule_4_argus, rule_5_and_6_config
    disposition: >
      **UPHELD. THE DISPATCH WAS WRONG AND THE SEAT WAS RIGHT.** The MECHANISM this seat described was
      correct — rule 5 stops at the `${` prefix — but the ATTRIBUTION was to the wrong rule. **AND THE
      SEAT DID THE RIGHT THING WITH IT: it did not bend `rule_1_and_2_mounts` out of shape to obey a
      mistaken instruction; it added `rule_7_config_values`.** *** **A SEAT THAT HAD OBEYED THE
      DISPATCH LITERALLY WOULD HAVE PUT ENVIRONMENT-VALUE LOGIC INSIDE A MOUNT RULE AND MADE BOTH
      HARDER TO REASON ABOUT — TO SATISFY AN INSTRUCTION THAT WAS SIMPLY MIS-AIMED.** *** Recorded as
      `CD-PL-F178`: **when a dispatch names the code location as well as the defect, it is asserting a
      code fact and owes the same measurement as any other code claim.** **THIS IS THE FIFTH OF THE
      LAST SEVEN DISPATCHES TO CONTAIN AN ERROR THE SEAT CAUGHT.**
  F02_upheld:
    seat_claim: '**A THIRD GAP NEITHER THE AUDITOR NOR THIS SEAT NAMED**: the same dell path as a BARE LITERAL also passed, because `CD_CONTRACTS_DIR` is key-allowlisted.'
    disposition: >
      **UPHELD, AND THE SENTENCE THAT MATTERS IS THE SEAT'S OWN: fixing only the regex "would have
      left it green WHILE CLOSING THE FINDING."** *** **THAT IS THE PRECISE FAILURE MODE OF FIXING
      WHAT AN AUDITOR REPORTED RATHER THAN WHAT AN AUDITOR FOUND — AND IT IS THE FAILURE MODE THIS
      PROJECT IS MOST EXPOSED TO, BECAUSE ITS FINDINGS ARE DETAILED ENOUGH TO BE TREATED AS
      SPECIFICATIONS.** ***
  F06_self_reported:
    seat_claim: '**SELF-REPORTED: it wrote a FABRICATED SHA TAIL into its Build Log**, completing 33 characters from a 7-character short form. Caught before commit because `continuity.validate` reported that it DECLINED to check that field.'
    disposition: >
      **ACCEPTED, AND THE MANNER OF THE CATCH IS THE FINDING.** `CD-PL-F36` — *never transcribe a
      SHA, always `git rev-parse`* — is one of the oldest rules on this project and it was written
      after exactly this. **NO FALSE STATEMENT ENTERED THE RECORD.** But it was caught by an
      instrument saying *"I am not checking this"* and a seat reading that sentence carefully. **A
      CONTROL WHOSE SAFETY DEPENDS ON SOMEBODY READING AN "UNRESOLVED" LINE IS A CONTROL RESTING ON
      ATTENTION.** Related to `CD-PL-F171`: the validator that would have caught it is the one this
      project cannot run through its CLI.
  F04_F05: 'ACCEPTED. F05 corrects a claim in the record that was true-but-misleading — *"`src/` has no entrypoint"* is true, and `deploy/entrypoints/` holds six, none of which reach `publish_cycle`. **THE CLAIM WAS NOT FALSE AND WAS STILL CAPABLE OF MISLEADING A SUCCESSOR, WHICH IS THE DEFECT CLASS `BL-...-0156` WAS WRITTEN ABOUT.**'

CD-PL-F177:
  finding: >
    **AGAINST THIS SEAT, AND IT IS THE SECOND TIME TODAY — WHICH IS THE POINT OF RECORDING IT.**
    This seat's re-measurement of the D3 gaps reported that plants A and C **still passed**, which
    would have contradicted the Engineer's claim that all three were closed.
  what_was_actually_wrong: >
    **THE PLANT WAS A NO-OP AND THIS SEAT ASSERTED NOTHING ABOUT WHETHER IT HAD APPLIED.** The
    replacement landed at `deploy/compose.yaml:296` — inside the `x-cd-python-service` **YAML ANCHOR
    FRAGMENT** — whose `CD_CONTRACTS_DIR` is **overridden at every service that uses it** (lines 400,
    455, 505). **THE PLANTED DELL PATH WAS SHADOWED AND NEVER REACHED A RESOLVED SERVICE, SO THE
    CHECK WAS RIGHT TO PASS.** Re-planted at a SERVICE-level site: **A -> exit 1, B -> exit 1,
    C -> exit 1. ALL THREE GAPS ARE CLOSED.**
  the_lesson_stated_sharply: >
    *** **A PLANT INTO AN OVERRIDDEN ANCHOR IS INDISTINGUISHABLE, FROM THE OUTSIDE, FROM A CONTROL
    THAT FAILED TO FIRE.** *** Both look like `PASS — 0 violations`. **THE ONLY DEFENCE IS ASSERTING
    THAT THE MUTATION APPLIED *AND* THAT IT APPLIED WHERE IT WOULD BITE** — and this seat asserted
    neither, in a plant it wrote to check somebody else's plant.
  cumulative: >
    With `CD-PL-F175` this morning, that is **TWO partial measurements by this seat in one session,
    both caught before entering a binding record.** `CD-PL-F170`'s pattern is not a past-tense
    problem and it is not confined to Engineer seats. **THE HABIT THAT CAUGHT BOTH WAS THE SAME:
    WHEN A MEASUREMENT CONTRADICTS A SEAT THAT HAS BEEN ACCURATE ALL DAY, SUSPECT THE MEASUREMENT
    FIRST.**
  observation_not_a_finding: >
    A dell-specific path sitting in an anchor fragment that every service overrides is **dead config
    today and live the moment one override is deleted.** Whether the portability check should refuse
    it is a real question and **this seat does not answer it** — it is put to the re-assurance seat
    as an attack surface rather than dressed up as a defect.

an_open_construction_question_this_seat_states_rather_than_settles:
  what: '**NO `schema_version` BUMP ACCOMPANIED THE NARROWING.** Both contracts still pin `const: "1.1.0"`, set at 16A when `detail_level` was introduced. The seat recorded this as declared limit 1 because `ENVELOPE_SCHEMA_VERSION` sits outside its writable scope, and asked.'
  this_seats_reasoning_offered_for_attack: >
    The schema's own rule is about **WIDENING** — *"widening the allowlist without bumping this is a
    schema edit that fails its own test."* This is a **NARROWING**. And more decisively: **VERSION
    1.1.0 HAS NEVER BEEN EMITTED BY ANYTHING.** `publish_cycle` has zero callers and no envelope has
    ever been published, so narrowing 1.1.0 before its first emission is amending an unreleased
    version, not breaking a released one. **ON THAT READING NO BUMP IS OWED.**
  why_it_is_not_settled_here: >
    **THAT REASONING IS EXACTLY THE KIND THIS PROJECT HAS BEEN WRONG ABOUT BEFORE** — it depends on
    "nothing consumes it yet", which is the same premise that made the `RED` *"not exploitable
    today"*. **IT IS PUT TO THE RE-ASSURANCE SEAT AS AN EXPLICIT ATTACK TARGET RATHER THAN RECORDED
    AS A DECISION.** The seat was right to stop at its scope boundary and ask.

