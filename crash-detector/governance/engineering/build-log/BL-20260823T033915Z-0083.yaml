PBG_ASSURE_001__THE_AUDITOR_RUNS_IT_FROM_AN_EXTRACTION_IT_MADE_ITSELF:
  why_this_is_not_a_formality: >
    ITEM 1 put the findings register in `governance/findings/` and made the sweep resolve it by
    walking THREE DIRECTORIES UP from its own `__file__`. **THAT IS EXACTLY THE KIND OF PATH THAT
    WORKS IN A WORKTREE AND NOWHERE ELSE**, and *"if it only works in the worktree, it is not an
    instrument, it is a local habit."*
  the_exact_commands: |
    $ git rev-parse HEAD
    8e6ed725bc2650b0de550dee81bae04305b2b0c7
    $ git cat-file -t 8e6ed725bc2650b0de550dee81bae04305b2b0c7
    commit
    $ git archive 8e6ed725bc2650b0de550dee81bae04305b2b0c7 | tar -x -C /tmp/cd-eng04-extract
    $ cd /tmp/cd-eng04-extract
    $ env -i PATH=/usr/bin:/bin HOME=/tmp python3 -B tools/sweep/delegated_judgement_sweep.py --root .
  the_result: |
    EXIT 0
        DEFECT_OPEN              10 |    0  (EXTENDED)
        MODULES DERIVED           2       ['crash_detector.admission', 'crash_detector.establishment']
        THE FINDINGS REGISTER (findings-register.json): 4 rows — OPEN 4, CLOSED 0, SUPERSEDED 0.
    CD-CLASS-2-SWEEP: PASS — 534 sites enumerated over 19 modules ...
  what_env_i_buys: >
    **`env -i` REMOVES EVERY INHERITED VARIABLE, INCLUDING ANY `PYTHONPATH` THIS SEAT HAD SET.**
    Without it the arm would prove that the tool works in an environment the seat prepared, which
    is the thing the standard exists to stop.
  and_the_arm_that_shows_the_resolution_can_FAIL_from_an_extraction_too: >
    `tests/test_findings_register.py::test_an_ABSENT_register_REFUSES_rather_than_crashing_the_run`
    deletes the register from a throwaway tree: `FINDINGS_REGISTER_ABSENT`, EXIT 1, and the run
    still completes and prints. The path is load-bearing in BOTH directions.

