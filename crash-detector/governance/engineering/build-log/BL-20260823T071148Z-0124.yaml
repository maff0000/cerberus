action_summary: >
  *** **PO-DECISIONS-0016 RULING 1 IS DISCHARGED IN BOTH HALVES, AND THE SECOND HALF FOUND
  SOMETHING ON ITS FIRST RUN.** *** Ruling 1(a): the PO-AUTHORED lane-authority header is carried
  onto the lane's `BLUEPRINT.md` at `753efe4`, **VERBATIM PROVED BY MD5 AND NOT BY EYE** — the bytes
  were EXTRACTED from the Product Owner's own committed file by byte-slice and never retyped, and
  `sed -n '11,13p' governance/decisions/PO-DECISIONS-0016.md | md5sum` and
  `sed -n '21,23p' BLUEPRINT.md | md5sum` both return `bff5b7ec298163fa9bc0aff2e3684dc8`.
  **PURELY ADDITIVE: `4 0 BLUEPRINT.md`.** ***
  *** Ruling 1(b): **THE BOUNDARY GOVERNANCE-CITATION MEASUREMENT EXISTS AS AN INSTRUMENT AND NOT AS
  A PROMISE** — `tools/reconciliation/check_lane_governance_citations.py`, the first file under
  `tools/` on `main`. **AT THIS BOUNDARY IT EXITS 1 AND THAT IS ITS DECLARED STATE, NOT A
  REGRESSION.** 130 distinct citations · 2,101 occurrences · 318 lane files scanned of 497 ·
  **127 RESOLVED against `main@957ddc3` · 1 resolved ON THE LANE by CD-D-132 and counted separately
  · 2 UNRESOLVED**, both in one lane file this seat may not touch. ***
  *** **AND THE 29-vs-34 DISCREPANCY IS RESOLVED IN THE ONLY DIRECTION THE EVIDENCE ALLOWS: NEITHER
  NUMBER IS ADOPTED, BECAUSE `F-06-B`'s FIGURES CANNOT BE REPRODUCED AT ALL.** Both of them sit
  strictly BETWEEN this instrument's two readings — `BP-AMENDMENT-0001` 29 < **34** < 36,
  `CD-BP-003` 21 < **23** < 28 — so each was taken under a PARTIAL exclusion of `governance/` that
  the verdict's own stated exclusion set ("excluding BLUEPRINT.md and governance/") does not
  describe. **THE CAUSE IS CD-RULE-009 AND THE RULE BINDS ASSURANCE SEATS TOO: F-06-B PUBLISHED TWO
  COUNTS WITH NO PRODUCING COMMAND, AND A COUNT WITH NO COMMAND CANNOT BE RECOMPUTED.** Recorded as
  UNRESOLVED-BY-RECONSTRUCTION and NOT smoothed into agreement (CD-RULE-009). ***
  *** **NOTHING ELSE MOVES. THE PHASE STAYS `GATE`.** No increment is dispatched here, no
  disposition written, no `src/` line opened, no finding closed. T2 RED; CD-AC-002 and CD-AC-005
  AMBER and NOT CLOSED; `CD-RT-012` RED at the tip; the WO-2 gate SHUT. ***

what_authorised_a_project_lead_to_write_in_the_lane_s_BLUEPRINT_at_all: >
  **`BLUEPRINT.md` IS PROTECTED FROM EVERY SEAT INCLUDING THIS ONE — THAT IS CD-D-115, AND CD-D-115
  IS THIS SEAT'S OWN PRECEDENT AGAINST ITSELF.** The authority for this commit is one sentence of
  PO-DECISIONS-0016 ruling 1(a) and nothing else: *"the lane's `BLUEPRINT.md` gains this PO-AUTHORED
  header, carried verbatim by the Project Lead at the next boundary (CD-D-115's precedent inverted —
  I author, the seat carries the exact bytes)."*
  **SO THE VERBATIM CLAIM IS THE WHOLE OF THE COMPLIANCE, AND A SEAT ASSERTING "I COPIED IT
  CORRECTLY" IS EXACTLY THE KIND OF CLAIM THIS PROJECT DOES NOT ACCEPT FROM ANYBODY.** It is
  therefore not asserted. The bytes were read out of the Product Owner's committed file
  programmatically and inserted programmatically, with `assert` on the first and last bytes, and the
  two md5s above are the evidence. **HAD THIS SEAT RETYPED THEM, THE MD5s WOULD BE THE CONTROL THAT
  CAUGHT IT.**

ruling_1a_what_it_fixes_and_what_it_pointedly_does_not: >
  **IT DOES NOT PUT THE AUTHORITY IN THE LANE AND MUST NOT BE READ AS DOING SO.** `F-06-B` measured
  two distinct harms: (i) main's `BLUEPRINT.md` commit is not an ancestor of the lane, so the lane
  does not carry its own governing authority; (ii) `BLUEPRINT.md` is not ABSENT from the lane, it is
  PRESENT AT A STALE VERSION — *"which is worse, because a reader following `CLAUDE.md`'s documented
  manual boot path reads it and concludes CD-BP-003 does not exist."*
  **THE HEADER CLOSES (ii) AND ONLY (ii).** A reader now hits "NOT AUTHORITY" before the stale
  version number. **(i) IS NOT CLOSED BY A SENTENCE AND THE PRODUCT OWNER DID NOT PRETEND IT WAS —
  THAT IS WHAT RULING 1(b) IS FOR**, and the fact that 1(b) is an INSTRUMENT and 1(a) is a SENTENCE
  is the whole architecture of the ruling.

the_instrument_ruling_1b_ordered:
  path: 'tools/reconciliation/check_lane_governance_citations.py'
  and_it_is_the_first_file_under_tools_on_main: >
    Every governed instrument on this project until now has lived on the LANE, because every one of
    them is about the product. **THIS ONE IS ABOUT THE RECONCILIATION BOUNDARY ITSELF AND MUST RUN
    ON `main`, READING `main`** — putting it on the lane would make the lane the judge of whether
    the lane's citations resolve, which is the shape `PBG-EVID-001` calls SELF_VOUCHING.
  what_it_asserts: >
    For a lane SHA and a main SHA, **every governance citation appearing in a lane file RESOLVES
    against main at that SHA.** PATH form (`governance/...`, `pbg/...`, `BLUEPRINT.md`, `PID.md`)
    resolves by `git cat-file -e <main-sha>:<path>`. IDENTIFIER form (`CD-BP-003`,
    `BP-AMENDMENT-0001`, `PO-DECISIONS-0016`, `CD-D-166`, `CD-RULE-007`, `PBG-SOD-001` and their
    families) resolves by occurring at least once inside main's AUTHORITY SURFACE — `governance/`,
    `BLUEPRINT.md`, `PID.md`, `pbg/`.
  the_command_CD_RULE_009: >
    `python3 -B tools/reconciliation/check_lane_governance_citations.py --lane-sha 753efe4
    --main-sha 957ddc3 --discrepancy`
  the_measurement_at_this_boundary: >
    **EXIT 1.** lane files 497 · EXCLUDED by the printed exclusion set 179 · **SCANNED 318** · of
    those CITING at least once **229** · DISTINCT citations **130** (23 PATH, 107 IDENTIFIER) ·
    TOTAL OCCURRENCES **2,101** · **RESOLVED against `main@957ddc3` 127** · **RESOLVED ON THE LANE
    by CD-D-132 1** · **UNRESOLVED 2**.
  what_RESOLVES_deliberately_does_NOT_mean: >
    **EXISTENCE, NEVER AGREEMENT.** It proves `main` CARRIES each cited authority. It does NOT prove
    the lane USES any of them the way `main` DEFINES them. A lane file citing `CD-BP-003` for a
    proposition `CD-BP-003` does not contain passes this instrument cleanly. That residue is written
    into the artefact as **"NOT PROVED TO BE CARRIED ANYWHERE"** (CD-RULE-006) rather than
    hand-waved at some other layer, because no instrument on this project reads a citation for
    MEANING and this one does not become the first by being read hopefully.

the_second_resolution_class_and_why_it_is_not_a_hole: >
  **CD-D-132 SPLITS THE BUILD-LOG BLOCKS ON PURPOSE — main 0100-0199, the lane 0060-0099** — so a
  lane file citing a lane build-log entry cites something `main` CORRECTLY does not carry. On the
  instrument's first run that arrived as a VIOLATION
  (`BL-20260823T033433Z-0082.yaml`, cited from `variants/WO-2R3/MANIFEST.md:481`).
  **REPORTING A BY-DESIGN SPLIT AS A VIOLATION WOULD TRAIN A READER TO IGNORE THIS INSTRUMENT, WHICH
  IS WORSE THAN NOT HAVING IT.** So the entry is STILL ASSERTED — against the LANE — and the class
  is COUNTED AND PRINTED SEPARATELY and is NEVER folded into the main count.
  **AND THE ONE THING IT MUST NOT BECOME IS SOMEWHERE TO PUT A CITATION THAT IS FAILING, SO THAT IS
  THE THING THAT WAS MEASURED** — see ARM 2 and ARM 3 below.

the_counterfactual_arms_CD_D_079_AND_THE_REASON_THERE_ARE_FOUR: >
  **THE BASE ARM ALREADY EXITS 1, SO THE EXIT CODE CARRIES NO INFORMATION AND THE CONTRAST IS READ
  FROM THE VIOLATION LIST AND THE COUNTS.** That is the `CD-ENG-WO2R3-F12` standard applied to this
  seat's own instrument: *"two arms that both exit 1 for DIFFERENT reasons look identical in a
  summary table and prove nothing"* — this project's most repeated measurement defect, and the one
  that bit the increment-7 Engineer twice. All four arms ran on a **THROWAWAY `git archive`
  EXTRACTION** at `/tmp/cit-arm`, never on the lane worktree.
