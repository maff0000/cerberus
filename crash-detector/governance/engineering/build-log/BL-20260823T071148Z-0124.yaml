findings_raised_by_the_project_lead_at_this_boundary:
- id: CD-PL-F114
  severity: LOW
  against: 'the tree — `tools/register/check_dockerignore.py`, a governed instrument on the lane'
  statement: >
    **A GOVERNED INSTRUMENT''S DATA TABLE MIXES REAL REPOSITORY PATHS WITH INVENTED EXEMPLARS AND
    NOTHING MARKS WHICH IS WHICH.** Line 78 carries `("pbg/controls/PBG-SEC-002.yaml", "a control
    definition")` in a table whose neighbouring rows are
    `governance/engineering/build-log/BL-20260818T175100Z-0001.yaml` and `pbg/manifest.yaml` —
    **both real**. `pbg/controls/PBG-SEC-002.yaml` is not: MEASURED with
    `git log --all --diff-filter=A -- 'pbg/controls/PBG-*'` -> **EMPTY. The path has never existed
    in any commit on any ref.** The framework groups controls by FAMILY —
    `pbg/controls/sec.yaml`, where `PBG-SEC-002` is a row at `:49`, PL-verified — and has never
    used per-ID files.
  why_it_matters_and_why_it_is_LOW: >
    **LOW BECAUSE IT IS NOT LOAD-BEARING:** the table feeds a pattern matcher, and a path that does
    not exist exercises the matcher identically to one that does, so no verdict of
    `check_dockerignore.py` moves. **RECORDED BECAUSE THE ROW''S OWN RATIONALE — "a control
    definition" — TELLS A READER IT NAMES A REAL CONTROL FILE, AND AN AUDITOR CHECKING THE
    INSTRUMENT''S DATA AGAINST THE FRAMEWORK FINDS A PHANTOM AND HAS TO WORK OUT WHY.** The next row
    (`.venv/.../x.py`) is obviously synthetic and this one is not obviously anything. It is a small
    instance of a large pattern this project already names: **a declaration that reads as stronger
    than what it is.**
  disposition: >
    **DISCLOSED, NOT FIXED. IT IS A LANE FILE AND FIXING IT IS AN ENGINEER''S ACT, NEVER THIS
    SEAT''S** (PBG-AUTH-006). It is NOT added to increment 9 — that increment''s scope is the
    Product Owner''s and was ruled at PO-DECISIONS-0016.2, and a Project Lead widening a
    just-adopted order with its own fresh LOW finding is exactly what CD-D-165 says it may not do.
    **IT GOES INTO THE SEVENTH ASSURANCE SEAT''S BRIEF AS A DISCLOSED, UNFIXED, PL-RAISED FINDING.**
- id: CD-PL-F115
  severity: MEDIUM
  against: '`F-06-B` of the SIXTH ASSURANCE SEAT, on its arithmetic and its method — NOT on its substance'
  statement: >
    **`F-06-B` PUBLISHED TWO COUNTS WITH NO PRODUCING COMMAND AND NEITHER CAN BE REPRODUCED.**
    It states `BP-AMENDMENT-0001 : 96 times across 34 files` and `CD-BP-003 : 86 times across 23
    files`, "excluding BLUEPRINT.md and governance/". Measured at the lane tip with the exclusion
    set APPLIED: **29 files / 87 occurrences** and **21 / 72**. With NO exclusion at all: **36 / 102**
    and **28 / 92**. **BOTH PUBLISHED FIGURES FALL STRICTLY INSIDE THOSE BRACKETS** — 29 < 34 < 36
    and 21 < 23 < 28 — so each was taken under a PARTIAL exclusion of `governance/` (2 files and 5
    files respectively) that the verdict's own stated exclusion set does not describe.
  why_it_matters: >
    **CD-RULE-009 IS SOURCED TO THE PRODUCT AUTHORITY AND IS NON-RELAXABLE BY ANY SEAT, AND IT BINDS
    ASSURANCE SEATS EXACTLY AS IT BINDS ENGINEERS AND THIS ONE.** Its words: *"A fingerprint with no
    command is not evidence and must not be cited as one; the honest alternative is to state no
    fingerprint at all."* Two counts have sat in the record as evidence for a HIGH finding since the
    sixth gate, and the first party to try to recompute them could not.
  what_this_finding_does_NOT_say: >
    ***F-06-B'S SUBSTANCE IS UNTOUCHED AND THIS SEAT AGREES WITH IT.*** The lane really does not
    carry its own governing authority; main's `BLUEPRINT.md` commit really is not an ancestor of the
    lane; `CD-BP-003` really is cited from shipped product source. **THE FINDING IS RIGHT AND ITS
    NUMBERS ARE UNRECOMPUTABLE, AND BOTH OF THOSE ARE TRUE AT ONCE.** It is recorded for the same
    reason `CD-PL-F105` was recorded against `F-06-I`: letting an auditor's own uncited count stand
    inside a finding about uncited claims is the defect surviving inside the finding that names it.
  disposition: >
    **RECORDED, AND NEITHER NUMBER IS ADOPTED.** From this boundary forward there is ONE number per
    identifier, produced by ONE printed command, at a NAMED SHA. The historic figures are left
    exactly as the sixth seat wrote them (PBG-CONT-003) and are marked
    UNRESOLVED-BY-RECONSTRUCTION. **IT GOES INTO THE SEVENTH SEAT'S BRIEF, WHERE THAT SEAT IS FREE
    TO REPRODUCE 34 AND 23 BY A METHOD THIS SEAT DID NOT FIND AND SO REFUTE THIS FINDING.**

