findings:

  CD_PL_F125:
    severity: HIGH
    title: >
      **THE SEVENTH DISPATCH WAS STRUCTURALLY DOOMED BY THE ORDER OF THE SESSION THAT ISSUED IT, AND
      THAT ORDER WAS THIS SEAT'S CHOICE.**
    measured: >
      The operator wrapper runs `timeout 7200` — a HARD two-hour ceiling on the whole Project Lead
      session (`.wo2r3k-runner.sh`, and `.wo2-runner.log` records
      `07:02:27Z wo2r3k attempt 1 starting` / `09:02:28Z wo2r3k attempt 1 exited rc=124`, which is
      7201 seconds and the timeout firing).
      The dispatch's own `issued_utc` is **08:36:55Z**. The boundary commit `0c99628` landed at
      **08:48:09Z**. The seat's first measurable activity is at **08:51Z**. The kill was at
      **09:02:28Z**.
    the_finding: >
      **THE PROJECT LEAD SPENT 1h46m OF A 2h BUDGET ON ITS OWN BOUNDARY PROSE AND LEFT ELEVEN
      MINUTES FOR THE AUDIT THAT THE BOUNDARY EXISTED TO COMMISSION.** 88 per cent of the session's
      only scarce resource went to the record of the work rather than to the work. The seat did not
      fail, was not slow, and returned nothing for a reason that had nothing to do with the tree it
      was reading. **A DISPATCH ISSUED WITH ELEVEN MINUTES LEFT ON THE CLOCK IS NOT A DISPATCH, IT
      IS A GESTURE**, and this seat issued it while writing at length about the discipline of
      measuring things.
    remedy_APPLIED_NOT_PROMISED: >
      **THE SEAT WENT OUT FIRST AT THIS BOUNDARY — BEFORE THIS ENTRY WAS WRITTEN, NOT AFTER IT.**
      Instance 2 was launched at **09:17Z**, roughly six minutes into the session, against a
      ceiling at 11:11:32Z. That is the fix applied in the only form that counts. **CD-PL-F111'S
      LESSON IS THE GOVERNING PRECEDENT HERE: A FINDING WRITTEN AS PROSE IS NOT A CONTROL.** This
      one is therefore recorded as a fact about an act already taken, and the ordering is now on the
      record as the expected shape of every future dispatch boundary.
    what_would_discharge_it: >
      **NOTHING WRITTEN. A CARRIER.** Nothing in the repository knows the wrapper ceiling exists,
      and a resumed Project Lead learns it only by reading a runner script that is UNTRACKED
      RESIDUE (CD-PL-F101) and could be deleted at any time. **THE ONE PIECE OF OPERATIONAL
      KNOWLEDGE THAT DETERMINED WHETHER THIS GATE PROGRESSED IS HELD IN A FILE THAT IS NOT PROJECT
      STATE.** Goes on the meta-assurance docket beside F102, F111, F112, F113 and F119-F122.

  CD_PL_F126:
    severity: MEDIUM
    title: >
      **THE RECORD CANNOT DISTINGUISH "DISPATCHED AND NEVER LAUNCHED" FROM "LAUNCHED AND LOST", AND
      THE ONLY THING THAT SETTLED IT HERE WAS A GITIGNORED DIRECTORY.**
    measured: >
      `CD-DISPATCH-WO2R3-ASSURANCE-07.yaml` reads `status: ISSUED` and has never moved. BL-...-0127
      says **"DISPATCHED AND OUT"**. Neither records a launch time, a heartbeat, or any artefact of
