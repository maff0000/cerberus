      `.pytest_cache/`, which **is gitignored and therefore invisible to every porcelain check this
      project runs at a boundary.**
    the_finding: >
      Had the seat been killed three minutes earlier — before it ran a test — this reconciliation
      would have had **NO EVIDENCE WHATSOEVER** that it was ever launched, and the honest reading
      and the wrong reading would have been indistinguishable. **A CONTINUITY MODEL THAT DEPENDS ON
      A PYTEST CACHE SURVIVING IS NOT A CONTINUITY MODEL.** This is the same class as CD-PL-F112:
      a window in which the record and the world disagree and no instrument looks.
    not_remedied_here: >
      A dispatch-lifecycle field (`ISSUED -> LAUNCHED@utc -> RETURNED`) written by the Project Lead
