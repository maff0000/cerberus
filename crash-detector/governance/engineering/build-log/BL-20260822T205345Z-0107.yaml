action_summary: >
  *** **THE FOURTH GATE IS NOW **RED**. CD-ASR-WO2R3-01 GRADED ITS OWN LATE-RETURNING EVIDENCE AND
  MOVED ITS OVERALL VERDICT FROM AMBER TO RED — ON A MEASUREMENT IT RAN ITSELF, AGAINST A SENTENCE
  IT HAD WRITTEN ITSELF.** ***
  T2 (CD-BP-003) moves **AMBER -> RED**. **CD-AC-002 AND CD-AC-005 GRADES DO NOT MOVE — BOTH REMAIN
  AMBER, NOT CLOSED**, with CD-AC-005's reasoning materially weakened. The supplement is banked
  verbatim BESIDE the verdict and `VERDICT.md` IS NOT EDITED (CD-D-143, PBG-CONT-003).
  **THE SEAT RETRACTED ITS OWN LOAD-BEARING SENTENCE IN TERMS:** its AMBER rested on *"This is not a
  RED: I found no mechanism defect… Every finding is about the scope of the class and the integrity
  of the evidence, not about whether the machinery works. It does."* **"That sentence is now false,
  and I am the party who has to say so."** ESCAPE 1 is a correctness defect in the shipped ingestion
  path with a demonstrated two-line counterfactual fix, and it is neither scoping nor evidence
  integrity. **AND IT SAID WHY IT WOULD NOT LEAVE THE AMBER STANDING: doing so "would be exactly the
  'control scoped narrower than the class it names' failure this project keeps finding — committed
  by its auditor."**
  *** **THE SEAT ALSO SUPERSEDED ITS OWN F-A2 WITH SOMETHING BROADER, AND THE PROJECT LEAD RE-RAN IT
  RATHER THAN TAKE IT.** *** F-A2 needed a NEW PACKAGE to escape and named RULE A's package
  vocabulary as the limit. **PACKAGES WERE NEVER THE LIMIT. THE LIMIT IS THE AST WALK.**
  PL-MEASURED at `531c95c`: a public frozen fielded dataclass nested ONE CLASS LEVEL inside
  `src/crash_detector/engine/config.py` — **AN ALREADY-GOVERNED FILE IN A RULE A JUDGEMENT-PATH
  PACKAGE** — gives **POPULATION UNCHANGED AT 33, constructor EXIT 0 "PASS — 97 assertions, 0
  violations", doors EXIT 0**, and at runtime `Judgement.Verdict(score=object(), breached='maybe')`
  **ACCEPTED**. No new package, no new module, no rename — **ONE INDENTATION LEVEL.**
  **ROOT CAUSE PL-CONFIRMED BY READING THE SOURCE:** `check_constructor_field_establishment.py`
  enumerates `for node in tree.body` at **591, 601 and 622**, and `check_judgement_path_doors.py` at
  **659** — TOP LEVEL ONLY. `ast.walk` appears only for reach resolution and decorator inspection
  (472, 406, 521, 401). **BOTH GOVERNING INSTRUMENTS SHARE ONE BLIND SPOT AND NEITHER DECLARES IT.**
  *** **AND THE SEAT TOLD THE PROJECT LEAD THAT ITS SELF-FINDING WAS TOO GENEROUS — TO THE WRONG
  PARTY. IT IS RECORDED AS THE SEAT FRAMED IT AND NOT AS THIS SEAT WOULD PREFER IT.** ***

