findings_raised_by_the_project_lead_at_this_boundary:
- id: CD-PL-F96
  severity: MEDIUM
  title: >
    **THE `--why` LEDGER PRINTS A REASSURING LINE ABOUT THE OUTER CLASS WHILE THE GOVERNED-SHAPED
    TYPE INSIDE IT IS NEVER EXAMINED — SO THE LEDGER READS AS COVERAGE EXACTLY WHERE THERE IS NONE.**
  what: >
    The instrument's note offers this reassurance: *"a class that was not looked at is printed OUT
    under `--why` with the clause that excluded it, OR IS NOT AMONG THE 99 EXAMINED AT ALL."* The
    auditor located the escape in that second disjunct. **PL-MEASURED, IT IS WORSE THAN A SILENT
    OMISSION:** with the nested type present, `--why` prints
    `OUT  engine/config.py:379 Judgement — clause (2): not declared @dataclass(frozen=True).` — a
    line about the CONTAINER, with a specific and correct-sounding reason — **AND PRINTS NOTHING
    WHATEVER ABOUT THE FROZEN FIELDED `Verdict` INSIDE IT.**
  direction_of_error: >
    **TOWARD FALSE ASSURANCE, WHICH IS THE WORST DIRECTION A LEDGER CAN FAIL IN.** A reader auditing
    the ledger for `engine/config.py` sees the file represented, sees a class at that location
    adjudicated with a reason, and has no signal that a governed-shaped type one line further in was
    never a candidate. **AN ABSENCE WOULD HAVE BEEN MORE HONEST THAN THE LINE THAT IS THERE.**
  why_it_is_separate_from_the_auditors_finding: >
    The auditor found the ENUMERATION blind spot. This is about the LEDGER that exists to make the
    enumeration auditable, and which is the instrument's own answer to "how would you know?" The
    remedy the auditor proposes — walk with `ast.walk` and **assert the count of classes examined** —
    fixes both, and the second half of it is the part that would have surfaced this.
  disposition: 'RAISED, NOT REMEDIED. It travels with the RED to the Product Owner.'

- id: CD-PL-F94
  status: >
    **AMENDED AT THIS BOUNDARY ON THE AUDITOR'S CHALLENGE. THE AMENDMENT IS RECORDED AS THE AUDITOR
    FRAMED IT AND NOT AS THIS SEAT WOULD PREFER IT.**
  what_the_auditor_said_when_asked_whether_the_self_correction_was_too_generous: >
    **"In one specific respect it is, and it is generous to the wrong party — it is too hard on the
    Project Lead and too easy on the instrument."** CD-PL-F94 framed the defect as a READING failure
    by the Project Lead. It was **ALSO A STEERING FAILURE BY THE ARTEFACT**: the instrument's
    DECLARED LIMIT 2 names RULE A's package list as the vocabulary, and
    `V16-new-package-undecorated-door.patch` exists to demonstrate THAT axis — so **EVERY PARTY, the
    Engineer, the Project Lead, the Product Owner and the auditor in its own VERDICT.md §3, asked
    "what if it is in a different PACKAGE?"** The answer is that packages were never the limit.
    **"A declared limit pointed four parties at the narrower of two axes, and nobody tested the axis
    it did not name."** And: **"I would not accept a correction that leaves the declared limit's
    wording standing as sound."**
  the_project_leads_response: >
    **ACCEPTED IN FULL, AND THE AMENDMENT IS NOT A SOFTENING OF THE SELF-FINDING.** Everything
    CD-PL-F94 charges this seat with remains charged: it did accept a code-path contrast as a class
    closure, and it did write a question into the auditor's brief that it never put to itself.
    **WHAT IS ADDED IS A SECOND DEFENDANT THIS SEAT LET OFF** — the declared limit whose wording
    made the narrower axis the obvious one to test. A self-finding that absorbs all the blame and
    leaves a defective artefact reading as sound is not a more honest finding; it is a less useful
    one, and it protects the wrong thing.
  and_the_count_the_auditor_puts_on_the_pattern: >
    **NINTH INSTANCE, by the auditor's count — three of them inside increment 5, and one of them in
    the instrument that defines the class for this gate.** This seat had recorded the pattern as
    four deep at the preceding boundary. **IT DID NOT KNOW THE COUNT AND SHOULD NOT HAVE IMPLIED IT
    WAS BOUNDED.**

