decisions_ruled_here:
- id: CD-D-135
  decision: >
    **WO-2R3 INCREMENT 5 IS RECONCILED AND ACCEPTED AS INCREMENT 5 AT LANE `46adf33`. THE CLASS IS
    ACCEPTED AS *CLOSED IN PART*, WHICH IS THE SEAT'S OWN CHARACTERISATION AND IS THE HONEST ONE.**
    The body-borne field-establishment class is closed as a CLASS — enumerated at 32 by an instrument
    that ran before the mechanism existed, derived from `dataclasses.fields(cls)`, applied at the
    class boundary, refusing in both directions, with a new field arriving REFUSED on every
    construction. Four things are declared open and each has an executable example.
  what_this_acceptance_is_NOT: >
    **IT IS NOT ACCEPTANCE AS CLOSING CD-AC-002 OR CD-AC-005**, which is the fourth Assurance seat's
    grading and which the Product Owner has now reserved for the SIXTH boundary running
    (PO-DECISIONS-0009 ruling 5). **RECONCILIATION IS NOT ACCEPTANCE; ACCEPTANCE IS NOT ASSURANCE.**
    It is also not a finding that the instrument's definition is correct — that definition is the
    fourth seat's named target (4) and this seat has not adjudicated it.
- id: CD-D-136
  decision: >
    **THE FOUR DECLARED-OPEN RESIDUES OF INCREMENT 5 ARE CARRIED, NOT DISPATCHED, AND JOIN THE FOURTH
    ASSURANCE SEAT'S READING LIST:** (1) cross-field relations remain body-borne (F18, V36, "NOT
    PROVED TO BE CARRIED ANYWHERE"); (2) the ADJACENT set (F17, CD-D-134 below); (3) the
    `__closure__` interpreter route (V37 ARM 4, the same CPython-level limit as increment 3's
    DECLARED LIMIT 6, PL-confirmed ESCAPED); (4) the subclass route (F19, widened to its measured
    reach). **NONE IS DISPATCHED HERE.** Increment 5 delivered its bounds; opening a sixth increment
    on residues an independent seat has not yet examined would repeat the pattern PO-DECISIONS-0009
    ruling 1 rejected — the implementer answering before the auditor asks.

open_decision_put_to_the_product_authority_and_not_answered_here:
- id: CD-D-134
  question: >
    **DOES THE RULED CLASS READ "BODY-BORNE" OR "BODY-BORNE *OR ABSENT*"?** A frozen public
    judgement-path type with NO `__post_init__` has field establishment that is ABSENT, not
    body-borne, so it falls OUTSIDE the class PO-DECISIONS-0007 ruling 1 created and outside the
    re-base at PO-DECISIONS-0008 ruling 2. The instrument therefore NAMES such a type rather than
    requiring it to be declared.
  the_facts_all_PL_MEASURED: >
    Exactly ONE such type exists today: `observations.py:170 Empty`, and `dataclasses.fields(Empty)`
    returns **`[]`** — **so NOTHING IS UNGUARDED NOW, because a type with no fields has nothing to
    establish.** The instrument prints the adjacent set, names its member, and labels it **"and this
    is a real hole"** in its own output — it is disclosed, not hidden. **THE EXPOSURE IS PROSPECTIVE:
    a NEW frozen public judgement-path type that simply omits `__post_init__` would be outside the
    ruled class and would arrive unguarded.**
  the_options: >
    **(A) WIDEN THE CLASS to "body-borne OR absent".** The seat estimates a one-clause change to the
    instrument plus one decorator, and 32 -> 33. It removes a prospective hole in the definition
    rather than in the code. **(B) LEAVE IT AS RULED**, declared, with the adjacent set printed every
    run — on the ground that a type with no fields is not a judgement risk and that widening a ruled
    class to cover a hypothetical is how scope grows. **(C) HAND IT TO THE FOURTH ASSURANCE SEAT**
