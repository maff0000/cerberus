pl_variant_plants:
  why: >
    A check that exits 0 on a clean tree has proved nothing. The Project Lead planted its OWN
    violations — not the seat's 86 variants, and not the plants B3 will deliver — because a guard
    is only evidence if it bites something its author did not choose.
  results:
  - 'PL-V1 numeric default via `cfg.get("threshold", 0.0)` in src/crash_detector/engine/config.py —
    CAUGHT, exit 1, naming the file, the line, the expression, and WHY: "the lookup failing is
    absence; this makes absence a number". That is a diagnostic an auditor can act on.'
  - 'PL-V2 engine reaching witness by a FUNCTION-LOCAL import (not a module-level one) — CAUGHT,
    exit 1. The import graph is not fooled by import placement.'
  - 'PL-V3 an execution interface named `submit_instruction(symbol, qty, side)` — ESCAPED, exit 0.
    See CD-PL-F32.'
  boundary_characterised: >
    Six further variants were run against check_no_execution_interface.py to find the edge, rather
    than reporting one escape and stopping. CAUGHT: `place_order` (the dispatch-named plant);
    `send_ticket(sym, qty, side, limit_price)` with a buy/sell/venue docstring; `class OrderRouter`
    with a `route` method; a literal broker endpoint constant. ESCAPED: `submit_instruction(symbol,
    qty, side)` both WITH and WITHOUT the docstring "Route an order to the broker for execution."

findings_raised:
- id: CD-PL-F32
  severity: 'HIGH — gate-relevant. Must close before Assurance is dispatched.'
  found_by: PROJECT_LEAD_SEAT_01
  where: 'tools/register/check_no_execution_interface.py and tools/register/_broker_vocabulary.py'
  what: >
    The check misses a class of execution interface, not merely an instance. Two distinct gaps,
    established by the variant boundary above.
    (a) VOCABULARY. "instruction" and "submit" are not in the execution vocabulary, so
    `submit_instruction(symbol, qty, side)` — an order-entry signature in all but name — passes. The
    vocabulary is drawn from how a broker SDK names things, not from how a person avoiding a
    checker would name things.
    (b) PROSE IS NOT READ. The identical function WITH the docstring "Route an order to the broker
    for execution" also passes, and passes identically to the version with no docstring at all — so
    the check reads identifiers and ignores prose. A function whose name is neutral but whose own
    documentation says in plain English that it routes orders to a broker is an execution interface
    by the product's definition, and this check cannot see it.
  why_it_matters: >
    CD-AC-012 is one of the FIVE criteria the WO-2 gate turns on, and the dispatch instructs
    Assurance to hunt exactly this: "a guard that catches only the exact planted instance and not
    its class is a defect Assurance is instructed to hunt". An auditor planting its own variant — as
    its dispatch requires, at least one per criterion — has a live chance of landing on this, and
    would be right to fail the gate.
    This is the Engineer's own risk CD-ENG-R5 coming true. That seat wrote, unprompted: "every check
    was written by the seat whose work it guards. Two of ten were shown to pass a real violation
    first time; Assurance should assume a third exists." A third did exist, and the first independent
    probe found it. The seat's self-assessment was accurate and its honesty is what made this cheap
    to find — that is the disclosure working exactly as intended, not a failure of the seat.
  disposition: 'ASSIGNED to Engineer CD-ENG-WO2-01 instance 5 as a NAMED PREREQUISITE of increment 5.'
  how_it_must_be_fixed: >
    NOT by adding "instruction" and "submit" to a word list. That would fix the instance and leave
    the class, which is the very defect being reported. The check must reason about the SHAPE of an
    execution interface — an order-entry signature, a venue/broker destination, a side and a
    quantity — and must read docstrings and comments as well as identifiers. And it must then be
    re-tested against fresh variants nobody has seen, including ones deliberately worded to avoid
    every term in the vocabulary.

findings_dispositioned:
- id: 'CD-ENG-F31 — pbg boot returns RED CONTINUITY_REFERENCE_INVALID'
  ruling: 'NOT REPRODUCED. Not a defect. No action.'
  rationale: >
    Boot at main HEAD e442f6f returns AMBER with blocking_failures [] and
    CONTINUITY_MATCH/RESUME_AMBER, the sole UNAVAILABLE still roadmap_identity. The seat observed
    RED because it ran the Project Lead's boot from the ENGINEER'S LANE WORKTREE, where the
    checked-out governance/engineering/ACTIVE_WORK.yaml is the branch-point copy — updated_utc
    02:54:00Z, last_completed_checkpoint_sha 0047093 — and not the live record on main. Verified by
    reading both copies side by side.
    That staleness is correct and expected: ACTIVE_WORK is the Project Lead's, lives on main, is
    overwritten in place, and is deliberately outside the Engineer's writable_scope. The lane's copy
    catches up when the lane merges. The seat was right to disclose an unexpected RED rather than
    ignore it, and right not to touch a protected path to make it go away.
  note_for_the_record: >
    A seat booting from the mutation lane will keep seeing a stale continuity reference for the rest
    of WO-2. That is an artefact of the worktree layout, not drift. Worth stating in the next
    dispatch so no seat spends time on it again.
- id: 'CD-ENG-F29 — live-store properties from increment 3 with evidence but no standing guard'
  ruling: 'ACKNOWLEDGED. NOT built in WO-2. Owed to the work order that delivers publication.'
  rationale: >
    The four properties — first_published_utc immutability, NaN refusal, the envelope allowlist and
    the witness-panel constraints — were proved live in increment 3 and have no durable check. None
    is a WO-2 GATE criterion: first_published_utc is CD-AC-010, which WO-2 does not deliver; the
    envelope allowlist is CD-AC-002 and already has a standing guard in check_schema_closed; the
    other two support criteria whose WO-2 guards exist and were run. The five criteria the gate
    turns on all have guards.
    The seat was right to refuse to fold them into the grant-matrix check — it wrote that doing so
    "would make its identity unstatable", which is exactly right: a check that asserts several
    unrelated propositions cannot be cited by a register entry as evidence for any one of them.
    Refusing scope creep and disclosing the gap is better engineering than a tidy-looking check.
  disposition: 'Carried as CD-OB-004, owed at WO-3 alongside the publication layer.'
- id: 'CD-ENG-F26 — two int|None / float|None annotations outside the declared dial path'
  ruling: 'ACCEPTED. No action in WO-2.'
  rationale: >
    The check distinguishes the declared dial path from adjacent code and PRINTS the adjacent cases
    as notes on every clean run rather than either failing on them or hiding them. That is the right
    behaviour: the ban is a §7 property of the dial path, and widening it to the whole tree would be
    a Blueprint change, which is not the Engineer's and not a thing to do mid-work-order. The notes
    keep the exceptions visible to every future reader instead of burying them.
- id: 'CD-ENG-F27, CD-ENG-F28, CD-ENG-F30'
  ruling: 'NOTED AND ENDORSED. Fixed by the seat, with the defect and the fix both recorded.'
  rationale: >
    F27 (relative imports mis-anchored, so the engine-to-witness edge was dropped and the graph read
    clean) is the most serious of the three: that check guards the product's most consequential
    separation and would have passed an auditor's plant. F28 let a bare `orders` path segment through
    as English. F30 was a latent block-A defect — the deploy secret sweep read every file under
    deploy/ as UTF-8 and died on a .pyc, so the suite was 8-failed in any working tree and
    904-passed only from a clean checkout. All three were found because the seat tested its checks
    against violations instead of only against a clean tree.

