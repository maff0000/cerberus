decisions_taken_at_this_boundary:
- id: CD-D-156
  title: '**INCREMENT 7 IS RECONCILED AND IS NOT ACCEPTED AS CLOSING CD-AC-002 OR CD-AC-005, AND THE DOORS ROW GOING GREEN CHANGES NO GRADE.**'
  the_question_it_answers: 'The RED row that shut the fifth gate is now green. Does anything close?'
  the_ruling: >
    **NO. NOTHING CLOSES.** T2 remains **RED**, CD-AC-002 and CD-AC-005 remain **AMBER and NOT
    CLOSED**, and the WO-2 gate remains **SHUT**. Increment 7 is RECONCILED — measured, in scope, and
    self-consistent — and it is **NOT ACCEPTED**.
  why: >
    **PBG-AUTH-003 AND PBG-AUTH-006: THE PROJECT LEAD GRADES NOTHING.** A green exit code from an
    instrument the same increment rewrote is the weakest possible evidence that a criterion is now
    right, and this project's own record says **EVERY ESCAPE ON IT PASSED STATIC CHECKERS.** The
    seat's own F11 says the new clause has a real hole in it. **THE GREEN IS A FACT ABOUT THE
    INSTRUMENT, NOT A FACT ABOUT THE PRODUCT, AND ONLY A FRESH AUDITOR CAN TELL THE DIFFERENCE.**
- id: CD-D-157
  title: '**THE ELEVEN CLASS-2 DISPOSITIONS ARE *NOT* WRITTEN AT THIS BOUNDARY, AND THE REASON IS PO-DECISIONS-0013 RULING 3''s OWN SEQUENCE.**'
  the_question_it_answers: >
    CD-D-130's input exists — T8 landed — and the register contract is now implemented. The operator's
    dispatch says to write the eleven on banking. Does the Project Lead write them?
  the_ruling: >
    **NO, AND THIS IS A DELIBERATE STOP RATHER THAN AN OMISSION.** Ruling 3's sequence is *"The
    Project Lead drafts the extended vocabulary (register-contract change, **PO ratifies
    in-increment**); THEN the eleven are written."* **THE RATIFICATION HAS NOT HAPPENED.** All eleven
    are DRAFTED IN FULL at `governance/engineering/CD-PROPOSAL-ELEVEN-DISPOSITIONS.md` so that the
    moment the Product Owner rules, they land in one act and nothing is waiting on this seat.
    **IT IS FILED UNDER `governance/engineering/` AND NOT UNDER `governance/decisions/`
    DELIBERATELY: the decisions directory is the Product Owner's, and a Project Lead draft sitting
    in it could be read as a ruling by the next seat that greps for one.**
  why_this_is_not_the_seat_being_precious_about_process: >
    **THE IMPLEMENTER HAS FORMALLY DISAGREED WITH ONE OF THE THREE DRAFTED WORDS, ON SUBSTANCE, AND
    THAT FACT DID NOT EXIST WHEN THE INSTRUCTION TO WRITE THE ELEVEN WAS GIVEN.** Ratification is
    precisely the act that resolves a live disagreement about the FORM, and ruling 3 exists because
    the Product Owner judged that writing eleven dispositions into a form that does not fit them
    "would be the hand-maintained-summary defect with a signature". **WRITING THEM NOW WOULD BE THIS
    SEAT SUBSTITUTING ITS OWN RATIFICATION FOR THE PRODUCT OWNER'S, ON THE MOST LOAD-BEARING SENTENCE
    IN THE INCREMENT, AND USING ITS OWN DRAFT TO DO IT.**
  how_it_could_be_wrong: >
    If the Product Owner intended ratification to be a formality, this costs a round trip. **THAT IS
    THE CHEAP ERROR. The expensive one is eleven dispositions landing in a contested vocabulary and
    having to be rewritten, which is the exact defect ruling 3 was written to prevent.**
- id: CD-D-158
  title: '**THE SIXTH ASSURANCE SEAT IS *NOT* DISPATCHED AT THIS BOUNDARY, BECAUSE ITS TARGET DOES NOT EXIST YET.**'
  the_question_it_answers: 'Increment 7 has banked. Does the sixth seat go out now?'
  the_ruling: >
    **NO.** PO-DECISIONS-0013 ruling 6's sequence is explicit: *"the vocabulary extension -> the
    eleven dispositions -> the SIXTH assurance gate over the whole."* **THE ELEVEN ARE PART OF THE
    SIXTH SEAT'S TARGET AND THEY DO NOT EXIST.**
  why: >
    Dispatching an auditor at a target that is missing a component the ruling names would spend this
    project's most expensive and least renewable resource on an incomplete tree — **and this record
    already contains one seat that died producing nothing and one gate that was audited a day before
    its own dispatch was issued.** The dispatch is DRAFTED to the point where only the disposition
    evidence is missing.
  how_it_could_be_wrong: >
    If the Product Owner rules that the eleven may follow the audit after all — which is the
    sequencing the FIFTH SEAT ARGUED FOR AND WAS INVITED TO ARGUE — this ordering is wrong and the
    seat should have gone out. **THAT INVITATION IS STILL OPEN AND IS PUT BACK UP AS Q2.**

