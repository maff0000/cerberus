product_authority_questions_raised_at_this_boundary:
  Q1_RATIFY_THE_VOCABULARY_AND_RULE_ON_THE_IMPLEMENTERS_DISAGREEMENT: >
    **PO-DECISIONS-0013 RULING 3 RESERVED RATIFICATION TO THE PRODUCT OWNER AND IT IS OWED NOW.**
    The register contract is implemented, machine-checked and carrier-backed; **the eight-word
    vocabulary is live in the instrument and an unrecognised word is now REJECTED where it was
    silently accepted.** The implementer's verdict on the three drafted words, carried unsoftened:
    **(a) `CARRIER_ONLY` — KEEP UNCHANGED, "the best of the three", and it does NOT collapse into
    `OUT_OF_BOUND`: scope claims cannot be falsified, reachability claims can.**
    **(b) `DEFECT_OPEN` — KEEP, BUT ITS FIELDS RESTATE A FINDING INSTEAD OF REFERENCING ONE** — "the
    hand-maintained-summary defect reintroduced by the fix for it" — and its `finding` field is an
    UNCHECKED STRING **because this project has no findings register to resolve against.** That is a
    real gap and it is bigger than this word.
    **(c) `UPSTREAM_OF_THE_PATH` — THE IMPLEMENTER DISAGREES AND THE PROJECT LEAD FINDS THE
    DISAGREEMENT PERSUASIVE: it binds the MODULE register while the other two bind the SITE register,
    and BOTH its fields are prose that cannot be made machine-checkable.** By the Project Lead's own
    stated constraint — no word may be a synonym for "not looked at", and the instrument must REJECT
    a disposition whose mandatory evidence is absent — **a word whose evidence cannot be checked
    fails the test its own author wrote.**
    **THE PROJECT LEAD DRAFTED IT AND NOW THINKS IT IS PROBABLY WRONG. IT DOES NOT WITHDRAW IT,
    BECAUSE RULING 3 GAVE THE RATIFICATION TO THE PRODUCT OWNER AND A SEAT THAT WITHDRAWS ITS OWN
    DRAFT ON AN IMPLEMENTER'S OBJECTION HAS QUIETLY TAKEN THE RATIFICATION BACK.**
  Q2_AND_THE_SEQUENCING_INVITATION_IS_PUT_BACK_UP_BECAUSE_IT_NOW_HAS_A_PRICE: >
    CD-D-158 holds the sixth seat until the eleven exist, on ruling 6's literal sequence. **BUT THE
    FIFTH SEAT ARGUED — AS THE FIRST SEAT WITH STANDING, HAVING ACTUALLY MEASURED T8 — THAT THE RIGHT
    RULE IS "a deny-by-default instrument's output is READ ITEM BY ITEM at the boundary that creates
    it, and the disposition is written after audit."** If the Product Owner prefers that, the eleven
    wait for the sixth seat and the seat goes out NOW. **THE COST OF THE ORDER AS RULED IS A ROUND
    TRIP; THE COST OF THE OTHER ORDER IS THAT THE AUDITOR GRADES A REGISTER THAT IS NOT THERE. THE
    PROJECT LEAD HAS NO PREFERENCE IT IS ENTITLED TO ACT ON AND STATES NONE.**
  and_one_MEASURED_ITEM_THAT_IS_NOT_A_QUESTION_BUT_SHOULD_NOT_WAIT_FOR_AN_AUDITOR_TO_FIND_IT: >
    **ITEM 1 HALF (b) IS HELD SHUT BY A PRODUCT GAP, NOT BY THE GUARD, AND THERE IS NO CARRIER FOR
    THE DAY THAT GAP CLOSES.** The seat's own words: the post-condition binds NONE of `*extra`
    structurally; nothing in `*extra` changes what the evaluator returns **only because every
    `MappingKind` member raises in `compute`** — a mapping set with no computing member, which is
    CD-D-005's owed ingredient work. **"IT EXPIRES THE DAY A COMPUTING MAPPING LANDS. THERE IS NO
    CARRIER FOR THAT DAY."** A latent defect with no alarm on it is the shape this project has been
    bitten by more than any other. **RAISED HERE SO IT IS ON THE RECORD BEFORE WO-3, AND HANDED TO
    THE SIXTH SEAT AS A NAMED TARGET.**

