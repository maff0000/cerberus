# WO-2R3 INCREMENT 3 COMPLETE — BP-AMENDMENT-0001 §D.3, A6, THE COLLECTOR BOUNDARY, BOTH PARTS.
#
# PART 1: `clock` AND `sleep` ARE NOT STRONGER-CHECKED. THEY ARE DELETED AS PARAMETERS. The run's
# instant is a VALUE, exact-typed and then rebuilt by `ensure_utc`; the waiting is a NAMED MEMBER of
# a closed `DelayKind` executed by the module that owns waiting; and the elapsed span the
# timeout-budget refusal turns on is THIS SYSTEM'S OWN MONOTONIC READING and no longer a callable the
# caller supplied.
#
# PART 2: the four `Protocol`s STAY, and every value they hand back is established AT THE POINT OF
# RETURN. Seven such returns, each with a baseline and a violated arm.
#
# DECLARED LIMIT 3 OF THE STATIC CHECK IS DISCHARGED: `collectors/` is a judgement-path package under
# RULE 1, deny-by-default. What remains open there is NARROWER, is CD-BP-003, and is declared in all
# three CD-RULE-004 places with an executable example that is POSITIVE — an object that IS ADMITTED.
#
# THREE FINDINGS RAISED AGAINST THIS SEAT'S OWN WORK, AND ONE AGAINST THE AMENDMENT THAT DISPATCHED
# IT. NOTHING HERE IS ASSURANCE (PBG-SOD-001, non-waivable).
# ================================================================================================ #

