structural_invariants_as_landed:
  commit_1_of_3: >
    There is no parameter of `crash_detector.collectors.runner.collect` through which a caller can
    supply a callable and have it executed, and no value returned to it by a `SourceAdapter`,
    `ObservationSink`, `ReadingLedger` or `PayloadValidator` is used without its exact type being
    established first.
  commit_2_of_3: >
    Every public callable under src/crash_detector/collectors/ is a subject of
    CD-RT-002-DOORS-REQUIRE-THEIR-TYPES and carries an `admits` declaration whose parameter names are
    exactly its signature's, and the check exits non-zero if any one of them loses it.
  narrowness_is_deliberate: >
    Written narrowly enough to be true (CD-PL-F76). The first says nothing about what four of
    `collect`'s parameters are DECLARED to admit — that is CD-BP-003 and it is a limit, not a
    closure — and nothing about any door outside `collect`. The second says the doors are DECORATED
    and that the check enumerates them; it does not say what they require.

