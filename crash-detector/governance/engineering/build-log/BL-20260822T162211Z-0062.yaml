closed:
  - "PART 1 ENTIRELY. `clock` and `sleep` are not parameters. A callable cannot arrive: there is no
     expression to write. Adding either back is a signature change that `admits` refuses on every
     call (P7), and V31 is the counterfactual — put `sleep` back and a policy declaring 20 seconds of
     backoff runs in 0.0004 s."
  - "`policy` at the door — exact `RetryPolicy`, so a subclass shadowing a field with a property is
     refused. MEASURED OPEN by V28 when the pre-§D.3 `isinstance` is restored."
  - "`started_utc` at the door — exact `datetime`, then REBUILT by `ensure_utc`, so a `datetime`
     subclass overriding `astimezone` or `__rsub__` (ASR2-005-A's shape) is refused twice."
  - "`delay` — exact `DelayKind`. The member set is closed BY THE INTERPRETER: an `Enum` with members
     cannot be subclassed, measured, and a look-alike is refused by exact type at `apply_delay`."
  - "THE SEVEN POINTS OF RETURN of the four Protocols. Enumerated, not sampled; each with a violated
     arm run in a pristine extraction (V27, V29, V30, V32)."
  - "`collectors/` as a judgement-path PACKAGE, deny-by-default within, so a new module there is a
     subject the day it is written. Asserted by BREAKING it, not by reading the tuple."
