findings_raised_against_this_seats_own_work_and_against_its_specification:
  CD-ENG-WO2R3-F08:
    severity: MEDIUM
    against: THE AMENDMENT — BP-AMENDMENT-0001 §D.3 part 1
    finding: >
      §D.3 part 1 says `clock` becomes "an engine-owned instant ALREADY ESTABLISHED BY `ensure_utc`,
      passed as a VALUE". **A SINGLE INSTANT CANNOT MEASURE AN ELAPSED SPAN**, and the runner has a
      judgement that needs one: `FETCH_FAILED(TIMEOUT_BUDGET_EXCEEDED)` — the refusal that makes an
      adapter's declared timeout mean something — is computed from the difference between two clock
      readings. THE AMENDMENT IS SILENT ON WHERE THAT SECOND READING COMES FROM. It is not wrong; it
      is incomplete, and the gap is exactly where the defect lived.
    what_this_seat_did: >
      Resolved it by making the span ENGINE-OWNED: `monotonic_reading`/`seconds_since` in
      `collectors/delay.py`, read from `time.monotonic`, with no parameter through which a caller
      could substitute either. This is STRICTLY STRONGER than the amendment's letter — a caller
      supplies neither the span nor a clock — and it is reported rather than presented as what §D.3
      said, because a seat that reads its own resolution back into its specification has inverted the
      loop.
    consequence_disclosed: >
      Attempt timestamps are now `started_utc + <monotonic span since the run began>` rather than
      readings of a supplied clock. That makes `requested_utc <= observed_utc` true BY CONSTRUCTION
      (the underlying clock is non-decreasing) where it was previously enforced by `AttemptRecord`
      refusing rows that said otherwise. It also means the collector now performs REAL waits and
      REAL elapsed measurement in the test suite: total added wall time measured at ~65 ms across
      the whole suite, and the timeout-budget test is deterministic in the direction that matters
      because `time.sleep(s)` guarantees AT LEAST `s`.
    for_the_project_lead: >
      If the Product Owner or the Project Lead reads §D.3 as requiring the elapsed span to come from
      the passed instant alone, this increment does not implement that reading and cannot: the
      timeout-budget refusal would have to be deleted. Say so and it will be reworked.
  CD-ENG-WO2R3-F09:
    severity: LOW
    against: THIS SEAT'S OWN WORK — the static check
    finding: >
      A6 is reached by RULE 1 ALONE. `collect` returns `CollectionResult`, which is not in
      JUDGEMENT_VALUE_TYPES, so RULE 2 does not reach it. The two rules are unioned "because each
      covers the other's blind spot", and for the door §D.2 lists as A6 that redundancy does not
      exist: remove `collectors` from the package tuple and A6 leaves the subject set entirely.
    why_it_was_not_closed_here: >
      Adding `CollectionResult` to JUDGEMENT_VALUE_TYPES would assert that a collection result IS a
      judgement value. It is not — a collector fetches and records and never computes (BLUEPRINT §5),
      and that type is the boundary between the two halves. Making the check say otherwise to buy a
      redundancy would be inventing a classification to make a guard look stronger. RAISED, NOT
      CLOSED.
