action_summary: >
  INCREMENT 3 DELIVERED IN THREE COMMITS. BP-AMENDMENT-0001 §D.3 is implemented for A6 —
  `collect(adapter, policy, sink, ledger, collector_run_id, clock, sleep, validator)` — BOTH PARTS,
  as the Product Owner ruled it in at PO-DECISIONS-0005 ruling 4 and re-fixed at PO-DECISIONS-0007
  ruling 5.
  PART 1. `clock` and `sleep` are GONE AS PARAMETERS. This is the `combine_within_one_dial(using)`
  repair applied a second time: not a stronger check on a callable, a DELETION of the parameter
  through which code arrived. `clock` is replaced by `started_utc: datetime` — a VALUE, exact-typed
  at the door and then REBUILT by `ensure_utc` from its own primitive fields, so no method of the
  supplied object is ever consulted. `sleep` is replaced by `delay: DelayKind` — a NAME from a closed
  enum with EXACTLY ONE member, executed by a new module `crash_detector.collectors.delay` that owns
  waiting. And the elapsed span the runner's timeout-budget refusal turns on is now taken from
  `monotonic_reading()`/`seconds_since()` in that same module: it used to be the difference between
  two calls to a CALLER-SUPPLIED clock, so a clock that never advanced made every adapter punctual
  and the one guarantee the runner offers about an adapter that ignores its budget evaporated with
  no line of the runner changing.
  PART 2. `adapter`, `sink`, `ledger` and `validator` KEEP their `Protocol`s — the thing on the other
  side is genuinely foreign and exact-typing it against a concrete class is not available and would
  be wrong — and EVERY VALUE THEY RETURN IS ESTABLISHED AT ITS POINT OF RETURN. Seven of them:
  `fetch` -> exactly `FetchedResponse` (was `isinstance`, which admitted a subclass whose `payload`
  is a property); `is_empty` -> exactly `bool`; `validate` -> exactly `None` (the return was
  DISCARDED, so "conforming" meant only "did not raise"); `record` -> exactly `None`;
  `admit_if_absent` -> exactly `bool` (was `bool(...)`, which COERCES, so a truthy answer reported a
  duplicate source period as a first claim); `source_id` and `adapter_id` -> rebuilt by `own_str`,
  after the whole protocol member set is checked.
  `policy` is brought to this project's exact-type standard at the door, which is what §D.3 asks for
  in terms: `isinstance(policy, RetryPolicy)` admitted a subclass shadowing `max_attempts` with a
  property, and V28 shows that subclass driving the runner past a ceiling of 5 to 201 attempts.
  THE STATIC CHECK now treats `collectors/` as a judgement-path package under RULE 1,
  deny-by-default. DECLARED LIMIT 3 — which said the package was deferred BY SCOPE — is DISCHARGED,
  and what stands in its place is CD-BP-003 at its exact extent.

