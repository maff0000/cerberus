action_summary: >
  THE PRODUCT AUTHORITY ANSWERED CD-D-105 AND THE ANSWER IS RECORDED, NOT INTERPRETED.
  governance/decisions/PO-DECISIONS-0007.md landed at 9a81787, authored by Matt Scott and by no
  seat, and ACTIVE_WORK.yaml did not know it existed — the record was last written at
  2026-08-22T15:26:54Z, seventy minutes before the ruling. That gap is closed HERE, by RECORDING the
  ruling in the Project Lead's own record, and NEVER by editing the Product Owner's text
  (governance/decisions/ is protected scope for every seat including this one).

  RULING 1 — CD-D-105 IS ANSWER (A), BOUNDED AND SEQUENCED LAST. §D REACHES CONSTRUCTORS. The
  principle the Product Owner decided it on is §D.1's own: establishment derived from the
  declaration, never written into an editable body. `__post_init__` IS a body. The standing
  condition leans on construction-time refusals three times, and "declining to close it while
  relying on it would be filing the remedy locally — the exact move this estate has now paid for
  three times".
  THE PROJECT LEAD'S ASYMMETRY MEASUREMENT IS ACCEPTED IN TERMS AND IT NARROWS THE WORK: the three
  interpreter-borne refusals (a keyword for a field that does not exist) have NO BODY and are
  OUTSIDE the finding. What is IN scope is the body-borne residue — the `model_ref` resolution
  refusal, §C.5's three `ConfigSnapshot` invariants, and `PanelRow`'s field re-establishment.

  RULING 2 — ANSWER (C) IS ALSO TAKEN, AS A STANDING INVITATION AND NOT AS A SUBSTITUTE. The fourth
  Assurance seat is invited to attack the WHOLE §D scoping INCLUDING THIS CLOSURE, on measured
  grounds. The precedent is PO-DECISIONS-0003 ruling 4, which cost this project an increment and was
  worth it.

  RULING 3 — WHY NOT (B): the deferral's own honest carrier was "NOT PROVED TO BE CARRIED ANYWHERE".
  A residue with no durable carrier fails the durable-visibility obligation this seat holds. (B) lost
  on its own disclosure — which is the seat's disclosure working as intended, against the seat.

  RULING 4 — CD-D-104, CD-D-106 and CD-D-107 STAND AS RULED BY THE PROJECT LEAD. CD-PL-F80 and
  CD-PL-F81 — the two declared limits whose WORDING IS NARROWER THAN THEIR MEASURED ROUTE — are
  REWORDED TO THEIR MEASURED REACH. Documentary, the Project Lead's own, folded into increment 4 or
  the fifth increment, whichever reaches them first. "A limit that undersells its route is a small
  lie in the safe direction, and we do not keep those either."

  RULING 5 — INCREMENT 3 (§D.3 / A6, THE COLLECTOR BOUNDARY) IS DISPATCHED AT 995ec3e, scope fixed by
  PO-DECISIONS-0005 ruling 4, §D.3 accepted AS WRITTEN, both parts, untouched by the CD-D-105 answer.
  THE SEQUENCE IS NOW FIVE INCREMENTS AND THEN THE SEAT: increment 3 -> increment 4 (the remaining
  plants, CD-D-033) -> increment 5 (constructors, this ruling) -> THE FOURTH FRESH ASSURANCE SEAT.

  RULING 6 — REAFFIRMED: acceptance of an increment is NOT assurance of a criterion. CD-AC-002 and
  CD-AC-005 REMAIN UNGRADED until the class is closed and the fourth seat rules. This is the third
  boundary running at which the Product Owner has said so, and the Project Lead has recorded it as a
  standing constraint rather than as a note.

