    F03 — THE FILLER FALLBACK IS THE ONE THING I BUILT THAT NO PRESCRIPTION ASKED FOR, AND AN
    AUDITOR SHOULD ATTACK IT FIRST. Without it, FX5 turns C11 into exit 3 PRECONDITION_NOT_MET
    with NO violation code — the branch would be refused-about rather than REPORTED, and the
