  CONTINUITY_REFERENCE_INVALID — read-only diagnosis permitted, normal boot blocked
  (PBG-CONT-006)`. DIAGNOSED AND NOT REPAIRED (dispatch §8): `git rev-parse
  be0b355:governance/engineering/ACTIVE_WORK.yaml` and `git rev-parse
