  FROM MY OWN EXTRACTIONS AND MY OWN MUTATORS, AND BOTH ARE NOW RED. AND THE DISPATCH CONTAINS A
  FALSE STATEMENT, WHICH IS §8's LAST STOP CONDITION — F01 BELOW. I COMPLETED THE INCREMENT AND
