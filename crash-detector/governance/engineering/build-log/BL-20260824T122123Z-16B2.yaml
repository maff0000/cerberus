  ce0803c3d472fe52541f28965d7995e888329c28, so line 36's `continuity_record_commit: PENDING` is
  byte-for-byte the FROZEN BASE's and nothing in 16B, 16B-FIX or this increment touched it. That
  file is not in my writable scope and I did not open it for writing. FIFTH SEAT TO SAY SO.

  *** WHAT I REPRODUCED BEFORE I WROTE A LINE, BECAUSE A FIX FOR A FINDING I HAD NOT SEEN MYSELF
  WOULD BE A RELAY AND NOT AN ENGINEERING ACT. *** On the 16B-FIX instrument, from four throwaway
  extractions of 64cd5b2: C11 (auditor X2, conditional branch) instrument PASS 144/0, live gate
  ADMITTED on BOTH surfaces WITH the marker and REFUSED on both WITHOUT it (the control — the tree
  is not broken), and EXACTLY ONE of the register's thirty `execute:` lines moved: LINE 2,
  tests/test_detail_level.py, THE MEMORIAL. C12 (X1, the careless precursor) the same, except two
  lines move because check_schema_closed catches the unclosed `else`. C13 (auditor B6,
  `credit_stress` state const NO_DATA) instrument PASS 144/0, gate ADMITTED calm on BOTH surfaces,
  only line 6 moved. C14 (auditor B4 / the PL's reproduction — optional root `feed_liveness`,
  states ["LIVE","STALE"], THE 16C LIVENESS QUANTITY) instrument PASS 144/0, gate ADMITTED
  `{state: STALE, reason: FEED_DEAD, detail_level: 'calm'}` on BOTH surfaces, only line 6 moved.
  AND THE CONTRAST THAT PROVES F2 IS THE VOCABULARY AND NOT THE SHAPE: the byte-identical property
  with its state spelled ["UNKNOWN","STALE"] is FAIL — 2 on the 16B-FIX instrument. EVERY NUMBER
  THE DISPATCH AND THE AUDIT STATE ON THESE FOUR TREES IS TRUE AND I MEASURED IT MYSELF.

  FX5 — `_dial_from_branch` now tests the resolved branch, BEFORE building, for any of
  `if`/`then`/`else`/`allOf`/`anyOf`/`oneOf`/`not`/`dependentSchemas`/`dependentRequired`/
  `unevaluatedProperties` and returns it as UNBUILDABLE, reported as CD-CALM-BRANCHES-006 on
  DECLARED LIMIT 9's own sentence. DENY BY DEFAULT AND NOT AN ENUMERATION — the stronger form is
  RULED OUT and I did not build it. VERIFIED MYSELF that the clean tree's six branches (three per
  surface) declare only type/additionalProperties/required/properties/description, so it costs
  nothing today. ONE CHANGE THE PRESCRIPTION DID NOT NAME AND I MADE DELIBERATELY: the filler dial
  is now the first absent-data branch that actually BUILDS. Without it a conditional UNKNOWN
  branch exits 3 from the filler builder with NO VIOLATION CODE AT ALL — reported nowhere, which
  is not where the prescription says it belongs. It is declared as DECLARED LIMIT 11 and it makes
  DECLARED LIMIT 9's own sentence true for the first time (CD-ASR-WO3-06 F3 limb (a), closed as a
  measured consequence and not as a happy accident — arm C17).

  FX6 — `_dial_bearing` returns None (UNDECIDABLE) and never False for a resolved subschema that
  DECLARES a `state` whose const/enum does not intersect DECLARED_STATES. THE LOOSER, LOUDER FORM
  AS RULED. *** THE DISPATCH'S STOP CONDITION ON THIS DID NOT FIRE, AND I CHECKED IT THREE WAYS
  RATHER THAN ASSUMING: the clean tree is unchanged at PASS — 144 assertions, 0 violations with
