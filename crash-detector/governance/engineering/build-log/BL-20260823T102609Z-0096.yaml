THE_MEASUREMENT_THAT_MATTERS_MOST__AND_IT_FALSIFIES_A_DECLARED_DISPOSITION:
  the_declaration_as_the_register_writes_it: >
    `crash_detector.source_registry::SourceRecord.__post_init__ ISINSTANCE:
    isinstance(self.criticality, Criticality)` -> **[EXACT]** — *"Criticality is an enum.Enum with
    members, which CPython refuses to subclass, so isinstance and exact type coincide here and no
    supplied implementation exists to reach. This is the check that makes the DISPOSABLE
    prohibition mean anything."* And its sibling `SourceRegistry.ids_with` -> **[EXACT]** — *"As
    above — Criticality cannot be subclassed."*
  WHAT_IS_TRUE_MEASURED_AT_686a374: |
      class EvilCrit(Criticality)                -> TypeError: <enum 'EvilCrit'> cannot extend <enum 'Criticality'>
      class Forged:
          @property
          def __class__(self): return Criticality
      isinstance(Forged(), Criticality)          -> True                  <<< the premise fails here
      type(Forged()) is Criticality              -> False
      Forged().value                             -> <<no such attribute>>

      SourceRecord(criticality=Forged())         -> REFUSED FieldNotEstablished  (@establishes carried it)
      registry.ids_with(Forged())                -> ***ADMITTED***, returned ()  <<< NOTHING REFUSED IT
      registry.ids_with(Criticality.REQUIRED)    -> ('s',)                        (control)
      registry.ids_with('REQUIRED')              -> TypeError                     (control)
  the_sentence_that_is_false_and_why: >
    **"CPython REFUSES TO SUBCLASS IT, THEREFORE isinstance AND EXACT TYPE COINCIDE" IS FALSE, AND
    IT IS FALSE FOR EVERY CLASS AND NOT ONLY FOR THIS ONE.** `isinstance` has TWO routes: CPython's
    `object_isinstance` checks `Py_TYPE(inst)` and, failing that, **retrieves the instance's
    `__class__` ATTRIBUTE** — an ordinary property any caller can define. **SUBCLASSING IS NOT THE
    ONLY WAY TO SATISFY `isinstance`, AND THIS PROJECT'S RECORD HAS ONLY EVER NAMED THE ONE.**
  the_judgement_path_consequence: >
    `ids_with` answers *"which sources carry this criticality"*. Handed the forgery it answered
    `()` — **"none"** — with no refusal anywhere. A caller asking which sources are REQUIRED is
    told none, and a required-inputs check over an empty tuple passes VACUOUSLY. Raised as
    **`CD-ENG-WO2R3-08-F02`, and it is a finding against the REGISTER and not only against the
    code.** The register is PROTECTED from this seat and is NOT edited (PO-DECISIONS-0018 r.3).
  the_carrier_now: 'tests/test_exact_type_admission_sweep.py::test_ids_with_refuses_a_worn_criticality_and_this_site_was_a_live_admission — three controls beside the refusal.'

