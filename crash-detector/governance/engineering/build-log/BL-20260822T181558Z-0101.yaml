action_summary: >
  **WO-2R3 INCREMENT 5 IS DISPATCHED. `CD-DISPATCH-WO2R3-INC5-ENGINEER` IS ISSUED AT LANE 4ac159e TO
  CD-ENG-WO2R3-01, UNDER PO-DECISIONS-0009 RULING 2, ON THE BOUNDS OF PO-DECISIONS-0007 RULING 1 AS
  RE-BASED BY PO-DECISIONS-0008 RULING 2.**
  It is a SEPARATE dispatch record and not an edit to CD-DISPATCH-WO2R3-ENGINEER. That record is
  ISSUED and its four increments are delivered; increment 5 did not exist when it was written.
  **AMENDING AN ISSUED DISPATCH TO DESCRIBE WORK ITS AUTHOR NEVER SCOPED WOULD MAKE THE RECORD SAY
  THE PROJECT LEAD PLANNED FIVE INCREMENTS WHEN THE PRODUCT OWNER ORDERED THE FIFTH.** The new record
  stands beside it and inherits everything in it that is not restated.
  **THE ORDER OF WORK IS FIXED IN THE DISPATCH AND IT IS THE MOST IMPORTANT THING IN IT: THE
  INSTRUMENT COMES FIRST, BEFORE ANY MECHANISM EXISTS.** If the mechanism is built first the
  instrument enumerates what the mechanism already covers — a photograph of the seat's own diff,
  which would pass every check in the dispatch while proving nothing. The Product Owner ordered the
  enumeration recorded AT INCREMENT-5 START for exactly this reason (CD-D-119) and the dispatch says
  so in those terms.

