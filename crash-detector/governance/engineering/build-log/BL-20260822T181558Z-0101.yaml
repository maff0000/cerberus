what_the_dispatch_binds_that_a_reader_might_otherwise_miss:
- 'THE INSTRUMENT BEFORE THE MECHANISM, with the reason written out, and with an explicit instruction
   on what to do if the count is uncomfortable: **REPORT IT AND STOP, DO NOT NARROW THE DEFINITION.**
   "A measured class of thirty with twelve closed and eighteen declared" is named as preferable to "a
   definition quietly shaved until the work fits", and TUNING THE INSTRUMENT is written into
   `prohibited` as its own line.'
- '**THE FLOOR IS NOT THE POPULATION**, and the commit contract forces the seat to answer it: if the
   enumerated class turns out to be exactly the five named types, the seat must say WHY the instrument
   found no others — "a floor that happens to equal the population is a finding, not a coincidence".'
- 'THE MECHANISM BOUND IS TRANSCRIBED FROM CD-D-110 AND NOT PARAPHRASED, per the standing obligation
   that a closure quoting its own bounds must transcribe them.'
- '**THE LEGITIMATE BODY WORK THE SEAT MUST NOT BREAK IS NAMED IN ADVANCE:** §C.5''s CROSS-FIELD
   invariants (a resolved spec''s dial_id equalling the dial naming it; its input ids a subset of the
   naming DialSpec''s declared inputs) are NOT establishment of a field from its declaration and
   CANNOT be derived from one. The dispatch tells the seat to decide explicitly what its mechanism
   covers and to declare the residue under CD-RULE-004 with CD-RULE-006''s carrier test applied —
   rather than letting a cross-field invariant ride out of scope because it shared a body with the
   fields.'
- 'THE DATACLASS HAZARDS ARE LISTED — inherited fields, `InitVar`, `default_factory`, `ClassVar`,
   non-init fields, and legitimate DERIVATION in `__post_init__` — **AND ARE EXPLICITLY LABELLED AS
   THE PROJECT LEAD READING THE STANDARD LIBRARY''S SURFACE, NOT AS PROBLEMS ANYONE HAS HIT.** A seat
   must not read that list as exhaustive or as evidence that the route is known to work.'
- '**A HEURISTIC IS PERMITTED AND IS FENCED:** acceptable IF printed, declared as one, and with its
   false-negative direction stated. "A heuristic presented as an enumeration is not."'
- 'THE CLASS-C INTERACTION IS ANTICIPATED RATHER THAN LEFT TO BE DISCOVERED: if the property-based
   enumeration pulls a Class C type into the class, the seat must REPORT AND DECLARE, **not silently
   exclude it to keep the population tidy and not silently include it and widen its own scope.**'
- '**THE ELEVEN CLASS-2 SWEEP DISPOSITIONS ARE WRITTEN INTO `prohibited` AS A PRODUCT AUTHORITY
   RULING**, with (B)''s rejection reasoning carried so the seat can see the fold was considered and
   refused. The sweep''s exit 1 is disclosed IN ADVANCE as DECLARED STATE with the instruction not to
   treat it as the seat''s defect and not to chase its delta.'
- 'THE BUILD LOG BLOCK IS STATED AS A RANGE WITH A CEILING — **0060-0099, continue from 0065, DO NOT
   WRITE 0100 OR ABOVE, and if you reach 0099 STOP AND ESCALATE** — which is CD-D-132 applied at its
   first use.'

the_thing_carried_into_the_dispatch_that_is_not_about_dataclasses:
  what: >
    CD-PL-F89 is written into the dispatch, against the Project Lead and in the Project Lead's own
    words, in the section that gives the seat its numbering block — **and it is framed as the LESSON
    and not as an apology.**
  why_it_belongs_in_an_engineering_dispatch: >
    "A remedy expressed as a ONE-SIDED BOUND does not close a TWO-SIDED class" **IS THE SAME SENTENCE
    AS "an enumeration cannot close a property-defined class", WHICH IS WHAT THIS ENTIRE INCREMENT IS
    ABOUT.** In three consecutive boundaries that sentence has caught the Product Owner's own list of
    four types (CD-D-114), the Project Lead's list-defined reconciliation sweep (CD-PL-F86) and the
    Project Lead's floor-without-a-ceiling numbering rule (CD-PL-F89). The dispatch tells the seat
    plainly: **assume it is about to catch your instrument, and look.**
  and_it_tells_the_seat_the_defect_is_not_its_own: >
    "You stayed inside the block you were given, both times." A dispatch that hands a seat a corrected
    rule without saying who broke the old one invites the seat to assume it did.

decisions_ruled_here:
- id: CD-D-133
  decision: >
    INCREMENT 5 IS DISPATCHED AS A SEPARATE DISPATCH RECORD, `CD-DISPATCH-WO2R3-INC5-ENGINEER`,
    STATUS ISSUED, RATHER THAN AS AN AMENDMENT TO `CD-DISPATCH-WO2R3-ENGINEER`.
  reasoning: >
    The parent is ISSUED and delivered. Increment 5 was created by the Product Owner AFTER it was
    written (PO-DECISIONS-0007 ruling 1), re-based (PO-DECISIONS-0008 ruling 2) and dispatched
    (PO-DECISIONS-0009 ruling 2). Editing the parent would misattribute the scope decision to the
    Project Lead and would make an ISSUED record retroactively describe work its author never
    scoped — the documentary shape of the same defect PBG-CONT-003 forbids in the Build Log.
  what_it_inherits: >
    Everything in the parent not restated: the deleted-subject rule, the exclusion set and its
    "proves nothing about any class" status, the standing condition, the PO standing conditions, and
    the WO-2R3 project rules in force. The new record says so explicitly rather than silently relying
    on it.

