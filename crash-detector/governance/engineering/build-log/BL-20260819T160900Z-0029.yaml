CD-PL-F64:
  severity: MEDIUM
  title: 'ACTIVE_WORK.yaml has been semantically invalid — and `pbg boot` RED — for three checkpoints.'
  what_boot_said: >
    Verdict RED. continuity_state CONTINUITY_SEMANTIC_INVALID/RESUME_BLOCKED. BLOCKING: "continuity
    invalid: CONTINUITY_SEMANTIC_INVALID — read-only diagnosis permitted, normal boot blocked
    (PBG-CONT-006)". blocking_failures was reported as [] alongside it, which is why a resuming seat
    can read this verdict and still believe it is free to work.
  the_defect: >
    last_completed_checkpoint_sha and continuity_record_commit both read `8ca0eed`. The framework
    refuses that equality in terms, and the schema says why in its own comment:
    "last_completed_checkpoint_sha — the last SOURCE checkpoint. NEVER the commit containing this
    file, which would be circular. continuity_record_commit — the commit that wrote these records,
    populated by a following commit." 8ca0eed is the commit that carried
    BL-20260819T143502Z-0026, so the field pointed at the commit containing itself.
  measured_not_inferred:
    method: >
      `git show <sha>:governance/engineering/ACTIVE_WORK.yaml` piped through
      pbg.continuity.validate(..., 'active_work') for each of the last four checkpoints on main.
    results:
    - '8ca0eed -> stage complete, OK'
    - '30f5c87 -> stage semantic: last_completed_checkpoint_sha equals continuity_record_commit'
    - '92cc9cc -> stage semantic: same error'
    - 'f7a49e5 -> stage semantic: same error'
    conclusion: >
      The record was valid at 8ca0eed and invalid from 30f5c87 onward. Boot has been RED for the
      whole of increments 3b and 4.
  where_it_came_from: >
    30f5c87, subject "[CRASH-DETECTOR] continuity: advance the checkpoint SHAs to 8ca0eed
    (CD-PL-F36 class)". Its whole stated purpose was to repair the CD-PL-F36 class — a fabricated
    checkpoint SHA — in this very field. Its two-line diff resolved continuity_record_commit from
    PENDING to 8ca0eed, which is correct and is exactly what "populated by a following commit"
    means, and in the SAME commit overwrote last_completed_checkpoint_sha with the same value,
    which is the circularity. A repair to one defect in a field introduced a different defect in
    the same field.
  why_two_reconciliations_did_not_catch_it: >
    THE MECHANISM IS THE FINDING. Both the increment-3b and the increment-4 checkpoints edited
    ACTIVE_WORK.yaml BY HAND and neither re-ran `pbg boot` afterwards. Hand-editing bypasses the
    framework's own write-then-read-back path — continuity.checkpoint() validates the serialised
    record, writes it to a .tmp, reads it BACK, validates again, and refuses the whole update if
    any stage fails, on the stated principle that nothing becomes canonical until it has been read
    back. Every hand edit forfeits that. Note also that continuity.checkpoint() never writes
    continuity_record_commit at all: the field is optional to the writer and only a human-authored
    follow-up ever sets it, which is why the defect could only arise on the hand-edited path.
  what_the_repair_does:
  - 'last_completed_checkpoint_sha -> f7a49e58f7ccb2966b174c7feb83f131ea6b3dcd, the last completed
    checkpoint on main, RESOLVED with `git rev-parse f7a49e5` and confirmed an existing object with
    `git cat-file -t` before being written (the standing CD-CONT-002 step, which has now caught
    three bad values in this field).'
  - 'continuity_record_commit -> PENDING. The commit carrying this record does not exist while this
    record is being written, so PENDING is the only truthful value at write time. It is left
    PENDING deliberately rather than resolved by another follow-up commit, because the follow-up is
    the thing that failed.'
  - 'The stale next_safe_action is corrected. It still ordered DISPATCH INCREMENT 3 — three
    increments behind — because 92cc9cc and f7a49e5 advanced current_block and lane_increment_sha
    without advancing it. A resuming seat that trusted the field would have re-dispatched completed
    work.'
  - 'The stale working_tree_state is corrected to the observed state at this boundary. It named
    main at 8a50355 and the lane at 9aea4ef, both of which resolve and both of which are from
    WO-2 increment 6a. The old text is retained beneath, marked HISTORICAL: superseded, not
    corrected (PBG-CONT-003).'
  what_this_does_not_claim: >
    The invalidity was in the CONTINUITY RECORD, not in the work it describes. Increments 3b and 4
    were reconciled by execution and their evidence stands unaffected — the lane commits, the
    variants, the plants and the measured contrasts are all independent of this field. What was
    lost for two checkpoints is the framework's guarantee that a resuming seat can trust this file,
    which is the one thing the file exists to provide.

CD-RULE-007:
  recorded_by: PROJECT_LEAD
  status: ACTIVE
  statement: >
    A continuity write is not complete until the record has been READ BACK by `pbg boot` and the
    verdict recorded in the same Build Log entry. A follow-up commit that resolves
    continuity_record_commit from PENDING may write THAT FIELD AND NOTHING ELSE.
  why_it_closes_a_class_and_not_an_instance: >
    Banning this particular field pair would close one spelling of one defect. Re-running the
    validator catches ANY schema or semantic defect this file can carry, including ones nobody has
    thought of, and it costs one command. It is the same move the project has now made four times:
    do not enumerate the routes, close the door they share. Here the shared door is the read-back
    the framework already performs on its own write path and that every hand edit skips.
  written_to: governance/rules/PROJECT-RULES.md

