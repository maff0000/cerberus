findings_raised_by_the_project_lead_at_this_boundary:
- id: CD-PL-F97
  severity: MEDIUM
  title: >
    **SIX EXECUTABLE PROBES LANDED UNDER `variants/WO-2R3/` AND NOT ONE HAS A ROW IN
    `variants/WO-2R3/MANIFEST.md`. IT IS THE AUDITOR'S F-C3 INVERTED, IN THE CORPUS F-C4 ALREADY
    FOUND STALE.**
  what: >
    `git diff --stat 531c95c..HEAD -- variants/` reads **6 files changed, 1318 insertions** and
    MANIFEST.md is not among them. `grep -c` for each probe's name in the manifest returns **0, six
    times.** The probes themselves are good — they print data and never a verdict, explicitly
    because of F-C1 — but nothing indexes them.
  why_it_matters_here_specifically: >
    F-C3 found three manifest rows with NO executable artefact. **THIS IS THE EXACT INVERSE: six
    executable artefacts with NO manifest row.** The corpus is the evidence base the FIFTH ASSURANCE
    SEAT is about to read, and a reader who audits `variants/WO-2R3/` from its manifest — the
    documented way to read it — **will not learn that the evidence for the four items of the
    remediation exists at all.**
  direction_of_error: >
    Toward INVISIBILITY rather than false assurance, which is the better of the two directions and is
    still the wrong one. Nobody is misled about what is proved; a reader is simply not told it was.
  disposition: >
    **RAISED, NOT REMEDIED.** Remediating it would be the Project Lead editing an Engineer's
    deliverable after return (PBG-AUTH-006). It travels to the Product Owner with this boundary and
    is named to the fifth Assurance seat as a KNOWN GAP IN THE CORPUS INDEX, so the seat reads the
    directory and not only the manifest.

- id: CD-PL-F98
  severity: LOW
  title: >
    **AGAINST THIS SEAT. THE PROJECT LEAD RAN THE ITEM-A CONTRAST WRONG AND PRODUCED THE ANSWER "THE
    FIX CHANGES NOTHING". BOTH ARMS WERE THE SAME TREE, AND THE THING THAT WOULD HAVE TOLD IT SO WAS
    A LINE IT HAD TRIMMED OFF THE OUTPUT.**
  what: >
    This seat ran the lane worktree's copy of `P-A-escape1-stored-is-not-validated.py` against two
    `/tmp` extractions. The probe resolves its import root from `Path(__file__).resolve().parents[2]
    / "src"` — **from the PROBE'S OWN LOCATION, not the working directory** — so both "arms" imported
    `/srv/crash-detector-wo2r3/src`. The two outputs were identical to the character, and the
    identical output was CORRECT for what was actually run.
  what_the_wrong_answer_would_have_been: >
    **"THE OLD ARM AND THE NEW ARM ARE INDISTINGUISHABLE — THE ITEM-A FIX DOES NOT DISCRIMINATE."**
    That is a finding of the most serious kind against a correct fix, and this seat was one paragraph
    from writing it into the record.
  what_saved_it: >
    The probe prints `tree: <resolved path>` as its first data line — **and this seat had trimmed the
    output with `tail`, cutting the very line that discloses the defect.** It was caught by the arms
    being *too* identical to be true, not by the disclosure that was there to be read.
  the_lesson_and_it_is_general: >
    **A CONTRAST RUN WITH THE WRONG TREE ON `sys.path` IS INDISTINGUISHABLE FROM A FIX THAT DOES
    NOTHING.** The corpus's own convention is to run each tree's OWN copy of a probe; this seat
    imported one copy into two directories and thought it had two arms. **AND: never filter a probe's
    output before reading its provenance line.** The Engineer designed that line in; the reconciler
    threw it away.
  and_the_count_this_seat_will_not_imply_is_bounded: >
    CD-PL-F86 was this seat's own method defect, and CD-PL-F94 was this seat reconciling a contrast
    by the wrong axis. **THIS IS THE THIRD METHOD DEFECT THIS SEAT HAS RAISED AGAINST ITS OWN
    RECONCILIATION PRACTICE, AND IT WILL NOT SAY THAT IS ALL OF THEM** — the last time it implied a
    pattern was bounded, the auditor counted nine.
  disposition: 'RAISED AGAINST THIS SEAT. It travels with this boundary. The fifth Assurance seat will run these same probes and should be told this, and it is told it in its dispatch.'

