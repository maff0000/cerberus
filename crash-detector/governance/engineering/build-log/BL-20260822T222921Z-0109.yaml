THE_STOP_AND_IT_IS_A_PRODUCT_AUTHORITY_QUESTION:
  id: CD-D-146
  title: >
    *** **THE WIDENED DOORS INSTRUMENT FINDS `guarded` AT `engine/evaluate.py:341` — A FUNCTION-LOCAL
    CLOSURE, PRE-EXISTING, IN PROTECTED CODE, THAT NO INSTRUMENT HAS EVER SEEN. THE REGISTER ROW IS
    RED AND TWO SHIPPED TESTS FAIL. WHAT HAPPENS TO IT IS NOT THIS SEAT'S TO DECIDE.** ***
  what_it_is_PL_READ_FROM_THE_SOURCE_AND_NOT_FROM_THE_ENGINEERS_ACCOUNT: >
    `_absence_is_never_a_number` is a PRIVATE decorator carrying the CD-ASR-F03 post-condition. Inside
    it, `def guarded(spec, usable, now_utc, *extra, **extra_by_name)` is returned and applied to
    `_evaluate_dial`. **IT IS PRESENT AND UNCHANGED AT 531c95c — this seat read it there. The
    increment did not create it; the increment made it VISIBLE.**
  why_it_is_a_genuine_question_and_not_a_bug_to_wave_through: >
    **READING ONE — IT IS A REAL DOOR.** Every call to `_evaluate_dial` goes through `guarded`. Its
    parameters are the arguments arriving at the dial evaluator, on a judgement path, in a RULE 1
    package, with no `@admits`. BP-AMENDMENT-0001 §D.1 says every such door establishes its arguments
    at the door.
    **READING TWO — THE MEMBERSHIP CLAUSE IS A NAME HEURISTIC THAT DOES NOT TRANSFER TO FUNCTION
    SCOPE.** The check's PUBLIC clause is "the name does not begin with `_`", written for module-level
    and class-level definitions where the name IS the reachability. `guarded` is a local binding
    inside a private function: never module-level, never importable, and `functools.wraps` gives it
    the runtime `__name__` `_evaluate_dial`. **THE STATIC READING AND THE RUNTIME NAME DISAGREE ABOUT
    WHETHER IT IS PUBLIC AT ALL.** This project's own CD-PL-F74 says a name is a vocabulary.
    **AND A THIRD THING, WHICH IS THE ONE THAT MAKES IT HARD:** `guarded` is deliberately
    ARITY-OPEN — `*extra, **extra_by_name` — and its own comment says why: *"a wrapper that fixed the
    arity would stop guarding the moment anybody gave the evaluator a fourth argument."* **A DOOR
    THAT EXACT-TYPES ITS ARGUMENTS AT THE DOOR CANNOT BE ARITY-OPEN. §D.1 AND THE CD-ASR-F03 WRAPPER
    DESIGN PULL AGAINST EACH OTHER HERE, AND THAT TENSION IS ARCHITECTURAL, NOT CLERICAL.**
  what_the_engineer_did_with_it_and_this_seat_endorses_the_conduct_without_endorsing_any_answer: >
    It named all three ways to make the check green and refused all three: adding an exemption is
    "quietly exempting"; weakening the two tests is "weakening to obtain a pass"; editing
    `engine/evaluate.py` is out of writable scope — **"and that settles it without any judgement by
    me."** It then recorded the exemption it was TEMPTED by and why it rejected it: extending
    "non-public enclosing class" to enclosing FUNCTIONS would have exempted `guarded` and looked like
    symmetry, **but would have re-opened the auditor's own ESCAPE 4 arm 4** — a function-local `def`
    bound into a module dict, which the auditor demonstrated LIVE. **THAT IS THE RIGHT REASONING AND
    IT IS THE REASONING THIS SEAT WOULD HAVE HAD TO REACH TOO.** It offered no recommendation.
  what_this_seat_will_NOT_do: >
    **IT WILL NOT RULE ON `guarded`, WILL NOT AUTHORISE AN EXEMPTION, WILL NOT ORDER A DECORATOR ONTO
    IT, AND WILL NOT WEAKEN A TEST.** It went up for the same reason CD-D-134 went up: it is a
    question about what the ruled class REACHES, and the last time this seat reconciled a class
    question by its own reading it earned CD-PL-F94.
  what_it_does_NOT_block: >
    **IT DOES NOT BLOCK THE FIFTH ASSURANCE SEAT**, which PO-DECISIONS-0011 ruling 5 authorises
    unconditionally over the whole of WO-2R3 at the post-increment SHA. The seat is READ-ONLY and
    grades what is in front of it; a RED register row and two failing tests are DISCLOSED STATE it
    must be told about, not a precondition it must wait on. **AND NO CODE MOVES WHILE THE SEAT IS
    OUT** — nothing is authorised without a ruling and a dispatch, and this seat will open neither
    while an auditor is reading the tree. So the target is stable for the whole audit either way.

