action_summary: >-
  INCREMENT 16B-FIX-3 — FX9, FX10 AND FX11 BUILT AND MEASURED. READY_FOR_ASSURANCE at
  3c44843143df85ec2ded7197bd22c61cbf470e38 (branch wo-3).

  *** BOTH OF CD-ASR-WO3-07'S FINDINGS WERE REPRODUCED END TO END, FROM MY OWN EXTRACTIONS AND MY
  OWN MUTATORS, BEFORE ANYTHING WAS WRITTEN — AND BOTH ARE NOW RED. THE SUPERSEDED INSTRUMENT AT
  ba4523e REPORTS `PASS — 144 assertions, 0 violations` ON ALL THREE OF MY NEW TREES WHILE THE
  LIVE GATE ADMITS THE FORBIDDEN DOCUMENT ON BOTH SURFACES; THE FIXED ONE REPORTS FAIL ON ALL
  THREE, AND ON ALL THREE **LINE 3 OF THE REGISTER — THE REGISTER-WIRED INSTRUMENT
  PO-DECISIONS-0026 RULING 9 COMMISSIONED — NOW MOVES, WHERE AT ba4523e IT DID NOT.** ***

  *** THE MEMORIAL STATE IS ENDED ON THESE THREE TREES, AND THAT IS THE ONE MEASUREMENT THIS
  INCREMENT EXISTS FOR. *** At ba4523e the only register line that moved on the A1/A2 shapes was
  LINE 2, `tests/test_detail_level.py` — the memorial — and on the D1 shape the only line that
  moved was LINE 6, `check_schema_closed`'s root allowlist, WHICH SAYS NOTHING ABOUT `calm` AT
  ALL. Now C18 and C19 move LINE 2 **AND LINE 3**; C20 moves LINE 3 **AND** LINE 6.

  FX9 — F1, AND I FIXED THE RESOLVER AND NOT THE GUARD. Both contracts declare
  `"$schema": "https://json-schema.org/draft/2020-12/schema"` (MEASURED, not assumed), and in
  2020-12 keywords SIBLING to `$ref` ARE APPLIED. `_deref`'s while-loop replaced a node carrying
  `$ref` with the `$ref`'s TARGET and discarded the node's siblings AT EVERY HOP, so the object
  FX5's conditional-keyword guard inspected was NOT the schema the gate enforces. `_resolve` now
  returns `(resolved, dropped)` — the resolved node PLUS every ASSERTING keyword the chain would
  have discarded, at every hop — and `_deref` is a one-line wrapper over it so the two cannot
  drift. A branch reached through such a chain is UNBUILDABLE and reported as
  CD-CALM-BRANCHES-006; a root property reached through one is UNDECIDABLE and reported as
  CD-CALM-SLOTS-007; `#/$defs/dial_reading` itself is CD-CALM-BRANCHES-006. THE CONDITIONAL-KEYWORD
  GUARD IS BYTE-UNCHANGED. Because the repair is at the resolver and reports at EVERY HOP, arm
  C19 — the auditor's A2, with the conditional one `$ref` deeper behind a bare innocuous entry —
  is caught by the same sentence as C18, and a third position would be too. A guard that inspected
  only the `oneOf` entry would have caught C18 and been blind to C19, which is the whack-a-mole
  PO-DECISIONS-0026 ruling 10 forbids.

  *** WHICH REMEDY I CHOSE, AND WHY — DENY-BY-DEFAULT, NOT A MERGE, AND THE REASON IS TECHNICAL
  AND NOT BUDGETARY. *** A dict merge is NOT 2020-12's semantics. `$ref` + siblings is a
  CONJUNCTION of two schema objects, and `additionalProperties`, `unevaluatedProperties` and
  `unevaluatedItems` are evaluated against the annotations of THEIR OWN schema object. A target
  `{"properties": {"a": ...}}` conjoined with a sibling `{"additionalProperties": false}` admits
  NOTHING BUT `{}`; the MERGED object admits `{"a": ...}`. **A merge can therefore admit documents
  NEITHER schema admits — it can only ever WEAKEN this instrument, SILENTLY, which is the exact
  failure class F1 IS.** Deny-by-default cannot weaken it: it can only over-report, and an
  over-report costs one seat one look at one contract. THE COST IS DECLARED AS THIS ROW'S NEW
  DECLARED LIMIT 13, in all three CD-RULE-004 places.

  *** AND THE INERT-SIBLING ALLOWLIST IS LOAD-BEARING, WHICH I FOUND BY MEASURING RATHER THAN BY
  BEING TOLD. *** `grep`-equivalent over both contracts: the PUBLIC contract carries FOUR `$ref`
  nodes with a `description` sibling — `as_of_utc`, `published_utc`, `inputs_used`,
  `degraded_inputs` — and the private contract none. **A RESOLVER THAT DENIED ON ANY SIBLING WOULD
  HAVE TURNED THE CLEAN TREE RED.** `REF_INERT_SIBLINGS` is therefore exactly the pure ANNOTATION
  keywords of 2020-12 (`$comment` from Core; `title`, `description`, `default`, `deprecated`,
  `readOnly`, `writeOnly`, `examples` from the Basic Meta-Data vocabulary) — each of which produces
  an annotation and asserts nothing, so discarding it cannot change what the node admits. That is
  a specification fact and not a convenience.

  FX10 — F2. `_dial_bearing`'s `undecidable = True` limb sat INSIDE `if isinstance(state, dict)`,
  so a `state` spelled as the boolean schema `true` — legal in 2020-12 and maximally permissive —
  dropped to `None`, the limb never ran, the `_SUBSCHEMA_KEYWORDS` descent skipped it too, and the
  property was classified NOT A DIAL. **THE TRIGGER IS NOW THE PRESENCE OF THE DECLARED KEY AND NOT
  ITS SHAPE:** `if isinstance(properties, dict) and "state" in properties:` — a root property that
  DECLARES a `state` reaches the undecidable limb whatever the shape of that key's subschema, and
  the shape can only refine the answer to `True`, NEVER back to `False`.

  FX11 — THE SENTENCE, NOT THE BEHAVIOUR, AND THE PROJECT LEAD'S RULING STANDS UNTOUCHED. DECLARED
  LIMIT 12 said *"MEASURED, it does not fire on the clean tree ..., NOR ON A LEGITIMATE OPTIONAL
  ROOT OBJECT THAT IS NOT A DIAL (arm C16, PASS — 144)"*. C16 is ONE benign shape presented as a
  CLASS. SUPERSEDED IN ALL THREE CD-RULE-004 PLACES, and **`jurisdiction.state` — A US STATE CODE —
  IS NAMED AS THE WORKED EXAMPLE**, together with `run_provenance.pipeline.state`. I DID NOT RELAY
  THOSE TWO FROM THE AUDIT: I built both trees at MY tip and measured them myself — `jurisdiction`
  `FAIL — 2 violation(s)`, undecidable `['jurisdiction']`; `run_provenance` `FAIL — 2`, undecidable
  `['run_provenance']`. DECLARED LIMIT 10 is superseded in the same three places for the same
  reason its closing sentence was false — a conditional written one position over. THE NUMBERING
  NOTE MOVES FROM 1-12 TO 1-13 IN ALL THREE PLACES.

  *** NOTHING MOVED THAT MUST NOT MOVE, MEASURED AND NOT CLAIMED. *** ba4523e..3c44843 is SEVEN
  files; ZERO paths on any protected prefix; ONE identity, CD-ENG-WO3-08. Both envelope schemas,
  `src/`, `tests/`, `pbg/`, `evidence/`, `governance/decisions/`, `governance/mapping/`,
  `BLUEPRINT.md`, `PID.md`, `deploy/`, `db/` and every `tools/` file except my one: UNTOUCHED, by
  command. C1-C17's patch files are byte-untouched (the MANIFEST is APPEND-ONLY, numstat 223/0).
  `evidence/` does not exist in the tree and I wrote nothing under it (PBG-SOD-001, non-waivable).
  be0b355 is be0b355e4b9c39b65b7ca38e75e063ab2c5f40a5, unchanged.

  THE BOOT RED IS THE FROZEN BASE'S AND I DIAGNOSED IT RATHER THAN REPAIRING IT. My own boot at
  3c44843 returns `Verdict: RED`, `continuity_state CONTINUITY_REFERENCE_INVALID/RESUME_BLOCKED`,
  `BLOCKING: continuity invalid — CONTINUITY_REFERENCE_INVALID — read-only diagnosis permitted,
  normal boot blocked (PBG-CONT-006)`. `governance/engineering/ACTIVE_WORK.yaml` is the SAME BLOB
  ce0803c3d472fe52541f28965d7995e888329c28 at be0b355, at ba4523e and at 3c44843. **SEVENTH SEAT TO
  SAY SO. NOT REPAIRED.**

  I DID NOT IMPLEMENT 16C, DID NOT CLOSE DECLARED LIMIT 12'S NAMED RESIDUE, AND DID NOT CERTIFY MY
  OWN WORK (PBG-SOD-001, non-waivable).

