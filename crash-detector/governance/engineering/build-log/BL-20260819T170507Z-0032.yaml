decisions:
- id: CD-D-057
  ruling: >
    WO-2R increment 5 is RECONCILED AND ACCEPTED at lane f22d120. CD-ASR-F06 is CLOSED AS A CLASS,
    subject to Assurance. CD-PL-F62 is CLOSED and CD-D-055 is DISCHARGED. The structural move is the
    one worth recording: the closure is not the ceiling. The ceiling bounds a number; FreshnessEvidence
    makes the age comparison the ACT OF CONSTRUCTING the evidence, and agreement requires the evidence
    — so a route that skips the comparison does not exist rather than being caught. The seat found the
    one door both comparison sites share, which is what the Project Lead's PL-V1 argued for and
    deliberately did not specify.
- id: CD-D-058
  ruling: >
    CD-PL-F65 is corrected in increment 6's declaration sweep, not by a re-open and not by folding it
    into the bounded _yamlmin dispatch. The seat is NOT asked to add __slots__ to Agrees: that would
    close PL-W3 and not PL-W5, and a partial fix that reads like a closure is the CD-PL-F54 shape.
- id: CD-D-059
  ruling: >
    PL-W1 through PL-W6 join the exclusion set and are written to governance/reconciliation/WO-2R/ as
    DATA, nothing executable (PBG-ASSURE-001). The next auditor must devise fresh variants; the
    exclusion set is now the union of the WO-2 auditor's ten, the Engineer's variants through V51, and
    the Project Lead's, PL-Q1 through PL-W6.

