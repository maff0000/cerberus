      the increment back.
  PL-W3:
    route: 'object.__setattr__(agrees, "smuggled", 1.0) — UNDECLARED attribute injection.'
    outcome: 'NOT REFUSED. On StalenessWindow the same call raises AttributeError, which is what boundary 3 measures and reports. The asymmetry is the substance of CD-PL-F65.'

CD-PL-F65:
  severity: LOW
  status: OPEN
  title: "declared boundary 3 protects the two staleness values and is silent about Agrees, the type that actually renders"
  detail: >
    Two gaps, neither of them a false carrier. (a) Boundary 3's reassuring half — "Both values use
    __slots__, so an UNDECLARED attribute cannot be injected" — is TRUE of StalenessWindow and
    FreshnessEvidence and FALSE of Agrees, which is @dataclass(frozen=True) with no slots, at
    be34fe4 and at f22d120 alike. PL-W3 measures the difference. (b) The boundary's measured
    examples stop at a wrong age reading and a wrong window value; they do not show that the
    mechanism reaches the Product Owner's exact forbidden sentence, "a decade-old row must be
    structurally incapable of rendering WITNESS AGREES". PL-W5 shows it does. An auditor reading
    boundary 3 learns the residue exists but not that it lands on the headline.
  why_it_is_F62_and_not_F59: >
    F59 was rejected because boundary 4 ASSERTED A COMPENSATING LAYER THAT DID NOT EXIST and the
    residue was carried by nothing. Here nothing false is asserted: the boundary says NOT PROVED TO
    BE CARRIED ANYWHERE, which is the honest form CD-RULE-006 requires, and its generalising first
    sentence does cover the route. What is missing is EXTENT, not truth. An incomplete boundary is
    a declaration to finish; a false boundary is a closure to redo.
  disposition: >
    CD-D-058: corrected in INCREMENT 6, whose declared business is exactly the register-and-contract
    sweep and which writes no logic. NOT folded into the CD-PL-F61 _yamlmin dispatch, because that
    dispatch is bounded elsewhere and widening it silently is what `prohibited` forbids — the same
    rule the Project Lead held the seat to. Named to Assurance either way.
  the_seat_is_not_asked_to_slot_Agrees: >
    Adding __slots__ to Agrees would close PL-W3 and would NOT close PL-W2/PL-W5, which is the route
    that renders. Requiring it would trade a real declaration for a partial fix that reads like a
    closure — the CD-PL-F54 shape. The obligation is to say what is true, in all three places.

