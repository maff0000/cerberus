  PL-W2_and_PL-W5:
    route: 'object.__setattr__(agrees, "as_of_utc", <2016>) on a validly constructed Agrees, then render.'
    outcome: >
      NOT REFUSED. The mutation sticks and render_panel returns "WITNESS AGREES" while
      freshness.age_seconds still reads 0.0 — an agreement claiming a decade-old observation,
      rendering the string the Product Owner's sentence forbids.
    ruling: >
      INSIDE THE DECLARED LIMIT. Boundary 3's first sentence generalises in terms — "object.__setattr__
      WALKS PAST FROZEN, here as on every frozen value in Python AND IN THIS REPOSITORY" — declares
      that overwriting a declared field is not preventable at the Python level, and says NOT PROVED
      TO BE CARRIED ANYWHERE. It is the identical residue already ruled inside the limit at CD-D-040
