  - 'contracts/execution/ — 22 execution contract documents, one per declared test, because check 3
    requires every test to name an execution contract that RESOLVES.'

  population_derivation: >
    DERIVED FROM PID §6 AND ONLY FROM PID §6 — all sixteen criteria CD-AC-001 through CD-AC-016,
    whatever work order delivers them, per BLUEPRINT §14 ("every row above becomes a register
    entry"). Each entry's `criterion` and `acceptance_semantics` are taken from the PID §6 row for
