cd_pl_f32:
  finding_as_raised: >
    `submit_instruction(symbol, qty, side)` passed check_no_execution_interface.py, identically
    with and without the docstring "Route an order to the broker for execution". CD-AC-012 is one
    of the five criteria the WO-2 gate turns on.

  what_the_defect_actually_was: >
    A CORRECTION TO THE DIAGNOSIS, offered because it changes the fix. The raised finding says the
    vocabulary lacked "instruction" and "submit". `submit` WAS already in EXECUTION_VERBS — the
    miss was that its OBJECT was not in EXECUTION_OBJECTS, so the verb-plus-object composite rule
    had nothing to compose with. That detail matters because it shows the defect was not a short
    word list: the check asked exactly ONE question of every construct — "is this NAME an
    execution word?" — and an order-entry path is not primarily a name. Everything below follows
    from that. The Project Lead's instruction not to fix it by extending a word list was correct
    and is the reason the fix took the form it did.

  what_was_deliberately_not_done: >
    "instruction" and "submit" were NOT simply added to a list. That fixes the instance and leaves
    the class, and it would have been the second time this check was built to catch what somebody
    happened to plant.

  the_shape_rules:
    principle: >
      An order-entry path is recognisable from what it CARRIES. A signature holding an instrument
      together with a quantity and a side; a destination that is a venue, broker or exchange; a
      price or order-type parameter; a verb of transmission applied to a tradeable noun. Any one of
      those alone is weak — which is why every rule below requires a COMBINATION, and why the
      categories are split into supporting and strong.
    layers_now_in_the_check:
    - 'L1 NAMES (pre-existing, widened) — identifier composition over functions, classes,
      parameters, attributes, keyword arguments, imports, SQL identifiers and endpoint literals.
      Its verb-plus-object rule now reads TRANSMISSION_VERBS x TRADEABLE_NOUNS. This IS a wider
      list, and it is deliberately NOT what closes the finding: the escape is caught with every
      one of those words removed. The wider list closes only the narrow residue of a transmission
      verb applied to a tradeable noun on a callable that takes NO arguments at all, where there is
      no signature to read.'
    - 'L2 SIGNATURE SHAPE (NEW) — judge_signature() reads the FIELD SET of every callable and every
      class body. Seven categories: instrument, quantity, price, account (supporting) and side,
      order_type, destination (STRONG). S1 fires on instrument AND quantity AND at least one strong
      field. S2 fires on two or more strong fields among three or more categories. S3 fires on a
      transmission verb in the name plus two order fields. S1 AND S2 NEVER READ THE NAME, which is
      the property that matters: renaming the function to `f` does not evade them.'
    - 'L3 PROSE (NEW) — judge_prose() reads what the check previously discarded on purpose:
      docstrings, comments, ordinary string literals, SQL comments, SQL string literals and
      dollar-quoted bodies. Three patterns, all requiring a transmission verb and a noun naming a
      tradeable instruction in the same sentence: ACTIVE VOICE as a direct object ("route an
      order"), PASSIVE VOICE ("each bargain was routed"), and NOMINALISED ("order routing").'
    what_is_read_now_that_was_not_read_before: >
      Prose, in every form the tree carries it — Python docstrings, Python comments (which the AST
      discards entirely, so tokenize is used), plain string literals, SQL comments and SQL string
      literals (which the old check BLANKED OUT before scanning) — and the parameter and attribute
      NAME SETS of callables and classes as sets rather than one identifier at a time.

  false_positive_control:
    why_it_is_part_of_the_judgement: >
      A check that fails on innocent code is as useless as one that passes guilty code, because a
      project learns to ignore it. Two decisions exist only for this reason.
    strong_versus_supporting_split: >
      `(symbol, quantity, price)` is an ordinary valuation signature and must stay clean;
      `(symbol, qty, side)` must fail. Both carry three categories, so a rule counting categories
      alone would either fire on both or on neither. Requiring at least one STRONG field — a side,
      an order type or a destination, none of which an advisory read-only product has any use for
      — separates them. Verified as FN-04, which must not fire, and FV-01, which must.
    the_one_false_positive_actually_found_and_tuned:
      what: >
        The FIRST run of L3 against the delivered tree produced exactly two findings, and both were
        false. src/crash_detector/__init__.py:1 "which WORK ORDER each part is owed to" and
        db/migrations/0007_grant_matrix.sql:232 "a later WORK ORDER adds". `work` is a genuine
        transmission verb — a trader works an order into the market — and `order` is a tradeable
        noun, so "work order" reads as one under the active-voice rule.
      why_it_had_to_go: >
        This project has sixteen work orders and names them constantly, in code, in migrations and
        in every governance record. The collision is certain, not hypothetical, and a guard that
        fails on the project's own vocabulary is a guard somebody switches off inside a week.
      the_tuning: >
        ORDER_SEQUENCE_MODIFIERS — the words that select the SEQUENCE sense of `order` rather than
        the INSTRUCTION sense: in, work, sort, sorted, byte, reverse, ascending, descending,
        alphabetical, lexical, chronological, declaration, registration, insertion, evaluation,
        dependency, topological, delivery, boot, load, import, random, stable, natural, canonical,
        arbitrary, priority, column, argument. When one of these is the word IMMEDIATELY before
        `order`, L3 does not read it as an instruction. `order` followed by `to` or `of` is
        likewise excluded ("in order to", "order of magnitude").
      why_it_does_not_reopen_the_class: >
        It suppresses ONE bigram in ONE of three layers. `work_order` as an IDENTIFIER still fails
        L1. A callable carrying an order's field set still fails L2 whatever its comments say. And
        "works the order", "works an order" and "working the order" all still fail L3, because the
        rule reads the word immediately before the noun and `the`/`an` are not in the set. What has
        been given up is the ability to detect an execution pathway announced ONLY in a comment
        that begins with one of those modifiers — a false negative in the third of three nets, and
        the third net is the one that was worth nothing at all this morning.
    the_other_deliberate_false_negative: >
      L3 suppresses any sentence carrying a negation (no, not, never, without, refuses, forbidden,
      prohibited, absent, denylist, ...) or a hypothetical framing (if, would, planted, variant,
      violation, guard, check, example, ...). This project's documentation says repeatedly that it
      places no orders, and every guard and every plant must DESCRIBE what it defends against in
      order to defend against it. The suppression is affordable only because L1 and L2 do not read
      prose at all: an interface hidden behind "this does not route orders" is still caught by its
      name and by its field set. It is stated in the check's own output on every run, not buried.

