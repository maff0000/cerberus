  escape_found_while_fixing:
    id: CD-ENG-F33
    severity: 'MEDIUM — found and closed inside this increment; reported because it was real.'
    what: >
      FV-14, "Each bargain was routed to the desk before the close.", ESCAPED THE FIRST CUT OF THE
      L3 PROSE RULE and exited 0. The rule as first written looked for a transmission verb followed
      by its DIRECT OBJECT. English puts the object BEFORE the verb in the passive voice, so a
      direct-object rule cannot see "was routed" at all — and passive voice is exactly how a
      migration comment or a design note is naturally written.
    why_it_is_reported_rather_than_quietly_fixed: >
      It is a gap in the CLASS, not a wording accident: every passive sentence in the language was
      invisible to the rule, not just this one. It is recorded here because a fix whose own
      re-proof found a second hole is more trustworthy than one that reported 15 out of 15 first
      time, and because the next reader should know that L3 has now been wrong once.
    fix: >
      Two further patterns, both built for the class rather than for the sentence: PASSIVE VOICE
      (a tradeable noun, a form of `be` or `get`, then a past PARTICIPLE of a transmission verb,
      with adverbs allowed in between) and NOMINALISED (a tradeable noun immediately followed by a
      transmission verb in its -ing form, for "order routing", which has no finite verb at all).
      The participle FORM is required, not merely a transmission verb: without that, "the position
      was open" would have fired, and FN-11 is the variant that holds that line.
    then: 'FV-16, FV-17 and FV-18 were written against the new patterns after they existed, and the
      whole battery re-run. 31/31.'

  code_changed:
  - 'tools/register/_broker_vocabulary.py — token_list() added (ordered tokens, so `limit_price`
    can be told from a row `limit`); TRADEABLE_NOUNS, TRANSMISSION_VERBS, DESTINATION_NOUNS,
    ORDER_FIELDS, STRONG_FIELDS, ORDER_SEQUENCE_MODIFIERS, PROSE_FILLERS, PROSE_NEGATIONS,
    PROSE_HYPOTHETICALS, BE_FORMS; classify_field(), field_categories(), judge_signature(),
    judge_prose(); judge_identifier() verb-object rule widened to transmission x tradeable.
    `transaction` is DELIBERATELY absent from TRADEABLE_NOUNS — a database transaction is the
    commonest word in the storage layer and a rule firing on it would be silenced immediately.'
  - 'tools/register/check_no_execution_interface.py — L2 over every FunctionDef, AsyncFunctionDef
    and ClassDef; L3 over every string constant, every tokenize COMMENT, and the SQL comments,
    string literals and dollar-quoted bodies that were previously blanked out and discarded. An
    untokenisable module is a VIOLATION, not a pass, on the same reasoning as an unparseable one.
