    the prior that a FOURTH gap exists in the other nine. THE ASSURANCE SEAT SHOULD PLANT ITS OWN
    VARIANTS PER CRITERION AND SHOULD NOT RE-RUN THESE. Two specific suggestions, offered as
    directions rather than as answers: check_egress_no_broker reads compose.yaml through a
    project-written reader (tests/compose_reader.py), and a check that parses its subject with a
    parser the same project wrote is one class of blind spot; and check_schema_closed asserts
    closure of the schema DOCUMENTS, which is not the same proposition as an envelope carrying an
    unknown key being refused at runtime.

