  THE_VACUITY_CHECK__WHICH_THE_RENAME_TEST_DOES_NOT_GIVE_YOU: >
    **ARM C: 31 VIOLATIONS. THE CRITERION IS NOT VACUOUS.** It CAN refuse; it refuses on the wrong
    axis. This project added the rule at the sixth gate — *"the rename test proves a criterion is
    not a VOCABULARY; IT DOES NOT PROVE IT IS NOT VACUOUS. A criterion that always answers 'not
    gated' passes the rename test perfectly and is worthless."* **RUN, AND THE ANSWER IS THAT
    VACUITY IS NOT THIS FIELD'S DEFECT. UNSOUNDNESS IS.**
  THE_TWO_DIRECTIONS_TOGETHER: >
    **A CRITERION THAT REFUSES WHEN NOTHING IS WRONG (ARM A) AND PASSES WHEN THE CLAIM IS FALSE
    (ARM B) IS NOT A WEAK CRITERION. IT IS A CRITERION OF A DIFFERENT PROPOSITION** — "does this
    4-tuple of strings appear in today's site set, in another module" — **WEARING THE NAME OF THE
    ONE IT DOES NOT MEASURE.**

