READING_ITEM_3_ADVERSARIALLY__THE_DISPATCH_ASKED_FOR_THIS_AND_HERE_IT_IS:
  CD_ENG_WO2R3_07_F16__HIGH__ITEM_3_CANNOT_BE_DELIVERED_IN_EITHER_FORM_IT_OFFERS: >
    **ITEM 3 SAYS "Make the gating relation MACHINE-CHECKED, or DECLARE ITS MEASURED LIMIT
    (CD-RULE-004, three places)". BOTH FORMS REQUIRE FILES THE SAME DISPATCH DOES NOT MAKE
    WRITABLE.**
      * the check is `tools/sweep/delegated_judgement_sweep.py:_upstream_of_the_path_violations`.
        **The writable scope names `tools/register/` and NOT `tools/sweep/`.**
      * the data is `tools/sweep/declared_dispositions.py`. **PROTECTED by PO-DECISIONS-0017
        ruling 2, and named as protected by this dispatch's own `protected_scope`.**
      * and for the DECLARE branch, `CD-RULE-004`'s three places for THIS guard are the check
        header (out of scope), the register entry (**the Class-2 sweep HAS NO `required-tests.yaml`
        ROW** — `grep -c 'delegated_judgement_sweep' required-tests.yaml` finds it cited once, in
        another row's prose, and no `test_id` of its own) and an execution contract
        (**`contracts/execution/` HAS NO FILE FOR IT** — 26 contracts, none for the sweep).
    **THE ONE PLACE THE LIMIT IS ALREADY WRITTEN IS `declared_dispositions.py:790`, WHICH IS THE
    DATA FILE AND NOT ANY OF THE THREE.** So `CD-RULE-004`'s three-places rule has never been
    satisfiable for this guard, by anyone, and that is not a fact about this seat's scope.
  CD_ENG_WO2R3_07_F17__HIGH__AND_THE_FIELD_CANNOT_BE_MADE_STRUCTURAL_BY_ADDING_A_CLAUSE: >
    **THE DEFECT IS THE FIELD'S IDENTITY, NOT ITS CLAUSE COUNT.** `gates` is a SITE KEY:
    `(module, qualname, category, EXPRESSION TEXT)`. **THE FOURTH ELEMENT IS SOURCE TEXT**, so ANY
    criterion keyed on that tuple fails the rename test BY CONSTRUCTION — ARM A is not a bug in the
    clause, it is what a text key does. **BOLTING A REACHABILITY CLAUSE ONTO A TEXT KEY GIVES YOU A
    STRICTER TEXT KEY, NOT A STRUCTURAL CRITERION, AND IT MAKES ARM A WORSE WHILE ONLY PARTLY
    HELPING ARM B.** Any real fix has to answer *"what IS the same site across a rename?"*, and
    that is a design question about the register's identity model. **IT IS NOT AN ENGINEER'S TO
    DECIDE AND ITEM 3 IS WORDED AS THOUGH IT WERE A FIX.** Raised against the dispatch, which
    invited it and which cites `CD-PL-F107` as the precedent for exactly this.
  what_IS_available_and_is_offered_rather_than_taken: >
    **THE HONEST MACHINE-CHECKABLE RELATION AVAILABLE TODAY IS IMPORT REACHABILITY, AND IT IS A
    PROXY.** The sweep already builds the intra-package import closure (`_closure`), so
    *"the gated site's module is reachable from the declaring site's module in that graph"* is
    derivable from data the instrument already holds, and it is strictly more than
    different-module. **IT IS STILL NOT "DOWNSTREAM ON A JUDGEMENT PATH":** module import
    reachability is coarser than call reachability, and this project has already measured its own
    call-reachability reasoning defective (`F-06-K`, `_module_bindings` cannot see a binding made
    inside any block). **A PROXY DECLARED AS A PROXY WOULD BE A REAL IMPROVEMENT OVER A CLAIM
    DECLARED AS MACHINE-CHECKED. IT WOULD NOT FIX ARM A.** Offered to the Project Lead and the
    Product Owner as a design, not taken.

