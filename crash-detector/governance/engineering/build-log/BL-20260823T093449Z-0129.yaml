# ================================================================================================ #
# 1. THE FINDING THAT MADE IT NECESSARY
# ================================================================================================ #
CD_PL_F128:
  severity: MEDIUM
  title: >
    **TWO INSTANCES OF THE SEVENTH SEAT SHARED ONE `/tmp` SCRATCH DIRECTORY, WITH SEMANTICALLY
    COLLIDING FILENAMES, AND NOTHING IN THIS PROJECT'S METHOD WOULD HAVE CAUGHT IT.**
  measured: >
    `ls -la --time-style=+%FT%T /tmp/asr7/` — **NAMES AND MTIMES ONLY; NO FILE IN THAT DIRECTORY WAS
    OPENED BY THIS SEAT.** The directory was created by instance 1 at 09:58 local and has been
    written by instance 2 from 10:20 local onward. It currently holds files from BOTH, interleaved.
    **INSTANCE 1's, WRITTEN 09:50-09:58 LOCAL:** `r6_probe.py`, `r6_probe2.py`, `r6_probe3.py`,
    `r6_demo.py`, `fieldless.py`, `ac005.py`, `ac005b.py`, `ac005c.py`, `independent.py`,
    `t20c.py`, `sweep_tip.txt`.
    **INSTANCE 2's, 10:20 LOCAL ONWARD:** `route6.py`, `recon.py`, `demo.py`, `meta.py`, `f01.py`,
    `escape3.py`, `t20.py`, `t20b.py`, `t20exec.py`, `validator.py`, `t9.py`, `instr_sealed.txt`.
    Instance 1 also left `/tmp/asr7-base`, `/tmp/asr7-escape3`, `/tmp/asr7-excl`,
    `/tmp/asr7-plants`, `/tmp/asr7-tables`, all untouched since 09:59 local.
  the_finding: >
    **THE STALE NAMES COLLIDE WITH THE LIVE ONES ON MEANING, NOT MERELY ON PATH.** A dead
    context's `r6_*` probes sit beside a live `route6.py`; a dead `t20c.py` sits beside a live
    `t20.py`/`t20b.py`/`t20exec.py`; a dead `sweep_tip.txt` is a captured output that reads as
    current to anyone who cats it. **A GLOB, A STALE IMPORT BY MODULE NAME, OR A SKIMMED `ls` HANDS
    A DEAD INSTANCE'S ARTEFACT TO A LIVE AUDITOR AS THOUGH IT WERE ITS OWN MEASUREMENT.**
    That is `CD-PL-F98` exactly — a probe whose provenance was not checked — arriving by a route
    F98 never contemplated, which is **ACROSS TWO LIVES OF THE SAME SEAT IDENTITY.**
  why_no_control_would_have_caught_it: >
    Every provenance discipline this project has built points at the TREE: fingerprints, `tree:`
    lines, pristine extractions, base/tip contrasts. **NOT ONE OF THEM LOOKS AT THE SCRATCH
    DIRECTORY WHERE THE ACTUAL PROBES ARE WRITTEN AND RUN.** `/tmp` is declared "explicitly safe
    diagnostic artefacts" in every dispatch this project has issued and is therefore the one place
    nobody measures. **THE SEALED-CLASS ARGUMENT AT THIS VERY GATE WAS SETTLED BY PROBES RUN IN
    EXACTLY SUCH A DIRECTORY.**
  a_second_order_point_recorded_and_not_resolved: >
    This was found ONLY because a background `find` from earlier in this session happened to
    complete and list `/tmp`. **IT WAS NOT LOOKED FOR. NOBODY HAS EVER LOOKED FOR IT**, across six
    prior Assurance seats and seven Engineer seats, all of which used `/tmp` the same way and
    several of which had a second instance. **WHETHER ANY EARLIER SEAT WAS CONTAMINATED THIS WAY IS
    AN OPEN QUESTION THIS SEAT IS RAISING AND CANNOT ANSWER**, and it is put on the meta-assurance
    docket rather than waved away.
  not_remedied_here: >
    Nothing was deleted. **THE STALE FILES ARE DELIBERATELY LEFT IN PLACE**: if instance 2 has
    already read one, destroying it would destroy the evidence of a contamination that may need to
    be recorded. The decision on its own scratch space is the auditor's, not the reconciler's.

