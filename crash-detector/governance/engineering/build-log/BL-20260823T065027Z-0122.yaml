action_summary: >
  *** **INCREMENT 8 INSTANCE 2 IS COMPLETE — ALL FIVE OUTSTANDING ITEMS DELIVERED AND COMMITTED —
  AND THE PROJECT LEAD THAT DISPATCHED IT DIED BEFORE IT COULD RECORD ONE WORD OF THAT.** ***
  `CD-ENG-WO2R3-06` RETURNED ALIVE IN THE LANE AND NOT IN CONVERSATION: five commits,
  `314592c` -> `05ddaa3`, `ITEM_1` `ITEM_2` `ITEM_3` `ITEM_4` `ITEM_6`, one per item, porcelain
  ZERO. **THE RECORD ON `main` KNEW NONE OF IT.** ***
  *** **THIS IS CD-D-007 PAYING FOR ITSELF A FIFTH TIME, AND IN A NEW SHAPE.** The four prior times
  the lane was ahead of the record because a seat died mid-item. **THIS TIME THE SEAT FINISHED THE
  WHOLE ORDER AND THE PROJECT LEAD IS WHAT DIED** — `wo2b` attempt 1, started 04:45:23Z, killed
  `rc=124` at its own 7200s ceiling at 06:45:23Z, while the seat's five commits landed INSIDE that
  window at 05:55:42Z -> 06:35:53Z. Reading the record and trusting it would have RE-DISPATCHED
  FIVE COMPLETED ITEMS and thrown away 4,641 insertions across 34 paths. ***
  *** **BANKED BY MEASUREMENT, NOT ACCEPTED** (PBG-AUTH-003). Every headline number the seat wrote
  about itself was RE-RUN BY THIS SEAT AND REPRODUCED IN EVERY CELL. Nothing here closes an
  acceptance criterion, closes a DEFECT_OPEN finding, or grades the increment — that is the seventh
  Assurance seat's, reserved by PO-DECISIONS-0015 ruling 6. ***

how_the_lane_was_found_and_why_the_record_was_not_believed: >
  Boot returned AMBER / CONTINUITY_MATCH / RESUME_AMBER at `94355a1`. The record's `current_block`
  said instance 2 was DISPATCHED AND OUT with five items outstanding, and `lane_head_sha` stood at
  `314592c` — the dispatch base. **THE DISPATCH PROMPT ORDERS RECONCILIATION WITH SUSPICION BEFORE
  CONTINUATION, SO THE LANE WAS MEASURED BEFORE THE RECORD WAS ACTED ON**, and the lane was FIVE
  COMMITS AND ZERO DIRTY LINES AHEAD of what the record claimed.
  **THE SIGNAL THAT SAID "LOOK HARDER" WAS A ZERO-BYTE FILE.** `.wo2r3j-run-1.log` is 0 bytes and
  its runner recorded `rc=124` at 04:41:04Z — a seat that produced no narration at all. Had that
  been read as "the seat did nothing", the conclusion would have been exactly backwards. **THE
  NARRATION DIED; THE WORK DID NOT.** The commits' own timestamps and `git reflog show wo-2r3`
  place all five INSIDE the LATER `wo2b` attempt-1 window, which is how the two facts were
  reconciled: the `wo2r3j` runner is not the run that produced this work.
  PBG-CONT-007 is the whole lesson and it is now demonstrated from the failing side: **a sub-agent
  result that exists only in conversation is not project state.** The seat obeyed "commit as you
  go" and its work survived a Project Lead's death because of it.

