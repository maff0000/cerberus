open_and_routed_upward: >
  **THE PLANT-DRIFT FINDING IS OPEN AND IT IS NOW FOUR INCREMENTS OLD.** A plant that stops
  applying is invisible to EVERY instrument this project runs at a boundary — the suite does not
  apply plants, the twelve register checks do not, the Class-2 sweep does not. Four increments have
  broken a plant and found out only because somebody re-ran the set by hand. **CARRIER: NOT PROVED
  TO BE CARRIED ANYWHERE.** The seat could not repair it: a runner over `plants/` is exactly the
  wrapper PBG-ASSURE-001 forbids an Engineer to write. **THIS IS ROUTED UPWARD, NOT PARKED.**
  **THE STALE DISPOSITION REGISTER (`SCOPE_INSUFFICIENT`, one file) IS ROUTED UPWARD AS A PRODUCT
  AUTHORITY QUESTION.** The seat did the right thing and the right thing leaves the board red;
  clearing it requires touching a file no seat's scope contains.
  `CD-RT-003-GRANT-MATRIX-LIVE` is still decoration — no credentials on this host, **AND NONE
  GUESSED.**

