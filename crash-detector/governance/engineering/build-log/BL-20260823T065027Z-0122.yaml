the_thing_the_seat_did_that_this_record_will_not_let_pass_unnamed: >
  **ITEM_3 SHIPPED ITS OWN INSTRUMENT RED, ON PURPOSE, AND SAID SO IN ITS COMMIT SUBJECT.**
  Correcting `F-06-D` at `_Exactly.refusal` and `_EachOf.refusal` moves the source-text keys the
  disposition register is keyed on, so the three declarations go STALE **BY CONSTRUCTION**. The
  register file is in the dispatch's protected scope. The seat records that it CONSIDERED leaving
  the old `in` comparison beside the new `is` comparison so the register key would survive, **AND
  REFUSED IT** — a redundant clause written to keep a register row alive is constructing state so
  a control appears to pass, which is non-waivable in this project's own terms.
  It returned **SCOPE_INSUFFICIENT for exactly one file** instead. **THAT IS THE CORRECT RETURN AND
  IT IS THE ONE THAT COSTS THE SEAT ITS GREEN BOARD.**
  **ITEM_6 CAUGHT ITEM_1 BREAKING A PLANT** — `CD-AC-003/CD-RT-003-ENGINE-NO-WITNESS-REACH.patch`
  stopped applying against ITEM_1's rewritten `engine/evaluate.py`, so its violated arm silently
  became the clean tree and EXITED 0: **a dead plant reporting a pass.** The seat raised it against
  its own work as `CD-ENG-WO2R3-06-F06` and regenerated the patch. **NOT VERIFIED BY THIS SEAT AT
  THIS BOUNDARY** — see the open list below. It is recorded as the seat's claim, attributed.

