# ---------------------------------------------------------------------------------------------- #
the_false_positive__DIAGNOSED_NOT_ASSUMED:
  where: 'tests/test_tree_fingerprint.py:61, rule `execution interface declared in prose (docstring or string literal)`.'
  the_sentence: 'a docstring saying, of a governance record telling a person to run a test, that the record ORDERS the auditor to do it.'
  why_it_fired: >
    The first of those two words is in `TRANSMISSION_VERBS` and the second is in
    `TRADEABLE_NOUNS`, so L3's **pattern A** — a transmission verb, at most three words of
    filler, a tradeable noun — read them as a claim about what the code does. **IN THAT SENTENCE
    THE FIRST WORD IS A NOUN AND THE SECOND IS A VERB: THE TWO ROLES THE PATTERN ASSIGNED ARE
    EXACTLY SWAPPED.**
  measured_by_me_at_the_base: '`python3 -B tools/register/check_no_execution_interface.py --root .` in the lane at `314592c`: **EXIT 1, 1 violation, scanned 114 files, 60360 assertions.** The dispatch quotes 113/59848 at `4410275`; the difference is item 5''s carrier file, and this is my own measurement and not a transcription (CD-RULE-009).'

# ---------------------------------------------------------------------------------------------- #
what_changed_in_the_code_path:
  the_one_line_that_decides: '`tools/register/_broker_vocabulary.py` — pattern A now `continue`s on a candidate transmission verb when `_is_nominal_after_a_determiner(words, index, bool(destination))` says the word is a NOUN.'
  the_rule_and_it_is_GRAMMATICAL_AND_NOT_A_WORD_BAN: >
    **A determiner introduces a NOUN PHRASE, so the word immediately after it is that phrase's
    head noun and not the sentence's finite verb.** That is the whole of it. The correction reads
    English grammar rather than banning a spelling, which is why the paired arm below survives it.
  the_three_narrowings_that_bound_it__EACH_WITH_ITS_OWN_ARM:
    - '**(i) THE DETERMINER SET EXCLUDES EVERY DETERMINER THAT CAN ALSO BE A SUBJECT PRONOUN** — `this`, `that`, `these`, `those`, `each`, `one`, `some`. `DETERMINERS_THAT_CANNOT_BE_A_SUBJECT` is eleven words and every one of them is a pure determiner.'
    - '**(ii) A PARTICIPIAL OR GERUND FORM IS UNTOUCHED.** The suppression applies only to a bare or `-s` form — the form that is also a noun.'
    - '**(iii) THE SUPPRESSION DOES NOT APPLY AT ALL TO A SENTENCE THAT NAMES A PARTY WHICH ACTS ON INSTRUCTIONS.** **THIS ONE EXISTS BECAUSE THE RESIDUE WAS MEASURED AND NOT REASONED ABOUT:** with only (i) and (ii), the suppressed shape with a broker named in it went CLEAN. I ran it, saw it, and added the condition. This product has no reason to name a broker, a venue or a counterparty, so a sentence that names one is never given the benefit of a grammatical doubt.'

# ---------------------------------------------------------------------------------------------- #
the_contrast_the_ruling_made_the_CONDITION_of_the_correction__BOTH_ARMS_ONE_AXIS:
  the_axis: '**ONE VARIABLE: whether a SUBJECT NOUN stands between the determiner and the transmission verb.** Nothing else differs between the baseline arm and the paired violated arm.'
  the_command: 'PYTHONPATH=tools/register python3 -B -c "from _broker_vocabulary import judge_prose; ..." — and, at the instrument, `python3 -B tools/register/check_no_execution_interface.py --root <tree>`'
  both_arms_both_results: |
    clean   BASELINE — the sentence the register shipped RED on
    FIRES   PAIRED   — the same determiner, verb and noun WITH A SUBJECT NOUN INSERTED
    FIRES   the ordinary active-voice declaration
    FIRES   the CD-PL-F32 archetype ("Route an order to the broker for execution")
    FIRES   `This` as the determiner        (narrowing (i) — it is also a subject pronoun)
    FIRES   `Each` as the determiner        (narrowing (i))
    FIRES   the suppressed shape WITH a party named   (narrowing (iii) — WAS CLEAN BEFORE IT)
    FIRES   a participial form after the determiner   (narrowing (ii))
    FIRES   the PASSIVE pattern              (untouched)
    FIRES   the NOMINALISED pattern          (untouched)
    FIRES   the TRADE-LIFECYCLE pattern      (untouched)
  and_the_same_contrast_AT_THE_INSTRUMENT_because_a_reading_is_not_a_register_row: |
    tests/test_no_execution_interface_prose.py::test_the_register_row_is_green_and_a_planted_true_declaration_takes_it_red
    ARM 1  the shipped tree, copied whole                                 EXIT 0
    ARM 2  the same tree + ONE comment in src/crash_detector/time_utc.py
           saying in the active voice that the code moves instructions
           to a party that acts on them                                   EXIT 1,
           rule `execution interface declared in prose`
    Each arm reads THAT tree's own copy of the instrument (CD-PL-F98).
  the_carrier_at_the_base: '`tests/test_no_execution_interface_prose.py` in a pristine `git archive 314592c` extraction with only that file added: **3 failed, 10 passed.** The three that fail are the three that describe the CORRECTED behaviour — the baseline arm, the residue arm and the instrument arm. **THE TEN THAT PASS AT THE BASE ARE THE "STILL CAUGHT" ARMS AND THEY MUST PASS AT THE BASE: their whole proposition is that the correction did not move them.** Said plainly rather than presented as ten new passes.'

