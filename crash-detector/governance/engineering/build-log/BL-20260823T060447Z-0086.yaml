A_FINDING_AGAINST_MY_OWN_WORK__CAUGHT_BY_RUNNING_THE_INSTRUMENT_OVER_MY_OWN_CARRIER:
  id: CD-ENG-WO2R3-06-F04
  severity: MEDIUM
  what: >
    **MY FIRST DRAFT OF THE CARRIER PUT ELEVEN TRUE EXECUTION-INTERFACE DECLARATIONS INTO
    `tests/` AND TOOK THE ROW IT WAS CORRECTING RED.** `check_no_execution_interface.py` scans
    `tests/`, and a carrier for the PROSE layer that spells its arms as literal sentences is
    itself prose. MEASURED: `CD-RT-012-NO-EXECUTION-INTERFACE: FAIL — 11 violation(s)`.
  the_two_ways_out_and_why_I_took_the_second: >
    **(1) EXCLUDE THE CARRIER FROM THE CHECK**, on the same declared ground the check already
    excludes `_broker_vocabulary.py` — *"the register's own guards, which must name what they
    forbid in order to forbid it"*. **I REFUSED IT: it widens this guard's blind spot in order to
    test the guard, and it creates a file under `tests/` where a real execution interface could
    sit unread.** (2) **ASSEMBLE EVERY ARM FROM SINGLE WORDS AT RUN TIME.** `_judge_sentence`
    refuses a fragment of fewer than two words, so a tuple of one-word literals is invisible to
    L3 — and the string handed to `judge_prose` is byte-for-byte the sentence, built one word
    earlier. **NO ARM IS WEAKER FOR IT AND THE GUARD LOSES NOTHING.**
  why_it_is_recorded_rather_than_only_fixed: 'It is part of the declared limit now, in all three CD-RULE-004 places: the next seat that writes a prose carrier will hit the same wall, and the record should tell it which way out this project took and why.'

