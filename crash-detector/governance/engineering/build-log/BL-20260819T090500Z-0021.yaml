action_summary: >
  PO Ruling 3 executed. All 24 commits of main..wo-2-skeleton were re-authored from the ambient
  human identity to CD-ENG-WO2-01 <cd-eng-wo2-01@seats.crash-detector.invalid>, in BOTH the author
  and the committer field. The lane head moved 66681b2 -> ee8be6b. The full OLD -> NEW map, the
  method, the proofs and the disclosures are in governance/continuity/WO-2-LANE-SHA-MAP.md.

  The claim that is easy to make and hard to prove — "nothing but identity changed" — was PROVED
  BEFORE ANY REF WAS MOVED, by six checks over all 24 commits, and then cross-checked against an
  artefact written by a seat that had no part in this: the tree fingerprint the FIRST AUDITOR
  recorded for the target it examined. Recomputed from a fresh extraction of the NEW head over 271
  files, it MATCHES 08a474e8ae1aa41b8704c27778ade58353258d90768301958db7b92c4b275ad2 exactly. The
  re-authored lane is byte-identical to the tree an independent auditor actually read, so the AMBER
  verdict still attaches to this content and the target was not moved out from under the audit.

method:
  what_was_declined_and_why: >
    `git filter-branch` and `git filter-repo` were BOTH DECLINED. Each rewrites messages and metadata
    through a normalising pipeline, and each would have left the "nothing else changed" claim resting
    on the tool's good behaviour rather than on a comparison. filter-branch additionally prints its
    own warning about mangled rewrites, and filter-repo expects a fresh clone and rearranges refs.
    Neither risk is worth taking on a governed lane with three live worktrees.
  what_was_done_instead: >
    Each commit object was REBUILT BY HAND and written with `git hash-object -t commit -w --stdin`:
    the `tree` line copied VERBATIM, so content equality is not compared — it is THE SAME OBJECT;
    the `parent` line relinked to the new predecessor; the author and committer identities substituted
    while the trailing `<unix-timestamp> <tz>` was copied verbatim from the stored line; and the
    message copied as RAW BYTES after the header terminator. The rebuilder RAISES on any header field
    other than tree/parent/author/committer. All 24 commits were checked beforehand and carry exactly
    those four — measured, not assumed.
  first_attempt_discarded:
    what: >
      A first pass used `git commit-tree`. It APPENDS A NEWLINE to a message that does not end in
      one, so all 24 rebuilt messages differed from their originals by exactly one trailing byte.
    how_it_was_caught: >
      By the byte-comparison check itself, which reported 24 of 24 MSG MISMATCH. The record had
      already said "byte-for-byte", so a one-byte difference is a failure of the stated claim even
      though no human would ever notice it.
    disposition: >
      DISCARDED BEFORE ANY REF WAS MOVED. Its 24 orphaned commit objects are unreferenced and will be
      garbage-collected; no ref, branch, tag or worktree ever pointed at them. Reported here because
      the check that caught it is the reason it was not shipped, and a verification step that never
      reports anything is a verification step nobody should trust.

