THE_EXCLUSION_IS_ONE_CLAUSE_AND_IT_IS_BUILT_AND_READ_NOT_ASSERTED:
  the_clause: >
    Walk `__mro__` for the base that imposes an instance `__dict__`; **BUILD A THROWAWAY SUBCLASS OF
    THAT BASE AT RUN TIME through the base's own metaclass protocol, declaring `__slots__ = ()`; READ
    the resulting `__dictoffset__`.** Exclude only if that number is non-zero AND the base is
    OUTSIDE this package — **because a base we own carrying a `__dict__` is our defect to fix and
    never our exclusion to claim.**
  what_it_measured: |
      EXCLUDED, 43 class(es): __dict__ imposed by builtins.BaseException; probe __dictoffset__ == 16
      EXCLUDED,  5 class(es): __dict__ imposed by enum.Enum;             probe __dictoffset__ == -48
      (Python 3.11.2, printed by the check with the interpreter version beside it.)
  there_is_NO_LIST_ANYWHERE_IN_THE_FILE: >
    No list of excluded classes, no list of excluded bases, no list of excluded modules.
    **"It is `AdmissionFault`" is a list entry. "A probe subclass of its base still reports
    `__dictoffset__ == 16`" is a measurement.** If a future interpreter makes such a base sealable,
    the check requires the seal of those 48 on the very next run with NO EDIT TO ANY FILE.
