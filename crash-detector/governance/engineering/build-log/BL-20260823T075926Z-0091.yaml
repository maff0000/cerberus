FINDINGS_AGAINST_MY_OWN_WORK:
  CD_ENG_WO2R3_07_F06__HIGH__MY_OWN_INSTRUMENT_SCORED_THE_FALSE_GREEN_I_FOUND_AS_SEALED: >
    **THE INSTRUMENT BUILT TO CATCH THE `__setstate__` HOLE DID NOT CATCH IT.** Its `R4` offered a
    MAPPING state keyed by the class's own field names. CPython's `_dataclass_setstate` is
    `for field, value in zip(fields(self), state)` — **IT ZIPS** — so iterating a mapping yields its
    KEYS, and `StalenessWindow.__setstate__({'seconds': FORGED})` sets `seconds` to the string
    `'seconds'`. The object IS forged; the marker the check reads back is not there; the check
    printed `forged value readable False` and scored the class **SEALED**. At the base SHA it
    reported **17 SEALED / 34 OPEN**; with `R5` (a SEQUENCE state) added it reports **15 SEALED /
    36 OPEN**, and the 36 match the 36 classes PART A sealed exactly.
    **A ROUTE THAT FAILS FOR THE WRONG REASON SCORES A CLASS CLOSED — THE `CD-ENG-WO2R3-F12`
    STANDARD FAILING INSIDE THE INSTRUMENT WHOSE HEADER CITES IT.** Found by running the
    counterfactual and refusing to accept a number I could not derive twice, not by reading the
    code. **BOTH SHAPES ARE NOW IN THE SET** because both exist here: `DialMagnitude.__setstate__`
    and `DeclaredQuantity.__setstate__` INDEX BY NAME and need the mapping; the stdlib one ZIPS.
    Carried by `test_the_setstate_sibling_is_refused_in_BOTH_of_its_state_shapes`.
  CD_ENG_WO2R3_07_F07__MEDIUM__MY_FIRST_EXCLUSION_PROBE_REPORTED_ITS_OWN_DEFECT_AS_THE_SUBJECTS: >
    `type(base)(name, (base,), {"__slots__": ()})` with an ORDINARY DICT returns
    `AttributeError: 'dict' object has no attribute '_member_names'` for `enum.Enum`, because
    `EnumMeta.__prepare__` returns an `_EnumDict`. Five classes were reported **UNMEASURABLE** —
    honest, and not an answer. **AN INSTRUMENT THAT REPORTS UNMEASURABLE BECAUSE IT CALLED THE WRONG
    CONSTRUCTOR HAS MEASURED ITS OWN DEFECT AND LABELLED IT A PROPERTY OF THE SUBJECT.** Fixed by
    asking the metaclass for its own namespace via `__prepare__`, which is the general form; the
    `UNMEASURABLE` verdict remains live and remains a violation. Recorded rather than quietly fixed.
  CD_ENG_WO2R3_07_F08__MEDIUM__A_FINDING_AGAINST_THE_DISPATCH_ITSELF: >
    **HEADER ITEM 4 SAYS THE `--why` OUTPUT "HAS AT LEAST THREE LINE FORMS AND NOBODY HAS ENUMERATED
    THEM". THERE ARE SIX, AND THE PROJECT LEAD'S HANDED-OVER REGEX SURVIVES BY ACCIDENT.** The sixth
    form is `ESTABLISHED_HERE: <path>:<line> <Class>.<field>`; the regex's trailing
    `[A-Za-z_][A-Za-z0-9_]*` stops at the `.`, so it contributes `FetchedResponse` — a name already
    in the set — and the count stays 99. **CHANGE THAT LINE FORM TO PRINT
    `<Class>_<field>` AND THE ENUMERATION SILENTLY GAINS THREE ENTRIES.** This check does not use
    the regex at all — it reuses `_classes()` — so it is not exposed; the DISPATCH'S OWN
    RECONCILIATION COMMAND IS.
  CD_ENG_WO2R3_07_F09__LOW__THE_INSTRUMENT_HAS_A_SECOND_SET_THIS_PROJECT_WOULD_NORMALLY_REMOVE: >
    `ROUTES` is a dictionary of five named routes. **IT IS A VOCABULARY**, exactly as
    `check_judgement_path_doors`'s package list is, and it is declared as one in DECLARED LIMIT 2 in
    all three places. The difference from an exclusion list is real and is worth stating: **a
    vocabulary of ATTACKS errs toward missing a violation; a vocabulary of EXEMPTIONS errs toward
    inventing a pass.** The first is a limit; the second is what `PO-DECISIONS-0012` ruling 2
    forbids. This file has the first and, deliberately, none of the second.
  CD_ENG_WO2R3_07_F10__LOW__THE_CARRIER_TESTS_RUN_FAST_ENOUGH_TO_DESERVE_SUSPICION: >
    Nine tests, four of which copy `src/` and `tools/` and run a subprocess, complete in **0.93 s**.
