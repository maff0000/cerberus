HOW_THE_ENUMERATION_IS_DERIVED__THE_DISPATCH_REQUIRED_THIS_TO_BE_SAID:
  which: >
    **REUSED, NOT COPIED AND NOT REIMPLEMENTED.** The check IMPORTS
    `check_constructor_field_establishment` FROM THE SUBJECT TREE and calls that instrument's own
    `_classes()` over the same file set. A hard-coded list of 99 names is a transcription that rots
    at the next class anyone adds; a reimplementation of its traversal is a second opinion
    pretending to be a first.
  and_the_second_derivation: >
    A `vars()` descent over the IMPORTED modules, at any nesting depth, recording every class whose
    `__module__` is that module. **ONE READING IS OF THE SOURCE TEXT AND THE OTHER IS OF THE LIVE
    OBJECT GRAPH** — which is the independence the sibling's own two derivations cannot have,
    because both of those read `ast`.
  WHAT_HAPPENS_WHEN_THEY_DISAGREE: >
    **IT IS A VIOLATION AND NEVER A RECONCILIATION.** The check does not adopt the source reading,
    does not adopt the live reading, does not take the union and does not take the intersection for
    its verdict: it measures the intersection and FAILS on the difference, printing both directions.
    A class inside `if False:` is in the source and not live; a class built by `type(...)` is live
    and in no source reading. **CARRIED:**
    `test_a_class_built_by_type_at_module_level_makes_the_two_enumerations_disagree` appends
    `Smuggled = type("Smuggled", (object,), {...})` to a throwaway tree and requires EXIT 1 with
    `ENUMERATIONS DISAGREE` and `LIVE AND NOT IN THE SOURCE: 1`.
  and_it_imports_where_its_sibling_parses__DECLARED_LIMIT_1: >
    The sibling PARSES so an auditor who trusts nothing can run it on a tree they extracted.
    **THIS CHECK CANNOT: THE PROPERTY IS A RUNTIME PROPERTY.** `__dictoffset__` is a C-level slot;
    `__setstate__` is installed by `dataclasses._add_slots` AFTER the class body is read; and
    "executes no package code" is a statement about execution, measured with `sys.settrace`. A tree
    that does not import is a tree this check REFUSES on (exit 3), never one it passes. CD-PL-F98 is
    answered structurally: every already-imported `crash_detector*` module is evicted, the subject's
    paths go to the front of `sys.path`, and **each imported module's `__file__` is asserted to
    resolve under `--root`** or the check refuses.

