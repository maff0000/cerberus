cause:
  what_happened: >
    The figures for required-tests.yaml and the constructor execution contract were read AFTER the
    DECLARED LIMIT 1 supersession was written and BEFORE the last two CD-PL-F91 corrections were
    made. Those corrections inserted 8 and 9 lines ABOVE the cited positions, in the SAME COMMIT
    that landed the entry. The entry was therefore internally consistent at the moment it was
    drafted and wrong at the moment it was committed.
  why_it_is_not_excused_by_that: >
    A record's figures are true or false AT ITS SHA, not at the moment its author typed them. The
    seat had already raised CD-ENG-WO2R3-F23 against itself for exactly this and did not then
    re-read the figures after its own last edits. **THE RULE THIS SEAT IS ADOPTING FOR ITSELF AND
    WRITING DOWN SO IT CAN BE HELD TO IT: any line number in a record is re-read from the artefact
    AFTER the last edit to that artefact and BEFORE the commit that lands the record, and never
    once before.**
  scope_of_the_defect: >
    LINE NUMBERS ONLY. Every OTHER figure in BL-...-0066 — the population counts, the assertion
    counts, the exit codes, both arms of the contrast, the node-id sets, the plant and variant
    corpus tallies, the sweep readings — was produced by RUNNING the command recorded beside it at
    the SHA named, and none of them is positional. **THIS CORRECTION DOES NOT REACH THEM AND DOES
    NOT CAST DOUBT ON THEM**; the seat states that as a bounded claim rather than leaving a reader
    to wonder how far the defect goes.

