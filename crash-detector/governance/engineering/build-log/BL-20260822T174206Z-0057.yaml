a_question_for_the_product_authority_CD_D_127: >
  **WHERE DO THE ELEVEN CLASS-2 SWEEP DISPOSITIONS BELONG IN THE PATH TO THE GATE?**
  THE FACTS, MEASURED: the sweep exits 1 at 995ec3e, 04cdd34 and 4ac159e with 514 sites and 11
  violations; all eleven are `crash_detector.admission`, the module increment 2 created; it is NOT a
  declared register command and NO GATE CRITERION DEPENDS ON IT; nothing became unguarded; and the
  instrument is behaving exactly as designed — it denied by default and said so on every run.
  **(A) A SIXTH INCREMENT, after increment 5, before the fourth Assurance seat.** Clean, but it is a
  FOURTH scope enlargement of a dispatch the Product Owner has already priced three times, and it
  delays the seat that three gate failures are waiting on.
  **(B) FOLDED INTO INCREMENT 5.** The Project Lead RECOMMENDS AGAINST. Increment 5's subject is
  body-borne field establishment on judgement-path TYPES; these are `isinstance`/`getattr` sites
  inside the admission MECHANISM. Folding one into the other because both are "type checks" is the
  enumeration-versus-class error in its other direction, and it would widen a scope the Product Owner
  re-based ONE BOUNDARY AGO.
  **(C) NOT BEFORE THE GATE. DECLARED IN ALL THREE CD-RULE-004 PLACES — WHICH INCREMENT 4 HAS
  ALREADY DONE, with the bisect table written into the register — AND THE FOURTH ASSURANCE SEAT
  ATTACKS IT AS A NAMED TARGET; the dispositions are written AFTER, informed by that seat's verdict.**
  **THE PROJECT LEAD RECOMMENDS (C), AND STATES THE REASONING SO IT CAN BE OVERTURNED ON IT.** The
  eleven dispositions are substantive governed claims about how a deciding operand is established,
  and they would be authored BY THE SEAT THAT WROTE THE MODULE THEY DESCRIBE. Writing them first
  hands the independent auditor a set of assertions made by the party it most needs to check, and an
  auditor that starts from the implementer's own dispositions is reading a map drawn by the person
  who chose the route. CD-ENG-WO2R3-F10 already warns that the `ESTABLISHED_HERE` set doubled 8 -> 16
  and that REVIEWER ATTENTION IS THE WHOLE CONTROL; eleven more written claims spend that attention
  before the auditor arrives. Under (C) the failing instrument is not hidden — it is DECLARED, with
  its bisect, and it becomes something the auditor tests rather than something it inherits.
  **AGAINST THE PROJECT LEAD'S OWN RECOMMENDATION, STATED SO IT IS NOT BURIED:** (C) means the fourth
  Assurance seat boots into a tree where a governed instrument exits 1, and a seat that reads exit
  codes before it reads declarations will call that RED on sight. That is a real cost and it is the
  strongest argument for (A).
  **THIS QUESTION IS NOT BLOCKING INCREMENT 5**, which is dispatched on the Product Owner's existing
  bounds and is untouched by all three answers.

