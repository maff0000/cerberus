findings_raised_by_the_project_lead_at_this_boundary:
- id: CD-PL-F84
  severity: LOW
  title: 'A FOURTH ROUTE THROUGH DECLARED LIMIT 6 — AND IT NEVER TOUCHES THE PACKAGE.'
  how_it_was_found: >
    THE INCREMENT'S OWN REWORDING ASKED FOR IT. DECLARED LIMIT 6 now says: *"anyone reading this
    should assume there is a fourth and should look for it rather than check this list."* The Project
    Lead read that sentence and went looking. That the dare paid out ON ITS FIRST READING is the
    strongest available evidence that the rewording was the right remedy.
  the_route: >
    `admits` compiles its declaration against whatever object the type name is bound to AT DECORATION
    TIME, and decoration happens AT IMPORT. So: substitute the module the declared type is imported
    FROM, BEFORE the package is imported. `sys.modules["datetime"] = <forgery>` — ONE line, run
    OUTSIDE the package, touching nothing inside it.
  measured: >
    Probe `governance/reconciliation/WO-2R3/PL-AA1-module-substitution-before-import.py.txt`, two
    arms in one script, at 4ac159e.
    CONTROL: the door requires exactly `datetime`; a genuine `datetime.datetime` is **ADMITTED** and
    the forgery is **REFUSED**.
    POISONED: the door requires exactly `ForgedDatetime`; **the genuine `datetime.datetime` is
    REFUSED and the forgery is ADMITTED.** THE DOOR IS INVERTED, and it never stopped working — it
    worked perfectly against the wrong type.
  why_it_is_not_a_restatement_of_route_c: >
    CD-PL-F83's route (c) rebinds a name INSIDE the package AFTER import. This one never touches the
    package. The limit's framing — *"anything that can execute code inside this package can reach
    them"* — states an ENTRY CONDITION STRICTER THAN THE ONE THIS ROUTE MEETS. The routes-list
    sentence is not false, because it is scoped to "every route above"; the surrounding framing is
    the part that undersells.
  it_cuts_the_other_way_too: >
    RECORDED BECAUSE IT FAVOURS THE MECHANISM: unlike route (a2), this route leaves the introspection
    surface TRUTHFUL — `describe()` reports `ForgedDatetime`, so a reviewer who asks the door what it
    requires IS TOLD. CD-ENG-WO2R3-F13's lie is a property of (a2), not of `admits`.
  a_first_attempt_that_proved_nothing_is_recorded_too: >
    `PL-AA0` compared the door's declaration object to the type BY IDENTITY and got False in BOTH
    arms — which reads exactly like a refusal and is not one. The declaration is an `_Exactly`
    wrapper, not the type. IT IS KEPT because a probe that reads a refusal off the wrong object is
    the failure mode most likely to produce a false clean arm, and the exclusion set is worth more
    with the trap in it.
  severity_reasoning_and_remedy: >
    **LOW, AND THE REMEDY IS A REWORDING AND NOT A GUARD (CD-D-080).** Pre-import module substitution
    defeats every in-process guard ever written, in this codebase or any other; a guard against it
    would be theatre. It does NOT defeat BP-AMENDMENT-0001 §D.3 part 1, whose claim is about what a
    CALLER of `collect` can supply — a caller cannot reach `sys.modules` through a parameter. It
    breaks no criterion. **What is owed is that the limit stop implying a stricter entry condition
    than it has** — the FIFTH instance of this project's recurring documentary defect, a declaration
    narrower than its measured reach. Joins CD-D-111. NOT owed at this boundary and NOT dispatched.

- id: CD-PL-F85
  severity: LOW
  title: 'EVERY IDENTITY AUDIT WRITTEN INSIDE A BUILD LOG ENTRY IS STRUCTURALLY UNABLE TO COVER ITS OWN BOUNDARY.'
  the_finding: >
    `BL-20260822T173220Z-0064.yaml` line 72 records
    `git log --format='%an <%ae> | %cn <%ce>' 04cdd34..HEAD -> ALL FOUR commits read ...`. It was
    TRUE WHEN WRITTEN. Two commits landed after it — 9d2a749 (the entry itself) and 4ac159e (its
    CD-RULE-007 follow-up) — so the entry's own identity audit **cannot ever have covered the
    boundary the entry closes**. THIS IS NOT THE SEAT'S CARELESSNESS AND IT IS NOT SPECIFIC TO THIS
    ENTRY: CD-RULE-007 exists precisely because a commit cannot name its own SHA, and by the same
    argument an entry cannot audit the commits that carry it. **THE SAME DEFECT IS PRESENT IN THE
    PROJECT LEAD'S OWN ENTRIES, INCLUDING THIS ONE.**
  the_seat_disclosed_it_and_disclosed_it_in_the_wrong_place: >
    The seat noticed and said so IN ITS RETURN — "I could not correct it without editing a landed
    entry." **The judgement was right and the destination was wrong:** a disclosure that exists only
    in a seat's return is not project state (PBG-CONT-007), and this boundary is the only reason it
    survived. It is now recorded here, which is where a correction belongs — corrections supersede,
    never edit (PBG-CONT-003, non-waivable), and the seat was RIGHT not to edit BL-0064.
  the_correction_of_record: >
    **THERE ARE SIX COMMITS IN INCREMENT 4, NOT FOUR, AND ALL SIX CARRY THE SEAT IDENTITY AS BOTH
    AUTHOR AND COMMITTER.** Measured by the Project Lead with
    `git log --format='%an <%ae> | %cn <%ce>' 04cdd34..HEAD | sort -u` -> ONE LINE. The entry
    UNDERSTATES its own coverage; it does not overstate it.
  remedy: >
    DOCUMENTARY, and a WORDING CONVENTION rather than a mechanism: an in-entry identity audit should
    read "all N commits AS AT THIS ENTRY", and the audit that covers the boundary is the RECONCILING
    party's, which is a different seat — which is also the only construction that satisfies
    PBG-SOD-001 in spirit. Joins CD-D-111's family. NOT owed at this boundary.

- id: CD-PL-F86
  severity: MEDIUM
  title: 'THE PROJECT LEAD RECONCILED TWO INCREMENTS WITHOUT RUNNING AN INSTRUMENT THAT WAS FAILING, BECAUSE ITS METHOD ONLY EVER RAN THE REGISTER.'
  raised_against: 'THIS SEAT. It is the second half of CD-ENG-WO2R3-F15 and it is accepted without qualification.'
  the_finding: >
    BL-20260822T145... (increment 2) and BL-20260822T163432Z-0055 (increment 3) both recorded
    "10 of 11 register checks exit 0" as the instrument sweep. **THE CLASS-2 DELEGATED-JUDGEMENT
    SWEEP IS NOT A REGISTER CHECK**, so it was never in the set, so it was never run — while it was
    exiting 1 at both SHAs. The Project Lead's own reconciliation standard says "the plants
    apply-checked, at least one route of the Project Lead's own that is in no corpus, and what was
    not verified said plainly", and an instrument OUTSIDE the register fell between all three.
    IT TOOK AN ENGINEER SEAT AUDITING ITS OWN PAST WORK TO FIND IT.
  the_generalisation_that_matters: >
    The defect is not "one missed command". It is that the Project Lead's sweep was defined by a
    LIST — `tools/register/check_*.py` — and the thing that broke was outside the list. **THAT IS
    EXACTLY THE DEFECT THE PRODUCT OWNER RULED ON AT PO-DECISIONS-0008 RULING 2 ONE BOUNDARY AGO:
    "an enumeration cannot close a property-defined class."** The Product Owner applied it to
    increment 5's subject types; it applies equally to the Project Lead's instrument sweep, and the
    Project Lead did not notice that its own method had the same shape as the ruling it had just
    recorded.
  remedy_proposed_not_taken: >
    The reconciliation sweep should be defined by a PROPERTY — every executable instrument in the
    tree that a governed document cites as producing a result — ENUMERATED BY AN INSTRUMENT with its
    command and count recorded (CD-RULE-009), not by a glob over one directory. NOT BUILT HERE:
    building it is engineering work, this boundary is a reconciliation, and the Project Lead
    inventing itself a new instrument mid-reconciliation is how scope creeps. **RECORDED AS OWED,
    AND IT SHOULD BE READ ALONGSIDE CD-D-127.**
  what_was_done_here_instead: >
    At THIS boundary the Project Lead ran the sweep explicitly, at FIVE SHAs, and every register
    check, and the eleven plants on both arms. That is a patch on one instance and NOT the remedy.

