risks:
  - "F1 — AMBER, AND THE ONE THAT MATTERS. A CALM-OVER-UNKNOWN TREE THAT THE ENTIRE REGISTER CANNOT SEE. Tree /tmp/asr05/E3: a fourth branch `dial_reading_unknown_hinted` appended to #/$defs/dial_reading.oneOf on BOTH contracts, permitting #/$defs/detail_level on state UNKNOWN and requiring a marker property `render_hint` which is also added to the parent dial_reading.properties. NO new ROOT key is added, so check_schema_closed's root-properties allowlist — the thing that catches E1 — does not fire. MEASURED, three ways: (i) `python3 tools/register/check_missing_data_never_calm.py --root .` -> `CD-RT-001-MISSING-DATA-NEVER-CALM: PASS — 67 assertions, 0 violations`; (ii) all 30 `execute:` lines run verbatim, `diff /tmp/asr05/base.txt /tmp/asr05/e3.txt` -> EMPTY, no line's exit code moves at all; (iii) the live gate, driven directly: `refuse_unless_publishable({... equity_crash: {state: UNKNOWN, reason: NO_SOURCE_REGISTERED, since_utc: ..., missing_inputs: [], detail_level: 'calm', render_hint: 'COMPACT'} ...})` returns None on public AND on private — *** ADMITTED: UNKNOWN dial rendering as calm ***. CAUSE: _dial() hard-codes one document shape per state and the check never enumerates the union's oneOf branch set, so a branch it did not write cannot be driven. This is CD-PL-F169 / CD-ASR-WO3-02 F06-F07 / CD-ASR-WO3-03 / CD-ASR-WO3-04 F2 one level up. PRESCRIPTION, NOT APPLIED: after slots are enumerated, resolve schema['$defs']['dial_reading']['oneOf'], and for every branch whose properties.state.const is in ABSENT_STATES build a minimal instance from THAT BRANCH'S OWN required+properties and assert calm is REFUSED; separately assert the resolved branch set equals a declared allowlist, or push that structural half into check_schema_closed, which today allowlists ROOT properties only and nothing inside $defs. I did not write either line."
  - "F2 — AMBER, AND IT IS A FALSE STATEMENT IN TWO GOVERNED ARTEFACTS. Tree /tmp/asr05/E2: `detail_level` removed from the `required` list of dial_reading_unknown AND dial_reading_degraded on BOTH contracts; the branch $ref narrowing is left fully intact. MEASURED: instrument -> `PASS — 67 assertions, 0 violations`; and the live gate ADMITS a dial `{state: UNKNOWN, reason: ..., since_utc: ..., missing_inputs: []}` with NO detail_level key at all, on public AND private. required-tests.yaml's negative_control for THIS row names as a member of the violation class 'the branch detail_level requirement dropped so that the parent dial_reading's full-vocabulary property is what applies', and then asserts 'The instrument fails on all of these'; contracts/execution/CD-RT-001-MISSING-DATA-NEVER-CALM.md says the same in the same words. IT DOES NOT FAIL. (The OTHER reading of that clause — the branch's properties.detail_level narrowing deleted while `required` is kept — IS caught, 40 violations, because additionalProperties:false then makes every absent-data dial unrepresentable. Measured at /tmp/asr05/E2b. So the sentence is true under one reading and false under the other, and the false one is the one an editor would actually make.) THE INSTRUMENT IS STRICTLY WEAKER THAN WHAT IT WAS BUILT TO SUPERSEDE: tests/test_detail_level.py::_assert_missing_data_never_renders_as_calm already asserts `_dial_with_level(builder, None) == REFUSED` and `_dial_with_level(builder, 'banana') == REFUSED` for both branches on both surfaces, and CD-ASR-WO3-04's 30-row probe covered {absent, banana} too. Both rows were dropped when the property was moved into the register-wired instrument. NOT A HOLE IN THE REGISTER — the pytest line 16B grew DOES catch E2 (3 failed / 49 passed) — but a hole in the instrument, and a claim in the record that is not true. PRESCRIPTION, NOT APPLIED: add `None` (field absent) and one off-vocabulary string to _expectations as MUST REFUSE rows; _dial() already takes `level` and would need only to omit the key when it is None. CD-CALM-PAIRED-004's one-pointer diff still works for the off-vocabulary row and needs a stated exception for the absent row. I did not write it."
  - "F3 — AMBER. DECLARED LIMIT 4 IS FALSE AS WRITTEN, IDENTICALLY IN ALL THREE PLACES CD-RULE-004 REQUIRES IT TO BE SAID: the instrument header ('so a third surface or a third dial added tomorrow is driven on the day it is added'), the required-tests.yaml comment, and contracts/execution/CD-RT-001-MISSING-DATA-NEVER-CALM.md ('so a third surface or a third dial is driven on the day it is added'). Tree /tmp/asr05/E1: a THIRD dial slot `credit_stress`, OPTIONAL (absent from `required`, which is exactly how one adds a dial without breaking existing consumers), whose property value is {\"$ref\": \"#/$defs/dial_reading_permissive\"} — a union carrying the full vocabulary on its DEGRADED and UNKNOWN branches. MEASURED: instrument -> `PASS — 67 assertions, 0 violations`; live gate ADMITS credit_stress = {state: UNKNOWN, ..., detail_level: 'calm'} on BOTH surfaces. The slot enumerator requires `sub.get('$ref') == '#/$defs/dial_reading'` EXACTLY, so any other spelling is invisible. NOT A REGISTER HOLE: check_schema_closed catches E1 — `UNDECLARED KEYS PRESENT: credit_stress`, 2 violations, exit 1, the ONLY line in the whole register that moves. And a REQUIRED third slot in any spelling is caught by the instrument itself, because its candidates would then be missing a required property (measured at /tmp/asr05/E1b: 22 violations). So the exposure is narrow — an OPTIONAL slot, unusually spelled — but the LIMIT AS DECLARED promises something the code does not do, and this project grades the declaration. PRESCRIPTION, NOT APPLIED: restate limit 4 as 'every top-level property whose value is literally {\"$ref\": \"#/$defs/dial_reading\"}', and add a fail-closed assertion that the enumerated slot set equals the contract's dial-bearing root properties under any spelling. I did not write it."
  - "F4 — AMBER, AND IT WIDENS CD-PL-F180 RATHER THAN DISPUTING IT. A THIRD ROUTE TO AN ADMITTED CALM-OVER-UNKNOWN THAT NEEDS NO ENVIRONMENT VARIABLE AND NO IMPORT FROM OUTSIDE --root. The seat named two routes ($CD_CONTRACTS_DIR; the package imported from outside --root) and the dispatch asked me for a third. THE CONTRACT BYTES ARE READ FRESH ON EVERY CALL AND THE FILES ARE WRITABLE. envelope_contract.load_envelope_schema() does path.read_text() per invocation and holds no cache — deliberately, and the docstring says why. `stat -c '%A %U:%G'` on my extraction: contracts/ drwxrwxr-x root:root, both *.schema.json -rw-rw-r-- root:root, i.e. writable by the account that runs the service. MEASURED IN ONE PROCESS at /tmp/asr05/R3b, with CD_CONTRACTS_DIR unset throughout and contracts_dir() reporting /tmp/asr05/R3b/contracts at both ends: BEFORE -> public REFUSED [SCHEMA_VIOLATION] at /equity_crash, private REFUSED [SCHEMA_VIOLATION] at /equity_crash; the same process then rewrites <root>/contracts/*.json in place; AFTER -> public *** ADMITTED — UNKNOWN dial rendering as calm ***, private the same. The instrument had exited 0 on that tree moments earlier. Its DECLARED LIMIT 1 precondition (`resolved == root/contracts`) is SATISFIED on this route, so exit 3 never fires; and the SHA-256 it prints binds only its own run instant, which makes it a TOCTOU witness rather than a control. MY READING ON §3.4, BOTH LIMBS ARGUED: exit 3 IS the right behaviour for the instrument — a behavioural check that reported on documents it was not looking at would be CD-PL-F98 for the fifth time on this project, and refusing to judge is not the same as being switched off, because it is non-zero, states the reason, and PBG-CI-002 forbids reading it as a skip. It is NOT a guard 'told to call it a precondition', because the instrument never claimed to be the control for that route and says so in limit 1 in all three places. The scheduling of CD-PL-F180 into 16D is therefore RIGHT. What is NOT right is the limit's SCOPE: it is drawn around a variable name, and the route above needs no variable. PRESCRIPTION, NOT APPLIED: 16D must be scoped to the contract BYTES the gate loads at publish time, not to $CD_CONTRACTS_DIR — e.g. pin the expected digests in the application and refuse on mismatch, and/or make the deployed contracts read-only to the service account and evidence it from a running deployment. I did not write it and I did not schedule it."
  - "F5 — RECORDED, NOT GRADED, BECAUSE IT WAS DECLARED. I made the instrument FAIL on a tree that is STRICTLY STRONGER than PID §3.2 requires: /tmp/asr05/F2, absent_data_detail_level narrowed from [elevated, acute] to [acute] on both contracts, so missing data can render ONLY as acute and calm remains unrepresentable. Result: `FAIL — 40 violation(s)`, 28x CD-CALM-GATE-002, 8x CD-CALM-PAIRED-004, 4x CD-CALM-REASON-003. The instrument's rule is 'everything in the vocabulary except calm-on-an-absent-branch MUST BE ADMITTED', which is stronger than the criterion's own words. BUT the row's negative_control declares exactly this outcome — 'any change that makes `elevated` or `acute` stop being admitted on a missing-data branch' is declared to BE a violation of the row — so the behaviour is disclosed, not hidden, and the limit is honestly drawn ON THIS AXIS. I record it so a future seat meeting a red instrument on a tighter tree finds it already measured rather than rediscovering it as a defect. CONTROL, and it is the good news: a SYMMETRIC PID §4 amendment (fourth level `critical` added to DETAIL_ORDER in src/ and to BOTH enums in both contracts, /tmp/asr05/F3) -> `PASS — 81 assertions, 0 violations`. The vocabulary-driven table genuinely grows on the day the vocabulary does, exactly as claimed."
  - "F6 — AMBER, AGAINST THE INCREMENT AND NOT AGAINST THE INSTRUMENT. D3's ADDITIVE GROWTH IMPORTED STRUCTURAL BRITTLENESS INTO THE REGISTER. Tree /tmp/asr05/F4: a pure refactor with ZERO behavioural change — $defs/absent_data_detail_level RENAMED to missing_data_render_level with both branch $refs repointed, its enum REORDERED to [acute, elevated], and the whole $defs mapping REVERSED. calm is still unrepresentable on both absent-data branches on both surfaces. THE NEW INSTRUMENT PASSES IT: 67 assertions, 0 violations — which is the behavioural-not-structural design claim VINDICATED BY MEASUREMENT, and is precisely what a $ref-target-name checker would have failed. BUT THE REGISTER NOW FAILS: line 2 rc=1, 6 failed / 46 passed in tests/test_detail_level.py — test_the_absent_data_branches_declare_a_vocabulary_that_EXCLUDES_calm (both surfaces), test_the_guard_FAILS_when_calm_is_restored_to_a_missing_data_branch (both branches), test_the_guard_FAILS_when_calm_is_restored_to_BOTH_missing_data_branches, test_the_mutated_copy_reproduces_the_RED_and_leaves_the_real_contracts_untouched — all of which read schema keys BY NAME. Before 16B, no `execute:` line ran that file, so this brittleness was not the register's. It is now. §3.3's own warning applies: a guard that fires on correct trees gets disabled, and then it guards nothing. NOT A REASON TO UNDO D3 — D3 is the only thing in the register that catches F2's E2 — but it is a cost the seat did not weigh and did not declare. PRESCRIPTION, NOT APPLIED: this is a Project Lead judgement, not an Engineer fix. Either accept the coupling and record it as a declared limit of CD-RT-001-ABSENCE-RENDERS-UNKNOWN's grown command, or move the name-coupled assertions behind a resolver that follows the $ref instead of matching its target's name. I did not write either."
  - "FINDINGS AGAINST THIS DISPATCH — and it does contain a false statement, as it warned me it would. (i) §3.1, THE PRIMARY ATTACK, PRESUPPOSES ARTEFACTS THAT DO NOT EXIST. It directs me to compare the candidate against 'what src/crash_detector/publication/publish.py and the envelope builders actually emit', and to construct 'a real envelope, produced by the product's own code path rather than by the instrument'. THERE ARE NO ENVELOPE BUILDERS IN src/. publish.py does not emit an envelope: publish_cycle RECEIVES public_envelope and private_envelope as keyword arguments, and it HAS ZERO CALLERS — the product's own source states this at publish.py:129 ('publish_cycle HAS ZERO CALLERS and src/ HAS NO...') and at detail_level.py:123 (CD-PL-F167), and CD-ASR-WO3-04 banked the same fact. `grep -rn 'publish_cycle' src/ tools/ tests/` returns its own def, its __all__, three docstring mentions, and tests/ — nothing else. So §3.1's second bullet is NOT PERFORMABLE at this commit, and the framing 'is the candidate the shape this product actually publishes' has no referent, because THIS PRODUCT PUBLISHES NOTHING. I answered the answerable form instead and said so in the summary. This matters beyond pedantry: the dispatch's own worst case — 'a refusal of a document no code produces' — is UNAVOIDABLY TRUE HERE for every guard on this criterion, including the pytest ones, until a builder exists, and the honest statement is that the CONTRACT is the definition of the published shape at this commit and the instrument judges it faithfully within one hand-written document shape per (state, level). (ii) §2's 'all FOURTEEN register instruments pass on the reverted tree' IS A PARTIAL MEASUREMENT STATED AS A TOTAL (CD-PL-F170). Measured by me on my own extraction of the base 20fd1e1, running every `execute:` line verbatim: there are 15 non-pytest lines; TWELVE exit 0; check_grant_matrix_live.py exits 3, PRECONDITION_NOT_MET, which is not 'passing'; and TWO of them — check_public_artefact_no_private_field.py and check_first_published_immutable.py — NAME FILES THAT DO NOT EXIST IN THE REPOSITORY and exit 2. 'Fourteen' reconciles only as the count of tools/register/check_*.py FILES at base, two of which (check_base_image_digest_pin.py, check_dockerignore.py) no `execute:` line names, so it is a count of a different set than the sentence describes. THE SUBSTANTIVE POINT SURVIVES AND I CONFIRMED IT INDEPENDENTLY AND MORE STRONGLY — E3 is a calm-admitting tree with ZERO register movement — but the number as written cannot be reproduced. NOTE FOR THE RECORD: two register rows naming instruments that do not exist is a separate defect nobody has raised; it is outside 16B and I do not grade it. (iii) §3.5 asks whether the stdlib-only departure is a defect: IT IS FINE. jsonschema==4.10.3 is declared in requirements.txt, in pyproject.toml [project] dependencies, and pinned with hashes in requirements.lock; it is present on the host interpreter (4.10.3 measured); the gate itself cannot run without it; and the instrument exits 3 with the reason rather than passing or skipping if it is absent. The dependency is declared exactly where this project declares dependencies. (iv) §3.5's D3 question, answered: the growth does NOT misstate what CD-RT-001-ABSENCE-RENDERS-UNKNOWN evidences, and I measured rather than agreed — see F6's first half for the cost it DOES carry. (v) I record what the dispatch got RIGHT under attack, because a dispatch is graded both ways: its instruction not to re-run C1-C4 was correct budget discipline and I did not; its §3.4 characterisation of CD-PL-F180 is accurate and I extended rather than corrected it; and its §5 disclosure of CD-PL-F181 meant I did not inherit the 18-versus-16 error — I confirmed 16 criteria UNDECIDABLE on negative_control.evidence_ref and CD-AC-017/CD-AC-018 UNDECIDABLE on an unresolved execution_contract, exactly as §5 states."

