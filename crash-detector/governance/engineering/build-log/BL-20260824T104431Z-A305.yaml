action_summary: >-
  ASSURANCE VERDICT ON INCREMENT 16B ITEM (i) AT cbb81d15dd1ca105c922c15d61d91fc7673e7249 —
  AMBER.

  THE INCREMENT DOES DISCHARGE THE SUBSTANCE OF PO-DECISIONS-0026 RULING 9. The constitutional
  guarantee is now carried by a register-wired instrument that drives the LIVE gate, and the
  register now MOVES on the regressions it was commissioned against. I confirmed that
  independently rather than accepting it. BUT I BROKE THE INSTRUMENT THREE WAYS, AND ONE OF
  THOSE THREE IS INVISIBLE TO THE ENTIRE REGISTER — a tree on which refuse_unless_publishable
  ADMITS an UNKNOWN dial rendering as calm on BOTH surfaces while all thirty execute: lines
  exit byte-identically to the clean tree. That is the exact defect class 16B exists to close,
  rebuilt one level up, and it is why this is not a PASS.

  ROOT CAUSE, ONE SENTENCE, AND ALL THREE ESCAPES ARE IT. The instrument enumerates SURFACES,
  SLOTS and LEVELS from the contract — which is genuinely good design and is what makes it
  survive a rename refactor a structural checker would fail — but it HARD-CODES THE DOCUMENT
  SHAPE. _dial() writes out the field list of each branch by hand and _envelope() fills only
  the slots it enumerated. So the union's BRANCH SET is never enumerated, a slot expressed as
  anything other than the literal {"$ref": "#/$defs/dial_reading"} is never driven, and the
  ABSENCE of detail_level is never driven at all.

  E3 — THE SERIOUS ONE. A fourth branch appended to #/$defs/dial_reading.oneOf, permitting the
  full vocabulary on state UNKNOWN and selected by a marker property (render_hint) added to the
  parent's properties. No new ROOT key, so check_schema_closed's root allowlist does not fire.
  MEASURED: the instrument PASS 67 assertions 0 violations; all 30 execute: lines diff EMPTY
  against the clean tree; and the live gate ADMITS {"state":"UNKNOWN", "detail_level":"calm",
  "render_hint":"COMPACT"} on public AND private.

  E2 — AND IT IS A NAMED MEMBER OF THIS ROW'S OWN NEGATIVE-CONTROL CLASS. detail_level removed
  from `required` on dial_reading_unknown and dial_reading_degraded on both contracts. MEASURED:
  the instrument PASS 67/0, and the gate ADMITS an UNKNOWN dial carrying NO detail_level at all
  on both surfaces. required-tests.yaml's negative_control for this very row names "the branch
  detail_level requirement dropped so that the parent dial_reading's full-vocabulary property is
  what applies" and then states "The instrument fails on all of these". IT DOES NOT. The
  execution contract says the same thing in the same words. THE REGISTER-WIRED INSTRUMENT IS
  STRICTLY WEAKER THAN THE MEMORIAL IT WAS BUILT TO REPLACE: tests/test_detail_level.py's
  _assert_missing_data_never_renders_as_calm has asserted _dial_with_level(builder, None) ==
  REFUSED and _dial_with_level(builder, "banana") == REFUSED since before this increment, and
  CD-ASR-WO3-04's own 30-row probe covered both. The new instrument dropped both rows.

  E1 — AND DECLARED LIMIT 4 IS FALSE AS WRITTEN, IN ALL THREE PLACES IT IS SAID. An OPTIONAL
  third dial slot referencing a permissive union: instrument PASS 67/0, gate ADMITS calm on it,
  both surfaces. Limit 4 claims "a third surface or a third dial is driven on the day it is
  added". It is not, unless the slot is spelled with that one exact $ref string. (The register
  as a whole DOES catch E1, via check_schema_closed's root-properties allowlist. The limit is
  still not honestly drawn.)

  THE §3.1 PRIMARY ATTACK, ANSWERED EXPLICITLY, AND THE DISPATCH CANNOT BE ANSWERED AS WORDED.
  The dispatch tells me to compare the candidate against "what publish.py and the envelope
  builders actually emit" and to build "a real envelope produced by the product's own code
  path". THERE ARE NO ENVELOPE BUILDERS IN src/ AND publish.py EMITS NOTHING. publish_cycle
  TAKES two envelopes as arguments and HAS ZERO CALLERS — the product's own source says so at
  publish.py:129 and detail_level.py:123 (CD-PL-F167). There is no product code path that
  produces an envelope, so the literal attack has no target. THE ANSWERABLE FORM: the only
  definition of the published shape that exists at this commit is the two closed contracts, and
  WITHIN that space the candidate is genuine and correctly located. Every MUST ADMIT row is
  ADMITTED, which is what proves the candidate is not being refused for an unrelated
  malformation; all 8 refusals are SCHEMA_VIOLATION at /<slot>; and all 8 PAIR to a
  single-pointer diff at /<slot>/detail_level. I verified the seat's sole-differing-pointer
  claim myself on both surfaces at both slots and it is EXACT. So the increment is NOT a
  well-evidenced guard on nothing. It is a real guard on a real region of the contract space
  whose boundary is one hand-written document shape per (state, level).

  §3.4 — EXIT 3 IS RIGHT, AND THE DECLARED LIMIT IS NOT HONESTLY DRAWN. Exit 3 is correct: a
  behavioural instrument that judged a tree it is not looking at would be making a statement
  about somebody else's files, which is CD-PL-F98 and has burned this project four times.
  Refusing to judge is the right behaviour FOR THE INSTRUMENT, and "exit 3 is right" and "the
  route is closed" are different sentences — the increment says so out loud, and scheduling
  CD-PL-F180 into 16D is right. BUT I FOUND A THIRD ROUTE, AND IT NEEDS NO ENVIRONMENT VARIABLE.
  load_envelope_schema() re-reads the contract from disk on EVERY call with no cache;
  <root>/contracts is 0775 and its two JSON files are 0664, owned by the running user. A process
  that rewrites <root>/contracts/*.json IN PLACE flips the gate from REFUSED to ADMITTED
  mid-process while contracts_dir() still resolves to <root>/contracts — so DECLARED LIMIT 1's
  precondition is satisfied and the instrument still exits 0. The SHA-256 the instrument prints
  binds only its own run instant: it is a TOCTOU witness, not a control. 16D's scope must be
  widened from "$CD_CONTRACTS_DIR" to "the contract bytes the gate loads at publish time".

  §3.3 — I MADE IT FAIL ON A TREE, AND THE FAILURE IS DECLARED. absent_data_detail_level
  narrowed to ["acute"] — STRICTLY STRONGER compliance with PID §3.2 than the tip — makes the
  instrument FAIL with 40 violations. But the row's negative_control declares "any change that
  makes elevated or acute stop being admitted on a missing-data branch" to BE a violation of the
  row. Declared, therefore honest; recorded, not graded. A SYMMETRIC PID §4 amendment (a fourth
  level added to DETAIL_ORDER and to BOTH enums) PASSES at 81 assertions, which is the
  vocabulary-driven design working exactly as claimed. A pure refactor (absent-data type
  RENAMED, enum REORDERED, $defs REVERSED, behaviour identical) PASSES the instrument 67/0 —
  vindicating the behavioural-not-structural choice — BUT FAILS THE REGISTER at line 2 with 6
  failures in tests/test_detail_level.py, because those tests read schema keys by NAME. 16B's D3
  growth imported that brittleness into the register. That is the "a guard that fires on correct
  trees gets disabled" risk, and the seat did not weigh it.

  D3 ITSELF I JUDGE CORRECT AND LOAD-BEARING, AND I MEASURED IT RATHER THAN AGREED WITH IT. On
  E2 the pre-16B command (test_reading, test_evaluate, test_dial_presentation) passes 124/124;
  the file 16B added catches it, 3 failed / 49 passed. The additive growth is the only thing in
  the register that sees E2 at all. It does not misstate what CD-RT-001-ABSENCE-RENDERS-UNKNOWN
  evidences: that entry is scope CLASS and carries the RENDERING half of CD-AC-001, and "renders
  as calm" sits inside "renders" as squarely as "renders as a number" does.

  NOTHING MOVED THAT MUST NOT MOVE. be0b355 is still be0b355e4b9c39b65b7ca38e75e063ab2c5f40a5.
  pid.content_hash MATCHES, 18 criteria and not 19, latest_admitted_run (null), GATE: SHUT.
  evidence/required-tests/runs/ DOES NOT EXIST — the seat could not have written there and did
  not. Zero pbg/ paths and zero contracts/*.json bytes changed by the whole increment: 16B is
  purely additive guard work. The boot RED is genuinely inherited — ACTIVE_WORK.yaml is the SAME
  BLOB ce0803c3d472fe52541f28965d7995e888329c28 at be0b355 and at the target.

  I DID NOT REPAIR ANYTHING (PBG-SOD-001, PBG-SOD-004). Every finding below carries a
  prescription and the line is left unwritten.

