verification_this_seat_ran:
  standing: >
    IMPLEMENTATION EVIDENCE FOR AN ACCEPTANCE DECISION, NOT ASSURANCE, and it does not become
    assurance by being thorough (PBG-SOD-001). CD-ASR-WO2-01 owes its own independent run of every
    arm and owes nothing to any of this.
  method: >
    `git archive 9aea4ef | tar -x -C <tmpdir>` for the clean arm. For each plant, a FRESH throwaway
    copy extracted the same way, `git apply` of that one patch, then the declared command. The
    worktree was never mutated and no git worktree was created. One plant per copy, so no result can
    be contaminated by another.
  clean_arm: 'All ten declared commands exit 0 on the unplanted copy.'
  plant_arm: >
    All ten exit non-zero with their patch applied: CD-RT-001-AST-NO-NUMERIC-DEFAULT,
    CD-RT-001-ABSENCE-RENDERS-UNKNOWN, CD-RT-002-TYPE-NO-ARITHMETIC, CD-RT-002-AST-NO-BLEND,
    CD-RT-002-SCHEMA-CLOSED, CD-RT-003-ENGINE-NO-WITNESS-REACH,
    CD-RT-005-PANEL-UNAVAILABLE-NEVER-AGREES, CD-RT-012-NO-EXECUTION-INTERFACE,
    CD-RT-012-LOCKFILE-DENYLIST, CD-RT-012-EGRESS-NO-BROKER. Every patch applied cleanly; there was
    no APPLY FAILED.
  what_this_contrast_does_and_does_not_show: >
    IT SHOWS the harness is not broken and each guard responds to its own plant. A clean arm that
    fails proves only that the harness is broken, and a broken harness detects nothing — which is
    why both arms were run rather than the interesting one.
    IT DOES NOT SHOW that each plant violates the PROPOSITION rather than merely tripping the string
    its checker greps for. That is the judgement the dispatch tells Assurance to hunt, it requires
    reading each patch against the criterion, and it is deliberately left to CD-ASR-WO2-01 together
    with the variant plants the auditor must write itself. This seat read the manifest and finds the
    seat's own account credible — the blend spelled over three statements with neutral locals so
    only flavour propagation catches it; the engine reaching witness code in two hops from a
    function-local relative import, invisible to a grep over the engine package; the grant landing
    in a LATER migration so the SQL-text test stays green; the order ticket recurring as
    `record(instrument, size, direction, destination)` with no execution word in its name; and
    `api.ibkr.com` / `ib-insync` carrying no execution token. Credible is not verified, and the
    distinction is the reason a separate Assurance seat exists.
  sibling_arm_independence: >
    The seat reported a result worth preserving: each plant was also run against its criterion's
    SIBLING arms, and three plants are visible to exactly one instrument. `score=0.0` on the empty
    registry leaves check_no_numeric_default at exit 0; the witness plant leaves
    test_importing_the_engine_does_not_pull_in_the_witness_package PASSING; the CD-AC-005 plant
    leaves all five source-scanning checks at 0 and test_witness_panel.py green. If that holds under
    audit it is evidence the layers are genuinely independent rather than one refusal written three
    times. NOT re-verified by this seat and recorded as the seat's claim, not as a finding.

findings_raised:
- id: CD-ENG-F41
  severity: LOW
  raised_by: CD-ENG-WO2-01
  title: 'Two register checks have no criterion and therefore no plant'
  detail: >
    check_base_image_digest_pin.py and check_dockerignore.py have no row in required-tests.yaml, so
    B3 gives them no planted violation. They are evidenced only by passing, and a check evidenced
    only by passing has never been shown to be capable of failing.
  disposition: >
    DISCLOSED TO THE PRODUCT OWNER, not resolved here, and the seat was RIGHT not to resolve it.
    Housing them would mean either inventing a criterion — writing product requirements from an
    Engineer seat (PBG-AUTH-005) — or attaching them to a criterion that does not carry their
    proposition. Both are worse than the gap. The two checks were commissioned by the Project Lead
    under CD-D-013 as a consequence of the .dockerignore escalation, not derived from PID §6, which
    is exactly why they have no criterion. Owed to the PO alongside CD-D-005: either a criterion
    exists for the container-supply-chain properties, in which case it belongs in PID §6 and the
    register grows a row, or these are defence-in-depth with no acceptance criterion behind them and
    should be labelled as such. It does not block the WO-2 gate, which is scoped to the five planted
    criteria.
- id: CD-ENG-F42
  severity: NONE — investigated and dismissed
  raised_by: CD-ENG-WO2-01
  title: 'Concern that CD-AC-003 would be judged on one of its two halves for want of a live store'
  detail: >
    The seat observed that CD-RT-003-GRANT-MATRIX-LIVE exits 3 PRECONDITION_NOT_MET with no store
    reachable — verified by this seat, real exit code 3, with the connection targets named BY
    ENVIRONMENT VARIABLE NAME ONLY and no value written anywhere, correctly — and warned that unless
    the Assurance dispatch carried an RT-A-shaped grant, CD-AC-003 would return PRECONDITION_NOT_MET
    on its second test.
  disposition: >
    NON-ISSUE, on evidence. CD-DISPATCH-WO2-ASSURANCE.yaml already carries the grant, drafted before
    this concern was raised: safe_diagnostic SD-3 authorises ONE throwaway PostgreSQL container,
    postgres:16-alpine pinned by digest, names prefixed `cd-asr-wo2-`, published on 127.0.0.1 on an
    ephemeral port, credentials from the environment and never written down, destroyed with
    `docker rm -f` and `docker volume rm` before return with the removal evidenced. It goes further
    than the seat asked in the direction that matters: it FORBIDS the auditor from reusing or even
    inspecting the Engineer's `cd-store-wo2-` store and requires it to build its own from the
    migrations in the target. Reusing the Engineer's store would have been the auditor inheriting
    the Engineer's setup, which is the same defect as verifying through the Engineer's wrapper.
    The seat raised this without having read the Assurance dispatch, and raising it was still
    correct: a seat that suspects the next stage cannot execute should say so rather than assume
    somebody has thought of it. Recorded as dismissed WITH THE EVIDENCE, so the dismissal is
    checkable rather than reassuring.
- id: CD-PL-F43
  severity: LOW
  raised_by: PROJECT_LEAD_SEAT_01
  title: 'Two declared coverage gaps in B3, disclosed by the seat rather than left to be found'
  detail: >
    The seat states in its manifest that requirements.lock is not planted, because a lock entry
    needs a hash it did not compute, and that the second half of CD-EGRESS-002 is not planted
    because that declared test has one plant. Neither is concealed; both are written into the
    deliverable.
  disposition: >
    ACCEPTED FOR WO-2 and passed to Assurance as a known gap rather than repaired on the critical
    path. It is recorded as a PL finding rather than left as manifest prose so that the Product
    Owner sees it at the WO-2 review without having to read the manifest, and so that a PASS from
    CD-ASR-WO2-01 is not read as covering it. Owed at WO-3.

decisions_closed:
- id: CD-D-019
  title: 'Increment 6b ACCEPTED; B3 COMPLETE; CD-ENG-F40 closed'
  ruling: >
    ACCEPTED on the contrast this seat ran itself: ten clean arms at exit 0, ten plant arms non-zero,
    no patch failing to apply, no executable anywhere in plants/, and zero lines changed under pbg/
    or in ACTIVE_WORK.yaml.

    CD-ENG-F40 is CLOSED and the fix is better than the one asked for. The printed note now COMPUTES
    its counts from len(PROSE_NEGATIONS) and len(PROSE_HYPOTHETICALS) rather than restating them, so
    the class of defect — a hand-written description of a list drifting away from the list — cannot
    recur. It names the surprising words, quotes the measured `must` escape, and cites CD-ENG-F39
    and CD-D-017. The clean arm is byte-identical at 29775 assertions, which is the evidence that no
    detection behaviour changed. That was the whole constraint on the change and it is met.
- id: CD-D-020
  title: 'The eleventh plant is proved by Assurance, not rehearsed by the Project Lead'
  ruling: >
    CD-RT-003-GRANT-MATRIX-LIVE is the one arm this seat did NOT run, and the omission is
    deliberate rather than a shortfall. Running it would mean the Project Lead standing up its own
    PostgreSQL under a hold that exists to keep runtime actions bounded and risk-proportionate
    (CD-HOLD-003, PBG-RT-010), to rehearse a result that only the Assurance seat can admit into the
    record anyway. The Engineer already evidenced it once under RT-A with a clean arm of 138
    assertions and a plant arm of 9 violations along five independent routes including two live
    SET ROLE probes; CD-ASR-WO2-01 is required by SD-3 to build its own store from the migrations
    and prove it again, independently, and is forbidden from reusing the Engineer's.
    A third rehearsal by the Project Lead would add no evidence anyone may rely on and would spend a
    live database to obtain it. CD-HOLD-003 therefore stays HELD and unexercised by this seat.
    The consequence is stated plainly rather than buried: at this boundary, one of the eleven plants
    has been proved only by the implementing seat. If the Assurance run cannot reach a store, CD-AC-003
    is evidenced on one of its two tests and the WO-2 gate is NOT met on it. That is the correct
    failure and it must not be dressed up as a precondition.

