action_summary: >
  *** **THE SIXTH FRESH ASSURANCE SEAT RETURNED `RED` AT `af2accb` AND IS RECONCILED BY MEASUREMENT.
  THE VERDICT IS BANKED VERBATIM AT ITS OWN COMMIT, UNEDITED, BESIDE THE FOURTH AND FIFTH SEATS'
  DOCUMENTS AND NEVER INSIDE THEM (CD-D-143, PBG-CONT-003).** *** T2 **RED**; CD-AC-002 and CD-AC-005
  **AMBER, NOT CLOSED**; nineteen findings; three grounds.
  *** **THE HEADLINE IS NOT THE RED. IT IS THAT THE INCREMENT-7 DECLARED STOP CONDITION WAS MET AND
  DID NOT FIRE — AND THE PROJECT LEAD HAS NOW CONSTRUCTED IT INDEPENDENTLY, WITH A COUNTERFACTUAL
  ARM, RATHER THAN RE-RUNNING THE SEAT'S PROBE.** *** CD-D-152 made item 1 a declared STOP: if
  `_evaluate_dial` proved reachable without an established door, PO-DECISIONS-0012 ruling 1 FALLS and
  the increment ends. The Engineer measured **cycle 1** and proceeded. **A CONFORMING, DECLARED-FOREIGN
  `SourceAdapter` OBTAINS AND CALLS THE NET ON THE SECOND COLLECTION CYCLE, THROUGH `sys.modules`
  ALONE — no `importlib`, no import statement, no frame walk, no threads — AND REACHES THE UNDECORATED
  EVALUATOR THROUGH ITS OWN `__closure__`, PASSING NO ESTABLISHED DOOR.** ***
  *** **AND THE PROJECT LEAD'S OWN DISPATCH IS FALSIFIED BY ITS OWN AUDITOR, IN THE CLAUSE THAT WAS
  MANDATORY AND VERBATIM.** Clause (i) told that seat there was **ONE** instrument exiting non-zero by
  declared state. **THERE ARE TWO. `CD-RT-012-NO-EXECUTION-INTERFACE` WENT `EXIT 0` -> `EXIT 1` INSIDE
  INCREMENT 7** — PL-MEASURED IN BOTH ARMS. **CD-PL-F102, HIGH, AGAINST THIS SEAT.** ***
  *** **AND ONE CORRECTION THE PROJECT LEAD MAKES *AGAINST* THE AUDITOR IN THE WORSE DIRECTION.** The
  seat bounded F-06-D as *"the declaration is source-written, so this is not a caller route"*. **IT IS
  A CALLER ROUTE. PL-MEASURED END-TO-END ON AN ORDINARY, SOURCE-HONEST `@admits(value=int)` DOOR
  REPORTING ZERO FAULTS: a caller-supplied object whose class carries a metaclass with `__eq__` IS
  ADMITTED AND THE BODY RUNS.** `in` puts `type(value)` on the LEFT of the `==`, so the CALLER's class
  decides the comparison. **CD-PL-F103. THE AUDITOR UNDERSTATED ITS OWN FINDING AND THE RECORD SAYS SO
  RATHER THAN INHERITING THE TIGHTER BOUND.** ***
  *** **NOTHING CLOSES AND NOTHING IS GRADED HERE (PBG-AUTH-003, PBG-AUTH-006). FOUR PRODUCT AUTHORITY
  QUESTIONS ARE UP AND THE FIRST OF THEM DECIDES WHETHER A STANDING RULING FALLS.** ***

