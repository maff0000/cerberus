  F_06_D_AND_THE_PROJECT_LEAD_CORRECTS_THE_AUDITOR_IN_THE_WORSE_DIRECTION:
    what_the_seat_found: >
      `admission.py` states its doctrine three times — *"`type(value) is not declared`, never
      `isinstance`"* — and implements it at `:525` as **`if type(value) in self.types:`**. `in` over a
      tuple is `==`, not `is`, and `==` is delegable to a metaclass. **UPHELD AND REPRODUCED.**
    the_bound_the_seat_put_on_it: >
      *"the declaration is source-written, so this is not a caller route, and the fifth seat's 'no
      caller-controlled route' for Category C is correct."*
    THE_PROJECT_LEADS_MEASUREMENT_AND_IT_WIDENS_THE_FINDING: >
      **THAT BOUND IS TOO TIGHT AND THE CORRECTION GOES THE WRONG WAY FOR THE PROJECT.**
      **`in` PUTS `type(value)` ON THE *LEFT* OF THE `==`, SO IT IS THE *CALLER'S* CLASS WHOSE
      COMPARISON RUNS FIRST.** Bare-Python control: `H in (int,)` -> **True** where
      `any(H is t for t in (int,))` -> **False**.
      **END-TO-END ON THE REAL DOOR, PL-MEASURED:** an ordinary, source-honest `@admits(value=int)`,
      **`admission_faults(door)` -> `()`**, i.e. the door reports itself healthy. A caller supplies an
      instance of a class carrying a metaclass with `__eq__` returning True. **`door(hostile)` ->
      ADMITTED, THE BODY RAN.** A genuine `int` is still admitted and a `str` is still refused, **so
      the door looks like it is working.**
    why_this_matters_beyond_one_line: >
      `_Exactly` is what EVERY exact-type `@admits(...)` declaration compiles to. **THIS IS NOT ONE
      DOOR; IT IS THE MECHANISM**, and it bears directly on Category C's disposition and on CD-AC-005.
      **THE AUDITOR UNDERSTATED ITS OWN FINDING; THE PROJECT LEAD IS NOT ENTITLED TO INHERIT THE
      COMFORTABLE HALF OF AN AUDITOR'S SENTENCE AND SAYS SO HERE. CD-PL-F103.**
    the_fix_is_still_one_line: '`any(type(value) is t for t in self.types)` — and its carrier is a metaclass plant, which this tree does not have.'

