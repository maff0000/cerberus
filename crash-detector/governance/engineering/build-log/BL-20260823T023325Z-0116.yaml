    **THE DISPOSITION AND THE ORDER ARE THE PRODUCT OWNER'S.** The Project Lead notes only that items
    2 (F-06-A) and 3 (F-06-D, now widened by CD-PL-F103) are one-line changes independent of Q1, and
    that item 1 is Q1 itself.
