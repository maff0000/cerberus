findings_raised_by_the_project_lead_at_this_boundary:
- id: CD-PL-F102
  severity: HIGH
  title: '**THE PROJECT LEAD''S OWN DISPATCH CARRIED A FALSE MANDATORY CLAUSE, AND ITS AUDITOR FALSIFIED IT WITH ONE COMMAND.**'
  what: >
    `CD-DISPATCH-WO2R3-ASSURANCE-06` clause (i) — carried VERBATIM under CD-D-129, the clause whose
    whole purpose is that the seat be TOLD before it discovers — declared **ONE** governed instrument
    exiting non-zero by declared state, and said in terms that at the fifth gate there were two and
    "THERE IS NOW ONE". **THERE WERE TWO. `CD-RT-012-NO-EXECUTION-INTERFACE` WAS ALREADY RED AT THE
    TARGET.**
  the_cause_and_it_is_the_same_shape_as_CD_PL_F86: >
    **THIS SEAT MEASURED A LIST, NOT A PROPERTY.** It ran the doors check, the sweep, the suite and
    the `__wrapped__` probe — the four figures the previous boundary happened to be about — and **DID
    NOT RUN THE REGISTER SET.** The thing that had broken was outside the list. **THAT IS EXACTLY
    CD-PL-F86, WHICH THIS SEAT RAISED AGAINST ITSELF AT THE FOURTH GATE AND WHOSE PROPOSED REMEDY —
    "sweep by PROPERTY, enumerated by an instrument with its command and count recorded" — WAS
    RECORDED AND NOT BUILT.** It has now cost something: a mandatory disclosure clause was false, and
    a green-to-red regression inside an increment went unreported through a reconciliation and a
    dispatch.
  the_aggravating_fact: >
    **THE DISPATCH TOLD THE SEAT THAT A RED-ON-SIGHT WITHOUT READING THE DECLARATION IS A METHOD
    DEFECT IN THE SEAT THAT WRITES IT — WHILE ITSELF FAILING TO READ ONE OF THE DECLARATIONS.**
  remedy_PROPOSED_AND_NOT_BUILT_AND_THE_REASON_IS_STATED: >
    Every boundary that states a target must run **the register set** and record each exit code, by an
    instrument that enumerates the registers rather than by a seat naming the ones it remembers.
    **IT IS NOT BUILT HERE.** A Project Lead inventing itself a new instrument in the middle of a gate
    it is reconciling is how scope creeps, and it is the second time this exact remedy has been
    recorded rather than built. **THAT REPETITION IS ITSELF THE FINDING AND IT GOES TO THE
    META-ASSURANCE PASS, WHICH NOW HAS A SECOND INSTANCE OF THE SAME UNBUILT FIX.**
- id: CD-PL-F103
  severity: HIGH
  title: '**THE AUDITOR UNDERSTATED F-06-D: THE METACLASS ADMISSION BYPASS *IS* A CALLER ROUTE.**'
  what: >
    The seat bounded F-06-D to source-written declarations and expressly upheld the fifth seat's "no
    caller-controlled route" for Category C on that basis. **PL-MEASURED END-TO-END: an ordinary
    `@admits(value=int)` door reporting ZERO faults ADMITS a caller-supplied object whose class
    carries a metaclass defining `__eq__`, and the body runs.** The caller need not control the
    declaration; it needs only the value, because `type(value)` is the LEFT operand of the `==`.
  why_it_is_raised_by_the_PROJECT_LEAD_and_not_left_for_the_next_seat: >
    **BECAUSE IT MAKES AN AUDITOR'S FINDING BIGGER, AND A RECONCILIATION THAT ONLY EVER SHRINKS
    FINDINGS IS NOT A RECONCILIATION.** It also changes an input the Product Owner is about to rule
    on: Category C's disposition rests on "no caller-controlled route", and that sentence is now false
    for the mechanism the six sites live in.
  what_it_does_NOT_do: >
    **IT DOES NOT MOVE A GRADE** (PBG-AUTH-006) and it does not reopen the audit. It is measured,
    written down, and handed to Product Authority with the rest.

