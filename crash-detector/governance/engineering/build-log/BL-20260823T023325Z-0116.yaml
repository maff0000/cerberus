product_authority_questions_raised_at_this_boundary:
  Q1_THE_STOP_CONDITION_WAS_MET_DOES_PO_DECISIONS_0012_RULING_1_FALL: >
    *** **THIS IS THE ONE THAT DECIDES THE OTHERS AND IT IS RESERVED TO PRODUCT AUTHORITY ALONE.** ***
    CD-D-152 made increment 7's item 1 a **declared STOP**: *"If reachable without an established
    door, 0012 ruling 1 falls and `guarded` becomes a door with a redesigned CD-ASR-F03 control. IF
    YOUR MEASUREMENT LANDS THAT WAY: STOP."* The Engineer measured **cycle 1**, got "no", and
    proceeded — and refused to rule, correctly: *"'I could not construct the reach' and 'the reach does
    not exist' are different sentences and only the first one is evidence."*
    **THE SECOND SENTENCE HAS NOW BEEN WRITTEN BY TWO INDEPENDENT PARTIES.** Ruling 1's load-bearing
    half — *"reachable only through doors that already establish"* — is **FALSIFIED BY MEASUREMENT**:
    a conforming foreign adapter obtains and calls the net on cycle 2 and reaches the undecorated
    evaluator through `__closure__`, passing no door, using only the route the Engineer itself
    measured as the decisive IN-MODEL arm.
    **THE ONE STEP TO WEIGH, PUT PLAINLY RATHER THAN ARGUED:** the reach exists because the host
    imported the engine by calling its own public `evaluate()` API. The counterfactual arm proves the
    collection path never imports it. **SO THE QUESTION IS EXACTLY: DOES A HOST EVALUATING — WHICH
    EVERY DEPLOYMENT OF THIS PRODUCT DOES — COUNT AS HANDING THE NET OVER?** If yes, ruling 1 falls
    and the doors instrument is REDESIGNED, not repaired. If no, the STOP was correctly not taken and
    the record should say why in terms that survive the next auditor.
    **NEITHER SEAT MAY ANSWER THIS. THE ENGINEER WAS FORBIDDEN, THE AUDITOR DECLINED UNDER
    PBG-AUTH-003, AND THE PROJECT LEAD HAS LESS STANDING THAN EITHER.**
  Q2_THE_DISPOSITION_OF_THE_RED_ITSELF_AND_THE_ORDER_OF_THE_TEN: >
    The verdict is **RED** with T2 **RED** and CD-AC-002 / CD-AC-005 **AMBER, NOT CLOSED**. The seat's
    continuation implication is explicit and is **not** that the tree is unsafe to hold: *"Nothing
    found is exploitable by a remote party; every route needs either in-process code or a source edit
