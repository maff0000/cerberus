    **A GOVERNED REGISTER WENT GREEN -> RED INSIDE INCREMENT 7 AND THE VIOLATION IS A SENTENCE ABOUT
    A FALSE ALARM, IN THE TEST THAT FIXED A FALSE ALARM.** Two routes and both are defensible: correct
    the L3 prose reading, or DECLARE the violation the way the Class-2 sweep's is declared. **THIS
