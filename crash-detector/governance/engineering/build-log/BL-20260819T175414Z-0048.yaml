# --- the defect, as measured by this seat ----------------------------------------------------- #
the_defect_reproduced_at_the_dispatch_base: >
  On a pristine `git archive f22d120 | tar -x` extraction:
    printf 'top:\n  - key:\n      - nested\n' > /tmp/hang.yaml
    timeout 20 python3 -B -c "import sys; sys.path.insert(0,'tools/register'); import _yamlmin;
                              _yamlmin.load_yaml('/tmp/hang.yaml')"
  -> EXIT 124. Reproduced exactly as the dispatch records it.

root_cause: >
  `_parse_sequence`'s INLINE-MAPPING MERGE LOOP. When a sequence item carries a key inline
  (`- key: ...`), the loop `while index < len(lines) and lines[index][1] >= child_indent` merges
  deeper lines by delegating to `_parse_mapping` — and it has NO INCREMENT OF ITS OWN, so the
  delegation is the only source of progress. `_parse_mapping` BREAKS IMMEDIATELY, consuming
  nothing, whenever the line it is pointed at begins `- `, because a sequence item cannot open a
  mapping. The loop condition is then still true on the same cursor, and the next iteration is
  bit-for-bit identical to the last. That is the whole defect: a delegation that can consume
  nothing inside a loop that can only advance by delegating.

why_this_is_a_class_and_not_a_shape: >
  The class is AN INPUT ON WHICH THE READER DOES NOT FINISH. It is NOT "the nested-sequence
  document" and it is NOT, as CD-ENG-WO2R-F14 records it, "specifically the first key opening a
  sequence" — see CD-ENG-READER-F03, which is a measured counterexample to that wording. The
  repair therefore tests THE CURSOR, which is the only thing a stall consists of, and knows
  nothing about document shapes.

# --- the repair -------------------------------------------------------------------------------- #
what_i_implemented: >
  ONE invariant, stated once in the module docstring and enforced at every site.

  EVERY LOOP IN _yamlmin.py DRIVES ONE MONOTONE CURSOR into `lines`, a finite list built before
  parsing starts and never mutated during it. On every iteration a loop either LEAVES (break /
  return / raise) or MOVES THE CURSOR STRICTLY FORWARD, and no loop's continuation condition can
  be true on a cursor that did not move. There are exactly two sources of movement:

  RULE 1 — the loop moves it itself, with an unconditional `index += 1` on its own path. This is
  `_parse_mapping`'s loop and both loops in `_fold_block_scalars`.

  RULE 2 — the loop DELEGATES and adopts the returned cursor. Every such delegation now passes
  through the new `_advance(lines, before, after, what)`, which returns a cursor that moved and
  RAISES YamlSubsetError on one that did not, naming the line number, the offending text and what
  it was trying to read there. This is `_parse_sequence`'s merge loop — the live stall — and its
  empty-item branch, where the guard is measured from the top of the ITERATION rather than from
  the delegation, so it passes today and would fire if a future edit removed the increment.

  THE ONE UNGUARDED DELEGATION IS DOCUMENTED AT ITS CALL SITE. `_parse_mapping`'s `_parse(lines,
  index, indent + 1)` legitimately returns a still cursor — `key:` with no block beneath it, a
  sibling key following — and takes its progress from rule 1 instead. Stated in the code rather
  than left to be re-derived by the next reader.

  A BACKSTOP, so termination survives future edits. Each of the four loops carries an iteration
  budget of len(lines). It is unreachable while rules 1 and 2 hold. It exists so that an edit
  which breaks either one FAILS CLOSED with a stated reason at a named line instead of
  reintroducing a hang, and it is proved LIVE by test rather than left as decoration.

why_no_input_can_fail_to_advance: >
  Because a loop that fails to advance is DETECTED AND REFUSED rather than repeated. `_advance`
  does not enumerate shapes; it compares two integers. And if `_advance` itself were ever removed
  or bypassed, the budget still converts the stall into a stated refusal — asserted by a test that
  monkeypatches `_advance` to a pass-through, standing in for exactly that future edit. Termination
  is checked while running, not argued from the current branch set. That is the difference between
  this and a reader that terminates because every known shape was enumerated.

what_a_document_it_cannot_parse_now_does: >
  It RAISES, and it SAYS WHAT IT COULD NOT READ — the standard set by the increment-3 behaviour
  commended at CD-D-048. Example, verbatim:
    "line 3: this reader cannot read a nested block beneath a key written inline on a
     block-sequence item. It made no progress past '- nested' and refuses rather than guessing.
     It supports block mappings, block sequences of scalars and block sequences of mappings;
     write the value as a block beneath its own key so it can be read without a YAML engine."
  A partial parse of a gate's subject makes the gate decide on a document nobody wrote, so the
  reader refuses instead.

no_third_party_parser: >
  The hand-rolled reader was repaired. NO dependency was substituted and `import yaml` appears
  nowhere. The decision recorded in _yamlmin.py's header stands and was not re-taken.

