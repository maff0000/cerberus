  my_recommendation: >
    Take it, in a dispatch that can rule on the exit code — a stated refusal at exit 3 is more
    honest than a traceback at exit 1, and exit 1 here is an accident of Python's exit convention
    rather than a considered verdict. It is a ruling, not an implementation choice.
  declared_at: 'check_egress_no_broker.py limit 8b · required-tests.yaml (8b) · contracts/execution/CD-RT-012-EGRESS-NO-BROKER.md (8b) · executable example: MANIFEST row R08.'
