- id: CD-ENG-READER-F04
  severity: LOW
  status: OPEN — DISCLOSED, out of scope to close
  title: 'the block-scalar folder does not recognise an indicator on a sequence item''s inline key'
  detail: >
    _fold_block_scalars tests `(":" in body and indicator in INDICATORS and not
    body.startswith("- ")) or (body.startswith("- ") and body[2:].strip() in INDICATORS)`. The
