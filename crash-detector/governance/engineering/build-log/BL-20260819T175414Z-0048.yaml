  severity: LOW
  status: OPEN — DISCLOSED, re-raising CD-ENG-WO2R-F15 against my own scope
  title: 'the reader still FLATTENS a mapping nested under a sequence item''s inline key — a partial parse it does not admit to'
  detail: >
