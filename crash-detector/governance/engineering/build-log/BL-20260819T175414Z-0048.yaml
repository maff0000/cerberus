  my_recommendation: >
    This is the more serious of the two remaining reader defects — a stall is loud and a wrong
    parse is quiet — and it should be dispatched WITH the V27 re-measurement, not separately.
- id: CD-ENG-READER-F06
  severity: LOW
  status: OPEN — ESCALATED, scope insufficient
  title: 'CD-RT-003-ENGINE-NO-WITNESS-REACH declared limit 4 is now factually stale and I cannot correct it consistently'
  detail: >
    tools/register/check_engine_no_witness_reach.py lines 189-191 state "That reader ALSO has a
    known non-termination defect ... This check shares it. NOT REPAIRED HERE and NOT IN SCOPE."
    That is no longer true. The same text is in required-tests.yaml lines 531-532 and
    contracts/execution/CD-RT-003-ENGINE-NO-WITNESS-REACH.md line 120.
  why_i_left_all_three_alone: >
    The check header is NOT in this dispatch's writable scope. required-tests.yaml and
    contracts/execution/ ARE, for a declared-limit correction. Correcting two of the three would
    leave CD-RULE-004's three places INCONSISTENT, which is worse than three consistent stale
    statements, and a stale limit that is fail-closed misleads nobody into a false green. So I
    changed none of them and escalated instead of taking the scope.
  what_is_needed: 'writable scope over tools/register/check_engine_no_witness_reach.py for a prose-only declared-limit correction, or a Project Lead edit across all three.'
- id: CD-ENG-READER-F07
  severity: LOW
  status: OPEN — DISCLOSED, a soft spot in my own evidence
  title: 'the iteration-budget backstop is unreachable on every real input, so it is proved only by monkeypatching'
  detail: >
    While `_advance` guards every delegation and every loop increments its own cursor, no document
    can spend a budget. The only test that reaches those four branches replaces `_advance` with a
    pass-through. That is an honest test of the backstop — it simulates exactly the future edit the
    backstop exists for — but it is not a test that any INPUT can reach, and the branches carry
    `# pragma: no cover` for that reason.
  why_i_kept_it: >
    Its whole value is being unreachable today and reachable after a mistake tomorrow. Removing it
    because nothing can reach it now is how the property degrades back into an argument about the
    current branch set. Declared so the auditor does not have to find the pragmas and wonder.
- id: CD-ENG-READER-F08
  severity: LOW
  status: OPEN — DISCLOSED
  title: 'the repaired reader refuses a document that ordinary YAML accepts, and that is now a REFUSAL rather than a hang but still not a READ'
  detail: >
    `top:` / `  - key:` / `      - nested` is valid YAML meaning `{'top': [{'key': ['nested']}]}`,
    and yaml.safe_load reads it. This reader refuses it. That is a deliberate narrowing of the
    supported subset made explicit rather than a defect — the reader has always been a SUBSET
    reader that refuses rather than guesses — but the practical consequence is that a compose
    author writing an ordinary nested list under a sequence item's key gets exit 3 from three
    gates. deploy/compose.yaml does not use the shape today, so the clean arm is unaffected.
  the_alternative_i_did_not_take: >
    Teaching the merge loop to give the inline key a nested block as its VALUE. That is the
    correct parse and it is a CAPABILITY change: it would alter what check_egress_no_broker
    decides about PL-T5's tree from "I cannot read this" to a judgement on the address inside it.
    Out of bounds for a termination repair, and it should be ruled on rather than slipped in.
  my_recommendation: 'dispatch it together with CD-ENG-READER-F05 — they are the same weakness in the same loop, and fixing one without the other leaves the reader inconsistent about nested values.'

soft_spots_i_am_declaring_before_the_project_lead_probes_them:
- 'The repair is ONE function and four budgets. If the Project Lead writes a document that stalls,
  it will stall in a loop I did not guard, and the honest place to look first is `_parse`
  itself — it dispatches on `first_indent` rather than on `indent`, which I did not change.'
- 'I did not probe non-termination in `unresolved_aliases`, which recurses over the parsed tree.
  I reason it is safe — parse uses ~2 stack frames per level to its 1, so any document parse
  survives it survives — but that is an ARGUMENT, not a measurement, and it is the kind of
  argument this project has been right to distrust.'
- 'My variants all reach the stall through a `- ` continuation line. That is the only stall route
  I found, but "the only one I found" is not "the only one".'
- 'The assertion-count decomposition is exact, but it is a count over MY OWN added source. An
  auditor should re-derive 38847 rather than accept the arithmetic.'

