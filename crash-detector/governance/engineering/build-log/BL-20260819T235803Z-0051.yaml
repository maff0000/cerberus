auditor_variants:
- id: ASR2-005-A-datetime-subclass-lies-about-age
  outcome: REFUSED
  refusing_layer: >
    crash_detector.own_terms.own_instant, called from crash_detector.time_utc.ensure_utc, at
    runtime. It reads datetime.year.__get__(value) and its six siblings — getset_descriptors bound
    at import that read the instance's C struct — and builds a NEW exact-type datetime.
  layer_scope: >
    EVERY timestamp entering ANY type in this package, from any module, under any name, whether or
    not the entering module was ever scanned, and whether or not the comparison site downstream
    knows anything about it. It is a RE-CONSTRUCTION OF THE VALUE, not a test of its provenance:
    it reads no source text, no registry and no module path.
  observed: >
    'row as_of_utc is a datetime = 2016-08-21 00:00:00+00:00 / resolved: Unavailable
    PANEL_ROW_STALE / RENDERS: WITNESS UNAVAILABLE / CONTROL: Unavailable PANEL_ROW_STALE /
    ARMS AGREE: True'. The auditor measured type FeedInstant SURVIVING PanelRow normalisation; it
    reads `datetime` now.
  exception_type: >
    NONE, AND THAT IS DELIBERATE. There is no exception. The route resolves to the honest state
    rather than raising, which is what CD-AC-005 asks for — fail closed, not fail loud. THE
    AUDITOR'S FINDING WAS THE DIVERGENCE BETWEEN THE TWO ARMS, and they no longer diverge.
  rename_test: >
    SURVIVES, and it is MEASURED rather than argued —
    tests/test_own_terms.py::test_the_rename_test_the_refusal_consults_no_identifier is ASR2-005-A
    with every identifier renamed (class Zq7, parameters xyzzy and plugh) and the refusal is
    identical. It cannot fail to survive: the descriptors are bound to C-STRUCT OFFSETS, so there
    is no name anywhere in the path to rename.
  the_sibling: >
    witness_resolver._finite_measure REFUSED IN THE SAME MOVE. It returned the caller's object
    after `isinstance(observed, float)`; it now returns float.__float__(observed), an exact float
    read from the stored IEEE-754 double, and math.isfinite is applied to THAT rather than
    consulting the object's __float__. MEASURED: a float subclass whose __float__ returns 0.0
    while carrying inf resolves to Unavailable(reason='PANEL_ROW_INCOHERENT'). The same correction
    was made at witness.panel._own_finite_float and at provenance.require_finite_float, which is
    the single point through which every number in this system enters a type carrying product
    meaning.

