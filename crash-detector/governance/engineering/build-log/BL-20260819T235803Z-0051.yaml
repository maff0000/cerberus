# --- the class, and the invariant that closes it ---------------------------------------------- #
class_2:
  criterion: 'CD-AC-005 (AMBER). Finding CD-ASR-WO2R-F02 (HIGH), plus the _finite_measure sibling.'
  disposition: CLOSED IN PART
  the_class_as_stated_by_the_product_owner: >
    ANY JUDGEMENT THIS SYSTEM MAKES THAT DELEGATES ITS DECIDING OPERATION TO AN OBJECT THE SYSTEM
    DID NOT CONSTRUCT. Not "datetime subclasses". StalenessWindow already knew this and said so in
    terms; the doctrine had been applied to ONE OPERAND AND NOT THE OTHER, and a comparison has two.
  structural_invariant: >
    No method defined by a caller-supplied class executes during the computation of an age, the
    comparison of an age against a window, the selection of a panel constructor from a stored
    state, the admission of a measurement, or the comparison of a dial or source identifier —
    because every one of those operates on a value of exact base type that
    crash_detector.own_terms constructed from primitives it read out of the supplied object
    through the BASE TYPE'S OWN DESCRIPTORS.
  how_an_auditor_refutes_it_by_execution: >
    Hand any public entry point of crash_detector an object whose own __rsub__, __sub__, __lt__,
    __gt__, __eq__, __hash__, __bool__, __float__, __str__, __len__ or astimezone is called at any
    point after the constructor that stores it returns. Or: find a site in
    tools/sweep/declared_dispositions.py whose declared disposition is ESTABLISHED, EXACT or OWN
    and show it is not.
  why_it_is_a_class_closure_and_not_an_instance_closure: >
    Because the caller's code is REMOVED FROM THE DECISION rather than checked before it. A guard
    of the form "refuse a datetime subclass at the resolver" would be an enumeration of entry
    points AND would break the product — pandas.Timestamp IS a datetime subclass. Here the
    supplied object is still accepted and still believed about its DATA; it is never asked to
    DECIDE. A comparison site written tomorrow by someone who has never read own_terms.py inherits
    the property, because the property belongs to the VALUE and not to the SITE. The enforcement
    is not a registry, not a vocabulary and not a type ban.
  the_mechanism_in_one_line: >
    datetime.year.__get__(value), timedelta.days.__get__(value), float.__float__(value) and
    str.__str__(value) read the C struct of the instance. A property, a __float__ or a __str__
    defined by a subclass is never consulted, because the descriptor and the unbound method are
    fetched from the BASE TYPE and not from type(value).
  the_one_door: >
    ensure_utc is called by EVERY constructor in the package that stores a timestamp — PanelRow,
    OK, ObservationRecord, Agrees, Diverges, Unavailable, FreshnessEvidence, Value, Degraded,
    Unknown, AttemptRecord, SourceObservation — and age_seconds calls it on BOTH operands. So the
    age arithmetic is between two objects this system built, at every site, without any site
    having to remember. That is what makes it one change rather than eleven.
  what_is_NOT_closed: >
    FOUR PLACES ARE DECLARED OPEN OR OUT OF BOUND, not closed, and each is named in
    tools/sweep/declared_dispositions.py with its reason: the injected ContributionModel; a tzinfo
    that lies about its offset (CD-ENG-WO2R2-F04, below); SourceRecord.cadence_seconds; and
    FetchFailed.http_status / Malformed.instance_path.

# --- THE SWEEP. The dispatch's stated deliverable. -------------------------------------------- #
the_sweep:
  artefact: 'tools/sweep/delegated_judgement_sweep.py + tools/sweep/declared_dispositions.py'
  it_is_the_enumeration_not_the_closure: >
    STATED FIRST because the confusion is the failure mode this project keeps meeting. The CLOSURE
    is crash_detector.own_terms — a runtime property of the values that does not depend on this
    tool existing. The tool makes the SURFACE COUNTABLE and fails when the surface changes without
    anyone saying so. A clean run of it is evidence about the source text and about nothing else.
  method: >
    Parse every module of src/crash_detector. Compute the transitive intra-package IMPORT CLOSURE
    of the six modules that host a judgement about staleness, agreement or reading-ness —
    serving.witness_resolver, witness.panel, staleness, engine.evaluate, dials.reading,
    serving.dial_presentation — from the import graph, not from a hand-written list. Enumerate
    every AST node in that closure at which an operation could be executed by an object the module
    did not construct, in two tiers: TIER 1 ADMISSION (isinstance, issubclass, hasattr, getattr)
    and TIER 2 THE DECIDING OPERATION (comparison, membership, arithmetic, ordering calls,
    coercion calls, set operations, truthiness, identity). THE CLOSURE IS TAKEN OVER MODULES, NOT
    FUNCTIONS, so it is OVER-INCLUSIVE BY CONSTRUCTION: an over-inclusive denominator can only
    make the tool complain about places that do not matter, an under-inclusive one is how a route
    goes uncounted.
  denominator: '16 subject modules. 402 sites.'
  tier_1: '30 distinct sites, 33 occurrences — ISINSTANCE 24, ISSUBCLASS 0, DUCK 9.'
  tier_2: >
    369 occurrences — TRUTHINESS 103, COERCION 101, IDENTITY 47, COMPARE 36, ORDERING 30,
    MEMBERSHIP 26, ARITH 18, SETOP 8.
  dispositions_tier_1: 'ESTABLISHED 14 · EXACT 11 · OWN 2 · DELEGATED 1 · OUT_OF_BOUND 2.'
  asserted_by_set_equality_in_both_directions: >
    An undeclared site FAILS the tool and a declaration for a site that no longer exists FAILS it
    too, because a register that only noticed additions could be satisfied by deleting the entry
    that complains. MEASURED on three pristine extractions: clean -> exit 0, 402 sites; one new
    `isinstance(x, str)` added to staleness.py, undeclared -> EXIT 1, 403 sites, naming
    `crash_detector.staleness::_a_new_admission ISINSTANCE`; own_str's isinstance removed with its
    declaration left in place -> EXIT 1, 401 sites, "STALE DECLARATION".
  the_granularity_is_not_uniform_and_it_is_labelled: >
    TIER 1 is declared SITE BY SITE and exhaustively — that is what the dispatch asks for in
    terms. TIER 2 is declared at MODULE granularity, which is WEAKER: it says how operands are
    established in that module, and a single site inside a module could contradict it without the
    tool noticing. 369 per-site entries would be a register nobody reads, and an unread register
    is a worse instrument than an honest coarse one. The weakness is written in both files.
  WHAT_THE_SWEEP_REACHED_AND_DECLARED_RATHER_THAN_CLOSED:
  - id: 'crash_detector.engine.model — THE INJECTED ContributionModel'
    disposition: OUT_OF_BOUND
    why: >
      AT THE LEVEL OF DOCTRINE IT IS THIS CLASS, one operand across: a caller-supplied object
      whose compute() returns the number a dial publishes, and one stateful instance injected into
      BOTH DialSpecs makes the monetary dial publish the mean (CD-ENG-WO2R2-F03, replicated
      independently by the Project Lead as PL-Z4). THAT RESEMBLANCE IS EXACTLY THE TRAP.
      PO-DECISIONS-0003 ruled it closed by CONSTRUCTION at a different altitude: BLUEPRINT §7
      architectural review as the mandatory FIRST item of WO-3, plus the CD-D-005 ingredient
      register. Building a model guard in this increment would be the fourth clever guard against
      a class the Product Authority has ruled is not closed by guards (CD-D-075). DECLARING it is
      this seat's CD-RULE-004 obligation; CLOSING it would be the scope breach. This seat wrote no
      guard for it and made no change to engine/model.py.
    carrier: 'NOT PROVED TO BE CARRIED ANYWHERE.'
  - id: 'source_registry.SourceRecord.cadence_seconds'
    disposition: DELEGATED
    why: >
      An int SUBCLASS passes `isinstance(..., int)` and its own __le__ then answers
      `cadence_seconds <= 0`, so a subclass could register a non-positive cadence. It is NOT on a
      deciding path for this class: cadence is the collector's schedule and no staleness,
      agreement or reading-ness judgement reads it in WO-2. Closing it is a change to the
      collector contract, which is not this increment's bound.
    carrier: 'NOT PROVED TO BE CARRIED ANYWHERE.'
  - id: 'observations.FetchFailed.http_status and observations.Malformed.instance_path'
    disposition: OUT_OF_BOUND
    why: >
      A subclass passes at each, and its own methods then answer the range test and the RFC 6901
      shape and length tests. Neither is read by any judgement on the three paths — _latest_usable_ok
      considers only OK, and Malformed carries nothing value-bearing by design.
    carrier: 'NOT PROVED TO BE CARRIED ANYWHERE.'
  the_sweeps_own_declared_limit:
  - '1 STATIC AND INTRA-PROCEDURAL. Every ESTABLISHED disposition is a CLAIM BY THIS SEAT, not
     something the tool verified. THE DISPOSITION TEXT IS WHAT AN AUDITOR SHOULD ATTACK, not the
     count. CARRIER FOR THE RUNTIME HALF, MEASURED: crash_detector.own_terms, via
     tests/test_own_terms.py (29 tests) and the five variants. For a MIS-DECLARED disposition:
     NOT PROVED TO BE CARRIED ANYWHERE — it is invisible to the tool by construction.'
  - '2 IT SEES ONLY OPERATORS WRITTEN LITERALLY. `operator.__lt__(a, b)` produces no site. NOT
     PROVED TO BE CARRIED ANYWHERE at the static layer; the runtime layer carries it, because an
     operation on an ESTABLISHED value is CPython''s whichever syntax reaches it.'
  - '3 ITS SUBJECT SET IS AN IMPORT CLOSURE. 19 names of the package are outside it and every run
     prints them. That none of them decides staleness, agreement or reading-ness is a claim about
     THIS SHA, made by reading them.'
  - '4 A DISPOSITION IS KEYED BY THE EXPRESSION''S TEXT, so renaming a local makes the site
     UNDECLARED and the tool FAILS. That is the safe direction and it is deliberate. IT ALSO MEANS
     THE SWEEP''S OWN RESULT DOES NOT SURVIVE A RENAME AND IS A VOCABULARY RESULT, labelled one.'
  THE_DISCLOSURE_THAT_MATTERS_MOST: >
    *** THE SWEEP DOES NOT SEE THE AUDITOR'S OWN VARIANT FILE. *** With ASR2-005-A present in the
    tree as src/crash_detector/serving/panel_feed.py, the sweep still reports 402 sites — because
    that module imports none of the six entry modules and is therefore outside the import closure.
    MEASURED, on the very extraction used to show the variant refused. It is boundary 3 of the
    sweep's declared limit demonstrated on the exact artefact this increment exists to close, and
    it is the sharpest available statement that THE SWEEP COUNTS AND DOES NOT GUARD. What refuses
    that variant is the re-construction at the door, which needs no module to be in any set. This
    is written into all three CD-RULE-004 places rather than left to be discovered.

