# --- findings this seat raised, including against its own work -------------------------------- #
findings:
- id: CD-ENG-WO2R2-F04
  severity: MEDIUM
  against: 'THIS SEAT''S OWN CLASS CLOSURE. Raised by the seat that wrote it.'
  finding: >
    A `tzinfo` IS A SUPPLIED OBJECT, AND AFTER THIS CLOSURE IT IS THE LAST PLACE A SUPPLIED
    OBJECT'S METHOD STILL RUNS INSIDE A FRESHNESS COMPUTATION. Every timestamp is now rebuilt from
    its own primitive fields, so no method of `type(value)` runs — but the UTC OFFSET comes from
    `datetime.utcoffset(value)`, whose base implementation asks `value.tzinfo`. MEASURED
    (CD-ENG-WO2R2-V10, on pristine extractions of BOTH 50fc231 and this closure, identical
    results): a row whose stated wall clock is 22 HOURS OLD, carrying a tzinfo reporting a -22 h
    offset, resolves to `Agrees` and renders `WITNESS AGREES` against a 600-second window.
  carrier: >
    THE CPYTHON INTERPRETER, MEASURED, AND IT CARRIES THE BOUND AND NOT THE TRUTH:
    `timedelta(days=1)` raises `ValueError: offset must be a timedelta strictly between
    -timedelta(hours=24) and timedelta(hours=24)`. So the route can move an instant by AT MOST 24
    HOURS — 96x the 900-second ceiling this project derived from PID §5. BEYOND THAT BOUND, NOT
    PROVED TO BE CARRIED ANYWHERE.
  no_guard_was_built_and_why: >
    DELIBERATE. A tzinfo cannot be refused without refusing `zoneinfo`, `pytz` and `pandas`, all of
    which supply their own — which is the trade the dispatch names in terms: if the structure makes
    ordinary library timestamps unusable, a defect has been traded for a defect. It is ALSO not
    introduced by this closure: it measures IDENTICALLY at the audited base, and it is the same
    fact as boundary 2 (clock trust is not established and is not claimed) reached through the
    offset rather than through now_utc. It is a statement about the DATA a caller supplied, which
    this system believes by design, rather than about CODE a caller supplied, which it no longer
    runs. It is DECLARED as boundary 5 in all three CD-RULE-004 places.
  what_closing_it_would_take: >
    Either a clock-trust instrument, which is a different problem — and CD-RULE-003 forbids this
    seat from inventing a skew tolerance — or the CD-D-005 ingredient register saying what a
    source's timestamps must be traceable to. Both are Product Authority territory.
- id: CD-ENG-WO2R2-F05
  severity: LOW
  against: 'THIS SEAT''S OWN CLOSURE — a part of it this seat could NOT measure to be load-bearing.'
  finding: >
    THE OFFSET REBUILD IN `own_utc_offset` IS NOT MEASURED TO CLOSE ANY ROUTE. It was written
    because `datetime.utcoffset` validates its return by ISINSTANCE, so a `timedelta` SUBCLASS
    reaches the arithmetic and could in principle control `local - offset` through `__rsub__`.
    CD-ENG-WO2R2-V09 was written to demonstrate that and DOES NOT: not at 50fc231, not at the
    closure, and NOT in a counterfactual extraction with BOTH the rebuild AND its exact-type check
    REMOVED. THE CARRIER IS CPYTHON'S OPERAND-PRECEDENCE RULE, MEASURED HERE: the reflected
    operation is tried first only when the RIGHT operand's type is a SUBCLASS OF THE LEFT'S, and
    `timedelta` is not a subclass of `datetime`, so `datetime.__sub__` handles it and reads the
    timedelta's C struct directly.
  why_it_is_reported_rather_than_removed: >
    What the rebuild demonstrably DOES do is prevent a FALSE POSITIVE: without it,
    `own_instant`'s exact-type check on the offset would refuse a legitimate library timestamp
    whose tzinfo returns a timedelta subclass. It is therefore kept, and recorded as DEFENCE IN
    DEPTH THAT THIS SEAT COULD NOT MEASURE TO BE NECESSARY rather than described as a closure. A
    part of a closure whose contribution has not been measured is exactly the shape CD-RULE-006
    exists to stop being asserted, and this project has paid for that mistake twice.
- id: CD-ENG-WO2R2-F06
  severity: LOW
  against: 'THE METHOD, not the code. Offered to the Project Lead as a candidate standing rule.'
  finding: >
    A VARIANT REFUSED AT TWO SHAs MAY BE REFUSED FOR TWO DIFFERENT REASONS, AND THE COUNTERFACTUAL
    ARM IS WHAT TELLS THEM APART. CD-ENG-WO2R2-V08 is refused at 50fc231 AND at the closure. At
    50fc231 it is refused BY AN ACCIDENT of what it did not override; at the closure by the
    descriptor read. A seat that recorded only "refused at both" would have recorded a true
    sentence from which a false inference follows — which is CD-PL-F74's failure exactly, one
    level up: not "which layer refused it" but "would it still refuse if the layer I credit were
    removed". THE THIRD ARM — the same variant against the closure with ONE line reverted — is
    what turns a refusal into evidence about a specific line, and it is cheap. It was run for V08
    and for V09 and it produced opposite answers: V08's line is load-bearing, V09's is not.
  proposed: >
    That a refusal credited to a specific structure carries a COUNTERFACTUAL ARM — the same
    variant, the same tree, that structure removed — or says it does not have one. Offered, not
    taken: a standing rule is the Project Lead's to make.
- id: CD-ENG-WO2R2-F02
  severity: MEDIUM
  against: 'THE RECORD, not this work. STILL OPEN. NOT REPAIRED — the file is in this dispatch''s protected scope.'
  finding: >
    RE-RAISED UNCHANGED FROM BL-20260819T221837Z-0050, because it is still true at this SHA. `pbg
    boot` returns `CONTINUITY_REFERENCE_INVALID` with one BLOCKING line in this lane.
    governance/engineering/ACTIVE_WORK.yaml is Project-Lead-only. Every seat dispatched into this
    lane since has booted BLOCKING. Reported rather than worked around, and re-reported rather
    than assumed to have been seen.

