  item_2_the_simple_window_floor_and_the_residual_that_is_NOT_closed:
    what_was_built: >-
      The comparand is the document's own root `staleness_window_seconds` — the field whose own
      description says it is *"the window that was applied, carried so every consumer judges
      freshness by the same declared rule rather than by its own guess."* **THIS STAGE IS THAT
      CONSUMER.** It is the CONSTITUTIONAL FLOOR: dead simple, always applies, absolute.
