  item_1_the_fourth_refusal_stage:
    where: src/crash_detector/publication/envelope_contract.py
    what: >-
      `_refuse_stale_calm`, running FOURTH after `_refuse_schema_violation` — because a document
      that is not shaped like an envelope has no meaningful stamps to compare and the schema stage
      is what establishes the shape. New stable token `REFUSAL_STALE_CALM` = `STALE_CALM`, carrying
      the RFC 6901 POINTER and the KEY NAME and **NO VALUE FROM THE CANDIDATE** — not the stamp,
      not the age, not the window (`PBG-SEC-002`). A test asserts the message leaks none of them.
    the_predicate_as_implemented: >-
      For EVERY node in the candidate carrying `detail_level: "calm"`: (a) the ROOT carries a
      `published_utc` that reads as an instant; (b) the ROOT carries a real, finite, strictly
      positive `staleness_window_seconds`; (c) the node ITSELF carries at least one readable stamp
      AND no property of it announces itself as a stamp and fails to read as one; (d)
      `age = published_utc - <the node's OLDEST stamp>` is NOT NEGATIVE; (e) `age <= window`.
      **ANY ONE FAILING IS A REFUSAL. THERE IS NO "CANNOT TELL, SO ALLOW" BRANCH AND NONE WAS
      WRITTEN.**
    it_quantifies_over_NODES_and_this_is_MEASURED_and_not_asserted: >-
      It walks `_iter_nodes` — the walk stage 1 already trusts, objects AND arrays at every depth —
      and does NOT read `candidate["equity_crash"]["as_of_utc"]`. **ARM `D3` OF THE PLANT SET IS
      THAT FORBIDDEN IMPLEMENTATION, APPLIED, AND IT COSTS 40 OF 92 ASSERTIONS.** Arm `H3` proves
      the walk goes through TWO containers: the refusal pointer is `/degraded_inputs/0/0`.
    stamps_are_detected_BY_VALUE_and_the_OLDEST_governs: >-
      Any direct string property that reads as a UTC instant IS a stamp, whatever it is called.
      The contracts ALREADY spell it `as_of_utc` on `VALUE`/`DEGRADED` and `since_utc` on
      `UNKNOWN`, so a fixed property name would already be wrong today. The `_utc` NAME SUFFIX is
      consulted ONLY to catch a property that announces itself as a stamp and does not parse — it
      can only ever TIGHTEN and can never produce an admission. **THE OLDEST GOVERNS**, which is
      the envelope's own doctrine for `as_of_utc` and is also what makes value-detection safe:
      adding a fresh-looking string to a stale node cannot rescue it. Arm `D4` inverts it and costs
      2 assertions.
    clause_d_is_not_the_obvious_formula: >-
      `age > window -> refuse` leaves a dial stamped `2099` — NEGATIVE age — inside every window
      there is, and the Product Owner's named plant is *"a VALUE dial dated 1970/2099 carrying
      calm"*. **ARM `D2` IS THAT NAIVE FORMULA, APPLIED: 1970 stays REFUSED and 2099 GOES BACK TO
      ADMITTED ON BOTH SURFACES**, caught by exactly two assertions.
    no_clock_proved_three_ways: >-
      (1) The module imports NEITHER `datetime` NOR `time`; `_days_from_civil` writes the
      proleptic-Gregorian days-from-epoch arithmetic out in six lines precisely so that no
      clock-bearing module is one attribute lookup from this stage. (2)
      `test_the_envelope_contract_module_cannot_reach_a_clock` scans the module's own AST for
      clock imports, clock attributes and clock names — **WITH ITS OWN VACUITY GUARD**, which
      plants `datetime.datetime.now()` and `time.monotonic()` and asserts the scanner finds them.
      (3) `test_no_parameter_exists_through_which_a_caller_clock_could_arrive` asserts
      `inspect.signature(refuse_unless_publishable).parameters == ['candidate', 'surface']`, which
      is `BP-AMENDMENT-0001` §D.3 held mechanically rather than in prose.
    a_control_caught_this_seat_and_it_is_disclosed_rather_than_tidied: >-
      **THE FIRST DRAFT WROTE THE LITERAL `"calm"` INTO THE STAGE AND
      `tests/test_detail_level.py::test_only_one_module_decides_a_detail_level` WENT RED AT
      2006 passed / 1 failed.** The control is RIGHT and it was not weakened, skipped or argued
      with: the token is now IMPORTED from `crash_detector.publication.detail_level`, the one
