# 5. THE PROJECT LEAD'S RULINGS AND ITS GRADE
# ================================================================================================ #
decisions:
- id: CD-D-079
  title: 'A REFUSAL CREDITED TO A STRUCTURE CARRIES A COUNTERFACTUAL ARM, OR SAYS IT HAS NONE.'
  ruling: >
    CD-ENG-WO2R2-F06 IS ADOPTED, in the seat's own terms and with its own reasoning. From this
    boundary, any claim on this project that a specific structure refuses a specific route must
    carry a THIRD ARM — the same variant, the same tree, THAT STRUCTURE REMOVED — or must state
    that it does not have one. Two arms establish only that a tree refuses; the third establishes
    WHICH LINE DOES THE REFUSING. A variant refused at two SHAs may be refused for two different
    reasons, and the seat proved this on its own work: V08's line is load-bearing, V09's is not,
    and only the counterfactual told them apart.
  why_it_is_adopted_rather_than_noted: >
    It is CD-PL-F74 one level deeper. F74 required a refusal to name WHICH LAYER refused; this
    requires it to be MEASURED that the named layer is the one doing it. This seat applied the rule
