declared_limits:
  - "1 NO SCHEMA_VERSION BUMP WAS MADE, AND THAT WAS A DECISION, NOT AN OVERSIGHT. Narrowing an enum is a BREAKING contract change in the general case. It was not bumped for two reasons and one constraint. (a) The schema's own rule is about WIDENING: 'widening the allowlist without bumping this is a schema edit that fails its own test.' This is a narrowing. (b) No consumer has ever received a 1.1.0 document: publish_cycle has zero callers and src/ has no entrypoint, so there is no deployed document whose validity changes, and the value removed is one PID §3.2 always forbade. THE CONSTRAINT: ENVELOPE_SCHEMA_VERSION lives in src/crash_detector/publication/envelope_contract.py and the pin is asserted in tests/test_envelope_contracts.py — NEITHER IS IN THIS SEAT'S WRITABLE SCOPE, so a bump was not available to this seat in any case. IF THE PRODUCT AUTHORITY OR ASSURANCE JUDGES THAT A BUMP IS OWED, IT IS A SEPARATE BOUNDED DISPATCH AND THIS LIMIT IS WHERE THAT DECISION SHOULD START."
  - "2 THE REFUSAL MESSAGE FOR A calm-ON-UNKNOWN DIAL UNDER-DESCRIBES ITS OWN CAUSE. The oneOf failure is reported by envelope_contract.py's fixed detail text, which explains the refusal purely in CD-AC-001 terms ('an UNKNOWN reading carrying a score has no state to be published as'). A dial refused for carrying calm now receives that same score-centric explanation. The REFUSAL IS CORRECT and the pointer (/equity_crash) is correct; only the prose misleads. envelope_contract.py is NOT in this seat's writable scope, so it was not touched. Raised as finding F04."
  - "3 RULE 7'S PATH JUDGEMENT IS ONLY AS GOOD AS THE ROOTS THE DOCUMENT DECLARES. container_roots() derives from mount targets, tmpfs targets and IMAGE_ROOTS. IMAGE_ROOTS is the one hardcoded element ('/app'); it is measured from deploy/Dockerfile.* WORKDIR and cited there, but it is a SECOND place a fact about the image is written down, and if a Dockerfile changes its WORKDIR nothing detects the drift. NOT PROVED TO BE CARRIED ANYWHERE."
  - "4 RULE 7 JUDGES ONLY ABSOLUTE POSIX PATHS AND ONLY THE service/container_path CONTRACTS. A relative path, a URL, a Windows path, or a hostname in a key NOT listed in VALUE_CONTRACTS is not judged by rule 7. CD_STORE_HOST is the only 'service' key and it is the only one the design has; a NEW key naming a host would be caught by rule 5's deny-by-default only if it is not added to INTERNAL_CONSTANTS. THE ALLOWLIST REMAINS THE SOFT SPOT — rule 7 verifies the values of the keys already on it, and does not stop someone adding a new key with a bad value AND a plausible reason."
  - "5 THE ABSENT-DATA VOCABULARY IS PINNED LITERALLY, NOT DERIVED. test_the_absent_data_branches_declare_a_vocabulary_that_EXCLUDES_calm asserts the enum equals [DETAIL_ELEVATED, DETAIL_ACUTE] using the module's own constants, so it cannot drift from them; but if PID §4 were ever amended to add a FOURTH level that is also admissible for missing data, that test would fail and would need a human decision rather than a mechanical update. That is the intended friction, and it is stated so the next seat does not 'fix' it by loosening the assertion."
  - "6 THIS SEAT TESTED ITS OWN WORK AND DID NOT CERTIFY IT (PBG-SOD-001, non-waivable). Everything above is IMPLEMENTATION EVIDENCE. No claim here is an assurance verdict."

findings:
  - id: CD-ENG-WO3-04-F01
    severity: MEDIUM
    title: "A STATEMENT IN THE DISPATCH IS FALSE — §4's prescription names a rule that cannot see the thing it is told to judge."
    detail: >-
      Dispatch §4 says: "Rule 1 must reach inside ${VAR:-DEFAULT} and judge the default as it
      would judge a literal." RULE 1 NEVER INSPECTS AN ENVIRONMENT VALUE AT ALL. rule_1_and_2_
      mounts (check_portability.py:255-311) iterates services/<name>/volumes[i] and judges only
      the bind `source` field, gated on `kind == "bind"`. It is mount-scoped and cannot reach an
      environment block under any spelling. The mechanism the dispatch's own table names is
      correct — "rule 5 stops at the ${ prefix" — and rule 5 is a DIFFERENT function
      (rule_5_and_6_config, line 347) whose _ENV_REF regex has no closing brace and no default
      group. THE DEFECT WAS DESCRIBED ACCURATELY AND ATTRIBUTED TO THE WRONG RULE. Reported per
      the dispatch's standing instruction; the fix was implemented against the mechanism, not
      against the label, and is a NEW rule 7 rather than a change to rule 1 or rule 5, because
      neither of those rules is about values. Also imprecise, minor: §2.1 says detail_level_for's
      "only two grep hits are its own docstring" — there are four hits in src/ (docstring
      example, prose, __all__, the def). The substance — ZERO REAL CALLERS — is correct.
  - id: CD-ENG-WO3-04-F02
    severity: MEDIUM
    title: "A THIRD PORTABILITY GAP, NOT IN THE DISPATCH, AND FIXING ONLY THE TWO DISPATCHED ONES WOULD HAVE LEFT IT GREEN."
    detail: >-
      The SAME dell path written as a BARE literal — CD_CONTRACTS_DIR: /srv/crash-detector/
      dell-only/contracts, with no ${} wrapper at all — also PASSED with exit 0 and the same
      1072 assertions. It is a DISTINCT hole from gap A: gap A is the _ENV_REF regex stopping at
      the prefix, whereas this one is CD_CONTRACTS_DIR being on INTERNAL_CONSTANTS, which
      exempts the KEY however the value is spelled. A FIX AIMED ONLY AT THE REGEX WOULD HAVE
      CLOSED THE CLEVERER MISTAKE AND LEFT THE PLAINER ONE OPEN — and would have closed the
      finding while doing it. Both are now caught by rule 7 and both have standing tests.
  - id: CD-ENG-WO3-04-F03
    severity: HIGH
    title: "A FOURTH INSTANCE OF 'NAMED FOR THE CLAUSE, DOES NOT TEST THE CLAUSE' — found by the ordered audit, PROVED executably, and corrected."
    detail: >-
      The dispatch ordered a read of every test name in tests/test_detail_level.py.
      test_no_function_in_the_module_takes_two_readings counted
      `reading_like = [n for n in names if "reading" in n or "dial_slot" in n]` and asserted
      `len(reading_like) <= 2`. ONE BUCKET FOR TWO DISTINCT CONCEPTS, with a ceiling of two —
      the ceiling being two precisely because detail_level_for(reading, *, dial_slot, policy)
      puts one of each into that single bucket. CONSEQUENCE, MEASURED AGAINST A PLANTED FUNCTION
      RATHER THAN ARGUED: `def level_for_both(reading_a, reading_b, *, policy)` yields
      reading_like == ['reading_a','reading_b'], length 2, AND PASSES. The guard named "no
      function in the module takes two readings" ADMITTED a function taking exactly two
      readings — the CD-AC-002 shape it exists to forbid, reached by the same one step sideways
      the module docstring warns about. CORRECTED: readings and dial_slots are counted
      SEPARATELY, at most one each. The real module is unchanged by the correction; a new
      vacuity guard asserts BOTH arms. THIS PATTERN NOW HAS FOUR RECORDED INSTANCES ON THIS
      PROJECT (CD-PL-F169, CD-ASR-WO3-02 F06/F07, CD-ASR-WO3-03's RED, and this) AND THERE IS
      STILL NO CONTROL FOR IT. A structural assertion about a signature, a key or a schema shape
      is the common factor in all four; every one of them was defeated by a change that kept the
      structure and moved the meaning.
  - id: CD-ENG-WO3-04-F04
    severity: LOW
    title: "The refusal message for a calm-on-UNKNOWN dial explains itself in CD-AC-001 terms."
    detail: >-
      See declared limit 2. envelope_contract.py's oneOf failure text is fixed prose about a
      score smuggled onto an UNKNOWN reading. It now also fires for a PID §3.2 narrowing, where
      that explanation is wrong. The refusal and its JSON pointer are correct; only the prose
      misleads a reader debugging a rejected envelope. NOT FIXED — envelope_contract.py is
      outside this seat's writable scope, and widening scope to reach it is exactly what
      CD-PL-F173 is on the record for.
  - id: CD-ENG-WO3-04-F05
    severity: LOW
    title: "'src/ has no entrypoint' is true and, said alone, misleading — deploy/entrypoints/ holds six."
    detail: >-
      The project's standing phrasing is that src/ has no entrypoint. TRUE. But
      deploy/entrypoints/ holds six service entrypoints and the Dockerfiles name them
      (ENTRYPOINT ["python3","-B","/app/entrypoints/cd_engine.py"]). This seat initially greped
      only src/ and would have inherited the narrow measurement into a binding record, which is
      CD-PL-F170 exactly. RE-MEASURED over the whole repository: each of the six is a thin shim
      calling _service.boot and NOT ONE reaches publish_cycle; outside tests/ the only
      occurrences are docstring, __all__, the def, prose, a quarantined plants/ patch and Build
      Log prose. THE ZERO-CALLER CLAIM STANDS AT REPOSITORY SCOPE. Recommend the project adopt
      the repository-scoped phrasing, because the src/-scoped one invites exactly this error.

  - id: CD-ENG-WO3-04-F06
    severity: LOW
    title: "SELF-REPORTED NEAR-MISS: this seat wrote a fabricated SHA tail into this entry and caught it before committing."
    detail: >-
      Drafting this record, current_sha was written as 3a0864652c1a4c8ba24e00b3ba0b1e1bbaa39b95.
      THAT SHA DOES NOT EXIST. This seat had only ever observed the SEVEN-character short form
      3a08646 and completed the remaining 33 characters from nothing. The true value is
      3a08646fb607c29a39512725a9061e493ef0c98c. It was caught by verifying the entry's own SHAs
      against `git rev-parse` after validation returned
      unresolved=['current_sha 3a0864652 not checked — repository unavailable'] — i.e. the
      framework validator EXPLICITLY DECLINED to check the one field that was wrong, and
      reported that it had declined. The entry was still uncommitted, so no false statement
      entered the record and PBG-CONT-003 is not engaged; this is disclosed rather than
      silently repaired because CD-PL-F173's precedent is that the seat's own candour is what
      surfaces this class of thing. baseline_sha was measured, not guessed, and verified correct.
      TWO THINGS FOLLOW. (1) THIS IS CD-PL-F170 IN ITS PUREST FORM — a partial measurement (the
      short SHA) promoted to a confident full statement in a binding record — and it happened to
      the seat that was under explicit instruction about that exact pattern, which is worth
      knowing about how weak the instruction is on its own. (2) `continuity.validate` reporting
      `unresolved` is NOT a clean bill of health, and its unresolved list is the highest-value
      part of its output. RECOMMENDATION: no Build Log SHA should be typed; it should be
      substituted from `git rev-parse` output, and Assurance should re-derive every SHA in any
      entry it accepts rather than reading it.

