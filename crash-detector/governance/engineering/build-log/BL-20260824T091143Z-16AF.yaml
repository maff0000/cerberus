action_summary: >-
  INCREMENT 16A-FIX. CLOSES THE REPRODUCED CONSTITUTIONAL BREACH CD-ASR-WO3-03 RETURNED RED ON
  (D2), AND THE TWO PORTABILITY GAPS (D3). NOTHING ELSE.

  THE BREACH, REPRODUCED BY THIS SEAT BEFORE EDITING ANYTHING: at 53f639a an UNKNOWN dial
  carrying detail_level "calm" was ADMITTED by refuse_unless_publishable on BOTH surfaces,
  while "banana" and the field's absence were correctly REFUSED. PID §3.2 is constitutional —
  "Missing data must never render as calm" — and with zero registered sources every dial is
  UNKNOWN, so this was the only state the product could publish.

  F1. calm is now UNREPRESENTABLE on the two missing-data branches, IN THE SCHEMA ITSELF, the
  way CD-AC-001 is already held there. A NAMED type $defs/absent_data_detail_level =
  ["elevated","acute"] in both closed contracts; dial_reading_degraded and
  dial_reading_unknown reference it; VALUE keeps the full vocabulary including calm. THE NAMED
  TYPE WAS CHOSEN OVER A PER-BRANCH INLINE ENUM AND THE REASON IS THE FILE'S OWN PATTERN: every
  reused constraint here is already a named type (utc_timestamp, source_id_list, detail_level),
  an inline enum would be the first duplicated constraint in the document, and the name states
  the constitutional reason once at four use sites instead of twice per file.

  DEGRADED WAS NARROWED, AND THE DECISION WAS READ OUT OF THE CODE RATHER THAN GUESSED
  (PBG-AUTH-005). detail_level_for's on_degraded returns policy.absent_data_level, IDENTICALLY
  to on_unknown, and never reaches _level_for_score; DetailPolicy refuses absent_data_level
  "calm" at construction. The module already treats DEGRADED as missing data. Before this
  increment the CONTRACT did not agree, and a contract admitting what the code cannot produce
  is the gap that let the defect through. A test now asserts that equivalence against the live
  function, so the reasoning cannot rot silently.

  F2. FOUR failing arms, each on a /tmp COPY via $CD_CONTRACTS_DIR, never the real files
  (CD-PL-F154). Each mutation ASSERTS ITS ANCHOR before replacing it, so an arm cannot pass by
  mutating nothing.

  F3. test_the_UNKNOWN_branch_carries_a_level_and_that_is_the_constitutional_half was headed
  "PID §3.2" and asserted only that score was absent (that is CD-AC-001) and that detail_level
  was REQUIRED (that is PRESENCE, not VALUE). Both are satisfied by an UNKNOWN dial carrying
  calm. IT IS NOW AN END-TO-END BEHAVIOURAL ASSERTION THROUGH THE LIVE GATE on both surfaces,
  with the ADMITTING arm beside it. What it used to assert is quoted in its docstring, not
  erased. Neither old assertion is lost: CD-AC-001 is guarded at
  test_envelope_contracts.py::test_the_unknown_branch_declares_no_score_property_at_all, and
  presence by _assert_detail_level_attaches_per_dial.

  F4. tests/publication_fakes.py::unknown_dial() no longer hardcodes "elevated" under a comment
  asserting a guarantee the code did not obtain. It calls detail_level_for on a real Unknown
  reading; a new degraded_dial() does the same for Degraded at score 0.01 — deliberately BELOW
  elevated_at, so only the DAMAGE can produce the answer. The single remaining literal is
  FAKE_DETAIL_POLICY.absent_data_level, and it CANNOT BE calm BY CONSTRUCTION: DetailPolicy's
  __post_init__ raises DetailPolicyIncoherent on it, citing PID §3.2. The value returned is
  unchanged ("elevated"), so no other test moved.

  F5. publish.py's declared limit 2 read "detail_level IS NOT ON EITHER SURFACE AND IS NOT
  WRITTEN BY THIS MODULE". Since 16A the field IS on both contracts. SUPERSEDED, NOT DELETED
  (PBG-CONT-003): the old text is quoted verbatim, marked false, and what is true instead is
  stated — the key is in the CONTRACT and reaches no surface, because publish_cycle has zero
  callers. THE CALLER WAS DELIBERATELY NOT WRITTEN (dispatch §6).

  D3. Rule 7 added to deploy/check_portability.py: it judges the config VALUE, not merely the
  KEY, and judges the inside of ${VAR:-DEFAULT} exactly as it judges a bare literal. A
  service-name value must name a service DECLARED IN THIS FILE; an absolute path must sit under
  a container root THIS FILE establishes (mount targets, tmpfs targets, or the image WORKDIR
  /app, which is MEASURED from deploy/Dockerfile.* and not assumed).

  THE THREE THINGS THE DISPATCH ASKED FOR AND THIS SEAT ADDS TO THE RECORD: a THIRD portability
  gap not in the dispatch (finding F02), a FOURTH instance of the "named for the clause, does
  not test the clause" pattern found by the ordered test-name audit and CORRECTED (finding
  F03), and one statement in the dispatch that is FALSE (finding F01).

status: WAITING_ASSURANCE

