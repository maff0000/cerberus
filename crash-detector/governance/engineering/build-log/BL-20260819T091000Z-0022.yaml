action_summary: >
  governance/dispatch/CD-DISPATCH-WO2R-ENGINEER.yaml authored and moved DRAFT -> ISSUED against
  execution base ee8be6b on branch wo-2-skeleton, worktree /srv/crash-detector-wo2, to a FRESH
  Engineer seat CD-ENG-WO2R-01.

  It is bounded to assurance findings CD-ASR-F01 through CD-ASR-F06 and NOTHING ELSE, in six
  increments — F02 and F03 together because the Product Owner ruled them the same class, then F01,
  then F04, F05, F06, then a reconciliation-and-return increment that writes no logic.

  The dispatch's whole design problem is that the OBVIOUS way to satisfy it is the wrong way. Six
  findings arrive with ten reproducible escape routes attached; the cheapest possible rework makes
  those ten routes fail and reports success. That would reproduce the exact defect the gate caught,
  one level up. Three devices in the dispatch exist to prevent it, and they are the substance of this
  entry.

the_three_devices:
  1_the_mandatory_commit_block: >
    Ruling 2 requires the rework to "state IN THE COMMIT what CLASS is being closed and by what
    STRUCTURE". The dispatch turns that into a TEMPLATE every increment commit must carry, filled in:
    CLASS CLOSED / STRUCTURE / WHY IT IS A CLASS CLOSURE / PROVED BY / KNOWN-SET VARIANTS RE-RUN /
    NEW VARIANTS (>=2, mine) / FALSE POSITIVES CHECKED / CLEAN ARM / ELEVEN PLANTS / DECLARED LIMIT.
    A commit without the block is not accepted at reconciliation however good the code is. This makes
    a prose ruling MECHANICALLY CHECKABLE, which is the only kind of requirement that survives a seat
    under time pressure.
  2_the_proof_standard_distinguishes_runtime_from_static: >
    For F01 and F02 the PO's words are "unrepresentable" and "structurally incapable". Those are
    RUNTIME properties, and a static checker exiting non-zero is NOT proof of them — every escape
    that produced these findings passed a static checker. The dispatch therefore demands: write the
    variant, RUN it, and show the interpreter or the constructor REFUSING it, with the exception type
    and message recorded. For F03/F04/F05, which are guards over declarations and source and can only
    be static, the standard is the CONTRAST plus a demonstration that the guard's SUBJECT derives from
    the artefact rather than from a constant — change the artefact, watch the subject follow.
  3_the_new_variants_must_be_durable_and_they_become_the_next_exclusion_set: >
    Every new variant lands as a `git apply`-able patch under variants/WO-2R/<finding>/ with a
    MANIFEST row naming the proposition attacked, the route, why the route differs from the known
    set, the command line and the observed refusal. Nothing under variants/ may be executable
    (PBG-ASSURE-001 — no wrapper for an auditor to be tempted by). Two consequences, both wanted: a
    variant that exists only in conversation is not project state (PBG-CONT-007), and the seat cannot
    quietly fit its guard to its own variants because the next auditor will read the list and is
    required to go elsewhere.

decisions_ruled_here:
- id: CD-D-031
  ruling: >
    F04 IS CLOSED BY DENY-BY-DEFAULT OVER A DECLARED DESTINATION REGISTRY, NOT BY RESOLUTION.
    The PO ruled that the check "must resolve what an entry REACHES, not what it is spelled as". The
    literal reading — resolve the entry — is REFUSED on reproducibility grounds (CD-PL-F48): a
    register check whose verdict depends on DNS cannot be run offline by an auditor, cannot be
    reproduced at a later date, and therefore cannot be a gate. The dispatch instead requires that an
    allowlist entry may ONLY be an entry drawn from an explicit in-tree registry of permitted
    destinations, each with its purpose and the service that needs it, with EVERYTHING ELSE a
    violation by default — IP literal, CIDR, URL, wildcard, unregistered hostname. That satisfies the
    ruling's INTENT exactly: an IP literal stops being a spelling to catch and becomes simply not a
    destination anyone declared. The broker vocabulary and the known-operator denylist survive as a
    SECOND layer over the registry itself, catching a registered destination that is a broker.
    The seat may propose a better structure, but it must be deny-by-default and it must need no
    network.
- id: CD-D-032
  ruling: >
    THE F06 CEILING VALUE IS DERIVED OR THE SEAT FAILS CLOSED — IT IS NEVER INVENTED (CD-RULE-003).
    A staleness ceiling is a product quantity, and PBG-AUTH-005 forbids a seat inventing product
    meaning. The dispatch carries the Project Lead's PROPOSED derivation, explicitly marked as
    something the seat must CHECK rather than assume: PID §5 carries a RATIFIED assurance latency
    budget — pipeline/publication failure independently detectable within 15 minutes — and a staleness
    window wider than the detectability budget means a dead witness feed renders as fresh for longer
    than the product permits failure to go undetected, so the budget bounds the window above.
    BLUEPRINT §7 (CD-AC-009) then makes the window `window_for(regime)`, TIGHTENING as volatility
    rises, which makes a calm-regime ceiling the loosest admissible value with regime-awareness
    tightening beneath it. If the seat reads those clauses and the derivation does NOT hold, it fails
    closed and escalates. It does not substitute a plausible number. The precedent is already in the
    tree and is quoted at the seat: scores.py refuses to impose a score range for exactly this reason.
- id: CD-D-033
  ruling: >
    THE ELEVEN EXISTING PLANTS ARE A DELIVERABLE OF THIS REWORK, NOT COLLATERAL. A rework that
    changes the Reading types and the dial magnitude will break patches written against the old
    structure. The dispatch requires that every pre-existing plant still applies and still contrasts;
    where a plant no longer applies because the structure it patched legitimately changed, it must be
    UPDATED to violate the SAME PROPOSITION against the new structure, with its MANIFEST row updated
    and the change stated in the commit. A plant that no longer applies is not a plant, and deleting
    one is prohibited. Named as a decision because this is the likeliest silent casualty of the
    refactor and the likeliest to be discovered by the auditor rather than by the seat.

