   EXIT CODE AS A THIRD COLUMN.**'
- '**IT DID NOT DECIDE WHETHER 86 OR 77 IS RIGHT AND IT DID NOT ASK THE ENGINEER TO ADOPT 86.**'
- '**IT MOVED NO GRADE.** T2 RED; CD-AC-002 and CD-AC-005 AMBER and NOT CLOSED; no `DEFECT_OPEN`
   finding closed; the WO-2 gate SHUT. **A DISPATCH IS NOT A PASS.**'

