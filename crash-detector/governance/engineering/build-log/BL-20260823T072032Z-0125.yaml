- '**IT DID NOT BUILD THE PLANT-DRIFT CARRIER.** Ruled **(A)** at PO-DECISIONS-0017 ruling 1 and
   sequenced explicitly AFTER the seventh gate. **THE FOUR OCCURRENCES ARE DISCLOSED TO THE ENGINEER
