decisions_raised:
- id: CD-FWK-004
  summary: >
    PBGv2 cannot represent a Project Lead that is seated while a bounded Engineer or Assurance seat
    acts. `governance/authority/` admits exactly one record with status ACTIVE; a second makes
    `pbg boot` return RED with "2 ACTIVE authority records; ambiguous assignment" for EVERY seat,
    the Project Lead's included. Measured on this project at 2e116ec, not inferred. The consequence
    bites a specific control: `pbg authority separation` is the PBG-SOD-001 verifier and it requires
    an ASSURANCE authority record to exist, which on this project cannot lawfully be ACTIVE
    alongside the Project Lead's. So the framework's own separation verifier cannot be cleared here
    without breaking boot for every seat.
  recommendation: >
    PBGv2 needs either concurrent seat records scoped to a mutation lane, or an explicit
    DISPATCHED/SUSPENDED lifecycle state, so that separation of duties can be evidenced through the
    framework rather than around it. Carried to the PBGv2 backlog alongside CD-FWK-001 and
    CD-FWK-003, all three of which are the same shape: the vendored, single-lane authority model
    does not fit a project that dispatches sub-agents.
  default_safe_action: >
    Sub-agent seats are authorised by durable dispatch records under governance/dispatch/, deriving
    from CD-AUTH-0001, each naming a distinct actor_id. PBG-SOD-001 is evidenced on this project by
    the Product Owner's ratified CD-D-002 named-actor route — distinct actor_ids in the dispatch
    records, in the Build Log, and in the Assurance run record's executed_by.party — and NOT by the
    framework verifier, which continues to report "This is NOT a pass". The gap is disclosed here
    rather than papered over. Nothing under pbg/ has been modified (PBG-FWK-013).
  owner: PRODUCT_AUTHORITY

