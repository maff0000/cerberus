rt_a:
  classification: MUTATION_CAPABLE_AUTHORISED — RT-A, exactly as bounded in the dispatch record
  what_it_established: >
    That the grant matrix is TRUE OF A RUNNING STORE, not merely written in SQL. The inherited
    material evidenced it by reading text and by a declaration-level test; neither can tell you
    whether PostgreSQL agreed with what it was told.
  bounds_observed:
    image: >
      postgres@sha256:cf78e76683b9ca8c5733cbbdce6c9262b45b6767934dd0a95e671f9a0fc20685 — BY DIGEST.
      Not re-resolved by tag: the recorded digest was verified against `docker image inspect` on
      this host and then used as the run reference.
    container_name: cd-store-wo2-rta (and cd-store-wo2-rta-neg, cd-store-wo2-rta-neg2 for the two
      negative controls) — every one carrying the cd-store-wo2- prefix
    volume: cd-store-wo2-rta-data (and -neg-data, -neg2-data) — cd-store-wo2- prefix
    port: '`-p 127.0.0.1::5432`, an EPHEMERAL port on LOOPBACK ONLY. Observed 127.0.0.1:32771,
      32772, 32773. Nothing bound to any other address.'
    credentials: >
      Both the cluster superuser password and the migrator password were generated at run time with
      secrets.token_urlsafe(32), held only in the runner shell's environment, and passed to Docker
      with `-e NAME` (no `=`), so no value ever appeared on a command line, in the host process
      table, in a file, in a log, in this record or anywhere else (PBG-SEC-002, PBG-EVID-003,
      PBG-CONT-009, all non-waivable). They were destroyed with the container.
    prefix_discipline: >
      EVERY docker command issued was either prefix-filtered by cd-store-wo2- or named a
      cd-store-wo2- object explicitly. No container or volume outside that prefix was touched,
      stopped, restarted, inspected into or listed. `docker image inspect postgres:16-alpine` reads
      an IMAGE, not a container or volume, and is what the digest verification required.
  result: '150 assertions, 0 failed, against PostgreSQL 16.15 on x86_64-pc-linux-musl'
  probe_instrument: >
    /tmp/rt_a_live_grant_probe.py, sha256
    91e834c51b3f46e5bf44fe8ff66875b8ead6d9993ebdaf8dafcc83e91f6f661b, driven by /tmp/rt_a_run.sh,
    sha256 e80210426a60237778ce58a1c226768117fbd8db971a5d5b488038c6f99dcea7. Deliberately in /tmp,
    which the dispatch names as non-governed scratch: the DURABLE check that guards
    CD-RT-003-GRANT-MATRIX-LIVE is deliverable B1, and this seat is not authorised to start block B.
    The probe refuses rather than skips — an unmet precondition is a non-zero exit with a stated
    reason (PBG-CI-002) — and refuses to pass vacuously if it made no assertions.
  negative_controls:
    why: >
      A probe that has never been seen to refuse anything is a rumour (PBG-ASSURE-017). Both
      controls were applied to THROWAWAY COPIES of the migrations under /tmp. The worktree was never
      mutated, confirmed by `git status --porcelain db/` after each.
    control_1: >
      Planted `GRANT USAGE ON SCHEMA witness TO cd_engine; GRANT SELECT ON witness.observation TO
      cd_engine;` — the CD-RT-003 violation. Probe exit 1 with SEVEN failures across FIVE
      independent routes: schema privilege, table privilege, column privileges,
      information_schema cross-check, live-vs-declaration comparison, and the behavioural
      `SET ROLE cd_engine` refusal turning into a success. Note it did NOT report witness.reading,
      which was not granted — the guard reported what was actually violated.
    control_2: >
      Planted `GRANT UPDATE ON dial.history TO cd_engine;` and
      `DROP TRIGGER dial_history_first_published_utc_is_immutable ON dial.history;`. Probe exit 1
      with SEVEN failures: the CD-GM-003 per-role assertion, the whole-store UPDATE/DELETE/TRUNCATE
      sweep, the live-vs-declaration comparison, all three first_published_utc attack shapes, and
      the second-instrument grant check.
  destruction:
    when: before this seat returned, on every run, via a shell EXIT trap so a failure could not
      leave residue
    commands_and_exit_codes:
    - 'docker rm -f cd-store-wo2-rta            -> exit 0'
    - 'docker volume rm cd-store-wo2-rta-data   -> exit 0'
    - 'docker rm -f cd-store-wo2-rta-neg        -> exit 0'
    - 'docker volume rm cd-store-wo2-rta-neg-data -> exit 0'
    - 'docker rm -f cd-store-wo2-rta-neg2       -> exit 0'
    - 'docker volume rm cd-store-wo2-rta-neg2-data -> exit 0'
    residue_check_after: >
      `docker ps -a --filter name=cd-store-wo2- --format '{{.Names}}'` -> exit 0, EMPTY.
      `docker volume ls --filter name=cd-store-wo2- --format '{{.Name}}'` -> exit 0, EMPTY.
      Run after every cycle and again as the last runtime act of this increment. No residue.

