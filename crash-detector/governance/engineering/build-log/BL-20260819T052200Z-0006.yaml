findings:

- id: CD-ENG-F21
  severity: HIGH — a container-readiness defect, and the most consequential thing in this increment
  where: src/crash_detector/runtime/lifecycle.py
  what: >
    The process ignored SIGTERM in roughly one run in eight. The signal handler called
    `threading.Event.set()`. A Python signal handler runs ON THE THREAD IT INTERRUPTED, and
    `Event.set()` acquires the condition lock while `Event.wait()` holds that same lock for a few
    bytecodes before releasing it. A SIGTERM landing in that window runs the handler on a thread
    already holding the lock, and the handler blocks on it forever. The loop re-entered that window
    once per tick, so it was hit often.
  how_found: >
    NOT by reading the code — the module's docstring asserted that setting an Event "is the whole of
    what is safe", and it reads as correct. Found because the delivered suite failed once during a
    routine full run, then measured: `test_a_real_sigterm_produces_a_clean_bounded_shutdown` failed
    5 times in 40 targeted runs (12.5%). A flaky test is a rumour, so it was diagnosed rather than
    re-run: /proc/<pid>/status on a hung child showed State S, SigCgt 0000000000004002 (SIGTERM and
    SIGINT both CAUGHT, so not an installation failure), Threads 1, wchan futex_wait_queue — a
    single-threaded process blocked on a lock inside a signal handler.
  why_it_matters: >
    A process that does not stop when asked is one the platform SIGKILLs at the end of the grace
    period, mid-write, which is the precise outcome BLUEPRINT §2's SIGTERM contract exists to
    prevent. It would have presented in production as occasional data loss on restart, with no log
    line and no failing test.
  fix: >
    The handler now performs attribute stores only: `self._terminating = True` is one STORE_ATTR
    under the GIL, allocating nothing and acquiring nothing. `wait()` polls the flag in bounded
    50 ms slices (WAIT_SLICE_SECONDS) using time.sleep, which since PEP 475 runs the handler and
    resumes, so no signal is lost. The second-signal path moved from `print` + `raise SystemExit`
    to `os.write` + `os._exit`, because print locks the buffered writer and interpreter shutdown
    flushes — the same class of hazard on the path where the operator has already said the clean
    path is not working. Cost: shutdown latency <= 50 ms against a 15 s budget and a 30 s platform
    grace.
  evidence:
    before: '5 of 40 SIGTERMs left the child alive (12.5%)'
    after: '0 of 60 at tick 0.05 and 0 of 40 at tick 0.001 — 0 of 100 total'
    negative_control: >
      The new guards were run against the ORIGINAL pre-fix lifecycle.py restored from
      /srv/crash-detector-wo2-candidate-inc3/ (with only WAIT_SLICE_SECONDS added so the import
      resolves and the control isolates the defect rather than a missing name):
      test_the_termination_flag_acquires_no_lock FAILED with "the termination flag is a Event", and
      test_the_forced_exit_path_does_not_write_through_a_buffered_stream FAILED. Exit 1.
      DISCLOSED HONESTLY: in that same control run the 10-cycle behavioural test happened to pass
      all 10 cycles, which is expected about a quarter of the time at a 12.5% per-cycle rate. That
      is exactly why the structural guard is the primary one and the cycles are a backstop, and it
      is why one green run of the original test proved nothing.

- id: CD-ENG-F22
  severity: MEDIUM
  where: all six deploy/Dockerfile.*
  what: >
    Each declared `VOLUME ["/contracts"]`. /contracts is READ-ONLY CONFIGURATION — the image
    storage class — and `VOLUME` declares the DURABLE class (PBG-RT-013). Run outside compose,
    Docker would create an anonymous WRITABLE volume at that path in every one of the six images, so
    a system whose A6 claim is "exactly one named volume exists and it belongs to the store alone"
    would silently grow six more that nobody declared and nothing reclaims. It also contradicts the
    read-only bind compose mounts at the same path, and `VOLUME` freezes contents at declaration.
  fix: >
    Removed from all six, with the reasoning written into each file so it is not reintroduced. The
    read-only bind in compose is the mechanism and is sufficient. Added
    ::test_no_dockerfile_declares_a_volume, asserted over INSTRUCTIONS rather than the word so the
    explanation can live in a comment, plus
    ::test_the_only_durable_storage_in_the_system_is_declared_in_compose from the other end.
  negative_control: >
    Planted `VOLUME ["/contracts"]` into a throwaway copy at /tmp/mutation-check (the worktree was
    not mutated) and ran the guard: FAILED with the planted line named, exit 1.

- id: CD-ENG-F23
  severity: LOW, but it is the class of defect this project exists to refuse
  where: deploy/entrypoints/_service.py
  what: >
    The module claimed "Both are REQUIRED, with no in-code default" for CD_TICK_INTERVAL_SECONDS and
    CD_SHUTDOWN_GRACE_SECONDS. The CODE defaulted the grace to DEFAULT_GRACE_SECONDS, and README.md
    correctly documented it as defaulting to 15.0. A comment overstating a guard is a guard nobody
    can rely on. Separately, `if os.environ.get(NAME)` conflated UNSET with SET-BUT-BLANK, so a
    variable somebody set and got wrong silently took the default.
  fix: >
    The docstring now states which setting is required and which is optional and why they differ.
    The test is `is None`, so a blank value is REFUSED distinctly from an absent one — the same
    distinction BLUEPRINT §5 makes between EMPTY and FETCH_FAILED, applied to configuration. The
    refusal messages were split accordingly, and the non-numeric refusal no longer echoes the
    offending value (an unparseable setting is routinely something pasted from a secret store).
  evidence: >
    Four new tests, each measured on a real child process: unset -> boots with grace_seconds=15.0;
    blank -> exit non-zero with "set but blank"; non-numeric -> exit non-zero with "is not a number"
    and the planted value absent from both stdout and stderr; explicit value -> grace_seconds=7.5.

- id: CD-ENG-F24
  severity: LOW
  where: tests/test_runtime_lifecycle.py
  what: >
    `test_log_lines_are_flushed_so_the_platform_sees_them_at_once` asserted
    `source.count("flush=True") >= 2` — a source-string proxy for a runtime property. It broke when
    the forced-exit path moved to os.write, which is UNBUFFERED BY CONSTRUCTION and therefore a
    stronger guarantee than the thing being counted. A check that fails when the property improves
    is measuring the wrong thing.
  fix: >
    Replaced with the property itself: a child is spawned with a 30 s tick and PYTHONUNBUFFERED
    removed, and its first two lines are read off the pipe while `poll()` confirms it is still
    running. Plus a separate structural assertion for the forced-exit path, which a behavioural test
    cannot reach without killing the test runner (it calls os._exit).
  note: >
    This is a test correction that benefits this seat's own implementation, so it is recorded in
    full with its reasoning rather than made quietly, per the test-and-evidence skill. The
    replacement is strictly stronger: it measures behaviour where the original measured text.

- id: CD-ENG-F25
  severity: DISCLOSURE — no change made, escalated
  where: repository root
  what: >
    Every Dockerfile records that a `.dockerignore` is OWED at the repository root before any build,
    excluding at least .git/, __pycache__/, .pytest_cache/, .env*, *.pem, *.key, plants/,
    governance/ and pbg/. Without it the build context carries the repository history AND THE
    GOVERNANCE RECORD into the daemon. The inherited material recorded it as owed rather than
    creating it, and this seat agrees and has NOT created it: writable_scope enumerates the root
    files it admits (pyproject.toml, requirements.txt, requirements.lock, README.md, .gitignore) and
    .dockerignore is not among them. Creating it would be widening scope by initiative.
  escalation: >
    SCOPE ITEM FOR THE PROJECT LEAD: add /srv/crash-detector-wo2/.dockerignore to writable_scope, or
    have WO-3 create it under RT-B authorisation. It must exist before the first `docker build`.

- id: CD-ENG-F20
  severity: DISCLOSURE — an inherited claim that carried no attestation, now attested
  where: db/migrations/0004_dial_history.sql and tests/test_store_schema_sql.py
  what: >
    Both assert, in prose, that "it was a live PostgreSQL that refused to refuse the row" — that the
    idiomatic `score = score` NaN guard was ADMITTED by a real catalogue, because PostgreSQL departs
    from IEEE 754 and holds NaN = NaN TRUE. That is a live-catalogue observation, and no seat
    returned, no Build Log entry named it and no evidence record existed for it. It was a claim, not
    evidence, and leaning on it would have been adopting an observation nobody stands behind.
  action: >
    RE-ESTABLISHED under this seat's own attestation rather than removed or trusted. RT-A measured
    it directly: `SELECT 'NaN'::float8 = 'NaN'::float8` -> TRUE on PostgreSQL 16.15, which is the
    fact that makes the idiomatic guard wrong; and the delivered constraint refuses NaN, Infinity
    and -Infinity (SQLSTATE 23514 each) while admitting a real number. The prose is now backed by
    evidence in this record. No code change was needed.

