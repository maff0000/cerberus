# ---------------------------------------------------------------------------------------------- #
what_changed_in_the_code_path:
  the_new_function: '`crash_detector.collectors.runner._the_runners_own_copy(outcome)` — a copy of the outcome that NO SINK HAS EVER HELD A REFERENCE TO, rebuilt through the outcome''s own constructor so `__post_init__` runs again and the `payload` dict is a different object.'
  the_ordering_which_IS_the_fix: >
    `kept = _the_runners_own_copy(outcome)` is taken **INSIDE the `finally:` AND BEFORE
    `_record`**. Until that line, the object the sink was handed and the object the runner
    reported were the same object.
  and_every_read_below_moved_to_it: >
    `final_outcome = kept`, and **`if not isinstance(kept, FetchFailed): break`** — the
    loop-continuation test moved too, deliberately: `object.__setattr__(x, "__class__", Y)`
    reassigns the class of a heap type, so a sink could otherwise decide whether the runner
    retries.
  which_of_the_two_shapes_the_auditor_named_and_WHY: >
    *"Snapshot the outcome before `_record`, OR derive the reading key from the recorded row."*
    **I TOOK THE FIRST AND THE SECOND IS WORSE THAN THE PROBLEM:** the recorded row IS the
    object the sink held, so deriving the key from it asks the mutator what it mutated. Stated
    here rather than left as a preference.
  DERIVED_NOT_SPELLED: >
    The member set comes from `typing.get_args(FetchOutcome)` and the field list from
    `dataclasses.fields`, so a fifth outcome member or a new field is copied on the run it is
    added with no edit here. A hand-written list of four type names would be a VOCABULARY.
    Exact-type membership is asked through `crash_detector.admission.is_exactly` (item 3), so a
    metaclass cannot answer it. **AND IT FAILS CLOSED**: an outcome outside the closed sum type
    raises `SinkContractBreach` rather than being passed through uncopied.

# ---------------------------------------------------------------------------------------------- #
the_contrast__BOTH_ARMS_ONE_AXIS:
  the_axis: '**THE SINK, AND ONLY THE SINK.** Identical adapter, policy, started instant and ledger in both arms.'
  the_mutating_arm: |
    class MutatingSink(RecordingSink):
        def record(self, attempt):
            super().record(attempt)
            outcome = attempt.observation.outcome
            object.__setattr__(outcome, "payload", {"reading": 999.0})
            object.__setattr__(outcome, "source_as_of_utc", <2000-01-01>)
            # returns None, so `_record`'s contract check is satisfied and NOTHING REFUSES
  at_the_base_314592c: |
