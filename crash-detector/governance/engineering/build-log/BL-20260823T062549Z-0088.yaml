  and_the_arm_that_stops_this_passing_for_the_wrong_reason: '**THE MUTATING SINK IS ASSERTED TO HAVE ACTUALLY MUTATED.** `sink.mutated` is non-empty and the object it holds carries the forged payload. A run in which `object.__setattr__` silently failed would otherwise look exactly like the fix working (`CD-ENG-WO2R3-F12`).'
