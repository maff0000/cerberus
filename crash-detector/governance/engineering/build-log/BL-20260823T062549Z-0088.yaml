what_this_does_NOT_close__MEASURED_AND_ASSERTED_TRUE:
  the_nested_payload_residue: >
    `OK.__post_init__` takes `dict(self.payload)` — a **SHALLOW** copy — so a payload whose
    VALUE is itself mutable is still shared between the object the sink holds and the runner's
    own. A sink that mutates the inner object mutates both. **THE MEASURED ESCAPE IS A
    TOP-LEVEL REWRITE AND THIS CLOSES IT; THE NESTED CASE IS NOT CLOSED AND IS NOT CLAIMED
    CLOSED.** Declared in `_the_runners_own_copy`'s docstring and CARRIED — asserted TRUE — by
    `tests/test_collector_mutating_sink.py::test_the_nested_payload_residue_is_declared_and_measured`,
    so the declaration cannot go stale in the reassuring direction.
  what_the_sink_PERSISTS: >
    **NOTHING HERE MAKES THE STORED ROW TRUTHFUL.** A sink that mutates its copy before writing
    persists a lie; what this closes is the runner READING that lie back and reporting it, and
    the ledger being asked for a period no row records. Whether a conforming sink is telling the
    truth is CD-BP-003 and is already declared: **NOT PROVED TO BE CARRIED ANYWHERE.**
  ARM5_of_the_dispatchs_description: >
    The dispatch names an ARM5 — *"the stored payload then FAILS the schema it was judged by,
    while the original passes it"*. **I DID NOT REBUILD THAT ARM.** It is a property of the
    STORED row, which is the half above that this item does not reach, and asserting it would be
    asserting something about the sink's own copy. Said plainly rather than quietly dropped.
  and_no_DEFECT_OPEN_finding_is_closed: 'Not mine (PBG-AUTH-003).'

