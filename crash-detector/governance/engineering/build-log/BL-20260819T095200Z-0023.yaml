the_seats_self_disclosures_confirmed:
  note: >
    Five findings the seat raised against its OWN work. They are recorded here because a seat that
    reports its own weaknesses is the mechanism this project depends on, and because two of them are
    substantive.
  ENG-WO2R-F01_CONFIRMED_BY_MEASUREMENT: >
    THE MOST VALUABLE THING IN THE RETURN. The seat reports that the REGENERATED
    CD-RT-001-ABSENCE-RENDERS-UNKNOWN plant no longer demonstrates the INDEPENDENCE of CD-AC-001's
    two declared tests, because rule F now catches it too — so a plant that used to prove "the
    behavioural arm catches what the static arm misses" now trips both. THE PL MEASURED THIS AND IT
    IS EXACTLY RIGHT: the ABSENCE plant now gives AST exit 1 as well as pytest exit 1. The seat also
    reports that V03 carries that property instead, and the PL confirmed that too: V03 gives AST
    exit 0 and pytest exit 1 — it escapes the static layer by design and is caught by the runtime
    layer. So the independence property SURVIVES in the evidence base; it has MOVED from a plant to a
    variant. This is a real and easily-missed consequence of strengthening a guard, disclosed by the
    seat rather than found by the auditor.
  ENG-WO2R-F02: >
    The declared surface table contains CPython dataclass internals, so it is sensitive to patch-level
    interpreter changes. It fails CLOSED and LOUDLY — an interpreter change breaks the import rather
    than silently widening the surface — which is the correct direction. Noted as a portability risk,
    not a defect. It should be stated in the check''s declared limit if it is not already.
  ENG-WO2R-F03: 'The guards guarding the guards terminate somewhere, and the seat says where. Accepted.'
  ENG-WO2R-F04: >
    The seat''s FIRST runtime probe used an empty config snapshot and therefore never reached the
    planted branch — it would have reported a refusal it had not actually observed. The seat caught
    this itself, corrected the probe, and PRINTED THE FAULTY PROBE IN THE VARIANTS MANIFEST WITH THE
    WARNING ATTACHED so the next seat does not repeat it. That is precisely the failure mode a
    thorough-looking rework hides, and it was volunteered.
  ENG-WO2R-F05: >
    Rule F caught the seat''s OWN first draft (`getattr(cls, "__dictoffset__", 0)`), and the seat
    FIXED THE CODE RATHER THAN THE CHECK. Recorded because the opposite choice is the single most
    common way a guard quietly stops working.

decisions_ruled_here:
- id: CD-D-034
  ruling: >
    INCREMENT 1 IS ACCEPTED. CD-ASR-F02 (HIGH) and CD-ASR-F03 (MEDIUM) are CLOSED AS A CLASS at lane
    27bb880, with one residue — post-import `type.__setattr__` class mutation — DECLARED, VERIFIED BY
    THE PROJECT LEAD TO BE EXACTLY AS DECLARED, and mitigated at every consumer boundary. Accepting a
    declared limit is not the same as accepting a gap: the PL measured this one itself, found the
    declaration neither overstated nor understated, and records that a spelling-based ban was
    CONSIDERED AND REJECTED for the right reason. Per CD-RULE-004 that is the permitted second option,
    and CD-PL-F51 warned that a PL unwilling to accept an honest declared limit incentivises a seat to
    lie about closure. This acceptance is that principle applied.
- id: CD-D-035
  ruling: >
    THE AST GUARD RETAINS `scope: CLASS`, AND THE PROJECT LEAD DOES NOT OVERTURN IT. The seat kept the
    declaration and put its reasoning in the Build Log "so the PL can overturn it in one word". The PL
    declines to, on measured grounds: rule F no longer enumerates spellings but denies by default over
    a declared permitted provenance, and PL-P7 — a magnitude with NO numeric literal anywhere in the
    source, reached by bypassing the decorated function — was caught by rule F for exactly that
    reason. A claim of CLASS is earned by that behaviour. The claim remains bounded by the guard's own
    written declared limit, which is what CD-RULE-004 requires of it.
- id: CD-D-036
  ruling: >
    BUILD LOG ENTRY ID COLLISION — RECORDED, NOT EDITED. The Engineer's lane entry is
    BL-20260819T100500Z-0022 and the Project Lead's main entry is BL-20260819T091000Z-0022. BOTH
    CARRY SEQUENCE 0022. The Engineer numbered from the last sequence VISIBLE ON ITS LANE (0017),
    which is the branch-point copy, and could not see 0018-0022 because those exist only on main.
    NEITHER ENTRY IS EDITED — Build Log history is not rewritten and corrections supersede
    (PBG-CONT-003, non-waivable). The pair is unambiguous in practice because the two differ in
    timestamp (091000Z vs 100500Z), in actor and in branch, and this ruling names them explicitly.
    FORWARD RULE: the lane takes a RESERVED SEQUENCE BLOCK from 0040 upward and main continues from
    0023, so the namespaces cannot collide again while a lane and a trunk are both being written. The
    remaining WO-2R dispatches will carry this instruction. Raised as CD-PL-F52.

