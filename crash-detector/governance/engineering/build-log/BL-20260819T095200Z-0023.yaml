  seven_fresh_probes_written_by_the_project_lead:
    purpose: >
      The seat's six variants prove its guard catches routes the seat thought of. They cannot prove
      it catches the class, because the seat chose them. These seven were written by the PL against
      the delivered structure, chosen to attack the seat's OWN headline claims rather than the
      original findings.
    probes:
    - id: PL-P1
      route: 'A numeric property on `Degraded` rather than on `Unknown` — the constructor the seat''s
        own variants mostly left alone. Tests whether the surface closure covers all three
        constructors or only the one the finding named.'
      result: 'REFUSED — AST exit 1, declared pytest exit 2.'
    - id: PL-P2b
      route: 'DELETION rather than addition — `__post_init__` removed from `Unknown`. Tests the seat''s
        specific claim that set equality is asserted in BOTH DIRECTIONS. A one-directional check
        would have passed this, and a validator that only refuses additions leaves removal of a
        validator as a live route to a nonsense reading.'
      result: 'REFUSED — declared pytest exit 2, ReadingSurfaceViolated. The both-directions claim
        holds and is now independently established.'
    - id: PL-P4
      route: '`__slots__` widened with `"__dict__"`, which restores an instance dictionary and would
        re-open instance injection — an attack on layer 2 through layer 2''s own mechanism rather
        than around it.'
      result: 'REFUSED — declared pytest exit 2, ReadingSurfaceViolated.'
    - id: PL-P5
      route: 'A subclass built at runtime with `type("Sneaky", (Unknown,), {"magnitude": 0.0})` rather
        than with a class statement. Tests whether the SealedReadingType metaclass closes the
        subclass route generally or only the syntactic form of it.'
      result: 'REFUSED — declared pytest exit 2.'
    - id: PL-P6
      route: 'THE STRONGEST PROBE. The absence post-condition is a DECORATOR on `_evaluate_dial`, so
        the obvious structural attack is not to edit that function at all but to BYPASS IT: `evaluate`
        itself branches on `required_inputs_are_all_present` and constructs the Value directly. If
        layer 5 were an instance closure rather than a class closure, this is exactly what would walk
        past it.'
      result: 'REFUSED — AST exit 1 AND declared pytest exit 1 with 11 failures. The bypass does not
        escape.'
    - id: PL-P7
      route: 'PL-P6 HARDENED. P6 was partly caught by rule F seeing a numeric literal, so P7 removes
        the literal entirely — the magnitude becomes `float(len(usable))`, which is 0.0 precisely when
        there are no usable inputs, and which contains no number anywhere in the source. Bypasses the
        decorator AND carries no literal. This is the probe the PL expected to succeed.'
      result: 'REFUSED — AST exit 1, "F: unrecognised magnitude provenance", plus 11 behavioural
        failures. Rule F''s deny-by-default caught a provenance nobody enumerated, which is the whole
        claim being made for it.'
    - id: PL-P-limit
      route: 'Not an escape attempt but a HONESTY TEST of the declared limit — see immediately below.'
      result: 'The limit is drawn exactly where it says it is.'
    assessment: >
      SEVEN PROBES, SEVEN REFUSALS, including the two written specifically to defeat the seat's
      headline structural claim. That is not proof of closure — no finite number of probes is — but it
      is materially stronger evidence than the seat's own six, because the PL chose these against the
      finished structure and two of them were designed to succeed.

  the_declared_limit_verified_rather_than_accepted:
    what_the_seat_declared: >
      One residue is NOT closed: post-import mutation of a class object through `type.__setattr__`.
      The seat declared it refused at every consumer boundary and by an in-tree package sweep, but
      OPEN for an out-of-package mutator performing a direct read.
    what_the_PL_measured_directly: >
      `type.__setattr__(Unknown, "magnitude", 0.0)` SUCCEEDS. A direct read `u.magnitude` returns
      0.0. `is_value(u)` RAISES ReadingSurfaceViolated. `fold(u, ...)` RAISES ReadingSurfaceViolated.
    verdict: >
      THE LIMIT IS HONESTLY DRAWN — no overstatement and no understatement. It is a real property of
      CPython, not a gap dressed as a design choice: a class object is mutable and no in-language
      structure can prevent an in-process mutator from writing to it. The mitigation the seat chose is
      the right one — assert the OUTCOME at every consumer boundary rather than forbid the mechanism —
      and the PL notes approvingly that the seat says in its own commit that it CONSIDERED and
      REJECTED a rule banning `type.__setattr__` on the scanned path, on the grounds that a
      spelling-based ban would have re-created the exact defect this rework exists to correct.
      That is the reasoning this project has been trying to install, arriving unprompted.
