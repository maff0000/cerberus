what_the_seat_delivered:
  the_class: >
    ABSENCE YIELDING A NUMBER, closed in two halves. (a) The absence OBJECT: a Reading cannot acquire
    a numeric — or any other UNDECLARED — member by construction, class body, class assignment or
    deletion, decorator, metaclass, inheritance, instance assignment or object.__setattr__. (b) The
    absence CODE PATH: a path that did not get its required inputs cannot construct a reading that
    carries a value, regardless of where the number came from.
  the_structural_move_that_matters: >
    THE QUESTION CHANGED. It was "is this member numeric?", which no guard can decide in general. It
    is now "is this member DECLARED?", which is decided by SET EQUALITY in both directions against
    DECLARED_MEMBER_SURFACE, asserted while the module is being imported. That is why V02 —
    a `__getattr__` catch-all, which installs NO MEMBER NAME AT ALL and could therefore never appear
    on any enumeration of forbidden names — is caught. An enumeration could not have caught it. A
    surface equality does, for the same reason it catches a member nobody has thought of yet.
  the_second_structural_move: >
    THE POST-CONDITION LEFT THE FUNCTION BODY. CD-ASR-F03 was an edit to a function body whose rules
    lived in that same body, so editing the body edited the rules. `refuse_a_number_without_its_inputs`
    now re-derives the premise from the evaluator's OWN ARGUMENTS and refuses a value-bearing reading
    if the inputs were not there. It never asks where the number came from, so the space of
    number-provenances it must anticipate is EMPTY. That is what makes it a class closure rather than
    a fifth spelling added to a list of four.
  the_third: >
    RULE F DENIES BY DEFAULT. check_no_numeric_default.py stops enumerating ways a number can arrive
    and instead enumerates the ONE way a magnitude is PERMITTED to arrive, reporting every other
    provenance. Rules A-E are retained unweakened. Adding a legitimate magnitude source now requires
    declaring it visibly.

