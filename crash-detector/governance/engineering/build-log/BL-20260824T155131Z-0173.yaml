    "no dial may ever read calm" as a LIVE ASSERTION (`CD-CALM-GATE-002`), and this seat measured
    it at the tip: **`FAIL — 4`. IT STILL BITES.** So the mute-button failure mode is caught by an
    instrument the register runs, not merely by a plant.
  why_it_is_NOT_resolved_here: >
    **RESOLVING IT WOULD BE THIS SEAT CERTIFYING THE WORK IT DISPATCHED** (`PBG-SOD-001`,
    non-waivable). It is stated, measured as far as measurement goes, and handed to the auditor as
