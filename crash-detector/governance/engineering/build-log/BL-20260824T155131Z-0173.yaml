    clean `False`, not-a-dial), rather than because it AFFIRMATIVELY PROVED present-and-fresh.
    **`PO-DECISIONS-0027` RULING 1 REQUIRES ADMISSION ONLY ON AFFIRMATIVE PROOF OF PRESENT AND
    FRESH**, and "invisible therefore admitted" is the exact shape of every escape in this chain.
