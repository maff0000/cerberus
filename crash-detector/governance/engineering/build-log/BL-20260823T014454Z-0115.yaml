  what_this_MOVES_that_a_reader_will_notice: >
    **`blueprint_identity` WILL CHANGE AT THE NEXT BOOT** — it was `BLUEPRINT.md@689b946362f45803` and
    it is a content fingerprint, printed and not compared against a recorded expectation.
    **RECORDED HERE SO THE CHANGE IS EXPLAINED BEFORE IT IS OBSERVED, RATHER THAN READ AS DRIFT.**
  how_it_could_be_wrong: >
    If the Product Owner regards ANY edit to the Blueprint as version-moving, this understates it by
