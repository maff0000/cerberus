action_summary: >
  *** **PO-DECISIONS-0014 IS RULED, CONSUMED AND EXECUTED IN ONE BOUNDARY. THE SIXTH FRESH ASSURANCE
  SEAT IS DISPATCHED AND IS OUT OVER THE WHOLE OF WO-2R3 AT `af2accb`, AGAINST THE RAW RECORD.** ***
  *** **AND THE FIRST THING THIS ENTRY SAYS IS THAT THE PROJECT LEAD WAS OVERRULED.** One boundary
  ago this seat ruled **CD-D-158: the sixth seat does NOT go out, because the eleven are part of its
  target and they do not exist.** **THE PRODUCT OWNER INVERTED ITS OWN RULING 6 AND SENT THE SEAT OUT
  ANYWAY**, on the FIFTH seat's argument and against this seat's ordering: *"writing them before the
  audit hands the auditor a map drawn by the author."* **THE RECORD SAYS SO PLAINLY RATHER THAN
  READING AS THOUGH THE RULING AND THE RECOMMENDATION AGREED.** ***
  *** **THE VOCABULARY IS RATIFIED IN PART AND ONE OF THE THREE WORDS THIS SEAT DRAFTED IS REJECTED.**
  `CARRIER_ONLY` ratified as drafted. `DEFECT_OPEN` ratified **only with the gap it exposed closed
  rather than shipped** — a MINIMAL findings register created in the same act so its `finding` field
  resolves or the row refuses. **`UPSTREAM_OF_THE_PATH` REJECTED AS DRAFTED, for exactly the reasons
  this seat measured against its own draft and refused to withdraw on** — the refusal was recorded by
  the Product Owner as correct conduct, "leaving the ratification where it belongs". ***
  *** **NOTHING WAS WRITTEN THAT THE VERDICT SHOULD PRECEDE.** The eleven, the redraft and the findings
  register are HELD AS ONE ACT until the sixth seat reports (CD-D-160), and **the redraft was
  deliberately not even drafted (CD-D-161) — because the eleventh item is exactly what the word is
  for, and it is a named target of a seat that is reading the tree right now.** ***
  *** **THE `*extra` RESIDUE HAS ITS CARRIER AND THE OBLIGATION IS DISCHARGED, NOT DEFERRED.**
  BLUEPRINT §16's owed list now names the measurement that falls due the day the first computing
  `MappingKind` member is accepted. **AND IT IS HANDED STRAIGHT TO THE AUDITOR AS T17 WITH THE QUESTION
  THIS SEAT CANNOT ANSWER ABOUT ITS OWN WORK.** ***

