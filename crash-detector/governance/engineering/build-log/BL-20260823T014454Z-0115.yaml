- id: CD-D-160
  title: '**THE ELEVEN, THE `UPSTREAM_OF_THE_PATH` REDRAFT AND THE MINIMAL FINDINGS REGISTER LAND AS *ONE ACT*, AFTER THE SIXTH VERDICT, AND NOT BEFORE.**'
  the_question_it_answers: >
    Ruling 1 orders the findings register created "in the same act" and the word redrafted. Ruling 2
    puts the eleven after the verdict. **Which act, and when?**
  the_ruling: >
    **ONE ACT, AFTER THE VERDICT.** The register exists so `DEFECT_OPEN.finding` resolves; the only
    `DEFECT_OPEN` in existence is one of the eleven; the redrafted word is the disposition of the
    eleventh. **THEY ARE ONE CHANGE TO ONE REGISTER CONTRACT AND SPLITTING THEM WOULD LAND A
    HALF-VOCABULARY THAT REFUSES ITS OWN ONLY ROW.** It is **CODE ON THE LANE** and therefore needs an
    **ENGINEER DISPATCH**: never this seat's own hand (PBG-AUTH-006), never either Assurance seat
    (PBG-SOD-001).
  why_it_is_recorded_as_a_READING_and_not_as_a_fact: >
    **RULING 1 AND RULING 2 DO NOT THEMSELVES SAY WHICH ACT.** This seat composed them, and a
    composition is an inference. **IT IS WRITTEN DOWN AS AN INFERENCE SO THE PRODUCT OWNER CAN
    OVERTURN IT IN ONE SENTENCE**, rather than discovered later as an assumption nobody declared.
  how_it_could_be_wrong: >
    If the findings register was meant to exist immediately — an index is cheap and a register that
    exists before it is needed is not dangerous — then this holds a harmless artefact for a boundary.
    **THAT IS THE CHEAP ERROR. The expensive one is a vocabulary landing in two halves across an audit
    boundary, which is how a register contract acquires a state nobody designed.**
- id: CD-D-161
  title: '**THE `UPSTREAM_OF_THE_PATH` REDRAFT WAS NOT DRAFTED AT THIS BOUNDARY, DELIBERATELY.**'
  the_question_it_answers: 'The Product Owner rejected the word and ordered it redrafted. Does this seat write the replacement now, while the auditor is out?'
  the_ruling: >
    **NO.** The eleventh item — `crash_detector.admission` as an UNDECLARED MODULE at 33 tier-2 sites
    — is **exactly what the word is for**, and it is a NAMED TARGET (T8, T16) of a seat that is reading
    the tree right now. **DRAFTING THE REPLACEMENT BEFORE THE AUDIT WOULD HAND THE AUDITOR THE SAME MAP
    RULING 2 HAS JUST TAKEN OUT OF THIS SEAT'S HANDS**, one word to the left.
  what_is_disclosed_instead: >
    The sixth seat's brief carries **the rejection, the reasons for it, and the fact that the redraft
    does not exist**, and asks it in terms whether a vocabulary that cannot yet express its eleventh
    item is a contract or a placeholder (T16). **THE HOLE IS SHOWN, NOT PATCHED.**
  how_it_could_be_wrong: >
    If the Product Owner intended a mechanical correction owed immediately, this costs a round trip —
    **the cheap error. The expensive one is a second contested word landing before the only party with
    standing to attack it has spoken**, which is the defect ruling 1 was written to fix, repeated.
- id: CD-D-162
  title: '**THE BLUEPRINT §16 CARRIER IS WRITTEN, AND THE BLUEPRINT VERSION DOES *NOT* MOVE.**'
  the_question_it_answers: 'Ruling 3 orders a documentary entry onto BLUEPRINT §16''s owed list. Is that an amendment?'
