product_authority_questions_raised_at_this_boundary:
  Q5_THE_PID_LINEAGE_OF_THE_TWO_NEW_CRITERIA:
    the_question: '**`CD-AC-017` AND `CD-AC-018` ARE NOT IN PID §6. DOES PID §6 GAIN THEM, OR DO THEY ENTER THE REGISTER AS `STRENGTHENS` OF EXISTING CRITERIA?**'
    why_it_is_NOT_this_seat_s_to_answer: '**PID.md is the Constitutional document, ratified and signed by Matt on 2026-08-18. `PBG-AUTH-005` and `PBG-PID-004`: no seat writes product requirements.** The Product Owner minted the IDs in a decision; only the Product Owner can put them in the PID.'
    and_it_is_MEASURED_not_assumed: >
      **The Required Test Register derives its population from PID §6 AND ONLY FROM PID §6**, and
      the validator derives the same census independently and compares. Read from the framework
      source, not from memory: `pbg/tools/pbg/required_tests.py` — *"POPULATION — the criteria census
      is derived from the referenced PID independently"*, and for a register entry with no PID
      lineage, **`"NEW_REQUIREMENT is blocked pending PO amendment of the PID"` — status
      `NOT_EVALUATED`, and the gate does not open on it.**
      A third route EXISTS and is measured in the same file: **`STRENGTHENS <target>`**, which
      traces a register-only entry through a criterion that IS in the census and is evaluated
      normally. `CD-AC-017` would strengthen `CD-AC-005`; `CD-AC-018` would strengthen `CD-AC-004`.
      **WHETHER THEY ARE STRENGTHENINGS OR GENUINELY NEW REQUIREMENTS IS A PRODUCT MEANING QUESTION
      AND NOT A MECHANICAL ONE, WHICH IS EXACTLY WHY THIS SEAT IS NOT TAKING IT.**
    the_consequence_while_it_is_open_STATED_PLAINLY: >
      **THE TWO CRITERIA ARE 3/4 OF THE WAY TO THE FORM `CD-D-172` REQUIRES AND NOT 4/4.** The
      eighth seat's own definition: *"A first-class criterion on this project is a `CD-AC-xxx` row
      in §14 traced to a work order in §15 and a `required-tests.yaml` entry with an execution
      contract."* They now have the §14 row and the §15 work order. **THEY DO NOT YET HAVE THE
      REGISTER ROW OR THE EXECUTION CONTRACT, AND CANNOT UNTIL THIS QUESTION IS RULED.**
      **THIS IS DISCLOSED IN `BLUEPRINT.md` §14 ITSELF, AS AN EXPLICITLY-ATTRIBUTED PROJECT LEAD
      DISCLOSURE**, because §14's own standing sentence — *"every row above becomes a register
      entry"* — is NOT TRUE OF THESE TWO ROWS, and leaving a knowingly-false sentence in the design
      document is the worse of the two defects available here. **THE NINTH SEAT IS TOLD THIS BEFORE
      IT DISCOVERS IT (`CD-D-129` clause (i), PO-DECISIONS-0009 ruling 1).**
  Q6_F05_IS_NOT_REPAIRED_AND_ONLY_THE_PRODUCT_OWNER_CAN_REPAIR_IT:
    the_question: '**§16 `CD-D-172` STILL CONTAINS A NORMATIVE SENTENCE THIS SEAT WROTE INTO A FILE `CD-D-115` PROTECTS FROM IT — *"not as a note, not as a residue paragraph, and not as a manual step"*. DOES THE PRODUCT OWNER ADOPT IT, ATTRIBUTE IT, OR STRIKE IT?**'
    the_measurement_UPHELD_BY_THIS_SEAT_AT_BL_0134: 'That sentence appears **ONCE in `BLUEPRINT.md` and ZERO TIMES in `PO-DECISIONS-0018`.** `F05` is upheld by command and it is against this seat''s own bytes.'
    what_CHANGED_at_this_boundary_and_what_did_NOT: >
      **CHANGED:** PO-DECISIONS-0019 ruling 3 now contains the same normative content **in the
      Product Owner's own bytes** — *"the three forbidden forms (note, residue paragraph, manual
      step) are struck wherever they carry this obligation"* — so the REQUIREMENT is now
      PO-authored and no longer rests on a seat's invention.
      **DID NOT CHANGE:** the sentence in §16 is still in this seat's words with no attribution, and
      **THIS SEAT DID NOT TOUCH IT.** Removing or re-attributing text in a protected file is the
      Product Owner's act, and a seat quietly deleting the evidence of its own finding is worse than
      the finding. **`PBG-SOD-004`: the seat that raises a finding does not fix it — and here the
      seat that RAISED it was the auditor, and the seat that WROTE it is this one.**
    severity_assessment_offered_not_ruled: '**LOW as a live risk** — the requirement is now genuinely the Product Owner''s and §14/§15 satisfy it. **NOT LOW as a precedent**, which is why it is not being quietly left.'

