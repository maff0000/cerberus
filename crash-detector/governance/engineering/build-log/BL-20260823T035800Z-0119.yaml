product_authority_questions_raised_at_this_boundary:
- id: Q1
  title: '**`F-06-B` — THE LANE DOES NOT CONTAIN ITS OWN GOVERNING AUTHORITY, AND ONLY THE PRODUCT OWNER MAY FIX IT.**'
  measured_by_the_project_lead_independently_of_the_auditor: >
    At `4410275`, in the lane worktree: **`BLUEPRINT.md` reads `version: 0.1.0`** ·
    **`governance/blueprint/` DOES NOT EXIST** (`ls` -> No such file or directory) ·
    **`BP-AMENDMENT-0001` is cited by 29 files** outside `BLUEPRINT.md` and `governance/` ·
    **main's `BLUEPRINT.md` commit is NOT an ancestor of `af2accb`** — `git merge-base --is-ancestor`
    returns **NO**. **THE LANE NEVER RECEIVED IT.**
  and_the_project_lead_reports_a_difference_from_the_auditor_rather_than_adopting_its_number: >
    **`F-06-B` states "96 times across 34 files". THIS SEAT MEASURED 29 FILES.** The exclusion sets
    are not identical and this seat did not count citations, only files. **THE DIRECTION AND THE FACT
    ARE THE SAME AND THE NUMBER IS NOT, AND THAT IS REPORTED RATHER THAN SMOOTHED INTO AGREEMENT**
    (CD-RULE-009). **The finding does not depend on which number is right.**
  why_it_is_the_product_owner_s_and_not_this_seat_s: >
    **`BLUEPRINT.md` AND `governance/blueprint/` ARE PROTECTED FROM EVERY SEAT INCLUDING THE PROJECT
    LEAD.** The precedent is this seat's own: at CD-D-115 it found a §D.3 defect in the blueprint,
    **routed it upward rather than fix it**, and the Product Owner corrected it **by dated append,
    not by edit** (PO-DECISIONS-0008 ruling 1). **A PROJECT LEAD THAT TRANSPORTED A BLUEPRINT ONTO A
    LANE BECAUSE IT BELIEVED THE TRANSPORT WAS MECHANICAL WOULD BE DECIDING WHICH AUTHORITY THE LANE
    IS BUILT AGAINST, WHICH IS THE ONE THING THE PROTECTION EXISTS TO STOP.**
  the_shapes_this_seat_can_see_stated_without_a_recommendation_it_is_not_entitled_to_make: >
    **(A)** the accepted v0.2.0 `BLUEPRINT.md` and `governance/blueprint/` are brought onto the lane
    by the Product Owner, so the lane contains what 29 of its files cite; **(B)** the lane's
    divergence is DECLARED, in all three CD-RULE-004 places, as a known condition of the WO-2R3
    evidence lane; **(C)** neither, and the seventh Assurance seat is told the lane cites an authority
    it does not contain and invited to grade the consequence.
  and_the_thing_this_seat_will_say_against_its_own_comfort: >
    **THE PROJECT LEAD HAS RECONCILED EIGHT INCREMENTS ON THIS LANE AND NEVER MEASURED THIS.** An
    auditor found it in one command. **THAT IS THE SAME METHOD DEFECT AS `CD-PL-F104` AND
    `CD-PL-F102`: a property nobody checked because a name — "the lane" — was accepted as a reading.**
  blocking: '**NO. All six dispatched items are unaffected by every answer, and increment 8 proceeds in parallel.**'
- id: Q2
  title: '**`F-06-J` — DOES §D''s CLOSURE EXTEND TO THE CONSTRUCTION *PATH*? THE AUDITOR CALLS IT A RULING AND IT IS.**'
  the_auditor_s_measurement_not_this_seat_s: >
    Over the live package: **99 governed classes interrogated — 13 SEALED against `__new__` +
    `__dict__.update`, 77 OPEN** (exact type, forged state). **ALL FOUR TYPES THE CD-D-105 CLOSURE WAS
    SCOPED TO ARE OPEN** — `ConfigSnapshot`, `DialSpec`, `ModelSpec`, `PanelRow` — as are `DialSet`,
    the score types, `OK`, `ObservationRecord`, `Empty`, **and all three witness verdicts.** **THE
    MECHANISM IS `__slots__`, THE REMEDY IS ALREADY IN THIS TREE, IT IS APPLIED TO 13 TYPES, AND IT
    WAS NEVER ASKED OF THE OTHER 77.**
  the_question: >
    CD-D-105 ruled *"§D REACHES CONSTRUCTORS … applied at the boundary so a body edit cannot remove
    it."* **A BODY EDIT CANNOT. A CALLER DECLINING TO USE THE BOUNDARY CAN, FOR 77 OF 99 GOVERNED
    TYPES, AND THAT QUESTION WAS NEVER IN THE CLOSURE'S SCOPE.** Does the ruled closure extend to the
    construction PATH — and if it does, is `__slots__` on the witness verdicts and the score types
    the first tranche, as the auditor sequences it?
  why_it_is_the_product_owner_s: >
    **IT WIDENS A CLASS THE PRODUCT OWNER RULED AND HAS ALREADY RE-BASED TWICE** (PO-DECISIONS-0007
    ruling 1, PO-DECISIONS-0008 ruling 2, PO-DECISIONS-0010 ruling 1). **A SEAT THAT WIDENED IT
    ITSELF WOULD BE SETTING SCOPE THE PRODUCT OWNER HAS THREE TIMES RESERVED**, and it would be doing
    it on the most load-bearing definition in the programme. The auditor said the same: *"whether they
    are ruled in one dispatch or several is Product Authority sequencing."*
  blocking: '**NO. All six dispatched items are unaffected, and increment 8 proceeds in parallel.**'

