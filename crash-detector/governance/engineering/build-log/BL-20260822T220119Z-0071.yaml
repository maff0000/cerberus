THE_STOP:
  id: CD-ENG-WO2R3-02-F06
  severity: HIGH
  against: 'the artefact. NOT against any seat.'
  what: >
    **THE WIDENED DOORS TRAVERSAL FINDS ONE PRE-EXISTING, UNDISPOSITIONED VIOLATION IN EXISTING
    PRODUCT CODE.** `src/crash_detector/engine/evaluate.py:341`, `guarded` — the closure inside the
    PRIVATE decorator `_absence_is_never_a_number` that carries the CD-ASR-F03 post-condition. It is
    a PUBLIC-NAMED callable in a RULE 1 judgement-path package, it declares `*extra` and
    `**extra_by_name`, and it carries no `@admits`. `CD-RT-002-DOORS-REQUIRE-THEIR-TYPES` now exits
    1 on it, and `tests/test_judgement_path_doors.py::test_the_static_check_passes_and_is_not_vacuous`
    and `::test_the_collector_boundary_is_a_judgement_path_package_and_cd_bp_003_is_what_remains`
    FAIL because they assert that check exits 0.
  why_this_seat_did_not_resolve_it_and_the_reasoning_is_short: >
    **ALL THREE WAYS TO MAKE IT GREEN ARE PROHIBITED BY THE DISPATCH.**
    (1) ADD AN EXEMPTION — "not a thing to quietly exempt". It would also be the exact defect class
    this increment exists to repair: an exemption invented to absorb the first thing a stricter
    instrument found.
    (2) WEAKEN THE TWO TESTS — "weakening a check, a test or an assertion to obtain a pass".
    (3) EDIT `engine/evaluate.py` — **IT IS PROTECTED.** The writable scope names four `src/` files
    and this is not one of them. **THIS ONE SETTLES IT ON ITS OWN, WITHOUT ANY JUDGEMENT BY THIS
    SEAT.**
    So the increment lands RED on that check, and says so at the top of this entry, in both
    instrument headers, in the register row and in the execution contract.
  what_makes_it_a_QUESTION_rather_than_an_OVERSIGHT: >
    `functools.wraps` copies `__name__` from the wrapped function, so at RUNTIME this object is
    called `_evaluate_dial` — PRIVATE. **THE STATIC READING AND THE RUNTIME NAME DISAGREE ABOUT
    WHETHER IT IS PUBLIC AT ALL.** Whether the right answer is to decorate it, to rename it
    `_guarded`, or to declare a fourth exemption for closures whose every enclosing scope is
    non-public, is a DESIGN DECISION and it belongs to the Product Owner.
  what_this_seat_recommends_and_does_not_do: >
    Nothing is recommended. **A recommendation from the seat that widened the instrument is the
    same seat closing its own finding one step removed**, and the fifth Assurance seat should meet
    this finding with no steer in it, exactly as the fourth seat met CD-PL-F94.
  the_alternative_that_was_considered_and_rejected_and_it_is_recorded_because_it_was_tempting: >
    The doors check's EXISTING rule already propagates "non-public enclosing CLASS" down to members.
    Extending the same propagation to enclosing FUNCTIONS would have exempted `guarded` — the
    enclosing `_absence_is_never_a_number` is private — and it would have looked like symmetry
    rather than an exemption. **IT WAS REJECTED BECAUSE IT WOULD ALSO HAVE RE-OPENED THE AUDITOR'S
    ARM 4** (a function-local `def` bound into a module dict, whose enclosing function may well be
    private) — that is, it would have bought a green tree by giving back the escape this item exists
    to close. **THIS SEAT NOTICED IT WAS ABOUT TO REASON ITS WAY TO A PASS AND WRITES THE ATTEMPT
    DOWN RATHER THAN THE CONCLUSION.**

