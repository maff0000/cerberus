    ordered by source position. The qualified name is threaded through the population tuple, every
    printed line, every ledger row and every violation text — because `CD-PL-F96` is precisely that
    the ledger must NAME what it adjudicated, and a row reading `Verdict` where two classes are
    called `Verdict` is a row a reader cannot act on.
