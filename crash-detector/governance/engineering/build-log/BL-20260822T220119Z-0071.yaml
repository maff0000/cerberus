item_B2_the_count_is_asserted:
  the_defect: >
    "99 class(es) examined" was a `check.note` AND NOTHING GUARDED IT. Worse than unguarded:
    **THE FIGURE MOVED BY ONE WHEN THE AUDITOR'S PLANT ADDED TWO CLASSES** — 99 -> 100 — because the
    CONTAINER was counted and the member inside it was not. A count that moves in the right
    direction for the wrong reason is worse than no count, and this seat measured that itself at
    531c95c with the plant applied.
  the_two_derivations_and_why_they_are_independent:
    derivation_1: 'the adjudication path itself: the shared `parsed` list, `ast.walk`, a parent map.'
    derivation_2: >
      `_ClassCounter`, an `ast.NodeVisitor`: **the file`s BYTES RE-READ FROM DISK and RE-PARSED**,
      traversed by VISITOR DISPATCH (`generic_visit` over `ast.iter_fields`, depth-first) rather
      than `ast.walk` (breadth-first deque over `iter_child_nodes`), computing its own qualified
      names from **its own descent stack**.
    the_dispatchs_own_test_applied: >
      "two readings of the same list are one reading" — these do not share the list, the parse, the
      traversal order, the algorithm, or the name computation.
    what_they_do_NOT_give_independence_from: >
      **THE `ast` MODULE ITSELF, AND THE SET OF FILES HANDED TO BOTH.** A defect in CPython's
      parser, or a file neither reading is offered — which is DECLARED LIMIT 5(ii) — is invisible to
      both. **TWO DERIVATIONS OF ONE INPUT ARE TWO DERIVATIONS, NOT TWO INPUTS.** Declared in all
      three CD-RULE-004 places rather than left for an auditor to notice.
  the_property_not_the_count: >
    The SETS are diffed, not the counts compared (CD-D-119: identical counts have hidden a swap on
    this project before). A class in the independent reading that never reached adjudication is
    `CLASS_NEVER_ADJUDICATED`, a VIOLATION; the reverse is `CLASS_ADJUDICATED_BUT_NOT_FOUND`.
  MEASURED_BOTH_ARMS: >
    In a scratch copy, **ONLY the adjudication loop** was regressed to `tree.body` — the independent
    reading left intact — and the nested plant applied. Observed: `the adjudication path finds 100;
    ... finds 101. IN THE INDEPENDENT READING AND NEVER ADJUDICATED: 1`, EXIT 1, and
    `VIOLATION src/crash_detector/engine/config.py:392 / rule: CLASS_NEVER_ADJUDICATED /
    \`Judgement.Verdict\` EXISTS IN THE PARSED AST AND NEVER REACHED ADJUDICATION`.
    **SO THE GUARD CATCHES THE DEFECT EVEN IF A FUTURE SEAT REVERTS THE WALK.** Carrier:
    tests/test_field_establishment.py::test_the_count_of_classes_examined_is_asserted_against_a_second_derivation.
  and_the_bare_name_collision_report: >
    RULES B AND C REACH THROUGH A NAME, so the frozen-name graph can hold only one node per bare
    name. With the walk widened, two classes at different depths can now share one. Collisions are
    COUNTED AND PRINTED at every run with all their locations and which one is in the graph.
    MEASURED AT THIS SHA: **0**. It is reported rather than made a violation because no ruling
    covers it and inventing one would be this seat legislating.

