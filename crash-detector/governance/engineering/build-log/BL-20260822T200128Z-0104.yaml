  and_this_seat_will_not_pretend_it_is_immune: >
    The Project Lead has raised CD-PL-F36 against itself for transcribing rather than resolving a
    SHA. The failure mode is identical and the remedy is identical: RESOLVE THE FIGURE FROM THE
