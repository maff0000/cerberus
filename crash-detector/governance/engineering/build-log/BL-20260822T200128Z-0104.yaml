- id: CD-ENG-WO2R3-F24
  severity: LOW
  the_seat_said: >
    Offered TO the fourth Assurance seat, against its own work: the implemented membership is
    (1)(2)(3) with NO locus gate, which the seat calls **wider than the ruling's sentence** — a type
    establishing by some third route is also IN and REQUIRED. It believes that is the ruling's
    meaning and says the error direction is toward a LARGER class, but names it as the seam to
    attack the widened definition at.
  ruling: >
    **THE IMPLEMENTATION IS CORRECT AND THE SEAM IS REAL, AND BOTH GO UP.** On the extension the two
    readings coincide: "body-borne OR absent" is EXHAUSTIVE over the body-borne predicate — a type
    either defines an establishing body or does not — so dropping clause (4) as a gate widens the
    class to precisely what the disjunction names and not one type further. Where it genuinely goes
    beyond the SENTENCE is in what it REQUIRES: `@establishes` of every fielded member regardless of
    any third establishment route. **THAT IS RULING 1'S OWN "asserts over the WHOLE enumerated
    population", and the alternative — a third route exempting a fielded type — is the exemption the
    ruling abolished.**
  and_it_is_NOT_settled_by_this_ruling: >
    The Product Owner said in terms that "the seat remains free to attack the widened definition
    itself" (PO-DECISIONS-0010 ruling 3(iii)). **THE PROJECT LEAD'S AGREEMENT WITH THE ENGINEER IS
    TWO IMPLEMENTERS AGREEING AND IS WORTH LESS THAN ONE AUDITOR DISAGREEING.** F24 travels to the
    fourth seat AS THE ENGINEER FRAMED IT, with this ruling attached and not substituted for it.

findings_raised_by_the_project_lead_at_this_boundary:
- id: CD-PL-F93
  severity: MEDIUM
  title: >
    **THE PROJECT LEAD'S OWN DISPATCH STATED THE MEMBERSHIP RULE TWO INCOMPATIBLE WAYS IN TWO
    ADJACENT SUB-ITEMS, AND THE NARROWER OF THE TWO WOULD HAVE CONTRADICTED THE RULING IT WAS
    TRANSMITTING. THE SEAT CAUGHT IT. THE PROJECT LEAD DID NOT.**
  what: >
    CD-DISPATCH-WO2R3-INC5C-ENGINEER objective **(a)** wrote: "A class is IN the class when it is
    PUBLIC (1), a FROZEN SUBJECT (2), ON A JUDGEMENT PATH (3), **and DECLARES AT LEAST ONE FIELD**."
    Objective **(b)** wrote: "Do NOT make the vacuous case a silent exclusion that drops it from the
    ledger — the ruling says the instrument asserts over the WHOLE population. Enumerate it, count
    it, print WHY it passes." **THESE DISAGREE.** Under (a), `Empty` is OUT and the population is 32.
    Under (b), `Empty` is IN and the population is 33. The seat reported the contradiction, took
    (b)'s reading because it is the RULING'S own wording ("satisfies vacuously"; "the WHOLE
    enumerated population"), built the output so the narrower reading is still available without
    trusting its choice (POPULATION 33 / FIELDED 32 / ZERO-FIELD 1 printed side by side), and
    recorded the adjudication in the Build Log rather than deciding it silently.
  direction_of_error: >
    **TOWARD THE NARROWER CLASS, WHICH IS THE DANGEROUS DIRECTION AND IS THE EXACT DEFECT THE RULING
    EXISTS TO CORRECT.** Followed literally, (a) would have dropped the zero-field type out of the
    enumeration entirely — a class definition that is a census of what BOTHERED to qualify, which is
    the sentence PO-DECISIONS-0010 ruling 1 was written to kill. **THE PROJECT LEAD REPRODUCED THE
    DEFECT INSIDE THE DISPATCH THAT WAS TRANSMITTING THE FIX FOR IT.**
  how_found: 'By the Engineer seat, and reported unprompted in its return under "Ambiguity handled,
    not resolved quietly". Not by the Project Lead, at drafting or at issue.'
  why_it_is_MEDIUM_and_not_LOW: >
    It was not a wording slip. It was a MEMBERSHIP RULE — the one thing this entire increment is
    about — stated two ways in a document whose whole purpose was to state it once, correctly, on
    behalf of a Product Owner ruling the Project Lead does not have the authority to narrow. Had the
    seat obeyed (a) literally, as an Engineer is entitled to do with an explicit scope clause, **THE
    DELIVERED INSTRUMENT WOULD HAVE ENFORCED A NARROWER CLASS THAN THE PRODUCT OWNER RULED, AND
    EVERY CHECK IN THIS REPOSITORY WOULD HAVE BEEN GREEN.** The contrast in (f) would still have
    passed, because `Verdict` is fielded either way.
  what_saved_it: >
    **NOT A CONTROL. A SEAT THAT READ THE RULING BEHIND THE DISPATCH INSTEAD OF ONLY THE DISPATCH.**
    That is worth recording plainly, because it is not a mechanism and it will not be there next time
    by construction.
  this_is_the_fourth_consecutive_boundary_at_which_a_control_of_this_projects_own_design_was_found_scoped_narrower_than_the_class_it_names: >
    CD-D-114 (the Product Owner's own list of four types), CD-PL-F89 (the Project Lead's one-sided
    sequence bound), CD-D-134 (the ruled class itself), and now CD-PL-F93 (the dispatch transmitting
    CD-D-134). **THE PATTERN HAS NOW CAUGHT EVERY PARTY ON THIS PROJECT INCLUDING THE ONE WRITING
    THIS SENTENCE, AND IT IS NOT SLOWING DOWN.**
  disposition: >
    RAISED, RECORDED, NOT REMEDIED BY A RULE HERE. A rule amendment drafted in the same hour as the
    finding is a rule amendment drafted in a hurry (the same reasoning applied to CD-PL-F91). It goes
    to the fourth Assurance seat standing, and it is named in that seat's brief.

