the_contrast_the_project_lead_ran_itself_because_nothing_else_proves_this_completion:
  rule: 'CD-D-138, ruled at the issuing boundary before the seat had written a line.'
  the_variant: 'variants/WO-2R3/V43-fielded-judgement-path-type-with-no-establishment.patch'
  what_it_adds: >
    `@dataclass(frozen=True) class Verdict: score: float` under src/crash_detector/engine/, with NO
    `__post_init__`, NO `__init__` and NO `@establishes` — DECLARED LIMIT 1's own executable example,
    which the limit spelled out in advance precisely so that the hole could be demonstrated and not
    argued about.
  old_arm:
    command: >
      rm -rf /tmp/pl-arm-old && mkdir -p /tmp/pl-arm-old && git archive 46adf33 | tar -x -C
      /tmp/pl-arm-old && cd /tmp/pl-arm-old && git apply -p1 <the V43 patch> && python3 -B
      tools/register/check_constructor_field_establishment.py --root .
    observed: '**EXIT 0 · "PASS — 96 assertions, 0 violations" · ADJACENT SET: 2 · 100 classes examined.**'
    the_line: >
      "ADJACENT (not required, and this is a real hole): engine/verdict.py:40 Verdict [RULE A]
      fields=['score']"
    what_it_establishes: >
      **THE HOLE WAS REAL AND IT WAS OPEN.** A fielded public frozen judgement-path type with no
      establishment whatsoever entered the tree at `46adf33` and the governing instrument EXITED 0
      and called it an adjacency. This is CD-ENG-WO2R3-F17 demonstrated by execution, at the SHA
      where the seat that raised it had already declared it and refused to close it.
  new_arm:
    command: 'the SAME patch and the SAME command, in a fresh pristine extraction of 531c95c'
    observed: '**EXIT 1 · "FAIL — 1 violation(s)".**'
    the_line: >
      "VIOLATION  src/crash_detector/engine/verdict.py:40 — Verdict is a PUBLIC FROZEN type ON A
      JUDGEMENT PATH declaring 1 field(s) ['score'], and it carries no @establishes(...). Its
      establishment is ABSENT (no __post_init__ or __init__ in its own class body). Since
      PO-DECISIONS-0010 ruling 1 the class reads BODY-BORNE OR ABSENT ... a type that establishes
      NOWHERE FAILS ON ARRIVAL rather than sitting outside a class worded around bodies."
  hygiene: >
    Neither arm mutated a worktree and neither used a git worktree. Two independent `git archive`
    extractions, patched in /tmp, run there, discarded.
  and_what_the_contrast_does_NOT_establish: >
    **IT IS ENTIRELY STATIC, AND THE SEAT SAID SO FIRST AND UNPROMPTED.** `Verdict` is never imported
    or constructed in either arm; **IT WOULD STILL BE CONSTRUCTIBLE AT RUNTIME IN THE FAILING ARM.**
    What the contrast proves is that the TREE can no longer HOLD such a type and pass its own check.
    Every benefit of this widening is PROSPECTIVE — it closed no present exposure, because the
    Project Lead measured before the dispatch that there was none. That is the ruling's whole point
    (a prospective unguarded door is what "by construction" must refuse) and it is also the exact
    limit of this evidence.

