Q33:
  question: >
    *** **`schema_version` `1.1.0` NOW NAMES TWO DIFFERENT CONTRACTS, AND THE SCHEMA'S OWN PROMISE TO
    ITS CONSUMER IS THEREFORE FALSE. THE DECISION NOT TO BUMP WAS PARTLY A SCOPE ARTEFACT AND NOT
    WHOLLY A JUDGEMENT, WHICH IS WHY IT COMES TO THE PRODUCT AUTHORITY.** ***
  the_schemas_own_words: '*"Pinned by const. A consumer that reads this document knows exactly which allowlist it was validated against."* **THAT SENTENCE IS NOW FALSE**: `1.1.0` identifies both the 16A contract (which admitted `calm` on `UNKNOWN`) and the 16A-FIX contract (which refuses it).'
  where_this_seats_reasoning_held_and_where_it_did_not: >
    At `0161` this seat argued (a) the written rule concerns **widening** and this is a **narrowing**,
    and (b) `1.1.0` has never been emitted because `publish_cycle` has zero callers. **THE AUDITOR
    UPHELD (a) ON THE LETTER OF THE RULE AND WEAKENED (b), AND IT IS RIGHT.** Consumers of the
    STRING do exist and this seat re-measured them: `ENVELOPE_SCHEMA_VERSION = "1.1.0"` in
    `envelope_contract.py:103`; `test_envelope_contracts.py:321` asserts the schema `const` equals
    that constant; `publication_fakes.py` stamps it; migration `0005` carries a column and a `CHECK`;
    **and the contract `$id` itself embeds it —
    `urn:crash-detector:contracts:private-envelope:1.1.0` — SO ONE URN NOW IDENTIFIES TWO DIFFERENT
    DOCUMENTS.** **NONE OF THEM BREAKS. THEY CONSUME THE STRING, NOT THE SEMANTICS. THE HONEST
    STATEMENT IS THE AUDITOR'S: THE VERSION STRING HAS SILENTLY LOST ITS DISCRIMINATING POWER.**
  why_it_is_the_gate_and_not_a_backlog_item: >
    **BECAUSE THE FIX SEAT COULD NOT HAVE DECIDED IT.** `ENVELOPE_SCHEMA_VERSION` and its assertion
    were **outside its writable scope** — a scope this seat drew — so *"the decision not to bump"* is
    **partly an artefact of the dispatch and not wholly a considered judgement.** The auditor said so
    and it is exactly right. **A DECISION NOBODY WAS ALLOWED TO MAKE IS NOT A DECISION, AND RECORDING
    IT AS ONE WOULD BE THIS PROJECT'S OLDEST FAILURE MODE.**
  status: 'OPEN. Next actor PRODUCT_AUTHORITY. Silent execution PROHIBITED. **DOES NOT BLOCK 16B — it blocks calling 16A-FIX finished.**'

