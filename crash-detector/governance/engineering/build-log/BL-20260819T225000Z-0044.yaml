# ================================================================================================ #
# 2. WHAT THE PRODUCT AUTHORITY RULED
# ================================================================================================ #
the_ruling:
  source: governance/decisions/PO-DECISIONS-0003.md
  commit: ae3188cf2854bf37a965277c99afcf3354f3478d
  author: 'Matt Scott <rogue@cerberus.local>. NOT a seat. Verified with `git log --format` on the
    commit, not read off the subject line.'
  provenance_note: >
    ae3188c changes ONE file, +32 lines, and it is the decision record. It touches no code, no
    dispatch and no continuity record. The Product Authority ruled and left the transcription to the
    Project Lead, which is the correct division and is why this entry exists.
  question_asked: 'WHAT CLOSES CD-AC-002, AND WHEN? Three options were set out in full at
    BL-20260819T222917Z-0043: (A) return BLUEPRINT §7 for architectural review now; (B) rule
    CD-AC-002 at WO-2 scope on the measured basis and attach model integrity to CD-D-005 for WO-3;
    (C) treat this as the third carrier-shaped failure, SUSPEND implementation and return §7.
    (B) was RECOMMENDED and DELIBERATELY NOT SELF-ADOPTED.'
  answer: '(B) AND (A) TOGETHER, BOUND SO NEITHER CAN DRIFT. Not the recommendation as offered.'
  the_four_rulings_transcribed:
    - 'RULING 1 — CD-AC-002 IS RULED AT WO-2 SCOPE ON A MEASURED BASIS (which layer refused what,
       per CD-PL-F74): a WO-2 candidate registers no model, no source, deploys nothing and has no
       publication layer, so THE INJECTED-MODEL ROUTE IS NOT IN WO-2''S POPULATION. The criterion at
       WO-2''s gate covers every route that needs no injected model. THE FULL-WIDTH CRITERION IS NOT
       NARROWED, SUPERSEDED OR SOFTENED — it remains MANDATORY and TRAVELS TO WO-3.'
    - 'RULING 2 — BLUEPRINT §7 RETURNS FOR ARCHITECTURAL REVIEW as the mandatory FIRST item of WO-3,
       before any collector or model wiring: the engine OWNS the model lifecycle, so a shared mutable
       object cannot be injected. CLOSURE BY CONSTRUCTION, NOT ANOTHER GUARD. This CONVERTS the
       CD-D-073 standing condition: the carrier/admission class has now shown open a THIRD time —
       caught UPSTREAM of the gate, which the PO names as the loop working — so the architectural
       review is NO LONGER CONTINGENT. Only its TIMING was the PO''s to set.'
    - 'RULING 3 — MODEL INTEGRITY ATTACHES TO CD-D-005, the ingredient register owed by the PO. A
       model is an ingredient with provenance, and the register will say what the number should be
       traceable to. "The engineer was right that admission alone cannot know it."'
    - 'RULING 4 — THE SCOPING ITSELF IS ATTACK SURFACE. The third Assurance seat is EXPLICITLY
       INVITED to attack this ruling''s basis: if it can exercise an injected-model route inside a
       WO-2 candidate''s REAL population, THE RULING FALLS AND (C) SUSPENSION APPLIES. "A PO scoping
       a criterion at the moment of failure is the acceptance-semantics trap; the only honest defence
       is handing the auditor the knife."'
  the_engineers_restraint_is_endorsed: >
    The PO's opening sentence, recorded because it is the part a later seat is most likely to lose:
    refusing to order a guard that looks like a closure is named as THE LESSON OF TWO GATES, APPLIED
    BEFORE IT COST A THIRD. CD-ENG-WO2R2-01 raised CD-ENG-WO2R2-F03 against its own delivered
    closure, deliberately built no guard, and said so first. That conduct is now endorsed on the
    Product Owner's own record and is the standard for the remaining increments.
  proceed_instruction_verbatim: >
    "Proceed: complete held increments 2 and 3; then the THIRD fresh Assurance seat, fresh variants,
    with this decision record in its brief. Gate: PASS on all five as ruled here, no waiver,
    latest_admitted_run null until the paired verdict rule is satisfied."

# ================================================================================================ #
# 3. THE PROJECT LEAD'S RULINGS ON THIS BOUNDARY
# ================================================================================================ #
decisions:
  - id: CD-D-074
    title: 'THE HOLD ON WO-2R2 INCREMENTS 2 AND 3 IS DISCHARGED.'
    ruling: >
      The tenth seat held increments 2 and 3 for exactly one reason, stated in terms: CD-AC-002 could
      not reach PASS on the evidence, so a third gate would have failed whatever they delivered, and
      the answer might change what increment 2 was asked to do. BOTH LIMBS ARE NOW ANSWERED. Ruling 1
      settles how CD-AC-002 reaches WO-2's gate; ruling 4 states what would unsettle it and who gets
      to try. The instruction is "Proceed: complete held increments 2 and 3". The hold is discharged
      by the authority that would have had to authorise the work anyway, and the next actor is the
      ENGINEER.
    what_is_not_discharged: >
      CD-HOLD-003, CD-HOLD-004 and CD-HOLD-005 are UNTOUCHED and remain HELD. This ruling discharges
      one hold on two increments of one dispatch. It is not a general release, and CD-HOLD-004 in
      particular — no ingredient source registered until CD-D-005 issues — is REINFORCED by ruling 3,
      which attaches model integrity to that same undelivered register.
  - id: CD-D-075
    title: 'THE RULING DOES NOT WIDEN INCREMENT 2, AND THE RESEMBLANCE IS THE TRAP.'
    ruling: >
      An injected ContributionModel IS, at the level of doctrine, "a judgement this system makes that
      delegates its deciding operation to an object the system did not construct" — which is Class 2's
      own sentence, one operand across. The tenth seat named that resemblance itself when it warned
      the answer might change increment 2. IT DOES NOT, AND THE REASON IS THE RULING'S OWN STRUCTURE:
      the PO routed the injected-model route to WO-3, to architectural review of BLUEPRINT §7
      (ruling 2) and to the CD-D-005 register (ruling 3), expressly as CLOSURE BY CONSTRUCTION AND
      NOT ANOTHER GUARD. Folding CD-ENG-WO2R2-F03 into increment 2 would build the fourth clever
      guard, in an increment not scoped for it, against a class the Product Authority has ruled is
      closed at a different altitude — and a guard that looks like a closure is the defect that has
      cost this project two gates.
      Increment 2 is therefore UNCHANGED IN EVERY PARTICULAR: CD-AC-005, ASR2-F02, the
      `_finite_measure` float-subclass sibling, the sweep as the deliverable, boundary 3 corrected.
      If the Class 2 sweep's enumeration REACHES the model path — and it may, because the sweep is
      over every path that decides staleness, agreement or reading-ness — the seat DECLARES it as
      outside this increment's bound and does not close it. Declaring is the CD-RULE-004 obligation;
      closing would be the scope breach.
    why_the_project_lead_states_this_rather_than_leaving_it_implicit: >
      Because "the PO has ruled on CD-AC-002, so tighten the model path while you are in there" is
      the reading a competent seat arrives at unprompted, and silence from the dispatcher would look
      like consent. CD-D-055's precedent is that a bounded addendum at the head of an increment is
      how this project corrects a brief without re-opening it.
  - id: CD-D-076
    title: 'RULING 4 BECOMES A WRITTEN OBLIGATION ON THE THIRD ASSURANCE DISPATCH NOW, NOT LATER.'
    ruling: >
      The PO's ruling 4 is not a remark; it is a condition on which the WO-2 gate now rests. It is
      recorded HERE, at the boundary where the ruling arrives, as a binding requirement on
      CD-DISPATCH-WO2R2-ASSURANCE whenever that record is drafted: the third Assurance seat must be
      handed PO-DECISIONS-0003 in its brief, told in terms that THE SCOPING ITSELF IS A TARGET, and
      told what follows if it succeeds — the ruling falls and (C) suspension applies, which means
      BLUEPRINT §7 returns for architectural review and implementation stops. An auditor invited to
      attack a scoping and not told the consequence of winning has been given a rhetorical
      invitation, not a gate condition.
    why_now: >
      CD-PL-F67 was raised because a dispatch's path list was wrong at issue. The failure mode here is
      worse and quieter: an obligation created at boundary N and needed at boundary N+3, carried only
      in a Project Lead's head across a two-hour runtime ceiling that has already killed six seats.
      Written down, it survives this seat. That is PBG-CONT-007 applied to an obligation rather than
      to an artefact.
  - id: CD-D-077
    title: 'THE DISPATCH RECORD IS AMENDED, AND THE AMENDMENT IS BOUNDED AND VISIBLE.'
    ruling: >
      CD-DISPATCH-WO2R2-ENGINEER.yaml gains ONE new top-level block,
      `addendum_increment_2_head_po_decisions_0003`, immediately preceding
      `increment_2_class_2_judge_values_never_types`. It states its own date, seat, authority and
      rulings; it says in its first lines that it AMENDS NO INCREMENT CONTENT; and it carries
      CD-D-075's prohibition under a heading that tells the reader to read it twice. NO EXISTING FIELD
      OF THE DISPATCH IS EDITED — the increment 2 and increment 3 blocks are byte-identical to their
      issued form. Precedent is BL-20260819T161222Z-0030, which amended a dispatch in the repository
      "so the brief is durable and not merely conversational", and CD-D-055, which put a bounded
      addendum at the head of an increment rather than re-opening the increment.
    the_dispatch_status_does_not_change: >
      It remains ISSUED, to the same seat CD-ENG-WO2R2-01, at the same lane base, with the same three
      increments. An addendum that changed the status would be a re-issue, and a re-issue would need a
      fresh authority basis this seat does not have.

