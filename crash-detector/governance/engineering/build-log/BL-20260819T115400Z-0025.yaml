the_structural_move: >
  THE CLOSURE MOVED FROM THE EXIT TO THE RE-ENTRY, which is the move the Project Lead offered as a
  DIRECTION and the seat adopted with its own reasoning. Increment 2 tried to stop a number leaving
  a magnitude. That is an exit class with no last member — close repr and the attack moves to str,
  then to __format__, then to json, then to whatever is next. Increment 2b stops a number COMING
  BACK. A DialMagnitude now admits a DeclaredQuantity and nothing else: a finite float paired with
  the frozenset of dials its derivation touched, compared to the target dial by SET EQUALITY. Any
  float that has left a magnitude by any route has lost its dials and can no longer re-enter one.
  It enumerates no laundering route because it does not need to — it removes the destination they
  all share. This is the same question-change that closed increment 1: not "is this number
  blended?", which is undecidable, but "is this number's provenance DECLARED?", which is set
  equality.
  THE SECOND LAYER IS DIFFERENTLY SHAPED, which is the point. Two doors establish a provenance, and
  RULE 4 of check_no_blend.py DENIES BY DEFAULT over four declared admission sites. It recognises
  nothing about a blend; it watches the one door a laundering module cannot avoid.

the_direction_on_repr: >
  The seat chose (ii) DECLARATION and gave a reason the Project Lead accepts: repr is one member of
  an exit class with no last member, so closing it moves the attack sideways rather than closing
  anything. The claim "reducing one to a number requires naming its single dial" is WITHDRAWN from
  the execution contract and repr is named as a release door. The Project Lead's dispatch warned
  that (ii) ALONE does not close CD-ASR-F01, and the seat did not stop there — it closed the
  laundered-float class at the re-entry instead, and proved it with V16, which launders through an
  f-string and a JSON round trip with NO REPR ANYWHERE and is refused. That is the correct shape of
  answer: the declaration is honest AND the class is closed by something else.

