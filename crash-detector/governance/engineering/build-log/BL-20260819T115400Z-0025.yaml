decisions:
  - decision_id: CD-D-040
    ruling: >
      WO-2R INCREMENT 2b IS ACCEPTED. CD-PL-F54 IS CLOSED. CD-ASR-F01 IS CLOSED AS A CLASS under
      CD-RULE-004, by structure at the re-entry plus a deny-by-default static layer at the doors,
      with a declared limit written in the honest form CD-RULE-006 now requires.
    the_test_this_passes_that_increment_2_failed: >
      Increment 2's declaration said another layer carried the residue and that layer did not.
      Increment 2b's declaration says, of the same kind of residue, "NOT PROVED TO BE CARRIED
      ANYWHERE AT RUNTIME". The first misdirects an auditor; the second points straight at the soft
      spot and dares them to hit it. That is the whole difference and it is the difference the rule
      was written to make.
  - decision_id: CD-D-041
    ruling: >
      THE SEAT'S CD-ENG-WO2R-F12 IS THE RIGHT QUESTION AND THE PROJECT LEAD DOES NOT ANSWER IT
      ALONE. The seat wrote: "the admission door concentrates the residual trust and only a static
      layer guards it; if the Project Lead judges that insufficient for CD-AC-002, CD-ASR-F01 is not
      closed to the standard required, and that judgement is theirs, not mine." Refusing to grade
      its own homework is exactly correct and is recorded as commendable.
      THE PROJECT LEAD'S VIEW, offered as reconciliation and not as a verdict: the residue is the
      residue of ANY registry, the layer that guards it denies by default rather than recognising,
      and a runtime guard on the IDENTITY OF THE CALLING MODULE would be introspection of the call
      stack — fragile, defeatable, and carrying a worse residue than the one it replaced. On that
      reasoning the Project Lead reconciles the increment as ACCEPTED.
      BUT THE GATE IS NOT THE PROJECT LEAD'S. CD-AC-002 is one of the five criteria an independent
      auditor must PASS, and whether a deny-by-default static layer over four declared doors is
      sufficient for "unrepresentable/unpublishable as a class" is precisely a question for that
      auditor. F12 is therefore carried FORWARD INTO THE ASSURANCE DISPATCH AS A NAMED QUESTION, and
      is disclosed to the Product Owner in this entry rather than settled inside it.
  - decision_id: CD-D-042
    ruling: >
      PL-R1..PL-R5 JOIN THE EXCLUSION SET. They are written into this entry and are, from this
      commit, part of the KNOWN SET and prove nothing about the class. CD-ASR-WO2-02 must devise
      variants that are none of: the WO-2 auditor's ten, the Engineer's seventeen, or the Project
      Lead's twenty-three.
  - decision_id: CD-D-043
    ruling: >
      THE PROJECT LEAD STOPS HERE RATHER THAN STARTING INCREMENT 3. This runtime has approximately
      fifty minutes of ceiling remaining and four seats have already been killed mid-work on this
      project. Increment 3 (CD-ASR-F04, the egress allowlist) is a whole increment; started now it
      would be killed in the middle, and the cost of that is not zero — it is a dirty lane, an
      unattested change set, and a successor spending its first half hour inventorying what was left
      behind, which is exactly what happened at the third termination. A clean boundary with a
      durable record is worth more than forty minutes of unattested progress.

