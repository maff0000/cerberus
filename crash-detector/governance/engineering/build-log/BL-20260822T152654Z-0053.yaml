    invariants, and `PanelRow`'s field re-establishment.
  the_three_answers_available_and_the_project_lead_recommends_none: >
    (A) §D REACHES CONSTRUCTORS — a fifth increment, or increment 3 enlarged, applying establishment
    derived from the signature to `__post_init__`. (B) §D DOES NOT REACH CONSTRUCTORS AND THE RESIDUE
    IS DECLARED AND CARRIED FORWARD — the current state, with V17 as its executable example and "NOT
    PROVED TO BE CARRIED ANYWHERE" as its honest carrier, owed at WO-3 or later. (C) THE FOURTH
    ASSURANCE SEAT IS INVITED TO ATTACK THE SCOPING, as the third seat was invited at
    PO-DECISIONS-0003 ruling 4 and DID — which would decide it on measured grounds rather than on
    anybody's reading, and which has cost this project an increment before and been worth it.
  what_the_project_lead_did_in_the_meantime: >
