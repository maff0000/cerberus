    axis twice — accepting §D's extension beyond the literal words of ruling 2, and ruling A6 IN at
    PO-DECISIONS-0005 ruling 4 — and priced the second enlargement explicitly as "a cost accepted
    here and PAID WITH THE PROJECT LEAD'S INCREMENT DISCIPLINE, NOT WITH A SCOPE CUT". A Project
    Lead that took that decision itself would be setting scope the PO has twice reserved.
