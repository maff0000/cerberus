  why_first: >
    PO-DECISIONS-0005 ruling 1 directs the FOURTH ASSURANCE SEAT to run P7 first. The Project Lead
    took it first for the same reason: it is what distinguishes "establishment derived from the
    signature" from "four type checks on four named functions", and if it does not bite, nothing
    else in this increment matters.
  the_driver: '/tmp/pl_p7_driver.py — the PROJECT LEAD''s own, written from the product''s public API. It constructs a REAL `PanelRow` on the product''s own terms and calls `resolve_panel` the way every caller in the product calls it. It is not the seat''s test.'
  the_plant: 'variants/WO-2R3/V20-p7-added-parameter.patch — ONE line: `tolerate_stale: bool = False` added to the signature of the REAL `resolve_panel`. Nothing else. Applied to a pristine extraction with `git apply -p1`.'
  BASELINE_ARM_the_call_that_matters:
    call: 'resolve_panel(row, now_utc=..., staleness_window_seconds=...) — AN ORDINARY CALL THAT DOES NOT PASS THE NEW ARGUMENT AND DOES NOT KNOW IT EXISTS.'
    observed: >
      REFUSED. `UndeclaredParameter: resolve_panel is a FAULTED door and every call to it is
      refused. parameter 'tolerate_stale' is in the signature of resolve_panel and was NOT declared
      to admits(). A new argument on a judgement-path door arrives REFUSED, never unguarded
      (BP-AMENDMENT-0001 §D.1; planted violation P7).`
    why_this_is_the_whole_point: >
      THE CALLER DID NOTHING WRONG AND IS STILL REFUSED. That is the property ruling 1 accepted: the
      door is faulted by the ADDITION, not by the use. A mechanism that only refused calls which
      PASSED the new argument would be a type check with extra steps — it would let every existing
      caller through an entry point that has silently grown a new way in.
    also_observed: 'A caller that DOES pass `tolerate_stale=True` is refused by the same fault. Both calls, one refusal.'
  VIOLATED_ARM:
    plant: 'variants/WO-2R3/V23-p7-violated.patch — the same added parameter, with the @admits decorator REMOVED.'
    observed: 'BOTH CALLS ADMITTED. `Agrees(divergence_measure=0.02, ...)`. The escape returns the moment the structure is removed, which is what makes the baseline arm a guard rather than a test that would have passed anyway.'
  the_static_half: >
    On the V20 tree the check exits 1 with `PARAMETER_NOT_DECLARED_TO_ADMITS` naming the file, the
    line and the parameter — the same fact read WITHOUT IMPORTING ANYTHING. The runtime and the
