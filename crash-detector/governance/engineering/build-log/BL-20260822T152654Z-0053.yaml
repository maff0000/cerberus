    THE STANDING CONDITION THIS WHOLE RE-ARCHITECTURE IS MEASURED AGAINST NAMES CONSTRUCTORS THREE
    TIMES: "the auditor's plant must die at DialSpec construction, at ModelSpec construction, at
    ConfigSnapshot construction and at resolution — four independent refusals, THREE OF THEM AT
