what_was_built:
  ITEM_1_F08_identity_is_no_longer_the_discriminator: >
    **`tools/coordination/check_scope_disjoint.py`.** The four-line same-seat skip is REMOVED and
    the pair loop now examines EVERY pair of DISTINCT live claim records at ANY identity. The
    refusal LABELS a same-identity pair and NAMES the founding-incident shape rather than merely
    exiting 1. **THE TWO NEIGHBOURS OF THE SKIP SURVIVE, AND THEY ARE NOW STATED AS WHAT THEY
    ACTUALLY ARE:** `READ x READ` is a PAIRING exemption (the left side of every constructed
    pairing is a WRITE scope, so it is never built), and a record's own write-vs-own-read is a
    SINGLE-RECORD exemption (`range(i+1, ...)` means a record is never compared with itself).
    **NEITHER IS AN IDENTITY EXEMPTION AND NEITHER EVER WAS** — which is exactly why deleting the
    skip does not take them with it.
  ITEM_1_the_design_call_declared_rather_than_left_implicit: >
    **A SEAT HOLDING TWO OR MORE *DISJOINT* LIVE CLAIMS IS STILL ADMITTED.** Refusing all
    same-identity multi-claim was available and defensible and was NOT taken, because it narrows
    what the machinery permits. Only the OVERLAPPING same-identity pair is the violation.
    PLANT-COORD-05 arm 3 measures the disjoint same-identity pair still proceeding.
  ITEM_2_the_false_L1: >
    Increment 12's `L1` claimed WRITE x WRITE disjointness *"over all live claims"* and the code
    decided it over CROSS-SEAT pairs only. **THE CODE DEFECT AND THE FALSE CLAIM ABOUT THE CODE ARE
    TWO DEFECTS AND THE PRODUCT OWNER NAMED THEM SEPARATELY.** Every line of the LIMITS block and
    the whole module docstring were RE-DERIVED against what the code now enforces — including three
    limits that did not exist before (the identity-blindness, the deliberate admission of disjoint
    multi-claim, and `IT IS NOT INVOKED BY ANYTHING`). **THE SAME SWEEP WAS RUN OVER `claim.py`'s
    `L2`, `lease.py`'s LIMITS AND `check_lease_held.py`'s LIMITS**, and all three of `CD-RULE-004`'s
    places moved together (see `the_third_place`).
  ITEM_3_F04_check_then_take_is_now_one_act: >
    **`registry.critical_section`** — `fcntl.flock(LOCK_EX|LOCK_NB)` on `<registry-dir>/.registry.lock`
    with a 30s deadline after which it RAISES and the caller REFUSES. `claim.py` runs its live-claim
    scope check and its `O_EXCL` take inside one section. **THE PAYLOAD IS BUILT BEFORE THE SECTION
    IS ENTERED**, deliberately: it contains two `git` subprocesses, and holding a registry mutex
    across a subprocess would turn a microsecond decision into the serialisation this increment must
    not ship. Nothing inside the section blocks.
  ITEM_3_why_flock_and_not_a_lock_file: >
    A lock FILE leaks. A seat hard-killed by the operator's wrapper — which has happened on this
    project, and an entire Assurance audit ceased to exist — leaves an `O_EXCL` lock file behind,
    every later claim deadlocks against a corpse, somebody adds a stale-lock timeout, **and the
    timeout is the hole**. `flock` is released by the kernel when the descriptor closes, including
    on SIGKILL. No stale state, therefore no reaping policy to get wrong.
  ITEM_4_F05_the_carrier_no_longer_corrupts_its_own_input: >
    **`tools/coordination/launch.sh` was restructured and the fix is THREE things, not one.**
    (1) `set -euf` — PATHNAME EXPANSION IS OFF FOR THE WHOLE SCRIPT, so a glob cannot be expanded
    against the filesystem there at all. (2) The scope arguments NEVER BECOME A STRING: they are
    carried in the positional parameter list and passed as `"$@"`, which is not subject to field
    splitting. **THERE IS NO `eval` AND NO QUOTING SCHEME TO GET WRONG** — a scope containing
    spaces, tabs, `*`, `?` or `[` arrives byte-for-byte as typed, MEASURED. (3) `lease.py` now
    ECHOES the write and read scopes it actually RECEIVED at every acquisition, so a FUTURE
    carrier's corruption is visible where it happens instead of eleven days later.
  ITEM_4_a_second_ordering_defect_fixed_while_in_there: >
    The old script validated "is there a COMMAND after `--`" AFTER acquiring the lease. A launch
    that could not run would have stranded a live lease over a seat that never existed, and the
    next real launch would have collided with a ghost. Both that check and "was any --write-scope
    given" now run BEFORE the lease is taken.
  ITEM_4_F11_the_depth_rule: >
    **`scope.py`: ONE return changed.** A shorter NON-RECURSIVE pattern all of whose segments
    intersect a longer one names a PARENT of what the longer names, and is now
    `OVERLAP/PARENT_PATH` instead of `DISJOINT`, because a write to a parent path (`rm -r`, `mv`,
    `rmdir`, symlink replacement) reaches its children. **MATCHING AND OVERLAP ARE DIFFERENT
    QUESTIONS AND INCREMENT 12 CONFLATED THEM.** The algebra is textual and its pure-algebra path
    has no worktree, so it cannot ask whether the parent is a directory today — and *"not a
    directory yet"* is not a property a coordination control may rest on: CD-RULE-003, fail closed.
    **THE AUTOMATON IS NOT TOUCHED** and the ninth seat's instruction not to rewrite it was obeyed.
  ITEM_5_F09a_time_of_write: >
    **`check_lease_held.py --range` now grades each commit against each lease's RECORDED LIVE
    INTERVAL at THAT COMMIT'S committer timestamp**, and no longer consults pid liveness — which was
    wrong in the other direction, since the seat that made a historical write is normally dead by
    the time anyone audits it. A lease acquired after a commit does not cover it, so the one-command
    retro flip moves nothing.
  ITEM_5_F09b_the_pid_half: >
    **`lease.py._authenticate_pid` DERIVES a session bound: `os.getsid(pid) == os.getsid(0)`.**
    That refuses `--pid 1` (init, session 1, always alive, the immortal lease) **BY DERIVATION AND
    NOT BY A DENYLIST** (CD-RULE-003; a denylist is `F13`'s sin and this seat did not commit it
    while fixing `F09`). Every lease record now carries `pid_authenticated: false` and its
    `pid_basis` in its own bytes.

