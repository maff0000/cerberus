- id: CD-ENG-COORD-FIX-01-F05
  severity: LOW
  against: 'this seat''s own `F09` fix — a residue that is returned, not closed'
  what: '**`CONTROL_NOT_SATISFIABLE` FOR FULL `--pid` AUTHENTICATION.**'
  detail: >
    A pid cannot be authenticated from userspace on this platform; there is no `getpeercred` for a
    number typed on a command line. What is DERIVED is a session bound, which refuses `--pid 1` and
    every pid in another seat's session. **A CALLER MAY STILL NAME A LONG-LIVED *SIBLING* PID INSIDE
    ITS OWN SESSION AND THAT IS NOT CLOSED.** The dispatch names this return as acceptable for that
    half and it is taken. Every lease record carries `pid_authenticated: false` in its own bytes so
    that no later reader mistakes the bound for a proof.
  and_the_second_half_of_the_same_residue: >
    **NEITHER TIMESTAMP `--range` READS IS TRUSTWORTHY UNDER AN ADVERSARY.** `GIT_COMMITTER_DATE` is
    settable and a lease record is an editable YAML file. The mode defeats the ONE-COMMAND RETRO
    FLIP that was measured; **it does not withstand a party willing to forge a timestamp and nothing
    in this repository does.** NOT PROVED TO BE CARRIED ANYWHERE.

