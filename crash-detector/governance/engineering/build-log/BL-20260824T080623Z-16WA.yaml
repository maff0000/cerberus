findings:
  - id: CD-ENG-WO3-03-F01
    severity: HIGH
    against: THE RULING, AND IT BLOCKS 16B
    statement: >-
      THE PER-INDICATOR STALENESS WINDOW CANNOT EXPRESS WHAT PO-DECISIONS-0025 REQUIRES.
      STALENESS_WINDOW_CEILING_SECONDS is 900.0 seconds — fifteen minutes — and it is DERIVED
      from PID.md §5's ratified assurance latency budget with its clause cited, so it was not
      chosen and is not this code's to move. Ruling 6 requires private credit stress to carry a
      WIDE window "because its latency IS the point", and ruling 4 registers SLOOS's NDFI leg as
      manual-QUARTERLY. MEASURED against the real constructor, not read off the constant:
      quarterly (7862400s), monthly, DAILY and even HOURLY windows are ALL REFUSED; only 900s
      and below are admitted. So nothing slower than intraday can be registered. OFFERED AS
      ANALYSIS AND NOT AS A RULING (PBG-AUTH-005): the ceiling's own derivation reasons about
      FEED LIVENESS — how long a dead feed may look fresh — while a per-indicator window under
      PO-PRODUCT-0001 R2 reasons about DATA CADENCE — how old an observation of a quarterly
      series may legitimately be. A three-month-old SLOOS reading is not a dead feed; it is a
      healthy feed of a quarterly series. THOSE ARE TWO DIFFERENT QUANTITIES SHARING A UNIT, AND
      ONE CONSTANT SERVES BOTH. The bound was NOT widened. Raised for the Product Owner.
  - id: CD-ENG-WO3-03-F02
    severity: MEDIUM
    against: THE PROJECT'S OWN CONTROL SURFACE
    statement: >-
      AN ENGINEER SEAT CANNOT ADD A MODULE UNDER src/. The mapping carrier was FIRST written as
      a companion module crash_detector/indicator_mapping.py — which the dispatch explicitly
      permitted. MEASURED: baseline CD-CLASS-2-SWEEP PASS 548 sites over 19 modules; with the
      companion module FAIL 610 sites 1 violation, UNDECLARED MODULE. A module is declared only
      by a DECLARED_MODULE_DISPOSITIONS entry or a complete per-site declaration, and BOTH live
      in tools/sweep/declared_dispositions.py — the Project Lead's register, HELD by
      PO-DECISIONS-0018 ruling 3, outside every Engineer seat's scope. The register was NOT
      edited and the sweep was NOT weakened; the code moved into source_registry.py, which
      already carries an ESTABLISHED module disposition, and the sweep returned to PASS with the
      module count and the tier-1 count IDENTICAL to baseline. The dispatch offered this choice
      as a free one and it is not: one branch of it is unbuildable inside an Engineer's scope.
  - id: CD-ENG-WO3-03-F03
    severity: MEDIUM
    against: THIS SEAT'S OWN WORK
    statement: >-
      I WROTE OUTSIDE MY WRITABLE SCOPE AND CORRECTED IT. D3's audit was created at
      tools/audit/check_deploy_portability.py and COMMITTED at cd0fc24. tools/ is not in the
      dispatch's writable scope, and the Engineer contract is explicit that an unstated boundary
      reads as NOT writable rather than as writable. It was moved to deploy/check_portability.py,
      which is in scope and is where a DEPLOY audit belongs. The net diff for tools/ between
      116c01f and this tip is EMPTY, so the scope proof at the tip is clean — WHICH IS EXACTLY
      WHY IT IS RECORDED HERE, because a clean tip diff would otherwise have concealed it.
  - id: CD-ENG-WO3-03-F04
    severity: LOW
    against: THIS SEAT'S OWN FIRST DRAFT
    statement: >-
      TWO OF MY OWN TESTS WOULD HAVE PASSED FOR THE WRONG REASON, AND THE INSTRUMENTS CAUGHT
      THEM. (a) test_the_enum_cannot_be_SUBCLASSED used type("Evil", (enum,), {}), which dies
      with an incidental AttributeError from EnumMeta.__prepare__ — proving that a malformed call
      fails, not that the enum is closed. Switched to a class statement, which raises TypeError
      and is the route an attacker takes. (b) The synthetic-identifier check scanned the raw text
      of the shipped data file and failed on the file's own header, which DOCUMENTS the
      PLANT_SYNTH_ convention. It now scans the parsed DATA and excludes $comment, with the
      reason recorded, because a test that cannot tell a dependency from the documentation of its
      absence punishes the disclosure this project wants. My first draft of the Redis test had
      the identical defect and is fixed the same way.
  - id: CD-ENG-WO3-03-F05
    severity: LOW
    against: THE DISPATCH
    statement: >-
      TWO FACTUAL DRIFTS IN THE DISPATCH, NEITHER MATERIAL, BOTH RECORDED BECAUSE THE DISPATCH
      ASKED. (a) §1 states main is at 8611685; main is at 9963aa38 and has been since two
      Project Lead commits landed after the dispatch was written. 8611685 EXISTS, is an ancestor
      of main, and `git diff 8611685 main -- PID.md` is EMPTY, so the carriage target was
      identical either way and D1 is unaffected — I carried from 8611685 and verified against
      main. (b) §6 D4.1 says SourceRecord carries stands_for and it does; §6 also says the
      mapping's staleness window should "reuse staleness.py's existing StalenessWindow" while
      §6 D4.3 anticipates that its bound may be too narrow. Both are right, and together they
      are the instruction that produced F01 — the dispatch anticipated the collision correctly
      and I am recording that it was anticipated rather than discovered.

