findings:
- id: CD-ENG-WO2R3-03-F06
  severity: MEDIUM
  against: 'THIS SEAT''S OWN FIRST IMPLEMENTATION OF THE NETS REGISTER. It failed the rename test.'
  what_was_measured: >
    The register's first version identified a net by its own qualname
    (`_absence_is_never_a_number.guarded`). **MEASURED: `guarded` -> `_guarded` took the check from
    PASS to FAIL with NET_DECLARED_BUT_ABSENT.** The doors MEMBERSHIP survived the rename — subjects
    27 in both arms, no door violation either arm — but the REGISTER did not.
  why_it_matters_more_than_it_looks: >
    **THAT IS PO-DECISIONS-0012 RULING 2's OWN DEFECT, REINTRODUCED ONE FILE AWAY, INSIDE THE FIX
    FOR IT.** The ruling corrected a clause for deciding by an identifier no caller can name; the
    first register keyed on exactly such an identifier. It was caught only because the dispatch made
    the rename test a REQUIRED contrast on this seat's own criterion — **had the contrast been
    optional, this would have shipped.**
  the_repair: >
    Identity is now the ENCLOSING function, which is a MODULE-LEVEL name — one a reader can look up
    and a caller can reference — and the net's own leaf name is REPORTED and load-bearing for
    nothing. **RE-MEASURED: both spellings now exit 0 with 60 assertions and 27 subjects.**
  the_cost_declared_rather_than_hidden: >
    Renaming the ENCLOSING function still fails the check. That is a real name dependence and it is
    kept deliberately, because failing LOUDLY beats describing the wrong thing silently; the
    NET_DECLARED_BUT_ABSENT text now names ALL THREE possible causes (deleted, enclosing renamed,
    became reachable) rather than the two it originally guessed at. And two locals in one enclosing
    function is AMBIGUOUS_NET — a refusal, not a first-match.
  disposition: 'REPAIRED IN THIS COMMIT. Recorded because the repair is not the interesting part; the fact that the required contrast caught it is.'

- id: CD-ENG-WO2R3-03-F07
  severity: LOW
  against: 'THIS SEAT''S OWN DECLARED LIMIT, WRITTEN BEFORE IT WAS MEASURED.'
  what_happened: >
    DECLARED LIMIT 9's first draft said the container-literal escape — `return {"decide": local}` —
    was **"A REAL GAP, IN THE UNSAFE DIRECTION."** **THEN I MEASURED IT AND THE ASSERTION WAS
    WRONG.** Planted into `engine/evaluate.py` at a throwaway tree, the check **EXITS 1** with
