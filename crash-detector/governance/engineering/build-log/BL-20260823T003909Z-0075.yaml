  severity: LOW
  against: 'THE CONTRAST HARNESS ITSELF — a near-miss recorded because it nearly produced a false table.'
  what_happened: >
    P-H's first version built its NEW-clause trees with bare `git ls-files`, **WHICH LISTS ONLY
