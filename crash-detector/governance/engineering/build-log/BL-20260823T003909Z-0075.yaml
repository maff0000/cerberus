part_a_membership_by_reachability:
  the_criterion_and_it_is_stated_in_all_three_CD_RULE_004_PLACES: >
    **A CALLABLE IS A SUBJECT WHEN A CALLER OUTSIDE ITS MODULE CAN OBTAIN AND CALL IT.** For a
    MODULE-LEVEL `def` the identifier at the `def` site IS the binding a caller names, so the
    underscore test is asked about the right name and BEHAVES EXACTLY AS BEFORE. For a
    FUNCTION-LOCAL `def` it was asked about a LOCAL VARIABLE NO CALLER CAN EVER NAME; the check now
    follows the object's ESCAPE ROUTE out of its enclosing function — RETURNED, STORED_UNDER a
    container or attribute, or PASSED_TO a callee — and asks whether the binding it REACHES is
    public. **DENY BY DEFAULT: any route the clause cannot resolve counts as reachable.**
  the_three_places:
  - 'tools/register/check_judgement_path_doors.py — the EXEMPTIONS list, `_reachable_public_binding`''s
     own docstring, and DECLARED LIMIT 9.'
  - 'required-tests.yaml — the doors row, CHECK LIMIT 8.'
  - 'contracts/execution/CD-RT-002-DOORS-REQUIRE-THEIR-TYPES.md — CHECK LIMIT 8, and the correction
     to the "rename test" section (below).'
  why_this_is_not_a_subtler_name_heuristic_WHICH_IS_THE_NAMED_PROHIBITION: >
    **THE TEST OF A NAME HEURISTIC IS THE RENAME TEST, AND THE TWO SPELLINGS PULL APART.** Renaming
    the LOCAL changes nothing, because no caller could name it under either spelling. Renaming the
    DESTINATION (`_evaluate_dial` -> `evaluate_dial`) DOES change the verdict, and correctly — that
    name is one a caller writes, and making it public IS making the object reachable. **A CRITERION
    THAT IGNORED THE SECOND RENAME WOULD BE UNSOUND IN THE OTHER DIRECTION.** What changed is
    WHICH NAME the question is asked about: from one no caller can use, to one every caller can.
  the_code_path_that_changed_NOT_the_header:
  - '`_callables` now yields a FOURTH value — the chain of ENCLOSING FUNCTIONS. It is yielded rather
     than recomputed so the walk and the membership clause cannot disagree about what encloses what.'
  - '`_module_bindings(tree)` is new: per module, `decorates` (name -> module-level defs it
     decorates), `assigned_from` (callee -> module-level names assigned from `callee(...)`), and
     the module-level name set. **`decorates` IS THE LOAD-BEARING ONE** — a decorator''s return
     value is bound to THE NAME OF THE THING IT DECORATES, so what a caller can reach is not
     `guarded` but `_evaluate_dial`.'
  - '`_escape_routes` and `_reachable_public_binding` are new and RECURSE one frame out per RETURN.'
  - '`_where` now qualifies a violation by its enclosing functions. **THAT WAS A REAL REPORTING
     DEFECT FOUND BY THIS INCREMENT''S OWN CARRIER**: the traversal has walked at any depth since
     increment 6, but a function-local door was still reported as the bare leaf name, so a reader
     was told "`_decide` is a public entry point" with no way to find which function it lives in.
     **A VIOLATION A READER CANNOT LOCATE IS A VIOLATION HALF-DELIVERED.**'

