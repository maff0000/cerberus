- '**IT DOES NOT ABOLISH THE UNDERSCORE CONVENTION FOR MODULE-LEVEL NAMES, AND THAT IS DELIBERATE.**
   `from crash_detector.engine.evaluate import _evaluate_dial` succeeds — MEASURED at P-F arm A2 —
   so NO module-level name is truly unreachable in Python. Treating every private helper as a door
   is a PRODUCT-MEANING decision (PBG-AUTH-005) and §D.1''s class is PUBLIC entry points. **DECLARED,
   NOT SILENTLY ASSUMED.**'
- '**IT DOES NOT ANALYSE `PASSED_TO`.** The clause denies by default there, so the outcome is safe,
   but it reports some callables reachable that are not. An error in the safe direction is still an
   error and it is not called a closure here.'
- '**IT DOES NOT SEE `setattr`/`globals()` ESCAPES.** Computed at runtime, invisible to any AST.'
- '**THE NETS POPULATION IS ONE MEMBER.** A population of one is a population that has not been
   stress-tested by variety. The six carriers break it in six ways, but every one of them breaks the
   SAME net. **THAT IS A REAL WEAKNESS OF THIS EVIDENCE AND IT IS STATED RATHER THAN LEFT TO BE FOUND.**'
- '**THE CLASS-2 SWEEP IS UNMOVED**: EXIT 1, 534 sites, 15 violations, measured by me after this
