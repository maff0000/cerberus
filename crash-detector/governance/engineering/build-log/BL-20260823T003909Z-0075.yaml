  and_the_general_point_against_myself: >
    **I WROTE A DECLARED LIMIT FROM INTENT AND IT WAS WRONG IN THE PESSIMISTIC DIRECTION.** This
    project's most-found defect is the residue understated; this is the same defect with the sign
    flipped, and it is no better, because a limit nobody can trust in either direction is not a
    limit. Every clause of DECLARED LIMIT 9 that could be measured now has been.
  disposition: 'CORRECTED IN THIS COMMIT in all three CD-RULE-004 places.'

