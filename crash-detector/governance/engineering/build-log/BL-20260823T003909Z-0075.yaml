  the_second_thing_the_measurement_found: >
    **THE VERDICT WAS RIGHT AND THE CLAUSE'S REASON WAS WRONG.** The exemption text read "it NEVER
    LEAVES that frame", which is a stronger claim than the evidence: the clause observed no escape
    route it could READ, which is not the same as there being none. Reworded to state the
    OBSERVATION and to name its own blindness inline.
  what_is_still_open_and_is_now_declared_at_its_MEASURED_reach: >
    **OFF a judgement path, such a callable is a printed row and NOTHING FAILS.** NOT PROVED TO BE
