FINDINGS:
  CD_ENG_WO2R3_07_F11__MEDIUM__F104_IS_WIDER_THAN_IT_WAS_WRITTEN__ARM_3: >
    **THE DECORATOR ADMITS A PLAIN SUBCLASS OF A REAL DATACLASS, AND `establishment.py`'s OWN
    DECLARED LIMIT 4 SAYS A SUBCLASS IS NOT GOVERNED.** `dataclasses.is_dataclass` answers True on
    an INHERITED `__dataclass_fields__`, so `@establishes(a=int)` applied to `class Sub(Real): pass`
    is ACCEPTED, enters `governed_types()` with `faults=()`, and rewrites `Sub.__init__` — governing
    a class the module's own limit says is not governed. **A GUARD AND ITS DECLARED LIMIT
    CONTRADICTING EACH OTHER IS WORSE THAN EITHER BEING WRONG ALONE**, because a reader who checks
    one is reassured by the other. Not in the finding as written; found by asking the gate a
    question the finding did not.
  CD_ENG_WO2R3_07_F12__MEDIUM__ARM_4_IS_REFUSED_FROM_THE_WRONG_LAYER_AFTER_A_WRITE: >
    An INSTANCE of a MUTABLE dataclass reaches `cls.__init__ = __init__`, **which binds an INSTANCE
    ATTRIBUTE onto the live object**, and only then fails at `_DECLARATIONS[cls]` with
    `TypeError: unhashable type`. **THE OBJECT HAS ALREADY BEEN WRITTEN TO WHEN THE REFUSAL
    ARRIVES.** A frozen instance fails earlier and for a different reason again
    (`FrozenInstanceError: cannot assign to field '__init__'`). **TWO ARMS REFUSED FOR TWO WRONG
    REASONS IS THE `CD-ENG-WO2R3-F12` STANDARD FAILING** — it looks like a guard in a summary table
    and is an accident of the subject's own mutability. V49 refuses it at the gate, before any write.
  CD_ENG_WO2R3_07_F13__LOW__A_FINDING_AGAINST_MY_OWN_CLOSURE__IT_REFUSED_A_LEGITIMATE_TYPE: >
    The first draft of V49 read its `_field_type` sentinels off its own probe's fields and got
    **only `_FIELD`**, because `establishment.py` carries `from __future__ import annotations` and
    the probe's `InitVar` annotation arrived as a string the machinery did not recognise as one. A
    legitimate governed type carrying an `InitVar` was then refused BY THE GATE with a paragraph
    about forged Fields, instead of by `_faults()` with the sentence written for it. **A GATE THAT
    REFUSES THE RIGHT TYPE FOR THE WRONG REASON IS A DEFECT AND NOT A STRICTER GUARD.**
    `tests/test_field_establishment.py::test_an_initvar_faults_the_type_rather_than_being_silently_ignored`
    caught it. Fixed by collecting the sentinels out of `vars(dataclasses)` BY TYPE IDENTITY, which
    finds all three. Recorded rather than quietly fixed.
  CD_ENG_WO2R3_07_F14__LOW__AND_MY_OWN_CLOSURE_BROKE_MY_OWN_ITEM_1_CHECK: >
    V49's probe dataclass is a REAL class in a REAL module, so
    `check_sealed_against_forged_establishment.py` enumerated it with the other 99 and reported it
    **OPEN AND REQUIRED**. **AN INSTRUMENT'S OWN SCAFFOLDING IS NOT OUTSIDE THE CLASS IT MEASURES**,
    and the increment's own instrument said so within minutes of the scaffolding landing. It carries
    `__slots__` in the committed patch. **THIS IS THE FIRST TIME ON THIS RECORD THAT ONE ITEM OF AN
    INCREMENT CAUGHT ANOTHER ITEM OF THE SAME INCREMENT WITHOUT A SEPARATE RE-MEASUREMENT BEING
    COMMISSIONED FOR IT** (compare increment 8's ITEM_6, which needed one).
  CD_ENG_WO2R3_07_F15__LOW__THE_RESIDUE_V49_DOES_NOT_CLOSE_AND_NOBODY_SHOULD_READ_IT_AS_CLOSING: >
    **ARM 6 IS ADMITTED IN BOTH TREES.** A caller who builds genuine `dataclasses` machinery — which
    they can, exactly as V49's own probe does — mints a governed type with an empty field list. That
    is not a forgery of the mechanism, it is the mechanism being used, and no in-process gate can
    tell the two apart. **WHAT V49 CHANGES IS THE PRICE: from ONE CLASS ATTRIBUTE to CONSTRUCTING
    THE MACHINERY.** Stated in all three CD-RULE-004 places. **NOT PROVED TO BE CARRIED ANYWHERE.**

