THE_INHERITED_DIVERGENCE_RESOLVED:
  what_was_handed_over: '`CD-ENG-WO2R3-04` measured the forged-entry population at **7 -> 8**; the Project Lead measured **23 -> 24**.'
  the_resolution: >
    **NEITHER SEAT WAS WRONG AND NEITHER NUMBER IS A PROPERTY OF THE ARTEFACT.** `governed_types()`
    returns `tuple(_DECLARATIONS)`, and `_DECLARATIONS` is populated by DECORATION, which happens at
    IMPORT. Its size is therefore a function of WHICH MODULES THE PROCESS HAS IMPORTED, and this
    seat measured that function's range at **0 to 31** in four steps with the command above. The
    DELTA is exactly **+1** in every case, which is why the FACT is invariant while the numbers
    are not. Recorded as a DIFFERENCE and resolved by measurement, never smoothed (CD-RULE-009).
  WHAT_IT_MEANS_FOR_ANY_CARRIER_THAT_READS_IT: >
    **A CARRIER MUST DERIVE THE IMPORT ITSELF OR IT IS READING A PARTIAL POPULATION THAT LOOKS
    COMPLETE.** `tests/test_field_establishment.py::_import_the_whole_product` already does exactly
    that — it walks the package with `pkgutil` and says why — so THE EXISTING CARRIER IS SOUND and
    this is not a new hole in it. **AND ITEM 1'S SEALING INSTRUMENT DOES NOT READ `governed_types()`
    AT ALL**: it enumerates every `*.py` under `src/crash_detector` in SORTED order and imports each
    itself, so its population is import-order independent BY CONSTRUCTION and is asserted against a
    second, independent live derivation at every run. **THAT WAS DESIGNED IN, NOT DISCOVERED AFTER.**

