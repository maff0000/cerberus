WHAT_THE_CLOSURE_IS__AND_WHY_IT_IS_NOT_IN_src:
  the_gate: >
    `variants/WO-2R3/V49-cd-pl-f104-establishes-admits-a-non-dataclass.patch` replaces
    `if not dataclasses.is_dataclass(cls)` with `_not_built_by_the_dataclass_machinery(cls)`, whose
    clauses are: **it is a CLASS and not an instance** · **`__dataclass_fields__` is in its OWN
    `vars()`**, not inherited · **`__dataclass_params__` is EXACTLY the type the machinery writes**
    · the field map is exactly a `dict` · every value is EXACTLY a `Field` · every `_field_type` is
    one of the machinery's sentinels **BY IDENTITY**.
  and_not_one_private_stdlib_name_is_SPELLED: >
    **THE REFERENCE VALUES ARE DERIVED, NOT TRANSCRIBED.** A probe dataclass is built at import and
    its own products are read for the params type and the `Field` type; the three `_field_type`
    sentinels are collected out of `vars(dataclasses)` **BY TYPE IDENTITY**
    (`type(value) is _KIND_TYPE`). **A SPELLED PRIVATE NAME IS A VOCABULARY AND A VOCABULARY ROTS AT
    THE NEXT RELEASE** — the same method the sealing instrument's exclusion clause uses.
  WHY_IT_IS_NOT_APPLIED__MEASURED_NOT_ASSERTED: |
      WITH V49 APPLIED:
        CD-CLASS-2-SWEEP: FAIL — 564 sites, 8 violations
          UNDECLARED ADMISSION  crash_detector.establishment::_not_built_by_the_dataclass_machinery
                                ISINSTANCE: isinstance(cls, type)
          UNDECLARED ADMISSION  crash_detector.establishment::_not_built_by_the_dataclass_machinery
                                DUCK: getattr(field, '_field_type', None)
          STALE DECLARATION     crash_detector.establishment::establishes.apply_at_the_boundary
                                TRUTHINESS: not dataclasses.is_dataclass(cls)
          UNDECLARED MODULE     crash_detector.establishment — tier-2 keys still undeclared: 9 of 25
        pytest: 6 failed, 1693 passed
      WITHOUT IT (the tree as committed):
        CD-CLASS-2-SWEEP: FAIL — 555 sites, 4 violations      <- the DECLARED base state
        pytest: 3 failed, 1696 passed                          <- the DECLARED three
    **`crash_detector.establishment` IS DISPOSITIONED PER SITE (`MODULES DERIVED: 1`), SO ANY ADDED
    DECIDING OPERATION PUTS IT UNDECLARED.** There is no formulation of a real closure that does
    not. The rows can only be written in `tools/sweep/declared_dispositions.py`, which
    `PO-DECISIONS-0017` ruling 2 PROTECTS until after the seventh Assurance seat.
  THE_ACT_THIS_SEAT_REFUSED: >
    **KEEPING `not dataclasses.is_dataclass(cls)` ALIVE AS A FIRST CLAUSE WOULD HAVE KEPT THE STALE
    KEY AND KEPT THE SUITE AT 3 FAILURES.** It is even defensible on message grounds — two causes,
    two diagnoses. **AND THE DECIDING REASON WOULD HAVE BEEN THE REGISTER KEY, WHICH IS EXACTLY
    "ADDING A REDUNDANT CLAUSE SO A REGISTER KEY SURVIVES" — THE ACT `CD-ENG-WO2R3-06` CONSIDERED
    AND REFUSED.** Constructing state so a control appears to pass is non-waivable. Refused, and
    written down here so the refusal is auditable rather than invisible.
  what_landed_instead: >
    **CD-RULE-004 OPTION 2, WHICH THE DISPATCH ITSELF AUTHORISES IN ITEM 2's `what_you_must_do`:**
    the measured reach is DECLARED as MECHANISM LIMIT 5, consistently and in the same words, in all
