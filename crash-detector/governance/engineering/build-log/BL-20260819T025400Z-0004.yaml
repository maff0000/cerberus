decisions_closed:
- id: CD-D-007
  summary: >
    Disposition of the interrupted Engineer seat's uncommitted output: QUARANTINE AND RE-DISPATCH.
    The tree src/ is moved intact and read-only to /srv/crash-detector-wo2-salvage/, which is
    outside every git worktree, with its SHA256 manifest and a README stating its provenance and its
    status. The mutation lane is returned to CLEAN at 0047093, which is a verifiable state rather
    than an assertion. Engineer CD-ENG-WO2-01 is re-dispatched as instance 2 under the SAME dispatch
    record and the same bounded scope, and is told the salvage exists, where it is, and exactly what
    it may do with it: read it as an unverified prior draft, adopt only lines it has itself verified
    against BLUEPRINT.md and the dispatch, and own every line it commits.
  reasoning: >
    The work is IN SCOPE but UNATTESTED, and those are different failures. It was produced by the
    right seat, in the right lane, inside writable_scope, under an issued dispatch — so it is not
    tainted and destroying it would burn real effort for no governance gain. What it lacks is
    everything that makes work project state: a return, a commit, a Build Log entry, and any test
    evidence at all (PBG-CONT-007). Leaving it in the lane would have let a fresh seat commit
    2000 lines it never read, under its own attestation — the exact shape of a false attestation,
    and the reason the middle path is quarantine rather than either extreme. Moving it out makes
    "the Engineer owns what it commits" checkable instead of hoped for.
  authority: >
    CD-AUTH-0001 — the Project Lead's own lane-reconciliation decision, Level 1. It resolves no
    product meaning and needs no Product Owner ruling; it is recorded because it disposes of work
    product.
  owner: PROJECT_LEAD

