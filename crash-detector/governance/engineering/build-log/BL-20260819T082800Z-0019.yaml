action_summary: >
  Assurance seat CD-ASR-WO2-01 — a SEPARATE agent that implemented no part of the target
  (PBG-SOD-001, non-waivable) — was dispatched in the FOREGROUND against
  /srv/crash-detector-wo2-audit at 66681b2, per CD-DISPATCH-WO2-ASSURANCE exactly as issued.

  IT RETURNED AMBER. Per criterion: CD-AC-003 PASS (HIGH confidence); CD-AC-001, CD-AC-002,
  CD-AC-005 and CD-AC-012 all AMBER. The overall verdict is the worst of them.

  THE WO-2 GATE IS NOT MET. The gate is Assurance PASS on all five planted violations. Four are
  AMBER. This is recorded as the plain outcome, not as a near-miss, and WO-2 does not close.

  The contrast the register demands WAS met — the auditor ran all eleven declared tests itself in
  both arms with the declared command strings verbatim, and 11 of 11 show clean 0 / violated
  non-zero. What produced the AMBER is the other half of its dispatch: it wrote 24 VARIANT PLANTS OF
  ITS OWN attacking the same propositions by different routes, and TEN OF THEM ESCAPED. The guards
  catch the instance. For four of the five criteria they do not reliably catch the class.

  That is the finding the whole arrangement exists to produce, and it could only have been produced
  by a seat that did not build the thing.

