findings_raised:
- id: CD-FWK-005
  severity: MEDIUM
  raised_by: PROJECT_LEAD_SEAT_01
  title: 'The register computes PASS from declared negative controls alone; an auditor''s adversarial
    verdict has no channel to lower it'
  detail: >
    REQUIRED-TEST-REGISTER-CONTRACT-v1 derives a criterion's status from the run record's arms: a
    demonstrated contrast on the DECLARED negative control yields PASS. That is a sound and valuable
    mechanism, and it is the reason the gate cannot be talked open.

    But the declared negative control is written by the IMPLEMENTER. The whole point of W3 in the
    Assurance dispatch — variant plants devised by the auditor — is that a guard can catch its own
    declared plant and miss the class around it. On this candidate that is not hypothetical: eleven
    declared contrasts all pass, ten auditor variants escape, and the framework has nowhere to put
    the second fact. Admitting the record makes it compute PASS on CD-AC-001 while a two-line change
    the auditor and the Project Lead have both executed makes absence render as 0.0.

    So a mechanically derived PASS here means precisely "the DECLARED negative control was
    demonstrated". It does not mean "the proposition holds". Those read identically in the verify
    output, and the narrower one is the one the tool prints.
  disposition: >
    Raised to the Product Owner for the PBGv2 backlog, alongside CD-FWK-004. This project handles it
    for now by NOT admitting (CD-D-023) and by putting the auditor's verdict in front of the PO as
    the governing judgement. A candidate fix — for the framework, not for this project to invent —
    would be for a run record to carry the auditor's per-criterion verdict and for the reader to take
    the WORSE of computed and declared. That is a PBGv2 design question, not a crash-detector one.
- id: CD-PL-F46
  severity: LOW
  raised_by: PROJECT_LEAD_SEAT_01
  title: 'The Project Lead''s own tamper-detection fingerprint was order-sensitive and raised a false alarm'
  detail: >
    At issue the Project Lead recorded a fingerprint of the audit target as
    `find ... -print0 | xargs -0 sha256sum | sha256sum` = 8c23799... On the auditor's return the same
    command produced 90c6d6d9..., which read as tampering. It was not. `find` emits files in
    directory-entry order, which is reshuffled when files are created and deleted — as they were when
    the auditor's __pycache__ was written and removed. The file CONTENTS and the file SET were both
    unchanged. Sorting before hashing gives a stable 554ddf11..., and the authoritative check
    (`git diff --stat 66681b2` empty, on-disk list identical to `git ls-files`) confirms the tree is
    byte-identical to the dispatched commit.
  why_it_is_recorded: >
    A tamper control that cries wolf is one somebody eventually switches off — the identical
    reasoning this project applied to CD-PL-F35(c), where a guard failing on innocent code was ruled
    the more dangerous half. The Project Lead wrote a control with that defect in it and should say
    so in the same record where it criticises seats for less. The lesson generalises: for a Git
    worktree, `git diff` against the commit IS the fingerprint, and inventing a second one was
    unnecessary machinery that introduced its own failure mode.
  disposition: >
    Standing correction, effective now: target integrity at a Git SHA is checked with
    `git status --short`, `git diff --stat <sha>` and a comparison of the on-disk file list against
    `git ls-files`. If a hash fingerprint is wanted alongside, it must be sorted before hashing.
- id: CD-ASR-F01 .. CD-ASR-F07
  severity: 'two HIGH, four MEDIUM, one LOW'
  raised_by: CD-ASR-WO2-01
  title: 'The auditor''s seven findings, recorded here by reference and in full at
    governance/assurance/WO-2/BL-ASR-WO2-01.yaml'
  detail: >
    F01 HIGH, CD-AC-002 — two WORKING blends of the two dials pass ALL THREE declared layers
    simultaneously, both executed and both returning 0.5. One needs no allowlisted path at all:
    `getattr(dials, slot).value.score` erases the static flavour entirely. This REFUTES the register's
    specific claim that a blend slipping past one layer must fail the other two. The closed schema
    still refuses to PUBLISH a combined field, which is the part of the defence that held.
    F02 HIGH, CD-AC-001 — replicated by the Project Lead above.
    F03 MEDIUM — a numeric default spelled as a module-level constant escapes the AST guard (caught
    by the second test).
    F04 MEDIUM, CD-AC-012 — a broker reachable by IP LITERAL is not caught by the egress check, and
    unlike the source scan this gap is UNDECLARED. This one has a schedule consequence: it must be
    settled before the WO-3 egress enforcement lane is built, or that lane inherits the gap.
    F05 MEDIUM, CD-AC-003 — the engine CONTAINER's own entrypoint sits outside the code-graph guard's
    root.
    F06 MEDIUM, CD-AC-005 — a finite but unbounded staleness window lets a decade-old row render
    WITNESS AGREES.
    F07 LOW, CD-AC-005 — an exception handler resolving to agreement is undetected, though
    unreachable as planted.
  disposition: >
    NONE OF THEM IS REPAIRED, and none may be repaired by the auditor (PBG-SOD-004 — finding a defect
    does not make you the one who fixes it). They are owed at Product Owner disposition. The Project
    Lead does not rank them beyond what the auditor said: F01 and F02 go in front of the PO first.

decisions_closed:
- id: CD-D-023
  title: 'RTR-WO2-0001 is NOT admitted, and the lane is NOT merged'
  ruling: >
    NOT ADMITTED. NOT MERGED. Both actions were named in the previously recorded next_safe_action and
    both are refused here on the evidence measured above.

    Admitting the run record makes `pbg required-tests verify` compute PASS on CD-AC-001, CD-AC-002,
    CD-AC-003, CD-AC-005 and CD-AC-012 — the five criteria that ARE the WO-2 gate — on the same
    candidate where an independent auditor returned PASS on exactly one of them. It would be
    literally true, in that the declared negative controls were demonstrated, and profoundly
    misleading, in that the register would then read as though WO-2 had passed. Anyone consulting the
    register later would find five PASSes and no trace of the AMBER.

    That is constructing state so a control appears to pass when the authentic target was not
    verified as the proposition requires. It is non-waivable in this project's own governance and it
    is refused. The right response to a mechanism that would compute the wrong answer is to decline
    to feed it and to say why in the record — not to feed it and footnote the result.

    The lane is not merged for the same reason and one more: merging wo-2-skeleton into main is the
    act by which WO-2 becomes the project's state. The gate is not met. That is the Product Owner's
    decision to make, not this seat's, and it stays available to them exactly as it is.

    WHAT IS DONE INSTEAD. Both Assurance artefacts are committed to the durable record unaltered at
    governance/assurance/WO-2/, so the evidence exists and is checkable; the register keeps saying
    latest_admitted_run null and GATE SHUT, which remains the honest state; and WO-2 stops for
    Product Owner disposition. The run record is not discarded — it is preserved, and admitting it
    remains available to the PO as an explicit, informed decision rather than a mechanical
    consequence of this seat following its own stale instruction.
- id: CD-D-024
  title: 'The WO-2 gate is NOT MET. WO-2 does not close, and WO-3 is not dispatched.'
  ruling: >
    THE GATE IS NOT MET. The WO-2 gate is Assurance PASS on all five planted violations. The verdict
    is PASS on one and AMBER on four.

    WHAT WAS NEVERTHELESS ACHIEVED, stated because a NOT MET is not a failure of the work order and
    the distinction matters to whoever reads this next. The Engineer dispatch is complete: A1-A7 and
    B1-B4 delivered across seven increments and three runtime terminations. Eleven declared negative
    controls all demonstrate the contrast, verified independently by the auditor with verbatim
    command strings. CD-AC-003 — the criterion with the load-bearing asymmetry, cd_engine holding no
    privilege of any kind on witness — PASSED at HIGH confidence against a live catalogue the auditor
    built itself, with SEVEN distinct grant routes attacked including role membership, PUBLIC,
    default privileges, ownership, SUPERUSER and function privilege, plus a live session in which
    PostgreSQL itself refused cd_engine. Risk CD-RT-002 — that arm having been run only by the
    implementing seat — is DISCHARGED.
    And the CD-RT-012 DECLARED LIMIT was tested by the auditor and found HONESTLY AND CONSERVATIVELY
    DRAWN: its escape landed squarely inside stated boundary 5, every probe from inside the
    boundaries was caught, and the auditor found the declaration UNDERSTATES its protection. That
    vindicates CD-D-014 and CD-D-015 — the guard that says what it is not was judged fairly, exactly
    as the mechanism was designed to allow. The auditor then drew the sharpest available conclusion
    from it: CD-AC-002's AST guard has comparable limits and NO comparable declaration, which is why
    F01 is HIGH.

    WHAT HAPPENS NEXT IS THE PRODUCT OWNER'S CALL, not this seat's. WO-3 is not dispatched. The
    Project Lead does not propose a remediation plan here, because choosing between repairing the
    guards, narrowing the claims, accepting the residual risk, or amending the criteria is a product
    judgement about how much structural proof CD-AC-001, 002, 005 and 012 are meant to carry — and
    PID §6 belongs to the Product Owner (PBG-AUTH-003, PBG-PID-003).
- id: CD-D-025
  title: 'The AMBER is reported as the result, not managed'
  ruling: >
    Recorded because the temptation was specific and the record should show it was seen. This seat
    commissioned the adversarial work in W3 that produced the AMBER; it could have read F01-F07 as
    hardening suggestions, admitted the run record on the strength of eleven clean contrasts, and
    reported WO-2 delivered with follow-ups. Every individual step of that would have been
    defensible and the aggregate would have been false.
    The auditor was dispatched to attack the guards precisely because a passing declared control is
    weak evidence, and having got the answer, the seat that asked the question does not get to
    reinterpret it. An honest AMBER is worth more than a confident PASS resting on an unexamined
    assumption (PBG-ASSURE-012); that principle costs nothing when the audit comes back green.

