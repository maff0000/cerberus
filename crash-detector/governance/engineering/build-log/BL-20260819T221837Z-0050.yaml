# --- the classes, and the invariants that close them ------------------------------------------ #
class_1_derivation:
  criterion: 'CD-AC-002 (RED). Finding CD-ASR-WO2R-F01 (HIGH).'
  disposition: CLOSED IN PART
  structural_invariant: >
    The only values from which crash_detector.dials.provenance will build a DeclaredQuantity BY
    DERIVATION are DeclaredQuantity values it has itself already established, and the number it
    stores is computed by that module from a CLOSED set of NAMED reductions — so there is no
    argument, anywhere on any derivation path, through which a caller's float or a caller's
    callable can reach a dial magnitude.
  how_an_auditor_refutes_it_by_execution: >
    Write any expression using only the public API of crash_detector that yields a DialMagnitude
    whose quantity is a number of your choosing, without calling observed_for_dial.
  what_changed: >
    derived_within_one_dial(*, quantities, reduction) — WAS (*, dials, value). It takes no number
    and no dial set. It refuses by EXACT TYPE anything that is not a DeclaredQuantity, COMPUTES the
    provenance union from the quantities themselves, and refuses by EXACT TYPE any reduction that
    is not a SameDialReduction member. SameDialReduction is an enum.Enum, closed against
    subclassing and member addition by the interpreter. SAME_DIAL_REDUCTIONS is a MappingProxyType
    over a dict literal never bound to a name. DeclaredQuantity.__init__ REFUSES ALWAYS — its two
    former parameters were exactly the two things a caller can simply write. combine_within_one_dial's
    `using` is a named reduction, not a callable, and it passes established quantities onward
    rather than released floats.
  what_is_NOT_closed: >
    THE EXTERNAL ADMISSION BASE CASE. observed_for_dial believes what it is told; something has to
    be the first number or the product cannot exist. See finding CD-ENG-WO2R2-F03.

class_1_absence:
  criterion: 'CD-AC-001 (AMBER, travelling with Class 1 by CD-D-073). Finding CD-ASR-WO2R-F03 (MEDIUM).'
  disposition: CLOSED IN PART
  structural_invariant: >
    There is no value of type Shown whose magnitude is not a DialMagnitude of exactly the dial it
    is shown as, and there is no field anywhere on NotShown that can hold a number — so a number
    obtained from an Unknown by any route, through any helper, computed any way, cannot be
    presented as a dial reading.
  how_an_auditor_refutes_it_by_execution: >
    Construct a Shown, by any means, whose magnitude is a number you chose; or find a field on
    NotShown that holds one.
  what_changed: >
    A new closed sum type in src/crash_detector/serving/dial_presentation.py —
    Shown(dial_id, magnitude) | NotShown(dial_id, reason, missing_inputs) — with no common
    ancestor, sealed against subclassing, slotted, surface asserted by set equality at import and
    re-verified at every consumer boundary. present_dial() performs the elimination ITSELF, so a
    surface never supplies `on_unknown`.
  what_was_deliberately_NOT_done: >
    NO GUARD WAS PUT IN `fold`, and this is the decision that matters. A ban on a numeric return
    from on_unknown is a ban on a SPELLING — `on_unknown=lambda u: Box(0.0)` walks past it — and it
    would forbid a legitimate numeric answer ABOUT an absence, such as a count of missing inputs.
    It would have caught the auditor's four lines and not the class. That is the instance game and
    this seat refused it. A declared test asserts the legitimate numeric use still works.
  what_is_NOT_closed: >
    A module may still compute its own number from an Unknown and hand it to its own caller.
    ASR2-001-A's surface_scalar still returns 0.0 at this SHA. NOT PROVED TO BE CARRIED ANYWHERE.

