    RECOMMENDATION AND NOT ADOPTED AS A DECISION, because adopting a scope for work that is
    SUSPENDED would be pre-empting the architectural review that the suspension exists to allow.
- id: CD-D-087
  title: 'THE LANE, THE AUDIT WORKTREE AND THE EVIDENCE ARE PRESERVED AND NOT MERGED.'
  ruling: >
    /srv/crash-detector-wo2 stays at f30e63c on wo-2-skeleton, UNMERGED. The detached audit worktree
