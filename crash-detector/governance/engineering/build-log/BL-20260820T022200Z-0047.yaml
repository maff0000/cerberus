# ================================================================================================ #
decisions:
- id: CD-D-084
  title: 'CD-D-076''S TRIGGER CONDITION IS MET. THE CD-AC-002 SCOPING HAS FALLEN.'
  ruling: >
    CD-D-076, recorded at BL-20260819T225000Z-0044 precisely so this moment would not depend on
    anyone's memory, states the condition in terms: IF THE THIRD ASSURANCE SEAT CAN EXERCISE AN
    INJECTED-MODEL ROUTE INSIDE A WO-2 CANDIDATE'S REAL POPULATION, THE RULING FALLS AND (C)
    SUSPENSION APPLIES. The seat did. THE PROJECT LEAD REPLICATED IT ON ITS OWN DRIVER, against a
    tree it proved byte-identical before and after, using delivered public API and no source edit.
    THE CONDITION IS MET ON MEASUREMENT AND NOT ON ARGUMENT.
  the_premise_that_failed_and_why_it_is_not_a_reproach_to_anyone: >
    The ruling's factual premise was that "a WO-2 candidate registers no model, no source, deploys
    nothing and has no publication layer". The failure is in ONE WORD OF IT: REGISTERS. The empty
    `CONTRIBUTION_MODELS` registry is real — and INJECTION NEVER CONSULTS IT.
    `DialSpec.contribution_model` is a plain field, so the emptiness of the registry says nothing
    whatever about the reachability of the route. The Product Owner reasoned honestly from a true
    fact that turned out not to be load-bearing, AND WROTE THE TEST THAT WOULD CATCH EXACTLY THAT.
    Ruling 4 in the PO's own words: "A PO scoping a criterion at the moment of failure is the
    acceptance-semantics trap; the only honest defence is handing the auditor the knife."
    THE KNIFE WAS HANDED OVER AND IT WORKED. That is the loop functioning, not failing.
  the_dilemma_the_auditor_measured_rather_than_argued: >
    Recorded because it is the part that makes a narrower re-scoping unattractive. Under the SHIPPED
    configuration both dials read `Unknown` and NO DIAL NUMBER EXISTS AT ALL. So: read the
    population as the shipped config and CD-AC-002 IS VACUOUS at WO-2 — "the two dials are never
    blended" satisfied by there being nothing to blend, and the gate certifies nothing; read it as
    what the delivered code admits, and the injected-model route is in population and is exercised.
    THERE IS NO THIRD BRANCH ON THE EVIDENCE PRESENTED, and the project's own conduct — two
    increments of type closures on the derivation door, three declared CD-AC-002 contrast tests,
    plants against them — presupposes the second reading.
- id: CD-D-085
  title: 'IMPLEMENTATION IS SUSPENDED. NO FURTHER ENGINEER WORK IS DISPATCHED.'
  ruling: >
    Option (C) applies ON THE PRODUCT OWNER'S OWN PRE-STATED TERMS, which is why this Project Lead
    can record it without disposing of anything: the consequence was fixed IN ADVANCE by the
    authority that owns the question, and the only thing this boundary supplies is the MEASUREMENT
    that the condition is satisfied. NO WO-2R3 DISPATCH IS DRAFTED, NO ENGINEER SEAT IS LAUNCHED,
    AND NO FINDING IS ROUTED FOR REPAIR.
  why_a_project_lead_may_state_this_and_is_not_thereby_deciding_it: >
    Because the alternative is worse in both directions. Dispatching an Engineer against these
    findings would be this seat deciding, on its own authority, that the ruling did NOT fall — the
    exact substitution of judgement CD-D-076 was written to prevent. And declaring the project
    closed would be disposition, which is the Product Owner's (PBG-AUTH-003). SUSPENSION IS THE ONLY
    STATE THAT DECIDES NOTHING.
  what_is_explicitly_NOT_ruled: >
    NOT ruled: whether the findings are repairable at WO-2; whether CD-AC-002 should be re-scoped
    more narrowly; whether the entry-point class is one class or four findings; what BLUEPRINT §7's
    architectural review should conclude; and whether f30e63c is discarded, retained or built upon.
    ALL OF THOSE ARE THE PRODUCT AUTHORITY'S, and several are the substance of the review itself.
- id: CD-D-086
  title: 'THE AUDITOR''S PROPOSED NEXT SCOPE IS RECORDED AS ITS RECOMMENDATION AND IS NOT ADOPTED.'
  ruling: >
    The auditor recommends that any future dispatch be scoped to THE ENTRY-POINT ADMISSION CLASS
    rather than to the three findings individually, on the ground that three is a denominator and
    not a proof that a fourth does not exist — and that the sweep CANNOT answer the question,
