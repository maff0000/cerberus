independent_replication:
  method: >
    `git archive f30e63c | tar -x` into /tmp. Drivers written by this seat from the product's
    source — DialSpec, ContributionModel, ConfigSnapshot, SourceRegistry, SourceRecord,
    ObservationRecord, OK, evaluate and number_for_dial_slot — NOT copied from the auditor's probe.
    `python3 -B` throughout. The src/ + tools/ tree was hashed BEFORE AND AFTER every run.

  PL_C1_ASR3_F02_THE_SUSPENSION_TRIGGER_CONFIRMED: >
    THE MOST IMPORTANT MEASUREMENT ON THIS BOUNDARY, so its conditions are stated in full. This
    seat built a WO-2 candidate from DELIVERED PUBLIC API ONLY. NO patch was applied. NO file under
    src/ was edited. NO project type was subclassed. NO private slot was touched, NO
    `object.__setattr__` was called and NO dunder was defined. The model performs NO I/O, reads NO
    clock and reads NO environment, so it does not breach the documented purity contract on
    ContributionModel — IT MERELY REMEMBERS, WHICH NOTHING FORBIDS.
    ONE ordinary ContributionModel instance, injected into BOTH DialSpecs. Two sources registered.
    Two OK observations. MEASURED:
      ONE model object in BOTH specs : True
      TRUE equity level  (input)     : 0.9
      TRUE monetary level(input)     : 0.1
      equity   -> DialMagnitude(dial_id='equity_crash',        quantity=0.9)
      monetary -> DialMagnitude(dial_id='monetary_debasement', quantity=0.5)
      number_for_dial_slot('equity_crash')        -> 0.9   [NOT REFUSED]
      number_for_dial_slot('monetary_debasement') -> 0.5   [NOT REFUSED]
      src+tools sha256 BEFORE = AFTER = 7299ed26a0d566e16c83f35671d43a6df0a20b9d657aa1bfe6e1b8e1a04eb880
    THE MONETARY DIAL PUBLISHES 0.5 AGAINST A TRUE INPUT OF 0.1, THROUGH `number_for_dial_slot` —
    the module's own words for itself are "THE ONE PLACE a dial magnitude becomes a number that may
    be published" — AND IT IS NOT REFUSED. Every field of the admission claim is TRUE except the
    number: the dial is right, the cited input genuinely arrived and genuinely was used.
    THAT IS THE EXACT PRODUCT FAILURE PID §3.1 CALLS CONSTITUTIONAL: averaging cancels the signal.
    ASR3-F02 IS CONFIRMED. HIGH.
    WHY THIS IS STRICTLY STRONGER THAN CD-ENG-WO2R2-F03 AND PL-Z4, which this project already had:
    BOTH OF THOSE WERE PATCHES. This is configuration and data against a tree proven unmodified.

  PL_C2_THE_ENTRY_POINT_FINDING_CONFIRMED: >
    The auditor's structural claim is that the VALUE TYPES genuinely re-establish their fields —
    which this seat has itself measured across two boundaries and does not doubt — BUT THAT THE
    ENTRY POINTS DO NOT REQUIRE THE VALUE TYPES. Measured on this seat's own driver:
      resolve_panel(a duck object that is not a PanelRow) -> Agrees -> 'WITNESS AGREES'
      resolve_panel(an object whose STORED state is 'UNAVAILABLE' but whose `state` PROPERTY
                    answers 'AGREES')                     -> Agrees -> 'WITNESS AGREES'
      CONTROL, THE SAME VALUES THROUGH THE VALUE TYPE:
      PanelRow(state='UNAVAILABLE')                       -> Unavailable -> 'WITNESS UNAVAILABLE'
    THE CONTROL IS THE PROOF. The value type refuses the identical value that the entry point
    admits. A caller-supplied PROPERTY executes and selects the panel constructor.
    AND IT REFUTES INCREMENT 3'S NARROWED INVARIANT IN TERMS. That narrowing — written at this
    Project Lead's own direction under CD-PL-F76 — says "WHAT STILL EXECUTES, AND IT IS EXACTLY ONE
    THING: `tzinfo.utcoffset`". IT IS NOT EXACTLY ONE THING. This is stated plainly because the
    Project Lead ordered that sentence and is therefore the last actor who should be soft about it.

  PL_C3_CD_AC_012_DEFEATED_BY_SPELLING_CONFIRMED: >
    The same broker SDK, the same file, two spellings, on this seat's own copies:
      `futu-api==9.3.5308`                                   -> EXIT 1, FAIL, 2 violations. CAUGHT.
      `-e git+https://github.com/futu/futu-api.git#egg=futu-api` -> EXIT 0, PASS, 134 ASSERTIONS.
    134 IS THE CLEAN-ARM ASSERTION COUNT. The escaping spelling does not merely pass — IT MOVES THE
    ASSERTION COUNT NOT AT ALL, so a reviewer watching for a shrinking denominator cannot see it
    either. Deny-by-default is not defeated by an unregistered name; IT IS DEFEATED BY A SPELLING
    THE PARSER DOES NOT RECOGNISE AS DECLARING A DISTRIBUTION, so the name never enters the set that
    gets judged. ASR3-F08 IS CONFIRMED.
    THE PROJECT LEAD NOTES AGAINST ITS OWN PRIOR BOUNDARY: at BL-...-0046 this seat measured that
    the refusal "SURVIVES A RENAME in the SAFE direction" on three unregistered names. THAT
    MEASUREMENT WAS TRUE AND THE INFERENCE AVAILABLE FROM IT WAS TOO WIDE. Renaming the DISTRIBUTION
    is safe; changing the SPELLING OF THE REQUIREMENT LINE is not, and this seat did not test that
    axis. CD-D-079 asks for a counterfactual on the structure credited; it does not ask whether the
    INPUT GRAMMAR has other forms, and here that was the gap.
  what_was_NOT_replicated_by_the_project_lead: >
    ASR3-F05 (CD-AC-001) and ASR3-F04's full extent were NOT independently replicated by this seat —
