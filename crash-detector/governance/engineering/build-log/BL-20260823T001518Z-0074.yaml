half_a_can_anything_in_process_reach_it_without_passing_an_established_door:
  the_answer: >
    **NO — NOT WITHIN THE SETTLED THREAT MODEL. RULING 1's PREMISE HOLDS. NO STOP.**
    Reachable trivially by arbitrary in-process code, which ruling 4 EXPLICITLY places outside the
    threat model, and NOT reachable by the declared-foreign actor. The two are separated below
    rather than averaged, because averaging them is how this question gets answered wrongly in
    either direction.
  arm_1_the_products_own_call_graph:
    measured: >
      `_evaluate_dial` has EXACTLY TWO call sites in `src/`: `engine/evaluate.py:192` and `:198`.
      **BOTH ARE INSIDE `evaluate`, WHICH CARRIES
      `@admits(observations=each_of(ObservationRecord), config_snapshot=ConfigSnapshot, now_utc=datetime)`.**
    counterfactual_arm_CD_D_079: >
      P-F arm A0 — `evaluate(observations=[], config_snapshot=<duck>, now_utc=<datetime>)` ->
      **REFUSED AT THE DOOR**, `crash_detector.admission.NotAdmitted: evaluate:
      config_snapshot=_DuckConfig is not admitted; this door requires exactly ConfigSnapshot`.
      The door establishes, and it establishes BEFORE its body runs.
    verdict: 'Within the product, the net is reached ONLY through an established door.'
  arm_2_THE_DECISIVE_ONE_a_conforming_hostile_adapter_through_collect:
    why_this_is_the_arm_that_decides: >
      An adapter is code this system DECLARES it will take from outside (CD-BP-003, BLUEPRINT §17).
      It is foreign code running in-process BY DESIGN, not by breach — so if the net is reachable
      from there, it is reachable inside the threat model. The fifth Assurance seat wrote of the
      `__wrapped__` route: *"I did not demonstrate a route to it from `collect`."* **THIS IS THAT
      DEMONSTRATION ATTEMPTED, AND IT FAILED TO CONSTRUCT THE REACH.**
    the_adapter: >
      Conforming — it supplies `source_id`, `adapter_id`, `response_schema` and `is_empty`, which is
      what `missing_adapter_members` requires, so it gets through the advertised door on its merits
      rather than being waved in. It imports nothing.
    measured_verbatim: |
      tree: /srv/crash-detector-wo2r3/src/crash_detector/collectors/runner.py
      crash_detector.engine.evaluate in sys.modules BEFORE collect(): False

      R1 sys.modules      crash_detector.engine.evaluate IS NOT IN sys.modules at the moment
                          collect() calls the adapter — the collection path has not imported it
      R2 frame walk       frames walked: 7; modules on the stack:
                          ['__main__', 'crash_detector.collectors.runner',
                           'crash_detector.collectors.runner', 'crash_detector.admission',
                           '__main__', '__main__']
                          _evaluate_dial reached: False
    what_this_establishes: >
      **THE COLLECTION PATH NEVER IMPORTS THE ENGINE.** The E2/E3 frame-walking mechanism — the one
      that DID reach `crash_detector.collectors.runner`'s globals and rebind `FetchedResponse` — is
      re-run here against this target and reaches `runner` and `admission` and NOT `engine.evaluate`.
      The adapter cannot reach what is not on its stack and not in the module table.
  arm_3_arbitrary_in_process_code_OUT_OF_THE_THREAT_MODEL_and_labelled_so:
    measured: >
      P-F A1 `getattr(module, "_evaluate_dial")` -> OBTAINED. P-F A2 `from
      crash_detector.engine.evaluate import _evaluate_dial` -> IMPORTED. P-F A4 via `sys.modules`
      once the module is loaded -> OBTAINED, identical object. P-G R3 `importlib.import_module` from
      inside the adapter -> OBTAINED.
    why_it_does_not_move_the_answer: >
      Ruling 4 says *"short of arbitrary code execution (outside the settled threat model)"*, and
      every one of these routes IS arbitrary code execution. **AND THE READING THAT IGNORES THAT
      QUALIFIER IS SELF-REFUTING**: it makes every module-level callable in the package a door,
      including `_latest_usable_ok` and `_oldest_as_of`, and empties the word of content.
    but_the_ruling_s_WORDING_is_still_wrong_and_this_is_a_finding: 'CD-ENG-WO2R3-03-F01 below.'

half_b_does_the_net_s_post_condition_bind_everything_its_open_arity_admits:
  the_answer: >
    **STRUCTURALLY NO — IT BINDS NONE OF `*extra`. BUT NO ROUTE THROUGH `*extra` CHANGES WHAT THE
    EVALUATOR RETURNS AT THIS TREE, AND THE THING THAT STOPS IT IS NOT THE POST-CONDITION.**
    The attack does not land today. **IT IS HELD SHUT BY A PRODUCT GAP THAT CD-D-005 WILL REMOVE**,
    and that is a declared residue, not a closure.
  what_the_post_condition_reads: >
    `refuse_a_number_without_its_inputs(spec, usable, reading)` — THREE things. The net's signature
    is `(spec, usable, now_utc, *extra, **extra_by_name)`. **`now_utc`, `*extra` AND
    `**extra_by_name` ARE READ BY NOTHING IN THE POST-CONDITION.**
  the_operand_that_matters: >
    `*extra` carries `model`, and `model` is what `compute(model, payloads)` executes to produce the
    magnitude. `required_inputs_are_all_present` reads `spec.model_ref` — **A NAME ON THE SPEC** —
    and never the `ModelSpec` OBJECT that actually decides the number. **THE MODEL THE POST-CONDITION
    REASONS ABOUT AND THE MODEL THE BODY COMPUTES WITH ARE NOT THE SAME THING, AND NOTHING ASSERTS
    THEY ARE.**
  measured_P_F_B1: |
    B1a  required_inputs_are_all_present(satisfied spec, present inputs) = True
         -> the post-condition's premise is TRUE, so it will refuse NOTHING
    B1c  net(spec, usable, now, <a ModelSpec the registry never resolved>)
         -> raised UnspecifiedMapping   <- NOT the post-condition. `compute`'s executor.
  the_bound_MEASURED_BY_EXHAUSTION_NOT_BY_ARGUMENT: |
    `model` reaches EXACTLY ONE consumer, `compute`, and `MappingKind` is closed BY THE LANGUAGE
    (an Enum with members cannot be extended). So the outcome set is FINITE and P-F arm B2b
    ENUMERATES IT rather than reasoning about it:
      MappingKind members shipped: ['UNSPECIFIED']
      UNSPECIFIED through compute: raised UnspecifiedMapping
    **EVERY MEMBER OF THE CLOSED SET RAISES. There is therefore no return statement on the
    `*extra`-influenced path that a caller can reach**, which is why the answer to the dispatch's
    operative gloss — *"can a caller put something in `*extra` that CHANGES WHAT THE EVALUATOR
    RETURNS in a way the post-condition cannot see?"* — is NO at this tree.
  and_this_bound_is_NOT_the_guard_which_is_the_whole_point: >
    What holds the line is (i) `compute`'s OWN `@admits(spec=ModelSpec, payloads=dict)` door plus its
    exact-type check, and (ii) a mapping set with **one member that computes nothing**, which is a
    PRODUCT GAP owed to CD-D-005 and not a control. **WHEN CD-D-005 LANDS A COMPUTING MAPPING,
    BOUND (ii) EVAPORATES AND THIS MEASUREMENT MUST BE RE-TAKEN.** Raised as CD-ENG-WO2R3-03-F03.
  the_two_bounds_that_ARE_structural_and_are_recorded_in_the_net_s_favour:
  - 'P-F B3 — `**extra_by_name` is narrowed by the INNER''s own fixed keyword arity: an undeclared
     keyword is `TypeError: _evaluate_dial() got an unexpected keyword argument`. The net''s arity is
     open; **the thing behind it is not**, and that is a real bound the record had not stated.'
  - 'P-F B0 — the post-condition DOES hold on the axis it was written for. Starved spec + a
     value-bearing reading -> `AbsenceYieldedAValue`. CD-ASR-F03''s own proposition is intact and
     this seat found no route around it that does not also defeat `compute`.'

