findings:
- id: CD-ENG-WO2R3-03-F01
  severity: LOW
  against: 'PO-DECISIONS-0012 ruling 1''s WORDING — not its ruling.'
  what_is_measured: >
    Ruling 1 reasons that `guarded` is *"a function-local binding, **never importable**, reachable
    only through doors that already establish."* **"NEVER IMPORTABLE" IS FALSE OF THE OBJECT.**
    P-F arm A2: `from crash_detector.engine.evaluate import _evaluate_dial` **SUCCEEDS**. The object
    is bound to a module-level name and Python has no privacy; only the IDENTIFIER `guarded` is
    unimportable, and an identifier is not what a caller needs.
  why_it_is_LOW_and_not_higher: >
    **THE RULING SURVIVES ITS OWN BAD SENTENCE.** The clause that carries the weight is the third —
    "reachable only through doors that already establish" — and that one is measured TRUE against
    the declared-foreign actor at arm 2 above, which is a stronger test than importability. The
    wording should be corrected because a reader who checks it will find it false and may then
    disbelieve the clause that is true.
  disposition: 'RAISED AND OPEN. For the Product Owner. NOT corrected by this seat — governance/decisions/ is protected scope.'

- id: CD-ENG-WO2R3-03-F02
  severity: MEDIUM
  against: 'THE NET ITSELF, and it is the sharpest thing this measurement found.'
  what_is_measured: >
    **ON THE DIRECT ROUTE, THE BODY RUNS BEFORE ANYTHING REFUSES.** P-F arms A3/A3b: calling the net
    with a duck spec, the body read `required_input_ids` off the UNESTABLISHED duck and returned,
    and only THEN did anything refuse — and what refused was
    `refuse_a_number_without_its_inputs`'s own `@admits` door, which runs AFTER the body returns.
  why_it_matters: >
    BP-AMENDMENT-0001 §D.1's whole proposition is that establishment happens **AT THE DOOR** so that
    *"an edit to this body cannot remove them"*. **A REFUSAL THAT ARRIVES AFTER THE BODY HAS RUN IS
    NOT THAT PROPERTY.** It is a post-condition, which is exactly what PO-DECISIONS-0012 ruling 1
    CALLS the thing — so this is not a contradiction of the ruling; it is a precise statement of
    what being a net costs, which no record has yet written down. `now_utc` is refused by a check
    in the body (`TypeError: expected datetime, got _DuckClock`, P-F B4) — a body check, and body
    checks are the shape §D.1 exists to replace.
  what_is_NOT_claimed: >
    **NO ROUTE, NO ESCAPE, NO EXPLOIT.** Nothing here produces a wrong number. It is a statement
    about WHEN establishment happens on a route that is itself outside the threat model.
  disposition: 'RAISED AND OPEN. Travels to the sixth Assurance seat and to the Product Owner.'

- id: CD-ENG-WO2R3-03-F03
  severity: MEDIUM
  against: 'THIS SEAT''S OWN HALF-(b) ANSWER — the residue behind the word "NO".'
  what_is_measured: >
    Half (b) answers NO **only because `MappingKind` ships one member that computes nothing.** That
    is a PRODUCT GAP (CD-D-005 owed by the Product Owner before WO-3), not a guard. The
    post-condition's structural blindness to `*extra` is UNCHANGED and UNMITIGATED.
  the_precise_claim_that_expires: >
    **"NO `*extra` MODEL CAN CHANGE WHAT THE EVALUATOR RETURNS" IS TRUE AT THIS TREE AND FALSE THE
    DAY A COMPUTING `MappingKind` MEMBER LANDS.** On that day a caller reaching the net can supply a
    model the spec never named, the magnitude will be computed from it, and
    `required_inputs_are_all_present` will still return True because it reads `spec.model_ref`.
  the_carrier_question_stated_plainly: >
    **THERE IS NO CARRIER FOR THIS.** Nothing in `tests/` fails if the post-condition's premise and
    the executed model diverge, because at this tree they cannot both exist. **A residue with no
    carrier is a note, and CD-RULE-006 says a check reports and a carrier fails.** This seat did not
    build one, because a carrier for a divergence that cannot be constructed at this tree would have
    to construct a computing mapping — which is CD-D-005's content and is PRODUCT MEANING
    (PBG-AUTH-005). **SAID RATHER THAN QUIETLY OMITTED.**
  disposition: 'RAISED AND OPEN. Recommend it be attached to CD-D-005 so it cannot land unread.'

- id: CD-ENG-WO2R3-03-F04
  severity: LOW
  against: 'A DISAGREEMENT BETWEEN TWO PRODUCT OWNER RECORDS, reported because the dispatch requires it.'
  what_disagrees: >
    **PO-DECISIONS-0012 ruling 4** ends: *"**If either lands**, ruling 1 falls, `guarded` becomes a
    door, and CD-ASR-F03 is redesigned"* — naming BOTH halves as falsifiers.
    **PO-DECISIONS-0013 ruling 1** states the consequence for ONE half only: *"**If reachable
    without an established door**, 0012 ruling 1 falls..."*, and the increment-7 dispatch's STOP
    condition names only that half too.
  why_it_did_not_change_this_seat_s_action: >
    **NEITHER HALF LANDED, SO THE DIVERGENCE IS NOT LOAD-BEARING THIS TIME AND THE INCREMENT
    PROCEEDS ON EITHER READING.** It is recorded because it WOULD have been load-bearing had half
    (b) landed: this seat would have been reading one record telling it to stop and another telling
    it to continue, on its own measurement, under time pressure. **THAT IS A SEQUENCING HAZARD
    WORTH ONE PARAGRAPH NOW AND AN INCREMENT LATER.**
  disposition: 'RAISED AND OPEN. For the Product Owner to reconcile at the sixth gate.'

- id: CD-ENG-WO2R3-03-F05
  severity: LOW
  against: 'variants/WO-2R3/MANIFEST.md — this seat''s own corpus housekeeping, and CD-PL-F97''s subject.'
