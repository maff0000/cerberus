CD_PL_F73:
  finding: 'CD-PL-F73 (LOW) — the standing description of the exclusion set says the Engineer''s variants run "through V52". They run through V53, and V53 is a real delivered patch.'
  severity: LOW
  measured: >
    variants/WO-2R/CD-ENG-READER-F05/V53-pending-inline-key-lifts-an-ADMISSIBLE-key.patch exists at
    50fc231 and MANIFEST.md carries a full row for it at line 1722 ("the lifted key is ADMISSIBLE,
    and the value has no name to recognise"), attributed to the seat and mapped to CD-EGRESS-007.
    The phrase "through V52" appears in ACTIVE_WORK.yaml's next_safe_action and in
    BL-...-0038's next_safe_action, both written at a ceiling.
  why_a_LOW_finding_is_worth_the_words: >
    AN EXCLUSION SET THAT UNDERSTATES ITSELF IS WORSE THAN ONE THAT OVERSTATES. Told the set ends at
    V52, an auditor who independently devises V53's attack would believe it FRESH, spend gate time on
    it, and report a guard proved against a route the Engineer had already fired at it. That is the
    precise failure the corpus exists to prevent, and it is the CD-ENG-WO2R-F27 hazard in a second
    form: F27 is a row that claims cover it does not have; F73 is cover that claims not to exist.
    CORRECTED IN THE DISPATCH — it states V01-V53 — rather than left to trip the auditor.
  the_denominator_is_NOT_settled_and_is_handed_over_as_work: >
    Measured at 50fc231: 70 files matching `*.patch`, plus 2 `.py.txt` probe records under
    CD-PL-F65/, = 72 variant artefacts; 73 files under variants/ including MANIFEST.md; ZERO
    executable (PBG-ASSURE-001 satisfied). THE SEAT REPORTED "71 re-run, 71 verdicts, 0 apply
    failures" and the Project Lead did NOT re-run the corpus at the previous boundary. 71 is neither
