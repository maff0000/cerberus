CD_PL_F72:
  finding: 'CD-PL-F72 (LOW) — CD-RULE-008 under-specifies its own procedure: "a pristine clone at the committed SHA" omits ON WHICH BRANCH, and a detached checkout reads CONTINUITY_DRIFT on a byte-identical tree.'
  severity: LOW
  how_it_was_found: >
    This seat took the CD-RULE-008 verdict by cloning and running `git checkout <sha>`, which leaves
    a DETACHED HEAD. It read AMBER, CONTINUITY_DRIFT/RESUME_BLOCKED-adjacent, at 2f27bb8 — and the
    committed record CLAIMS GREEN at b1a118f and f547fdc. That looked like a real continuity
    degradation and was very nearly written up as one.
  what_was_measured_with_one_variable_changed: >
    Six SHAs (750b353, b1a118f, 2f27bb8, f547fdc, e7b34e9, 8e9456f) on DETACHED HEAD: all six read
    AMBER/CONTINUITY_DRIFT. The same clone, the same trees, re-checked out with `git checkout -B main
    <sha>` for 2f27bb8, b1a118f and f547fdc: ALL THREE READ GREEN/CONTINUITY_MATCH. The only
    variable that moved was the branch name. ACTIVE_WORK.yaml records `branch: main`, and boot
    compares observed branch to recorded branch.
  ruling: >
    THE RECORD'S GREEN CLAIMS ARE CORRECT AND THIS SEAT'S PROBE WAS WRONG. Not a defect in the
    repository — a defect in the RULE'S WORDING and in this seat's execution of it. CD-RULE-008 is
    amended forward: the pristine clone is checked out ON THE RECORDED BRANCH, and an entry naming a
    boot verdict names the SHA **and the branch** it was taken at.
  why_it_is_recorded_rather_than_quietly_corrected: >
    THIS IS THE FIFTH RECURRENCE OF CD-ENG-WO2R-F13 ON THIS PROJECT — a probe refused for the wrong
    reason — and the SECOND against the Project Lead's own work. The first four were counted in
    BL-...-0038 (the Engineer twice, the PL's own probe, and once against a prose measurement at
    CD-PL-F71). A rule whose stated procedure produces a false AMBER on a healthy record is a rule
    that will eventually produce a false alarm nobody has time to chase down, at a boundary where it
    matters. It is carried into the Assurance dispatch as an adopted method note, in the auditor's
    own terms: a result that agrees with what you expected is the one to re-run.

