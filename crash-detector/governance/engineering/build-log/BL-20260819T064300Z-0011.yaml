findings_raised:
- id: CD-PL-F35
  severity: 'MEDIUM — gate-relevant but no longer blocking on its own. See the boundary ruling below.'
  found_by: PROJECT_LEAD_SEAT_01
  where: 'tools/register/check_no_execution_interface.py and tools/register/_broker_vocabulary.py'
  what: >
    (a) TRADE-LIFECYCLE VOCABULARY IS ABSENT. PL-B escapes on "Hand the parcel to the counterparty
    for filling." The words carrying the meaning are `counterparty` and `fill` — which are not
    euphemisms or wordplay, they are the core vocabulary of trade execution, as standard as `order`.
    The vocabulary covers ORDER ENTRY and stops there; it does not cover the rest of the trade
    lifecycle — fill, counterparty, exchange, venue, settle, clear, RFQ, ticket.
    (b) INTRANSITIVE AND DIRECTIONAL PROSE IS NOT READ. PL-D escapes on "The ticket goes out to the
    exchange." The seat added passive-voice handling for CD-ENG-F33 ("was routed to the desk"), but
    this construction is neither active-with-direct-object nor passive: the tradeable noun is the
    SUBJECT of an intransitive verb of motion toward a destination. Same proposition, third grammar.
    (c) FALSE POSITIVE ON THIS PROJECT'S OWN VOCABULARY. `apply_work_order(order_id)` fails, and
    "work order" is core governance vocabulary in this repository — WO-1 through WO-6, every
    dispatch, every Build Log entry. The seat tuned the PROSE bigram but left the IDENTIFIER rule
    firing, and recorded that as deliberate. It is the more dangerous half: a check that fails on
    innocent code in the exact vocabulary the project uses daily is a check somebody will eventually
    be tempted to weaken, and weakening a guard to obtain a pass is the failure mode every control
    here exists to prevent.
  disposition: 'ASSIGNED to Engineer CD-ENG-WO2-01 instance 6 as a bounded prerequisite of increment 6.'

decisions_closed:
- id: CD-D-014
  title: 'The declared limit of CD-RT-012-NO-EXECUTION-INTERFACE — where does hardening stop?'
  decided_by: PROJECT_LEAD_SEAT_01
  ruling: >
    ONE further bounded pass, closing CD-PL-F35 (a), (b) and (c). Then the guard must DECLARE ITS
    OWN LIMIT in writing, in the check's documentation and in its register entry, and no further
    hardening is asked for in WO-2.
  rationale: >
    Two rounds of independent probing have now each found a fresh escape. Extrapolated naively that
    argues for a third round, and a fourth. But that reasoning has no terminating condition, and a
    static checker over arbitrary natural language provably cannot have one — a sufficiently
    determined euphemism defeats any word list and any grammar, and a project that pretends
    otherwise is telling itself a story about its own guard.
    So the right move is not more rounds; it is to fix the classes that are genuinely IN SCOPE and
    then WRITE DOWN WHAT THE GUARD CANNOT DO. PL-B and PL-D are in scope and are not clever: they
    use ordinary trade vocabulary and ordinary English grammar, and a guard on CD-AC-012 that misses
    "counterparty", "fill" and "goes out to the exchange" is incomplete on its own terms. A guard
    that misses a genuinely obscure euphemism is at its limit, and that is a different thing, which
    should be stated rather than papered over.
    This is also already the Product Owner's accepted position. CD-BP-001, risk-accepted by the PO
    at Blueprint acceptance, records that the AST register checks are NEVER A SOLE GUARD. CD-AC-012
    is defended by three checks, not one — the source scan, the lockfile denylist, and the compose
    egress posture — plus the structural fact that the engine and both surfaces sit on internal
    networks with nowhere to send an order. A declared limit on one of three guards is honest
    engineering inside a position the PO has already taken; an undeclared limit is not.
  what_the_declaration_must_say: >
    Plainly, in the check and in the register entry: what classes of violation this check DOES
    detect, what it CANNOT detect and why, that it is one of three guards for CD-AC-012 and never a
    sole guard (CD-BP-001), and what a reader should do instead of trusting it alone. An auditor
    reading the register must be able to see the boundary without having to discover it.
  consequence: >
    Assurance will still plant its own CD-AC-012 variant, as its dispatch requires. If that variant
    lands beyond the declared limit, the correct outcome is a finding against the DECLARATION — was
    the limit honestly drawn? — and not an automatic RED against the guard. That is a fair test of a
    guard that says what it is, and it is available only because the limit was written down first.
- id: CD-D-015
  title: 'CD-ENG-F34 — two delivered guards have no register row'
  decided_by: PROJECT_LEAD_SEAT_01
  ruling: 'CORRECT AS DELIVERED. No row is added. Carried to the Product Owner as a WO-3 question.'
  rationale: >
    CD-BASE-IMAGE-DIGEST-PIN and CD-BUILD-CONTEXT-RESTRICTED are real guards that run and pass, but
    neither derives from a PID §6 acceptance criterion — they guard Standards Baseline supply-chain
    properties. BLUEPRINT §14 says every §6 row becomes a register entry; it does not license rows
    that trace to nothing, and adding one would break exactly the traceability the register exists
    to carry. The seat was right to disclose rather than either invent a criterion or quietly drop
    the guards.
    Whether PID §6 should gain a criterion for supply-chain and build-context integrity is a PRODUCT
    question — it changes what the product promises — and belongs to the Product Owner alongside
    CD-D-005 and the CD-D-012 health-endpoint question. Not blocking: the guards run regardless, and
    the WO-2 gate turns on the five criteria, all of which are traced.

