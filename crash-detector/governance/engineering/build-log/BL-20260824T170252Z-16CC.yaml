findings_this_seat_raises_against_its_own_work:
  - >-
    **`CD-ENG-F01` — TWO ARMS LABELLED `CONTROL` IN THE EXISTING PLANT SET MOVE `PASS` ->
    `FAIL — 2` UNDER RULE CC, AND THE TWO CASES ARE NOT THE SAME.** `C16`
    (`publication_note`) and `C31` (`market_pulse`) each add an optional ROOT property; RULE CC
    fires on both because neither is a canonical dial slot and neither name is on the allowlist.
    **THAT IS RULE CC DOING WHAT IT WAS ORDERED TO DO**, but it changes what those arms MEAN.
    **`C16` IS NOT A NEW FALSE POSITIVE AND THAT IS MEASURED:** `C16` never paid
    `check_schema_closed`'s root allowlist, so the SIBLING row `CD-RT-002-SCHEMA-CLOSED` has FAILED
    on it at BOTH tips all along — measured, `FAIL — 2 violation(s)`, exit 1, *"UNDECLARED KEYS
    PRESENT: publication_note"*. RULE CC makes two rows AGREE about a tree they used to disagree
    about. **`C31` IS A GENUINE NEW FALSE POSITIVE AND IS RECORDED AS ONE:** `C31` DOES pay that
    allowlist — measured, `CD-RT-002-SCHEMA-CLOSED: PASS — 280 assertions, 0 violations`, exit 0 —
    so this row now refuses a tree the sibling accepts. The ruled direction is the one taken and is
    arguably more correct than the green was (`market_pulse` is a THIRD DIAL SLOT and "two dials,
    never blended" is standing product), **but the cost is real: `C31` was the auditor's control
    proving `C30` fails for the RIGHT reason rather than because every new root property fails, and
    that discriminating power is GONE FROM THE ROOT LEVEL.** What replaces it is stated in the
    MANIFEST rather than left implicit: green at the root is `CC-I`, red at the root is `CC-H`
    (same allowlisted NAME, widened SUBSCHEMA only), and the branch-level pair is `CC-E`/`CC-F`.
    **AND THERE CAN NO LONGER BE A GREEN ARM THAT ADDS A NEW ROOT PROPERTY, BY CONSTRUCTION** — no
    future arm should be written looking for one, and adding a name to the allowlist to obtain a
    green is the one remedy the instrument's own violation text forbids.
  - >-
    **`CD-ENG-F02` — THIS SEAT'S OWN FIRST DOCUMENT-SET HARNESS CONTAINED A FALSEHOOD AND IT WAS
    CAUGHT ON THE FIRST RUN, BEFORE ANYTHING WAS BUILT ON IT.** `docset.py` built its envelope with
    `"equity_crash": dial or unknown_dial()`. **AN EMPTY-OBJECT DIAL `{}` IS FALSY**, so the `or`
    silently substituted the baseline dial and the "empty dial" case reported **ADMITTED** while
    measuring a completely different document. Fixed with an explicit `_UNSET` sentinel; the case
    then reads `REFUSED [SCHEMA_VIOLATION] at /equity_crash` on both surfaces, which is correct.
    **NO CONCLUSION IN THIS ENTRY RESTS ON THE BROKEN VERSION** — the BEFORE/AFTER document-set
    comparison was re-run from scratch with the fixed harness. It is recorded because a harness that
    reports ADMITTED about a document it never built is the same defect class as a recogniser that
    reports `False` about a node it never read, and it happened inside the increment that exists to
    close that class.
  - >-
    **`CD-ENG-F03` — A GREP CENSUS OF VIOLATION CODES IS UNRELIABLE AGAINST THIS INSTRUMENT AND
    THIS SEAT'S FIRST CENSUS WAS WRONG BECAUSE OF IT.** `grep -oE 'CD-CALM-[A-Z]+-[0-9]+'` over the
    instrument's output counts codes MENTIONED IN VIOLATION PROSE as well as codes REPORTED — and
    `CD-CALM-ROOT-008`'s text names `CD-CALM-SLOTS-007` explicitly, by design, to explain what RULE
    CC replaces. The first census therefore showed `CC-B` as `2x ROOT-008 + 2x SLOTS-007` when the
    verdict said `FAIL — 2`. **THE CORRECT CENSUS PARSES `^    rule: ` LINES**, which is what every
    census in this entry and in the MANIFEST uses, and it is stated here so the Assurance seat does
    not repeat the mistake. The corrected reading is the load-bearing one: **on `CC-B` and `CC-C`
    the recogniser reports NOTHING and RULE CC is the sole catcher.**
  - >-
    **`CD-ENG-F04` — RULE CC'S EXHAUSTIVENESS RESTS ON A PREMISE THAT IS ASSERTED PER SURFACE BUT
    IS NOT ITSELF UNIVERSALLY ARGUED.** `_ROOT_STRUCTURAL_KEYWORDS` is a finite written list, and
    the claim "nothing outside `properties` can introduce a root property" is enforced by REFUSING
    every root keyword outside that list rather than by reasoning about what each excluded keyword
    does. **THAT IS FAIL-CLOSED AND IT IS DELIBERATE**, but it means the premise is guaranteed by a
    denial and not by a proof, and `$id` is on the list on the strength of a MEASURED property of
    these two contracts (every `$ref` is a local `#/` fragment and `_resolve` resolves against the
    document root) rather than of a general argument about `$id`. **A contract whose `$ref`s were
    not all local fragments would need that entry re-examined.** Named here rather than left in the
    code comment alone.

  - >-
    **`CD-ENG-F05` — NO ENGINEER RETURN ON THIS LANE HAS EVER VALIDATED `ok = True`, AND THIS SEAT
    FOUND THAT BY VALIDATING ITS OWN ENTRY BEFORE COMMITTING IT.** Measured by direct call against
    `/srv/crash-detector/pbg/schemas`, on the two previous returns in this build-log:
    `BL-20260824T142722Z-16B4` -> **`ok = False`, stage `schema`** — *"'READY_FOR_ASSURANCE' is not
    one of [...]"*, which is `CD-PL-F204` confirmed by measurement rather than inherited;
    `BL-20260824T154200Z-16B5` -> **`ok = False`, stage `reference`** — *"parent_entry_id references
    BL-20260824T144449Z-A309 which does not exist"*, because `-A309` is an ASSURANCE verdict that
    lives on a verdict branch and not on this lane. **THIS ENTRY HIT THE SECOND FAILURE ITSELF:**
    the dispatch names `BL-20260824T163112Z-0175` as the causal parent, and that entry exists only
    on `main`. **`parent_entry_id` IS A REFERENCE THE VALIDATOR RESOLVES IN THIS TREE, SO A
    CROSS-LANE CAUSAL PARENT CANNOT GO IN IT WITHOUT GUARANTEEING `ok = False`.** Resolved by
    setting `parent_entry_id` to this lane's own previous entry — the true predecessor IN THIS
    BUILD-LOG — and recording the dispatch's causal parent in `dispatch_causal_parent`, so
    **nothing is dropped and the entry validates.** This entry is `ok = True`, stage `complete`,
    errors `[]`. **THE GENERAL POINT IS THE ONE WORTH CARRYING:** every seat that used
    `pbg log validate` saw GREEN over ZERO entries and shipped an invalid record, and the two
    failures above are different from each other — **a lane whose returns are all invalid has a
    continuity chain no tool will ever walk.** This is a PROCESS finding for the Project Lead and
    not a defect in this increment's code.
