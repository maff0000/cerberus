action_summary: >
  **PO-DECISIONS-0009 IS RECEIPTED. CD-D-127 IS RULED (C) AND CLOSED. INCREMENT 5 IS DISPATCHED.**
  This entry is a RECEIPT AND A DISPATCH BOUNDARY. It measures nothing new about the lane — the
  measurements of record remain BL-20260822T174206Z-0057's, unaltered — and it writes no code.
  What it does is take a Product Authority ruling into the durable record, convert the three
  obligations that ruling creates into carried items that survive this seat's context, and issue the
  increment-5 Engineer dispatch.
  **THE RULING WENT THIS SEAT'S WAY AND THAT IS THE LEAST INTERESTING THING ABOUT IT.** The Project
  Lead recommended (C) and (C) was taken. But the Product Owner did NOT take (C) as recommended — it
  took (C) AND BOUND THE COUNTER-ARGUMENT THIS SEAT HAD WRITTEN AGAINST ITSELF INTO THE FOURTH
  ASSURANCE SEAT'S DISPATCH AS THREE MANDATORY CLAUSES. The seat's own disclosure became the seat's
  own obligation. That is recorded here plainly because it is the mechanism this project is being
  run on, and because a seat that only records the rulings that flatter it is running a different
  project from the one on paper.
  **THE ELEVEN CLASS-2 SWEEP DISPOSITIONS ARE NOT WRITTEN AT THIS BOUNDARY AND MUST NOT BE.** They
  are owed AFTER the fourth Assurance seat reports (CD-D-130). Writing them now — while the file is
  open and it would be quick — is precisely the move the ruling rejected.

what_the_ruling_says_and_where_each_part_landed_in_the_record:
- ruling: '1 — CD-D-127 ANSWERED (C), WITH A DISPATCH OBLIGATION ATTACHED.'
  landed: >
    `open_decisions` CD-D-127 rewritten from OPEN to RULED AND CLOSED, with the question retained in
    full beneath the ruling so the ruling can be read against it. The three mandatory dispatch
    clauses are recorded in `remaining_items` as **CD-D-129** and repeated in `next_safe_action`, so
    a Project Lead resuming from this file alone cannot write the fourth Assurance dispatch without
    meeting them.
  the_part_that_binds_this_seat: >
    (ii) is the one aimed at the reader, not at the auditee: "verdicts are taken against
    DECLARATIONS, never against exit codes alone — a RED-on-sight without reading the declaration is
    a METHOD DEFECT IN THE SEAT THAT WRITES IT." The Project Lead does not get to soften that
    sentence when it drafts the brief, and it is quoted verbatim in CD-D-129 for that reason.
- ruling: '2 — INCREMENT 5 DISPATCHED AT LANE 4ac159e ON THE RE-BASED BOUNDS.'
  landed: >
    `next_safe_action` moves from "STOP, put CD-D-127 up" to "DISPATCH INCREMENT 5". The dispatch
    record itself is a separate artefact at the next boundary of this session and is NOT in this
    entry; this entry only records that the authority to issue it now exists and where it comes
    from.
- ruling: '3 — THREE NAMES ADDED TO THE FOURTH SEAT''S TARGET LIST.'
  landed: >
    The named-target list in `next_safe_action` goes from SEVEN to TEN and is duplicated in
    CD-D-129. **(i) CD-ENG-WO2R3-F15 IS RE-SCOPED UPWARD BY THE PRODUCT OWNER**: the target is
    "the blindness window, not just the guard" — a guard failing since increment 2 through TWO
    Project Lead reconciliations, which makes half the subject THIS SEAT'S (CD-PL-F86) and not the
    Engineer's. **(ii) `GRANT-MATRIX-LIVE` IS SHARPENED FROM "nobody has bitten with it" TO AN
    INSTRUCTION**: bite it, or state MEASURED limits on why you cannot. (iii) CD-ENG-WO2R3-F10
    remains open and undischarged.
- ruling: '4 — CD-D-123..126 AND CD-D-128 STAND; CD-PL-F87''S PATTERN HARVESTED AS IMP-022.'
  landed: >
    A new `remaining_items` entry records IMP-022 as a PBGv2 FRAMEWORK debt and states in terms that
    it is NOT this project's to fix and NOT this seat's to improvise a local remedy for. CD-PL-F87
    itself stays recorded in `risks` and is NOT closed by the harvest — the pattern being owned
    upstream does not make the seven instances downstream disappear.
- ruling: '5 — SEQUENCE AND GRADING RESERVE.'
  landed: >
    Increment 5 → the FOURTH fresh Assurance seat over the whole of WO-2R3. **CD-AC-002 AND
    CD-AC-005 REMAIN UNGRADED**, reserved by the Product Owner for the FIFTH boundary running.
    "Reconciliation is not acceptance, acceptance is not assurance" is carried verbatim.

