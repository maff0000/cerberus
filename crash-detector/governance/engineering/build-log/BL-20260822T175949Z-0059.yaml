the_ordering_correction_this_boundary_owes_and_executes:
  what_was_noted_against_this_seat: >
    BL-20260822T174932Z-0058 recorded, against this seat, that the prior boundary resolved
    `continuity_record_commit` FIRST and took the CD-RULE-008 pristine-clone verdict AFTERWARDS, so
    the verdict of record named a LATER SHA (0cc9e34) than the field's own value (9d355be). Both
    were true and neither was hidden, and the entry closed with "the next boundary should take the
    verdict first."
  what_this_boundary_does_about_it: >
    `continuity_record_commit` is left DELIBERATELY PENDING in this entry and in ACTIVE_WORK.yaml.
    The sequence executed is: COMMIT the boundary → take the CD-RULE-008 pristine-clone boot verdict
    AT THAT COMMIT → resolve the field to THAT SAME SHA in a CD-RULE-007 follow-up that writes the
    field and nothing else. **The verdict and the field will name ONE commit.**
  why_it_is_recorded_rather_than_just_done: >
    A method correction that is performed but not written is indistinguishable, one seat later, from
    the defect never having been raised. This is CD-PL-F85's shape and it is cheap to avoid here.

decisions_ruled_here:
- id: CD-D-129
  decision: >
    THE FOURTH ASSURANCE SEAT'S DISPATCH MUST CARRY, VERBATIM AND UP FRONT, THE THREE CLAUSES
    ORDERED AT PO-DECISIONS-0009 RULING 1, AND THE TEN-ITEM NAMED-TARGET LIST. Recorded in
    `remaining_items` and repeated in `next_safe_action`. It falls due when that dispatch is
    written — AFTER increment 5 — and it is NOT the Project Lead's to soften, re-order or summarise.
  why_it_is_a_decision_and_not_a_note: >
    Because the obligation is on a document that does not exist yet, written by a seat that does not
    exist yet, at a boundary after this one. A ruling that lives only in a decision file the next
    Project Lead may or may not re-read is not carried; a `remaining_items` entry is (PBG-CONT-007).
- id: CD-D-130
  decision: >
    THE ELEVEN CLASS-2 SWEEP DISPOSITIONS ARE OWED BY THE PROJECT LEAD AFTER THE FOURTH ASSURANCE
    SEAT REPORTS, AND ARE RECONCILED BY THE PRODUCT OWNER. THEY ARE NOT OWED AT THIS BOUNDARY AND
    NOT OWED AT INCREMENT 5, AND WRITING THEM EARLY IS PROHIBITED BY THE RULING THAT ORDERED THEM.
  the_trap_it_exists_to_stop: >
    The dispositions are eleven short paragraphs about a module that is fully understood. A future
    Project Lead with the file open and an hour spare will be tempted to "get them out of the way".
    Doing so hands the auditor the map the ruling exists to withhold. The prohibition is therefore
    written as a carried item with its trigger named, not as advice.
- id: CD-D-131
  decision: >
    INCREMENT 5 CONTINUES UNDER ACTOR_ID `CD-ENG-WO2R3-01`, THE SAME ENGINEER SEAT IDENTITY THAT
    BUILT INCREMENTS 1-4, ON A NEW DISPATCH RECORD DERIVING FROM CD-AUTH-0001.
  the_reasoning_stated_so_it_can_be_overturned: >
    PBG-SOD-001 forbids the Engineer and the Assurance Engineer being the same agent; it says
    nothing about one Engineer identity spanning the increments of ONE work order, and increments
    1-4 already ran as four separate agent instances under this one identity. The purpose CD-RULE-002
    gives the actor_id is "so the git author audit can tell WHICH SEAT BUILT WHICH STRUCTURE" — and
    the structure here is WO-2R3, which the fourth Assurance seat audits as a whole. A fresh id
    mid-work-order would split one audited structure across two authors for no gain.
    **THE ARGUMENT THE OTHER WAY, STATED BECAUSE IT IS NOT WEAK:** the Product Owner's stated reason
    for demanding fresh seats was that "the seats that wrote the admission checks are the seats
    least able to see that a check on a door is not a closure of the class of doors" — and increment
    5 asks this identity to close a class its own increment-2 mechanism did not reach. That argument
    is answered by the audit and not by the identity: the fourth Assurance seat is fresh, is
    independent, and has the increment-5 instrument's own enumeration on its named-target list
    (CD-D-119). **IF THE PRODUCT OWNER PREFERS A FRESH ENGINEER ID FOR INCREMENT 5, THIS DECISION IS
    THE ONE TO OVERTURN AND NOTHING BUILT ON IT IS EXPENSIVE TO REDO.**

