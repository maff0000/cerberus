the_structure:
  invariant_1: >
    THE CEILING IS STRUCTURAL, NOT ADVISORY, AND IT REFUSES RATHER THAN CLAMPS.
    crash_detector.staleness.StalenessWindow is the ONLY way to obtain a usable window. It
    refuses non-numbers, bool, SUBCLASSES of float/int, nan, inf, zero, negatives, and anything
    above STALENESS_WINDOW_CEILING_SECONDS. Above the ceiling it raises
    StalenessWindowOutOfRange and returns nothing, so there is no object that could be carrying
    a silently reduced value. A clamped window is a wrong window that looks like a right one —
    the same argument ScoreOutOfRange already makes about clamped scores.
  invariant_2: >
    AGREEMENT REQUIRES POSITIVE FRESHNESS EVIDENCE. crash_detector.staleness.FreshnessEvidence
    carries as_of_utc, observed_at_utc and window; THE AGE IS NOT A FIELD, it is derived inside
    the constructor, so constructing the evidence IS the age comparison. Agrees carries one with
    NO DEFAULT, demands the EXACT type, and demands that the evidence's as_of_utc equal the
    agreement's own — which closes the obvious evasion of borrowing a fresher observation's
    evidence. There is therefore no route to agreement that skips the comparison, INCLUDING a
    route that never intended to check anything: an exception handler, a fallback branch, a fast
    path, a default argument or a caller of a private helper all need the same value, and the
    value cannot be made for a stale observation.
  invariant_3: >
    NO REGRESSION OF THE SIX EXISTING ROUTES TO UNAVAILABLE. Absent, future-dated, stale,
    feed-unreachable, incoherent and unrecognised are all intact and all still asserted; the
    render table and the malformed-row catch are untouched; the increment-4 sweep is EXTENDED
    along the axis F06 attacked (the window) rather than replaced. 1289 passed, ZERO node ids
    removed.
  invariant_4: >
    THE VALUES ARE CLOSED. Both refuse being subclassed at class creation, both use __slots__,
    and every use site checks the EXACT type. Two of this seat's own first-cut defects lived
    exactly here — see findings_raised_against_this_seats_own_work.

THE_CEILING_IS_DERIVED_AND_WAS_NOT_INVENTED: >
  CD-RULE-003 and PBG-AUTH-005. STALENESS_WINDOW_CEILING_SECONDS = 900.0.
  THE CLAUSE, read at PID.md LINE 86 by this seat and quoted verbatim into the module, in the §5
  ratified property table and marked "RATIFIED 2026-08-18 — CD-D-003 resolved":
    "pipeline/publication failure independently detectable <= 15 minutes; a cadence breach
     alerts within one publication cycle; a candidate defect is caught at the register gate
     before promotion"
  15 minutes = 900 seconds.
  THE DERIVATION: a staleness window is the interval during which a stored observation is still
  treated as current. A window WIDER than the detectability budget means a dead feed renders as
  FRESH for longer than the product permits a failure to go undetected, so the budget bounds the
  window from above as a matter of the product's own ratified semantics rather than of anyone's
  judgement.
  IT IS A CEILING AND NOT A SETTING, and the code, the register entry and the execution contract
  all say which: 900 s consumes the ENTIRE budget and leaves nothing for the detection and the
  alerting, so no sane deployment runs at it. The operating window is BLUEPRINT.md LINES 314-318,
  §7, CD-AC-009, read by this seat: "The staleness window is a function, not a constant:
  `window_for(regime) -> seconds`, tightening as observed volatility rises." Scheduled WO-3.
  That function bounds the window further from BENEATH the ceiling, per regime.
  NO TIGHTER NUMBER IS IMPOSED HERE. None is derivable from any ratified clause, and choosing one
  because it looks prudent is precisely the invention CD-RULE-003 forbids. The precedent was read
  first: src/crash_detector/dials/scores.py refuses to impose a score range because "a declared
  range is a declared scale, and the scale of a dial is what the dial MEANS". This module takes
  the OTHER branch of the same rule, because here the clause exists.
  BOTH CLAUSES WERE READ BY THIS SEAT AND NOT ACCEPTED FROM THE DISPATCH. They say what the
  dispatch says they say. THE CHAIN HOLDS, so the fail-closed escalation was available and was
  not needed.

