  class the finding really names: AGREEMENT REACHED WITHOUT ANY EVIDENCE OF FRESHNESS. Not
  "1e18", and not "the serving resolver": any route by which an observation that was not current
  when it was read produces, or is carried into, agreement, on EITHER of the two age-comparison
  sites in this tree.

