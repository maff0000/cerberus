CD_ASR_F07_E08_REPORTED_AS_A_CONSEQUENCE_AND_NOT_CLAIMED_CLOSED: >
  OUT OF SCOPE by the dispatch, and reported because the dispatch asked for it either way. TWO
  DIFFERENT QUESTIONS, and conflating them would be the reporting defect this rework exists to
  correct.
  IS THE ROUTE EXPLOITABLE? NO, AND THAT IS NOW STRUCTURAL. A handler resolving to agreement has
  nothing to build Agrees FROM: it cannot omit the evidence (TypeError, no default), cannot
  fabricate it (the age is derived, not accepted), cannot borrow evidence about a fresher
  observation (AgreementWithoutFreshnessEvidence — the instants are bound), and cannot make
  evidence for a stale row (FreshnessNotEstablished). V47 proves this by execution with the
  handler firing.
  IS THE ROUTE DETECTED WHEN PLANTED? NO. E08 applied to the delivered tree exits 0, 152 passed.
  MEASURED on the E08 tree: age_seconds raised on 0 OF 6 constructible rows spanning fresh,
  stale, decade-old and future-dated, because PanelRow.__post_init__ normalises as_of_utc
  through ensure_utc. The planted handler is UNREACHABLE, so no behaviour changes and nothing
  can observe it. That is exactly the auditor's own qualification, unchanged by this increment.
  CD-ASR-F07 THEREFORE STAYS OWED AT WO-3. What this increment can honestly claim is that the
  CLASS the finding names is no longer a route to a false AGREES. What it cannot claim is that
  planting one is visible. Scope was NOT broadened.

