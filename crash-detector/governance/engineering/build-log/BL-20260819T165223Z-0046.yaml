findings_raised_against_this_seats_own_work:
- id: CD-ENG-WO2R-F20
  severity: MEDIUM
  what: >
    THE FIRST CUT OF StalenessWindow USED isinstance(window, (int, float)) AND THEN COMPARED
    WITH `>`. A subclass of float that redefines comparison defeats that completely: Python
    tries the REFLECTED operation first when the right operand is a subclass, so `age > window`
    calls window.__lt__(age), and answering False makes every age fresh whatever the number is.
    The ceiling would never have fired. Found by writing V48 before believing the structure.
  closed: >
    YES, in this increment. The check is on the EXACT type — a subclass of a number is refused,
    not coerced — and the stored value is a plain float computed from it.
- id: CD-ENG-WO2R-F21
  severity: MEDIUM
  what: >
    THE FIRST CUT OF FreshnessEvidence USED isinstance(self.window, StalenessWindow). A subclass
    overriding __post_init__ passes that while carrying ANY width at all, and a decade-old row
    would have evidenced freshness. Found by writing V49.
  closed: >
    YES, in this increment. Both values refuse being subclassed at class CREATION (the same
    posture SealedReadingType takes for the Reading sum type), AND every use site checks the
    EXACT type so the guarantee does not depend on the subclass ban alone.
- id: CD-ENG-WO2R-F22
  severity: LOW
  what: >
    tests/conftest.py's shared WINDOW_SECONDS was 3600.0 — ABOVE the ceiling this increment
    derived — so it had to change, and it changed to 600.0. THAT IS A SHARED FIXTURE TOUCHING
    MANY TESTS, and two literal ages in tests/test_evaluate.py (900 s) had to move to 500 s with
    it because they were written against the old window. No assertion was weakened and no test
    was removed — ZERO node ids removed, 97 added — but an auditor should know that a constant
    every dial and witness test reads was changed by this increment, and should satisfy itself
    that 600.0 versus 3600.0 does not make any pre-existing test easier. This seat's reading is
    that it does not: every affected test expresses staleness RELATIVE to WINDOW_SECONDS
    (`WINDOW_SECONDS + 1`), and the two literal ages were reduced only to stay INSIDE the
    window they were always meant to be inside.
- id: CD-ENG-WO2R-F23
  severity: LOW
  what: >
    THE CEILING IS ENFORCED WHERE THE WINDOW IS ADMITTED, NOT WHERE IT IS PUBLISHED. An envelope
    carrying staleness_window_seconds: 1e18 is validated by the JSON Schema as a number and is
    not refused, because the envelope RECORDS the window that was applied rather than admitting
    one. In this tree an envelope is built from a ConfigSnapshot, which cannot hold such a
    value; a hand-built envelope is a publication-provenance question. DECLARED as boundary 4
    and NOT PROVED TO BE CARRIED ANYWHERE. Raised so it is not discovered later as a surprise.
- id: CD-ENG-WO2R-F24
  severity: INFORMATIONAL
  what: >
    Diverges was deliberately NOT given a freshness requirement. CD-AC-005's proposition is about
    AGREEMENT, the stale branch returns Unavailable before either constructor is reached, and
    widening the change to Diverges would have been scope this dispatch did not give. The
    consequence is that a Diverges could in principle be constructed for a stale observation by a
    caller that bypassed the resolver. It renders "WITNESS DIVERGES", which is an alarm and not
    agreement, so it is not the failure mode CD-AC-005 names — but it is asymmetric and the next
    seat should know the asymmetry is deliberate rather than overlooked.

