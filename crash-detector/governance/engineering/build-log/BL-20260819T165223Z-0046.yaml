      quantity (CD-RULE-003). This is not a defect of the closure; it is its honest edge.
    2 CLOCK TRUST IS NOT ESTABLISHED AND IS NOT CLAIMED. FreshnessEvidence judges an age against
      the observed_at_utc it is handed, and now_utc is an argument everywhere on the freshness
      path BY DESIGN so a historical evaluation replays exactly (BLUEPRINT §7). MEASURED:
      resolve_panel(row_dated_2016, now_utc=2016-08-21T12:00:10Z, staleness_window_seconds=600.0)
      returns Agrees and renders "WITNESS AGREES". NOT PROVED TO BE CARRIED ANYWHERE.
      Pre-existing and project-wide, not introduced by this closure.
    3 object.__setattr__ WALKS PAST FROZEN, here as on every frozen value in Python and in this
      repository. Both values use __slots__ so an UNDECLARED attribute cannot be injected —
      MEASURED: object.__setattr__(window, "ceiling", 1e18) raises AttributeError. Overwriting a
      DECLARED slot on an already-constructed value is NOT preventable at the Python level —
      MEASURED: object.__setattr__(window, "seconds", 1e18) sticks, and
      object.__setattr__(evidence, "as_of_utc", ...) makes its derived age read 315360000.0.
      NOT PROVED TO BE CARRIED ANYWHERE. Same residue as boundary B of dials/magnitude.py.
    4 THE PUBLISHED ENVELOPE'S staleness_window_seconds FIELD IS NOT ADMITTED THROUGH THIS DOOR.
      The envelope carries the window that WAS applied as a plain number validated by the JSON
      Schema, so a hand-built envelope declaring an inadmissible window is a publication-
      provenance question rather than a staleness one. NOT PROVED TO BE CARRIED ANYWHERE.

