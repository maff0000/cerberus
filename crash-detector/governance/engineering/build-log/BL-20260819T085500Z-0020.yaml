rules_created:
- id: CD-RULE-001
  source: PRODUCT AUTHORITY (Ruling 1)
  substance: >
    No run record is admitted at any gate without the paired assurance verdict attached, and a
    criterion the Assurance seat holds not-PASS cannot compute PASS regardless of admitted runs.
  enforcement: >
    PROCEDURAL until IMP-015 lands in the framework. Before any latest_admitted_run is written the
    paired Assurance entry must exist as a committed file and its per-criterion verdicts must be
    quoted into the admission record. If the validator computes PASS where the auditor held
    not-PASS, THE AUDITOR'S VERDICT GOVERNS and the divergence is reported as a tooling defect.
- id: CD-RULE-002
  source: PRODUCT AUTHORITY (Ruling 3)
  substance: >
    No commit produced by an agent seat may be authored under a human identity. Author AND committer
    are the acting seat: name = the actor_id from the seat's dispatch record, email = that actor_id
    lower-cased at seats.crash-detector.invalid (RFC 2606 — guaranteed undeliverable, unmistakably
    not a mailbox).
  note_on_the_committer_field: >
    The harness identity that previously held `committer` on the lane (NoustAI-PDA) is removed too,
    not just the human author. It is not a governed actor on this project — no authority record, no
    dispatch, no role contract — and leaving it in the record implies an actor governance cannot
    account for. The harness is the mechanism; the seat is the actor; the record names actors.
- id: CD-RULE-003
  source: PROJECT LEAD, from PBG-AUTH-005 and the existing precedent in dials/scores.py
  substance: >
    Where a structural bound needs a number that carries PRODUCT MEANING, the seat DERIVES it from
    recorded product intent citing the clause, or FAILS CLOSED and raises it. It never invents a
    plausible number.
  why_it_is_created_now: >
    Ruling 2's F06 item orders a hard upper bound on the staleness window. A ceiling is a product
    quantity. Without this rule the rework's most likely failure mode is a seat picking 86400
    because it looks sensible, and an invented bound that later proves wrong rejects legitimate
    readings quietly from inside a constructor. The project already has the right precedent:
    dials/scores.py REFUSES to impose a score range for exactly this reason and says so at length.
- id: CD-RULE-004
  source: PROJECT LEAD, generalising CD-D-014 and CD-D-015
  substance: >
    Every guard either CLOSES ITS CLASS — proved by execution against adversarial variants — or
    DECLARES ITS OWN LIMIT in the check header, the register entry and the execution contract
    consistently, each boundary carrying an executable example. The prohibited third thing is a
    guard that catches a chosen instance while its register entry claims the class. A register entry
    may not claim more than its guard delivers.
  why_it_is_created_now: >
    This is the whole content of the four AMBER verdicts, stated as a standing rule instead of six
    separate repairs. The auditor itself drew the line: it judged CD-RT-012's written limit HONESTLY
    DRAWN and then added the caveat that "the honesty of THIS declaration should not be
    generalised", because CD-AC-002's AST guard has comparable limitations and NO comparable written
    declaration. That caveat is why CD-ASR-F01 is HIGH. CD-RULE-004 makes the CD-RT-012 pattern the
    project standard rather than one guard's good behaviour.

decisions_ruled_here:
- id: CD-D-025
  ruling: >
    THE PO DISPOSITION IS ACCEPTED AND EXECUTED AS RULED. CD-D-023 (do not admit) and CD-D-024
    (WO-2 does not close, WO-3 not dispatched) both STAND and are now reinforced by CD-RULE-001.
    RTR-WO2-0001 remains UNADMITTED and both artefacts remain preserved unaltered at
    governance/assurance/WO-2/. The lane remains UNMERGED.
- id: CD-D-026
  ruling: >
    THE ORDER OF THE TWO REMAINING BOUNDARIES IS: identity re-authoring FIRST, then the rework
    dispatch. Reasoning, recorded because the opposite order is the obvious one: re-authoring
    rewrites the commit metadata of all 24 lane commits and therefore changes every lane SHA. Doing
    it FIRST means ONE rewrite instead of two, the rework commits carry the correct seat identity
    NATIVELY rather than being fixed afterwards, the SHA mapping table is written once, and the
    Assurance seat audits a lane with uniform identity throughout instead of a lane with a seam in
    it. Doing it second would mean rewriting commits that had just been proved, and re-proving them.
- id: CD-D-027
  ruling: >
    THE PRE-REWRITE LANE IS PRESERVED, NOT DISCARDED. Every recorded lane SHA in the Build Log —
    3b6edae, 8723ffb, d40e5c6, cbfa7c5, 11979fb, d1abdcc, a06e64f, 66681b2 and the rest — resolves
    today and MUST continue to resolve, because the standing SHA-resolution step (CD-CONT-002) has
    already caught two fabricated values on this project and a step that starts failing for a lawful
    reason is a step that stops being trusted. Before any rewrite: a tag is placed at 66681b2, and a
    durable OLD -> NEW mapping table is written into governance. The Build Log entries themselves are
    NOT edited — their text continues to name the old SHAs, which is correct, because Build Log
    history is not rewritten (PBG-CONT-003, non-waivable). The mapping table SUPERSEDES; it does not
    correct.
- id: CD-D-028
  ruling: >
    THE WHOLE LANE IS ENGINEER WORK AND RE-AUTHORS TO ONE SEAT, CD-ENG-WO2-01. Established by
    measurement, not assumption: `git rev-list main..wo-2-skeleton` returns 24 commits; the changed
    paths of every one of them lie in the Engineer's writable scope (src/, tests/, tools/, contracts/,
    db/, deploy/, plants/, required-tests.yaml, the root manifests) or are the Engineer's OWN Build
    Log entries attesting its own increments. NOT ONE lane commit touches governance/dispatch/,
    governance/decisions/, governance/rules/ or ACTIVE_WORK.yaml — the Project Lead's exclusive
    paths. The Project Lead's own checkpoints are all on main. There is therefore no per-commit
    attribution judgement to make and none is invented.
- id: CD-D-029
  ruling: >
    MAIN IS NOT REWRITTEN. The PO scoped Ruling 3 to "every commit on the unmerged lane", and that
    is the scope executed. main's 13 checkpoint commits carry the same ambient human author and that
    is DISCLOSED here rather than quietly fixed: main is the published trunk, rewriting it would
    invalidate the checkpoint SHAs the continuity record is built on, and no ruling asks for it.
    From this entry forward every NEW commit on main carries the Project Lead seat identity, so the
    trunk has a dated seam at this entry rather than a silent inconsistency. If the PO wants main's
    history re-authored too, that is a separate bounded action and it should be taken before anything
    else is built on the trunk.

