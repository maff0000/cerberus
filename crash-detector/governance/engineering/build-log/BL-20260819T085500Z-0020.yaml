risks:
- 'CD-PL-F47 NEW, MEDIUM — the rework ordered by Ruling 2 is a REFACTOR of load-bearing types, not
  an addition of checks. Closing CD-ASR-F01 as a class means no bare scalar is reachable from both
  dial types by ANY spelling, which reaches every consumer of `.score`; closing F02/F03 means the
  Reading types become closed surfaces, which reaches every consumer of a Reading. The 1,000+
  assertion clean arms and the eleven existing plants are the regression net, and the WO-2R dispatch
  requires the full clean arm green at every increment. The risk is real and it is the cost of the
  ruling, which the PO made with the finding in front of them.'
- 'CD-PL-F48 NEW, MEDIUM — closing F04 by resolving what an allowlist entry REACHES rather than what
  it is SPELLED as cannot be done with live DNS inside a register check: a check whose verdict
  depends on the network is not reproducible and cannot be a gate. The dispatch therefore requires a
  DENY-BY-DEFAULT structure over a declared destination registry instead, which needs no resolver.
  If the WO-2R seat proposes a resolving check, the reproducibility objection must be answered before
  it is accepted.'
- 'CD-CONT-001 AMBER unchanged — a long-running seat with no intermediate commit loses everything.
  WO-2R is split into per-finding increments, each committed, each named in the commit.'
- 'CD-FWK-004 AMBER unchanged — one ACTIVE authority record maximum; separation is evidenced by
  distinct named actor_ids.'
- 'CD-FWK-005 / IMP-015 — now harvested to the framework backlog by the PO. Until it lands, the
  register can still compute PASS from admitted runs alone. CD-RULE-001 is the standing compensating
  control and it is procedural, which means it depends on a seat obeying it. Stated plainly.'

