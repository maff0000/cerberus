item_1_cd_pl_f38:
  finding: CD-PL-F38
  title: 'The pattern E motion window was four words wide'
  what_changed: >
    ONE window, in _judge_sentence pattern E of tools/register/_broker_vocabulary.py:
    `for offset in range(1, 5)` became `for offset in range(1, 9)`. The adjacent comment was
    rewritten to state the new width and the reason it is safe. NOTHING ELSE — no new pattern,
    no new vocabulary category, no new layer (CD-D-015). The vocabulary was already correct:
    `flows` was in MOTION_VERBS and `clearer` in DESTINATION_NOUNS before this change.
  why_it_escaped: >
    "Every instruction eventually flows straight through to the nominated clearer" — `clearer`
    sits SIX words past `flows`, behind "straight through to the nominated", and the scan
    reached four.
  why_widening_is_safe_and_how_it_was_checked: >
    THE BREAK BOUNDS THE FALSE POSITIVES, NOT THE NUMBER. The scan halts at the first word that
    is neither a motion particle nor an adverb, so the window only ever spans an UNBROKEN
    particle run. Widening therefore admits exactly ONE new shape — a motion verb, five to eight
    consecutive particles, then a destination noun — and cannot reach across a head noun that
    already halted it at four.

    That claim was VERIFIED rather than asserted, because it is the whole argument for the
    change. Probe `break`: "The data goes out to the pool from the exchange feed" halts on
    `pool` and never reaches `exchange` — exit 0 before and exit 0 after. The claim now written
    into the code comment is a measured one.
  no_compensating_machinery: >
    The dispatch instructed this seat to STOP and report rather than compensate if widening
    introduced a false positive. It did not: the clean arm assertion count is IDENTICAL before
    and after (29775), and every innocent-prose probe stayed silent. No compensating machinery
    was added and none was needed.

item_2_all_completeness: >
  MOTION_PARTICLES and ORDER_SEQUENCE_MODIFIERS were defined and referenced but absent from
  __all__, while their four siblings had been added. Both added. __all__ now carries 28 names and
  every one of them resolves — verified by importing the module and checking hasattr for each.

item_3_the_declared_limit:
  standing: >
    THE LOAD-BEARING ITEM, and the reason the increment was not finished. CD-D-014 required that
    this guard, after one hardening pass, STATE ITS OWN LIMIT and stop. Before this commit
    `grep -rn "DECLARED LIMIT" tools/ required-tests.yaml` returned exactly ONE hit: a dangling
    forward reference in the tradeable_tokens docstring pointing at a header that did not exist.
    It now resolves.
  written_in_three_consistent_places:
  - 'tools/register/check_no_execution_interface.py — the header, section "DECLARED LIMIT —
     WHAT THIS CHECK DOES NOT CATCH". The longest of the three; carries the measured example
     behind each item.'
  - 'required-tests.yaml — a comment block immediately above the
     CD-RT-012-NO-EXECUTION-INTERFACE entry, plus the boundary restated inside that entry''s
     negative_control.violation prose so it survives anyone reading the data alone.'
  - 'contracts/execution/CD-RT-012-NO-EXECUTION-INTERFACE.md — a "Declared limit" section. This
     file is what the register entry''s execution_contract names, so the register carries the
     declaration by reference as well as in prose.'
  the_six_boundaries_named:
  - '1. DELIBERATE EUPHEMISM. A static reader of natural language has no terminating condition
     against an author choosing words to avoid it. Evidenced, not speculated: CD-PL-F32,
     CD-PL-F35 and CD-PL-F38 were each found by a FRESH round of independent probing. That each
     round found another is the evidence for the limit.'
  - '2. CODE NAMED TO HIDE BEHIND THE work_order SEQUENCE-SENSE SUPPRESSION — named explicitly
     as the dispatch required. L1 suppresses the token `order` after any of the thirty-one
     modifiers in ORDER_SEQUENCE_MODIFIERS so the guard does not cry wolf on this project''s own
     daily vocabulary. `work_order_router` escapes L1; it escapes the CHECK only if it is ALSO
     shaped to avoid an order ticket, because L2 reads no names at all.'
  - '3. THE L3 NEGATION/HYPOTHETICAL SUPPRESSION the check already notes in its own output — and
     this seat found the real boundary is MUCH WIDER than the header''s examples suggested. The
     lists hold 46 negation words and 25 hypothetical words, including `must`, `free`,
     `advisory`, `absence`, `zero`, `say`, `check`, `example`, `criterion` and `were`. MEASURED,
     not inferred: the docstring "The engine must send each instruction to the broker" is not
     read by L3 at all, on `must` alone (probe, exit 0). A sentence needs no cunning to be
     suppressed, only an ordinary modal verb. DECLARED, NOT FIXED, per CD-D-015.'
  - '4. A MOTION CHAIN LONGER THAN EIGHT WORDS — the residual boundary left by item 1 itself,
     declared in the same breath as the widening rather than left for a later probe to find.'
  - '5. ANYTHING THAT IS NOT .py OR .sql UNDER THE FIVE SCANNED ROOTS (src, db, deploy, tests,
     tools). No YAML, JSON, TOML, shell, Markdown, notebook, template, CI job, compiled
     artefact, vendored dependency or container image is read.'
  - '6. RUNTIME. A static read of source text at one commit.'
  grounding: >
    Written as an honest statement of scope, NOT as an apology or a disclaimer, and grounded in
    the PO-accepted CD-BP-001: an AST check is NEVER a sole guard for CD-AC-012. The declaration
    names what carries the rest — CD-RT-012-LOCKFILE-DENYLIST (which no euphemism in our own
    source can evade, because the SDK is named by its publisher and not by us),
    CD-RT-012-EGRESS-NO-BROKER, and structurally the network posture of BLUEPRINT sections 2 and
    13, under which cd-engine, cd-public, cd-private and cd-store have no egress at all. It also
    tells a reader what to do instead of trusting this check alone: weigh the egress posture
    first, because of the four it is the only one that constrains what the software CAN DO rather
    than what it says. And it records CD-D-014''s consequence — a planted variant landing beyond
    the boundary is a finding against the DECLARATION, not an automatic RED against the guard.
  a_constraint_encountered_and_respected: >
    The register''s test-entry key set is a CLOSED ALLOWLIST enforced by
    pbg/tools/pbg/required_tests.py: {test_id, scope, execute, execution_contract,
    negative_control}, and negative_control admits only {violation, evidence_ref}. A new
    `declared_limit` KEY would have been rejected by the validator. This seat did not widen the
    contract to suit its content and did not touch pbg/. The declaration is carried in a YAML
    comment and in the existing free-prose field instead, which the validator accepts unchanged.

