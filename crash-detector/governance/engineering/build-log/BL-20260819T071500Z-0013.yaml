findings_raised:
- id: CD-ENG-F39
  severity: LOW
  title: 'The L3 suppression list is far wider than the check''s own header described'
  detail: >
    The check header described the L3 suppression as "`no`, `never`, `refuses`, `forbidden`,
    `if`, `would`, `planted`, `variant`, `guard`", and the note it prints on every run says the
    same. The actual lists hold 46 negation words and 25 hypothetical words, and include `must`,
    `free`, `advisory`, `absence`, `zero`, `say`, `check`, `example`, `criterion` and `were`.
    MEASURED: "The engine must send each instruction to the broker" is not read by L3 at all.

    A reader of the old header would have believed the trade was narrower than it is. That is the
    kind of gap a DECLARED LIMIT exists to close, and it was found only because writing the limit
    forced the numbers to be counted rather than recalled.
  disposition: >
    DECLARED, NOT FIXED — CD-D-015 forbids further hardening and this seat did not exceed it.
    Recorded as boundary 3 of the declared limit in all three places, with the measured example.
    Whether the suppression list should be narrowed is a question for the Project Lead and, if it
    reaches product meaning, the Product Owner. It is not this seat''s to decide.
- id: CD-ENG-F40
  severity: LOW
  title: 'The lane''s printed run-note still describes the narrow suppression list'
  detail: >
    The runtime note the check prints on every run still gives the short example list, so an
    auditor reading only the console output, and not the header, still sees the narrower
    description. The header, the register and the execution contract are now correct and
    consistent; the printed note is the fourth surface and was NOT edited.
  disposition: >
    NOT FIXED BY THIS SEAT, DELIBERATELY. Editing the note changes what the check emits, and this
    increment was bounded to four items with detection behaviour frozen after item 1. Raised for
    the Project Lead to rule on. The cost is bounded: the note is a summary and the header it
    summarises is one file away and now correct.

