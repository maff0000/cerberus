the_ceiling_is_a_product_quantity_and_the_chain_was_re_verified:
  why_this_paragraph_exists: >
    CD-RULE-003 and PBG-AUTH-005 forbid a seat inventing a product quantity, and the Project Lead
    must not hand on a derivation it has not read. The previous seat verified this chain; the
    resumed seat verified it AGAIN against the ratified text rather than inheriting the claim.
  PID_clause: >
    PID.md line 86, in the ratified table, marked "RATIFIED 2026-08-18 — CD-D-003 resolved":
    "pipeline/publication failure independently detectable <= 15 minutes; a cadence breach alerts
    within one publication cycle; a candidate defect is caught at the register gate before
    promotion". 15 minutes = 900 seconds.
  BLUEPRINT_clause: >
    BLUEPRINT.md lines 314-318, §7, CD-AC-009, scheduled WO-3: "The staleness window is a function,
    not a constant: `window_for(regime) -> seconds`, tightening as observed volatility rises."
  the_reasoning: >
    A staleness window WIDER than the detectability budget means a dead witness feed renders as
    fresh for longer than the product permits failure to go undetected, so the budget bounds the
    window from above. The regime function bounds it further from beneath at WO-3.
  the_constraint_the_seat_is_held_to: >
    900s is defensible ONLY as a HARD UPPER BOUND with the operating window explicitly deferred to
    WO-3, because a window of exactly 900s consumes the ENTIRE detectability budget and leaves
    nothing for detection and alerting. A TIGHTER number must be DERIVED with its clause cited, not
    chosen because it looks prudent. Choosing a prudent-looking number is the invention CD-RULE-003
    forbids: the seat FAILS CLOSED and escalates instead.
  the_seat_is_told_not_to_take_this_on_trust: >
    The dispatch says in terms: "Read them yourself; do not accept this paragraph as the reading."
    The fail-closed branch stays available to the seat even though the Project Lead believes the
    chain holds.

