  every engine-image service; CD-RULE-004 gives it that choice, and either way boundary 5 must end
  up saying what the guard actually does.'
- 'THEN CD-ASR-F06: a HARD UPPER BOUND on staleness windows, structural and not advisory — a caller
  passing a window above the ceiling gets a refusal, never a clamp — plus the stronger invariant the
  dispatch asks for, that Agrees be constructible only with the positive freshness evidence that
  justifies it, so a decade-old row cannot produce one by any route including one that skips the age
  comparison. That invariant is what also closes E08/CD-ASR-F07 as a consequence.'
- 'NOTHING ELSE. CD-PL-F61 (the _yamlmin.py non-termination) is a SEPARATE bounded dispatch after
  this one and before Assurance (CD-D-051); folding it in is the silent widening `prohibited`
