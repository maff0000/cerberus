      `zzSlotUnion` (**MINE, invented on the spot**)   -> `None (UNDECIDABLE)`
      `dependentRequiredSchemas` (**MINE**, a plausible-looking compound of two real keywords)
                                                       -> `None (UNDECIDABLE)`
      `grep -c` for each of my two in the instrument -> `0`.
    **SO: IS THE DENY CLASS REALLY THE COMPLEMENT OF A FINITE WRITTEN SET, OR IS THAT A
    DESCRIPTION OF THE CODE RATHER THAN A PROPERTY OF IT? IT IS A PROPERTY OF THE CODE — OVER
    KEYWORD NAMES.** `unreadable = [k for k in resolved if k not in _READABLE_KEYWORDS]` is a
    genuine universal quantification over the node's keys, and no spelling of a KEY can leave it.
    That claim survived everything I threw at it and it is a real advance. **BUT THE ALPHABET IS
    WRONG.** The recogniser quantifies over key NAMES and never over what a key's VALUE asserts,
    so a dial declared inside the VALUE of a readable key is invisible — and two readable keys
    (`enum`, `const`) can hold one. **The class is closed in one dimension and open in the
    other, and the open one is where the fifth escape lives.**
    **ON `$recursiveRef`: DISCARDING IT WAS RIGHT.** A contract carrying it is not a valid
    2020-12 schema, `load_envelope_schema` raises before any candidate is judged, and the
    instrument refuses rather than passes — so the arm cannot distinguish "the recogniser caught
    it" from "the schema would not load". Recording it as discarded, with the reason, rather than
    counting it as a fifth catch, is the honest handling and I would have done the same.
  - >-
