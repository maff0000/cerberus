  "one non-inert member is the fifth escape and it will look exactly like the previous four."
  **IT DOES, AND THERE ARE TWO OF THEM: `enum` AND `const`.** They carry no subschema, so the
  builder's reading of the spec is right about applicators — but **they NAME PROPERTIES, in their
  VALUES**, and the inversion reads keyword NAMES only. A root property spelled
