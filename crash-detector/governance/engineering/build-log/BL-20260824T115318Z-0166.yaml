the_other_finding_and_its_sharpest_edge:
  f1: >
    _dial_from_branch reads a branch's `required` and `properties` AND NOTHING ELSE — never if/then/
    else, allOf, anyOf, oneOf, not, dependentSchemas. So it builds exactly ONE document per branch,
    and a branch whose admissible shape is CONDITIONAL has variants it never constructs. Auditor tree
    X2 keeps the branch's name, its state.const, its required list and additionalProperties:false,
    widens properties.detail_level, and relocates the narrowing into "if"/{"else"} guarded by an
    OPTIONAL marker: instrument PASS 144/0, gate ADMITTED both surfaces, control (no marker) still
    REFUSED. EXACTLY ONE of the 30 execute: lines moves.
  the_edge: >
    *** AND THE IDENTITY OF THAT ONE SURVIVING CATCHER IS THE POINT. It is tests/test_detail_level.py,
    and the five assertions that fail are all LITERAL-NAME STRUCTURAL READS. The BEHAVIOURAL arm,
    test_missing_data_never_renders_as_calm_THROUGH_THE_LIVE_GATE, PASSES ON X2. So on that tree the
    behavioural guarantee is carried by NOTHING BEHAVIOURAL — it is carried by a $ref-name equality
    in a pytest file, which is precisely the "memorial in tests" ruling 9 said the guarantee must not
    be left in. ***
  and_the_collision_nobody_had_noticed: >
    THAT ASSERTION IS UNDER A LIVE PRESCRIPTION TO BE REMOVED. CD-ASR-WO3-05's F6 offered "move the
    name-coupled assertions behind a resolver that follows the $ref" as one of two remedies, and
    DECLARED LIMIT 12 records the same coupling as a cost. ADOPT THAT REMEDY AND X2 BECOMES INVISIBLE
    TO THE ENTIRE REGISTER. TWO OPEN ITEMS ON ONE ROW POINTING IN OPPOSITE DIRECTIONS.
  consequence_for_the_fx4_ruling: >
    THIS IS A SECOND AND INDEPENDENT REASON THE FX4 RULING WAS RIGHT. It was made at BL-0165 on the
    ground that absent_data_detail_level is named in both contracts' prose as the enforcement point;
    it turns out ALSO to be the only thing standing between X2 and total invisibility. The ruling
    STANDS and is now better founded than when it was made.

the_rulings_this_seat_made:
  - id: RULING ON F1's OPEN DESIGN QUESTION — DENY BY DEFAULT, DO NOT ENUMERATE
    the_question: 'The auditor offered a stronger form — build one candidate per satisfiable combination of optional markers — and correctly refused to decide it, calling it a Project Lead question.'
    ruled: >
      DO NOT BUILD IT. Take the deny-by-default form: a branch carrying any conditional keyword is
      UNBUILDABLE and is reported. The auditor verified the clean tree carries none of those keywords
      inside any branch, SO IT COSTS NOTHING TODAY AND TURNS X2 RED. Enumerating conditional shapes
      is a larger piece of work than this row should absorb, and if a legitimate conditional branch
      is ever needed THAT is the increment that prices it.
  - id: RULING ON F2's OPEN DESIGN QUESTION — TAKE THE LOOSER, LOUDER FORM
    the_question: 'The auditor offered a tighter variant of _dial_bearing (require BOTH a state and a detail_level property, less likely to fire on a non-dial) and left the false-positive trade to the Project Lead.'
    ruled: >
      TAKE THE LOOSER FORM: declaring a `state` is enough to make an unclassifiable vocabulary
      UNDECIDABLE rather than not-a-dial. A FALSE POSITIVE COSTS ONE SEAT ONE LOOK AT ONE CONTRACT;
      A FALSE NEGATIVE COSTS THE CONSTITUTION. The seat is told that if the loose form fires on
      something legitimate in the clean tree it must STOP, because that measurement would change the
      ruling.
  - id: RULING ON SEQUENCING — 16C IS HELD
    ruled: >
      16C IS NOT DISPATCHED UNTIL 16B-FIX-2 IS ASSURED. Dispatching ruling 5's three quantities into
      a guard that cannot see a liveness quantity would deliver the dead-feed detector and the hole
      that hides it IN THE SAME INCREMENT. The auditor named this constraint first.

findings_against_this_seats_own_dispatch:
  - id: CD-PL-F190
    severity: MEDIUM, CONFIRMED, and it is this seat's own error
    raised_by: CD-ASR-WO3-06
    the_dispatch_said: 'That FX1 "fail[s] on any branch not on a declared allowlist", and then asked four times whether "the allowlist binds a name, or a shape".'
    the_truth: >
      THERE IS NO BRANCH ALLOWLIST. Nothing in the check holds a list of permitted branches by name
      or by shape. DECLARED_STATES is a list of dial STATES, and CD-CALM-BRANCHES-006 is a state-set
      equality plus a one-branch-per-state cardinality rule plus a readability rule. The branch
      recogniser binds NEITHER a name NOR a shape — it binds a STATE SET.
    why_it_is_MEDIUM_and_not_LOW: >
      *** THE MISDESCRIPTION WAS LOAD-BEARING FOR THE DISPATCH'S OWN QUESTION. A seat taking the
      framing literally would have spent its budget hunting a name-versus-shape distinction that does
      not exist in the code, and would have MISSED F1 — which lives in a dimension the framing has no
      word for: the branch is correctly identified and its SHAPE is still under-determined. *** The
      auditor also observed that the dispatch's central hypothesis was HALF RIGHT AND AIMED AT THE
      WRONG HALF: the branch recogniser is not a blacklist, the SLOT recogniser is, and the dispatch
      gave the slot recogniser three lines at the end as an afterthought.
    disposition: 'Recorded against this seat. The lesson is narrower than "read the code" — it is that a dispatch which NAMES a mechanism must name it from the code and not from the summary of the code.'
  - id: CD-PL-F191
    severity: INFORMATIONAL, and it closes CD-PL-F189
    raised_by: CD-ASR-WO3-06
    the_resolution: >
      THE CENSUS IS SETTLED AND THE CAUSE IS FINALLY STATED. 30 `execute:` lines, 19 rc=0, 11
      non-zero — matching CD-ENG-WO3-06 and reconciling with CD-ASR-WO3-05's enumeration but not its
      counts. CAUSE, WHICH NO SEAT HAD SAID: `grep -c 'execute:'` returns 36 because SIX occurrences
      are the word inside prose comment blocks; only 30 match `^\s*execute:\s*\S`. THREE SEATS GOT
      THIS WRONG INCLUDING THIS ONE (CD-PL-F185) BECAUSE THE NUMBER WAS NEVER THE LOAD-BEARING PART,
      SO NOBODY RE-DERIVED IT. Now recorded so a fourth seat does not rediscover it.

