declared_limits_of_the_new_check:
  hyphen_rejoin: '**THE NEW CHECK REJOINS A HYPHEN AT A LINE BREAK BEFORE COMPARING, AND ITS THREE SIBLINGS DO NOT.** PO-DECISIONS-0022 hard-wraps `construction-provenance` across lines 28/29 of its own file, and a raw comparison would have failed a PERFECTLY FAITHFUL carriage. **The rejoin is applied identically to source and target, so it cannot make a CHANGED WORD match — it can only stop a LINE BREAK from counting as a change. Declared here and in the module header before an auditor finds it.**'
  words_not_bytes: 'Emphasis, backticks and blockquote markers are normalised away. A carriage that changed emphasis passes; one that changed a WORD does not, and `--counterfactual` proves that half rather than asserting it.'
  not_completeness: 'It proves what is quoted is genuine and that exactly one sentence was superseded. **It does NOT prove nothing else was added.** This seat''s own authored bytes are enumerated above and are out of the check''s reach. `git diff d60b8b9..HEAD -- BLUEPRINT.md` is the other half and an auditor should read it.'
  says_nothing_about_truth: '**Whether the `DETECTED` tier can in fact BEAR the load just moved onto it is not measured by this check or by anything else today.** `CD-AC-018` is unbuilt. The correction makes the record honest about where the weight sits; it does not put anything under the weight. **That gap is real and is stated here rather than left to be found.**'

