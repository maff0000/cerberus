findings_raised_by_the_project_lead_at_this_boundary:
- id: CD-PL-F82
  severity: MEDIUM
  class: 'documentary — a figure labelled MEASURED that recomputes to something else'
  what: >
    THE SUBJECT COUNT STATED IN TWO OF THE THREE CD-RULE-004 PLACES IS WRONG AGAINST THE ARTEFACT'S
    OWN OUTPUT AT THE SAME SHA. `required-tests.yaml` says "MEASURED: subjects 19 -> 24" and
    `contracts/execution/CD-RT-002-DOORS-REQUIRE-THEIR-TYPES.md` says "MEASURED: the subject count
    went from **19 to 24**". THE CHECK PRINTS, ON EVERY RUN AT 04cdd34: "SUBJECTS ENUMERATED: 27.
    DECORATED: 27." The seat's return and Build Log 0062 carry the same 24.
  the_diagnosis_which_is_more_interesting_than_the_error: >
    24 AND 19 ARE TWO DIFFERENT MEASUREMENTS COMPARED AS IF THEY WERE ONE. The check reaches subjects
    by two unioned rules; at 04cdd34, RULE 2 reaches 3 doors RULE 1 does not, so 27 total = 24 rule-1
    + 3 rule-2-only. 24 IS THE RULE-1 SUBSET. The base figure it is compared against, 19, is a TOTAL
    (16 rule-1 + the same 3 rule-2-only). So the delta "19 -> 24" understates the growth and mixes
    denominators. The truthful pair is 19 -> 27 total, or 16 -> 24 rule-1.
  why_nothing_caught_it: >
    `tests/test_judgement_path_doors.py:491` asserts `subjects >= 24` — A FLOOR, not an equality. It
    passes at 27 and would pass at 270. The check itself is honest: it derives the number FROM THE
    ARTEFACT and prints it every run. THE ARTEFACT WAS RIGHT AND THE PROSE ABOUT IT WAS WRONG, which
    is the failure mode CD-RULE-009 exists to catch, in its documentary form.
  what_it_does_NOT_mean: >
    IT DOES NOT WEAKEN THE CLOSURE. 27 of 27 are decorated, the check exits 0, and the coverage is
    WIDER than claimed, not narrower. Eight subjects were added, not five. NOTHING IS UNGUARDED
    BECAUSE OF THIS. It is a record that undersells its own work — the same direction as CD-PL-F80
    and CD-PL-F81, which is now three of these in two increments and starts to look like a pattern
    rather than three slips.
  owed: 'INCREMENT 4, with CD-PL-F80 and CD-PL-F81 under CD-D-111. Documentary — a correction to the number in all three places, NOT a change to the check and NOT a new guard.'
- id: CD-PL-F83
  severity: LOW
  class: 'a THIRD route through DECLARED LIMIT 6''s reach — the CD-PL-F80 class, not a new one'
  what: >
    A ROUTE OF THE PROJECT LEAD'S OWN THAT IS IN NO CORPUS. Rebinding `ensure_utc` in the runner's
    OWN MODULE NAMESPACE — `crash_detector.collectors.runner.ensure_utc = <a liar>` — makes every
    recorded `AttemptRecord.requested_utc` read `1999-01-01T00:00:00Z`. MEASURED, with the control
    beside it: the same driver against the unmodified module records 2026-08-22T12:00Z.
    It attacks §D.3 part 1 at the ESTABLISHMENT layer rather than at the door: the amendment says the
    instant is "already established by `ensure_utc`", and `admits` establishes the ARGUMENT'S TYPE,
    never the IDENTITY OF THE ESTABLISHING FUNCTION.
  what_it_does_NOT_defeat_and_this_matters: >
    IT IS NOT A CALLER ROUTE. It requires import-level access to the runner module — the ability to
    execute arbitrary code inside the package — which is a different threat model from "what can a
    caller of `collect` pass". §D.3 part 1's claim is about CALLERS and that claim SURVIVES: the PL
    measured that no argument reintroduces `clock` or `sleep`. This is the universal limit every
    in-process guard on this project lives inside, and DECLARED LIMIT 6 already names that reach.
  why_it_is_raised_anyway: >
    Because CD-PL-F80 was raised for precisely this reason one increment ago — the limit's NAMED
    EXAMPLE is narrower than its ROUTE — and this is a THIRD distinct route through the same reach,
    after `__closure__` (CD-PL-F80) and `__wrapped__` (which the seat found and closed at increment
    2). A limit with three known routes and one named example is underselling itself for the third
    time. IT STRENGTHENS CD-D-111's rewording obligation and should be folded into it.
  owed: 'INCREMENT 4 or the fifth increment, with CD-PL-F80 under CD-D-111. A REWORDING, NOT A GUARD (CD-D-080).'

