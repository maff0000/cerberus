findings_from_the_seat_and_how_the_project_lead_ruled_them:
- id: CD-ENG-WO2R3-F08
  severity: MEDIUM
  raised_against: 'BP-AMENDMENT-0001 §D.3 part 1 — ITS OWN SPECIFICATION, which is IN FORCE.'
  the_finding: >
    §D.3 part 1 says `clock` becomes "an engine-owned instant passed as a VALUE" — but A SINGLE
    INSTANT CANNOT MEASURE AN ELAPSED SPAN, and `FETCH_FAILED(TIMEOUT_BUDGET_EXCEEDED)` needs one.
    The amendment is SILENT on where the second reading comes from, "and that silence is exactly
    where the defect lived". The seat resolved it by making the span engine-owned too
    (`time.monotonic`, no parameter for either) and reports the gap rather than reading its own
    resolution back into its specification.
  ruling: 'CD-D-115 — THE IMPLEMENTATION STANDS AND NOTHING IS BLOCKED.'
  why: >
    §D.3 part 1's operative requirement is "A CALLER SUPPLIES NEITHER", and that is MET AND MEASURED:
    neither `clock` nor `sleep` is a parameter and the interpreter refuses both. A module-internal
    monotonic source is not a caller callable and reintroduces no injection route — the PL confirmed
    by signature that there is no parameter through which it could arrive. The seat went BEYOND the
    letter in the SAFE direction and disclosed it instead of quietly satisfying the words. That is
    the behaviour this project rewards.
    WHAT IS OWED, AND IT IS NOT THIS SEAT'S: the amendment's §D.3 part 1 WORDING IS INCOMPLETE and a
    document IN FORCE should not stay wrong. governance/blueprint/ is protected scope for every seat
    including the Project Lead, and BP-AMENDMENT-0001 is the Product Owner's. THE CORRECTION IS PUT
    UP, NOT MADE. It is documentary, it blocks no increment, and it is carried in remaining_items.
