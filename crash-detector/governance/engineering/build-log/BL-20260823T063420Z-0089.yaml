      DECORATION (no contrast)             2                       1
  the_two_decorations_at_the_BASE__AND_THEY_ARE_NOT_THE_SAME_TWO_AT_THE_TIP:
    - '`CD-RT-003-GRANT-MATRIX-LIVE` — **exit 3 on BOTH arms**, PRECONDITION_NOT_MET, for want of a live PostgreSQL. Applies cleanly; there is no contrast to have. **STILL DECORATION AT THE TIP AND NOW THE ONLY ONE.**'
