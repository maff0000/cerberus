F_06_M__THE_CORPUS_INDEX:
  defect_1__BLIND_TO_AN_ENTIRE_TREE: '`variants/MANIFEST.md` had rows for `WO-2R/` and `WO-2R2/` and **NO ROW FOR `WO-2R3/`, for SEVEN INCREMENTS.** Added, with the tree MEASURED: **45 entries — 28 patches (`V16`..`V43`), 12 `.py` probes, 4 `.sh` probes (`P-A`..`P-O`), and that tree''s own MANIFEST.md.**'
  defect_2__IT_ASSERTED_THE_OPPOSITE_OF_WHAT_IS_ON_DISK:
    the_superseded_sentence: '*"NOTHING ANYWHERE UNDER `variants/` IS EXECUTABLE — patches and prose only, mode 0664, no symlinks, no wrapper, no runner (PBG-ASSURE-001)."*'
    THE_MEASURED_STATE: |
      git apply-able patches            112   (70 WO-2R · 14 WO-2R2 · 28 WO-2R3)
      runnable probes                    16   (12 .py + 4 .sh, ALL under WO-2R3/)
      files carrying the executable bit   1   (WO-2R3/P-L-...sh, mode 0775)
      every other file                        mode 0664
      symlinks                            0
    what_the_old_sentence_was_RIGHT_about: '**THERE IS NO WRAPPER AND NO RUNNER**, and that is the half that carries `PBG-ASSURE-001`. Nothing here applies a patch, runs a suite, iterates the corpus or reports a verdict about the product. The sixteen probes are INSTRUMENTS THAT REPORT and none is a carrier (`CD-RULE-006`): every one exits 0 whatever it measures and says so in its own header.'
    what_it_was_WRONG_about_and_why_it_matters: '**A SEAT TOLD "patches and prose only" HAS BEEN TOLD THERE IS NOTHING HERE TO EXECUTE AND NO REASON TO LOOK AT WHAT IT WOULD DO.** Sixteen files under this tree run code. The corrected text names both halves separately, so the `PBG-ASSURE-001` claim survives and the false one does not, and it names the one file whose mode is not 0664 rather than rounding it off.'
  and_one_file_whose_mode_was_MINE: '`variants/WO-2R3/P-N-what-abolishing-publicness-would-cost.sh` — I created it `0775` earlier in this increment and set it to `0664` here, so that my own work is not a second exception to a convention I was in the middle of writing down. `P-L`''s `0775` is NOT mine, predates this increment, and is reported as measured.'

