A_FINDING_AGAINST_MY_OWN_WORK__AND_THE_CHEAP_ITEM_IS_WHAT_FOUND_IT:
  id: CD-ENG-WO2R3-06-F06
  severity: MEDIUM
  what: >
    **ITEM 1 OF THIS INCREMENT BROKE A PLANT.** `CD-AC-003/CD-RT-003-ENGINE-NO-WITNESS-REACH.patch`
    applied cleanly at `314592c` and contrasted exit 0 -> exit 1. The redesign rewrote
    `src/crash_detector/engine/evaluate.py`, and the plant's hunk at `_evaluate_dial`'s signature
    stopped applying: `error: patch failed: src/crash_detector/engine/evaluate.py:362`. **The
    "violated" arm was then the clean tree and exited 0** — a plant that has stopped biting,
    reporting a pass.
  how_it_was_caught: '**BY ITEM 6''s RE-MEASUREMENT AND BY NOTHING ELSE.** The suite does not apply plants. The twelve register checks do not. The Class-2 sweep does not. Had this item been deferred again — it is two gates old — the increment would have shipped with a dead plant and a green board.'
  what_I_did: >
    REGENERATED the patch against the new structure, violating the SAME proposition by the SAME
    route. Verified at the layer the proposition names rather than by exit code: the check prints
    *"witness module `crash_detector.witness.panel` is REACHABLE from the engine container's root
    set. Route (nearest first): crash_detector.witness.panel <- crash_detector.corroboration <-
    crash_detector.engine.evaluate"*. **NO PATCH WAS DELETED, DISABLED OR WEAKENED** (CD-D-033).
    Recorded in the manifest's head block rather than only fixed.
  the_finding_it_leaves_OPEN_and_it_is_NOT_MINE_TO_CLOSE: >
    **A PLANT THAT STOPS APPLYING IS INVISIBLE TO EVERY INSTRUMENT THIS PROJECT RUNS AT A
    BOUNDARY.** FOUR separate increments have now broken a plant and found out only when somebody
    re-ran the set by hand — WO-2R increments 1 and 2, WO-2R3 increment 4, and this one, each
    recorded in its own paragraph of that manifest. **CARRIER: NOT PROVED TO BE CARRIED
    ANYWHERE.** Raised rather than repaired: a runner over `plants/` is exactly the wrapper
    `PBG-ASSURE-001` forbids this seat to write, and the honest alternative is a decision
    somebody else makes.

