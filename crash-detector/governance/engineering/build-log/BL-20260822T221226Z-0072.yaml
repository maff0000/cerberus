item_C:
  defect_i_the_stale_count:
    what: >
      `src/crash_detector/admission.py` DECLARED LIMIT 1 declared "EIGHT parameters across FIVE
      callables". MEASURED BY THIS SEAT FROM ITS OWN RUN: **16 across 9**. The doors instrument
      printed `ESTABLISHED_HERE uses: 16` and listed all sixteen, at every run, for five
      increments, beside a declaration that said eight. **THE ARTEFACT AND ITS OWN DECLARATION
      DISAGREED IN PRINT.**
    the_number_is_this_seats_own: >
      `python3 -B tools/register/check_judgement_path_doors.py --root .` -> `ESTABLISHED_HERE
      uses: 16`, across collect (4), observed_for_dial (3), JsonSchemaValidator.validate (2),
      derived_within_one_dial (2), and one each on missing_adapter_members, local_refs_only,
      combine_within_one_dial, own_model_id and ModelRegistry.get = **9 callables**. The
      dispatch and the auditor also say 16/9; quoting either would have been a transcription
      (CD-RULE-009).
  defect_ii_the_alias:
    what: >
      The check matched the LITERAL spelling `ESTABLISHED_HERE` and nothing else, so
      `from ... import ESTABLISHED_HERE as _EH` was invisible. **"COUNTED, NOT HIDDEN" WAS FALSE
      UNDER ONE WORD.**
    fixed: >
      `_established_here_spellings(tree)` resolves, per module: an import alias; the plain form;
      a module-level rebinding run to a FIXPOINT so a chain resolves; and any `.ESTABLISHED_HERE`
      attribute, whatever the module is aliased to. Modules binding a non-literal spelling are
      COUNTED AND PRINTED — a silently resolved alias is only half of "counted, not hidden".
  the_contrast_BOTH_ARMS:
    artefact: 'variants/WO-2R3/P-C-an-aliased-exemption.py — adds the AUDITOR''S OWN aliased door
               to collectors/validation.py and runs FOUR readers, not one.'
    before_arm: |
      cd /tmp/base531 && python3 -B variants/WO-2R3/P-C-an-aliased-exemption.py
        BASELINE            doors exit=0  uses: 16   named: False
                            test_judgement_path_doors.py exit=0  22 passed
                            test_admission.py            exit=0  25 passed
                            whole suite                  exit=0  1538 passed
        ALIASED DOOR ADDED  doors exit=0  uses: 16   named: **False**  <- INVISIBLE
                            test_judgement_path_doors.py exit=0  22 passed  <- INVISIBLE
                            test_admission.py            exit=1  **2 failed, 23 passed**
                            whole suite                  exit=1  **2 failed, 1536 passed**
    after_arm: |
      cd /srv/crash-detector-wo2r3 && python3 -B variants/WO-2R3/P-C-an-aliased-exemption.py
        ALIASED DOOR ADDED  doors uses: **17**  named: **True**
