    reading: 'The CHECK now sees it. The CARRIER always did.'

THE_DISAGREEMENT_WITH_THE_AUDITOR:
  id: CD-ENG-WO2R3-02-F08
  severity: MEDIUM
  the_record_as_written: >
    SUPPLEMENT-T2-GRADING §2.4: "For a *door parameter* exemption I found no carrier that sees
    it." The dispatch carries it forward and orders this seat to answer or declare: "Name a
    carrier MEASURED — a test that goes RED when a seventeenth aliased use arrives — or write the
    words NOT PROVED TO BE CARRIED ANYWHERE."
  what_this_seat_measured: >
    **THERE IS A CARRIER, AND IT EXISTED AT 531c95c.**
    `tests/test_admission.py::test_the_established_here_exemptions_are_exactly_this_set` and
    `::test_every_established_here_states_a_reason_in_the_artefact` go RED — `2 failed, 23
    passed` — on the auditor's own aliased door, on a pristine `git archive 531c95c` extraction.
    They enumerate the exemptions from the **RUNTIME COMPILED DECLARATION OBJECTS**, walking the
    package with `pkgutil.walk_packages`, so **A SPELLING CANNOT MATTER TO THEM: THEY NEVER READ
    A NAME.**
  why_the_auditor_did_not_find_it_and_this_is_not_a_criticism: >
    It ran `tests/test_judgement_path_doors.py` — the door-side reader, which is blind — found it
    blind, and **narrowed its claim to exactly what it had measured rather than widening it.**
    Its own words: *"I am narrowing the claim to what I measured, not widening it."* The claim it
    wrote is true of the reader it ran. It did not run `tests/test_admission.py`. **A NARROW TRUE
    CLAIM READ AS A GENERAL ONE IS THE SAME SHAPE AS THE DEFECT THIS INCREMENT EXISTS TO REPAIR,
    AND IT IS WORTH SAYING THAT IT CAN HAPPEN IN THE SAFE DIRECTION TOO.**
  what_was_genuinely_broken_and_is_now_fixed: >
    **THE CHECK'S REPORT.** It said 16 when there were 17. That is a reporting defect and it is
    real, and item C fixes it. What was NOT broken is the closure.
  disposition: 'RAISED. The auditor''s document is NOT edited (PBG-CONT-003, and it is protected).
                This correction stands beside it, in admission.py DECLARED LIMIT 1, in
                required-tests.yaml and in the execution contract.'

A_SECOND_FINDING_ABOUT_WHY_THE_STALE_COUNT_SURVIVED:
  id: CD-ENG-WO2R3-02-F07
  severity: MEDIUM
  what: >
    **THE COUNT WAS IN ONE CD-RULE-004 PLACE, NOT THREE.** admission.py DECLARED LIMIT 1's own
    header says it is stated "in the check header, the register entry and the execution
    contract". MEASURED: `grep -rn "across FIVE" required-tests.yaml contracts/execution/` at
    531c95c returns **NOTHING**. The limit was in three places; **the NUMBER was in one.**
  why_it_matters_more_than_this_instance: >
    CD-RULE-004's three places are what makes drift visible — a figure that disagrees with its
    copies is caught by the disagreement. **A FIGURE WITH NO COPIES CANNOT DISAGREE WITH
    ANYTHING**, so the discipline that would have caught this never applied to it. The same is
    true of every other count written into exactly one of the three places, and this seat has not
    surveyed for others.
  disposition: 'RAISED. The correction now lands in all three places. A SURVEY FOR OTHER
                ONE-PLACE COUNTS IS NOT AMONG ITEMS A-E AND IS NOT DONE.'

what_keeps_the_new_number_true:
  because_the_dispatch_asks_for_it_in_terms: '"IF YOU WRITE A COUNT INTO PROSE, SAY WHAT KEEPS IT
                                              TRUE." A hard-coded "SIXTEEN across NINE" is a new
                                              stale declaration waiting to happen.'
  the_answer: >
    **THE NUMBER IS NOT THE THING GUARDED. THE SET IS.**
    `tests/test_admission.py::test_the_established_here_exemptions_are_exactly_this_set` pins the
    exact set by module, callable and parameter, from the runtime compiled objects. If the number
    in the prose goes stale again, **the SET assertion fails first and names what moved** — so a
    stale number is then a documentation defect with a red test standing next to it.

