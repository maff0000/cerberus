# ================================================================================================== #
CD-PL-F211 — MEDIUM. THE HEADLINE FIELD OF THE BOOT VERDICT IS FIVE INCREMENTS OUT OF DATE:
# ================================================================================================== #
  the_mechanism_traced_not_guessed: >-
    `pbg/tools/pbg/boot.py:308` reads `v.facts["current_work"] = from_aw("current_work",
    "current_block", "bounded work")`. **THERE IS NO `current_work` KEY IN `ACTIVE_WORK.yaml` AT
    ALL** — confirmed by extracting it and getting an empty block at seven consecutive commits — **SO
    THE BOOT VERDICT'S HEADLINE ALWAYS FALLS THROUGH TO `current_block`, LINE 83.** A reader who
    greps the governance file for the text the boot printed does not find a field by that name,
    which is part of why this survived 25 entries.
  what_it_asserts_today: >-
    *"INCREMENT 16A IS ISSUED AND OUT — to `CD-ENG-WO3-03`, A FRESH ENGINEER IDENTITY, on branch
    `wo-3` at `116c01f`"*, and *"`Q31` IS RAISED"*, and that the entrypoint/caller exclusion *"stays
    open for one more increment"*.
  what_is_actually_true: >-
    **NO SEAT IS OUT AND NONE MAY BE DISPATCHED.** 16A was graded and is followed by 16B, its five
    fixes, 16D, 16E and 16F. `wo-3` is at `c475b8e`, not `116c01f`. **THE OPEN QUESTION IS `Q41`,
    NOT `Q31`.** The project is STOPPED at a GATE on a `RED` verdict awaiting the Product Authority.
    *"One more increment"* has since been six.
  the_measurement: >-
    The `current_block` value was extracted and hashed at every commit touching `ACTIVE_WORK.yaml`
    across the last 40. **IT CHANGES EXACTLY ONCE IN THAT RANGE — AT `dba0103`
    (`BL-20260824T093919Z-0162`, 2026-08-24 10:43 +0100, `PROJECT_LEAD_SEAT_02`) — AND IS IDENTICAL
    AT EVERY COMMIT SINCE.** `git rev-list --count dba0103..HEAD -- ACTIVE_WORK.yaml` = **29**.
    `git diff --name-only dba0103 HEAD -- build-log/ | wc -l` = **25**. **AND ITS LEAD BLOCK IS
    DATED `0158`, WHICH IS OLDER STILL THAN THE COMMIT THAT LAST TOUCHED IT.**
  why_MEDIUM_and_not_LOW: >-
    `CD-PL-F210` was an annotation on a field whose VALUE was correct, 3 boundaries stale.
    **THIS IS THE FIELD THE BOOT VERDICT LEADS WITH, IT HAS NO CORRECT VALUE UNDERNEATH IT TO FALL
    BACK ON, AND IT IS 25 ENTRIES STALE.** A Project Lead who booted, read `CONTINUITY_MATCH`, and
    trusted the headline would believe an Engineer is live on `wo-3` and that the outstanding
    product question is `Q31`. **BOTH BELIEFS WOULD LEAD IT TO ACT — to go looking for a seat's
    return, or to chase a question the Product Authority closed — AND ONE OF THEM WOULD HAVE IT
    LOOKING FOR WORK IN A LANE IT MUST NOT TOUCH WHILE `Q41` IS OPEN.**
  why_it_is_not_HIGH: >-
    **THE AUTHORITATIVE FIELDS ARE ALL CORRECT AND WERE CORRECT THROUGHOUT:** `status`
    (`WAITING_PRODUCT_AUTHORITY`), `next_actor` (`PRODUCT_AUTHORITY`), `last_build_log_entry`,
    `continuity_record_commit`, `current_phase`'s VALUE, and every `held_actions` row. Continuity
    resolves `CONTINUITY_MATCH` on the fields that bind. **NO DECISION IN THIS PROJECT WAS TAKEN ON
    THE STRENGTH OF `current_block`, AND NO CONTROL READS IT.** It misinforms a human and a booting
    seat; it does not corrupt a computation.
  and_the_uncomfortable_part: >-
    *** **`BL-20260825T000604Z-0187`, WRITTEN BY THIS SEAT TWELVE MINUTES AGO, DISCLOSED
    `CD-PL-F210` — THE SAME CLASS, THREE ENTRIES STALE — WHILE THIS ONE SAT FOUR LINES ABOVE IT IN
