  - "FINDINGS AGAINST THIS DISPATCH — and it does contain a false statement, as it warned me it would; three seats in a row have now been right about that. (i) *** §3.1 MISDESCRIBES THE MECHANISM IT ORDERS ME TO ATTACK, AND THE MISDESCRIPTION IS LOAD-BEARING FOR ITS OWN QUESTION. *** It says FX1 'fail[s] on any branch not on a declared allowlist (CD-CALM-BRANCHES-006)' and then asks, four times, whether 'the allowlist bind[s] a name, or a shape'. THERE IS NO BRANCH ALLOWLIST. Nothing in the check holds a list of permitted branches, by name or by shape; `DECLARED_STATES` is a list of dial STATES, and CD-CALM-BRANCHES-006 is a state-set equality plus a one-branch-per-state cardinality rule plus a readability rule. The distinction is not pedantry, it is the answer to the dispatch's own question: the branch recogniser binds NEITHER a name NOR a shape — it binds a STATE SET, and the check's docstring is explicit that a branch is recognised 'by its own properties.state.const, NEVER by the name of the $def it lives in', which is why my A6 (allowlisted name kept, definition widened underneath) is caught. A seat that took §3.1's framing literally would have spent its budget hunting a name-versus-shape distinction that does not exist in the code and would have missed F1, which lives in a dimension the framing has no word for — the branch is correctly identified and its SHAPE is still under-determined. (ii) §3.1's central hypothesis is HALF RIGHT AND THE DISPATCH POINTS IT AT THE WRONG HALF. 'If the allowlist recognises branches by a pattern rather than by deny-by-default unrecognisability, it is a blacklist with better manners' — the BRANCH recogniser is NOT that; I brought four shapes at it and it failed closed on all four. The SLOT recogniser IS exactly that (F2), and §3.1 gives it three lines at the end as an afterthought ('Do the same to FX3's slot-set assertion'). The dispatch's instinct was correct and its aim was off by one assertion. (iii) §5.2's disclosure IS TRUE AN