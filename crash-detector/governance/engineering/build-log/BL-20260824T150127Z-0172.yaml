the_product_owner_ruling_received:
  id: PO-DECISIONS-0027
  path: governance/decisions/PO-DECISIONS-0027.md
  committed_at: c1e45ba34bc171a1d39cc58e97d3a56760a00e5e
  what_it_rules_that_changes_this_seats_behaviour:
    - >
      RULING 6 — THE 16B-FIX-4 `RED` IS READ AS VALIDATION, NOT FAILURE. The class inversion is
      ruled REAL: the falsifier passed, five rounds of spelling-patch escapes are closed, and the
      whole-register-green-while-a-dead-feed-publishes-calm hole is shut. The RED is ruled NARROW
      and its correction is named: READ ENUM/CONST OBJECT VALUES INTO THE DECLARED SET, and do NOT
      move them out of `_INERT_KEYWORDS` — the auditor MEASURED that moving them explodes the
      false-positive tail. This seat carries that prescription VERBATIM into the dispatch and does
      not re-derive it, because the seat that measured it is not this one.
    - >
      RULING 5 — THE COMPLETION CONDITION REPLACES THE SHAPE LIST, AND THIS IS THE RULING THAT
      MATTERS MOST. The guard is DONE when ONE structural test is green: **a dial in a
      NEVER-BEFORE-NAMED state, carrying `calm`, is REFUSED** — because calm requires
      proven-fresh-and-present and an unrecognised state cannot prove it. If a further named escape
      appears AFTER that test is green, THE TEST WAS WRONG, NOT THE GUARD INCOMPLETE. That sentence
      is the exit from the census spiral and it is the Product Owner's, not this seat's.
    - >
      RULING 4 — SEQUENCE. 16C = affirmative-guard rebuild + memorial removal, plant-proved, fresh
      Assurance seat. THEN the liveness/dead-feed detector increment. THEN register the indicator
      rows. CD-D-181 sequential-only; frozen be0b355 untouched.
  what_this_seat_does_NOT_read_into_it: >
    RULING 5 forbids a FIX that adds a shape to a denylist. It does NOT forbid a second bounded
    item in the same increment when that item is the SAME class defect in a SECOND location. The
    A309-F2 finding — the BRANCH recogniser has no inversion at all — is exactly that, and this
    seat carries it into the dispatch as item 2 with its reasoning stated rather than smuggled.
    IF THE PRODUCT AUTHORITY READS RULING 5 AS ONE-ITEM-ONLY, THIS SEAT HAS EXCEEDED IT AND SAYS SO
    HERE IN ADVANCE RATHER THAN BEING FOUND OUT LATER.

the_defect_this_seat_read_for_itself_at_the_line_level:
  file: 'tools/register/check_missing_data_never_calm.py, branch wo-3, worktree /srv/crash-detector-wo3, tip dd40407'
  what_the_inversion_does: >
    `_READABLE_KEYWORDS` = (subschema keywords minus name-bearing applicators) | name-declaring
    keywords | `_INERT_KEYWORDS`. `_dial_bearing` may answer `False` only when every keyword
    present at the node is in that set; anything else makes the node UNDECIDABLE. That is the class
    fix and it works.
  what_it_misses: >
    The `declared` set is built at lines 1240-1250 from THREE keywords only — `properties` keys,
    the `required` list, and `dependentRequired` values. `enum` and `const` are in
    `_INERT_KEYWORDS`, so a node spelled `{"enum": [<LIVE reading>, <STALE reading whose
    detail_level is "calm">]}` is FULLY READABLE, contributes NOTHING to `declared`, declares no
    `state` as far as this walk is concerned, and returns a clean `False`. NOT A DIAL. INVISIBLE.
  therefore: >
    The deny class is a true complement over KEY NAMES and never quantifies over what a READABLE
    key's VALUE asserts. `enum` and `const` are correctly inert AS APPLICATORS and are not inert AS
    PROPERTY DECLARATIONS. THE ALPHABET IS WRONG; THE QUANTIFIER IS RIGHT.
  the_second_location: >
    `_branch_states` (line 1301) reads `resolved["properties"]["state"]["const"]` and NOTHING ELSE.
    It has NO inversion, no readability test, and no undecidable outcome. The two recognisers in
    one file now disagree about what "readable" means, which is A309-F2, MEASURED by the auditor
    and not suspected by this seat.

