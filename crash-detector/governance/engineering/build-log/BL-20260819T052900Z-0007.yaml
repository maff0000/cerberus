the_finding_that_matters:
  id: 'CD-ENG-F21, found by the Engineer'
  what: >
    The inherited SIGTERM handler called threading.Event.set() — which takes a lock — from a signal
    handler that interrupts the very thread holding it. The service therefore ignored SIGTERM in
    5 of 40 runs (12.5%), deadlocked in futex_wait_queue with the signal caught.
  why_it_is_recorded_here: >
    Because it is the direct vindication of CD-D-009's central condition, and the Project Lead
    should be on record about it. The PL's own reconciliation of the inherited material READ THE
    CODE and found the SIGTERM clause apparently satisfied. It was not. The docstring asserted the
    property the code failed to deliver, so reading could not have found it — only running it 40
    times could, and only a seat that treated a single flaky failure as a defect to diagnose rather
    than a test to re-run would have looked. That is precisely the difference between the Project
    Lead's reconciliation and an Engineer's attestation, and it is why CD-D-009 ruled KEEP AS
    UNATTESTED CANDIDATE rather than adopting the material on the strength of the PL's own probe.
    Had the material been committed on the PL's reading, WO-2 would have shipped a service the
    platform SIGKILLs mid-write, under a clause claiming the opposite.
  standing_lesson: >
    A clause verified by reading is verified against the author's intent. A clause verified by
    running is verified against the machine. Where a clause asserts RUNTIME behaviour, reading is
    not a method, and this project should not accept it as one again.

decisions_closed:
- id: CD-D-010
  title: 'CD-ENG-F17 — does cd_collector hold INSERT on raw.dial_required_input and raw.dial_contributing_input?'
  decided_by: PROJECT_LEAD_SEAT_01
  ruling: 'NO. The Engineer''s implementation is UPHELD. No grant is added.'
  rationale: >
    BLUEPRINT §4's matrix row reads "INSERT on raw.*", which taken literally reaches the two
    dial-input tables. §5 states that no collector holds a grant that would let it write a
    conclusion. A collector able to write a dial's required-input set decides what a dial requires,
    and therefore decides when a dial is entitled to read UNKNOWN — which is the single most
    load-bearing behaviour in this product (CD-AC-001). That is a conclusion, not an observation.
    The two clauses conflict and the specific governs the general: "raw.*" is shorthand for the
    observation tables, not a considered grant of the registry's semantics.
    This is a conflict WITHIN the Blueprint, not a question of product meaning, so it is the Project
    Lead's to rule (PBG-BP-001) and not the Product Owner's. The Engineer was right to disclose it
    rather than resolve it, and right about which way it goes.
  consequence: 'CD-ERR-001 raised below — §4''s matrix row needs tightening to say what it means.'
- id: CD-D-011
  title: 'CD-ENG-F18 — §4''s schema table says dial is readable by cd_engine; §4''s grant matrix gives it no SELECT'
  decided_by: PROJECT_LEAD_SEAT_01
  ruling: 'The GRANT MATRIX governs. No SELECT on dial.* for cd_engine. Implementation UPHELD.'
  rationale: >
    The two halves of §4 disagree, and the matrix is the operative half — it is the half written as
    grants, and the half CD-AC-003 is planted against. It is also the half that is right: evaluate()
    is a PURE function of (observations, config_snapshot, now_utc) by §7, so an engine that can read
    dial history is an engine that can be made to depend on its own previous output. Granting SELECT
    to satisfy a prose table would open exactly the route §7 exists to close. The schema table is
    descriptive prose; the matrix is the specification.
  consequence: 'CD-ERR-001.'
- id: CD-D-012
  title: 'CD-ENG-F19 — §4 says alert.* is readable by "cd_private, health endpoint", but names no role for the health endpoint'
  decided_by: PROJECT_LEAD_SEAT_01
  ruling: 'NO grant is created. Implementation UPHELD. The gap is recorded, not filled.'
  rationale: >
    There is no role to grant to. Inventing one — naming a health-endpoint principal and deciding
    what it may see — would be inventing product meaning, which no seat may do (PBG-AUTH-005), and
    the Project Lead is a seat for this purpose too. CD-AC-014 has no store role in WO-2 and needs
    none: WO-2 registers zero sources, so there is nothing for a health endpoint to report on. The
    honest state is an unfilled gap carried openly, not a plausible role created to make a prose
    line come true.
  consequence: >
    Carried to the Product Owner as an OPEN QUESTION for WO-3 alongside CD-D-005, since deciding
    what the health endpoint is and what it may see is a product call, not an implementation one.
- id: CD-D-013
  title: 'CD-ENG-F25 — .dockerignore is owed at the repository root and sits outside the Engineer''s writable_scope'
  decided_by: PROJECT_LEAD_SEAT_01
  ruling: >
    WRITABLE_SCOPE WIDENED, narrowly and durably: /srv/crash-detector-wo2/.dockerignore is added to
    CD-DISPATCH-WO2-ENGINEER.yaml writable_scope. The Engineer creates it in increment 4.
  rationale: >
    The Engineer was correct to stop and escalate rather than create it — that is the behaviour the
    dispatch asks for, and a seat that had quietly added a root file "because it was obviously
    needed" would have widened its own scope by initiative. Ruling on it is mine.
    I widen rather than defer to WO-3 for one reason: without a .dockerignore the build context
    carries governance/ and pbg/ — the entire governance record and the pinned framework — into the
    Docker daemon and into every image layer built from it. Deferring that to WO-3 means the
    protection arrives in the same work order as the first `docker build` that needs it, defended by
    nothing but a note in a Dockerfile comment and somebody remembering to read it. A .dockerignore
    is DESIGN, not BUILD: it is a declaration of what the context excludes, it builds nothing, and
    it is therefore squarely inside A6's "container set as DESIGN" and inside RT-B's prohibition
    rather than in tension with it.
    The widening does not exceed CD-AUTH-0001's own capability (PBG-RT-004): the Project Lead may
    write a root-level ignore file, so the descendant seat may be granted it. It is recorded as a
    dispatch AMENDMENT with this rationale, not applied silently.
  bounds: 'exactly one path added. No other scope changes. The amendment is committed before increment 4 is dispatched.'

errata_raised:
- id: CD-ERR-001
  against: 'BLUEPRINT.md §4'
  what: >
    Three internal inconsistencies confirmed by implementation: (a) the matrix row "INSERT on raw.*"
    for cd_collector reaches tables it should not (CD-D-010); (b) the §4 schema table and the §4
    grant matrix disagree about cd_engine's access to schema dial (CD-D-011); (c) §4 names a "health
    endpoint" reader of alert.* with no role behind it (CD-D-012).
  disposition: >
    NOT corrected in WO-2. Each is ruled above and the implementation is correct as ruled, so
    nothing is blocked. Correcting §4's text is a substantive clause change, which moves the
    Blueprint version and needs Product Owner acceptance (PBG-BP-001) — and doing it now would move
    the specification underneath an Assurance dispatch that is about to audit against it. Owed
    BEFORE WO-3, as a Blueprint revision the PO accepts, carrying CD-D-010, CD-D-011 and CD-D-012.
  why_recorded_now: >
    So that a later reader finding §4's text disagreeing with the migrations does not conclude the
    migrations drifted. They did not; §4 is imprecise and the divergence is ruled, deliberate and
    dated.

