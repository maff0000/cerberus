  base_instrument: |
    tree /tmp/e05-i5-ctl-clean  clean                                      PASS — 101 assertions, pop 33, EXIT 0
    tree /tmp/e05-i5-ctl-viol   + @establishes stripped from FetchFailed   FAIL —   1 violation,  pop 33, EXIT 1
    tree /tmp/e05-i5-escape     + the same, and `if True:` around the Union PASS —  91 assertions, pop 30, EXIT 0
  fixed_instrument: |
    tree /tmp/e05-i5-ctl-clean  clean                                      PASS — 101 assertions, pop 33, EXIT 0
    tree /tmp/e05-i5-ctl-viol   + @establishes stripped from FetchFailed   FAIL —   1 violation,  pop 33, EXIT 1
    tree /tmp/e05-i5-escape     + the same, and `if True:` around the Union FAIL —   1 violation,  pop 33, EXIT 1
