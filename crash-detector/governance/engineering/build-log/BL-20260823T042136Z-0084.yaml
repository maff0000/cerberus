A_FINDING_AGAINST_MY_OWN_WORK__CAUGHT_BY_MEASURING_INSTEAD_OF_REASONING:
  id: CD-ENG-WO2R3-05-F03
  severity: MEDIUM
  what: >
    **I WROTE A TEST WHOSE DOCSTRING CLAIMED AN `EXIT 0` -> `EXIT 1` CONTRAST AND THE MEASUREMENT
    SAID OTHERWISE.** The test planted the reachability arm in a module outside
    `engine`/`serving`/`collectors`, on the reasoning that this puts it off the judgement path and
    removes the NETS deny-by-default backstop. **IT DOES NOT: RULE 2 reaches any callable whose
    return annotation names a judgement value type, wherever it lives, and being reached by RULE 2
    IS being on a judgement path for the NETS population's purposes.** Measured at the base SHA
    that arm is `UNCLASSIFIED_INTERCEPTOR`, EXIT 1 — not EXIT 0.
  what_I_did: >
    Corrected the test's NAME and its docstring to state the measured result, and recorded in the
    docstring and in both DECLARED LIMIT texts that **I LOOKED FOR AN ARM AT `_module_bindings`
    WHERE THE BLINDNESS CONVERTS A FAIL INTO A PASS AND COULD NOT BUILD ONE.** Removing the
    backstop means putting the callable outside both RULE 1 and RULE 2, and then it is not a
    subject at all.
  the_consequence_for_the_grading_of_F_06_K: >
    **THE TWO SITES ARE NOT EQUALLY DANGEROUS AND THE RECORD SHOULD NOT SAY THEY ARE.** At
    `_module_level_names` the blindness converts a real FAIL into a PASS — a hole. At
    `_module_bindings` it converts the RIGHT violation into the WRONG one — the exit code was
    right and the diagnosis was false. **THAT IS A CORRECTION IN THE INSTRUMENT'S FAVOUR AND IT IS
    RECORDED BECAUSE IT IS TRUE, NOT BECAUSE IT IS COMFORTABLE.** An instrument whose stated reason
    is false is still unusable by an auditor, which is why it is still fixed.
  the_shape_it_is_an_instance_of: '`CD-ENG-WO2R3-F12` — a probe whose two arms differ for a reason other than the one the label claims. Third-party-verified as this project''s most-repeated measurement defect, and it caught me too.'

