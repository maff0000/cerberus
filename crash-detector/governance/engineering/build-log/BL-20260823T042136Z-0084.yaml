# ---------------------------------------------------------------------------------------------- #
WHY_THIS_ITEM_PRECEDED_ITEM_1__MEASURED_AND_REPORTED_AS_A_FINDING:
  the_finding_id: CD-ENG-WO2R3-05-F01
  against: 'THE ADOPTED ORDER, not the auditor and not the Product Owner. Neither could have known this without running it.'
  severity: MEDIUM
  what_was_measured: >
    `check_judgement_path_doors.py:_module_bindings` builds the three maps
    (`decorates`, `assigned_from`, `defined_at_module_level`) that `_reachable_public_binding`
    reasons over, and it built them from `tree.body`. **A public module-level name bound inside
    `if`/`try`/`with`/`for`/`while` was therefore not a binding as far as the reachability
    criterion was concerned.** Item 1's ruling requires that criterion to move on REAL PUBLIC
    BINDINGS. Building it on this reader first would have shipped a criterion whose input was
    already known-wrong.
  the_arm: >
    Planted into a throwaway extraction: a private factory `_install_evaluator()` returning a
    function-local `decide`, with `public_evaluator = _install_evaluator()` written inside
    `if True:`. **BASE INSTRUMENT: `UNCLASSIFIED_INTERCEPTOR` — "its return value reaches only
    ['nothing at module level'], every one of them non-public".** The object is reachable as
    `module.public_evaluator` by any importer. **FIXED INSTRUMENT: `UNDECORATED_JUDGEMENT_PATH_DOOR`.**
  what_this_finding_is_NOT: >
    It is NOT a claim that the adopted order is wrong. Items 2, 3, 4 and 6 are independent of both.
    It is a claim about ONE edge, 5 -> 1, and it is offered so the Product Owner can see the
    dependency rather than infer it.

# ---------------------------------------------------------------------------------------------- #
what_changed_in_the_code_path:
  the_new_helper: >
    `tools/register/_support.py::module_level_statements(tree)` — every statement at MODULE SCOPE,
    **pruned at the three node types that END module scope (`FunctionDef`, `AsyncFunctionDef`,
    `ClassDef`) and at nothing else.**
  why_it_is_not_ast_walk_and_not_a_list_of_block_types: >
    **THE DISPATCH SAID `tree.body` -> `ast.walk` AND I DID NOT TAKE THAT SHAPE. THE REASON IS
    MEASURED AND IS STATED HERE RATHER THAN LEFT AS A PREFERENCE.** `ast.walk` is TOO WIDE: it
    descends into function bodies and class bodies, which are not module scope, so a local variable
    inside a function would be reported as a module-level binding — a widening in the direction
    that manufactures false doors. The other obvious shape — descend into
    `if`/`try`/`with`/`for`/`while` — **IS A VOCABULARY**, which is the defect class
    `PO-DECISIONS-0012` ruling 2 removed from the membership clause, and a `match` statement
    defeats it silently. So the rule is INVERTED and CLOSED: descend into everything except the
    three scope-ending node types. It is derived from Python's own scoping rule and needs no edit
    when the grammar grows.
  the_four_sites_all_now_reading_module_scope:
    - 'tools/register/check_constructor_field_establishment.py `_module_level_names` — the prior finding, UNTOUCHED since it was raised.'
    - 'tools/register/check_judgement_path_doors.py `_module_bindings` — NEW at increment 7. **The convergence with GROUND 1.**'
    - 'tools/register/check_judgement_path_doors.py `main`, NET post-condition RESOLUTION — NEW at increment 7.'
    - 'tools/register/check_judgement_path_doors.py `main`, NET post-condition FETCH — NEW at increment 7. This one could raise `StopIteration` rather than report.'
  and_a_fifth_site_that_is_NOT_one_checked_rather_than_assumed: >
    `tools/register/check_no_blend.py:657` reads `tree.body` and is NOT a fifth site: its
    `scan_body`/`scan_statement` pair descends into `For`, `With`, `If` and `Try` bodies already.
    **It does so by ENUMERATING those types, which is the vocabulary shape** — reported here as an
    observation, not repaired, because that row is not in this item and widening scope on my own
    initiative is an escalation and not an initiative (`CD-ENG-WO2R3-05-F02`, LOW).

