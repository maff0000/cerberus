  what_the_third_row_says: >
    **INDENTING ONE LINE TOOK THREE TYPES OUT OF THE GOVERNED CLASS AND CONVERTED A REAL FAIL INTO
    A PASS.** `FetchFailed`, `Malformed` and `Empty` left the population with the violation still in
    the file. After the repair the escape arm is BYTE-FOR-BYTE the control arm's verdict.
  the_clean_arm_is_UNMOVED: >
