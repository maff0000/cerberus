    WRONG ABOUT THE MEANING** — which is the condition that teaches seats to ignore alarms.
  severity_and_ownership: >
    **MEDIUM. IT IS THIS SEAT'S, IN THIS SEAT'S OWN CONTINUITY PRACTICE, AND IT WAS FOUND BY THIS
    SEAT'S OWN BOOT RATHER THAN BY AN AUDITOR.** SIXTH named Project Lead method defect
    (CD-PL-F86, F94, F98, F99, F100, F101). **THIS SEAT DOES NOT CLAIM THAT IS ALL OF THEM.**
  what_this_boundary_did_ABOUT_it: >
    **RAISED AND DISCLOSED. NOT FIXED.** It is NOT added to the Engineer's increment: PO-DECISIONS-
