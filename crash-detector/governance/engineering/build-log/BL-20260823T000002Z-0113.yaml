decisions_taken_at_this_boundary:
- id: CD-D-152
  title: '**THE REACHABILITY MEASUREMENT GATES THE RECLASSIFICATION. ITEM 1 BEFORE ITEM 2, AND ITEM 1 IS A DECLARED STOP.**'
  the_question_it_answers: >
    PO-DECISIONS-0013 ruling 6 lists the increment's contents but does not order them. In what order
    does the Engineer execute, and what happens if the REQUIRED measurement falsifies the ruling it
    is executing?
  the_ruling: >
    **ITEM 1 (the in-process reachability measurement of `_evaluate_dial`) RUNS FIRST AND GATES ITEM
    2 (the reclassification). IF IT LANDS THE OTHER WAY THE ENGINEER COMMITS, BANKS AND RETURNS
    `STOPPED_AT_ITEM_1`, AND DOES NOT PROCEED, AND DOES NOT REDESIGN CD-ASR-F03.**
  why: >
    PO-DECISIONS-0013 ruling 1 does not merely require the measurement, **it states the consequence
    of it landing the other way**: *"If reachable without an established door, 0012 ruling 1 falls
    and `guarded` becomes a door with a redesigned CD-ASR-F03 control."* An increment that built the
    reclassification first would then be reading its own falsifying measurement **after** spending
    itself implementing what the measurement destroys — the exact condition under which a seat
    grades its own evidence gently. **THE ORDER IS THE ONLY THING THAT MAKES THE MEASUREMENT
    HONEST, AND ORDERING A DISPATCH IS THE PROJECT LEAD'S TO DO WITHOUT SETTING SCOPE.**
  how_it_could_be_wrong: >
    If the two items are less coupled than this seat believes, the ordering costs an increment some
    parallelism for nothing. **THAT IS A CHEAP WRONG ANSWER AND THE OTHER ONE IS NOT.**
- id: CD-D-153
  title: '**T8 CATEGORY A — A REAL, MEASURED PRODUCT DEFECT — IS EXPLICITLY PROHIBITED TO THIS INCREMENT.**'
  the_question_it_answers: >
    The fifth seat measured a live defect in `_is_defined_in_a_class_body`: one writable
    `__qualname__` assignment converts a FAULTED, always-refusing door into a silently-passing one
    reporting no fault, falsifying that function's own shipped docstring. It is real and it is in a
    file the Engineer has open for item 5. Does it get fixed now?
  the_ruling: >
    **NO. IT IS NAMED IN THE DISPATCH'S PROHIBITED LIST.** It receives a `DEFECT_OPEN` disposition
    from the Project Lead after this increment banks, and its remediation is a separate ruling.
  why: >
    **PO-DECISIONS-0013 RULING 6's ENUMERATION IS A CEILING AS WELL AS A FLOOR** and Category A is
    not in it. And the stronger reason: **it is the most interesting single thing in the sixth
    Assurance seat's target, and cleaning it now would pre-empt that seat on it.** This project has
    a standing rule against exactly that — *"Pre-empting an auditor by cleaning the surface it was
    dispatched to attack is how a gate stops meaning anything."*
  how_it_could_be_wrong: >
    **A MEASURED, LIVE DEFECT IS BEING LEFT IN SHIPPED CODE ON PURPOSE, AND THAT SENTENCE SHOULD BE
    UNCOMFORTABLE.** The mitigation is that the lane is not merged, not promoted and not admitted,
    the gate is shut, and the defect is now WRITTEN DOWN in three places where it was in none. If
    the Product Owner reads the balance differently, **this decision is the one to overturn and it
    is cheap to overturn.**
- id: CD-D-154
  title: '**THE DRAFT DISPOSITION VOCABULARY IS THREE WORDS, IT IS THE PROJECT LEAD''S, AND THE IMPLEMENTER IS INSTRUCTED TO ATTACK IT.**'
  the_question_it_answers: >
    PO-DECISIONS-0013 ruling 3 assigns the vocabulary draft to the Project Lead. What are the words,
    and how is that reconciled with PBG-AUTH-006?
  the_ruling: >
    **THREE DRAFTED WORDS — `DEFECT_OPEN`, `CARRIER_ONLY`, `UPSTREAM_OF_THE_PATH` — each defined by
    (a) what it ASSERTS, (b) what evidence the register MUST carry for it, and (c) WHAT IT
    EXPLICITLY DOES NOT BUY.** They cover the five T8 items no existing word fits; the other six fit
    `OUT_OF_BOUND`/`OWN` and get no new word. **THE BINDING CONSTRAINT: no new word may be a synonym
    for "not looked at", and the instrument must REJECT a disposition whose mandatory evidence fields
    are absent.** The Project Lead drafts; the ENGINEER implements the contract; the PRODUCT OWNER
    ratifies; the PROJECT LEAD then writes the eleven. `declared_dispositions.py` is protected from
    the Engineer so the drafting and the writing stay separate hands.
  why: >
    Ruling 3's reasoning is that writing eleven dispositions into a form that does not fit them
    "would be the hand-maintained-summary defect with a signature". **A VOCABULARY THAT CAN BE
    SATISFIED WITH PROSE IS THAT DEFECT WITH EXTRA STEPS**, which is why every word carries a
    machine-checkable evidence obligation rather than a description.
  the_AUTH_006_tension_named_rather_than_finessed: >
    Drafting a vocabulary is closer to design than direction, and this seat says so plainly. **THE
    PRODUCT OWNER ASSIGNED IT TO THE PROJECT LEAD IN TERMS AND A PRODUCT AUTHORITY RULING OUTRANKS
    THE DEFAULT DIVISION** — but the seat has kept its draft to the SEMANTICS and left every line of
    implementation to the Engineer, and has instructed the Engineer to disagree if it disagrees:
    *"a draft the implementer disagreed with silently is worse than no draft."*
  how_it_could_be_wrong: >
    Three words may be two too many. `CARRIER_ONLY` may collapse into `OUT_OF_BOUND` under a
    definition this seat has not found, and `DEFECT_OPEN` may be a findings-register entry wearing a
    disposition's clothes. **ALL THREE DOUBTS ARE WRITTEN INTO THE DISPATCH AS QUESTIONS TO THE
    ENGINEER RATHER THAN KEPT AS PRIVATE RESERVATIONS.**
- id: CD-D-155
  title: '**CD-PL-F101 IS RAISED, DISCLOSED AND NOT FIXED, AND IS CARRIED INTO THE META-ASSURANCE PASS.**'
  the_question_it_answers: 'The boot went AMBER on this seat''s own untracked residue. Does the seat clean it and move on?'
  the_ruling: >
    **NO. NOTHING IS DELETED, NOTHING IS ADDED TO `.gitignore`, AND THE FINDING GOES INTO THE
    META-ASSURANCE PASS THE PRODUCT OWNER AUTHORISED AT PO-DECISIONS-0013 RULING 5** — whose named
    subjects are the fingerprint recipe, the continuity model and the boot ordering practice, which
    is precisely where this defect lives.
  why: >
    **A SEAT REPAIRING ITS OWN RECONCILIATION INSTRUMENT IMMEDIATELY BEFORE AN AUDIT OF THAT
    INSTRUMENT IS THE AUDIT LOSING ITS SUBJECT.** Ruling 5's whole point is that the F98/F100 shape
    "ends with an audit, not with an infinite series of honest confessions" — **and quietly fixing
    F101 would make it exactly one more honest confession followed by a tidy-up.** The evidence stays
    on disk for the auditor to read.
  how_it_could_be_wrong: >
    Every future boot in this worktree now reads AMBER until the pass lands, and an AMBER that is
    expected is an AMBER that stops being read. **THAT RISK IS REAL AND IS RECORDED IN `risks`
    RATHER THAN TRADED AWAY.**

