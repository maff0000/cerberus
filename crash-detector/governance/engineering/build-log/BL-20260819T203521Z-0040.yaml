the_two_HIGH_findings:
  ASR2_F01:
    criterion: CD-AC-002
    severity: HIGH
    finding: >
      `combine_within_one_dial` is PUBLIC API, is ABSENT from ADMISSION_VOCABULARY, and passes an
      arbitrary caller callable's return value unvalidated into `derived_within_one_dial`. A closure
      smuggles the other dial's number past a door that only checks the LABEL. Equity 0.9 and
      monetary 0.1 publish as an EQUITY READING OF 0.5 through `number_for_dial_slot`, with
      check_no_blend PASS at 4873 assertions and the full 1325-test suite green.
    why_it_is_RED_and_not_a_declared_limit: >
      magnitude.py boundary A states WITHOUT QUALIFICATION that "the sum cannot come back... no
      number so obtained can ever be a dial magnitude again". THAT IS FALSE. Boundary 7 enumerates
      its residues exhaustively and this route is none of the three. So it is not inside a declared
      limit — it is a FALSE CARRIER, which is exactly what CD-RULE-006 forbids and exactly the
      CD-PL-F54 / CD-PL-F59 shape this project has now sent two increments back for.
    the_bitter_part: >
      CD-D-040 accepted increment 2b ON PRECISELY THE STATIC CARRIER THAT FAILS HERE. The
      Project Lead's own PL-R5 probe was refused by RULE 4 and read as proof the door was closed;
      the door is closed to a probe that arrives through a declared admission site and open to
      public API that never needed one. NQ-1 asked whether a static-only guard on the admission door
      is sufficient for CD-AC-002. THE ANSWER IS NO, AND IT IS ANSWERED BY EXECUTION.
  ASR2_F02:
    criterion: CD-AC-005
    severity: HIGH
    finding: >
      StalenessWindow refuses a `float` subclass on EXACT TYPE — and the same doctrine was never
      applied to the comparison's OTHER OPERAND. `ensure_utc` admits any `datetime` by `isinstance`.
      A `datetime` SUBCLASS makes a DECADE-OLD ROW RENDER "WITNESS AGREES", through every constructor
      on the path, with NO `object.__setattr__` anywhere. Control arm: the identical instant as a
      plain `datetime` renders WITNESS UNAVAILABLE.
    why_it_matters_beyond_its_criterion: >
      Boundary 3 said "three is the denominator, not a proof that a fourth does not exist". THIS IS
      THE FOURTH. And it is not exotic: `pandas.Timestamp` IS a `datetime` subclass. The residue the
      project ruled inside its declared limit at CD-D-040 and CD-D-057 was reached here WITHOUT the
      forbidden-but-unpreventable route, which is what makes it a finding rather than a confirmation.

