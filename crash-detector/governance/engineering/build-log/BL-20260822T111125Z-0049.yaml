findings_raised:
- id: CD-PL-F79
  severity: MEDIUM
  against: 'PROJECT_LEAD_SEAT_01, the thirteenth seat — the amendment-drafting boundary'
  rule_breached: 'CD-RULE-002 — per-seat commit identity. PRODUCT AUTHORITY, PO-GATE-REVIEW-WO2-0001 Ruling 3. NON-RELAXABLE BY ANY SEAT.'
  measured: >
    `git log --format='%h | %an <%ae> | %cn <%ce>' -20 main` run at this boundary. TWO PROJECT LEAD
    COMMITS ON main CARRY A HUMAN IDENTITY: 251b2e2 (BP-AMENDMENT-0001 PROPOSED + BL-...-0048) and
    4f0c780 (its CD-RULE-007 follow-up), both authored `Matt Scott <rogue@cerberus.local>` and
    committed `NoustAI-PDA <pda@noustai.com>`. Every other seat commit on main from ffee3af through
    685e7da carries `PROJECT_LEAD_SEAT_01 <project-lead-seat-01@seats.crash-detector.invalid>` in
    BOTH fields, so the scheme was in force and observed either side of the gap.
  why_it_is_not_cosmetic: >
    CD-RULE-002's own words: "An audit that finds a human identity is a boundary failure, not a
    cosmetic one." Those two commits attribute AGENT WORK TO A HUMAN — and they are not ordinary
    commits: 251b2e2 is the amendment the Product Owner then dispositioned. A later reader auditing
    who authored the §7 re-architecture reads Matt Scott's name on it. THE CONTENT IS UNAFFECTED and
    is not in doubt; the ATTRIBUTION is wrong, and attribution is the whole subject of the rule.
  the_mechanism_and_why_it_is_silent: >
    Exactly the CD-PL-F56 failure mode the rule already documents: this harness INJECTS GIT_*
    identity variables into the environment, so a commit made without setting them explicitly comes
    out authored by the human and committed by the harness account, and NOTHING WARNS. The rule
    prescribes environment variables on the commit invocation and a `git log -1` check after every
    commit. The check is what did not happen.
  disposition: >
    RECORDED FORWARD, NOT REPAIRED. main is NOT rewritten (CD-D-029, and every Build Log entry,
    dispatch record and continuity field naming 251b2e2 or 4f0c780 would stop resolving). A
    correction supersedes; it never edits (PBG-CONT-003, non-waivable). The commits stand with this
    finding attached to them.
  what_this_seat_does_about_it: >
    Sets GIT_AUTHOR_NAME / GIT_AUTHOR_EMAIL / GIT_COMMITTER_NAME / GIT_COMMITTER_EMAIL as ENVIRONMENT
    VARIABLES on every commit of this boundary, and runs `git log -1 --format='%an <%ae> | %cn <%ce>'`
    after each one, recording the observed result rather than the intention. Disclosed here rather
    than quietly fixed, because the previous seat's slip is the reason the check exists.

