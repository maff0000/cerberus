the_one_place_the_PO_left_a_choice_and_how_it_was_taken:
  the_choice: >
    Ruling 5: EITHER BLUEPRINT §1 gains a second instrument row for `admits`, OR the amendment states
    why it is properly §7-local. Silence is the only unacceptable resolution.
  taken: 'THE FIRST BRANCH — §1 gains the row. AND THE REASONING IS WRITTEN OUT ANYWAY.'
  why_both: >
    The PO asked for a row OR a justification, and taking the row alone would have satisfied the
    letter while leaving the next reader with an instrument in §1 and no account of why it belongs
    there. The account: `admits` is not a rule about dials. Its subject is every public entry point
    on a JUDGEMENT PATH, and three of §D.2's six doors — resolve_panel (§6, witness layer),
    present_dial (serving) and collect (§5, collector runner) — ARE NOT IN §7 AT ALL. A rule that
    governs §5, §6 and §7 and is written down in §7 is a rule the next §5 author does not read.
    THAT IS THE PROJECT'S OWN FAILURE SHAPE MOVED INTO THE DOCUMENTATION: the guard is on the class,
    the door does not ask for the class. It also meets §1's own admission test, which is not "is it
    important" but "is it verifiable from outside the running code" (PBG-EVID-001): the decoration
    is readable in source, and its acceptance test is a static enumeration of judgement paths that
    fails on any undecorated public entry point.

