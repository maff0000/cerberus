findings_raised:
- id: CD-ENG-F44
  severity: LOW
  raised_by: CD-ENG-WO2-01
  title: 'plants/MANIFEST.md prose says "five" CD-GM-001 violations where its own quoted block lists six'
  detail: >
    A counting error in manifest prose. The quoted evidence block lists six; the seat measured 6 of
    9; the total of 9 is correct. Only the adjective is wrong.
  disposition: >
    NOT FIXED, and the seat was right not to fix it. B3 is closed and MANIFEST.md is the artefact
    CD-ASR-WO2-01 is about to audit; editing the audit target after the target SHA is chosen — even
    to correct one word — moves the subject underneath the auditor. Recorded as OWED at WO-3, and
    the Assurance seat should expect to find it. If the auditor reports it independently, that is a
    small piece of evidence that the audit is actually reading the manifest rather than trusting it.
- id: CD-ENG-F45
  severity: NONE — a measurement defect, self-reported
  raised_by: CD-ENG-WO2-01
  title: 'The seat''s own shell harness misread an exit code, and it said so'
  detail: >
    The seat's first harness read `$?` after an intervening `echo` and printed "EXIT: 0" beneath a
    run whose own last line read `FAIL — 6 violation(s)`. The instrument was wrong, not the check.
    It re-measured directly and recorded the true exit 1.
  disposition: >
    NO ACTION, and recorded deliberately rather than dropped as noise. It is the clearest evidence
    in this work order for a property the register depends on: these checks PRINT their verdict as
    well as returning it, so a broken measuring instrument is catchable by reading the output. A
    register of checks that only returned an exit code would have swallowed this silently. It is
    also a seat reporting its own error against interest, which is the behaviour the Build Log
    exists to make normal.

