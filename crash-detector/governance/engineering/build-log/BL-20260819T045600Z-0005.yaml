verification_performed:
  what_this_is: >
    RECONCILIATION OF INHERITED MATERIAL BY THE PROJECT LEAD. It is NOT assurance and does not
    become assurance by being thorough (PBG-SOD-001, non-waivable). Its purpose is to establish
    whether the material is coherent enough to be worth adopting, not whether it is correct enough
    to be certified. Assurance is CD-ASR-WO2-01's, on a separate seat, at the gate.
  A5_probes:
  - 'cd_engine holds NO grant of any kind on witness.* — CONFIRMED by absence AND by explicit
    positive statement: 0007 grants USAGE on raw, dial, publication and alert only, carries no
    "GRANT ... witness ... TO cd_engine" line at all, and then adds five belt-and-braces REVOKE ALL
    ... IN SCHEMA witness FROM cd_engine statements. The asymmetry is defended, not paraphrased.'
  - 'the one-way valve — CONFIRMED: 0007 line 174 GRANT SELECT ON publication.public_envelope TO
    cd_witness, with cd_witness holding INSERT on witness.* and publication.witness_panel.'
  - 'no UPDATE or DELETE grant exists anywhere in the migration set — CONFIRMED: a grep for
    GRANT ... UPDATE|DELETE across db/migrations/ returns only a comment asserting the property.'
  - 'revoke by default — CONFIRMED: 0001 revokes ALL on all six schemas plus schema public plus the
    database itself FROM PUBLIC, before any grant exists.'
  - 'every timestamp is timestamptz — CONFIRMED: a grep for timestamp-without-time-zone, date and
    time column types across the set returns nothing.'
  - 'roles created without passwords — CONFIRMED: CREATE ROLE ... LOGIN NOSUPERUSER with no
    PASSWORD clause; the six passwords appear as ENV VAR NAMES only (CD_STORE_*_PASSWORD) in a
    comment describing the deploy step. No secret value is recorded (PBG-SEC-002 intact).'
  - 'the DISPOSABLE prohibition is DECLARATIVE, not a trigger — CONFIRMED and better than the
    dispatch asked for: raw.source_registry carries UNIQUE (source_id, criticality) and
    raw.dial_required_input pins its criticality column to REQUIRED by CHECK with a composite FK
    resolving against that pair, so a DISPOSABLE source cannot be named in a required-input set and
    a required source cannot be demoted underneath one. Both directions.'
  - 'first_published_utc set on insert and immovable — CONFIRMED, defended twice: NOT NULL DEFAULT
    now() plus a BEFORE UPDATE trigger dial_history_first_published_utc_is_immutable that RAISEs on
    any change, in addition to the absence of any UPDATE grant.'
  - 'each migration states its rollback or states it has none — CONFIRMED, all seven.'
  A6_probes:
  - 'seven services and two networks — CONFIRMED: cd-store, cd-collectors, cd-witness, cd-engine,
    cd-public, cd-private, cd-review on cd-net-private and cd-net-public.'
  - 'no egress for engine, both surfaces and the store — CONFIRMED STRUCTURALLY rather than by
    declaration: both networks are internal: true, so absence of egress is a property of the
    topology. The file discloses in terms that this makes ALLOWLIST and NONE indistinguishable at
    runtime in WO-2 and records the enforcing egress lane as OWED at WO-3 rather than claiming
    compose enforces something it cannot. That disclosure is the correct posture.'
  - 'no allowlist names a broker — CONFIRMED; every service carries an x-egress block and the
    contract block states that a service with none is a violation.'
  - 'both surfaces bound to 127.0.0.1 — CONFIRMED: "127.0.0.1:8710:8710" and "127.0.0.1:8711:8711",
    the only published ports in the file (CD-D-006 default safe action held, CD-HOLD-005 intact).'
  - 'non-root UID per service — CONFIRMED: 10001..10006 declared per service plus 70:70 for
    postgres, with USER in the Dockerfiles matching.'
  - 'three storage classes separated — CONFIRMED: read_only: true on every service, tmpfs scratch
    per service, one named volume cd-store-data for the store alone.'
  - 'digest pinning — PARTIAL AND HONESTLY DISCLOSED. cd-store is pinned by digest, resolved by
    `docker image inspect` on this host with the observed image id, repo digest, tag of origin and
    observation time recorded. The Python base is recorded status DIGEST_NOT_RESOLVED with
    reference null, because resolving it needs `docker pull`, which RT-A does not authorise and
    RT-B forbids; it fails closed via ARG CD_PYTHON_BASE with no default and ${CD_PYTHON_BASE:?}
    in compose, and is recorded owed at WO-3. Recording an unresolved digest as unresolved rather
    than writing a plausible value is correct and is the opposite of constructing evidence.'
  A6_build_posture: 'NOTHING WAS BUILT. RT-B held. Dockerfiles written, not built.'
  what_was_NOT_verified: >
    Everything else. The 242 new tests were run, not read; the seven entrypoints, the migration
    runner and the runtime lifecycle module were not reviewed line by line; and no live catalogue
    was consulted, so every grant assertion above is a reading of SQL TEXT and not of a running
    store. That last gap is deliberate and is carried forward as an explicit obligation below.

decisions_closed:
- id: CD-D-009
  title: 'Disposition of the 37 uncommitted files inherited from terminated Engineer instance 2'
  decided_by: PROJECT_LEAD_SEAT_01
  ruling: 'KEEP AS UNATTESTED CANDIDATE — adopted only through an attesting Engineer seat'
  rationale: >
    Inherited uncommitted work is evidence of an interrupted seat, not authorised progress, and the
    default disposition is refusal. The question is whether this material rebuts that default. It
    does, on four grounds that CD-D-007's material did not have. FIRST, it has a known base:
    increments 1 and 2 are committed at 8723ffb, so the material is a reviewable diff against an
    attested tree rather than an undifferentiated dump. SECOND, it has a declared scope to be
    checked against — ACTIVE_WORK records increment 3 as A5 plus A6 — and the file set matches that
    scope exactly, with nothing outside it and no protected path touched. THIRD, it is executable:
    879 tests pass, and critically the 637 tests inherited from the attested increments are all
    still green, so the material did not weaken what was already proved. FOURTH, its load-bearing
    propositions were probed directly by this seat and hold, including the two §4 asymmetries WO-2
    exists to establish.
    The distinction from CD-D-007 is not that this seat is more trusting; it is that CD-D-007's
    material was UNVERIFIABLE — no committed baseline, therefore no diff base, therefore no
    declared increment to check it against — whereas this material is verifiable and was verified.
    Quarantining verifiable, in-scope, passing work that matches its declared increment would
    discard roughly 35 minutes of correct engineering to buy a ritual, and would teach the wrong
    lesson: that the committed-increment discipline adopted after CD-D-007 buys nothing.
    What the material does NOT have is an attestation. No seat returned; no Build Log entry names
    it; no actor stands behind it. That is not a formality — an attestation is what makes a defect
    someone's to answer for. So KEEP does not mean ADOPT. The material stays uncommitted and
    outside project state until an Engineer seat reviews it against A5 and A6 clause by clause,
    corrects what is wrong, commits it, and attests it in its own Build Log entry as ITS OWN WORK.
    Until that happens it is a candidate and nothing more.
  alternatives_rejected:
  - 'QUARANTINE AND REBUILD, mirroring CD-D-007 — rejected. Consistency of process is not
    consistency of outcome on different evidence; applying the same disposition to verifiable and
    unverifiable material would make the distinction meaningless.'
  - 'ADOPT DIRECTLY, committed by this seat — rejected outright, and it is the more dangerous
    option. The Project Lead committing application code into the lane would make the Project Lead
    the implementer of work it is causally responsible for approving into Assurance, and would
    leave the increment with no Engineer attestation at all. PBG-SOD-001 is non-waivable.'
  consequences:
  - 'the re-dispatch carries an explicit adoption obligation; a seat that merely commits inherited
    material without checking it has not attested anything and has misled the record'
  - 'the snapshot is retained so any later divergence from the inherited bytes is detectable'
  - 'the increment-3 boundary commit will name CD-D-009 so the provenance stays visible'
  supersedes: 'nothing — CD-D-007 stands as ruled on its own facts'

