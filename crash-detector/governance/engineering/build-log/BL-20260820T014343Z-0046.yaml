attempted_refutation_of_CD_ENG_WO2R2_02_F01:
  why_it_was_attempted: >
    CD-D-079 says a claim about a structure carries a counterfactual. The seat applied that rule to
    ITSELF and concluded that LAYER 2 OVER THE REGISTRY closes no route alone — it could construct
    no arm where that layer is the only thing refusing. A seat reporting its own work as
    unmeasured is the conduct this project rewards, AND IT IS ALSO THE KIND OF CLAIM THAT COULD BE
    A CONVENIENT UNDERSTATEMENT. So the Project Lead tried to break it.
  the_arm_this_seat_built: >
    `meridian-fix-connect` — the auditor's own token-bearing control — appended to both manifests
    AND REGISTERED OPENLY in deploy/dependency-registry.yaml. Layer 1 must ADMIT it, because it is
    registered. If layer 2 over the registry were sole for any route, this is that route.
      unregistered : exit 1, CD-DEP-002, 2 violations
      REGISTERED   : exit 1, CD-DEP-002, 3 violations — and the THIRD is the registry-line
                     violation, "a broker SDK is REGISTERED as a dependency". SO THE REGISTRY
                     LAYER DOES FIRE, and for a moment it looked like the seat had understated it.
  the_counterfactual_that_settled_it: >
    THE COUNT IS NOT THE ANSWER; THE COUNTERFACTUAL IS. This seat removed ONLY the registry-side
    layer 2 — the `if reason:` at the registry loop, asserted to be a single occurrence — and re-ran
    the same registered token-bearing arm:
      STILL EXIT 1, 2 violations, caught by the MANIFEST-SITE layer 2.
    THE ROUTE IS OVER-DETERMINED. The registry layer fires but is not load-bearing, which is
    precisely what the seat said. CD-ENG-WO2R2-02-F01 IS CORRECT AND IS UPHELD.
  why_this_is_recorded_at_length: >
    Because a Project Lead that only ever confirms its seats is not reconciling. This is the arm
    that would have caught an understatement, it was built to catch one, and it did not. AND
    BECAUSE IT DEMONSTRATES CD-D-079's WHOLE POINT ON A LIVE CASE: the violation COUNT rose when
    the layer was engaged, which looks like evidence, and the COUNTERFACTUAL showed the layer was
    not carrying anything. A true observation from which a false inference follows is exactly the
    shape CD-PL-F74 and CD-D-079 exist to stop.

