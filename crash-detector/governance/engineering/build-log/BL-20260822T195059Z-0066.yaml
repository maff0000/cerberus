# ================================================================================================ #
# WHAT WAS RULED, AND WHAT THIS SEAT BUILT
# ================================================================================================ #
the_ruling_this_implements:
  source: 'governance/decisions/PO-DECISIONS-0010.md rulings 1 and 2, authored by the Product Owner.'
  ruling_1_verbatim: >
    "CD-D-134 is ruled: the class reads BODY-BORNE OR ABSENT. Establishment derived from the
    declaration is REQUIRED of every fielded public frozen judgement-path type. A type with zero
    fields satisfies vacuously (`Empty` today). The constructor instrument asserts this over the
    WHOLE enumerated population, so a future fielded type that arrives with no establishment FAILS
    ON ARRIVAL — it does not slip outside a class worded around bodies."
  how_this_completion_came_to_exist: >
    THIS SEAT RAISED CD-ENG-WO2R3-F17 AGAINST ITS OWN INSTRUMENT, printed it at every run with the
    words "THIS IS A REAL HOLE AND THIS SEAT IS NOT HIDING IT", and REFUSED TO CLOSE IT ON ITS OWN
    AUTHORITY because widening a ruled class is a scope decision (PBG-AUTH-005, CD-RULE-003). It
    came back RULED, and ruled WIDER than this seat recommended. **CD-ENG-WO2R3-F17 IS CLOSED BY
    RULING AND NOT BY THE SEAT THAT RAISED IT**, and nothing in this entry may be read as this seat
    closing its own finding.

# ------------------------------------------------------------------------------------------------ #
what_changed_in_the_code_path_and_not_in_the_prose:
  a_membership: >
    CLAUSE (4) — BODY-BORNE — IS NO LONGER A MEMBERSHIP GATE. Membership is now (1) PUBLIC, (2)
    FROZEN SUBJECT, (3) ON A JUDGEMENT PATH. In the classification loop the old `continue` branches
    that diverted a body-less or field-naming-less class into `adjacent_no_body` ARE GONE: every
    class satisfying (1)(2)(3) now appends to `population`, and the establishment locus is computed
    by exactly the same reading and carried on the member's row as a STRING that decides nothing.
  b_the_vacuous_case: >
    The assertion loop branches on `if not fields:`. A ZERO-FIELD member takes ONE assertion and is
    recorded in `vacuous`; a FIELDED member takes the same THREE as before. A zero-field member that
    DOES carry @establishes(...) falls through into assertions 2 and 3, so an adrift declaration on
    an empty type is still caught. **THE ONE ASSERTION IS DESCRIBED IN THE OUTPUT FOR WHAT IT IS**
    and this seat will not dress it up: it is a MEASUREMENT OF THE FIELD LIST, not a proof about
    establishment. Its whole value is that it is REFUTABLE — add a field and the member routes to
    the fielded branch and fails on assertion 1 the same run.
  c_the_adjacent_set_dies_as_an_exemption: >
    `adjacent_no_body` is replaced by `absent_establishment`, which is a REPORTING list and not an
    exemption list: its members are IN the population and, if fielded, are VIOLATIONS. The note now
    prints "members whose establishment is ABSENT: N, of which M are FIELDED and are therefore
    VIOLATIONS above, not adjacencies", and quotes the wording it replaced. **THE WORDS "ADJACENT
    SET" ARE KEPT ONLY AS A QUOTATION OF WHAT WAS SUPERSEDED.**
  d_declared_limit_1_superseded_not_deleted: 'see declared_limit_1 below.'
  e_the_fourth_cross_reference: 'see cd_pl_f91 below.'
  f_the_contrast: 'see the_contrast below. IT IS THE ONLY PROOF AND IT IS RUN IN BOTH ARMS.'
  and_the_one_reading_this_seat_had_to_choose: >
    THE DISPATCH'S OWN ITEMS (a) AND (b) CAN BE READ AS DISAGREEING AND THIS SEAT SAYS SO RATHER
    THAN PICKING QUIETLY. Item (a) says a class is IN when it is public, frozen, on a judgement path
    "and DECLARES AT LEAST ONE FIELD", which would put `Empty` OUT and leave the population at 32.
    Item (b) says the vacuous case must NOT be "a silent exclusion that drops it from the ledger",
    that "the instrument asserts over the WHOLE population", and to "Enumerate it, count it". THE
    READING TAKEN IS (b)'s, and it is taken because it is the RULING'S OWN: the Product Owner wrote
    that a zero-field type "SATISFIES vacuously" — a thing OUTSIDE a class does not satisfy it, it
    is excluded — and that the instrument "asserts this over the WHOLE enumerated population". So
    MEMBERSHIP is (1)(2)(3) and "declares at least one field" is the condition under which the
    REQUIREMENT BITES, not the condition for enumeration. **AND THE OUTPUT IS BUILT SO THE OTHER
    READING IS STILL AVAILABLE WITHOUT TRUSTING THIS ONE:** the POPULATION line prints 33, FIELDED
    32 and ZERO-FIELD 1 side by side, so a reader who prefers the narrower membership reads 32
    directly off the run. Under either reading the VERDICT on every artefact is identical.

