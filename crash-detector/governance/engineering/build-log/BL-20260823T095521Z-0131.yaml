  severity: LOW
  against: 'THIS SEAT, drafting `CD-DISPATCH-WO2R3-INC10-F01-ENGINEER`'
  statement: >
    **A HAND COUNT OF THE INSTRUMENT'S OWN LISTING WENT INTO A DISPATCH AS A DERIVED NUMBER.** The
    first draft read `DEFECT_OPEN 6 · ESTABLISHED 9 · EXACT 11 · OUT_OF_BOUND 2 · DELEGATED 1 ·
    OWN 1`. The true derivation is `EXACT 11 · ESTABLISHED 10 · DEFECT_OPEN 6 · OUT_OF_BOUND 2 ·
    DELEGATED 1`. **TWO CATEGORIES WRONG — an `OWN` that does not exist in the isinstance
    population at all, and an `ESTABLISHED` short by one.** Both drafts sum to 30, **SO THE TOTAL
    RECONCILED AND THE COMPOSITION DID NOT: the check that would most naturally be run was the one
    that could not catch it.**
  caught_by: 'Deriving the same number by command before the dispatch was committed. **NOT by review of the prose.**'
  consequence_if_uncaught: >
    The Engineer would have hunted a non-existent `OWN`-disposition isinstance site and would have
    reconciled its own correct count against a wrong one in the order that binds it. **A dispatch is
    the one document a seat cannot cross-check without doing the work twice.**
  remedy_applied: 'The dispatch now carries the DERIVING COMMAND beside the count, so the seat can falsify it in one paste (CD-RULE-009).'
- id: CD-PL-F131
  severity: LOW
  against: 'THIS SEAT, measuring the counterfactual arm'
  statement: >
    **AN EXIT CODE WAS READ FROM THE END OF A PIPELINE.** `python3 ... | tail -12; echo "EXIT=$?"`
    printed `EXIT=0` for an arm whose script had just printed `FAIL`, because `$?` was `tail`'s.
    **THE FAILING ARM WOULD HAVE BEEN RECORDED AS PASSING, IN THE VERY MEASUREMENT WHOSE PURPOSE IS
    TO PROVE A CHECK CAN FAIL.**
  caught_by: 'Reading the printed verdict and the printed exit code against each other and refusing the contradiction.'
  consequence_if_uncaught: >
    **A VACUITY PROOF THAT PROVED THE OPPOSITE OF WHAT IT CLAIMED**, recorded in a build log, at a
    boundary specifically about not overstating what an instrument establishes. **CD-PL-F115's shape
    (a count with no reproducible command) one turn of the screw further: a command that reproduces
    the wrong quantity.**
  remedy_applied: 'Both arms re-measured in their own commands with output discarded — `cmd >/dev/null 2>&1; echo $?` — and both numbers in this entry come from that run.'

