    instrument now PRINTS both numbers per module on every run, so nobody has to take this
    paragraph's word for it.
  and_the_tier_1_side_does_collapse: '52 tier-1 occurrences -> 45 distinct keys, which is where the register''s own docstring example lives.'

THIS_SEATS_VIEW_ON_THE_REDRAFT__DISAGREEMENT_WAS_INVITED_AND_HERE_IT_IS:
  the_verdict_first: >
    **THE LITERAL READING IS BUILDABLE, IT IS RIGHT, AND IT IS STRONGER THAN THE CHEAP READING
    §1.4 NAMES.** No `STOPPED_AT_ITEM_2`. Two things settled it, and neither is deference.
  reason_1_the_cheap_reading_cannot_be_written_at_all: >
    §1.4's alternative is *"keep a MODULE-level entry whose fields reference site keys"*. But
    ruling 1's FIRST stated ground for rejection is that the word *"binds the module register where
    its siblings bind the site register"*. A module-level entry that references site keys is still
    a module-level entry. **The cheap reading fixes the second half of the objection and leaves the
    first half exactly where it was.**
  reason_2_the_conditional_clause_only_pays_off_per_site: >
    `CALLER_SUPPLIED` -> `finding` is the strongest thing in the redraft, and at MODULE granularity
    it is unusable: `crash_detector.admission` has caller-supplied operands at some sites and
    module constants at others, so ONE module-level `operand_origin` would have to be the weakest
    of the 33 or a lie. **Per site, the field says something different 33 times. That is the
    difference between a register and a label.**
  WHERE_THIS_SEAT_THINKS_THE_REDRAFT_IS_WEAKER_THAN_IT_READS:
    the_gates_field_is_falsifiable_but_it_is_not_specific: >
      §1.2 says `gates` *"names a concrete downstream point in another module, and the day that
      point moves, is renamed, or dies, the row refuses."* **The second half is true and it is
      carried. The first half is weaker than it sounds.** Nothing in the instrument checks that the
      named site is DOWNSTREAM of the declaring one, or reachable from it, or related to it in any
      way. `gates` is EXISTENCE + DIFFERENT-MODULE, and nothing else. A row naming any tier-1 site
      in any other module passes. **THE GATING RELATION IS STILL A CLAIM BY THE SEAT WRITING THE
      ROW; WHAT THE MACHINE CHECKS IS THAT THE CLAIM POINTS AT SOMETHING THAT EXISTS.** That is a
      real improvement over prose and it is NOT the same as a checked route, and the content
      document's sentence invites the stronger reading.
    the_rename_test_answer_reported_whichever_way_it_falls: >
      **IT DOES NOT SURVIVE A RENAME.** Renaming `window` in `crash_detector.engine.config` makes
      every row gating `isinstance(window, float)` REFUSE. Measured, with the arm run
      (`test_THE_RENAME_TEST_...`). That is DECLARED LIMIT 4 of this tool applied to the new field
      — the safe direction, deliberately. **THE COST, STATED RATHER THAN LEFT TO BE FOUND: the
      refusal is credited to TEXT, not to STRUCTURE.** An auditor must read a
      `GATES_SITE_DOES_NOT_EXIST` as *"somebody moved the thing this points at, go and look"* and
      NEVER as *"the gating relationship has been broken"*. This instrument cannot tell those two
      facts apart and does not claim to.
    and_it_is_still_DECLARED_LIMIT_1_underneath: >
      A well-formed lie passes. `operand_origin: OWN_CONSTRUCTION` on a site whose operand is
      caller-supplied is a false claim the machine cannot see. The redraft closed the SHAPE of the
      claim, which is the whole of what a static register can close.

TWO_PLACES_THE_CONTENT_DOCUMENT_IS_WRONG_ABOUT_ITS_OWN_INSTRUMENT:
  first__the_site_register_did_NOT_already_emit_tier_2_keys_it_could_use: >
    §1.1: *"admitted only in `DECLARED_ADMISSIONS`, whose site keys the sweep already emits for
    tier-2 deciding operations as well as tier-1 admissions."* **THE SWEEP EMITS THEM; THE REGISTER
    REFUSED THEM.** At `af2accb`, `stale = set(declared_admissions) - admissions` compared the
    register against TIER-1 ONLY, so every tier-2 entry §1.1 describes as already possible would
    have been reported as `STALE DECLARATION` — a declaration for a site that does not exist. The
    redraft as literally written was **not implementable without a change to the instrument's set
    equality**, and that change is in this commit. Not a defect in the ruling; a defect in the
    document's account of what the tool already did.
  second__the_CARRIER_ONLY_field_texts_in_section_3_would_have_been_VACUOUS: 'recorded at ITEM 3, where the rows are written.'

