    **THEY DO NOT COLLAPSE. AT ALL.** `crash_detector.admission`: 33 occurrences, **33 DISTINCT
    SITE KEYS**. `crash_detector.establishment`: 17 occurrences, **17 DISTINCT SITE KEYS**. The
    price is **EXACTLY 50 ROWS**, which is the number the content document explicitly declined to
    quote — and it declined for the right reason (it had not measured) and landed on the right
    number anyway.
  where_the_collapse_actually_lives: >
    Across the whole closure, 482 tier-2 occurrences collapse to 472 distinct keys — TEN
    duplicates, and **not one of them is in either of the two modules that needed them**. They are
    in `dials.magnitude` (53->49), `dials.provenance` (68->67), `dials.reading` (50->49),
