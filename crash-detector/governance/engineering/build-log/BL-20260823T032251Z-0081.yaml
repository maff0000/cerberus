the_ruling_being_implemented_verbatim: >
  PO-DECISIONS-0014 ruling 1 — *"`UPSTREAM_OF_THE_PATH` — REJECTED AS DRAFTED, for exactly the
  reasons its own author measured: it binds the module register where its siblings bind the site
  register, and its fields are prose no machine can check. It is REDRAFTED to bind the SITE
  register with machine-checkable fields."*

what_landed:
  the_binding: >
    `WORDS_NOT_ADMITTED_IN_THE_MODULE_REGISTER` — the word is refused in
    `DECLARED_MODULE_DISPOSITIONS` (`WORD_NOT_ADMITTED_IN_MODULE_REGISTER`). **EXACTLY THE ONE WORD
    THE RULING NAMED AND NOT ONE MORE**: `DEFECT_OPEN` and `CARRIER_ONLY` remain admitted there,
    unused, because being stricter than a ruling is still departing from it.
  the_fields: >
    `EXTENDED_DISPOSITIONS["UPSTREAM_OF_THE_PATH"]` is now `("operand_origin", "gates")`. The
    drafted `decides`/`route` are GONE, not added to — an entry written against the draft now
    FAILS, and that has its own carrier.
  operand_origin: >
    Membership in `OPERAND_ORIGINS`, a CLOSED set this instrument owns — `SOURCE_DECLARATION` ·
    `MODULE_CONSTANT` · `OWN_CONSTRUCTION` · `CALLER_SUPPLIED`.
    `OPERAND_ORIGIN_NOT_IN_THE_CLOSED_SET`.
  gates: >
    A SITE KEY 4-tuple that (a) EXISTS in this run's own measured site set and (b) lies in a
    DIFFERENT module from the declaring site. `GATES_SITE_DOES_NOT_EXIST`,
    `GATES_SITE_IS_IN_THE_DECLARING_MODULE`.
  the_conditional_field: >
    `operand_origin: CALLER_SUPPLIED` REQUIRES `finding` (`CALLER_SUPPLIED_WITHOUT_A_FINDING`),
    which then resolves through ITEM 1's register or the row refuses. **AND THE RESOLUTION CHECK IS
    DELIBERATELY NOT IN THIS FUNCTION** — it is ITEM 1's `_finding_resolution_violations`, which
    reads EVERY citation in EITHER register, so `DEFECT_OPEN` and `UPSTREAM_OF_THE_PATH` cannot
    drift apart on the one field they share.
  the_site_register_now_covers_both_tiers: >
    `DECLARED_ADMISSIONS` may carry tier-2 keys. STALE is measured against ALL site keys rather
    than tier-1 only — otherwise every tier-2 entry the derivation needs would be reported as a
    declaration for a site that does not exist. **Set equality still holds in both directions; the
    set it holds over got bigger.**
  the_derivation: >
    A module with no `DECLARED_MODULE_DISPOSITIONS` entry is DECLARED iff its distinct tier-2 site
    key set is NON-EMPTY and is a subset of the site register. The non-empty guard is load-bearing
    and is not defensive coding: a module with no tier-2 sites would otherwise be derived
    VACUOUSLY, and **a derivation satisfied by an empty set is a default wearing a computation's
    name.**
  the_carrier: 'tests/test_upstream_of_the_path.py — 19 tests, every check with a refusing arm AND a passing arm.'

THE_PRICE__MEASURED_BEFORE_A_SINGLE_ROW_WAS_WRITTEN:
