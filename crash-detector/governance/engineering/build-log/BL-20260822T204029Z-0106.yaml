action_summary: >
  *** **THE FOURTH GATE HAS RETURNED. CD-ASR-WO2R3-01 RENDERS **AMBER** ON WO-2R3 AT `531c95c`, WITH
  **CD-AC-002 AMBER — NOT CLOSED** AND **CD-AC-005 AMBER — NOT CLOSED, AND WEAKER THAN CD-AC-002**.
  THE VERDICT IS BANKED VERBATIM AND UNEDITED AND IS **NOT** ACCEPTED, GRADED, ARGUED OR NEGOTIATED
  BY THIS SEAT (PBG-AUTH-003, PBG-AUTH-006). IT GOES TO THE PRODUCT OWNER.** ***
  *** **THE SEAT WAS ASKED FOR A ROUTE NOBODY HAD WRITTEN DOWN RATHER THAN A CONFIRMATION. IT
  RETURNED FOUR, AND IT BROKE THE CLAIM THE PROJECT LEAD HAD JUST FINISHED RECONCILING.** ***
  **F-A2 IS THE ONE THAT DECIDES THE GATE, AND THE PROJECT LEAD RE-MEASURED IT INDEPENDENTLY RATHER
  THAN TAKE IT.** A fielded public frozen judgement-path-shaped type placed in
  `src/crash_detector/judging/` instead of `src/crash_detector/engine/` — **PL-MEASURED: POPULATION
  UNCHANGED AT 33, CONSTRUCTOR CHECK EXIT 0 "PASS — 97 assertions", DOORS EXIT 0, and at runtime
  `Verdict(score=object(), breached='maybe')` ACCEPTED.** **V43 — THE ONLY EVIDENCE FOR THE WIDENED
  CLASS, THE CONTRAST THIS SEAT RAN IN BOTH ARMS TWO BOUNDARIES AGO AND CALLED DECISIVE — IS AN
  ARTEFACT OF *WHERE* THE TYPE WAS PUT, NOT OF *WHAT IT IS*.** The widening moved the LOCUS axis,
  which was already safe; the REACH axis, which is where the narrowness lives, did not move.
  **THE SECOND RE-MEASUREMENT IS A FIVE-INCREMENT CORRECTION TO THE RECORD.** T6,
  GRANT-MATRIX-LIVE — "the one plant nobody has bitten with" — **WAS BITEABLE ALL ALONG.**
  PL-CONFIRMED: the refusal fires at `check_grant_matrix_live.py:726-735`, and `import psycopg2` is at
  **line 738**, AFTER it. `psycopg2` is importable on this host (2.9.11) and **ZERO `CD_CHECK_STORE_*`
  VARIABLES ARE SET.** Every recorded "exit 3 on both arms" across increments 2, 2b, 3, 4 and 5 was
  the check refusing an unsupplied configuration. **A PLANT GUARDING CD-AC-003 — THE ONE PASS IN THE
  THIRD GATE — SAT UNBITTEN FOR FIVE INCREMENTS AND THREE AUDITORS BEHIND AN UNSET ENVIRONMENT
  VARIABLE, AND THE SEAT BIT IT AGAINST A LIVE POSTGRESQL 16.14 CATALOGUE WITH THE NINE-VIOLATION
  SIGNATURE REPRODUCED LINE FOR LINE.**
  *** **AND A DELEGATED MEASUREMENT OF THE SEAT'S OWN — THE DEEP ATTACK ON T2, CD-BP-003 — RETURNED
  *AFTER* THE SEAT CLOSED ITS VERDICT, FILLING EXACTLY THE HOLE THE SEAT HAD DECLARED. IT REPORTS
  FOUR ESCAPES ON THE ADAPTER BOUNDARY AND REFUTES A WRITTEN CLAIM IN `required-tests.yaml`. IT IS
  BANKED SEPARATELY, VERBATIM, AND IT IS **UNGRADED BY ANY COMPETENT PARTY** (CD-D-143).** ***

