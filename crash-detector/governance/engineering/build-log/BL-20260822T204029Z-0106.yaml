the_late_returning_delegated_measurement:
  what_happened: >
    A measurement CD-ASR-WO2R3-01 delegated under its own dispatch — the deep attack on T2, the
    adapter boundary — RETURNED AFTER THE SEAT HAD CLOSED ITS VERDICT. The seat had already declared
    the hole in terms: "A deeper adapter attack was delegated and had not returned when I closed the
    verdict — stated as a measured limit, not a silent omission."
  what_it_reports: >
    FOUR ESCAPES on CD-BP-003, the surface the Product Owner named as the softest. **ESCAPE 1: THE
    STORED PAYLOAD IS NOT THE VALIDATED PAYLOAD** — `is_empty` is foreign code handed a live reference
    to the payload BETWEEN validation (`runner.py:670`) and storage (`runner.py:728`), and a live
    Python module object was landed in a governed `OK.payload` and in the recorded row, under the
    SHIPPED validator and the STRICTEST declarable schema. **IT REFUTES A WRITTEN CLAIM** —
    `required-tests.yaml:1200` bounds the hostile adapter by "a payload that passes the declared
    schema". **ESCAPE 2: the four Protocol parameters are an in-process code-execution channel**, so
    the distinction the project relies on TWICE — "a caller supplies a value" vs "code executes inside
    the package" — does not exist at this door. **ESCAPE 3: a hostile sink makes the reading key claim
    a period no row records.** **ESCAPE 4: two of three new ESTABLISHED_HERE exemptions are invisible
    to BOTH named carriers**, and an undecorated public door one class-nesting level down passes the
    doors instrument.
  and_it_traced_the_containment_rather_than_asserting_it: >
    The hostile payload reaches `engine/mapping.py` INTACT — NaN, inf and a live object survive — and
    stops at `MappingKind.UNSPECIFIED` raising. **THE CONTAINMENT IS THE EMPTY MAPPING ENUM, NOT ANY
    GUARD ON PAYLOAD**, and the counterfactual is the product roadmap: the first computing
    `MappingKind` member lands that payload in the arithmetic.
  how_it_was_handled_and_why: 'CD-D-143.'

decisions_ruled_here:
- id: CD-D-143
  title: 'The late-returning T2 measurement is banked SEPARATELY and verbatim, and is UNGRADED. The
    verdict is NOT edited to take account of it.'
  ruling: >
    Recorded at `governance/assurance/WO-2R3/ADDENDUM-T2-ADAPTER-BOUNDARY.md` with its provenance,
    its arrival-after-close stated at the top, and an explicit statement that NEITHER the Assurance
    seat (verdict closed before it landed) NOR the Project Lead (PBG-AUTH-006 — writes no assurance)
    has graded it. `VERDICT.md` is untouched.
  why: >
    **FOLDING LATE EVIDENCE INTO A CLOSED VERDICT WOULD MAKE THE RECORD SAY THE AUDITOR WEIGHED
    SOMETHING IT NEVER SAW.** That is the same falsification as editing a Build Log entry
    (PBG-CONT-003) and it would be undetectable afterwards. The verdict stands as written; the
    addendum stands beside it; both go up.
  and_the_direction_is_stated_so_nobody_has_to_infer_it: >
    Every item in the addendum, if it survives grading, makes the gate HARDER. **IT CANNOT BE READ AS
    A SOFTENING OF THE AMBER**, and the addendum says so on its face.
  what_is_owed_next_and_by_whom: >
    **THE ONLY PARTY COMPETENT TO GRADE IT IS THE ASSURANCE SEAT**, and it is being given its own
    evidence back for that purpose — not to reconsider its verdict on anything else and not under any
    suggestion of what the answer should be. If it declines, or cannot, the addendum goes to the
    Product Owner ungraded and labelled ungraded.

findings_raised_by_the_project_lead_at_this_boundary:
- id: CD-PL-F94
  severity: HIGH
  title: >
    **THE PROJECT LEAD RECONCILED A CONTRAST AS PROOF OF A CLASS CLOSURE WHEN IT WAS ONLY PROOF OF A
    CODE-PATH CHANGE, AND SAID SO IN ITS OWN WORDS ONE BOUNDARY BEFORE THE AUDITOR BROKE IT.**
  what: >
    At BL-20260822T200128Z-0104 this seat ran V43 in both arms, confirmed EXIT 0 / ADJACENT at
    `46adf33` and EXIT 1 / VIOLATION at `531c95c`, and wrote: **"THE WIDENING IS IN THE CODE PATH AND
    NOT IN THE HEADER TEXT, and that sentence is now a measurement rather than a hope."** The
    auditor's F-A2 shows the identical type is invisible one package away. **THE CONTRAST PROVED THE
    CODE PATH CHANGED. IT PROVED NOTHING ABOUT WHETHER THE CLASS CLOSED, AND THIS SEAT DID NOT
    DISTINGUISH THE TWO.**
  direction_of_error: >
    **OVERSTATEMENT OF WHAT A SINGLE CONTRAST ESTABLISHES.** V43 placed its type in
    `src/crash_detector/engine/` — inside RULE A's spelled package vocabulary — so it tested the axis
    the ruling MOVED and never touched the axis where the narrowness lives.
  why_it_is_HIGH_and_not_MEDIUM: >
    This seat designed CD-D-138 specifically because it had measured that no standing instrument
    could distinguish a real closure from a docstring edit, and it made the contrast the sole
    deliverable of an entire dispatch. **IT THEN ACCEPTED A CONTRAST THAT COULD NOT DISTINGUISH A
    CLASS CLOSURE FROM A PACKAGE-LOCAL ONE — AND THE EXECUTABLE EXAMPLE IT INHERITED FROM DECLARED
    LIMIT 1 CHOSE THE PACKAGE FOR IT.** The seat took the example's placement as given and never
    asked what the placement was doing. **A CONTRAST IS ONLY AS CLOSED AS THE SPACE IT SAMPLES, AND
    THIS SEAT SAMPLED ONE POINT AND REPORTED A CLASS.**
  what_would_have_caught_it: >
    Running V43 a second time with the type moved one package sideways. **IT IS A SINGLE COMMAND AND
    THIS SEAT DID NOT RUN IT.** The auditor did, on the first pass, because the dispatch asked it in
    terms whether a fielded type could be placed where no rule reached it — **A QUESTION THIS SEAT
    WROTE INTO THE BRIEF AND DID NOT PUT TO ITSELF.**
  disposition: >
    RAISED AGAINST THIS SEAT. It corrects BL-20260822T200128Z-0104 BY SUPERSESSION, never by edit
    (PBG-CONT-003). The reconciliation of the bounded completion STANDS as to what it measured — the
    completion did execute ruling 1 in the code path — and is CORRECTED as to what that measurement
    proved.
- id: CD-PL-F95
  severity: MEDIUM
  title: >
    **`governance/engineering/ACTIVE_WORK.yaml` IS NOT THE FILE THIS SEAT HAS BEEN MAINTAINING, ON
    THE LANE — AND THE DOCUMENTED MANUAL BOOT PATH READS THE STALE ONE.** RAISED BY THE AUDITOR
    UNPROMPTED AND ON NOBODY'S LIST; RECORDED HERE AS THIS SEAT'S TO OWN.
  what: >
    The auditor reports that on **both branches** the lane's `ACTIVE_WORK.yaml` was last modified at
    `bf8fcf9` (2026-08-19), still reads `current_work: CD-WO-002`, and still carries
    `continuity_record_commit: PENDING`. `pbg boot` does not depend on it, so tooling-assisted boot is
    unaffected — **BUT `CLAUDE.md` DOCUMENTS A MANUAL BOOT FALLBACK THAT READS IT BY NAME**, and a
    seat taking that documented path resumes against a work order three revisions stale.
  why_this_seat_takes_it_rather_than_dismissing_it: >
    **THE PROJECT IS REQUIRED TO SURVIVE ITS TOOLING BEING UNAVAILABLE — CLAUDE.md SAYS SO AND
    PBG-CONT-007 IS THE REASON.** A continuity record is not excused by a tool that happens not to
    read it. The auditor was told the lane boot RED was disclosed-not-ruled-harmless and was invited
    to disagree; **IT DISAGREED, WITH A REASON, AND IT IS RIGHT.**
  disposition: >
    RAISED, NOT REMEDIED HERE. Repairing a continuity record inside a gate boundary, on a branch
    under audit, at the moment a verdict lands, is the kind of convenient tidying this project's
    scope rules exist to prevent. It is recorded for the Product Owner with the rest.

