CD_PL_F100_RAISED_AGAINST_THE_PROJECT_LEADS_OWN_DISPATCH_INSTRUMENT:
  the_defect: >
    **THE FINGERPRINT RECIPE THIS SEAT PUT IN THE DISPATCH INCLUDES GITIGNORED FILES.**
    `find . -path ./.git -prune -o -type f -print | … | sha256sum` sweeps `.pytest_cache/`, which is
    created by running `pytest` — **WHICH THE DISPATCH ORDERS THE SEAT TO DO.**
  PL_MEASURED_AT_THIS_BOUNDARY: >
    Recipe as written -> `24d66d0ef56634d973011e8793d208e92fc560ecf85473ca969786318a333c9c`.
    The same recipe with `-path ./.pytest_cache -prune` added ->
    **`50b356ac2de1a404b75a6fb9e478fe5d4141c4fdc6ad34ddfbfcd4a5a92ee7b9`, AN EXACT MATCH TO THE VALUE
    IN THE DISPATCH.** `git status --porcelain --ignored` shows the sole entry `!! .pytest_cache/`.
  why_it_matters_and_it_is_not_cosmetic: >
    The dispatch tells the seat that a moved fingerprint means **"something mutated under you and your
    verdict is about a tree that no longer exists."** **SO THE INSTRUMENT FIRES ITS MAXIMUM-SEVERITY
    ALARM AT AN AUDITOR FOR OBEYING THE DISPATCH.** An honest seat then spends budget disproving its
    own alarm; a less careful one could read the alarm as licence to discard its own verdict, or
    quietly clean the directory and re-take a number that passes. **A CONTROL THAT CRIES WOLF AT
    CORRECT BEHAVIOUR TEACHES SEATS TO IGNORE IT.**
  severity_and_ownership: >
    MEDIUM. **IT IS THIS SEAT'S DEFECT, IN THIS SEAT'S OWN INSTRUMENT, FOUND BY THE AUDITOR IT WAS
    POINTED AT.** Fifth named Project Lead method defect (CD-PL-F86, F94, F98, F99, F100) and **THE
    LIST IS STILL NOT CLAIMED COMPLETE** — the last time this seat implied a pattern was bounded, the
    fourth seat counted nine.
  NOT_fixed_here: >
    The dispatch is NOT edited. It is a landed authority record and CD-D-148 already ruled it carries
    unchanged. The correction belongs in the NEXT dispatch that uses the recipe, and it is written down
    here so that dispatch cannot be drafted without meeting it.

