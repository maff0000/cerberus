the_four_load_bearing_claims_the_PROJECT_LEAD_RE_MEASURED_ITSELF:
  the_method_and_why_it_is_stated_first: >
    **CD-PL-F98 SAYS THIS SEAT ONCE RAN TWO ARMS THAT BOTH IMPORTED THE SAME TREE AND PRINTED
    IDENTICAL OUTPUT.** So: two pristine extractions (`git archive 9f7b764 | tar -x`), each arm running
    **ITS OWN TREE'S COPY** of every instrument, and **THE `tree:` PROVENANCE LINE READ AND RECORDED ON
    EVERY RUNTIME RUN** — printed below, and the two paths ARE DIFFERENT, which is the check F98 exists
    to force.
  claim_1_the_rename_test_CONFIRMED_AND_IT_IS_THE_WHOLE_OF_CD_D_146: >
    The variant differs from the base by **TWO LINES** — `def guarded(` -> `def _guarded(` and
    `return guarded` -> `return _guarded`, confirmed by `diff` against `git show 9f7b764:` and by
    nothing else. **BASE ARM: `check_judgement_path_doors.py --root .` EXIT 1, "FAIL — 1 violation(s)",
    the violation being `evaluate.py:341 — guarded is a public entry point…`. VARIANT ARM: EXIT 0,
    "PASS — 54 assertions, 0 violations".** Suite: **BASE 2 failed, 1549 passed · VARIANT 1551 passed,
    0 failed.** Runtime, read from each tree's own import with its `tree:` line printed
    (`/tmp/cd-pl-rename-base/src/…` vs `/tmp/cd-pl-rename-var/src/…`, DIFFERENT PATHS):
    `__name__` `_evaluate_dial` in BOTH, `__qualname__` `_evaluate_dial` in BOTH, `inspect.signature`
    **CHARACTER-IDENTICAL** in both. **RENAMING ONE FUNCTION-LOCAL BINDING CHANGES NOTHING A CALLER CAN
    OBSERVE AND TAKES THE INSTRUMENT FROM FAIL TO PASS.** The dispatch's own evidence standard says:
    *"For any refusal credited to a STRUCTURE: does it survive renaming one identifier? If it depends
    on a NAME, it is a vocabulary guard wearing a structural label."* **THE PROJECT'S OWN TEST,
    APPLIED TO THE PROJECT'S OWN VIOLATION, ANSWERS IT.**
  claim_2_the_route_nobody_had_written_down_CONFIRMED_AT_THE_TARGET: >
    **`hasattr(_evaluate_dial, "__wrapped__")` IS `True` AT `9f7b764`**, PL-measured in both arms.
    The contrast that makes it a defect rather than a design is in the tree and is unambiguous:
    `admission.py:766` **`delattr(door, "__wrapped__")`** and `establishment.py:506`
    **`delattr(__init__, "__wrapped__")`**, each with a comment naming it a bypass — and
    `admission.py:222` declaring **"(b) THE `__wrapped__` ATTRIBUTE — THIS HALF IS CLOSED HERE."**
    **SO THE PROJECT DELETES THIS EXACT ATTRIBUTE ON TWO DECORATORS AS A BYPASS AND LEAVES IT LIVE ON
    THE THIRD.** And `tests/test_evaluate.py:692` reads
    `assert hasattr(evaluate_module._evaluate_dial, "__wrapped__")` — **A SHIPPED TEST REQUIRING THE
    BYPASS ATTRIBUTE TO BE PRESENT**, exactly as the seat reported. **THE ONLY THING HOLDING THE HOLE
    OPEN IS A TEST THAT WOULD FAIL IF IT WERE CLOSED.**
  claim_3_the_understated_residue_CONFIRMED: >
    The remediation declares its residual reach limits are **EXACTLY TWO**. In
    `check_judgement_path_doors.py` the widened traversal is `ast.walk(tree)` at **line 522** — and
    **`for node in tree.body:` IS STILL THERE AT LINE 533, TWELVE LINES BELOW IT.** A top-level-only
