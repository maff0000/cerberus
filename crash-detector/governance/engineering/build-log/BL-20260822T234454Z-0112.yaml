    AN UNDERSTATED RESIDUE IS THIS PROJECT'S MOST-FOUND DEFECT.**
  claim_4_the_arity_open_tension_CONFIRMED_AND_IT_REACHES_THE_MECHANISM_ITSELF: >
    `admission.py:720` reads **`def door(*args, **kwargs):`** — **THE DOOR FACTORY OF `@admits` IS
