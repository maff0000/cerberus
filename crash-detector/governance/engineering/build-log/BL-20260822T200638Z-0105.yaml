    Telling an auditor about a known ambiguity AFTER it trips on it is handing it a trap and calling
    the result a finding. Every item below is in the dispatch ahead of the audit work.
  CD_PL_F89: >
    THIRTEEN landed build-log sequence collisions, 0041-0053, no gaps, between main and the lane —
    disclosed with the explanation that the fourth seat is THE ONE PARTY THAT READS BOTH DIRECTORIES
    and is therefore the party the ambiguity is charged to, and with the disambiguation rule (full
    timestamped entry_id PLUS branch). Nothing renumbered, nothing edited.
  CD_PL_F93: >
    The Project Lead's own dispatch defect, in the opening block AND in the disclosures.
  the_pattern_named_as_a_pattern_rather_than_four_incidents: >
    CD-D-114, CD-PL-F89, CD-D-134, CD-PL-F93 — four consecutive boundaries, all three parties, one
    defect shape: a control scoped narrower than the class it names. The seat is told to **assume it
    is present in something it is about to read and has not yet been found.**
  CD_ENG_WO2R3_F22: >
    The fifth stale copy at plants/MANIFEST.md:1148-1149, left in place by CD-D-139, disclosed as a
    known-stale line and NOT offered as clean.
  the_lane_boot_RED: >
    CONTINUITY_REFERENCE_INVALID inside a lane worktree — disclosed so the seat does not spend budget
    on it, and explicitly marked DISCLOSED RATHER THAN RULED HARMLESS, with the seat free to disagree.

what_the_project_lead_declared_UNVERIFIED_to_the_auditor:
  why_this_block_exists: >
    An auditor that inherits a record without its holes marked will treat the holes as covered
    ground. Five are named in the dispatch, and the fourth is the one that matters most.
  the_five:
  - 'THE ELEVEN PLANTS APPLY at 531c95c (11/11, PL-measured) and were NOT RE-CONTRASTED AT THEIR
     NAMED LAYERS. The CD-ENG-WO2R3-F12 standard is UNMET by this record and is said to be.'
  - 'THE WO-2R3 VARIANT CORPUS (28 patches) was NOT re-run by the Project Lead at the target. The
     Engineer''s 108/4 figure is THE IMPLEMENTER''S MEASUREMENT AND NOT AN INDEPENDENT ONE.'
  - 'THE THREE variants/WO-2R ROUTES have NEVER been re-tested against the new structure BY ANYONE —
     including V03, a CONSTRUCTOR route written by an earlier auditor BEFORE the constructor
     mechanism existed.'
  - '**NO RUNTIME CONSTRUCTION OF ANY GOVERNED TYPE WAS PERFORMED BY THE PROJECT LEAD AT THIS
     BOUNDARY.** Every PL measurement in the reconciliation record is a static run, a git audit or a
     test-suite invocation. **THE RUNTIME CLOSURE HAS NOT BEEN INDEPENDENTLY EXERCISED BY ANYONE AT
     531c95c** — which is precisely what ruling 3(iv) sent this seat to do, and the record now says
     so in the same document rather than leaving the seat to infer it.'
  - 'THE PROJECT LEAD HAS NEVER GRADED CD-AC-002 OR CD-AC-005 AND IS FORBIDDEN TO. No prior
     reconciliation contains a grading the seat can lean on, and the absence is BY DESIGN.'

