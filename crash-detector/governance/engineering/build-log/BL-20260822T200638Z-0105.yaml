decisions_ruled_here:
- id: CD-D-141
  title: 'The fourth Assurance seat is dispatched at 531c95c over the WHOLE of WO-2R3, not over the
    completion alone.'
  ruling: >
    target_scope is f30e63c..531c95c — increments 1 through 5 AND the bounded completion. The seat
    grades CD-AC-002 and CD-AC-005 and nothing narrower.
  why: >
    PO-DECISIONS-0010 ruling 5 reserves that grading to this seat and to the Product Owner, and the
    criteria are about WO-2R3 as a structure. An audit scoped to the last commit would grade the
    completion and leave the work order ungraded for an eighth boundary.
- id: CD-D-142
  title: 'The dispatch states two clauses the ruling did not, and flags them AS ADDITIONS.'
  ruling: >
    "A declaration is not a disposition and it is not an excuse", and "an exit 0 is not a pass
    either", are carried in the brief and are MARKED IN THIS ENTRY as the Project Lead's additions
    rather than the Product Owner's words.
  why: >
    Clause (ii) protects the record from a RED-on-sight. Nothing in the ruling protected it from a
    GREEN-on-sight, and on this project EVERY ESCAPE ON RECORD PASSED STATIC CHECKERS — the failure
    mode the brief's own first sentence is about.
  and_why_it_is_flagged_rather_than_folded_in: >
    A Project Lead that adds to a Product Owner's mandatory clauses without saying so has softened or
    hardened a ruling by stealth. These are additions; they are visible as additions; and the Product
    Owner can strike them.

