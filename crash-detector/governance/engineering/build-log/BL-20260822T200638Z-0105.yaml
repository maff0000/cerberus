next_safe_action: >
  *** **RUN THE FOURTH ASSURANCE SEAT, THEN STOP AT ITS GATE VERDICT. THAT IS THE WHOLE OF THE NEXT
  ACTION AND NOTHING ELSE IS AUTHORISED BEFORE IT.** ***
  When CD-ASR-WO2R3-01 returns: reconcile its return as a RECORD (durable evidence under
  governance/assurance/WO-2R3/, PBG-CONT-007 — a sub-agent result that exists only in conversation is
  not project state), **DO NOT ARGUE THE VERDICT DOWN AND DO NOT NEGOTIATE IT** (PBG-AUTH-003:
  a PASS is not an acceptance and neither is a RED; disposition is the Product Owner's). If the
  verdict contradicts the reconciliation record, **THE RECORD IS WHAT GETS CORRECTED.**
  **THEN, AND ONLY THEN, IN THIS ORDER:** (1) write the ELEVEN CLASS-2 SWEEP DISPOSITIONS (CD-D-130
  — author is this role, trigger is the seat's return, reconciler is the Product Owner); (2) put the
  seat's verdict and the gate to the PRODUCT OWNER for disposition, with CD-AC-002 and CD-AC-005
  ungraded by this seat and graded by the auditor.
  **DO NOT** merge or promote the lane or f30e63c. **DO NOT** admit anything (CD-RULE-001, PO-set,
  non-relaxable). **DO NOT** open a sixth increment on the CD-D-136 residues — CD-D-136 forbids it
  and it would repeat the pattern PO-DECISIONS-0009 ruling 1 rejected, the implementer answering
  before the auditor asks. **DO NOT** modify anything under pbg/.
  **STANDING AND UNCHANGED:** WO-2R3 is NOT accepted as closing CD-AC-002 or CD-AC-005
  (PO-DECISIONS-0010 ruling 5). CD-PL-F84..F93 remain open. CD-ENG-WO2R3-F10, F13, F16, F18, F19,
  F22, F23, F24, F25 remain open. IMP-022 is the framework's and not this project's.

