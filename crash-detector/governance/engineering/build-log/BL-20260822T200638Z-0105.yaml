action_summary: >
  *** **THE FOURTH FRESH ASSURANCE SEAT IS DISPATCHED. CD-DISPATCH-WO2R3-ASSURANCE IS ISSUED to
  CD-ASR-WO2R3-01 over THE WHOLE OF WO-2R3 at target `531c95c`, under PO-DECISIONS-0010 ruling 3.
  ITS CONDITION — that the bounded completion bank first — WAS MET AT THE PRECEDING BOUNDARY AND NOT
  ASSUMED.** ***
  *** **THE PRODUCT OWNER FIXED THE ORDER OF THIS BRIEF AND NOT ONLY ITS CONTENTS, AND THE ORDER IS
  OBEYED: THE FIRST WORDS THE SEAT READS ARE THE ENGINEER'S OWN SENTENCE AGAINST ITSELF.** ***
  "WITH V17 APPLIED, BOTH STATIC CHECKS STILL EXIT 0. THE CLOSURE IS A RUNTIME CLOSURE AND A GREEN
  STATIC RUN IS NOT EVIDENCE OF IT. THE FOURTH SEAT ATTACKS THE RUNTIME CLOSURE AS RUNTIME." It sits
  above the targets, above the clauses and above the evidence, before the seat's own boot — because
  ruling 3(iv) put it there and the position IS the instruction. **AND IT IS NOW DOUBLY EARNED:** the
  same seat volunteered the same limit a SECOND time, unprompted, about the completion it had just
  delivered — the V43 contrast is ENTIRELY STATIC and `Verdict` would still be constructible at
  runtime in the failing arm. **TWICE THE IMPLEMENTER HAS SAID WHERE ITS OWN EVIDENCE STOPS. THE
  BRIEF TELLS THE SEAT THAT IS A MAP OF WHERE TO DIG AND NOT A REASON TO TRUST IT.**
  THE BRIEF CARRIES, IN FULL AND UNSOFTENED: CD-D-129's THREE MANDATORY CLAUSES — the exiting
  instrument's declaration VERBATIM with its bisect extended to the target, the rule that verdicts
  are taken against DECLARATIONS and never exit codes alone (with its mirror stated, that AN EXIT 0
  IS NOT A PASS EITHER), and the standing invitations including the dispositions-after sequencing;
  **ELEVEN NAMED TARGETS** — the ten of CD-D-129 plus the widened invariant as T11; and the
  disclosures a seat must have BEFORE it reads the record rather than after it trips on them.
  *** **THE PROJECT LEAD DISCLOSED ITS OWN DEFECT TO THE AUDITOR BEFORE THE AUDITOR READS ANYTHING.**
  *** CD-PL-F93 is written into the dispatch's opening block and again into its disclosures: the
  Project Lead's own last dispatch contradicted itself on the membership rule, the narrower reading
  would have shipped a class narrower than the Product Owner ruled — GREEN, with the contrast still
  passing — and only the Engineer's reading of the ruling behind the dispatch prevented it. The seat
  is told, in terms, that "the record you are auditing was assembled by a seat that has been wrong at
  four consecutive boundaries in the same direction."

what_ruling_3_ordered_and_where_each_clause_landed:
  clause_iv_the_volunteered_sentence_FIRST:
    ordered: 'PO-DECISIONS-0010 ruling 3(iv) — "THE SENTENCE THE SEAT VOLUNTEERED AGAINST ITSELF,
      first in the brief."'
    landed: >
      The opening block of the dispatch, ABOVE `dispatch_id`, above the role assignment, above the
      target — the first prose in the file, with an instruction to read it BEFORE booting. The
      mechanism is spelled out beside it so the seat can act on it rather than merely believe it:
      V17 removes a BODY; neither register check reads bodies for its verdict; therefore both exit 0
      with V17 applied and **a seat that verifies increment 5 by running the two register checks has
      verified nothing about it.**
  clause_i_the_three_binding_clauses:
    landed: >
      `the_exiting_instrument_declared_up_front` (the sweep, its declared state PL-measured at the
      TARGET as 534 sites / 15 violations over a 19-module closure with 20 modules printed as outside
      it, the ELEVEN original items all in `crash_detector.admission`, the FOUR later ones in
      `crash_detector.establishment` named as NOT among the eleven, and the bisect extended
      f30e63c -> 531c95c), `verdicts_are_taken_against_declarations_never_against_exit_codes_alone`,
      and `standing_invitations_to_attack`.
    what_the_project_lead_added_and_flags_as_its_own_addition: >
      TWO sentences that are not in the ruling. **(1) "A DECLARATION IS NOT A DISPOSITION AND IT IS
      NOT AN EXCUSE"** — with an explicit invitation to find that the declaration is being used to
      park a real defect. **(2) THE MIRROR OF CLAUSE (ii): "AN EXIT 0 IS NOT A PASS EITHER."** The
      ruling protects the record from a RED-on-sight; nothing in it protected the record from a
      GREEN-on-sight, and on this project every escape on record passed static checkers. Both are
      flagged here as ADDITIONS so the Product Owner can strike them if they overreach.
  clause_ii_the_named_target_list:
    landed: >
      `named_targets` T1-T11, each with what it is and why it bites. The four the ruling named
      explicitly are carried with their sharpening intact: **T2 CD-BP-003** as the softest surface,
      with the seat told to spend its FIRST HOUR there and told which of the three ESTABLISHED_HERE
      exemptions sits on it; **T9 CD-ENG-WO2R3-F15 AIMED AT THE BLINDNESS WINDOW AND NOT THE GUARD**,
      with the question restated as "what else could survive two reconciliations?"; **T6
      GRANT-MATRIX-LIVE — BITE IT OR STATE MEASURED LIMITS**, with the reason it matters (it exits 3
      on both arms, produces no contrast, and guards CD-AC-003, THE ONE PASS IN THE THIRD GATE) and
      the explicit statement that an unexamined 3 is not an acceptable return; and **T10
      CD-ENG-WO2R3-F10**, still undischarged. The eleven Class-2 items are T5 and T8.
  clause_iii_the_widened_invariant_as_an_attackable_claim:
    landed: >
      T11 and its own section, carrying the ruling VERBATIM, the Product Owner's stated reason for
      not routing it through assurance first, the single contrast that is its whole evidence WITH
      BOTH ARMS QUOTED, and its exact limit in the Engineer's own words. **CD-ENG-WO2R3-F24 TRAVELS
      AS THE ENGINEER FRAMED IT, WITH THE PROJECT LEAD'S RULING ATTACHED AND EXPLICITLY NOT
      SUBSTITUTED FOR IT**, marked as "two implementers agreeing, which is worth less than one
      auditor disagreeing." Four questions are put to the seat that are answered NOWHERE in the
      record — including whether a fielded frozen type can be placed where NO reach rule finds it.
  ruling_4_and_the_CD_D_136_residues:
    landed: >
      CD-PL-F90 is disclosed as the LIVE INSTANCE of the CD-ENG-WO2R3-F12 standard (both V39 arms
      refuse under different rules; the record named one; direction UNDERSTATEMENT). All four
      CD-D-136 residues travel with their executable examples, with residue (2) marked CLOSED at this
      boundary by CD-D-134 and pointed at T11 as the thing to attack.

