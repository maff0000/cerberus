risks:
  - "F1 MATERIAL, NOT URGENT. Both contracts still pin const 1.1.0. The narrowing means a document tagged 1.1.0 that validated at 53f639a (UNKNOWN+calm) does NOT validate at the tip. The schema_version description's own first clause — 'A consumer that reads this document knows exactly which allowlist it was validated against' — is now FALSE for 1.1.0, because two different allowlists answer to that one string. The Project Lead's letter-of-the-rule argument is CORRECT: the written rule says 'widening the allowlist without bumping', and this is a narrowing. But I attacked the second limb as instructed and it is weaker than the first. THINGS THAT PIN, RECORD OR ASSERT 1.1.0 DO EXIST: ENVELOPE_SCHEMA_VERSION at src/crash_detector/publication/envelope_contract.py:103; tests/test_envelope_contracts.py:318 test_the_declared_schema_version_matches_the_python_constant, which ASSERTS the pin; tests/publication_fakes.py:214, which STAMPS it onto every fixture; and db/migrations/0005_publication.sql, which declares a schema_version column with a CHECK tying it to envelope ->> 'schema_version'. NONE of them BREAKS, because all of them consume the STRING and not the SEMANTICS. So the honest statement is not 'a consumer breaks today' — it is that the version string has LOST ITS DISCRIMINATING POWER, silently, and that is expensive to detect later and cheap to fix now. I do not rule on it; it is a Product Authority call."
  - "F2 THE NARROWING IS GUARDED ONLY BY tests/. MEASURED, not argued: I reverted both $refs to #/$defs/detail_level on a copy (asserting the anchor before replacing it) and ran tools/register/check_schema_closed.py — PASS, 266 assertions, 0 violations, exit 0. The register-wired instrument for CD-RT-002-SCHEMA-CLOSED is BLIND to the fix. grep for absent_data_detail_level across tools/ returns nothing. The test suite DOES catch the revert (9 failed, 43 passed in tests/test_detail_level.py, including test_missing_data_never_renders_as_calm_THROUGH_THE_LIVE_GATE), so the guard can now see its own remedy — that part of the fix is real. But when the register eventually admits a run, the constitutional narrowing will not be among the things it certifies."
  - "F3 THE PARENT IS STILL WIDE. $defs/dial_reading.properties.detail_level still $refs #/$defs/detail_level on BOTH surfaces. Harmless TODAY only because JSON Schema applies the parent properties AND the matched oneOf branch, so the effective vocabulary is the intersection. If a future edit loosened or dropped the oneOf, the narrowing would vanish with no line of the fix changing. The guarantee is currently an emergent property of two places agreeing, and it is not locally visible at the parent."
  - "F4 NO SQL BACKSTOP, AND THE ASYMMETRY IS THE POINT. db/migrations/0005_publication.sql closes only the TOP-LEVEL envelope keys; grep for detail_level across db/ returns NOTHING. Nothing in the database inspects the inside of equity_crash/monetary_debasement. CD-AC-001's sibling guarantee (UNKNOWN carries no score) IS held twice — schema AND 0004_dial_history.sql. PID 3.2 is held ONCE. cd_engine holds GRANT INSERT on publication.public_envelope, so a direct INSERT of a calm-on-UNKNOWN document would satisfy every CHECK on that table. UNSUPPORTED as executed — there is no live PostgreSQL here — so this is read from the migration text, not from a running instance."
  - "F5 THE CORRECTED CD-AC-002 GUARD STILL MISSES EIGHT SHAPES. I lifted _two_reading_offenders verbatim and planted 14 shapes. CAUGHT: the baseline two-reading function, a method on a class, a closure, an async def. MISSED: (a) two readings named without the 'reading' substring, e.g. def level_for_both(equity, monetary) — and CD-AC-002 is about the EXISTENCE of the function, not the spelling of its parameters; (b) POSITIONAL-ONLY parameters, because node.args.posonlyargs is not summed; (c) def level_for_both(*readings, policy) — the guard's OWN blacklist contains 'readings' and *args evades it, because node.args.vararg is not summed either; (d) **kwargs, same cause; (e) a tuple/list/dict of readings as one parameter; (f) a lambda, which is ast.Lambda and not FunctionDef; (g) functools.partial. (b), (c) and (d) are one-line fixes and I recommend them. OVER-TIGHT, one case: def drift(reading, previous_reading) is flagged, yet two readings of the SAME dial across TIME is not the CD-AC-002 blend shape. The guard cannot distinguish two dials from two timestamps. NONE of this is a regression — the correction is real and closed a hole that made the guard vacuous for its own named case — and it supports CD-AC-002 remaining not-closed."
  - "F6 THE PORTABILITY CHECKER, AND CD-PL-F177 REPRODUCED EXACTLY. All three subjects re-planted at SERVICE level (cd-engine) exit 1, and for each I asserted BOTH that the mutation reached the file AND that it survived _resolve_merges into the resolved service mapping — the 'where it would bite' assertion the dispatch demanded. Control arm: the same dell path planted into the x-cd-python-service ANCHOR applied to the file, was carried by ZERO resolved services, and the checker returned PASS — 1194 assertions, 0 violations, exit 0. CD-PL-F177 is real and I reproduced it. WHAT THE CHECKER STILL MISSES, measured: a dell path in a BLOCK-FORM command: list (PASS, 0 violations); a dell path on an anchor key that NO service overrides (PASS, 0 violations); and anything outside deploy/compose.yaml — I appended ENV CD_CONTRACTS_DIR=/srv/... to deploy/Dockerfile.engine and to a deploy/entrypoints/ script and both returned PASS, 0 violations. Declared limit 1 ('IT READS ONE FILE') covers that in the letter, but its worked example is a compose OVERRIDE file; Dockerfiles and entrypoints are the likelier place a dell path actually lands and are not named. NOT a bypass: a flow-sequence command returns exit 3 PRECONDITION_NOT_MET, which is fail-closed and explicitly 'never a pass and never a skip'."
  - "F7 THE OPEN QUESTION, ANSWERED. Should a dell path in an anchor fragment every service currently overrides be REFUSED? MY OPINION: YES, and the checker should refuse it — but as a SEPARATE, differently-worded finding, not by pretending it is a live config value. Three reasons. (1) The rule the check exists to serve is cut-and-paste portability, and an unportable literal in a shared fragment is one deleted override away from being live in SIX services at once; the override is a coincidence of the current file, not a control. (2) The status quo is strictly worse than either alternative, because a PASS on a shadowed dell path is INDISTINGUISHABLE from a control that failed to fire — which is exactly how CD-PL-F177 happened to the Project Lead. (3) An anchor is authored as a DEFAULT; a default no one currently takes is still a default. AGAINST, and I record it because it is the real cost: judging unreached values means judging dead config, and the finding text must say 'shadowed today, live the moment an override is deleted' or it will be dismissed as noise by the first reader who checks and sees every service overriding it."
  - "FINDINGS AGAINST THIS DISPATCH. (i) Its 3 ordering is CORRECT and I confirmed the correction empirically rather than accepting it — see F2's measurement. I found no better ordering. (ii) It asserts 'CD-AC-002 still AMBER-not-closed, CD-AC-005 still RED'. The register does NOT distinguish those two states: it reports BOTH, and all 18 criteria, as UNDECIDABLE, every one for an unresolved negative_control.evidence_ref or execution_contract. I can verify NOT-CLOSED and NOT-PASSING; I CANNOT corroborate AMBER-versus-RED from the register, and the dispatch's phrasing imports an assurance-level judgement the named instrument cannot return. (iii) The commit-by-commit sweep it prescribes cannot see a path touched and reverted WITHIN a single commit, because such a path never appears in any --name-only output; I state the limit rather than let a clean sweep imply more than it establishes. (iv) The dispatch describes 'a superseded publish.py limit' among the changes; I measured it as DOCSTRING-ONLY and confirm no behavioural change, which is a stronger statement than the dispatch makes."

