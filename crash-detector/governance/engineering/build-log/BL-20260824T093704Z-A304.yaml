  its own blacklist word. F6 the portability checker misses block-form command values and
  unoverridden anchor keys. F7 my reasoned opinion on the anchor question the PL declined.

  EVERYTHING IN 4 VERIFIED, NOTHING ASSUMED. 2007 tests at the tip and 1990 at 53f639a91088ee42f5ba6c0d269f69782ba2a20a, both
  run by me. Register: pid.content_hash MATCHES, latest_admitted_run (null), 18 criteria, GATE
