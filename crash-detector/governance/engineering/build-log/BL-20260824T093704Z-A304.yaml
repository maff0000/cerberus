action_summary: >-
  ASSURANCE VERDICT ON INCREMENT 16A-FIX AT b9283b99f66285e8be575eb56e2d30ed52735be8 — AMBER.

  THE RED IS GENUINELY CLOSED, AND I ESTABLISHED THAT BEHAVIOURALLY BEFORE I LOOKED AT ANY
  STRUCTURE. 30-row probe through the LIVE refuse_unless_publishable, my own fixture built
  from the schema rather than from the project's fakes, over both surfaces x
  {UNKNOWN, DEGRADED, VALUE} x {calm, elevated, acute, banana, absent}: 30/30 as required.
  calm REFUSED on both missing-data branches on both surfaces; elevated and acute STILL
  ADMITTED on both; banana and absence REFUSED; and VALUE+calm STILL ADMITTED, which is the
  anti-vacuity arm that matters most — the fix does not satisfy PID 3.2 by making the
  product unpublishable. The IDENTICAL probe at 53f639a91088ee42f5ba6c0d269f69782ba2a20a reproduces CD-ASR-WO3-03's RED
  independently: exactly the four calm rows ADMITTED there and REFUSED at the tip, every
  other row unchanged. The probe is live and the change is precisely attributable.

  THE DISCLOSED TRAP WAS HANDLED: dial_reading_degraded.missing_inputs is
  allOf[source_id_list, {minItems: 1}], so my DEGRADED fixture carries a named missing
  input. I did not believe any REFUSED on its own — every refusal is paired with an
  ADMITTED row from the SAME builder differing ONLY in the detail_level string, so the
  refusal is attributable to that field and not to a malformed fixture.

  3.2 VERIFIED BY READING THE FUNCTION, NOT THE SENTENCE: detail_level.py on_degraded
  returns policy.absent_data_level, identically to on_unknown, and never reaches
  _level_for_score. DEGRADED also carries at least one named missing input by contract. The
  narrowing is correct and is not too wide.

  THE DISPATCH'S 3 ORDERING IS VINDICATED BY MEASUREMENT, NOT JUST BY ARGUMENT. I reverted
  both $refs on a copy and ran the REGISTER-WIRED structural instrument
  tools/register/check_schema_closed.py: PASS, 266 assertions, 0 violations, exit 0. A seat
  working structurally would have cleared a fully reverted tree. Behavioural-first was right.

  SEVEN FINDINGS, none of them a regression, a bypass or a scope breach, and none of them a
  defect in what 16A-FIX claims. F1 schema_version 1.1.0 now names TWO different contracts
  and the schema's own first clause is thereby false. F2 the narrowing is guarded ONLY by
