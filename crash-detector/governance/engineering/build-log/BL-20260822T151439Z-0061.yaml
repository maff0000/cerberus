action_summary: >
  INCREMENT 2 DELIVERED IN FOUR COMMITS, each committed as it was finished because seven runtime
  terminations are on this project's record and an increment that is not committed did not happen
  (PBG-CONT-007). BP-AMENDMENT-0001 §D.1 and §D.2 for A2, A3, A4 and A5 are implemented, plus
  CD-D-098's named first item, plus the static judgement-path check.
  THE MECHANISM is `crash_detector.admission.admits` — a decorator that reads a door's parameter
  list from `inspect.signature` AT DECORATION and refuses, AT THE BOUNDARY: (a) any value whose
  EXACT type is not the declared one; (b) any parameter the declaration was not told about, IN
  EITHER DIRECTION; (c) any `*args` or `**kwargs` open channel. (b) and (c) refuse EVERY CALL,
  before the arguments are bound and before the body runs. Nothing in the mechanism reads a body.
  THE DOORS are NINETEEN, enumerated from the artefact and not from a list. A2
  `evaluate(config_snapshot)` requires exactly ConfigSnapshot; A3 `evaluate(observations)` requires
  a tuple or list whose EVERY element is exactly ObservationRecord — the RECORD, not only the
  outcome; A4 `resolve_panel(row)` requires exactly PanelRow or exactly None; A5
  `present_dial(reading)` requires exactly one of the sealed Reading members, and that parameter
  carried NO ANNOTATION AT ALL through three gates. CD-D-098: `engine.mapping.compute` — the door
  increment 1 itself built, which post-dates §B's measured inventory of 44 — is decorated and IS
  enumerated by the check.
  THE ACCEPTANCE TEST is tools/register/check_judgement_path_doors.py, which WALKS THE TREE, prints
  its subject count so a vacuous pass is visible, and fails on any undecorated public entry point on
  a judgement path OR any decorated door whose declaration and signature disagree.

