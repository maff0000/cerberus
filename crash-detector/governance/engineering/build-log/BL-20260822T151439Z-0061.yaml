structural_invariants_as_landed:
  mechanism: >
    For any callable decorated with `admits`, a parameter present in its signature and absent from
    its declaration — in either direction, and including a variadic parameter — makes EVERY call to
    that callable raise UndeclaredParameter before the arguments are bound and before the body runs.
  doors: >
    Every public callable defined in src/crash_detector/engine/ or src/crash_detector/serving/, and
    every public callable anywhere under src/crash_detector/ whose return annotation names a
    judgement value type, is decorated with `admits` and its declaration names EXACTLY the
    parameters in its signature.
  no_published_bypass: >
    No ATTRIBUTE of an `admits` door resolves to the undecorated function it wraps:
    hasattr(door, "__wrapped__") is False and inspect.unwrap(door) is door.
  narrowness_is_deliberate: >
    Each is written narrowly enough to be true (CD-PL-F76). The doors invariant is a claim about TWO
    PACKAGES and ONE annotation rule: NOT about collectors/, NOT about constructors, NOT about any
    door reached by neither rule. The bypass invariant is a claim about ATTRIBUTES: the __closure__
    route is OPEN and a test asserts it open.

