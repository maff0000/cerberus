the_second_comparison_site:
  measured_by: 'grep -rn "_require_usable_window\|staleness_window_seconds" --include=*.py src/'
  sites:
  - 'src/crash_detector/serving/witness_resolver.py:113 `_require_usable_window(...)`, :121 `if age > staleness_window_seconds`'
  - 'src/crash_detector/engine/evaluate.py:128 takes the window from config_snapshot, :144 accepts it, :171 performs its OWN `if age > staleness_window_seconds`'
  why_it_matters: >
    A closure that bounds the window only in the serving resolver leaves the engine path reachable
    with the same unbounded configuration value. That is exactly the shape the dispatch's second
    invariant names — "a route into the resolver that skips the age comparison entirely" — and it
    is the difference between closing the class and closing the instance the auditor happened to
    report.
  what_was_handed_over_and_what_was_not: >
    The seat was given the class, the measured contrast and the rule it is held to. It was NOT
    given the code (PBG-AUTH-006; CD-D-038 and CD-D-045 are not relaxed because a fix looks
    small). The structural observation offered — establish the invariant where the QUANTITY IS
    ADMITTED rather than at each comparison site, since two guarded comparison sites is an
    enumeration and one place a usable window can come into existence is a closure — was offered
    explicitly AS REASONING AND NOT AS A SPECIFICATION, with the seat free to reach a better
    structure and say why. It is the same move increment 2b made going from the exit to the
    re-entry and increment 3b made closing `pending` from its own meaning.
  the_obligation_it_creates: >
    If the seat's structure covers both paths it must show that by execution on both. If it covers
    one, that is a DECLARED LIMIT under CD-RULE-004 which must name its measured carrier under
    CD-RULE-006, or say "NOT PROVED TO BE CARRIED ANYWHERE".

