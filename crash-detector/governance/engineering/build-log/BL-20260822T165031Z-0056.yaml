decisions_ruled_here:
- id: CD-D-118
  decision: >
    CD-D-115 IS CLOSED BY THE PRODUCT AUTHORITY AND CLOSED CORRECTLY. The §D.3 part 1 wording is
    corrected in the amendment by dated append; the implementation at increment 3 already satisfies
    the corrected reading; NO CODE CHANGES AND NONE IS OWED. The Project Lead's increment-3
    measurement stands unaltered: `collect`'s parameters lost `clock` and `sleep`, reintroducing
    either is refused BY THE INTERPRETER, and there is no parameter through which a caller clock,
    caller sleep or caller span can arrive. What changed is that the document in force now says what
    the code does, and the SEAT'S DISCLOSURE is what made that possible.
  rationale: >
    The Project Lead recorded CD-D-115 as OWED UPWARD AND NOT BLOCKING precisely because
    governance/blueprint/ is protected for every seat including the Project Lead. That routing was
    correct and is now vindicated: the fix required an authority this seat does not hold, and
    attempting it locally would have been a seat editing the specification its own delivery is
    measured against.
  consequence: >
    CD-ENG-WO2R3-F08 is DISCHARGED. It is removed from the owed set and retained in this entry as
    the reason the amendment reads as it now does.
- id: CD-D-119
  decision: >
    CD-D-114 IS CLOSED, AND THE CLOSURE IS WIDER THAN THE QUESTION PUT. The Project Lead asked
    whether a FIFTH type belonged inside bounds the Product Owner had set at four. The answer
    re-based the bounds themselves: INCREMENT 5'S SCOPE IS THE CLASS — every public type in the
    frozen subject on a judgement path whose field establishment is BODY-BORNE — ENUMERATED BY AN
    INSTRUMENT AT INCREMENT-5 START, with the instrument's COMMAND AND ITS COUNT RECORDED under
    CD-RULE-009, and with that enumeration OFFERED TO THE FOURTH ASSURANCE SEAT TO ATTACK. The four
    named types and `AttemptRecord` are THE FLOOR, NOT THE POPULATION.
  rationale: >
    Transcribed and not paraphrased, because a re-based scope is exactly where drift enters: "An
    enumeration cannot close a property-defined class — this estate's most expensive lesson, and I
    applied it to the kernel while writing a list into my own ruling." The Project Lead notes for
    the record that it declined to fold `AttemptRecord` into increment 5 on its own authority and
    recorded it visibly instead; had it folded it in, the ruling that the LIST was the defect would
    never have been provoked, and increment 5 would have shipped a five-item enumeration with the
    same structural weakness as the four-item one.
  consequence: >
    Carried in remaining_items as CD-D-109/CD-D-110 AS AMENDED BY THIS RULING. The instrument is an
    increment-5 deliverable and is NOT owed at increment 4. The Project Lead does not build it here
    and does not pre-guess its output — a census taken early and quoted late is the defect CD-D-114
    exists to record.
- id: CD-D-120
  decision: >
    CD-PL-F82'S REMEDY IS BOUNDED HERE SO THE SEAT CANNOT GUESS AT IT. The figure stated as MEASURED
    must be RE-TAKEN at the lane head by running the instrument, recorded with its literal command
    under CD-RULE-009, and the before/after pair must be LIKE-FOR-LIKE — a total compared with a
    total, or the rule-1 subset compared with the rule-1 subset, NEVER one against the other. If the
    re-measurement at the lane head disagrees with the 27 recorded at BL-20260822T163432Z-0055, THE
    OBSERVED NUMBER WINS AND THE DISAGREEMENT IS REPORTED.
  rationale: >
    The Product Owner ruled "corrected to the measured number". The defect was never the size of the
    number — 27 of 27 decorated UNDERSELLS the work — it was that two different measurements were
    compared as one and a floor assertion (`subjects >= 24`) could not catch it. A remedy that
    transcribes 27 from this record without re-running the instrument would reproduce the original
    defect one document further along.
  consequence: >
    Increment 4 documentary item. A REWORDING AND A RE-MEASUREMENT, NOT A GUARD (CD-D-080). Whether
    the floor assertion should become an equality is NOT ruled here and is NOT authorised — raising
    a floor is a code change answering a documentary finding.
- id: CD-D-121
  decision: >
    CD-PL-F83 IS FOLDED INTO CD-D-111 AND DECLARED LIMIT 6'S WORDING MUST COVER ALL THREE MEASURED
    ROUTES: the `__closure__` reach (both routes CD-PL-F80 names — calling the undecorated function,
    and rewriting the live declaration dict in `__closure__[0]`), `__wrapped__`, and REBINDING THE
    ESTABLISHING FUNCTION IN ITS OWN MODULE NAMESPACE (`crash_detector.collectors.runner.ensure_utc`
    rebound makes every recorded `AttemptRecord.requested_utc` read 1999-01-01T00:00:00Z, against a
    control that records 2026-08-22T12:00Z). The limit's declaration must state that it is a reach
    with MULTIPLE KNOWN ROUTES and that the ones named are KNOWN ROUTES AND NOT AN EXHAUSTIVE SET.
  rationale: >
    Three distinct routes have now been found through one declared reach, each by a different party
    on a different driver, and each time the declaration named one. A limit that undersells its
    route for the third time is not an accident of drafting; the wording has to stop implying
    completeness it does not have.
  consequence: >
    Increment 4 documentary item under CD-D-111, in ALL THREE CD-RULE-004 PLACES. A REWORDING, NOT A
    GUARD: CPython offers no way to close the `__closure__` reach, and route three needs the ability
    to execute code inside the package, which is the universal limit every in-process guard here
    lives inside. §D.3 part 1's CALLER claim is UNAFFECTED and survives — measured at the increment-3
    boundary and not re-opened by this finding.
- id: CD-D-122
  decision: >
    INCREMENT 4 IS DISPATCHED TO CD-ENG-WO2R3-01 AT LANE HEAD 04cdd34 ON BRANCH wo-2r3, UNDER THE
    LIVE DISPATCH CD-DISPATCH-WO2R3-ENGINEER (status ISSUED, unexhausted), scoped to its
    `increment_4_reconciliation_and_return` block AS AMENDED BY CD-D-111, CD-D-120 AND CD-D-121. NO
    NEW LOGIC. The seat id is the same and the agent instance is new; a fresh seat is required
    BETWEEN dispatches, not between increments of one (PBG-SOD-001 is about Engineer versus
    Assurance).
  rationale: >
    Sequenced by PO-DECISIONS-0007 ruling 1 and reaffirmed by PO-DECISIONS-0008 ruling 5: increment
    4, then increment 5, then the fourth fresh Assurance seat. Increment 4 is dispatched as its own
    boundary and NOT merged with this reconciliation commit, so a seat resuming between the two
    finds a coherent state.
  consequence: >
    THE LARGEST ITEM IN THE DISPATCH IS NOT ONE OF THE SIX DOCUMENTARY ITEMS. It is the RE-MEASUREMENT
    THAT THE EIGHT APPLYING PLANTS STILL *CONTRAST* AT THE LANE HEAD. `git apply --check` is a static
    claim about a patch; it is not a claim that the plant still bites. That is the largest thing the
    increment-3 boundary did NOT verify, it is named in the Product Owner's own dispatch sentence, and
    it is named again here so it cannot be lost.

