action_summary: >
  THE PRODUCT AUTHORITY ANSWERED CD-D-114 AND CD-D-115 AND THE ANSWERS ARE RECORDED, NOT
  INTERPRETED. governance/decisions/PO-DECISIONS-0008.md landed at f8c20e8, authored by Matt Scott
  and by no seat, together with a dated correction appended to BP-AMENDMENT-0001. ACTIVE_WORK.yaml
  was last written at 2026-08-22T16:34:32Z and did not know either existed. That gap is closed HERE,
  by RECORDING the rulings in the Project Lead's own record and NEVER by editing the Product Owner's
  text — governance/decisions/ and governance/blueprint/ are protected scope for every seat
  including this one, which is precisely why CD-D-115's remedy had to be the Product Owner's.

  RULING 1 — CD-D-115 IS RULED: THE §D.3 PART 1 WORDING IS CORRECTED AND THE IMPLEMENTATION STANDS.
  The operative requirement — A CALLER SUPPLIES NEITHER — is met and was measured at the increment-3
  boundary by signature. The old wording ("an engine-owned instant passed as a value") was
  incomplete because a single instant cannot measure an elapsed span and the timeout refusal needs
  one. The corrected reading names TWO instruments for one requirement: the instant passed as a
  VALUE, and an engine-internal monotonic source that TAKES NO PARAMETER for the span. NO CODE
  CHANGES. The seat that raised it (CD-ENG-WO2R3-01, as CD-ENG-WO2R3-F08) went beyond the letter in
  the SAFE direction and disclosed it rather than reading its own resolution back into the
  specification, and the Product Owner named that as the behaviour this project rewards.

  RULING 2 — CD-D-114 IS RULED, AND THE RULING RE-BASES INCREMENT 5 RATHER THAN MERELY ABSORBING
  THE FIFTH TYPE. The Product Owner did not add `AttemptRecord` to a list of four; it declared the
  LIST ITSELF to be the defect. "An enumeration cannot close a property-defined class — this
  estate's most expensive lesson, and I applied it to the kernel while writing a list into my own
  ruling." INCREMENT 5'S SCOPE IS NOW THE CLASS: every public type in the frozen subject on a
  judgement path whose field establishment is BODY-BORNE, ENUMERATED BY AN INSTRUMENT AT INCREMENT-5
  START, with the instrument's COMMAND AND COUNT RECORDED under CD-RULE-009. The four named types
  plus `AttemptRecord` are THE FLOOR, NOT THE POPULATION, and the instrument's enumeration is itself
  offered to the fourth Assurance seat to attack. PO-DECISIONS-0007 ruling 1's other bounds are
  UNCHANGED: still a FIFTH increment AFTER increment 4; still establishment derived from the
  DECLARED FIELD LIST applied at the boundary so a body edit cannot remove it; still V17 as its
  plant; still the three interpreter-borne refusals OUT of scope.

  RULING 3 — CD-PL-F82 AND CD-PL-F83 ARE BOTH FOLDED INTO INCREMENT 4 AS RULED WORK, NOT MERELY
  NOTED. F82's 24-vs-27 undersell is corrected TO THE MEASURED NUMBER wherever it appears. F83's
  third route STRENGTHENS the CD-D-111 rewording obligation already ruled at PO-DECISIONS-0007
  ruling 4: DECLARED LIMIT 6's wording must cover its MEASURED REACH, ALL THREE ROUTES. Both remain
  a REWORDING AND NOT A GUARD (CD-D-080).

  RULING 4 — CD-D-113 THROUGH CD-D-117 STAND AS THE PROJECT LEAD RULED THEM, with CD-D-116 singled
  out as CORRECTLY NOT CLOSED: a collection result is not a judgement value, and asserting otherwise
  to buy redundancy would be a FALSE STATEMENT IN A CONTROL. CD-ENG-WO2R3-F10 REMAINS OWED ON THE
  RECORD and is not discharged by this boundary.

  RULING 5 — INCREMENT 4 IS DISPATCHED AT LANE 04cdd34. RULING 6 — CD-AC-002 AND CD-AC-005 REMAIN
  UNGRADED, reaffirmed for the FOURTH boundary running: reconciliation is not acceptance, acceptance
  is not assurance.

