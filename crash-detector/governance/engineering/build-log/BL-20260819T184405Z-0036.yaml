    stops (PBG-CONT-006) — correctly, but at the cost of a round trip. More importantly the sweep
    must not re-assert CD-RT-012's boundary 8, which the reader seat CLOSED and superseded with the
    narrower 8b. The seat is told to read BL-20260819T175414Z-0048 before it sweeps.

THE_THREE_ADDENDA_AND_WHY_EACH_IS_AN_ADDENDUM_RATHER_THAN_A_RE_OPEN:
  common_reason: >
    All three are DECLARATION defects — a boundary that is incomplete, stale or absent — not logic
    defects. The sweep IS the declaration pass, so they belong at its head. None authorises a code
    change, and the dispatch says in terms that if closing one appears to require logic the seat has
    found a defect in an earlier increment and must STOP and escalate rather than widen.
  addendum_1: 'CD-PL-F65 (CD-D-058). Boundary 3 must name `Agrees`, state that it is UNSLOTTED so the `__slots__` half does not hold there, and state that the route reaches "WITNESS AGREES" on a decade-old timestamp. THE SEAT IS EXPRESSLY FORBIDDEN TO SLOT Agrees: that would close PL-W3 and not PL-W5, reading like a closure while being partial — the CD-PL-F54 shape.'
  addendum_2: 'CD-ENG-READER-F06 (CD-D-063). CD-RT-003''s stale declared limit 4, corrected across all three CD-RULE-004 places IN ONE EDIT, superseding rather than erasing and naming the residue (boundary 8b) that replaced it.'
  addendum_3: 'CD-ENG-READER-F05/F08 (CD-D-062). The silent flattening DECLARED as a CD-RT-012 boundary in all three places, with PL-X10a as its executable example, the PL''s three refused false-clean attempts recorded, AND THE DENOMINATOR STATED — three routes, one criterion — expressly not written as a safety proof. DECLARATION ONLY.'

THE_ONE_SCOPE_EXTENSION_AND_ITS_LEASH:
  what: 'writable scope extended to tools/register/check_engine_no_witness_reach.py FOR PROSE ONLY — comments, docstrings and declared-limit text.'
  why_it_is_necessary: >
    CD-ENG-READER-F06 cannot be closed consistently without it. The reader seat correctly refused to
    correct two of three places, so the correction needs a seat holding all three.
  how_it_is_leashed: >
    ZERO executable lines may change in that file, and the seat must PROVE it: `git diff` on the path
    showing only comment/docstring hunks, and the check's assertion count and exit code unchanged at
    24 / exit 0 on the clean tree. This is a measurable bound, not an instruction to be careful.
  why_the_project_lead_does_not_simply_edit_it: >
    PBG-AUTH-006 and the CD-D-038 / CD-D-045 precedent. A Project Lead that authors the closure has
    made itself the implementer of work it will reconcile. "It is only prose" is the same argument as
    "the fix looks small", which this project has already declined twice.

SEPARATION_OF_DUTIES_RESTATED_AT_THIS_BOUNDARY:
  rule: 'PBG-SOD-001, non-waivable. The Engineer and the Assurance Engineer are never the same agent.'
