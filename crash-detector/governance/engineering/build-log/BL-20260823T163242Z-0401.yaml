finding_raised_by_this_seat_against_its_own_work:
- id: CD-ENG-COORD-FIX-01-F06
  severity: MEDIUM
  against: '`governance/coordination/plants/PLANT-COORD-06.run.sh` arm 2 — **THIS SEAT''S OWN PLANT**'
  what: >
    **ARM 2 WAS FLAKY BY CONSTRUCTION.** It measured double-takes across 40 raced rounds — a real
    measurement — and then asserted that the increment's own detector refused **THE STATE THE LAST
    ROUND HAPPENED TO LEAVE ON DISK.** Whether the FINAL round was one of the double-taking rounds
    is a coin flip.
  how_it_surfaced: >
    On a full eight-plant sweep at the final SHA, PLANT-COORD-06 reported
    `*** NOT A CONTRAST *** — ARMS: 2 / 3`. The race had double-taken **27 of 40 rounds** and the
    detector read `rc=0`, because round 39 had produced exactly one winner and left one claim file.
    **THE ARM FAILED OVER A DEFECT IT HAD IN FACT REPRODUCED 27 TIMES.**
  why_it_is_raised_and_not_just_fixed: >
    **IT HAD PASSED TWICE BEFORE FAILING, AND THE FLAKE WAS IN THE SAFE DIRECTION ONLY BY LUCK.** A
    plant whose arm depends on the last iteration of a randomised loop can as easily report
    CONTRASTED when nothing contrasted. **THAT IS A FALSE GREEN WITH A 1-IN-3 CHANCE PER RUN, IN AN
    INCREMENT WHOSE ENTIRE SUBJECT IS FALSE GREENS**, and it would have been invisible in any single
    passing run — which is how the first two runs went.
  the_fix: >
    The bad state is now demonstrated from a round that ACTUALLY double-took: single rounds are run
    until two claim records coexist, **BOUNDED AT 20 ATTEMPTS**, and the arm FAILS LOUDLY if that
    never happens. **NO ASSERTION WAS RELAXED — the arm now requires double-takes AND two coexisting
    records AND a refusing detector, where before it required double-takes AND a refusing detector.**
    Stable over three consecutive runs, needing 1, 4 and 1 attempts.
  the_pattern_across_all_three_of_this_seats_plant_defects: >
    **`F01`(plant_defect_01) GRADED PROSE. `F01`(plant_defect_02) MEASURED A TREE WHERE THE DEFECT
    COULD NOT FIRE. `F06` MEASURED AN INCIDENTAL RESIDUE INSTEAD OF THE THING IT REPRODUCED.** All
    three are the same error in three costumes: **ASSERTING ON SOMETHING ADJACENT TO THE PROPOSITION
    RATHER THAN ON THE PROPOSITION.** That is this project's own worst habit, named in the dispatch,
    committed three times by the seat dispatched to fix it, and caught each time only because the
    counterfactual arm was real. **A PLANT WITHOUT A LIVE ARM 2 WOULD HAVE HIDDEN ALL THREE.**

