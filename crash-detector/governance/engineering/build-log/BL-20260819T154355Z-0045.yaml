the_defect_verified_by_this_seat_rather_than_taken_on_trust: >
  The Project Lead located this precisely and the seat re-derived it. The old check rooted its
  walk at the CONSTANT ENGINE_PACKAGE = "crash_detector.engine" under SOURCE_ROOT = "src"
  (lines 65, 200, 223 at ba469b5). deploy/Dockerfile.engine:109 declares
  ENTRYPOINT ["python3", "-B", "/app/entrypoints/cd_engine.py"] and line 62 COPYs
  deploy/entrypoints/ into the image alongside src/. So the guard's subject was the engine
  PACKAGE and the criterion's subject is the engine CONTAINER, and deploy/entrypoints/ was
  outside BOTH the walk root and the scanned universe — not mis-parsed, never read.

  MEASURED AT ba469b5, on a pristine extraction:
    clean                                 -> exit 0, PASS 13 assertions, 32 modules, 12 reachable
    E06 (witness import in cd_engine.py)  -> exit 0, PASS 13 assertions. ESCAPES, verbatim.
  Thirteen further routes of this seat's own devising also escaped at ba469b5 (V31-V44 below,
  V42 excepted as a false-positive control).

the_structure:
  invariant_1: >
    CD-ENGINE-ROOT-001 — THE ROOT SET IS DERIVED FROM THE CONTAINER. The engine service is
    located in deploy/compose.yaml; the Dockerfile its `build` names is read; the effective
    process is `entrypoint + command` with compose OVERRIDING the image and a compose
    `entrypoint` CANCELLING the image CMD, as Compose itself does; YAML merge keys (`<<`) are
    resolved against top-level anchors so a declaration parked in a shared fragment is seen.
    Every argument of that process naming a Python module the image ships becomes a walk root.
    THERE IS NO CONSTANT IN THE FILE NAMING AN ENTRYPOINT PATH AND THERE CANNOT BE ONE.
  invariant_2: >
    CD-ENGINE-ROOT-002 — THE SCANNED UNIVERSE IS WHAT THE IMAGE SHIPS. The module map is built
    from the Dockerfile's own COPY instructions — every *.py that lands in the image — named
    against the sys.path roots the image itself declares: ENV PYTHONPATH, the compose
    `environment` value that overrides it, the entry script's own directory, and WORKDIR when
    `-m` is used. UNIONED with src/, named as BLUEPRINT §13 names it, so that arm cannot be
    removed by a Dockerfile edit.
  invariant_3: >
    CD-ENGINE-ROOT-003 — IT FAILS CLOSED ON A DERIVATION IT CANNOT MAKE. Ten clauses,
    CD-ENGINE-ROOT-101..110, each with a stable id an auditor can assert on rather than
    asserting merely "non-zero" (CD-ENG-WO2R-F13): compose absent/unparseable/no services;
    the engine service absent or with no `build`; a merge key naming an anchor the reader
    cannot locate; a Dockerfile absent or declaring neither ENTRYPOINT nor CMD; a COPY that
    cannot be resolved statically (--from= a stage, a glob, a variable, a missing source, an
    escape from the context); SHELL FORM; a non-Python interpreter or `python -c`; a process
    naming NO shipped module (the empty root set); one module name claimed by two files; and
    Python shipped into the image that no declared sys.path root can name.
  the_union_is_load_bearing_and_it_is_measured_not_assumed: >
    ROOTS = derived container roots UNION the engine package. NEITHER IS A SUPERSET OF THE
    OTHER. In WO-2 the container's process is cd_engine -> _service ->
    crash_detector.runtime.lifecycle and does NOT reach crash_detector.engine at all, because
    the WO-2 services start, tick and shut down and evaluate nothing (no registered ingredient
    source; CD-D-005 owed). THE PROOF IS THE PRE-EXISTING PLANT: this criterion's own plant is
    caught through the PACKAGE arm, route `crash_detector.witness.panel <-
    crash_detector.corroboration <- crash_detector.engine.evaluate`, which the container's
    process never touches. REPLACING the package root with the derived one — the obvious
    reading of "the walk root must derive from the container's own entrypoint set" — would
    have DELETED a working guard. Widening the root must not narrow the rules, so the root set
    is a union and this entry states why rather than leaving it to be inferred.
  what_was_deliberately_NOT_done: >
    The obvious fix was "also scan deploy/entrypoints/". It was declined: that is a SECOND
    hard-coded path, and the next escape is a third one — a moved entrypoint, a renamed one,
    one overridden in compose, one merged in through an anchor, one in `-m` form pointing
    inside src/. Six of the fourteen new variants are exactly those routes and all six are
    refused, which is what makes this a closure rather than a second constant.

