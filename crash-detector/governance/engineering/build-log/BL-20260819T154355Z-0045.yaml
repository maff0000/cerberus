findings_raised_against_my_own_work:
- id: CD-ENG-WO2R-F17
  severity: LOW
  status: OPEN — DECLARED, NOT FIXED, and this is the residue of my own structure
  title: "run-time sys.path mutation defeats the derived module naming: an already-scanned witness module imported by a short name is not an edge the graph carries"
  detail: >
    The universe half of this closure names files against the sys.path roots THE ARTEFACTS
    DECLARE. A module that inserts a directory into sys.path at run time makes a name
    importable that no declaration mentions. Measured, variant V44: cd_engine.py does
    `sys.path.insert(0, "/app/src/crash_detector/witness")` then `import panel`. panel.py IS in
    the scanned universe and IS witness code, but the edge is spelled `panel`, which resolves
    to no module in the graph, so the check exits 0, PASS 23 assertions, 0 violations.
  why_i_did_not_close_it: >
    The two available closures are both worse than the declaration. (i) Refuse every sys.path
    mutation in a scanned module — but the CLEAN TREE legitimately contains one, in
    deploy/entrypoints/_service.py, which exists so an entrypoint runs from a checkout as well
    as from an image; a guard that fires on the product is a guard somebody switches off, which
    is the argument CD-RT-012-NO-EXECUTION-INTERFACE's L3 already makes at length. (ii)
    Symbolically evaluate the inserted path — that is interpreting code the check has already
    said, in the dynamic-import clause, that it will not follow, and it would need
    `pathlib.Path(__file__).resolve().parents[2] / "src"` to be evaluated statically. I also
    declined the cheap partial fix of naming unnameable shipped files by their BASENAME: that
    would be inventing the sys.path mutation that makes the name real, and a guessed fact is
    worse than a stated refusal. What I did instead is CD-ENGINE-ROOT-110, which refuses
    outright when the image ships Python no declared path can name (V43, exit 3) — the
    neighbouring route, closed, with the residue named rather than blurred into it.
  what_would_close_it: >
    Most likely a WO-3 change to _service.py so the checkout fallback is expressed as a
    declaration the guard can read rather than as a run-time mutation, after which refusing all
    sys.path mutation inside the shipped set becomes available. That is a change to application
    code outside this increment's finding and I did not take it (widening scope silently is
    prohibited; escalating is not).
- id: CD-ENG-WO2R-F18
  severity: LOW
  status: OPEN — DISCLOSED, and it is a property of the fail-closed posture I chose
  title: "five of my fifteen variants are refused at exit 3, not exit 1, and an auditor asserting only 'non-zero' cannot tell a derivation failure from a detected reach"
  detail: >
    V35, V39, V40, V41 and V43 all carry, or could carry, a real witness reach AND a broken
    derivation. The check refuses on the derivation first and never reaches the assertion, so
    it reports PRECONDITION_NOT_MET at exit 3 and never says "engine reaches witness code" —
    even when the reach is there in the tree. That is the correct fail-closed order (a guard
    that reported a clean graph it could not build would be worse), but it means the exit code
    alone under-describes what was found, and an auditor scripting `[ $? -ne 0 ]` learns less
    than the output contains.
  mitigation_already_in_place: >
    Every clause carries a stable id, CD-ENGINE-ROOT-101..110, printed on stderr, and the
    execution contract tabulates all ten. This is CD-ENG-WO2R-F13 applied to my own refusals:
    assert the CLAUSE ID, not merely a non-zero exit. Recorded so the next auditor does not
    have to discover the distinction by tripping over it.
- id: CD-ENG-WO2R-F19
  severity: LOW
  status: OPEN — DISCLOSED
  title: "the anchor resolver only follows top-level anchors, so a legitimate nested fragment is a refusal rather than a read"
  detail: >
    tools/register/_yamlmin.py does not track YAML anchors, so this check rebuilds the anchor
    index by scanning the raw text for `key: &name` and resolving only those at indent 0
    through the parsed document. An anchor declared deeper is recorded as UNRESOLVABLE and
    becomes CD-ENGINE-ROOT-103, a refusal. Today deploy/compose.yaml declares all three of its
    anchors at the top level, so the clean tree is unaffected and V41 shows the refusal working
    as intended. But a legitimate reorganisation that nests a fragment would break the check
    rather than be read, and the author would have to move the anchor or change the guard.
    Fail-closed and therefore safe, but it is a usability cost paid by a future author and it
    should be visible before they pay it, not after. The proper repair belongs with the
    _yamlmin dispatch CD-D-051 already schedules, since anchor tracking is a reader feature.

