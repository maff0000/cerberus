# CD-PL-F70 (LOW) — the standing AMBER has been attributed to the wrong cause for many boundaries
# ================================================================================================ #
CD_PL_F70:
  severity: LOW
  what_is_wrong: >
    Boot verdicts recorded across this project say, in these words or close to them, "AMBER —
    CONTINUITY_MATCH/RESUME_AMBER, blocking_failures empty, THE SOLE UNAVAILABLE BEING
    roadmap_identity", which reads as: the AMBER is caused by the missing ROADMAP.md, a known
    Product Owner call. MEASURED, THAT IS NOT THE CAUSE.
  measured_with_one_variable_changed:
    arm_1: 'clone at 8e9456f, clean working tree, ROADMAP.md STILL ABSENT -> GREEN, CONTINUITY_MATCH/RESUME_GREEN. roadmap_identity is still reported `!  UNAVAILABLE` in the same output.'
    arm_2: 'THE SAME CLONE with ONE empty untracked file created (`touch .an-untracked-probe-file`) -> AMBER, CONTINUITY_MATCH/RESUME_AMBER.'
    arm_3: 'the file removed again, nothing else changed -> GREEN.'
    arm_4: 'the live worktree /srv/crash-detector at the IDENTICAL SHA 8e9456f -> AMBER, because the operator wrapper files and pbg/tools/pbg/__pycache__/ are untracked there.'
    conclusion: >
      A single untracked file flips the verdict. The missing roadmap is REPORTED as UNAVAILABLE in
      both arms and degrades nothing. The standing explanation names a carrier that was never
      measured — the CD-RULE-006 shape, applied to a boot verdict instead of a guard boundary.
  why_it_matters_and_why_it_is_only_LOW: >
    It is NOT a false clean: AMBER is stricter than the truth, so nothing was waved through. The real
    cost is MASKING. This project has treated a standing AMBER as expected and explained for many
    boundaries, so a NEW cause of AMBER — a genuine degradation — would have arrived looking exactly
    like the old one and been read as the roadmap again. A verdict whose cause is misattributed
    stops being a signal.
  what_is_NOT_claimed: >
    This does not establish that the missing ROADMAP.md is harmless, and CD-D-005's roadmap question
    remains a Product Owner call. It establishes only that the missing roadmap is not what has been
    making boot AMBER. THE DENOMINATOR: four arms at two SHAs on this host.
  not_repaired_here: >
    The obvious cheap fix — a .gitignore for the operator's wrapper files — is NOT taken by this
    seat. There is no .gitignore in this repository at all, and adding one at a resumption boundary
    would make untracked work invisible for the sake of a cosmetic verdict, which is the wrong trade
    on a project whose last six boundaries all had to ask "what did the dead seat leave behind?".
    CD-RULE-008 gets the true verdict a better way: read it off a clean clone.

# ================================================================================================ #
# CD-RULE-008 — the CD-RULE-007 boot re-run is performed on the COMMITTED tree
# ================================================================================================ #
CD_RULE_008:
  recorded_in: 'governance/rules/PROJECT-RULES.md at this boundary.'
  rule: >
    The `pbg boot` re-run that CD-RULE-007 requires is performed on a PRISTINE CLONE AT THE COMMITTED
    SHA, and the verdict recorded is that one. A working-tree boot may be run as well, but it is not
    the verdict of record.
  why_it_closes_both_classes_with_one_move: >
    CD-PL-F69 is a committed tree that is RED while the working tree reads fine, because an untracked
    file supplied what the repository lacked. CD-PL-F70 is a working tree that reads AMBER while the
    committed tree is GREEN, because untracked files degrade the verdict. THEY ARE THE SAME DEFECT
    FROM BOTH SIDES: the working tree is not the record, and a verdict taken from it is a verdict
    about something other than what the project ships. Reading it off the committed tree is right in
    both directions at once, and it does not enumerate the ways a working tree can differ.
  it_is_checkable_from_the_build_log_alone: >
    An entry recording a boot verdict must name the SHA the verdict was taken at, and that SHA must
    be a commit. A verdict with no SHA, or a SHA that is not the boundary's own commit, is a breach
    visible on its face — the same property CD-RULE-007 was given.
  the_ordering_problem_and_how_it_is_handled: >
    The verdict of the commit that carries the entry cannot be inside that entry. This is the SAME
    ordering problem CD-RULE-007 already solved for `continuity_record_commit`, and it takes the same
    answer: the follow-up commit that resolves PENDING records the committed-tree verdict IN ITS
    COMMIT MESSAGE. 192fc50 is the worked precedent. No new mechanism is introduced.

