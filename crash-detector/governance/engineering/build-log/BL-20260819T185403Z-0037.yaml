# ================================================================================================ #
# CD-PL-F69 (MEDIUM) — a continuity record naming a Build Log entry the repository does not have
# ================================================================================================ #
CD_PL_F69:
  severity: MEDIUM
  raised_by: 'PROJECT LEAD, this boundary.'
  against: '44a56ec, written by the sixth Project Lead seat.'
  what_is_wrong: >
    44a56ec advanced `last_build_log_entry` to BL-20260819T184405Z-0036 and did not commit that file.
    The entry existed only on the disk of the seat that wrote it. A Build Log entry that exists only
    in a working tree is not project state (PBG-CONT-007), and a continuity record naming an entry
    the repository does not have is a DANGLING REFERENCE.
  measured_with_one_variable_changed:
    arm_1: 'clone of this repository at 44a56ec, entry ABSENT -> `pbg boot` RED, CONTINUITY_REFERENCE_INVALID/RESUME_BLOCKED, observed_sha 44a56ec resolved.'
    arm_2: 'THE SAME CLONE, the entry file restored and NOTHING ELSE CHANGED -> `pbg boot` AMBER, CONTINUITY_MATCH/RESUME_AMBER.'
    arm_3: 'clone at 8e9456f, the repair commit -> `pbg boot` GREEN, CONTINUITY_MATCH/RESUME_GREEN.'
    conclusion: >
      The committed record at 44a56ec was RED for ANY actor taking a fresh checkout — an Engineer
      seat, an auditor, or the next Project Lead. Boot's read-back was working perfectly. It was
      pointed at the wrong tree.
  a_first_probe_was_discarded_for_being_refused_for_the_wrong_reason: >
    `git archive` of 44a56ec into a plain directory also booted RED — but SO DID THE CONTROL with the
    entry present, because a tree with no `.git` cannot resolve observed_sha and boot reports
    CONTINUITY_REFERENCE_INVALID for THAT reason instead. Had the control not been run, this finding
    would have been reported on evidence that does not support it. That is CD-ENG-WO2R-F13's lesson
    applied to the Project Lead's own probe: a probe refused for a reason you did not intend has told
    you nothing. The finding stands on the git-bearing clone, where the two arms differ in one file.
  the_second_half_CD_RULE_007: >
    BL-...-0036 records no boot verdict although its boundary changed ACTIVE_WORK.yaml. CD-RULE-007's
    own closing sentence — "an entry that changes a continuity record and records no boot verdict is
    a breach visible on its face" — convicts it on its face. Whether the sixth seat ran boot and
    omitted the record, or did not run it, is UNKNOWABLE AND IMMATERIAL: unrecorded is unproved, and
    the rule exists precisely so that the question never has to be asked.
  why_the_rule_did_not_stop_it: >
    CD-RULE-007 says "re-run `pbg boot` after the edit". It does not say WHERE. Run in the working
    tree, as every boundary so far has run it, it reads a tree that contains files the repository
    does not have — so it validates a record that is not the committed record. The rule's whole
    purpose is the read-back guarantee that `continuity.checkpoint` gives up when a file is
    hand-edited, and a working-tree boot silently forfeits that guarantee a second way.
  repair: 'The entry is committed at 8e9456f and the committed tree boots GREEN. Class closed by CD-RULE-008 below.'

