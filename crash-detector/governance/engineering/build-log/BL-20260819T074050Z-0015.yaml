# --- what was implemented ---------------------------------------------------------------------- #

implemented:

  B3_the_eleven_plants: >
    plants/ — one directory per criterion, one `git apply`-able patch per required test, and
    plants/MANIFEST.md carrying for every test: test_id, patch file, the PROPOSITION violated, the
    expected failure signature, the literal command line, and the collateral this seat observed.

    ELEVEN patches for eleven tests across five criteria. All eleven were re-verified as
    `git apply --check` clean against a throwaway copy extracted from the FINAL increment SHA, not
    merely from the tree they were cut against.

    THE CONSTRAINT THEY WERE BUILT TO. Each plant violates the PROPOSITION, not the string the
    checker greps for. Where a guard's own documentation names the escape a plant author actually
    uses, the plant takes THAT route:
      * the blend is spelled over three statements with NEUTRAL local names (`first`, `second`), so
        only intra-procedural flavour propagation can see it;
      * the engine reaches witness code in TWO hops, by a RELATIVE import, from a FUNCTION-LOCAL
        import site — with the plant applied, no import statement anywhere under
        src/crash_detector/engine/ names witness, and this seat ran the grep to prove it;
      * the grant is added in a LATER migration, so the SQL-versus-declaration text comparison is
        blind to it by construction and only the live catalogue sees it;
      * the order ticket appears a second time under the name `record`, which carries no execution
        word at all, so L2 has to catch it without reading the name;
      * the broker host is `api.ibkr.com`, which tokenises to {api, ibkr, com} and contains no
        execution concept word, so only the registrable-domain denylist can catch it;
      * the broker SDK is `ib-insync`, which carries no execution token either, so only the named
        denylist can catch it.

    EACH PLANT WAS RUN AGAINST THE SIBLING ARMS OF ITS OWN CRITERION, and the manifest records which
    instrument sees it and which does not. That is the part of this deliverable this seat considers
    load-bearing, because it is what distinguishes three independent refusals from one refusal
    written three times. Three results are worth the Project Lead's attention:
      * CD-RT-001-ABSENCE-RENDERS-UNKNOWN's plant leaves check_no_numeric_default.py at exit 0.
        `score=0.0` is none of the five routes that check bans. The two CD-AC-001 tests are
        therefore not redundant — one reads the SHAPE of the dial path, the other reads what it
        DOES — and only the second sees the product's central failure.
      * CD-RT-003-ENGINE-NO-WITNESS-REACH's plant leaves
        test_evaluate.py::test_importing_the_engine_does_not_pull_in_the_witness_package PASSING,
        because a function-local import genuinely does not pull the package into sys.modules. Only
        the static graph walk sees the reach.
      * CD-RT-005's plant leaves ALL FIVE source-scanning register checks at exit 0, and leaves
        tests/test_witness_panel.py entirely green — the WitnessPanel type is untouched and the
        product lies anyway.

  CD_ENG_F40_the_printed_note: >
    tools/register/check_no_execution_interface.py — the `note:` line the check EMITS on every run
    described the old narrow L3 suppression list while the header, the register entry and the
    execution contract had all been corrected in increment 6a. Corrected in ONE SEPARATE COMMIT
    (a06e64f), as the dispatch required.

    The counts are now taken from len(PROSE_NEGATIONS) and len(PROSE_HYPOTHETICALS) at run time
    rather than written as literals, so the note cannot drift from the lists a second time. It names
    the words that surprise, quotes the MEASURED escape verbatim, cites CD-ENG-F39 and CD-D-017, and
    points the reader to the DECLARED LIMIT in the header for the full six boundaries.

