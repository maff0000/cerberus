# --- findings raised ---------------------------------------------------------------------------- #

findings_raised:
- id: CD-ENG-F41
  severity: LOW
  title: 'Two register checks have no plant and no negative control, by construction'
  detail: >
    tools/register/check_base_image_digest_pin.py (CD-BASE-IMAGE-DIGEST-PIN) and
    check_dockerignore.py (CD-BUILD-CONTEXT-RESTRICTED) are delivered, run clean, and are
    DELIBERATELY ABSENT from required-tests.yaml because neither derives from a PID §6 criterion —
    the reasoning is in the register header and was accepted at increment 5. The consequence
    surfaces here for the first time: B3 plants against the REGISTER, so those two guards receive no
    planted violation and are therefore evidenced only by passing. A guard that has never been
    observed to fail is a guard nobody has tested.
  disposition: >
    NOT resolved by this seat. Inventing a criterion so a guard has somewhere to live would be
    writing product requirements from the Engineer's seat (PBG-AUTH-005), and planting against a
    test that does not exist in the register would put evidence outside the register. Raised to the
    Project Lead as a disclosure for the Product Owner: either a criterion covers them or they are
    accepted as unattested utilities.
- id: CD-ENG-F42
  severity: LOW
  title: 'CD-RT-003-GRANT-MATRIX-LIVE cannot be evidenced on a host with no container runtime'
  detail: >
    Ten of the eleven plants are verifiable with the stdlib and pytest alone. The eleventh needs a
    reachable PostgreSQL, and correctly exits 3 rather than skipping when there is none. That is the
    right behaviour, but it means one of the five WO-2 criteria cannot be evidenced by an Assurance
    seat that does not hold the runtime authorisation to start a store. The Assurance dispatch
    should carry an explicit RT grant of the same shape as RT-A, or CD-AC-003 will return
    PRECONDITION_NOT_MET on its second test and the gate will be judged on one of its two halves.
  disposition: 'Raised to the Project Lead before CD-DISPATCH-WO2-ASSURANCE is moved to ISSUED.'

