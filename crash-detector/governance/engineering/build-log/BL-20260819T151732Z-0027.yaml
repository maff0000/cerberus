the_structural_move: >
  THE SEAT DECLINED THE OBVIOUS FIX AND WAS RIGHT TO. Mirroring the destination registry onto
  `pending` would have been incoherent: a pending entry exists BECAUSE THE HOST IS UNKNOWN, so
  requiring it to name a registered destination is either unsatisfiable or forces the seat to
  invent the hostname the project deliberately recorded as owed — CD-RULE-003 and PBG-AUTH-005,
  and compose.yaml itself says cd-witness' and cd-review's hosts are "not decided" and were
  "recorded as pending rather than guessed".

  CD-EGRESS-007 instead closes the field FROM ITS OWN MEANING. A pending entry is the record of
  an ABSENCE — what authorises the future endpoint (`declared_in`) and why the host is not
  written (`blocked_by`). A host is precisely the thing it declares the absence of. So the key
  set is closed BY EQUALITY and there is no field that can hold a destination: `host:`,
  `endpoint:`, `url:`, `address:`, `target:` and every key nobody has thought of fail the SAME
  clause, WITHOUT THE VALUE BEING EXAMINED. That is the increment-2b pattern again — remove the
  destination the routes share rather than enumerate the routes — arrived at independently and
  fitted to a field whose semantics forbade the increment-3 answer.

  SECOND-ORDER REPAIR, UNPROMPTED: the unresolved-alias filter enumerated five field names and
  `pending` was not among them. The seat identified THAT LIST AS ITSELF THE ENUMERATION DEFECT
  and replaced it with the whole x-egress subtree. Strictly wider. It found the same class of
  error one layer beneath the one it was sent to fix.

boundary_4_correction_CD_D_046_discharged: >
  REQUIRED and DELIVERED, and not softened. Boundary 4 is now FIELD-SPECIFIC, and each field
  names its own layer-1 rule AND the variant that measured it: `hosts` -> CD-EGRESS-004,
  carried, measured by E05; the REGISTRY -> CD-EGRESS-006, carried, measured by V20; `pending`
  -> CD-EGRESS-007, carried, measured by PL-S3a and PL-S3c; and `pending` PROSE -> "THERE IS NO
  LAYER 1. SEE BOUNDARY 7, WHICH IS WHERE THAT RESIDUE IS DECLARED. Do not read this boundary
  as covering it."

  It also carries the CORRECTION AND ITS REASON in its own text rather than silently rewriting,
  naming CD-PL-F59 and CD-RULE-006 and stating why a boundary naming a compensating layer that
  does not compensate "is worse than no boundary, because it spends an auditor's attention
  where the defect is not". That is the standard this project asked for, met in full.

