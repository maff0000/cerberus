findings:
  - id: CD-PL-F61
    severity: MEDIUM
    status: OPEN
    title: "the shared minimal YAML reader does not terminate on an ordinary nested-sequence document; two register checks return no verdict"
    confirms: CD-ENG-WO2R-F14
    detail: >
      CONFIRMED INDEPENDENTLY by PL-T5 and by a minimal repro, with three facts the seat's own
      framing understates.

      (1) IT IS NOT AN EXOTIC SHAPE. PL-T5 was written to test value-position smuggling under an
      admissible key, not to find a hang. `declared_in` as A LIST OF TWO AUTHORITIES is an
      entirely ordinary edit. The Project Lead met the defect by accident on the first probe of
      that shape.

      (2) IT AFFECTS BOTH CHECKS SHARING THE READER. On the PL-T5 tree, check_egress_no_broker.py
      exit 124 AND check_base_image_digest_pin.py exit 124; on the clean tree both exit 0. Two of
      the eleven declared gate commands return NO VERDICT on the same input.

      (3) IT PREDATES THE AUDIT. tools/register/_yamlmin.py has ZERO commits in ee8be6b..ba469b5.
      The document `top:` / `  - key:` / `      - nested` hangs load_yaml at ee8be6b AND at
      66681b2 — THE EXACT SHA THE FIRST AUDITOR WAS GIVEN. It was reachable throughout the WO-2
      assurance run and was not met.

      NOT A FALSE CLEAN: a hang is not exit 0 and is fail-closed under any harness imposing a
      timeout. But it is a check that cannot return a verdict, which is what PBG-CI-002's "never
      a skip, for any reason" is aimed at — a skip of indefinite length that also stops the
      pipeline behind it. Ruled CD-D-051.

