    ruling: >
      The seat's refusal to mirror the destination registry onto `pending` is CORRECT AND
      COMMENDED. It identified that the obvious fix would have forced it to invent a hostname the
      project recorded as owed, and it declined on CD-RULE-003 and PBG-AUTH-005 grounds. A seat
      that reasons about WHY a structure does not fit, instead of applying it because the Project
      Lead's finding gestured at it, is doing the work this rework exists to produce.
  - id: CD-D-050
    ruling: >
      Boundary 7 — an ADDRESS in `pending` PROSE is not refused, measured by V29a at exit 0 — is
      ACCEPTED as a declared limit under CD-RULE-004 option (ii). It carries an executable
      example, a MEASURED partial carrier (V29b, the same sentence with `api.ibkr.com`, refused by
      CD-EGRESS-002), and for the address literal the words "NOT PROVED TO BE CARRIED ANYWHERE".
      The seat explicitly recorded the tempting argument — that with no host-bearing field left,
      prose is a mention and not a declaration — AS AN ARGUMENT AND NOT AS A LAYER. That is
      CD-RULE-006 applied by the seat to itself, unprompted, and it is the correct handling.
  - id: CD-D-051
    ruling: >
      CD-PL-F61 / CD-ENG-WO2R-F14 — the non-terminating YAML reader — IS REPAIRED BY A SEPARATE
      BOUNDED DISPATCH, ISSUED BEFORE CD-DISPATCH-WO2R-ASSURANCE AND AFTER INCREMENTS 4 AND 5.
      It is NOT folded into WO-2R's remaining increments: this dispatch is bounded to
      CD-ASR-F01..F06 and widening it silently is precisely what `prohibited` forbids. It is not
      deferred to WO-3 either, because an auditor probing YAML shapes will meet it the way the
