    A case-sensitive search agreed with the seat. A CASE-INSENSITIVE one does not: `grep -ic
    "floor.*not an oracle"` returns 2, 2 and 2 across the check, the contract AND
    required-tests.yaml. The phrase is NOT absent from the register.
  why_this_makes_the_finding_WORSE_rather_than_better: >
    Look at WHERE it sits. In required-tests.yaml the sentence is inside CD-RT-012-LOCKFILE-DENYLIST's
    `negative_control.violation` (line 828), where it WIDENS the claim — "the denylist is a floor and
    not an oracle, SO THE CLASS INCLUDES AN SDK NOBODY HAS HEARD OF". In the check header and the
    execution contract the same words BOUND what the guard delivers. So the three places do not
