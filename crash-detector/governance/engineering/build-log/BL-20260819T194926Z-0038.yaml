  what_the_seat_said: >
    That CD-RT-012-LOCKFILE-DENYLIST's "the denylist is explicitly a FLOOR and not an oracle" limit
    exists in the check header and the execution contract and is ABSENT FROM THE REGISTER ENTRY —
