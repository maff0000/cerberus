    the class is broad in one place and that the guard is only a floor in the other two. The entry
    still carries `scope: CLASS` with no declared-limit block.
  the_method_note_that_produced_it: >
    The Project Lead's first measurement of this was CASE-SENSITIVE and would have been reported as
    corroborating the seat verbatim. It was re-run because a neighbouring `awk` extract showed the
    phrase in lowercase inside the very file the count said did not contain it. That is
    CD-ENG-WO2R-F13's lesson a fourth time on this project, now against a PROSE measurement rather
    than an executed one: a search that agrees with what you expected is exactly the one to re-run.

