    day someone adds it is the day the decision gets recorded rather than inherited.
    TWO REASONS, AND THE FIRST IS THE BLOCKING ONE:
    (a) **WHERE THE FIELD ATTACHES IS AMBIGUOUS AND THE AMBIGUITY HAS A DOCTRINE CONSEQUENCE.**
    BLUEPRINT §8 says "the envelope carries `detail_level` derived from the reading itself" —
    SINGULAR — but the envelope is singular and the readings are TWO. Envelope-level means a function
    over both dials; per-dial does not. `PBG-AUTH-005` puts product meaning outside this seat.
    (b) **THE THRESHOLDS ARE AN UNRATIFIED PRODUCT QUANTITY.** Deciding at what score a dial stops
    being calm needs a SCALE, and `dials/scores.py` REFUSES to declare one in terms — "the scale of a
    dial is what the dial MEANS" — owed under CD-D-005, which is Q25, HELD FOR MATT.
    ALSO: adding the key is an allowlist edit requiring a `schema_version` bump on BOTH closed
    schemas, `ENVELOPE_SCHEMA_VERSION`, a NEW forward-only migration to widen two CHECK constraints,
    and the in-step tests. That friction is "exactly the friction intended" and **should be paid
    ONCE, with the placement ruled** — not as a side effect of an increment that cannot supply the
    thresholds anyway.
    RECOMMENDATION: **per-dial**, inside each `dial_reading` object. It is the only placement that
    cannot become a cross-dial combination, and it reads "derived from the reading itself" literally.
