  decision_id: CD-D-073
  authority: 'Product Owner (Trinity), under the ownership mandate of 2026-08-19. Matt is final authority.'
  answer_1_is_there_a_wo2r2: >
    YES, AND IT IS SCOPED TO CLASSES, NOT FINDINGS, AT THE ALTITUDE CD-PL-F74 DEMANDS.
    CLASS 1 — ADMISSION IS VALIDATION: no value crosses into the dial or publication path
    unvalidated; every admission site validates VALUES against the target type's own invariants,
    deny by default; label vocabularies are never the load-bearing check; RULE 4's refuted text
    "cannot avoid coming here" is WITHDRAWN AS A CLAIM and must be replaced by a property that is
    true; explicitly NOT scoped as "add combine_within_one_dial to the vocabulary".
    CLASS 2 — JUDGE VALUES, NEVER TYPES: staleness, agreement and reading-ness decided on content;
    isinstance is never a guard by itself.
    ITEM 3 — the CD-AC-012 dependency-surface AMBER, bounded.
  answer_2_do_the_ambers_travel: >
    THEY TRAVEL. CD-AC-001's AMBER rides with Class 1, CD-AC-005's with Class 2, CD-AC-012 is item
    3. The PO's own words on why: "The gate is PASS on all five. A WO-2R2 that fixed F01 and F02
    perfectly and still failed the gate would be a scoping defect of mine, decided now rather than
    discovered late." THE PROJECT LEAD RECORDS THAT THIS IS THE QUESTION IT RAISED AND COULD NOT
    ANSWER, AND THAT THE ANSWER CAME BACK WIDER THAN THE ANSWER IT WOULD HAVE GIVEN ITSELF — which
    is the whole reason CD-D-073 was carried upward instead of decided down here.
  answer_3_is_cd_pl_f74_adopted: >
    ADOPTED, PROJECT-WIDE, EFFECTIVE IMMEDIATELY: "a refusal is recorded with WHICH LAYER refused it
    and WHAT THAT LAYER'S SCOPE IS, before any acceptance cites it. Six recurrences of
    probe-refused-for-the-wrong-reason are enough; the sixth cost a gate." CD-D-040 REMAINS REOPENED
    — "PL-R5 was evidence that PL-R5 named a door, never that the class was closed." The correction
    is also harvested by the PO to the PBGv2 framework backlog.
  the_standing_condition: >
    Each class closure states its structural invariant in the commit that lands it. IF A THIRD GATE
    FAILS ON A CARRIER/ADMISSION-SHAPED FINDING, IMPLEMENTATION SUSPENDS AND BLUEPRINT §7 RETURNS
