  **THE SECOND SENTENCE IS NOW TRUE AND IT IS TRUE BY CONSTRUCTION, AND THAT IS A REAL THING THIS
  INCREMENT ACHIEVED.** A never-before-named state has to arrive as a new branch of a closed union;
  a new branch's `state.const` is not in `PRESENT_STATES`; `CD-CALM-FRESH-010` then refuses it the
  calm-bearing vocabulary. I checked this is not word-play: `CC-E` and `CC-F` differ in ONE `$ref`
  and `CD-CALM-FRESH-010` fires on exactly one of them. At the document level every state-shaped
  escape in this chain is refused — `SPINDRIFT`+calm, `status`-spelled+calm, no-state+calm,
  UNKNOWN+calm, DEGRADED+calm, all REFUSED on both surfaces at the tip.
  **THE FIRST SENTENCE IS NOT TRUE, AND IT FAILS IN TWO DIFFERENT PLACES THAT NEED DIFFERENT
  ANSWERS.**
  **IT FAILS ON "BY CONSTRUCTION" BECAUSE THE CONSTRUCTION HAS A HOLE.** The word doing the work in
  the second sentence is *dial* — the guarantee is built around the closed shape of
  `#/$defs/dial_reading`. But `calm` does not need a dial to reach a published document. It needs a
  ROOT PROPERTY, and Rule CC lets eight or nine of those through on a NAME plus a two-shape probe.
  I put `calm` into one of them, about DEGRADED INPUTS, and the whole register stayed green. **THE
  PARTITION IS COMPLETE; ONE OF ITS TWO CELLS IS PROVED BY A SAMPLE. A partition with a sampled cell
  is not a closed contract, it is a closed contract with an unclosed corner.**
  **IT FAILS ON "PRESENT-AND-FRESH" BECAUSE NOTHING IN THIS INSTRUMENT, OR IN THE GATE, EVER READS A
  TIMESTAMP'S VALUE.** What `CD-CALM-FRESH-010` proves is that a branch is OBLIGED TO CARRY A
  STAMP. That is worth having — it is the auditability half — but it is not the freshness half, and
  the contracts now assert in normative prose that it is. **A dial that says it is fifty-six years
  old, in a state the contract blesses, carrying `calm`, is ADMITTED ON BOTH SURFACES AT THE TARGET
