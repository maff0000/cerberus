  escape is found after this test is green, the test was wrong, not the guard incomplete."* **I DO
  NOT INVOKE THAT CLAUSE HERE AND I THINK IT WOULD BE WRONG TO.** `CD-ASR-WO3-10` invoked it
  correctly, because its escapes were things a RECOGNISER structurally could not see, and no test
  can be green over an architecture that cannot answer the question. **THAT IS NOT MY POSITION.**
