findings_raised_by_the_project_lead_at_this_boundary:
- id: CD-PL-F91
  severity: MEDIUM
  title: >
    A DECLARED LIMIT THAT CROSS-REFERENCES ANOTHER INSTRUMENT'S CLASS DEFINITION AND ITS COUNT IS AN
    UNTRACKED DEPENDENCY, AND CD-RULE-004's "ALL THREE PLACES" DOES NOT REACH IT.
  what: >
    check_judgement_path_doors.py's DECLARED LIMIT 1 discharges itself by naming the constructor
    instrument as its MEASURED CARRIER and quoting that instrument's class wording and population
    count ("the body-borne field-establishment class at 32 members"). PO-DECISIONS-0010 ruling 1
    changes both. CD-RULE-004 requires a declared limit to appear in three places — the tool header,
    required-tests.yaml and the execution contract — and ALL THREE ARE THE LIMIT'S OWN. **A FOURTH
    PLACE, IN A DIFFERENT INSTRUMENT, WAS CARRYING A COPY OF THIS DEFINITION AND NO RULE POINTED AT
    IT.**
  how_found: 'By RUNNING the doors instrument at 46adf33 while measuring the dispatch baseline, and
    reading its notes, rather than by reading the increment-5 diff.'
  direction_of_error: >
    UNDERSTATEMENT OF COUPLING. CD-RULE-006 (name a MEASURED carrier) is a good rule and it created
    this: the moment a limit discharges itself by pointing at another instrument, the two are coupled,
    and nothing was tracking the coupling in the direction that matters — from the DEFINITION to its
    CITERS.
  disposition_here: >
    Carried into this dispatch as objective (e) with the grep that finds it. **NOT PROPOSED AS A RULE
    CHANGE AT THIS BOUNDARY** — a rule amendment written while dispatching is a rule amendment written
    in a hurry. Raised, recorded, and left for the fourth Assurance seat to see standing.
  what_would_have_caught_it_earlier: 'Nothing in this repository. That is the finding.'

- id: CD-PL-F92
  severity: LOW
  title: >
    THIS BOUNDARY ISSUED A DISPATCH WHOSE ENTIRE MEASURABLE EFFECT ON THE PRESENT TREE IS ZERO, AND
    THE PROJECT LEAD RECORDS THAT AS A RISK IT IS CARRYING RATHER THAN AS A PROPERTY OF THE WORK.
  what: >
    Because `Empty` is the only adjacent member and has no fields, a completed and correct execution
    of ruling 1 produces IDENTICAL PASS/FAIL BEHAVIOUR on every artefact in the tree. **THE
    RECONCILIATION OF THIS DISPATCH THEREFORE CANNOT BE PERFORMED BY RUNNING THE CHECKS**, which is
    how this seat has reconciled five increments. It can only be performed by running the seat's own
    contrast in both arms.
  disposition_here: >
    Stated in the dispatch to the seat in the same words it is stated here, and written into
    next_safe_action as a reconciliation instruction. The Project Lead will run the contrast at both
    SHAs itself and will not accept the seat's report of it — the same discipline applied to the
    increment-5 ordering claim, which was RUN at 4a5098d rather than read.

decisions_ruled_here:
- id: CD-D-137
  title: 'The completion''s writable scope EXCLUDES src/ and plants/, narrower than its parent.'
  ruling: >
    The bounded completion may write only tools/register/, tests/, contracts/execution/, variants/,
    required-tests.yaml and the lane build-log. src/ and plants/ are PROTECTED for this dispatch.
  why: >
    Ruling 1 changes what the instrument ASSERTS OVER, not the mechanism, and the Project Lead
    MEASURED that every member of the widened population already satisfies the widened rule before
    narrowing. A scope that permits what the work does not need is how a bounded completion becomes a
    sixth increment.
  and_the_escape_hatch_is_a_stop_not_an_expansion: >
    If the seat finds it needs src/, that is a STOP AND A FINDING, because it contradicts the
    measurement above and means the widening is not vacuous on the present population.
- id: CD-D-138
  title: 'The contrast is the deliverable. A green run is not evidence of this completion.'
  ruling: >
    The bounded completion is NOT RECONCILED without a durable variant demonstrating exit 0 at 46adf33
    with the type printed as ADJACENT, and non-zero at the returned SHA with the type NAMED. Both arms
    run; the old arm from a pristine `git archive` extraction.
  why: >
    See CD-PL-F92. This is the one boundary on this project where the standing checks CANNOT
    distinguish a real closure from a reworded docstring, and the doctrine that a runtime claim needs
    runtime proof applies with the polarity reversed: here the STATIC claim needs a static contrast,
    because nothing else moves.

