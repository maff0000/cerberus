action_summary: >
  *** **PO-DECISIONS-0010 IS IN FORCE AND EXECUTION HAS BEGUN AT ITS RULING 2:
  CD-DISPATCH-WO2R3-INC5C-ENGINEER IS ISSUED at lane `46adf33` to CD-ENG-WO2R3-01 — THE BOUNDED
  COMPLETION OF INCREMENT 5, NOT A SIXTH SCOPE.** ***
  CD-D-134 came back RULED. The class reads **BODY-BORNE OR ABSENT**: establishment derived from the
  declaration is REQUIRED of every fielded public frozen judgement-path type, a zero-field type
  satisfies vacuously, and the instrument asserts over the WHOLE population so a future fielded type
  arriving with no establishment FAILS ON ARRIVAL. The Product Owner took the widening itself and
  said why in terms — "sending a definition I already believe incomplete to assurance would be paying
  for the answer twice" — while leaving the widened definition ATTACKABLE by the fourth seat.
  *** **THE MEASUREMENT THAT SHAPED THIS DISPATCH, AND IT IS THE OPPOSITE OF REASSURING.** ***
  The Project Lead ran the instrument at `46adf33` before writing a word of the dispatch. The ADJACENT
  SET — the hole this completion exists to close — **HAS EXACTLY ONE MEMBER AND IT HAS ZERO FIELDS**:
  `observations.py:170 Empty [RULE C] fields=[]`. Under the ruling, `Empty` satisfies VACUOUSLY.
  **SO THE WIDENING CHANGES NOT ONE PRESENT VERDICT, AND THEREFORE CANNOT BE PROVED BY A GREEN RUN —
  A GREEN RUN IS WHAT THE UNCHANGED INSTRUMENT ALREADY PRODUCES.** A change with no present effect is
  exactly the shape that can be written into a docstring, measured green, and be completely inert.
  The dispatch is built around that single risk: the ONLY accepted proof is a CONTRAST the seat builds
  itself — a fielded frozen judgement-path type with no establishing body, which at `46adf33` EXITS 0
  and is printed as ADJACENT, and which at the returned SHA must EXIT NON-ZERO AND NAME ITSELF. Both
  arms run, the old arm from a pristine extraction. **WITHOUT THAT CONTRAST THE COMPLETION IS NOT
  DELIVERED, AND THE DISPATCH SAYS SO IN THOSE WORDS.**
  *** **THE WRITABLE SCOPE WAS NARROWED, NOT INHERITED.** *** `src/` and `plants/` are PROTECTED for
  this completion — a deliberate departure from the parent dispatch, which had both writable. The
  ruling changes what the instrument ASSERTS OVER, not how establishment works, and the Project Lead
  measured that every member of the widened population already satisfies the widened rule before
  narrowing the scope. **IF THE SEAT FINDS IT NEEDS `src/`, THAT IS A STOP AND A FINDING** — it would
  mean the widening is NOT vacuous on the present population, contradicting the measurement, and that
  is something the Project Lead must hear before any product code is written, not after.

what_the_product_owner_ruled_and_what_this_boundary_did_with_each_ruling:
  ruling_1_the_class_reads_body_borne_or_absent:
    status: 'IN FORCE. Carried into the dispatch objective as items (a), (b) and (c).'
    the_doctrine_it_rests_on_quoted_because_it_is_the_reason_and_not_decoration: >
      "An invariant exists to close forms it never enumerated. A prospective unguarded door is
      precisely what 'by construction' must refuse, and a class definition that only covers types
      which BOTHERED to establish is a census of the present."
    and_the_line_that_lands_on_this_seat: >
      "The Project Lead was right that the widening is not its to take; it is mine, and it is taken."
      **THE PROJECT LEAD RECORDS THAT AS A CONFIRMATION OF THE ROUTING AND NOT AS A COMPLIMENT.** The
      question was routed up because widening a ruled class is a scope decision; the answer came back
      wider than the seat that raised it (CD-ENG-WO2R3-F17) and wider than the seat that routed it
      would have dared to take. That is the third consecutive boundary at which a control of this
      project's own design was found scoped NARROWER than the class it names — CD-D-114, CD-PL-F89,
      and now CD-D-134.
  ruling_2_bounded_completion_not_a_sixth_scope:
    status: 'IN FORCE. It is the dispatch''s own frame and its prohibition list carries it.'
    how_it_was_made_binding_rather_than_stated: >
      The dispatch PROHIBITS re-scoping this into a sixth increment in terms, narrows writable scope
      to six paths, and puts `src/` and `plants/` behind a STOP. "Bounded" is enforced by what the
      seat may write, not by an adjective.
  ruling_3_the_fourth_assurance_seat_immediately_after_the_completion_banks:
    status: >
      **NOT YET EXECUTED, AND DELIBERATELY SO.** Ruling 3 says "immediately after that completion
      banks". The completion has not banked. The full brief — the three CD-D-129 binding clauses, the
      named-target list, the widened invariant as an attackable claim, and FIRST IN THE BRIEF the
      sentence the seat volunteered against itself — is the NEXT boundary and is written into
      next_safe_action so it survives the loss of this context window.
  ruling_4_CD_PL_F90_noted:
    status: 'ACCEPTED. Carried as a documentary correction, direction of error UNDERSTATEMENT.'
    what_it_is: >
      The increment-5 record named ONE refusing rule for V39 where BOTH arms refuse under DIFFERENT
      rules. The Project Lead raised it against its own reconciliation record and the Product Owner
      has noted it. It is corrected among the documentary items and is NOT folded into this dispatch,
      because a documentary correction inside an engineering dispatch is how documentary corrections
      stop being visible.
  ruling_5_the_gate_grading_stays_reserved:
    status: >
      **STANDING AND UNCHANGED.** WO-2R3 remains NOT accepted as closing CD-AC-002 or CD-AC-005.
      That grading belongs to the fourth fresh Assurance seat and to nobody else — **reserved now for
      the SEVENTH BOUNDARY RUNNING.** Nothing in this dispatch, and nothing the Engineer returns, may
      claim it; the dispatch says so in its out-of-scope section.

