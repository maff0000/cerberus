item_A:
  name: 'ESCAPE 1 — THE STORED PAYLOAD IS NOT THE VALIDATED PAYLOAD'
  the_defect_as_this_seat_read_it_off_the_artefact: >
    At 531c95c, in `src/crash_detector/collectors/runner.py`, THREE lines each named
    `response.payload` DIRECTLY — `validator.validate(response.payload, adapter.response_schema)`,
    `empty = adapter.is_empty(response.payload)` and
    `return OK(payload=response.payload, source_as_of_utc=response.source_as_of_utc)`. The middle
    one is DECLARED-FOREIGN CODE (CD-BP-003). Nothing re-validated in between.
    **AND A FOURTH READ THIS SEAT FOUND THAT IS NOT IN THE DISPATCH OR THE AUDITOR''S DOCUMENT:**
    `if not isinstance(response.payload, AbcMapping)` is a fourth separate read of the same
    attribute. On an exact `FetchedResponse` the four reads agree; when ESCAPE 2 has rebound
    `FetchedResponse` in module globals, `payload` is a PROPERTY and each read is the adapter''s
    code running again. **MEASURED: 4 reads at 531c95c, 1 now.**
  why_six_increments_of_readers_were_satisfied_and_it_is_worth_recording: >
    `OK.__post_init__` HAS ALWAYS DONE `object.__setattr__(self, "payload", dict(self.payload))`.
    A top-level copy IS taken — but AFTER the foreign call, so it copies the mutation faithfully.
    A reader who checked "is the payload copied before it is stored" got the answer YES.
  what_changed:
  - '`_payload_snapshot(payload)` and `_snapshot_value(value, depth)` added — a rebuild of `dict`,
     `list` and `tuple` **BY EXACT TYPE** to `PAYLOAD_SNAPSHOT_MAX_DEPTH` levels, with one
     `dict(payload)` at the top because the caller has already established the payload IS a mapping
     and `OK` would call `dict` on it regardless.'
  - '`PAYLOAD_SNAPSHOT_MAX_DEPTH = 32`, PUBLIC and in `__all__`, so the reach of the closure is a
     number a test can pin and a limit can cite rather than an implicit recursion ceiling.'
  - '`raw_payload = response.payload` bound ONCE before validation; the validator, the mapping check
     and the snapshot all read that local.'
  - '`adapter.is_empty(_payload_snapshot(payload))` — a SECOND, INDEPENDENT rebuild, so the object
     foreign code can mutate is neither the judged one nor the stored one.'
  - '`return OK(payload=payload, ...)` — the snapshot is what is stored.'
  the_design_choice_that_is_declared_rather_than_quietly_taken: >
    **IT IS NOT `copy.deepcopy` AND MUST NOT BECOME ONE.** `deepcopy` dispatches to
    `__deepcopy__`/`__reduce_ex__` on whatever it meets, so deep-copying a hostile payload hands the
    adapter ONE MORE EXECUTION POINT — the opposite of the property the function exists for. For the
    same reason the rebuild walks EXACT types and never `isinstance`: walking a foreign mapping
    means calling ITS `keys` and `__getitem__`.
  the_contrast_BOTH_ARMS:
    artefact: 'variants/WO-2R3/P-A-escape1-stored-is-not-validated.py — DURABLE, five arms, and IT
               PRINTS NO VERDICT (F-C1: four probes in this project print verdicts they did not
               earn). Arms 4 and 5 are expected to stay OPEN and are printed anyway.'
    before_arm:
      how: '`git archive 531c95c2c42df51e24d4ce9cdb1f8a0d1818f5c0 | tar -x -C /tmp/base531`,
            PRISTINE, no worktree mutation and no `git worktree add`. Probe copied in; nothing else.'
      command: 'cd /tmp/base531 && python3 -B variants/WO-2R3/P-A-escape1-stored-is-not-validated.py'
      observed: |
        mode=none                 STORED == VALIDATED (text)  : True
        mode=toplevel             STORED == VALIDATED (text)  : False
                                  stored on OK.payload : {"not_in_schema": "\u0000\u0000\u0000",
                                                          "reading": Infinity, "type": "builtins"}
                                  conform to the schema it was judged by?
                                     NO  -> SchemaRejection: JSONSCHEMA_ADDITIONALPROPERTIES at <root>
                                  type(OK.payload) is exactly dict : True
        mode=nested-exact-dict    STORED == VALIDATED : False; OK.payload['nested']['reading'] : inf
                                     NO  -> SchemaRejection: JSONSCHEMA_MAXIMUM at /nested/reading
        mode=nested-dict-subclass STORED == VALIDATED : False; OK.payload['nested']['reading'] : inf
        mode=beyond-depth-cap     STORED == VALIDATED : False; innermost stored dict, 200 levels
                                     down : {'reading': inf}
        every arm: is_empty's argument IS the adapter's live object : True
      what_it_reproduces: 'The auditor''s §2.1 result, INDEPENDENTLY, by this seat''s own run. THE
                           TYPE IS ESTABLISHED AND THE VALUE IS NOT.'
    after_arm:
      command: 'cd /srv/crash-detector-wo2r3 && python3 -B variants/WO-2R3/P-A-escape1-stored-is-not-validated.py'
      observed: |
        mode=none                 STORED == VALIDATED : True
        mode=toplevel             STORED == VALIDATED : True   <- CLOSED; conforms: YES
        mode=nested-exact-dict    STORED == VALIDATED : True   <- CLOSED; nested reading 0.25
        mode=nested-dict-subclass STORED == VALIDATED : False  <- **STILL OPEN, DECLARED LIMIT 5(1)**
        mode=beyond-depth-cap     STORED == VALIDATED : False  <- **STILL OPEN, DECLARED LIMIT 5(2)**
        every arm: is_empty's argument IS the adapter's live object : False
        every arm: validator's argument IS the adapter's live object : True  <- DECLARED LIMIT 5(3)
  carriers_MEASURED_by_reverting_the_fix_in_a_throwaway_copy:
    how: 'The worktree was copied to /tmp/biteA, the two call sites reverted there to their 531c95c
          form, and the module run. THE WORKTREE WAS NOT MUTATED.'
    observed: '**4 failed, 59 passed** — `test_a_hostile_is_empty_cannot_change_the_stored_payload`,
               `test_the_object_is_empty_is_handed_is_not_the_adapters_own_object`,
