               `test_the_snapshot_depth_is_a_declared_number_and_the_residue_below_it_is_real`.
               With the fix: 63 passed.'
    a_carrier_this_seat_wrote_that_did_not_carry_and_says_so: >
      **THE FIRST VERSION OF THE IDENTITY TEST ASSERTED `id(is_empty''s argument) != id(OK.payload)`
      AND IT PASSED IN BOTH ARMS.** It is green at 531c95c WITH THE DEFECT FULLY PRESENT, because
      `OK.__post_init__` copies at the top level regardless. It was found by running the reverted
      tree — the bitten standard applied to this seat''s own carrier — and rewritten to compare
      against the object the ADAPTER returned from `fetch`. **A CARRIER NOBODY TRIED TO BREAK IS A
      CARRIER NOBODY HAS MEASURED**, and this is recorded because the near-miss is the evidence.
  what_the_fix_does_not_reach_CD_RULE_006:
  - 'A container that is not exactly `dict`/`list`/`tuple` is carried BY REFERENCE — a `dict`
     SUBCLASS nested in a payload is still rewritable by the adapter. Executable example: probe arm
     `nested-dict-subclass`, OPEN AT BOTH SHAs. **NOT PROVED TO BE CARRIED ANYWHERE.** PINNED (not
     carried) by `::test_the_snapshot_does_not_reach_a_container_that_is_not_exactly_a_dict`.'
  - 'Anything below `PAYLOAD_SNAPSHOT_MAX_DEPTH` is carried BY REFERENCE. Executable example: probe
     arm `beyond-depth-cap`, 200 levels, OPEN AT BOTH SHAs. **NOT PROVED TO BE CARRIED ANYWHERE**
     beyond the depth assertion in
     `::test_the_snapshot_depth_is_a_declared_number_and_the_residue_below_it_is_real`, which
     asserts the boundary FROM BOTH SIDES so neither the number nor the behaviour can drift alone.'
  - '**THE VALIDATOR IS NOT COVERED AT ALL.** It is the other declared-foreign protocol at this door
     and it is handed the live object before any snapshot exists. **NOT PROVED TO BE CARRIED
     ANYWHERE**; PINNED by `::test_the_validator_is_still_handed_the_adapters_live_object`. Closing
     it would be the sink/ledger/validator table, which is UNVERIFIED BY ANYONE and travels to the
     fifth Assurance seat — **not pre-empted here on purpose.**'
  - 'If the `FetchedResponse` door has itself been defeated by a module-global rebind, `payload` is a
     property; reads went 4 -> 1, which is A NARROWING AND NOT A CLOSURE. **NOT PROVED TO BE CARRIED
     ANYWHERE.**'

