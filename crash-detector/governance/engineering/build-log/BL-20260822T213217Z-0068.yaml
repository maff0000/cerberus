item_E1:
  name: 'THE `required-tests.yaml` "CLOSED AND NOT A LIMIT" LIST — REWRITTEN TO MEASURED REACH'
  authority: 'PO-DECISIONS-0011 ruling 3. The verb is the Product Owner''s: **ORDERED REWRITTEN.**'
  superseded_wording_quoted_and_not_deleted: >
    "…`policy` exact RetryPolicy (isinstance admitted a subclass shadowing max_attempts with a
    property until this increment), `started_utc` exact datetime then rebuilt by ensure_utc, `delay`
    exact DelayKind from a closed enum, and every value the four Protocols RETURN exact-typed at its
    point of return."
  the_whole_list_was_re_read_not_only_the_sentence_the_auditor_quoted: >
    The dispatch requires it and it changed the answer. A new probe,
    `variants/WO-2R3/P-E1-what-is-closed-at-that-door.py`, runs ALL FOUR claims plus the
    `type(response) is not FetchedResponse` door the same list carries by implication, at a pristine
    531c95c extraction and at this tree.
  measured_claim_by_claim:
    policy_exact_RetryPolicy: >
      **HOLDS, AND HOLDS HARDER THAN CLAIMED.** `@admits` compiles its declared types at DECORATION
      time. With `runner.RetryPolicy` REBOUND to an unrelated class, a GENUINE `RetryPolicy` is still
      `ADMITTED final_outcome=OK` and the unrelated class is still `NotAdmitted: collect:
      policy=_NotAPolicy is not admitted; this door requires exactly RetryPolicy`. **AND THE
      PARENTHETICAL IS NARROWER THAN IT READS:** a subclass shadowing `max_attempts` with a property
      CANNOT BE CONSTRUCTED — `AttributeError: property 'max_attempts' of '_ShadowingPolicy' object
      has no setter` — so the door is never reached by that shape at all.
    started_utc_exact_datetime: >
      **TYPE ONLY. IT IS A LIMIT AND NOT A CLOSURE.** subclass -> `NotAdmitted`; naive ->
      `NaiveTimestampRejected`; `datetime(2016,1,1,tzinfo=utc)` -> **`ADMITTED final_outcome=OK`**.
      Already collect's DECLARED LIMIT 2 and now not contradicted by the list above it.
    delay_exact_DelayKind: '**HOLDS.** A frozen look-alike carrying the same `.value`, and the bare
                            `.value` string, are both `NotAdmitted`.'
    every_returned_value_exact_typed: >
      **WITHDRAWN AS A CLOSURE AND NOT RESTATED IN A CORRECTED FORM.** What is true about a returned
      value is now filed as a LIMIT (collect's DECLARED LIMIT 5). Per PO-DECISIONS-0011 ruling 3 and
      SUPPLEMENT-T2-GRADING §3, **IT MAY NO LONGER BE CITED TOWARD CD-AC-002.**
    and_the_door_the_list_carries_by_implication: >
      `type(response) is not FetchedResponse` RESOLVES ITS NAME AT CALL TIME from module globals and
      is therefore NOT of the same strength as `policy`. Reproduced by this seat from an adapter that
      IMPORTS NOTHING from `crash_detector` and reaches the runner''s globals through the frame it
      is called in: `reached module globals of : crash_detector.collectors.runner`,
      `runner.FetchedResponse rebound: True`, `at the door: ADMITTED final_outcome=OK
      {'reading': 0.25}`. **AN EXACT-TYPE DOOR IS ONLY AS STRONG AS WHEN IT RESOLVES ITS TYPE, AND
      THIS ONE MODULE CONTAINS ONE OF EACH.** NOT PROVED TO BE CARRIED ANYWHERE.
  the_three_CD_RULE_004_places_this_correction_lands_in:
  - 'src/crash_detector/collectors/runner.py — `collect`''s DECLARED LIMIT block, item 4 rewritten
     with the superseded wording quoted beside it, and a NEW DECLARED LIMIT 5 for the snapshot.'
  - 'required-tests.yaml — the CD-RT-002-DOORS-REQUIRE-THEIR-TYPES row, superseded wording quoted
     verbatim, replacement measured claim by claim.'
  - 'contracts/execution/CD-RT-002-DOORS-REQUIRE-THEIR-TYPES.md — same, as a table plus DECLARED
     LIMIT 5 in full.'

