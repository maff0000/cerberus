THE_PLANT_SET__RE_MEASURED_IN_THREE_COLUMNS_BECAUSE_A_DEAD_PLANT_EXITS_0:
  the_method: >
    **TWO PRISTINE `git archive` EXTRACTIONS PER PLANT** at `2b67969` — one clean, one violated —
    the DECLARED command taken from `required-tests.yaml` BY `test_id` (derived with
    `yaml.safe_load`, never read from the manifest's prose), **and `git apply`'s OWN EXIT CODE
    RECORDED AS A THIRD COLUMN.** The plant list is `find plants -name '*.patch'`, not a document.
  the_command: |
      $ python3 -c "...yaml.safe_load(required-tests.yaml); map patch stem -> execute..." > /tmp/cmds.tsv
      $ while IFS=$'\t' read -r patch tid cmd; do
            for arm in clean violated; do git archive $SHA | tar -x -C /tmp/pm/$(basename $patch .patch)-$arm; done
            (cd ...-violated && git apply "$patch"); ga=$?
            (cd ...-clean    && eval "$cmd"); c=$?
            (cd ...-violated && eval "$cmd"); v=$?
        done < /tmp/cmds.tsv
