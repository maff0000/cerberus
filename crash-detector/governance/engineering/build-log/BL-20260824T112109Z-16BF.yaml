action_summary: >-
  INCREMENT 16B-FIX — READY_FOR_ASSURANCE. FX1, FX2, FX3 CLOSED BY MEASUREMENT AND FX4
  DECLARED. THE ROOT CAUSE IS GONE RATHER THAN PATCHED THREE TIMES.

  WHAT WAS WRONG, IN THE AUDITOR'S OWN SENTENCE. The instrument enumerated surfaces, slots and
  levels FROM THE CONTRACT — which is why it survives a rename, a reorder and a symmetric fourth
  level — but it HARD-CODED THE DOCUMENT SHAPE. _dial() wrote out the field list of each branch
  by hand, so the union's BRANCH SET was never enumerated, a slot spelled anything other than the
  literal {"$ref": "#/$defs/dial_reading"} was never driven, and the ABSENCE of detail_level was
  never driven at all.

  FX1 — THE ONE THAT MATTERS, AND BOTH HALVES BITE INDEPENDENTLY. #/$defs/dial_reading.oneOf is
  now resolved and EVERY branch is driven, each candidate built from THAT BRANCH'S OWN required +
  properties, with each property's value chosen from a CLOSED DECLARED LIST by what the property's
  OWN subschema accepts — decided by jsonschema, the library the gate itself validates with, and
  NEVER by the property's NAME. Plus the structural half, CD-CALM-BRANCHES-006, deny-by-default in
  the RULE F shape check_no_numeric_default established here: exactly one oneOf branch per declared
  dial state, no duplicates, no extras, every branch resolvable to a properties.state.const, and
  the contract's declared state set exactly the check's own closed DECLARED_STATES. A BRANCH NOBODY
  ANTICIPATED IS A VIOLATION FOR BEING UNRECOGNISED RATHER THAN A SILENCE. Branches are recognised
  by their own state const and NEVER by the name of the $def they live in, which is what keeps the
  pure-rename refactor passing.

  FX2 — THE ROW SAID SOMETHING THAT WAS NOT TRUE, AND NOW IT IS TRUE. A field-ABSENT row
  (detail_level key omitted) and an OFF-VOCABULARY row ("banana", the memorial's own token) are
  back in the proposition table as MUST REFUSE, on every missing-data branch, every slot, both
  surfaces. Both had been asserted by tests/test_detail_level.py since before this instrument
  existed and both were dropped when the property moved into the register: THE LIVE GUARD WAS
  STRICTLY WEAKER THAN THE MEMORIAL IT WAS BUILT TO SUPERSEDE while two governed artefacts said
  "The instrument fails on all of these". Both sentences are superseded in place with what they
  said, that they were false, and what is true instead.

  FX3 — DECLARED LIMIT 4 WAS FALSE AND IS RESTATED IN ALL THREE CD-RULE-004 PLACES. What is DRIVEN
  is every root property spelled exactly {"$ref": "#/$defs/dial_reading"}; what is now ENUMERATED
  FOR COMPARISON is every root property that constrains a dial state under ANY spelling, and
  CD-CALM-SLOTS-007 FAILS THE CHECK if those two sets differ or a root property is undecidable.
  REPORTED IS NOT DRIVEN AND THE LIMIT NO LONGER PRETENDS OTHERWISE. IT FAILS CLOSED AND DOES NOT
  WIDEN THE ENUMERATOR — no third dial slot is added to anything; two dials, never blended, is
  standing product and a third dial is the Product Authority's.

  FX4 — RULING FOLLOWED, AND I DO NOT CONTEST IT. The name coupling D3 imported into the register
  is accepted and recorded as DECLARED LIMIT 12 on CD-RT-001-ABSENCE-RENDERS-UNKNOWN. tests/ was
  NOT edited — zero paths, proved by command. I agree with the ruling on its merits: both
  contracts' own prose names absent_data_detail_level as the enforcement point for a
  CONSTITUTIONAL clause, so a rename that silently repoints it SHOULD cost somebody a think.
  BUT THE DECLARATION IS INCOMPLETE AND I SAY SO RATHER THAN LEAVING IT TO BE FOUND: CD-RULE-004
  wants three places and only ONE of them is inside my writable scope. See F03.

  C10 HELD, WHICH IS THE PROPERTY WORTH MORE THAN THE THREE FIXES. On a tree with a symmetric PID
  §4 fourth level (`critical` in DETAIL_ORDER and in BOTH enums on BOTH contracts) the fixed
  instrument PASSES at 158 assertions — the table grew by 14 on the day the vocabulary grew, with
  no edit to the check. The superseded instrument measured 81 on the auditor's equivalent tree.
  The vocabulary-driven design is intact and was not traded away for the branch enumeration.

  AND THE HOUSE RULE CAUGHT ME. The first generation of C6-C10 was produced with mangled path
  prefixes; `git apply` exited 1 on all five, the "violated" extraction was therefore the CLEAN
  tree, and ALL FIVE ARMS READ PASS. The MANIFEST's `git apply` exit-code column — the control
  CD-ENG-WO2R3-06-F06 put there — caught it on the first run. Regenerated, re-measured, and
  RECORDED RATHER THAN QUIETLY CORRECTED.

  I DID NOT CERTIFY ANY OF THIS (PBG-SOD-001, non-waivable). Nothing was written under
  evidence/required-tests/runs/ — that directory does not exist and I did not create it.

