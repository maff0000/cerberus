item_D:
  name: 'F-A1 — `@establishes()` ON `Empty`'
  what_changed: >
    ONE DECORATOR on `src/crash_detector/observations.py`'s `Empty`, plus the docstring recording
    why it was owed and what it deliberately does not do. `@establishes()` with NO declarations, on
    a type with NO fields — exactly what `establishment.py`'s own docstring prescribes.
  the_trap_checked_first_because_the_dispatch_names_it: >
    "APPLYING `@establishes()` MUST NOT MAKE IT FIELDED, ACCEPT A FIELD, OR CHANGE ONE CONSTRUCTION
    THAT SUCCEEDS TODAY." **NONE OF THE THREE IS TRIPPED, MEASURED RATHER THAN ASSERTED** — probe D
    arm 0, at both SHAs: `Empty()` ***ACCEPTED*** at both; `Empty(confidence=object())` REFUSED
    with the SAME `TypeError: Empty.__init__() got an unexpected keyword argument 'confidence'` at
    both. The instrument still prints `Empty [RULE C] fields=[]`, still `SATISFIED VACUOUSLY`,
    still `establishment ABSENT`. The type is not fielded and accepts no field.

  the_contrast_BOTH_ARMS:
    artefact: >
      `variants/WO-2R3/P-D-empty-is-runtime-unguarded.py`. **IT IS A SCRIPT AND NOT A `.patch`, AND
      THAT IS A DECISION WITH A REASON:** every arm needs `Empty` to GAIN A FIELD, and
      `observations.py` is edited by this very increment, so a patch cut at 531c95c would fail
      `git apply` on context drift at the increment-6 tree — T7 records four corpus patches that
      did exactly that. The script locates `Empty` IN THE AST and inserts the field there, so it
      applies at any SHA where the class exists, and it prints the file and line it edited. It
      copies the tree to a temporary directory; **NOTHING IS MUTATED.**
    before_arm:
      how: '`git archive 531c95c... | tar -x -C /tmp/base531`, PRISTINE.'
      command: 'cd /tmp/base531 && python3 -B variants/WO-2R3/P-D-empty-is-runtime-unguarded.py'
      observed: |
        arm 0 BASELINE   is_establishing_type(Empty) : False
                         Empty()                     : ***ACCEPTED***
                         Empty(confidence=object())  : REFUSED TypeError ... unexpected keyword
        arm 1 STATIC     exit=0  PASS — 97 assertions, 0 violations
        the edit         src/crash_detector/observations.py:181: confidence: object = None
        arm 2 STATIC+1   VIOLATION  src/crash_detector/observations.py:170
                         FAIL — 1 violation(s)     exit=1
        arm 3 RUNTIME+1  is_establishing_type(Empty) : False
                         Empty()                     : ***ACCEPTED***
                         Empty(confidence=object())  : ***ACCEPTED***
      reading: >
        **F-A1 REPRODUCED INDEPENDENTLY BY THIS SEAT.** The instrument's claim "add one field and
        it becomes REQUIRED on the same run" IS TRUE — arm 2 exits 1. AND NOTHING REFUSES THE
        OBJECT. "FAILS ON ARRIVAL" was a STATIC CHECK LINE ONLY for the one member the widening
        added. **ARM 2 IS NOT THE PROOF AND THE PROBE SAYS SO IN ITS OWN OUTPUT.**
    after_arm:
      command: 'cd /srv/crash-detector-wo2r3 && python3 -B variants/WO-2R3/P-D-empty-is-runtime-unguarded.py'
      observed: |
        arm 0 BASELINE   is_establishing_type(Empty) : True      <- CHANGED
                         Empty()                     : ***ACCEPTED***             <- UNCHANGED
                         Empty(confidence=object())  : REFUSED TypeError ...      <- UNCHANGED
        arm 1 STATIC     exit=0  PASS — 100 assertions, 0 violations
        the edit         src/crash_detector/observations.py:207: confidence: object = None
        arm 2 STATIC+1   VIOLATION  src/crash_detector/observations.py:171
                         FAIL — 1 violation(s)     exit=1        <- UNCHANGED, as F-A1 predicted
        arm 3 RUNTIME+1  Empty()                    : REFUSED UndeclaredField: Empty is a FAULTED
                           type and every construction of it is refused. field 'confidence' is in
                           the DECLARED FIELD LIST of Empty and was NOT declared to establishes().
                         Empty(confidence=object()) : REFUSED UndeclaredField (same text)
      reading: >
        **THE RUNTIME ARM IS THE PROOF AND IT MOVED FROM ACCEPTED TO `UndeclaredField` ON EVERY
        CONSTRUCTION — INCLUDING `Empty()`, WHICH SUCCEEDS TODAY.** That is what "fails on arrival"
        means in this module's vocabulary, and it is now true of this member.

