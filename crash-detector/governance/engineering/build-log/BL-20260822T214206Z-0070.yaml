findings_raised_by_this_seat:
- id: CD-ENG-WO2R3-02-F04
  severity: MEDIUM
  against: 'the shipped test suite, not any seat'
  what: >
    **TWO GREEN TESTS ASSERTED THE ABSENCE OF THE GUARD F-A1 FOUND MISSING, AND SO MADE THE ORDERED
    FIX A TEST FAILURE.** `test_the_vacuously_satisfying_members_are_exactly_this_set` asserted
    `not is_establishing_type(Empty)`, and
    `test_the_static_enumeration_and_the_runtime_population_are_the_same_class` asserted the vacuous
    set was DISJOINT from the runtime governed set. A declared residue was converted into an
    enforced one.
  the_general_shape_and_why_it_is_worth_more_than_this_instance: >
    A test that PINS A RESIDUE and a test that CARRIES A CLOSURE look identical from the outside:
    both are green, both name a set, both fail if the set moves. **THEY POINT IN OPPOSITE
    DIRECTIONS AND NOTHING IN THIS TREE DISTINGUISHES THEM.** This seat has hit the same ambiguity
    from the other side in item A, where two of its own new tests are PINS and four are CARRIERS,
    and the only thing separating them is a sentence in each docstring.
  disposition: >
    **RAISED, AND THE TWO INSTANCES ARE DISPOSITIONED HERE UNDER PO-DECISIONS-0011 RULING 1 ITEM
    (d).** THE GENERAL PROBLEM — that this codebase cannot tell a pin from a carrier — IS NOT
    FIXED, IS NOT MINE TO FIX, AND IS NOT AMONG ITEMS A-E. Raised for the Product Owner and left
    open for the fifth Assurance seat. **NOT PROVED TO BE CARRIED ANYWHERE.**
- id: CD-ENG-WO2R3-02-F05
  severity: LOW
  what: >
    **A NODE-ID SET DIFF CANNOT SEE AN ASSERTION REVERSED INSIDE A SURVIVING TEST.** This
    increment's declared reconciliation method — the one the dispatch specifies — reports ZERO LOST
    for a commit that reversed two shipped assertions. The method is right for what it measures and
    it does not measure this.
  disposition: 'RAISED. Not fixed — a stronger reconciliation is not among items A-E. Disclosed so
                the Project Lead''s reconciliation does not read "LOST: ZERO" as "nothing moved".'

