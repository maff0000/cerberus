the_stop_this_entry_exists_for:
  what_happened: >
    Applying the decorator turned the suite RED: **2 failed, 1542 passed** —
    `tests/test_field_establishment.py::test_the_static_enumeration_and_the_runtime_population_are_the_same_class`
    and `::test_the_vacuously_satisfying_members_are_exactly_this_set`.
  what_they_were_asserting_quoted_from_the_artefact:
  - 'assert vacuous & runtime == set(), sorted(vacuous & runtime)  — with the reasoning "The
     ZERO-FIELD part satisfies VACUOUSLY, so it is diffed in the OTHER direction — IT MUST BE
     DISJOINT FROM THE RUNTIME GOVERNED SET."'
  - 'assert not is_establishing_type(cls), "…is governed at runtime but the check reads it as
     satisfying vacuously — the two readings disagree"  — with the reasoning "carries no boundary
     of any kind. THAT IS A RESIDUE, NOT A CLOSURE."'
  the_reading_and_it_is_the_finding_of_this_item: >
    **TWO GREEN TESTS REQUIRED THE ABSENCE OF THE GUARD.** They did not merely fail to catch F-A1 —
    **THEY MADE FIXING IT A TEST FAILURE.** Any seat that had reached for the decorator the
    mechanism's own docstring prescribes would have watched the suite go red and, quite reasonably,
    concluded the decorator was wrong. The declared limit these tests carry called the vacuous
    branch "a residue, not a closure", which was HONEST — and then pinned the residue in place with
    an assertion, so honesty about the limit became enforcement of it. **THIS IS THE SAME SHAPE AS
    THE DEFECT THE WHOLE INCREMENT EXISTS TO REPAIR: A DECLARATION THAT TOLD ITS READER THE SHAPE OF
    A LIMIT, AND THE READER BELIEVED IT.** Here the reader was the test suite.
  disposition_and_why_it_is_not_a_weakening: >
    **BOTH ASSERTIONS ARE REVERSED, NOT RELAXED, AND THE SUPERSEDED WORDING IS QUOTED IN EACH TEST'S
    OWN DOCSTRING (PBG-CONT-003).** The replacements require MORE of the system: every member the
    static reading enumerates — FIELDED OR VACUOUS — must now be governed at runtime, and a
    vacuously satisfying member must BE an establishing type. Nothing was deleted, no assertion was
    dropped, no `xfail` and no exemption was added. **THE PROHIBITION THIS SEAT WAS CHECKING ITSELF
    AGAINST IS "weakening a check, a test or an assertion to obtain a pass". A REVERSAL ORDERED BY
    PRODUCT AUTHORITY, THAT MAKES THE ASSERTION STRICTER, IS NOT THAT** — but it is a judgement, it
    is this seat's, and it is on the record here to be attacked rather than buried in a diff.
  what_this_seat_did_NOT_do: >
    It did not touch the mechanism. `establishes`, `admits` and the instrument are unchanged —
    `sha256sum tools/register/check_constructor_field_establishment.py` equals
    `git cat-file blob HEAD:tools/register/check_constructor_field_establishment.py`, both
    `173a325519d48d785fb0c0a034c4a24d4510e3f31f56f08f8d21fb81789be759`.

