    magnitude. MEASURED as V12: check_no_blend FAILS with two RULE 4 violations while the RUNTIME is
    NOT refused and publishes 0.5.
  carried_by: >
    "NOT PROVED TO BE CARRIED ANYWHERE AT RUNTIME." RULE 4 is the only layer over it and RULE 4 is
    static, so the residue inherits every limitation in the list. Its own residues are an edit to
    DECLARED_ADMISSION_SITES itself, a module outside the scanned set (boundary 4) and a dynamically
    assembled door name (boundary 5). V13 shows importlib + getattr with a whole string IS caught.
- id: 'BOUNDARY B OF magnitude.py — CORRECTED. object.__setattr__ has two directions.'
  was: '"There is no forgery of provenance that yields a number", presented as covering the residue.'
  now: >
    True of forging the PROVENANCE — that makes the magnitude LESS usable. FALSE of forging the
    VALUE: object.__setattr__(q, "_DeclaredQuantity__value", <a blend>) changes the number in place
    so nothing is ever constructed and the re-entry closure is never reached. MEASURED as V17, NOT
    refused at runtime. "NO RUNTIME LAYER CARRIES THIS AND NONE IS CLAIMED TO." RULE 3 carries it
    statically; no Python-level structure can prevent an in-place slot rewrite.
- id: 'BOUNDARIES 1, 2, 3 and 5 — unchanged, and RE-MEASURED rather than inherited (CD-RULE-006).'
  text: 'All four hand their residue to the TYPE LAYER, and E01 and E02 both raise TypeError when
    executed at this commit. The sentences stand because they were re-tested, not because they were
    already written.'
- id: 'THE CLAIM WITHDRAWN FROM CD-RT-002-TYPE-NO-ARITHMETIC.md'
  text: '"reducing one to a number requires naming its single dial" is withdrawn as false. repr,
    str, format, f-strings, json.dumps over __getstate__, pickle bytes and getattr on the private
    slot are all named as release doors. What replaced the claim is measured: THE SUM CANNOT BECOME
    A MAGNITUDE AGAIN.'
- id: 'TWO STALE SENTENCES WITHDRAWN FROM variants/WO-2R/MANIFEST.md'
  text: 'It told a future auditor that a released blend is "unpublishable" and to "attack the
    PUBLICATION path, not the type". That is the advice that sent the Project Lead''s attention to
    the layer where the defect was not, which is what CD-RULE-006 now forbids. Replaced by the
    measured account.'
- id: 'CD-RT-002-AST-NO-BLEND remains scope: INSTANCE'
  text: 'Unchanged from increment 2 and deliberately. RULE 4 denies by default and is therefore
    class-shaped in KIND, but the check as a whole is still a static intra-procedural read of source
