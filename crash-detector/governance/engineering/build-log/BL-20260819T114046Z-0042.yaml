findings_raised:
- id: CD-ENG-WO2R-F10
  severity: LOW
  against: 'this seat''s own work, and the plant it inherited'
  finding: >
    The CD-RT-002-TYPE-NO-ARITHMETIC plant''s contrast NARROWED from six failures to two because the
    re-entry closure defeats the plant''s own __add__ before it can blend. The plant still applies,
    still exits non-zero and still fires only its own arm, so CD-D-033 is satisfied; but its
    recorded demonstration — ((e + m) / 2.0).score reading 0.5 — no longer holds, and it is now
    closer to a token dunder than the manifest''s argument for it claims.
  what_was_done: >
    The MANIFEST row was rewritten to state the new signature, name the four tests that stopped
    firing, and say why. The plant was DELIBERATELY NOT rewritten to blend through the admission
    door: a plant calling observed_for_dial from scores.py would also fire RULE 4 and destroy
    CD-AC-002''s three-test independence, which is the CD-PL-F53 hazard. The next Assurance seat
    should treat this plant as evidence for the surface assertion only and devise its own for the
    blend.
- id: CD-ENG-WO2R-F11
  severity: MEDIUM
  against: 'this seat''s own closure'
  finding: >
    THE RE-ENTRY CLOSURE CANNOT SEE A NUMBER THAT NEVER RE-ENTERS. V17 overwrites
    _DeclaredQuantity__value in place on the quantity a live magnitude already holds, via
    object.__setattr__. Nothing is constructed, so no constructor is reached, and the magnitude then
    reads the blend. NOT REFUSED at runtime.
  what_was_done: >
    Boundary B in magnitude.py and the matching paragraph in provenance.py were CORRECTED — the
    inherited text said the object.__setattr__ residue was safe, which is true of the provenance
    direction and false of the value direction — and both now read "NO RUNTIME LAYER CARRIES THIS
    AND NONE IS CLAIMED TO". RULE 3 was extended from one private slot to two so the static layer at
    least reports it. No Python-level structure can prevent an in-place slot rewrite, and a guard
    claiming to would be claiming something Python does not offer.
  honest_qualification: >
    This seat did NOT find a route to the second private slot that avoids naming the first, so V17
    already produced four RULE 3 violations before the extension. THE RULE 3 EXTENSION IS THEREFORE
    PROPHYLACTIC — closing a name the closure created — AND NOT THE REPAIR OF A MEASURED ESCAPE. It
    is recorded that way in the variant row rather than presented as a catch.
- id: CD-ENG-WO2R-F12
  severity: MEDIUM
  against: 'the structure this seat built'
  finding: >
    THE ADMISSION DOOR IS THE WHOLE RESIDUE AND IT IS WHERE THE NEXT ESCAPE WILL BE. V12, V13 and
    V15 all publish a blend at runtime and are stopped only by a STATIC rule over a written list of
    four modules. Boundary 7 says so, but the shape of the risk deserves naming on its own: this
    closure converted an undecidable question into a decidable one at the cost of concentrating the
    residual trust into one function, and the layer guarding that function inherits every limitation
    of static analysis — including that a module outside src/crash_detector/ and deploy/entrypoints/
    is not scanned at all.
  recommendation: >
    For the WO-3 dispatch, not for this seat: a runtime check that the number a
    ContributionModel returns is the number that was admitted, which would give the admission door
    an independent second layer. It cannot be built in WO-2 because no model is registered and no
    ingredient source exists (CD-D-005, owed by the Product Owner). NOT attempted here — it needs
    product data this seat may not invent (CD-RULE-003).
- id: CD-ENG-WO2R-F13
  severity: LOW
  against: 'this seat''s own work'
  finding: >
    dial_id is now stated TWICE at every magnitude construction — once to observed_for_dial and once
    to DialMagnitude — and the set-equality comparison between them is the point. A reader may
    reasonably read it as redundant and "simplify" it by deriving one from the other, which would
    remove the comparison and with it the closure.
  what_was_done: >
    The reason is written at both sites, in DialMagnitude.__init__''s docstring and in the comment at
    the one product admission site in evaluate.py. Recorded here so that a future seat that removes
    it has to remove a written warning to do so.

