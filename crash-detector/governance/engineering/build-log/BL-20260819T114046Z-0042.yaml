the_class_closed: >
  PROVENANCE-FORGETTING RE-ENTRY. Any float that has left a DialMagnitude by ANY route — repr, str,
  format, an f-string, %-formatting, pprint, a log line, a traceback, json.dumps over __getstate__,
  the bytes of a pickle, getattr on the private slot, or a protocol nobody here has heard of — has
  lost its dial, and can no longer become a dial magnitude.

  THE STRUCTURE. src/crash_detector/dials/provenance.py defines DeclaredQuantity: a sealed, slotted,
  non-coercible pairing of a finite float with the frozenset of dials its derivation touched.
  DialMagnitude's constructor admits a DeclaredQuantity and nothing else, comparing q.dials to
  dial_id by SET EQUALITY in both directions. Exactly two doors establish a provenance —
  observed_for_dial(), which admits a measurement from outside for ONE named dial citing the
  non-empty set of sources it came from, and combine_within_one_dial(), whose dial set is COMPUTED
  by the machinery as the union of the magnitudes the caller had to be holding and refused unless it
  is exactly one. DeclaredQuantity itself defines no arithmetic dunder, so no expression produces a
  third declared quantity from two.

  WHY IT IS A CLASS CLOSURE AND NOT A LONGER LIST. It enumerates no laundering route and does not
  need to know one existed; it removes the destination they all share. Increment 2 answered "can the
  type be ASKED for a number?" and answered it well — nine of eleven Project Lead probes refused,
  including every alternate coercion protocol. But every exit it left open, and every exit Python
  will add later, ends in the same place: a bare float in somebody's hand. Chasing exits is the
  instance game, and the exit list has no last member. So the question changed from "is this number
  blended?", undecidable, to "is this number's provenance DECLARED?", set equality — the same move
  increment 1 made for absence, applied to the step increments 1 and 2 both left open.

  THE EVIDENCE THAT IT IS NOT A REPR FIX is V16: laundering through an f-string and through a JSON
  round trip, with no repr anywhere. Both leaks succeed and both re-entries are refused.

the_contradiction_resolved: >
  THE DISPATCH REQUIRED A CHOICE AND THIS SEAT CHOSE (ii), DECLARATION, AND THEN CLOSED THE CLASS
  ANYWAY SO THAT (ii) IS NOT THE WHOLE ANSWER.

  contracts/execution/CD-RT-002-TYPE-NO-ARITHMETIC.md disclosed that repr renders the quantity and
  claimed six lines later that reducing a magnitude to a number requires naming its single dial.
  Both could not be true and the second was false.

  repr STAYS. Hiding a value from a developer's own debugger is obfuscation and obfuscation is not
  structure; the inherited argument is right and this seat did not overrule it. Two further reasons
  it would have been the wrong repair: repr is one member of an exit class with no last member, so
  closing it moves the same attack one line sideways to str, to format, to json.dumps, to the pickle
  bytes; and a non-round-trippable repr is a boundary made INCONVENIENT rather than a boundary
  written down, which CD-RULE-004 prefers against. repr(EQUITY) is asserted BYTE-IDENTICAL to
  a94ef97 by a declared test.

  THE CLAIM IS WITHDRAWN, in magnitude.py boundary A and D, in provenance.py, in the register entry
  and in CD-RT-002-TYPE-NO-ARITHMETIC.md, and repr is NAMED as a release door alongside quantity_for
  and reflection. Two tests assert the limit is still true rather than letting it lapse quietly:
  test_the_exits_are_open_and_that_is_declared and
  test_two_released_numbers_still_add_and_that_is_declared.

  AND BECAUSE CD-RULE-004 DOES NOT PERMIT DECLARING THE FINDING AS THE LIMIT, the laundered-float
  class is closed at the re-entry. CD-ASR-F01's laundering half is CLOSED, not declared. What is
  declared is the admission door beneath it (boundary 7) and the in-place slot rewrite (boundary B),
  and neither is handed to a layer that has not been measured.

