decisions_ruled_here:
- id: CD-D-101
  ruling: >
    PO-PRODUCT-0001 IS RECORDED AS WO-4 SCOPE AND APPLIED TO NOTHING IN WO-2R3. It is ratified product
    content and it is therefore BINDING WHEN WO-4 IS DRAFTED — recorded in remaining_items alongside
    PO-DECISIONS-0005 ruling 3 condition (b), so a WO-4 dispatch cannot be written without meeting
    R1-R5 and the standing joint review gate. IT IS NOT FOLDED INTO THE RUNNING INCREMENT, for the
    reason the document itself gives and for one more the Project Lead adds: R2, R3 and R4 all need
    REGISTERED SOURCES AND REGISTERED MODELS, and WO-2 ships both registries EMPTY BY DESIGN because
    that empty state is what makes CD-AC-001's plant demonstrable and what keeps CD-D-005 visibly
    owed. Acting on R4 now would mean registering a row to satisfy a requirement whose data
    prerequisite the Product Owner has scheduled for WO-3.
- id: CD-D-102
  ruling: >
    THE FOUR PROPOSITIONS THAT LOST END-TO-END COVERAGE AT CD-D-097 ARE ENTERED IN remaining_items AS
    DURABLY OWED TO CD-D-005, per PO-DECISIONS-0006 ruling 3. A decision document is visibility; the
    resumable record is the thing the next seat actually boots into, and an obligation that lives only
    in a document nobody re-reads is how a priced loss becomes an accidental one. They are: a
    satisfied dial reading `Value` with its inputs named; a contributing-input absence rendering
    `Degraded` with its reason and missing source; a live evaluation stamping each dial's own score
    type; and a live `as_of_utc`. THEY MAY NOT BE RESTORED BY INVENTING A COMPUTING `MappingKind`
    MEMBER (CD-D-097, confirmed by the PO in terms).
- id: CD-D-103
  ruling: >
    INCREMENT 2 IS DISPATCHED TO THE SAME SEAT UNDER THE SAME LIVE DISPATCH, AND THE DISPATCH RECORD
    IS NOT AMENDED. The record is ISSUED and unexhausted; four increments are declared in it and one
    is delivered. A resumption inside a live dispatch is not a new dispatch. The alternative — a
    fresh actor_id per increment — would make the git author audit unable to say which seat built
    which structure (CD-RULE-002's purpose) and would discard the seat's own disclosed findings
    against itself between increments 1 and 2.

