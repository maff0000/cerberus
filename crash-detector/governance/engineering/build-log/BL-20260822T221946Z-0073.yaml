item_E2:
  where: 'src/crash_detector/admission.py, DECLARED LIMIT 1 (c).'
  superseded_wording_quoted_not_deleted: >
    "**WHAT IS AND IS NOT DEFEATED BY (c).** It is NOT a caller route: it needs the ability to
    execute code inside the package."
  why_it_is_wrong_RE_MEASURED_BY_THIS_SEAT: >
    **IT IS A CALLER ROUTE, AND THE REASON IS THAT PASSING AN OBJECT TO THAT DOOR *IS* THE ABILITY
    TO EXECUTE CODE INSIDE THE PACKAGE.** `collect` calls methods on caller-supplied objects
    interleaved with its own establishment sequence, and every one of those calls runs caller code
    in a frame whose `f_back` chain reaches this package's module globals.
  measured: |
    variants/WO-2R3/P-E23-what-the-in-package-execution-sentence-gets-wrong.py arm 2, from a
    caller importing NOTHING from crash_detector for its leverage:
      members of the ADAPTER `collect` touched : 13
      ... of which are CALLS into caller code  : ['fetch', 'is_empty']
      members of the SINK touched              : ['record']
      members of the LEDGER touched            : ['admit_if_absent']
      reached module globals of                : crash_detector.collectors.runner
      could read runner.ensure_utc from there  : True
      final_outcome                            : OK
    and INDEPENDENTLY by P-E1-what-is-closed-at-that-door.py arm (iv), which does not merely READ
    that global but REBINDS it and walks a property-backed look-alike through the
    `type(response) is not FetchedResponse` door:
      runner.FetchedResponse rebound: True
      at the door: ADMITTED final_outcome=OK {'reading': 0.25}
  what_survives_and_it_is_narrower_than_it_sounded: >
    BP-AMENDMENT-0001 §D.3 part 1's claim is about what a caller can supply **AS A PARAMETER**, and
    THAT claim stands: `clock` and `sleep` are not parameters and the interpreter refuses to pass
    them. **THAT IS A STATEMENT ABOUT THE SIGNATURE, NOT ABOUT WHAT A CALLER CAN REACH ONCE IT IS
    INSIDE.** The two ran together in one sentence and **the second was read off the first** — which
    is this increment's whole failure mode, in one clause.

item_E3:
