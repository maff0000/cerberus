findings:
- id: CD-ENG-WO2R3-02-F09
  severity: MEDIUM
  raised_because_the_dispatch_invites_it: >
    "If you believe the route should be closed, RAISE IT AS A FINDING — the asymmetry the auditor
    names (the dials layer defends against exactly this and the establishment layer does not) is a
    genuine question for the Product Owner."
  what_is_measured: >
    **2 OF 33 GOVERNED TYPES DEFINE `__setstate__`: `FreshnessEvidence` AND `StalenessWindow`.**
    Arm 3, after importing the whole package with `pkgutil.walk_packages`. `__setstate__` is the
    technique THIS CODEBASE ALREADY USES to refuse an object rebuilt without its constructor. It is
    applied to two staleness types and to none of the witness, reading, score, config or
    observation types — including `Agrees`, which is the type CD-AC-005's prohibited outcome is
    named in.
  the_measurement_artefact_disclosed_rather_than_glossed: >
    `governed_types()` is a registry POPULATED AT IMPORT, so its size depends on what has been
    imported. Read after the probe's own four imports it says **13** (531c95c) / **14** (here) —
    **A NUMBER ABOUT THE PROBE, NOT THE PRODUCT.** The probe now prints BOTH figures and imports the
    whole package before taking the real one. **THE FIRST VERSION OF THIS ARM PRINTED ONLY THE
    SMALL NUMBER**, and it would have been a figure in a governed record that measured the
    instrument. Corrected before landing; recorded because it is the same class of defect as
    everything else in this increment.
  what_is_NOT_claimed: >
    **THIS IS NOT A RECOMMENDATION TO APPLY `__setstate__`.** Whether the establishment layer should
    defend against reconstruction, or whether the asymmetry is deliberate and the staleness types
    are special for a reason this seat has not read, is the Product Owner's. **A SEAT THAT CORRECTS
    A SENTENCE ABOUT A ROUTE AND THEN CLOSES THE ROUTE HAS DECIDED A DESIGN QUESTION ON ITS OWN
    AUTHORITY.**
  disposition: 'RAISED AND OPEN. Travels to the fifth Assurance seat and to the Product Owner.'

