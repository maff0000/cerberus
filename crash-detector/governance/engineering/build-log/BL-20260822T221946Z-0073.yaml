  superseded_wording_quoted_not_deleted: >
    "Every route requires the ability to execute code inside this package, which is the universal
    limit every in-process guard on this project lives inside; saying that is strictly weaker than
    'cannot happen', and it is said rather than implied."
  too_narrow_MEASURED_AT_ZERO: |
    Arm 1 counts every line executed under src/crash_detector/ with sys.settrace, because "the
    ability to execute code inside the package" is a claim ABOUT LINES and is therefore answered by
    counting lines rather than by argument:
      is_establishing_type(Agrees)            : True
      Agrees is in governed_types()           : True
      LINES OF PACKAGE CODE EXECUTED BY THAT  : 0
      package files touched                   : []
      type(smuggled) is exactly Agrees        : True
      isinstance(smuggled, Agrees)            : True
      smuggled.as_of_utc                      : 'not a datetime'
      smuggled.divergence_measure             : object
      CONTROL — the same values through Agrees(...): REFUSED TypeError
      LINES OF PACKAGE CODE EXECUTED BY THE CONTROL: 36
    **36 LINES THROUGH THE FRONT DOOR AND A REFUSAL; 0 LINES AROUND IT AND AN OBJECT.** The
    superseded sentence stated a precondition this route does not have to meet. NOT "little
    package code" — NONE.
  too_wide: >
    The CD-BP-003 door HANDS in-package execution to any caller (arm 2 above), so it is not a bar
    anyone has to clear. **THE SENTENCE OVERSTATED THE PRECONDITION FOR THE ROUTES IT NAMED AND
    UNDERSTATED WHO ALREADY HAS IT** — the auditor's reading, re-measured here rather than adopted.
  the_measured_reach_that_replaces_it: >
    These routes are open to anything that can either RUN IN THIS PROCESS AT ALL — which for the
    `__new__`/`__dict__` route is the WHOLE precondition, and it is not a package-code precondition
    — or BE PASSED TO THE CD-BP-003 DOOR, which hands in-package execution to any caller rather
    than requiring it of them. **"IN-PACKAGE EXECUTION" IS NEITHER NECESSARY NOR SCARCE, AND IT WAS
    OFFERED AS BOTH.** NOT CLOSED, NOT CLAIMED, NOT PROVED TO BE CARRIED ANYWHERE — that much of
    the old sentence stands, and it is the only part that did.

