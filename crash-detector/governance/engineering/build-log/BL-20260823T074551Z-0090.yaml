THE_FINDING_THAT_MATTERS_MOST__AND_IT_IS_AGAINST_THE_DISPATCH_AND_THE_STANDING_RECORD:
  CD_ENG_WO2R3_07_F01__HIGH__THE_NAMED_REMEDY_DOES_NOT_CLOSE_THE_PROPERTY: >
    **`@dataclass(frozen=True, slots=True)` IS A FALSE-GREEN FACTORY AND THE DISPATCH NAMES IT AS
    THE AVAILABLE MECHANISM** (ITEM_1, `what_you_must_build`, bullet 4). CPython's
    `dataclasses._add_slots` ends with two UNCONDITIONAL lines
    (`/usr/lib/python3.11/dataclasses.py`):

        if is_frozen:
            cls.__getstate__ = _dataclass_getstate
            cls.__setstate__ = _dataclass_setstate

    `_dataclass_setstate` writes EVERY key it is given through `object.__setattr__`, with no
    validation, and it is stdlib — **ZERO LINES OF PACKAGE CODE**. So a class sealed that way
    passes `"__slots__" in vars(cls) and not cls.__dictoffset__` — the exact test BOTH handed-over
    readings used — and is still forgeable by the `__setstate__` sibling THE RULING ITSELF NAMES.
    **HAD I APPLIED THE NAMED REMEDY TO ALL 36, THE INSTRUMENT WOULD HAVE GONE GREEN ON A CLASS
    THAT WAS STILL OPEN ON EVERY MEMBER OF IT.**
  AND_THE_TREE_ALREADY_CONTAINED_THE_PROOF__2_OF_THE_13_SUPPOSEDLY_SEALED_ARE_FORGEABLE: |
      $ python3 -B -c '...; o = FreshnessEvidence.__new__(FreshnessEvidence);
                       o.__setstate__({"as_of_utc":"F","observed_at_utc":"F","window":"F"})'
      -> FORGED exact=True values={'as_of_utc': 'F', 'observed_at_utc': 'F', 'window': 'F'}
      StalenessWindow  slots=('seconds',)  dictoffset=0  __setstate__ = dataclasses._dataclass_setstate
      FreshnessEvidence slots=('as_of_utc','observed_at_utc','window') dictoffset=0  ditto
      Value / Degraded / Unknown / Shown / NotShown / _Admission / _Exactly / _EachOf /
      _EstablishedHere:  __setstate__ ABSENT  (manual `__slots__`, so `_add_slots` never ran)
      DialMagnitude / DeclaredQuantity: __setstate__ DEFINED BY THIS PACKAGE and it VALIDATES.
  CD_ENG_WO2R3_07_F02__MEDIUM__THE_STANDING_RECORD_NAMES_THE_WRONG_TWO_TYPES: >
    `src/crash_detector/establishment.py:271` and `src/crash_detector/admission.py:341` both say:
    *"The `__setstate__` technique this codebase already applies elsewhere — arm 3 measures it at
    2 of 33 governed types, `FreshnessEvidence` and `StalenessWindow` — WOULD CLOSE IT"*, and
    `CD-ENG-WO2R3-02-F09` is raised on that basis. **MEASURED, THAT SENTENCE IS INVERTED.** Those
    two types do not DEFINE a `__setstate__`; they RECEIVE the stdlib one, and it is the thing
    that OPENS the route on them. The two types that DEFINE a defending `__setstate__` are
    `DialMagnitude` (`dials/magnitude.py:491`) and `DeclaredQuantity` (`dials/provenance.py:623`),
    both of which revive through the same validation the constructor uses. **THE TECHNIQUE THE
    RECORD RECOMMENDS IS REAL AND IT IS APPLIED IN TWO PLACES; THE RECORD POINTS AT THE TWO PLACES
    WHERE THE OPPOSITE IS TRUE.** Those two prose sentences are NOT edited here — corrections
    supersede (PBG-CONT-003) — and the correction is this entry.

