THE_MECHANISM_I_APPLIED__AND_WHY_IT_IS_THE_TREES_OWN_AND_NOT_MINE:
  what: >
    **`@dataclass(frozen=True)` PLUS A MANUAL `__slots__` IN THE CLASS BODY.** That is exactly
    what `Value`, `Degraded`, `Unknown`, `Shown` and `NotShown` already do, and `_add_slots` never
    runs for them, so no stdlib `__setstate__` is installed. 34 of the 36 take this form.
  the_two_that_could_not: >
    **`FetchFailed` and `Malformed` CARRY A FIELD DEFAULT**, and a manual `__slots__` beside a
    class-level default is a hard `ValueError: 'http_status' in __slots__ conflicts with class
    variable` AT CLASS CREATION, before any decorator runs — measured, not assumed. They therefore
    take `@dataclass(frozen=True, slots=True)` **followed by `del FetchFailed.__setstate__`** at
    module level, with the reason written beside it. Removed rather than overridden because
    `_add_slots` installs it AFTER the class body has been read.
  WHY_NO_DECORATOR_AND_NO_NEW_PACKAGE_MODULE__THIS_WAS_MEASURED_AND_THEN_REVERSED: >
    **THIS SEAT FIRST BUILT `src/crash_detector/sealing.py`** — a decorator that measured
    `__dictoffset__`, removed a non-package `__setstate__`, and RE-RAN THE ROUTES AT IMPORT so the
    seal was proved on every import. **IT WAS DELETED, AND THE REASON IS THE PROTECTED SCOPE.**
    Measured with `python3 -B -m pytest -q`:
      with `sealing.py`:  CD-CLASS-2-SWEEP: FAIL — 589 sites, **12 violations**;
                          `UNDECLARED MODULE: crash_detector.sealing` (tier-2 keys 27 of 27) plus
                          **6 UNDECLARED ADMISSION rows**; 6 failed / 1684 passed.
      without:            CD-CLASS-2-SWEEP: FAIL — 555 sites, **4 violations**; 3 failed / 1687
                          passed — **EXACTLY THE DECLARED STATE OF THE BASE.**
    The sweep's subject set is the transitive intra-package IMPORT closure, so ANY new package
    module a governed module imports enters it; and the only file where its dispositions can be
    declared is `tools/sweep/declared_dispositions.py`, **WHICH IS PROTECTED UNTIL AFTER THE
    SEVENTH ASSURANCE SEAT (PO-DECISIONS-0017 ruling 2).** Declaring them there would have been
    exactly the act the previous Engineer refused. **I DID NOT WIDEN SCOPE AND I DID NOT SHIP THE
    MODULE; I CHANGED THE DESIGN SO THE SEAL NEEDS NO NEW MODULE.**
  WHAT_THAT_COSTS__STATED_AS_A_MEASURED_LIMIT_AND_NOT_OMITTED: >
    **THERE IS NO IMPORT-TIME REFUSAL.** A class added tomorrow without `__slots__` imports
    cleanly; nothing in the package objects. What catches it is the INSTRUMENT (ITEM_1 PART B),
    which is a register check run at a boundary — the same carriage
    `check_constructor_field_establishment.py` has always had, no weaker and no stronger.
    **THE IMPORT-TIME GUARD IS DEFERRED, NOT DROPPED, AND IT IS DEFERRED FOR EXACTLY ONE REASON:
    the file that would have to declare its dispositions is sealed by Product Owner ruling until
    after the seventh seat.** It is the natural companion to the same act that clears the three
    stale keys.

