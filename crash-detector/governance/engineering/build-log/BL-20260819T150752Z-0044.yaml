action_summary: >
  CD-PL-F59 IS CLOSED under CD-RULE-004 OPTION (i) — CLOSE, not declare — and boundary 4 is
  CORRECTED as the dispatch made mandatory. The two escaped Project Lead probes are refused:
  PL-S3a and PL-S3c were exit 0 / PASS 53 at b60d153 and are now exit 1, each naming
  CD-EGRESS-007. PL-S3b is still refused and now by BOTH layers where it was refused by one.

  THE CLOSURE IS NOT THE DESTINATION REGISTRY, AND THAT IS THE ONE DESIGN DECISION IN THIS
  INCREMENT. Mirroring CD-EGRESS-004 onto `pending` would be incoherent: a pending entry
  exists PRECISELY BECAUSE THE HOST IS UNKNOWN, so requiring it to name a registered
  destination is either unsatisfiable or forces this seat to invent the hostname the project
  deliberately recorded as owed — CD-RULE-003 and PBG-AUTH-005 both forbid that, and this
  project's own compose file says in terms that cd-witness' and cd-review's hosts are "not
  decided" and were "recorded as pending rather than guessed".

  CD-EGRESS-007 closes it from the field's own meaning instead. A pending entry is the record
  of an ABSENCE: what authorises the future endpoint (`declared_in`) and why the host is not
  written (`blocked_by`). A HOST IS PRECISELY THE THING IT DECLARES THE ABSENCE OF, so the key
  set is closed BY EQUALITY and there is no field in a pending entry that can hold a
  destination at all. `host:`, `endpoint:`, `url:`, `address:`, `target:` and every key nobody
  has thought of fail the SAME clause, WITHOUT THE VALUE BEING EXAMINED — which is the
  property `hosts` gained at increment 3 and `pending` did not.

why_the_defect_was_real_and_not_a_curiosity: >
  Recorded so the next seat does not have to reconstruct the argument. The field was ALREADY
  IN SCOPE: increment 3 fired CD-EGRESS-002 on it and its own header said the vocabulary
  applied "to every `pending` entry, because a pending entry is a host". Having decided the
  field was worth guarding, it applied ONLY the layer CD-ASR-F04 had already proved
  insufficient. And "a pending entry grants nothing" does not distinguish it: at WO-2 an
  allowlist entry grants nothing either, because both networks are internal:true. The whole
  criterion at WO-2 is about DECLARATIONS, and `pending` is the declaration the WO-3
  enforcement lane inherits.

