the_structure:
  invariant: CD-EGRESS-007 — A PENDING ENTRY DECLARES AN OMISSION, NOT A DESTINATION
  what_it_asserts: >
    `pending` is present and is a LIST; every entry is a mapping whose key set EQUALS
    {declared_in, blocked_by}; both values are non-empty scalars. Layer 2 (CD-EGRESS-002, the
    broker vocabulary and known-operator denylist) survives UNCHANGED IN REACH over the
    flattened text of every entry, so neither layer is sole — api.ibkr.com written as a bare
    pending entry now fails BOTH.
  second_order_repair: >
    The unresolved-alias refusal filter enumerated FIVE field names —
    {x-egress, networks, ports, policy, hosts} — and `pending` was not among them, for exactly
    the same reason it was in none of the boundaries. THAT LIST WAS ITSELF THE ENUMERATION
    DEFECT: a field added to the contract tomorrow would be aliasable and unrefused. It is
    replaced by the SUBTREE — any unresolved alias anywhere under an x-egress block, at any
    depth. STRICTLY WIDER: nothing previously refused is now admitted, and PL-S2 still exits 3.
  where_it_is_declared_and_this_is_four_places_not_three:
  - "tools/register/check_egress_no_broker.py — the check header, WHAT IS ASSERTED and the eight declared boundaries"
  - "required-tests.yaml — CD-RT-012-EGRESS-NO-BROKER's negative_control and the comment above it"
  - "contracts/execution/CD-RT-012-EGRESS-NO-BROKER.md — the invariant table, the proposition and boundaries 1-8"
  - "deploy/compose.yaml — x-cd-egress-contract, the `pending` field meaning and invariant CD-EGRESS-007. This is the one the WO-3 lane reads first."
  independently_asserted_by: >
    tests/test_egress_destination_registry.py gains five tests, including
    test_no_pending_entry_carries_a_host_bearing_key — which is deliberately redundant with
    the key-set equality test, so that WIDENING PENDING_KEYS to admit a destination field
    fails a test whose NAME says what was lost — and
    test_the_guard_declares_the_pending_residue_it_does_not_close, which asserts the
    boundary-4 correction and the boundary-7 wording are PRESENT in the check header, so the
    declaration cannot be quietly removed later.

the_mandatory_boundary_4_correction: >
  Boundary 4 read: "a real brokerage ... passes LAYER 2. It does not pass LAYER 1 unless a
  human deliberately registers it, which is the whole point of deny by default: the escape now
  costs a signed edit to a reviewed registry file, not a quiet line in an allowlist." IT NAMED
  NO FIELD, and for `pending` it was MEASURABLY FALSE — there was no layer 1 there at all.

  IT IS NOT SOFTENED. It is made FIELD-SPECIFIC, and each field names its own layer-1 rule
  with the variant that measured it:
    `hosts`         -> CD-EGRESS-004, deny by default over the registry  (measured: E05, exit 1)
    the REGISTRY    -> CD-EGRESS-006, the positive hostname shape        (measured: V20, exit 1)
    `pending`       -> CD-EGRESS-007, the closed entry shape             (measured: PL-S3a and PL-S3c, exit 1)
    `pending` PROSE -> THERE IS NO LAYER 1. See boundary 7.
  The boundary carries the correction and the reason for it in its own text, in all three
  CD-RULE-004 places, so an auditor reading any one of them sees that it was wrong and why.

