findings_raised_against_my_own_work:
- id: CD-ENG-WO2R-F14
  severity: MEDIUM
  status: OPEN — ESCALATED, NOT FIXED
  title: "the shared YAML subset reader does not terminate on one document shape, so a register check can return no verdict at all"
  detail: >
    tools/register/_yamlmin.py enters an INFINITE LOOP on a block sequence opened by the FIRST
    key of a block-sequence item. Minimal reproducer, three lines and independent of any
    check: `top:` / `  - key:` / `      - nested`. Reached through this check's own subject by
    variant V30, which writes `declared_in:` opening a nested sequence in cd-collectors'
    `pending`: the check does not return within 30 seconds and is killed at exit 124, which is
    not one of its four declared exit codes.
    Note the near miss that shows how narrow it is: `destinations: - id: D1 / services: - x`
    parses FINE, because the first key's value is a scalar. It is specifically the first key
    opening a sequence.
  why_it_is_not_a_false_clean: >
    The check never reports PASS. In CI it would time out, which is closer to fail-closed than
    to a silent green. But non-termination is not a STATED refusal, PBG-CI-002 requires a
    non-zero exit WITH A REASON, and a gate that hangs is a gate somebody eventually disables.
  why_i_did_not_fix_it: >
    THREE REASONS, and I would rather be told I was wrong than widen scope silently.
    (1) This dispatch is bounded to CD-PL-F59 and the boundary-4 correction, "and NOTHING
    ELSE". (2) It is PRE-EXISTING and not introduced here — it reproduces identically at
    ee8be6b, the original WO-2R dispatch base, before any of this seat's work. (3) The reader
    is shared with tools/register/check_base_image_digest_pin.py, so repairing it changes the
    behaviour of a guard this dispatch does not cover and whose variants I have not run.
    It is DECLARED as boundary 8 in all three CD-RULE-004 places with an executable example,
    and recorded in the manifest so the next auditor is not surprised by a hang.
  owed: "a bounded dispatch of its own, over tools/register/_yamlmin.py and BOTH its consumers."
- id: CD-ENG-WO2R-F15
  severity: LOW
  status: DISCLOSED
  title: "variant V27 is refused by a clause other than the one it was written for, because the reader flattens nesting"
  detail: >
    V27 writes `declared_in:` opening a nested MAPPING carrying `host: 198.51.100.24`,
    intending to attack the non-empty-scalar clause. The subset reader FLATTENS it —
    {'declared_in': None, 'host': '198.51.100.24', 'blocked_by': ...} — so at the reader level
    V27 collapses into PL-S3c's shape and the CLOSED KEY SET clause catches it instead. The
    refusal is correct and the rule id is asserted, but THE ROUTE IS NARROWER THAN IT LOOKS
    and must not be read as evidence that value-position attacks are covered in general. The
    non-empty-scalar clause is still reachable — an empty or absent value hits it — but not by
    a nested mapping. Written into the V27 manifest row rather than presented as a cleaner
    result than it is.
- id: CD-ENG-WO2R-F16
  severity: LOW
  status: DISCLOSED
  title: "a skipped arm's only trace was a silently shrinking assertion count"
  detail: >
    V26 (`pending` written as a mapping) exited 0 at b60d153 with PASS — **52** assertions,
    where the clean arm was 53. The guard did LESS WORK and still said PASS, and the single
    number that would have shown it is not asserted anywhere and was not being watched. This
    is a general property of `Check.asserted()`-style accounting, not a defect of this
    increment, and it is the reason the V28 and V24 positive-control rows now record the
    assertion MOVEMENT (69->79, 53->83) rather than only the exit code. Offered as a candidate
    project method: a register check could carry an expected-assertion floor derived from the
    artefact, so an arm that vanishes is a violation rather than a smaller number.

