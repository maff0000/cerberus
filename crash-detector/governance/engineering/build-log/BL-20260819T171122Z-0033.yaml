the_defect_reverified_at_the_dispatch_base: >
  The Project Lead does not issue a dispatch against a defect it has not re-measured at the base it
  is dispatching. MEASURED AT f22d120 on 2026-08-19T17:11Z:

    printf 'top:\n  - key:\n      - nested\n' > /tmp/hang.yaml
    timeout 20 python3 -B -c "... _yamlmin.load_yaml('/tmp/hang.yaml')"   ->  exit 124

  It does not terminate. `git log be34fe4..f22d120 -- tools/register/_yamlmin.py` is ZERO commits,
  so increment 5 did not touch it and the defect stands exactly as recorded at increment 3b.

why_a_separate_dispatch_and_not_an_increment: >
  CD-DISPATCH-WO2R-ENGINEER is bounded to CD-ASR-F01..F06. _yamlmin.py is shared with
  check_base_image_digest_pin.py, which serves a criterion that dispatch does not cover, so repairing
  it there would change a guard outside the bound — the silent widening its own `prohibited` list
  forbids. CD-ENG-WO2R-01 saw this, declared the defect at boundary 8 with variant V30, and ESCALATED
  RATHER THAN FIXING IT; that judgement was COMMENDED at CD-D-048. Honouring it now, rather than
  quietly folding the repair into the rework, is the Project Lead holding itself to the rule it held
  the seat to.

why_not_deferred_to_WO_3: >
  An auditor probing YAML shapes will meet this the way the Project Lead did — by accident, on an
  ordinary edit — and a hang consumes an auditor's budget and may be misreported. Two of the eleven
  declared gate commands return NO VERDICT on the same input. It is not a false clean, since a hang
  is not exit 0 and is fail-closed under any harness imposing a timeout; but it is a check that
  cannot return a verdict, which is what PBG-CI-002's "never a skip, for any reason" is aimed at.

the_three_devices_in_this_dispatch:
- 'TERMINATION MUST BE STRUCTURAL. The brief says in terms that the class is "an input on which the
  reader does not finish", NOT "the nested-sequence document", and that a reader which terminates
  because every known shape was enumerated is the exact defect four AMBER verdicts were about. The
  seat must find why the loop fails to advance and make progress a property of the loop.'
- 'NO VERDICT MAY CHANGE. This repair changes whether a check TERMINATES, not what it CONCLUDES. The
  seat must produce a before/after table for every register check with assertion counts in both
  columns — CD-ENG-WO2R-F16''s lesson that a silently shrinking assertion count is how a skipped arm
  hides, adopted as project method and now used as a dispatch device.'
- 'THE PARSER-DEPENDENCY DECISION IS NOT REOPENED. Substituting a third-party YAML library is
  PROHIBITED: a gate that depends on a third-party parser depends on its version, its resolution
  rules and its CVEs, and safe_load accepts documents this project deliberately refuses. If the seat
  concludes the hand-rolled reader cannot be made correct in scope, that is a FAIL-CLOSED escalation
  to the Project Lead, not a decision it takes.'

