- id: P4
  plant: a ModelSpec reading an undeclared input
  must_fail_at: ConfigSnapshot construction
  baseline_arm:
    observed: >
      ModelReadsUndeclaredInput: model 'm.greedy' reads inputs dial 'equity_crash' did not declare:
      required ['src.x'], contributing [].
    refusing_layer_and_its_scope: >
      `establish_model_for_dial` invariant 3. SCOPE: every (dial, model) pair in every snapshot,
      at construction and at resolution.
    the_second_route_also_planted: >
      A model that MOVES an id rather than adding one — the dial declares `src.c` CONTRIBUTING and
      the model declares the same id REQUIRED. A naive "is every model input one of the dial's
      inputs?" test would admit it, and it changes what absence MEANS (required absence forces
      Unknown; contributing absence forces Degraded, BLUEPRINT §5). The invariant is a subset test
      PER SET for exactly this reason and this plant is what makes the per-set half load-bearing.
    two_false_positive_controls: >
      (i) a model reading EXACTLY its dial's two sets, with agreeing criticalities — ACCEPTED;
      (ii) a model reading a strict SUBSET of its dial's inputs — ACCEPTED, because it is a subset
      rule and not an equality rule, and asserting that stops a later seat tightening it silently.
