structure_delivered:
  deleted:
  - '`ContributionModel` (the Protocol) — DELETED. No deprecation path, no shim, no alias.'
  - '`CONTRIBUTION_MODELS` (the dict) — DELETED.'
  - '`DialSpec.contribution_model` — THE FIELD IS GONE. Not narrowed to None, not renamed with a
     compatibility property: absent from `dataclasses.fields(DialSpec)`, absent from the
     constructor signature, absent from an instance. `DialSpec(..., contribution_model=x)` is a
     TypeError from the interpreter''s own argument binding.'
  - '`crash_detector.engine` re-exports neither name; `engine.ContributionModel` is an
     AttributeError.'
  added:
  - '`ModelId` — a name, established through `own_model_id`/`own_str`, like every other id in this
     codebase. The ALIAS is documentation; the ESTABLISHMENT is the refusal, and that is written
     out in the module rather than left to be assumed.'
  - '`MappingKind` — a closed enum with EXACTLY ONE member, `UNSPECIFIED`, which computes nothing.
     The names are the Project Lead''s at CD-D-090 and were not altered.'
  - '`DeclaredParameter` — a configured name and finite number. WO-2 ships ZERO instances.
     Deliberately NOT `DeclaredQuantity`, which is a dial number with dial provenance; the two are
     separated in writing because the names are close enough to be confused.'
  - '`ModelProvenance` — SHAPE is this seat''s construction per §C.6; CONTENTS are CD-D-005''s and
     are NOT invented here. Three fields — stands_for, account, decided_by — each argued in the
     docstring. The per-source facts are deliberately NOT copied onto it: they live in the
     SourceRegistry and invariant 3 forces the two to agree, because two records of one fact drift.'
  - '`ModelSpec` — frozen data. NO callable-typed field, and no method that computes.'
  - '`ModelRegistry` — a TUPLE of exact-typed rows, NOT a caller-supplied Mapping. Holding a
     Mapping would mean resolution runs the caller''s `__getitem__` — the caller choosing which
     spec a dial resolved to, which is this amendment''s own defect one storey down. Same reasoning
     that put SAME_DIAL_REDUCTIONS behind a MappingProxyType with no other reference.'
  - '`EMPTY_MODEL_REGISTRY` — zero rows, shipped, joining EMPTY_SOURCE_REGISTRY.'
  - '`ModelNotRegistered`, `ModelBoundToAnotherDial`, `ModelReadsUndeclaredInput` — named errors,
     so a plant can catch the CLASS rather than the one member somebody planted.'
  - '`ConfigSnapshot.model_registry` — REQUIRED, NO DEFAULT. A registry nobody chose is not
     evidence of anything.'
  - '`ConfigSnapshot.model_for(dial_id)` — THE ONE RESOLUTION DOOR, mirroring `window()`.'
  - '`engine/mapping.py` — NEW MODULE. `compute(spec, payloads) -> ScoreComputation`, engine-owned,
     holding no module-level mutable state, taking one dial''s spec and one dial''s payloads.'
  the_one_function_two_call_sites: >
    §C.5's three invariants live in `establish_model_for_dial` and NOWHERE ELSE. It is called from
    `ConfigSnapshot.__post_init__` (so an incoherent configuration is refused before an evaluation
    runs) and from `ConfigSnapshot.model_for` (so a slot rewritten past `frozen` between
    construction and evaluation is refused at the second reading). ONE FUNCTION, TWO CALL SITES —
    two independently written checks would be an enumeration, and enumerations come apart. This is
    the reasoning StalenessWindow already applies to the two staleness comparison sites, read here.

structural_invariant: >
  After this increment there is no field, parameter or constructor argument reachable from
  `ConfigSnapshot`, `DialSpec`, `ModelSpec` or `engine.mapping.compute` that accepts a callable or
  a model object, and `engine.mapping.compute` returns no value on any code path that exists today.
  WRITTEN NARROWLY ON PURPOSE (CD-PL-F76): it says NOTHING about the collector boundary, the
  serving path or `Reading.fold`, none of which this increment touches.

why_it_is_a_class_closure: >
  Not because a check rejects model objects — NO CHECK DOES. The DESTINATION is removed. Every
  field on the path is one of three things: a value this system rebuilds from primitives
  (`own_str`), a member of an enum the interpreter closes against subclassing, or an exact-type
  comparison against a frozen dataclass. A callable is none of those. A callable wearing a `str`
  subclass — which `isinstance(x, str)` would have admitted — is REBUILT as an exact `str` that has
  no `__call__`, which is measured as a test. The single registry-shaped thing, which mappings
  exist, is closed by `enum` membership (closed by the LANGUAGE, not by a check) and the executor's
  branch set is asserted set-equal to the enum AT IMPORT, so a member added without a branch stops
  the module importing rather than falling out of the bottom of `compute`.

