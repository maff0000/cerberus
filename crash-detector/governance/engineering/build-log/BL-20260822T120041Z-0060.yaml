findings_against_my_own_work:
- id: CD-ENG-WO2R3-F01
  severity: MEDIUM
  title: >
    §C PLUS ONE NON-COMPUTING MAPPING MEMBER MAKES THE VALUE-BEARING TAIL OF `_evaluate_dial`
    UNREACHABLE FROM `evaluate`, AND FOUR PROPOSITIONS LOST THEIR END-TO-END COVERAGE.
  what: >
    MappingKind ships one member and it refuses, so `compute` raises on every call and NO
    configuration this product can construct reaches the code below it. That code — the
    Degraded/Value choice, DIAL_SCORE_TYPES selection, the `observed_for_dial` admission and
    `_oldest_as_of`'s use — is not dead (a CD-D-005 computing member makes it live again) but
    NOTHING CAN DRIVE IT TODAY. Four propositions consequently lost their end-to-end assertions:
    that a satisfied dial renders `Value`; that a missing contributing input renders `Degraded`
    with its reason and missing source; that a live evaluation stamps each dial's own score type;
    and that a reading's `as_of_utc` is its oldest input's.
  what_i_did: >
    Replaced each with a successor asserting the surviving half at the structure that now carries
    it, and wrote the LOST half into the successor's own docstring next to the code rather than
    only into a record. `_oldest_as_of` and `_latest_usable_ok` are now exercised directly, so
    those two rules keep unit coverage; `Degraded` and `Value` construction stay covered by
    tests/test_reading.py and the post-condition tests.
  what_i_did_NOT_do: >
    I did not add a second MappingKind member to restore the coverage. That is prohibited and it
    would be inventing product meaning (PO-DECISIONS-0005 ruling 2, CD-RULE-003, PBG-AUTH-005). I
    did not weaken or delete any assertion to obtain a pass. NO GUARD WAS BUILT FOR THIS.
  for_the_project_lead: >
    This is a consequence of a ruling and not a defect in the ruling — I am reporting it because
    the fourth Assurance seat will find `_evaluate_dial`'s tail uncovered and should find it here
    first, with the reason, rather than as a surprise. If the Project Lead reads it differently the
    remedy is a product decision (a computing member with CD-D-005), not an engineering one.
- id: CD-ENG-WO2R3-F02
  severity: LOW
  title: 'THE EXECUTOR''S DOOR IS NOT YET DERIVED FROM ITS SIGNATURE, AND `compute` IS PUBLIC.'
  what: >
    `engine.mapping.compute` is a PUBLIC entry point on a judgement path — arguably the most
    consequential one in the product, since it is now the only place a dial magnitude is computed —
    and its argument establishment is written in its BODY. §D.1 says that is exactly the shape that
    fails, because a rewrite of the body removes it (CD-ASR-F03). §D's `admits` is a later
    increment of this same dispatch and will cover it, but at THIS SHA the door is body-guarded.
  what_i_did: 'Declared it in the module docstring and in the sweep disposition. NO GUARD BUILT.'
  note: >
    It is also worth the fourth Assurance seat's attention that `compute` did NOT appear in §B's
    measured inventory of 44 callables, because it did not exist when that inventory was taken. The
    denominator §B measured is a floor at f30e63c and this increment ADDS a public callable to the
    judgement path. Increment 2's static check must enumerate it.
- id: CD-ENG-WO2R3-F03
  severity: LOW
  title: '`ModelProvenance`''S SHAPE IS THIS SEAT''S CONSTRUCTION AND NOBODY HAS RATIFIED IT.'
  what: >
    §C.6 assigns the SHAPE to the Project Lead and the CONTENTS to the Product Owner. The shape
    delivered is three required non-empty strings — stands_for, account, decided_by — and the
    reasoning for each, and for deliberately NOT duplicating the per-source facts that live in the
    SourceRegistry, is written out in the type's docstring. But it is a shape derived from reading
    §C.6, not one anybody has agreed, and CD-D-005 has not landed to test it against. A provenance
    shape the register cannot populate would be a re-work.
  what_i_did: >
    Shipped zero instances in the product, argued the shape in the docstring, and raised this. NO
    GUARD BUILT — there is nothing to guard, only a decision to confirm.

