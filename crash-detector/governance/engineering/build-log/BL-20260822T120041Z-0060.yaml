declared_limits:
- id: 'engine/model.py boundary 1 — object.__setattr__ still walks past frozen'
  where_written: 'the module docstring of crash_detector/engine/model.py'
  carrier: >
    PARTIALLY CARRIED, AND THE CARRIER IS MEASURED. `establish_model_for_dial` runs at
    ConfigSnapshot construction AND AGAIN at every resolution, so a `dial_id` or an input tuple
    rewritten between the two is refused at the second reading — MEASURED as
    `test_p3_a_dial_id_rewritten_after_snapshot_construction_is_refused_at_resolution`, which shows
    both `model_for` and `evaluate` refusing. `compute` reads the `mapping` SLOT and refuses a
    non-member — MEASURED as `test_p8_the_executor_refuses_a_spec_whose_mapping_slot_was_rewritten`.
  what_is_not_carried: >
    `mapping` rewritten to ANOTHER member of the enum. There is nothing to refuse today because
    there is exactly one member and it refuses. Should a computing member ever be added, that route
    is **NOT PROVED TO BE CARRIED ANYWHERE**.
- id: 'engine/mapping.py boundary 3 — the executor door is written in the BODY, not derived from the signature'
  where_written: 'the module docstring of crash_detector/engine/mapping.py, and the sweep disposition'
  statement: >
    §D.1 requires establishment at a public entry point to be DERIVED FROM THE SIGNATURE so a
    rewrite of the body cannot remove it. `admits` is §D and is a LATER INCREMENT of WO-2R3. Until
    it lands, `compute`'s refusals are a property of that function's body and an edit to the body
    removes them — which is CD-ASR-F03's own shape.
  carrier: '**NOT PROVED TO BE CARRIED ANYWHERE.**'
  what_does_not_depend_on_it: >
    THE §C CLAIM ITSELF. No field on ModelSpec or DialSpec holds code, so with every line of that
    body deleted `compute` still has no caller-supplied callable to execute. The body bounds what a
    MALFORMED spec can do at that door; it is not what stops a model object arriving.
- id: 'CD-BP-002 — a mapping member''s implementation is code and can be wrong'
  statement: >
    This design does not make a mapping correct; it makes it HAVE SOURCE for static analysis, which
    is strictly weaker than "cannot happen" and is stated as one in §E and in BLUEPRINT §17. The
    executor is now the single highest-value target in the product and that concentration is
    deliberate — one place with source beats seven doors without — and it is a RISK and not a win.
    WO-2 ships no computing member, so there is no implementation to be wrong yet.
  carrier: '**NOT PROVED TO BE CARRIED ANYWHERE.**'
- id: 'engine/model.py boundary 2 — a spec is established; the TRUTH of a spec is not'
  statement: >
    `ModelProvenance` REQUIRES an account (doctrine §3.6's "no unexplained mappings"); it does not
    ADJUDICATE one. A row misdescribing what its mapping measures gets a faithfully validated
    misdescription. That adjudication is CD-D-005 and is the Product Owner's.
  carrier: '**NOT PROVED TO BE CARRIED ANYWHERE.**'
- id: 'engine/mapping.py boundary 1 — payload SHAPE is established; payload CONTENTS are not'
  statement: >
    Keys are rebuilt through own_str and both dict levels copied into dicts this module built, so
    no supplied mapping decides a lookup. The VALUES inside a payload are external observation data
    believed as data, exactly as own_terms boundary 3 describes. Source trust is a different
    problem with a different instrument (BLUEPRINT §5, CD-D-005).
  carrier: '**NOT PROVED TO BE CARRIED ANYWHERE.**'

