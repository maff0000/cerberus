    *** FX12 — WHAT WAS BUILT, IN THE WORDS DISPATCH §7.6 ASKED FOR: WHAT "CANNOT FULLY READ"
    MEANS IN THIS IMPLEMENTATION, AND WHY IT IS DENY-BY-DEFAULT AND NOT A LIST. ***
    `_dial_bearing` may return `False` about a node ONLY WHEN EVERY KEYWORD THE NODE ACTUALLY
    DECLARES, at every node the walk visited, is in `_READABLE_KEYWORDS` — the union of exactly
    three declared, closed sets and nothing else:
      (i)   `_SUBSCHEMA_KEYWORDS` minus `_NAME_BEARING_APPLICATORS` — keywords carrying
            subschemas the walk DESCENDS INTO, so it has looked underneath every one;
      (ii)  `_NAME_DECLARING_KEYWORDS` = `properties`, `required`, `dependentRequired` — the
            keywords whose keys or entries are LITERAL property names, which this check reads;
      (iii) `_INERT_KEYWORDS` — the remaining 2020-12 keywords that carry no subschema and name
            no property, enumerated from the specification's own vocabularies.
    **EVERYTHING ELSE IS UNREADABLE AND MAKES THE NODE UNDECIDABLE**, including
    `patternProperties`, `propertyNames` and `dependentSchemas` (descended into, so a dial under
    one can still come back `True`, but their KEYS are names this check does not evaluate — a
    regex, a constraint, a trigger property), `$id` (it moves the base URI a relative `$ref`
    resolves against and `_resolve` always resolves against the document root), `$dynamicRef`,
    `$dynamicAnchor`, `$recursiveRef`, any private-vocabulary keyword, any keyword of a draft not
    yet written, and any MISSPELLING of a keyword that does exist. `_resolve` reaching
    `REF_CHAIN_CAP` is the same answer for the same reason.
