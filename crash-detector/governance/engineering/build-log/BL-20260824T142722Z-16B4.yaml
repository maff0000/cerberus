action_summary: >-
  *** `READY_FOR_ASSURANCE` AT `4e6f7c4a6e7670372c8ef0346a6c0ea70a6fd875` (branch `wo-3`).
  INCREMENT 16B-FIX-4. `FX12` IS BUILT AS A CLASS FIX AND ITS FALSIFIER WAS BUILT, RUN AND
  PASSED. *** **THE DEFAULT IS INVERTED AT THE ROOT-PROPERTY RECOGNISER.** `_dial_bearing` no
  longer asks a list of keywords IT HAD THOUGHT OF whether they are present; it asks the NODE
  whether every keyword the node ACTUALLY DECLARES is one this check can read
  (`_READABLE_KEYWORDS` = the descended subschema keywords, plus the three keywords whose
  property NAMES it reads literally, plus an exhaustive enumeration of the 2020-12 keywords that
  carry no subschema and name no property). **A NODE IT CANNOT FULLY READ IS `UNDECIDABLE`,
  NEVER `False`.** `_resolve` returns `None` at its depth cap instead of handing back a node it
  did not resolve with `dropped == []` (`A308-F5`, reproduced at the function and closed there).
  *** **THE FALSIFIER — AND IT IS THE ONLY PART OF THIS RETURN THAT PROVES ANYTHING THE PREVIOUS
  THREE INCREMENTS DID NOT ALSO CLAIM.** *** `C22`-`C26` are the four `A308` spellings and the
  auditor's arm `FINAL`; all five are `FAIL — 2`. **`C27` IS A FIFTH SPELLING NOBODY IN THIS
  CHAIN NAMED — `propertyDependencies`, an applicator proposed for the draft AFTER 2020-12 —
  WHICH APPEARS ZERO TIMES IN THE INSTRUMENT (`grep -c` -> `0`), WAS A LIVE ESCAPE ON THE
  SUPERSEDED TIP (`PASS — 144 assertions, 0 violations` WITH THE GATE ADMITTING A DEAD FEED AS
  `calm` ON BOTH SURFACES) AND IS `FAIL — 2` HERE.** Three more never-named spellings behave
  identically — a private `x-` vendor keyword, an invented `slotShape`, and **`propertys`, a
  ONE-LETTER TYPO OF `properties`, which is the likeliest real-world author error of all and was
  silent before this fix.** I did not have to add any of them to any list.
  *** **THE CLEAN TREE DID NOT MOVE AND THAT WAS THE MEASUREMENT THAT COULD HAVE STOPPED THIS.**
  *** `PASS — 144 assertions, 0 violations`, exit 0, and the instrument's FULL OUTPUT on the
  clean tree is BYTE-IDENTICAL before and after but for the absolute path string. `C1`-`C21`
  re-run from their own pristine extractions, `git apply` rc=0 on all eighteen patch files, NOT
  ONE FIGURE CHANGED. `C28` (the `C10` control, fourth independent extraction) `PASS — 158`.
  `pytest tests/ -q` -> `2007 passed`; `test_detail_level.py` -> `52 passed`. The 30-line
  register is IDENTICAL to the clean baseline, 19 rc=0 / 11 non-zero.
  *** **THE FALSE-POSITIVE TAIL IS REAL, IT IS THE BIGGEST THIS ROW HAS TAKEN, AND IT IS
  MEASURED RATHER THAN ESTIMATED (`CD-RULE-004`).** *** Eight benign root properties, none a
  dial: SIX turn this instrument red that were green before — including **a property carrying an
  ordinary custom `x-` annotation**. Two benign controls stay green. Priced as `DECLARED LIMIT
  14` in all three `CD-RULE-004` places, in the ruled direction: a false positive costs one seat
  one look at one contract; a false negative costs the constitution.
  `FX13` DONE and the answer named: **`_SUBSCHEMA_KEYWORDS` WAS THE CONSTANT THAT WAS WRONG.**
  `FX14` DONE, WRITTEN LAST, AND RE-MEASURED BY ME RATHER THAN RELAYED: 108 combinations,
  `MERGE ADMITS WHAT THE NODE AS WRITTEN REFUSES -> 11 hits`, `MERGE ADMITS WHAT NEITHER SCHEMA
  OBJECT ADMITS -> 0 hits`.
  *** **AND I HAVE ONE FINDING AGAINST THE AUDIT AND THE DISPATCH TOGETHER (`F01`), AND IT CUTS
  BOTH WAYS. `A308`'s "the register moves EXACTLY ONE LINE and that line is not evidence anything
  saw the defect" DOES NOT SURVIVE 16C PAYING ITS FRICTION: with the allowlist paid,
  `patternProperties` — the dispatch's headline spelling and the auditor's own arm `FINAL` — is
  caught by `check_schema_closed` on `rule 2: escape hatch`, WHICH NAMES THE KEYWORD AND WHICH
  THE BENIGN CONTROL `C16` DOES NOT TRIP. THE HALF THAT MATTERS RUNS THE OTHER WAY: `$dynamicRef`
  AND THE OVER-CAP `$ref` CHAIN LAND WITH THE ENTIRE THIRTY-LINE REGISTER GREEN AND THE GATE
  ADMITTING A DEAD FEED AS `calm`. TWO CLEAN ESCAPES SURVIVED EVERY OTHER INSTRUMENT IN THIS
  REPOSITORY.** ***
  I CERTIFY NOTHING (`PBG-SOD-001`, non-waivable). A FRESH ASSURANCE SEAT FOLLOWS.

