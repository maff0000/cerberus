    RECOGNISER WAS ESCAPED FOUR TIMES BY FOUR SPELLINGS OF ONE IDEA AND WHY EACH FIX CLOSED THE
    SPELLING IT WAS SHOWN.** The new walk is
    `unreadable = sorted(k for k in resolved if k not in _READABLE_KEYWORDS)` — it iterates the
    KEYS OF THE NODE. **THE DENY CLASS IS THEREFORE THE COMPLEMENT OF A FINITE WRITTEN SET, AND
    NO FUTURE SPELLING CAN LEAVE IT.** That is the structural claim; `C27` and three further
    never-named spellings are the measurement of it.
