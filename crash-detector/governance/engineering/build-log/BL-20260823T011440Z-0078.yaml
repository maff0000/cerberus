findings:
- id: CD-ENG-WO2R3-03-F16
  severity: MEDIUM
  against: 'THE PROJECT LEAD''S RECIPE AS HANDED OVER — three defects its disclosure did not name.'
  what: 'Defects 1, 2 and 3 above: a confident hash of nothing outside a worktree; a swallowed missing tracked file; a vacuous run. **THE FIRST IS THE SERIOUS ONE** — the disclosure called it "silently does nothing useful", and it does something ACTIVELY MISLEADING instead.'
  why_it_matters_beyond_this_item: >
    **THE RECIPE WAS ABOUT TO BE USED TO DECIDE WHETHER AN AUDITOR''S VERDICT WAS ABOUT A TREE THAT
    STILL EXISTS.** An instrument in that position that can emit a valid-looking digest for a
    directory it could not read is worse than no instrument, because the alarm it fails to raise is
    the one the whole practice depends on.
  disposition: 'FIXED IN THE LANDED INSTRUMENT. Raised so the META-ASSURANCE PASS authorised by PO-DECISIONS-0013 ruling 5 has it in writing.'

- id: CD-ENG-WO2R3-03-F17
  severity: LOW
  against: 'THE PROJECT LEAD''S OWN DISCLOSURE — it OVERSTATED its recipe''s weakness, and I say so because the record should be right in both directions.'
  what: >
    *"A wrongly-ignored product file becomes invisible to the fingerprint"* is TRUE ONLY OF FILES
    THAT WERE NEVER COMMITTED. `--cached` lists every tracked file regardless of any ignore rule;
    measured with a hostile `.gitignore` containing `*` in a source directory — **fingerprint
    UNMOVED, 5 tracked engine files still counted.**
  why_a_finding_at_all: >
    A declared limit that is wrong in the PESSIMISTIC direction is still wrong, and it is the twin
    of the understated residue this project keeps finding. **A READER WHO BELIEVES THE WEAKNESS IS
    WIDER THAN IT IS WILL DISTRUST A SOUND INSTRUMENT, WHICH COSTS AS MUCH AS TRUSTING AN UNSOUND
    ONE.** Corrected in the instrument's header at its measured bound, and CARRIED.
  disposition: 'RAISED. The narrowing is asserted by a test so it cannot rot into a comfortable belief.'

- id: CD-ENG-WO2R3-03-F18
  severity: LOW
  against: 'THIS SEAT''S OWN SCOPE DECISION ON ITEM 6 — stated because a silent omission is worse than a declared one.'
  what_was_NOT_done: >
    **NO ROW WAS ADDED TO `required-tests.yaml` FOR THIS INSTRUMENT AND NO `contracts/execution/`
    DOCUMENT WAS CREATED FOR IT.** Every row in that register is a `CD-RT-*` bound to a PID
    ACCEPTANCE CRITERION. This instrument is an AUDIT tool about tree state; it corresponds to no
    CD-AC and minting a `CD-RT` id for it would be **inventing product meaning (PBG-AUTH-005,
    CD-RULE-003)**, which is not this seat's to do.
  what_governs_it_instead: >
    Its header declares its population and every limit; its carrier fails when it regresses
    (proved); and this entry records both. **IF THE PRODUCT OWNER OR PROJECT LEAD WANTS IT IN THE
    REGISTER, THAT IS A RULING AND A ONE-LINE CHANGE, AND IT IS FLAGGED HERE RATHER THAN DECIDED.**
  disposition: 'RAISED FOR A RULING.'

what_this_item_does_NOT_close_MEASURED:
- '**FILE MODE.** `chmod +x` leaves the fingerprint identical. Declared, NOT carried.'
- '**`.gitignore` CORRECTNESS.** Bounded to never-committed files (measured) and made VISIBLE by the
   printed exclusions, but NOT VERIFIED. An untracked product file under a wrong rule is hidden and
   the only signal is the exclusion count.'
- '**SYMLINK TARGETS.** Content is read through the link; a link retargeted outside the tree moves
   the fingerprint while the tree''s own bytes did not. Declared, not resolved.'
- '**EMPTY DIRECTORIES**, which git does not track and this therefore cannot see.'
- '**IT IS NOT A GIT IDENTITY.** It says nothing about branch, HEAD, staged state or history, and it
   does not replace `git rev-parse HEAD` or `git status --porcelain`. **THE PRACTICE THAT USES IT
   STILL NEEDS BOTH, AND THIS INSTRUMENT MUST NOT BE READ AS COVERING THEM.**'
- '**IT DOES NOT FIX CD-PL-F101** — `main` carrying no `.gitignore` at all. That is disclosed in the
   dispatch as the Project Lead''s and NOT this seat''s; the lane has its own `.gitignore` and is
   unaffected. **Nothing in this item makes `main` boot GREEN and nothing here should be read as
   having addressed it.**'

