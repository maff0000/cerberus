THE_ATTACK_ON_THE_PROJECT_LEADS_RECIPE_WHICH_IS_WHAT_THIS_SEAT_WAS_ASKED_FOR:
  three_defects_the_disclosure_did_not_name:
  - id: 1
    what: '**OUTSIDE A GIT WORKTREE IT PRODUCES A CONFIDENT HASH OF NOTHING.**'
    measured: >
      Run in `/tmp`: `git ls-files` writes `fatal: not a git repository` to stderr, **THE PIPELINE
      CONTINUES**, and `sha256sum` of empty input yields `abcfa6a9d4df344d…`. **A FINGERPRINT THAT
      MEANS "I LOOKED AT NOTHING", INDISTINGUISHABLE FROM ONE THAT MEANS "THE TREE IS THIS."**
    why_it_is_the_worst_of_the_three: >
      It is the exact shape this project's own `tools/register/_support.py` `Check.done` already
      refuses — *`exit 0` must never be able to mean "I looked at nothing"* — and the Project Lead's
      disclosure called it only *"silently does nothing useful outside a git worktree"*, which
      understates it: **it does something ACTIVELY MISLEADING, not nothing.**
    fixed: 'The instrument REFUSES, exit 3 PRECONDITION NOT MET. Measured: exit=3.'
  - id: 2
    what: '**A TRACKED FILE DELETED FROM THE WORKTREE IS SWALLOWED.**'
    measured: >
      `xargs` exits **123** on the missing path, but **a pipeline''s exit status is its LAST
      command''s**, so the one-liner returns 0 and prints a fingerprint (`d76b8647…`) for a tree
      that does not hold together.
    fixed: 'REFUSES, exit 3, and NAMES the unreadable paths. Measured: exit=3, `UNREADABLE: …/PID.md`.'
  - id: 3
    what: 'A VACUOUS RUN — zero files — is a hash, not a refusal.'
    fixed: 'REFUSES.'
  and_one_thing_that_is_NOT_a_defect_but_is_an_UNDECLARED_LIMIT:
    what: '**FILE MODE IS INVISIBLE.**'
    measured: '`chmod +x PID.md` leaves the fingerprint IDENTICAL (`f659601e…` both sides).'
    disposition: 'DECLARED in the instrument header. A file becoming executable is a real change to a tree and this does not see it. NOT PROVED TO BE CARRIED ANYWHERE.'

THE_RENAME_TEST_BOTH_SIDES_MEASURED_BY_ME:
  on_the_project_leads_arm_b: |
    Recipe (b) is `-path ./.pytest_cache -prune` — **IT NAMES ONE DIRECTORY.**
      baseline                                   8f01db7ba182b082…
      after pytest, DEFAULT cache dir            8f01db7ba182b082…   (pruned correctly)
      after pytest -o cache_dir=.other_cache     **0742cf9d40666dd2…  MOVED**
    **(b) FAILS THE RENAME TEST. THE PROJECT LEAD'S HYPOTHESIS IS CONFIRMED BY MY OWN ARM.**
  on_my_own_instrument: |
      the same three states                      8f01db7b… / 8f01db7b… / 8f01db7b…
      **IT SURVIVES THE RENAME.**
  AND_THE_REASON_IS_NOT_THE_ONE_THE_PROJECT_LEAD_GAVE_WHICH_IS_A_STRONGER_RESULT: >
    The disclosure says (c) works because it *"delegates the question to `.gitignore`"*. **MEASURED,
    THAT IS NOT WHY IT SURVIVED THE RENAME.** `.other_cache` is NOT in this repository's
    `.gitignore` — and git ignored it anyway, because **PYTEST WRITES ITS OWN `.gitignore`
    CONTAINING `*` INSIDE ITS CACHE DIRECTORY, WHATEVER THAT DIRECTORY IS CALLED.**
    `git ls-files --others --ignored --exclude-standard` names `.other_cache/.gitignore`,
    `.other_cache/CACHEDIR.TAG`, `.other_cache/README.md`, `.other_cache/v/cache/nodeids`.
    **THE STRUCTURAL PROPERTY IS THAT THE IGNORE DECLARATION TRAVELS WITH THE ARTEFACT**, not that
    the repository's root `.gitignore` happens to hold the right name. That is a better reason than
    the one offered and it is the reason the delegation is worth having.

THE_KNOWN_COST_AND_I_MEASURED_IT_NARROWER_THAN_IT_WAS_DISCLOSED:
  the_disclosure: '*"it depends on `.gitignore` being CORRECT — a wrongly-ignored product file becomes invisible to the fingerprint. **THAT IS A REAL WEAKENING AND IT MUST BE DECLARED**"*.'
  what_I_MEASURED: |
    A hostile `.gitignore` containing `*` dropped into `src/crash_detector/engine/`:
      files fingerprinted: 468 -> 468       fingerprint 8f01db7b… -> 8f01db7b…  UNMOVED
      tracked engine files still listed: 5
    **AN IGNORE RULE CANNOT HIDE TRACKED CONTENT.** `git ls-files --cached` lists every tracked file
    REGARDLESS of any ignore rule. The weakening therefore reaches **ONLY FILES THAT WERE NEVER
    COMMITTED.**
    The other half, so the bound is not mistaken for a closure — an UNTRACKED new product file
    under that same rule:
      with the hostile .gitignore:  468 files, EXCLUDED 2, fingerprint 8f01db7b…  **HIDDEN**
      with it removed:              469 files,             fingerprint e956f603…  **SEEN**
  how_this_is_reported_and_why_carefully: >
    **"SAFER THAN DISCLOSED" IS THE DIRECTION A READER WAVES THROUGH**, so it is asserted rather
    than asserted-about: `test_an_ignore_rule_can_never_hide_TRACKED_content` fails if a future git
    or a future flag changes it. **THE RESIDUE IS STILL REAL** — an untracked file IS hidden — and
    the only signal a reader gets is the printed exclusion count.
  what_the_instrument_DOES_about_a_weakness_it_cannot_fix: >
    **IT PRINTS EVERY PATH IT EXCLUDED.** It cannot verify that `.gitignore` is correct; it can make
    the CONSEQUENCE of `.gitignore` being wrong VISIBLE instead of invisible. **THE SHIPPED
    RECIPE'S INCLUSION OF CACHE FILES WAS INVISIBLE FOR EXACTLY AS LONG AS NOBODY PRINTED IT.**
    That is this seat's own contribution to the design and it is the answer to the disclosed cost.

did_this_seat_adopt_the_project_leads_SHAPE:
  answer: >
    **THE VALUE, YES. THE FORM, NO.** The digest is BYTE-IDENTICAL to
    `git ls-files -z --cached --others --exclude-standard | sed -z 's|^|./|' | LC_ALL=C sort -z |
    xargs -0 sha256sum | sha256sum` — asserted by
    `test_it_reproduces_the_historic_shell_recipe_byte_for_byte`, because **A FINGERPRINT
    INSTRUMENT THAT SILENTLY CHANGED THE VALUE WOULD INVALIDATE EVERY RECORDED FIGURE IT WAS BUILT
    TO PROTECT.** Everything else — the three refusals, the printed exclusions, the declared limits
    — is not in the recipe and is this seat's.
  the_sed_prefix: >
    The Project Lead disclosed that `sed -z 's|^|./|'` *"exists only to reproduce the historic `./`
    path spelling"*. **CORRECT, AND IT IS KEPT FOR EXACTLY THAT REASON**, in the instrument's digest
    construction, with the reason written at the line that does it.

