why_the_brief_leads_with_this_seats_own_two_HIGH_findings: >
  **BECAUSE THE ALTERNATIVE IS SETTING THE AUDITOR AN EASIER PAPER THAN THE ONE THIS SEAT SET THE
  ENGINEER.** The gate's central proposition is *"the class of 99 is sealed"*, and the two most
  recent independent measurements of that exact property — the sixth Assurance seat's and this
  seat's — **were both wrong, in the same direction, and agreed with each other.** An auditor that
  discovered that itself, after budgeting on the record's numbers, would have been trapped by the
  brief rather than helped by it. **AND THE GENERAL LESSON IS PUT IN FRONT OF IT IN TERMS: agreement
  between two independent readings was treated as evidence when both readings shared a blind spot.
  ASSUME THAT IS STILL TRUE SOMEWHERE IN THIS RECORD AND THAT NOBODY HAS FOUND IT YET.**

