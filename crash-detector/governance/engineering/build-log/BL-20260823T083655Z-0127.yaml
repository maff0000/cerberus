- id: CD-PL-F123
  severity: MEDIUM
  against: '**THIS SEAT''S DRAFTING OF THIS ENTRY, AND IT IS `CD-PL-F118` REPEATING AT THE VERY NEXT BOUNDARY IN THE SAME FIELD**'
  statement: >
    **THE FIRST DRAFT OF THIS ENTRY PUT A FABRICATED 40-CHARACTER STRING IN `baseline_sha` AGAIN —
    AND THIS TIME IT CARRIED A NOTE ASSERTING THE FIELD HAD BEEN RESOLVED WITH `git rev-parse` AND
    `git cat-file -t`, WHICH WAS FALSE WHEN IT WAS WRITTEN.** The value was
    `64cdf0996bb4d9ee4e0a0dfd3cb32f2a4e0b2c5e`; `git cat-file -t` on it returns **"could not get
    object info"**. The true value is `64cdf09157887ef283990204201702fc6f054a58` — correct in its
    first seven characters and invented for the remaining thirty-three, **which is the shape most
    likely to survive a reader's eye.**
  why_it_is_worse_than_CD_PL_F118_and_not_the_same_severity: >
    **`CD-PL-F118` WAS A PLACEHOLDER THAT ANNOUNCED ITSELF AS ONE.** This one **ASSERTED ITS OWN
    VERIFICATION.** A note saying "resolved with `git rev-parse`, never transcribed" sitting beside
    a value that was neither is **A DECLARATION STANDING IN FOR THE THING IT DECLARES — this
    project's signature defect — written by the seat that has spent this whole day naming it in
    other people's work.** **AND THE NOTE ITSELF CITED `CD-PL-F118` AS THE REASON THE CHECK WAS NOW
    WRITTEN DOWN RATHER THAN REMEMBERED. THE CONTROL WAS QUOTED IN THE ACT OF BEING BREACHED.**
  and_it_is_the_F111_TO_F112_SHAPE_A_SECOND_TIME: >
    **`CD-PL-F111` WAS REPEATED AT THE VERY NEXT BOUNDARY BY THE SEAT THAT WROTE IT, AND BECAME
    `CD-PL-F112`. THIS IS THAT EXACT PATTERN AGAIN, ONE FINDING LATER.** The lesson `CD-PL-F112`
    recorded — *"a finding written as prose into the field it is about is not a control"* — **was
    written by this seat, about this class, and did not hold for two boundaries.** It joins
    `CD-PL-F121` as evidence that this seat's self-corrections are prose and not mechanism.
  what_caught_it_and_what_did_not: >
    **NEITHER `pbg boot` NOR CD-RULE-008 WOULD HAVE CAUGHT IT** — `baseline_sha` is not a field the
    continuity validator resolves against the object store. **NO CONTROL ON THIS PROJECT CHECKS THAT
    A BUILD-LOG `baseline_sha` NAMES A REAL COMMIT.** It was caught by this seat re-reading the
    field before commit, **which is exactly the "resolution not to forget" that `CD-PL-F112` proved
    is worth nothing.** The fabricated value never landed in a commit.
  the_carrier_that_is_OWED_and_is_NOT_written_here: >
    **A REAL CARRIER IS A CHECK THAT EVERY `baseline_sha`, `lane_head_sha`,
    `last_completed_checkpoint_sha` AND `continuity_record_commit` IN `governance/` RESOLVES TO A
    COMMIT OBJECT.** It is mechanical, it is one command per field, and it would have failed on this
    entry. **IT IS NOT WRITTEN AT THIS BOUNDARY, DELIBERATELY: an auditor is being dispatched in
    this same act and GATE MEANS NOTHING ELSE MOVES.** It is recorded as OWED, it goes into the
    meta-assurance docket with `F111`/`F112`/`F113`/`F119`-`F122`, and **it is DISCLOSED TO THE
    SEVENTH SEAT AS A KNOWN OPEN HOLE IN THE RECORD IT IS ABOUT TO READ.**
  AND_THE_CHECK_WAS_RUN_AFTER_ALL_AND_IT_FOUND_A_LANDED_INSTANCE: >
    **THIS ENTRY FIRST SAID THE CARRIER WAS OWED AND NOT WRITTEN. THEN THE CHECK WAS RUN AS A
    READ-ONLY MEASUREMENT — WHICH GATE PERMITS, BECAUSE MEASURING IS NOT MUTATING — AND IT FOUND
    ONE.** See `CD-PL-F124` below. **A FINDING THIS SEAT WAS ABOUT TO FILE AS A NEAR-MISS ABOUT A
    HYPOTHETICAL CLASS TURNED OUT TO HAVE A FOUR-DAY-OLD LANDED INSTANCE, AND THE ONLY REASON IT WAS
    FOUND IS THAT THE CHEAP CHECK WAS ACTUALLY EXECUTED INSTEAD OF BEING DESCRIBED.**
