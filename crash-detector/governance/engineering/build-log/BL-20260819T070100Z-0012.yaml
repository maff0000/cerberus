findings_raised:
- id: CD-PL-F36
  severity: HIGH
  title: 'A FABRICATED commit SHA was written into the continuity record'
  detail: >
    ACTIVE_WORK.yaml recorded last_completed_checkpoint_sha
    17d77219dd3f4a8b6e3d43ee1ed4bbeff2c7d0e1. No such object exists. The real commit 17d7721 is
    17d772157fc33a7b4df6e4e1f1dd81da0eefddf0: the two share only the 7-character prefix a reader
    would recognise, and the remaining 33 characters were invented. The same fabricated value was
    written twice more, as baseline_sha and current_sha in BL-20260819T064300Z-0011.

    WHY THIS IS HIGH AND NOT COSMETIC. This project stakes its continuity on the claim that a
    recorded SHA is a real, checkable anchor — CLAUDE.md requires a durable checkpoint with the
    exact SHA at every material boundary, and PBG-CONT-007 says a result existing only in
    conversation is not project state. A SHA that resolves to nothing is conversation wearing the
    costume of state. It reads as authoritative, it survives review by eye because the prefix is
    right, and it silently destroys the ability to reconstruct what was actually checkpointed. Had
    the framework not refused the boot, this seat would have resumed from a checkpoint that does
    not exist.

    WHAT WORKED. No human and no reader caught this. `pbg boot` caught it, mechanically, and
    BLOCKED rather than warned. The reference-integrity stage of the continuity check earns its
    place, and this entry records that as evidence for it.
  disposition: >
    REPAIRED IN ACTIVE_WORK.yaml, to 17d772157fc33a7b4df6e4e1f1dd81da0eefddf0 — the true SHA of
    17d7721, which is the value the record plainly MEANT: its own working_tree_state field names
    "main clean at 17d7721" in prose two lines below. Intent was preserved and nothing was
    re-pointed at a different commit. An inline comment at the site records that the value was
    repaired and why, so the repair is legible to the next reader rather than invisible.

    NOT repaired in BL-20260819T064300Z-0011. The Build Log is append-only and corrections
    supersede, never edit (PBG-CONT-003, non-waivable). THIS ENTRY IS THAT CORRECTION: wherever
    BL-...-0011 says 17d77219dd3f4a8b6e3d43ee1ed4bbeff2c7d0e1, read
    17d772157fc33a7b4df6e4e1f1dd81da0eefddf0.
- id: CD-PL-F37
  severity: MEDIUM
  title: 'ACTIVE_WORK.yaml was left syntactically invalid — boot RED, resume blocked'
  detail: >
    The increment-5 seat wrote three unescaped apostrophes inside a single-quoted YAML scalar in
    remaining_items (CD-AC-012's, the PL's, this project's, at lines 97, 98 and 100). In YAML a
    single quote inside a single-quoted scalar must be doubled, so the first one terminated the
    string and the file stopped parsing at line 97. Continuity classified
    CONTINUITY_SYNTAX_INVALID / RESUME_BLOCKED and the boot verdict was RED.

    The same seat escaped apostrophes correctly elsewhere in the same list — the Engineer''s
    writable_scope, four items later, is properly doubled. So this is a slip, not a
    misunderstanding, which is exactly the kind of defect a machine check catches and a careful
    author does not.
  disposition: >
    REPAIRED — the three apostrophes doubled, no other change to the scalar and no change to its
    meaning. Re-verified: continuity now classifies CONTINUITY_MATCH and the boot verdict is AMBER,
    the AMBER being the pre-existing untracked operator files and the absent ROADMAP.md, both
    already disclosed in the record. Verdict moved RED to AMBER by this repair alone.
- id: CD-PL-F38
  severity: LOW
  title: 'One residual CD-PL-F35(b) escape — the motion pattern window is four words wide'
  detail: >
    Probe p5, "Every instruction eventually flows straight through to the nominated clearer",
    escapes the inherited guard. The cause is structural and small: pattern E scans at most four
    words past the motion verb for a destination noun, and here the destination sits six words
    past it behind "straight through to the nominated". The vocabulary is right — `flows` is in
    MOTION_VERBS and `clearer` is in DESTINATION_NOUNS — the window is simply too short for prose
    with two stacked particles and an adjective.

    This is a RESIDUAL OF THE SAME CLASS as (b), not a new class, and that distinction is what
    keeps CD-D-014 honest rather than being quietly reinterpreted.
  disposition: 'Bounded and ruled by CD-D-015 below. It is the LAST hardening permitted.'

decisions_closed:
- id: CD-D-015
  title: 'The inherited increment-6 material — KEEP AS UNATTESTED CANDIDATE, and the guard stops here'
  ruling: >
    KEEP AS UNATTESTED CANDIDATE. The same disposition as CD-D-009 and the opposite of CD-D-007,
    and as in both cases the reason is the evidence, not the convenience.

    KEEP, on five findings this seat produced itself rather than accepted: the material is inside
    the Engineer writable_scope and touches no protected path; it matches the standing increment-6
    brief item by item; it does not break the clean arm (PASS, 29775 assertions); it closes all
    three reported CD-PL-F35 defects under replant, including the false positive, which is the half
    that mattered most because a guard that cries wolf on this project own work-order vocabulary is
    a guard somebody eventually weakens; and it causes no regression on genuine order pathways
    (p6) and no new noise on innocent prose (p7). Discarding work of that quality to rewrite it
    would cost a full increment and buy nothing.

    UNATTESTED, and the word is doing real work. No Engineer seat returned it, no seat Build Log
    entry exists for it, and it is INCOMPLETE IN A WAY THAT IS VISIBLE IN THE CODE ITSELF: the new
    docstring points the reader at the guard DECLARED LIMIT "see the check header", and there is no
    such header. `grep -rn "DECLARED LIMIT" tools/ required-tests.yaml` returns that single dangling
    forward reference and nothing else. The deliverable CD-D-014 actually required — the guard
    stating its own limit, in the check and in its register entry — was never written. Two added
    names are also missing from __all__. This is a seat stopped mid-sentence, and it is admitted as
    a CANDIDATE BASE for the next Engineer instance, never as a completed increment.

    AND THE CHASE ENDS HERE. CD-D-014 granted ONE further pass and then required the guard to
    declare its own limit. That pass is the material now in hand; it is unfinished, so finishing it
    is not a second pass. CD-PL-F38 is folded into it as a one-line widening of an existing window
    and NOTHING ELSE is permitted: no new pattern, no new vocabulary category, no new layer. If a
    further escape is found after that, it is DECLARED AS A LIMIT and not fixed. The reasoning is
    the PO-accepted CD-BP-001 — an AST check is never a sole guard for CD-AC-012, so the marginal
    value of the next escape closed is small while the cost of an unbounded chase is a work order
    that never ends and a gate that never arrives.
  rationale_recorded_because: >
    A reader in six months will see the Project Lead keep uncommitted work it did not commission
    from a seat that died without returning. The evidence for that choice, and its limits, belong
    in the record and not in a lost context window (PBG-CONT-007).
- id: CD-D-016
  title: 'The Project Lead may not finish the inherited work itself'
  ruling: >
    Recorded because it was a live temptation and the reasoning should be visible. The remaining
    increment-6 work is small, well understood, and this seat has just characterised it precisely
    enough to do it. It will not. Writing the guard limit and widening the window is Engineer work
    under CD-ENG-WO2-01; a Project Lead that implements what it will then reconcile has collapsed
    the separation the whole record depends on, and it would do so for the sake of saving one
    dispatch. The Engineer and the Assurance Engineer are never the same agent (PBG-SOD-001,
    non-waivable), and the Project Lead is not a spare pair of hands for either.

