why_it_matters_more_than_a_count: >
  **IT IS THE CD-PL-F82 FAMILY, COMMITTED BY THE PROJECT LEAD, IN THE ENTRY THAT RULED ON THAT
  FAMILY.** A figure stated in a summary that recomputes to something else when the underlying
  enumeration is read. F82 was 24-against-27; this is two-against-three. The mechanism is identical
  in both: a COUNT written by hand beside a LIST maintained separately, with nothing that recomputes
  one from the other. The Project Lead ruled at CD-D-120 that such a figure must be RE-TAKEN rather
  than transcribed, and then wrote one by hand in the same document.
  IT UNDERSELLS AND WEAKENS NOTHING — three findings were raised, all three are fully recorded, and
  the one omitted from the count is the one MOST damaging to this seat. The direction of the error
  is worth stating plainly: **the summary made this seat look better than the record does.** That is
  the direction this project treats as most dangerous, which is why it is corrected within the hour
  rather than at the next boundary.

