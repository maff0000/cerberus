  *** **THE BRIEF DISCLOSES, BEFORE THE SEAT RUNS ANYTHING: THE DELIBERATE RED DOORS ROW AND ITS TWO
  FAILING TESTS · CD-D-146 UNRULED · CD-PL-F97 · CD-PL-F98, WHICH IS THE PROJECT LEAD'S OWN METHOD
