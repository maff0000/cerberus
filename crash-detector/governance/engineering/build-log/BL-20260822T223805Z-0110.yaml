  **A DISCLOSED HOLE IS A MEASURED LIMIT. AN UNDISCLOSED ONE IS A TRAP**, and this project has never
  found out anything useful by letting an auditor discover the record's own state as a surprise.

decisions_taken_at_this_boundary:
- id: CD-D-147
  title: >
    **THE FIFTH SEAT IS DISPATCHED NOW, AGAINST A TREE THAT SHIPS A RED REGISTER ROW, RATHER THAN
    HELD UNTIL CD-D-146 IS RULED.**
  the_question_it_answers: >
    CD-D-146 is unruled. Does the fifth seat wait for the Product Owner, so it audits a settled tree?
  the_ruling: >
    **NO. IT GOES NOW, AND CD-D-146 TRAVELS UP IN PARALLEL.**
  why: >
    **(1) RULING 5 IS UNCONDITIONAL AND RULING 6 SEQUENCES THE SEAT IMMEDIATELY AFTER THE INCREMENT.**
    Holding it would be this seat re-sequencing the Product Owner's own order, which it is explicitly
    not permitted to do. **(2) THE SEAT IS READ-ONLY AND GRADES WHAT IS IN FRONT OF IT.** A RED
    register row and two failing tests are DISCLOSED STATE, not a precondition. **(3) THE TARGET IS
    STABLE EITHER WAY:** no code moves while an auditor is out, because nothing is authorised without
    a ruling and a dispatch and this seat will open neither. So `9f7b764` is still `9f7b764` when the
    audit finishes, whether or not CD-D-146 has been answered meanwhile.
    **(4) AND THE HONEST REASON THAT CUTS THE OTHER WAY, STATED RATHER THAN OMITTED:** if the Product
    Owner rules on `guarded` and orders code changed, the fifth seat's verdict will be against a tree
    one commit behind. **THAT COST IS REAL AND THIS SEAT IS ACCEPTING IT** — the same thing happened
    at the fourth gate with the T2 addendum, and what came back was the most valuable verdict on the
    record.
  how_it_could_be_wrong: >
    If the answer to CD-D-146 turns out to change the doors instrument's MEMBERSHIP RULE rather than
    the product code, then T4 and T12 were graded against a definition that moved underneath them and
    a sixth seat is owed. **THAT IS THE FAILURE MODE OF THIS DECISION AND IT IS WRITTEN DOWN IN
    ADVANCE SO IT CAN BE GRADED, NOT DEFENDED.**

