the_architecture_dispatched_and_it_is_THIS_SEATS_composition_not_PO_text:
  rule_CC_the_root_partition: >
    Every property of an envelope contract's root `properties` is EXACTLY ONE of (a) a CANONICAL
    DIAL SLOT spelled literally `{"$ref": "#/$defs/dial_reading"}` with no sibling keyword, or (b) a
    DECLARED NON-DIAL PROPERTY whose name is on a finite written allowlist AND which is
    AFFIRMATIVELY PROVED — by driving the LIVE GATE — incapable of carrying a `detail_level`.
    ANYTHING ELSE IS A VIOLATION. No recogniser is consulted at the root.
  why_it_closes_what_the_recogniser_could_not: >
    `CD-CALM-SLOTS-007` today compares `dial_bearing` (recogniser output) against `found` (literal
    `$ref` slots). **A ROOT PROPERTY THE RECOGNISER ANSWERS `False` ABOUT IS IN NEITHER SET, SO THE
    COMPARISON IS SATISFIED AND THE SLOT IS INVISIBLE.** That is the hole exactly, and it is why
    `status`, the `enum`-spelled dial, the 25-deep nest and `present:false` all pass — they are not
    RECOGNISED, so they are not COMPARED. The partition does not recognise: the root `properties`
    key set is finite and enumerable, both limbs are decidable by equality, and the root carries
    `additionalProperties: false`. **A310-F2 AND A310-F3 ARE NOT CLOSED BY THIS — THEY ARE
    UNREACHABLE.**
  and_the_affirmative_check_becomes_expressible_which_is_the_whole_point: >
    With the branch set as the whole alphabet: a branch may reference the calm-bearing
    `#/$defs/detail_level` IF AND ONLY IF its state is in PRESENT_STATES and it requires a freshness
    stamp; every other branch MUST reference `#/$defs/absent_data_detail_level`. **A never-before-
    named state must arrive as a new branch, a new branch's state is not in PRESENT_STATES,
    therefore it cannot carry `calm` — BY CONSTRUCTION, OVER A CLOSED SET.** That is
    PO-DECISIONS-0027 ruling 5 made achievable, which is what PO-DECISIONS-0028 ruling 2 ordered.
  IT_IS_A_COMPOSITION_AND_IS_LABELLED_AS_ONE: >
    **RULE CC, THE ALLOWLIST-PLUS-LIVE-GATE FORM OF LIMB (b), AND THE FRESHNESS-STAMP ASSERTION ARE
    THIS SEAT'S ENGINEERING COMPOSITION IMPLEMENTING A PO RULING. THEY ARE NOT PO TEXT.** The
    ruling states the PRINCIPLE — canonical path, present+freshness required by the schema,
    deny-by-default at validation, value check sufficient inside — and this seat chose the
    mechanism. If the Product Owner wanted a different mechanism, this is the paragraph to correct.

