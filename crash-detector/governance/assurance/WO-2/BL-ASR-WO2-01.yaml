W5_structures_the_plants_stand_on:
  purpose: A guard over an absent structure is theatre. Each structure was verified directly.
  blueprint_4_grant_matrix:
    verdict: VERIFIED LIVE
    detail: >
      Read out of a live catalogue built by this seat from the seven subject-tree migrations.
      138 assertions, 0 violations, reproduced twice including once after a full cluster reset.
      cd_engine holds NO privilege of any kind on schema witness by any of the seven routes, AND
      PostgreSQL refuses cd_engine's SELECT and INSERT against witness.observation and
      witness.reading in a real session. The append-only tables carry no UPDATE or DELETE grant for
      any role; a planted UPDATE on dial.history and DELETE on publication.public_envelope was
      caught by the whole-store sweep.
  blueprint_7_types:
    verdict: VERIFIED
    detail: >
      EquityCrashScore and MonetaryDebasementScore each have MRO [Self, object] - NO shared base
      beyond object, and neither registers as numbers.Number. Neither defines ANY name from
      ARITHMETIC_DUNDERS. `operator.add(equity, monetary)` raises TypeError. DialSet exposes ZERO
      public members, so there is no scalar to reach for. `evaluate()` was run with `builtins.open`
      and `socket.socket` replaced by trip-wires that raise: it completed without tripping either,
      so it performs no file or socket I/O. With the empty registry BOTH dials read Unknown, reason
      NO_REQUIRED_INPUTS_DECLARED.
  blueprint_5_collectors:
    verdict: VERIFIED BEHAVIOURALLY, not from the docstring
    detail: >
      An adapter raising a bare BaseException (not an Exception) was driven through `collect`. The
      exception PROPAGATED - it was not swallowed - AND one attempt row was still written, because
      the sink write is in a `finally`. The row was classified FetchFailed, not OK. The four
      outcomes are genuinely distinct rather than three spellings of absence: OK carries
      (payload, source_as_of_utc), FetchFailed carries (error_class, http_status), Malformed carries
      (schema_error_class, instance_path), Empty carries nothing, and all four are unrelated types.
      `outcome_class` on an unrecognised value RAISES rather than defaulting, and its own message
      says "there is no fall-through, least of all to OK".
  blueprint_6_absence_and_staleness:
    verdict: VERIFIED WITH ONE EXCEPTION
    detail: >
      Absent row, future-dated row, stale row, feed-unreachable row, incoherent row and unrecognised
      state ALL resolve to Unavailable; every fall-through in `resolve_panel` lands on Unavailable
      rather than agreement. The exception is finding CD-ASR-F06: staleness is defined relative to a
      configured window that is bounded below and at infinity but not above.
  blueprint_2_and_3_container_set:
    verdict: VERIFIED AS DESIGN
    detail: >
      Read directly from deploy/compose.yaml. Both networks declare `internal: true`. Egress:
      cd-store NONE, cd-engine NONE, cd-public NONE, cd-private NONE - the four BLUEPRINT 13
      requires to have none; cd-collectors, cd-witness and cd-review ALLOWLIST with EMPTY host
      lists. The only published ports are 127.0.0.1:8710 and 127.0.0.1:8711, both loopback-bound.
      cd-store is pinned BY DIGEST to postgres@sha256:cf78e766...20685, which this seat
      independently confirmed is the digest of postgres:16-alpine on this host, and which it used
      for its own container. The Python base is HONESTLY UNRESOLVED: deploy/base-images.json records
      status DIGEST_NOT_RESOLVED with the reason, and every Dockerfile uses `ARG CD_PYTHON_BASE`
      with NO DEFAULT while compose passes `${CD_PYTHON_BASE:?...}`, so both build and compose
      refuse rather than falling back to a tag. That is a fail-closed absence, not a gap.
  empty_source_registry:
    verdict: VERIFIED
    detail: "EMPTY_SOURCE_REGISTRY is SourceRegistry(sources=()) - zero ingredient sources, as CD-D-005 requires."
  additional_observation_supporting_CD-RT-012:
    detail: >
      All six application Dockerfiles COPY exactly two paths, `src/` and `deploy/entrypoints/`, and
      nothing else. Both are inside the five roots CD-RT-012-NO-EXECUTION-INTERFACE scans. This
      materially BOUNDS that check's declared limit 5: source outside the scanned roots cannot reach
      a shipped image. The declaration does not claim this; this seat verified it, and it makes the
      limit smaller in practice than the text admits.

judgement_on_the_CD-RT-012_declared_limit:
  question_asked_by_the_dispatch: Was the limit honestly drawn?
  answer: YES - HONESTLY DRAWN, and drawn conservatively.
  reasoning: >
    This seat's variant that escaped this check - an order ticket placed in `scripts/`, outside the
    five scanned roots - landed SQUARELY INSIDE stated boundary 5, which names the five roots and the
    two suffixes and says in terms that "an order interface delivered as a shell script, a compose
    command, a CI job or a dependency's own code is outside this check entirely". The variants that
    tested the boundaries from the inside were all caught: a neutrally-named order ticket on its
    field set (boundary 2's stated residue does not extend to it), and an unheard-of SDK on its
    execution token. The declaration carries a MEASURED example for each boundary rather than a
    hedge, cites the decisions that commissioned (CD-D-014) and bounded (CD-D-015) it, states the
    evidence FOR the limit (that two rounds of probing each found a fresh escape), and instructs the
    reader not to treat a clean run as proof of the proposition. It also understates its own
    protection, per the Dockerfile observation above.
  is_it_a_defect_described_in_the_tone_of_a_design_choice: >
    NO. A defect dressed as a design choice would describe the escape vaguely and claim compensating
    control it did not have. This one names the escapes precisely enough that an auditor can execute
    them - this seat did - and it names three compensating guards that DO exist and that this seat
    verified bite. The one thing worth saying plainly: the euphemism boundary (1) is genuinely
    unbounded and always will be, so the weight on CD-AC-012 rests where the declaration itself says
    it should - on the egress posture, which constrains what the software CAN DO rather than what it
    says. That posture is sound at WO-2 except for finding CD-ASR-F04.
  caveat: >
    The honesty of THIS declaration should not be generalised. CD-AC-002's AST guard has comparable
    limitations (intra-procedural, static) and NO comparable written declaration, which is why
    CD-ASR-F01 is reported at HIGH.

verdicts:
  basis: >
    Per-criterion, because the gate is per plant. Each carries its confidence and its scope. The
    contrast requirement of the gate - same declared command, exit 0 clean and non-zero violated -
    is MET BY ALL ELEVEN DECLARED TESTS. The verdicts below are lower than that alone would give
    because the register declares every one of these tests `scope: CLASS`, and W3 tested that claim.
  per_criterion:
  - criterion: CD-AC-001
    verdict: AMBER
    confidence: HIGH
    contrast: MET - both tests, exit 0 clean, exit 1 violated.
    scope_examined: Both declared tests in both arms; three variant plants of this seat's own.
    basis: >
      CD-ASR-F02 (HIGH) - a numeric attribute on `Unknown` defeats BOTH guards and makes absence
      render as 0.0, and that route is named in the register's own declared class. CD-ASR-F03
      (MEDIUM) - a module-level numeric constant defeats the AST guard, though the behavioural test
      catches it.
    not_examined: >
      Latency. PID 6 says the affected dial must show UNKNOWN or DEGRADED "within the assurance
      latency budget". Neither declared test measures time, and no runtime exists at WO-2 to measure
      it against. The temporal half of this criterion is UNEVIDENCED, by both seats.
  - criterion: CD-AC-002
    verdict: AMBER
    confidence: HIGH
    contrast: MET - all three tests, exit 0 clean, exit 1 violated.
    scope_examined: All three declared tests in both arms; two variant plants, each run against all three layers and then executed.
    basis: >
      CD-ASR-F01 (HIGH) - two working blends pass all three layers simultaneously, refuting the
      register's specific claim that a blend slipping past one layer must fail the other two. The
      closed schema still stops a combined field reaching the published envelope.
    not_examined: Nothing dispatched was left unexamined for this criterion.
  - criterion: CD-AC-003
    verdict: PASS
    confidence: HIGH
    contrast: MET - both tests, exit 0 clean, exit 1 violated.
    scope_examined: >
      Both declared tests in both arms; nine variant plants, seven of them against a live PostgreSQL
      catalogue this seat built from the subject tree's own migrations.
    conditions:
    - CD-ASR-F05 (MEDIUM) - the code-graph guard's root excludes deploy/entrypoints/cd_engine.py,
      which is the engine container's actual process. Named as a condition, not a bar to PASS,
      because the criterion's decisive structure - that cd_engine cannot reach witness DATA - was
      proved live by seven catalogue routes and by PostgreSQL refusing cd_engine in a real session.
    - CD-ASR-N02 (LOW) - the live check declares no clean-cluster precondition.
    basis: >
      This is the best-evidenced criterion in the deliverable and the only one where every variant
      this seat could devise was caught. The independence problem the dispatch flagged - two runs,
      both by the implementing seat - is DISCHARGED: this is a third run, by a different seat,
      against a store the implementing seat never touched.
    not_examined: >
      The byte-identical-score half of PID 6 ("the score computed with witnesses unreachable is
      BYTE-IDENTICAL") was not exercised end-to-end, because with the empty WO-2 source registry
      both dials read Unknown and there is no score to compare. UNEVIDENCED at WO-2 and correctly so.
  - criterion: CD-AC-005
    verdict: AMBER
    confidence: HIGH
    contrast: MET - exit 0 clean, exit 1 violated.
    scope_examined: The declared test in both arms; four variant plants, two caught and two not.
    basis: >
      CD-ASR-F06 (MEDIUM) - a finite but unbounded configured staleness window lets a decade-old row
      render WITNESS AGREES, which is within the criterion's stated proposition that no input
      whatever may produce agreement. CD-ASR-F07 (LOW) - an exception handler route is undetected
      but was not shown to be exploitable.
    counter_evidence_recorded: >
      The resolver is otherwise strong: every fall-through lands on Unavailable, the rendering table
      is guarded, and a malformed row is caught. Two of this seat's four variants were caught.
  - criterion: CD-AC-012
    verdict: AMBER
    confidence: MEDIUM
    contrast: MET - all three tests, exit 0 clean, exit 1 violated.
    scope_examined: >
      All three declared tests in both arms; seven variant plants across source scanning, the
      dependency manifests and the egress posture.
    basis: >
      CD-ASR-F04 (MEDIUM) - a broker reachable by IP literal is not caught by the egress check, and
      unlike the source-scanning check's boundaries this one is NOT declared anywhere. That is the
      whole of the AMBER.
    why_not_lower: >
      The escapes in the source-scanning check all landed inside its WRITTEN declared limit, which
      this seat judges honestly drawn (see above). Per CD-D-014 that is a finding against the
      declaration and not an automatic RED, and on examination the declaration survives.
    why_not_PASS: >
      Confidence is MEDIUM rather than HIGH because CD-AC-012's structural weight rests on the
      egress posture by the declaration's own argument, and that is precisely the layer where this
      seat found an undeclared gap.
    not_examined: >
      Runtime. No container was built and none may be at WO-2 (PBG-RT-010). Everything here is a
      static read of source and declaration at one commit. The compose egress posture is a
      DECLARATION with no per-host enforcement primitive - the check says so itself - so no packet
      was observed and none is claimed.

overall_verdict:
  value: AMBER
  rule: The worst of the five per-criterion verdicts.
  meaning: >
    MATERIALLY SOUND, WITH NAMED CONDITIONS. The WO-2 gate's own test - all five planted violations
    proved to fail correctly by contrast - IS MET, on all eleven declared tests, run independently.
    Nothing in this audit is a RED: no control was bypassed in the delivered tree, no evidence was
    found to be self-vouching, no substitute target was accepted, and the register does not grade
    itself. The AMBER is entirely about the distance between `scope: CLASS` as declared and class
    coverage as demonstrated, for four of the five criteria.
  what_this_verdict_is_not: >
    NOT AN ACCEPTANCE (PBG-AUTH-003). This seat supplies evidence and a verdict; the Product Owner
    accepts. This seat also did not repair anything it found (PBG-SOD-004) - every finding above is
    handed back for the Engineer to repair under a separate dispatch.

continuation_implication:
  stated_separately_because_truth_and_safety_are_different_calculations: true
  is_the_candidate_true: >
    Substantially yes, within scope. Every structural claim this seat could reach authentically was
    verified against the thing itself: the grant matrix against a live catalogue, the type algebra
    by execution, the collector row-writing by driving a BaseException through it, the compose
    posture by reading it, the register by recomputing its census and hash. The overstatements are
    in the CLASS claims of four AST-style guards, not in the structures they guard.
  is_it_safe_to_proceed: >
    YES, to Product Owner review - and this seat records that it would be safe to proceed to WO-3
    with the seven findings carried as OWED rather than blocking, PROVIDED the Product Owner
    disposes of them explicitly. None of the findings is a live bypass of a running system: there is
    no running system. All seven are latent - they describe violations a FUTURE edit could make
    without tripping a guard, not violations present in the delivered tree. This seat re-ran every
    delivered guard on the clean candidate and all eleven are green.
  what_would_change_that: >
    CD-ASR-F01 and CD-ASR-F02 should be repaired BEFORE any work order writes new code on the dial
    or publication path, because both are exactly the kind of latent hole that a later increment
    closes over by accident. CD-ASR-F04 should be repaired BEFORE the WO-3 egress enforcement lane
    is built, not after, because that lane will enforce the declaration and would inherit the gap.
  what_must_not_happen: >
    The register gate must NOT be treated as opened by the arrival of RTR-WO2-0001. Admitting that
    run moves the five criteria's negative controls to PASS - this seat verified that against the
    real reader - but eleven criteria remain unevidenced and the gate stays SHUT. It should stay
    shut. A gate that opens because five of sixteen were evidenced is not a gate.

