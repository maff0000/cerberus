findings:

- id: CD-ASR-F01
  severity: HIGH
  criterion: CD-AC-002
  title: A working blend of the two dials defeats all three declared layers.
  theme: GUARD_THE_INSTANCE_NOT_THE_CLASS
  what: >
    CD-AC-002 is declared to be enforced at three independent layers - the types refuse arithmetic,
    an AST scan refuses any expression consuming both dials, and the public envelope schema is
    closed - and the register states "a blend that slips past any one layer must still fail the
    other two". Two variant plants by this seat each produce a real combined number and pass ALL
    THREE layers simultaneously.
  variant_1: >
    An inter-procedural fold in the RULE-2-allowlisted serving layer. `src/crash_detector/serving/
    banner.py` defines `_fold(left: float, right: float) -> float: return (left + right) / 2.0` and
    `banner_figure(dials): return _fold(dials.equity.value.score, dials.monetary.value.score)`. The
    call expression holds both dial markers but contains no arithmetic, so RULE 1 does not fire; the
    arithmetic sits one call away inside `_fold`, where the parameters are annotated `float` and
    carry no dial flavour. RULE 2 would have caught the co-occurrence, but `src/crash_detector/
    serving` is allowlisted for RULE 2 by design.
  variant_2: >
    Stronger, because it needs NO allowlisted path. `src/crash_detector/publication/summary.py`
    defines `_SLOTS = ("equity", "monetary")` and `magnitudes = [getattr(dials, slot).value.score
    for slot in _SLOTS]; return sum(magnitudes) / len(magnitudes)`. No dial marker appears in any
    expression: the slot names are plain strings and the check's marker string set holds only
    `equity_crash` and `monetary_debasement`, so nothing is ever flavoured and no rule fires.
  evidence: >
    Both variants: check_no_blend.py exit 0 (PASS, 1032 assertions); test_scores.py and
    test_dialset.py 96 passed; check_schema_closed.py exit 0. Both were then EXECUTED and each
    returned the blended value 0.5 from equity 0.9 and monetary 0.1.
  root_cause: >
    The check's flavour propagation is INTRA-PROCEDURAL by design and its own docstring says so; it
    is also purely static, so `getattr` with a non-marker string literal erases the flavour
    entirely. Neither limitation is written down as a declared limit the way CD-RT-012's is.
  mitigation_that_does_hold: >
    The closed public envelope schema still refuses a combined FIELD, so neither variant can reach
    the published artefact through the validated envelope without also failing
    CD-RT-002-SCHEMA-CLOSED. The structural stop on the public surface holds; what fails is the
    claim that no code path combines them.
  proportionality: >
    CD-BP-001, risk-accepted by the Product Owner, already says the AST register checks are never a
    sole guard. This finding is consistent with that acceptance but is reported because the register
    entry for CD-AC-002 makes a STRONGER claim than CD-BP-001 does - that a blend slipping past one
    layer must fail the other two - and that specific claim is refuted.
  owed: WO-3, at Product Owner disposition.

- id: CD-ASR-F02
  severity: HIGH
  criterion: CD-AC-001
  title: Absence given a numeric attribute renders as a number and defeats BOTH guards.
  theme: GUARD_THE_INSTANCE_NOT_THE_CLASS
  what: >
    Adding a plain property to the `Unknown` reading - `magnitude -> 0.0`, no dunder, no annotation,
    no default - makes absence yield the number 0.0. BOTH declared tests for CD-AC-001 pass:
    check_no_numeric_default.py exit 0, and `pytest tests/test_reading.py tests/test_evaluate.py`
    49 passed, exit 0. The value was then read back at runtime: `Unknown(...).magnitude` is 0.0.
  why_this_is_in_scope: >
    This is not an exotic route this seat invented. The register's OWN negative_control text for
    CD-RT-001-ABSENCE-RENDERS-UNKNOWN names it: "`Unknown` given any attribute or coercion that
    yields a float". The declared class is therefore not covered by the declared test.
  root_cause: >
    tests/test_reading.py checks only that no name from ARITHMETIC_DUNDERS appears in `vars(Unknown)`.
    Nothing asserts that Unknown's attribute surface is CLOSED, so any non-dunder numeric member is
    invisible. The class docstring's promise - "carries no value field of any kind ... there is
    nothing here to accidentally render as a number" - is not enforced by a test.
  owed: WO-3, at Product Owner disposition.

- id: CD-ASR-F03
  severity: MEDIUM
  criterion: CD-AC-001
  title: The AST guard does not catch a numeric default spelled as a module-level constant.
  theme: GUARD_THE_INSTANCE_NOT_THE_CLASS
  what: >
    Replacing the `missing_required` branch of `_evaluate_dial` so it returns
    `Value(value=<ScoreType>(score=QUIET_MAGNITUDE, ...))`, where `QUIET_MAGNITUDE = 0.0` is a
    module-level constant, is NOT detected by check_no_numeric_default.py (exit 0, zero violations).
    There is no `float | None`, no `.get(key, 0)`, no `or 0` and no bare except, so none of the
    routes the check enumerates is present - yet a dial that did not get its inputs now reads 0.0,
    which is the exact failure PID 3.2 forbids.
  contained_by: >
    CAUGHT by the criterion's second test: `pytest tests/test_reading.py tests/test_evaluate.py`
    exits 1 with 9 failures. CD-AC-001 as a criterion is therefore still defended. The finding is
    against CD-RT-001-AST-NO-NUMERIC-DEFAULT's declared `scope: CLASS`, not against the criterion.
  owed: WO-3, at Product Owner disposition.

- id: CD-ASR-F04
  severity: MEDIUM
  criterion: CD-AC-012
  title: A broker reachable by IP literal is not caught by the egress allowlist check.
  theme: GUARD_THE_INSTANCE_NOT_THE_CLASS
  what: >
    Adding `198.51.100.24` to the cd-collectors egress allowlist, in place of a hostname, is NOT
    detected: check_egress_no_broker.py exits 0. The same slot carrying `api.ibkr.com` exits 1. The
    check recognises brokers by NAME, and an IP literal has no name to recognise.
  why_it_matters: >
    This is NOT covered by any declared limit. CD-RT-012-NO-EXECUTION-INTERFACE has a written
    six-point boundary; CD-RT-012-EGRESS-NO-BROKER does not, and its register entry states the class
    as "a broker host added to any container's egress allowlist" without qualification.
  mitigations_verified_by_this_seat: >
    The allowlist is presently EMPTY on all three ALLOWLIST services (cd-collectors, cd-witness,
    cd-review). The four services BLUEPRINT 13 requires to have no egress - cd-engine, cd-public,
    cd-private, cd-store - all declare policy NONE, verified directly from compose.yaml. Both
    networks are `internal: true`. Both published ports bind 127.0.0.1 only. The check's own note
    discloses that Compose has no per-host egress primitive and that enforcement is owed at WO-3, so
    at WO-2 an IP literal would not be enforced either way. The residual risk is that the WO-3
    enforcement lane inherits a gap in the declaration it enforces.
  owed: WO-3, with the egress enforcement lane.

- id: CD-ASR-F05
  severity: MEDIUM
  criterion: CD-AC-003
  title: The engine container's own entrypoint is outside the code-graph guard's root.
  theme: AUTHENTIC_TARGET_VERIFICATION
  what: >
    check_engine_no_witness_reach.py roots its walk at `src/crash_detector/engine/` and scans only
    `src/crash_detector/`. Appending `from crash_detector.witness.panel import Agrees` to
    `deploy/entrypoints/cd_engine.py` - the module that IS the engine container's process - is not
    detected: exit 0. The guard's subject is the engine PACKAGE; the criterion's subject is the
    engine CONTAINER, and they are not the same thing.
  honesty_of_the_declaration: >
    Partial credit is due: the check's docstring states its root explicitly ("nothing reachable from
    src/crash_detector/engine/"), and the register's negative_control repeats it. The scope
    statement is honest. The gap is between that scope and the criterion's.
  mitigation_that_does_hold: >
    Importing witness TYPES is not reaching witness DATA. This seat proved against a live catalogue
    that cd_engine holds no privilege of any kind on schema witness by any of seven routes, and that
    PostgreSQL refuses cd_engine in a real session. The decisive structure holds.
  owed: WO-3, at Product Owner disposition.

- id: CD-ASR-F06
  severity: MEDIUM
  criterion: CD-AC-005
  title: A finite but unbounded staleness window lets a decade-old row render WITNESS AGREES.
  theme: CONTROL_BYPASS
  what: >
    `_require_usable_window` refuses a non-finite or non-positive window but accepts ANY finite
    positive number. With `staleness_window_seconds=1e18`, a panel row 10 years old and marked
    AGREES resolves to `Agrees` and renders "WITNESS AGREES". With a window of 60.0 the same row
    correctly resolves to `Unavailable` / "WITNESS UNAVAILABLE". Verified by direct execution.
  why_it_matters: >
    CD-AC-005's stated proposition is that there must be no input WHATEVER - missing, stale,
    malformed or defaulted - from which the serving layer produces AGREES. A stale row plus a wide
    configured window is such an input, and it needs no source edit.
  what_is_to_the_deliverable_s_credit: >
    The author identified this exact hazard and wrote it down: the docstring says "no window and a
    very large window both mean nothing is ever stale". Half of it was then guarded (infinity and
    zero are refused) and half was not (1e18 is accepted). The gap is a half-closed door, not an
    unnoticed one.
  owed: >
    WO-3, most naturally with CD-AC-009 (regime-aware staleness windows), which is where a bound on
    the window belongs.

- id: CD-ASR-F07
  severity: LOW
  criterion: CD-AC-005
  title: An exception handler resolving to agreement is not detected, though unreachable as planted.
  theme: GUARD_THE_INSTANCE_NOT_THE_CLASS
  what: >
    Wrapping the age computation in `try/except Exception: return Agrees(...)` is not detected -
    `pytest tests/test_witness_panel.py tests/test_witness_resolver.py` exits 0. The register's own
    negative_control text names "an exception handler" as part of the class.
  honest_qualification: >
    THIS SEAT COULD NOT MAKE THE HANDLER FIRE. `PanelRow.__post_init__` normalises `as_of_utc`
    through `ensure_utc`, so `age_seconds` does not raise on any row that can be constructed. The
    planted handler is dead code and no behaviour changed, which is why the tests pass. The correct
    reading is that a declared-class route is undetected but was not shown to be exploitable, not
    that a live bypass exists. Recorded at LOW for that reason.
  owed: WO-3, at Product Owner disposition.

- id: CD-ASR-N01
  severity: INFORMATIONAL
  title: CD-PL-F43 is narrower than recorded - check_lockfile_denylist.py DOES read requirements.lock.
  what: >
    CD-PL-F43 is on record as "requirements.lock is not planted; the second half of CD-EGRESS-002 is
    not planted". This seat confirms the PLANT is absent, and also confirms that the CHECK is not:
    `check_lockfile_denylist.py` scans three manifests including requirements.lock, and a variant
    plant placing `ib-insync==0.9.86` in requirements.lock ALONE exits 1. What is owed is the
    negative-control evidence, not the coverage. Recorded so the WO-3 seat scopes the repair
    correctly rather than rebuilding a check that already works.

- id: CD-ASR-N02
  severity: LOW
  title: The live grant-matrix check is cluster-state dependent and does not declare that precondition.
  theme: PORTABILITY
  what: >
    PostgreSQL role attributes and role memberships are CLUSTER-wide, not database-scoped. This seat
    discovered it the hard way: a `GRANT cd_witness TO cd_engine` planted in one variant persisted
    into every later variant on the same cluster and produced violations in trees that did not carry
    it. All variant results in this entry were RE-RUN from a fully reset cluster after that was
    found, and the clean baseline was re-confirmed at 138 assertions / 0 violations before the
    re-runs.
  assessment: >
    This fails LOUD, not silent - inherited state produces EXTRA violations, never a false clean -
    so it is not a bypass. But the check documents no clean-cluster precondition, and an auditor who
    reuses a cluster will see violations that are not in the tree and may misattribute them.
  disclosure: >
    Reported against this seat's own method as much as against the check. The contaminated results
    were discarded, not reported.

