  mutation: governance/coordination/plants/PLANT-COORD-03.mutation.patch
  invocation: 'python3 -B tools/coordination/merge_reconcile.py --base <sha> --claim T [--claim T] --emit'
  closes_class: false
  declared_limit: >
    MEASURES PATHS, NOT BYTES. OVER-REFUSES two seats editing disjoint REGIONS of one file. DOES
    NOT CATCH the same bytes written THROUGH an undeclared path — a symlink, a generated file, a
    .gitignore'd artefact. DOES NOT PERFORM THE MERGE AND CANNOT PREVENT ONE.
  residue_cd_rule_006: >
    BYTE-LEVEL and OUT-OF-INDEX collision is NOT PROVED TO BE CARRIED ANYWHERE. The over-refusal on
    same-path edits is the only thing standing where that control would be, and it is blunt by
    design.
