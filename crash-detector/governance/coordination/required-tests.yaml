  invocation: 'sh tools/coordination/launch.sh --lease L --seat S --task T --write-scope G -- COMMAND'
  closes_class: false
  declared_limit: >
    REFUSES task overlap, write/write overlap and write/read overlap against a LIVE lease, **UNDER
    CONCURRENCY** — the collision read and the O_EXCL take run inside ONE lease-directory critical
    section, because O_EXCL alone excludes on the LEASE ID exactly as it excludes on the TASK ID in
    claim.py. launch.sh REFUSES TO exec — the non-start is PROVED by a sentinel, not inferred from
    an exit code. **CARRIES THE DECLARED SCOPE WITHOUT CORRUPTING IT**: pathname expansion is off
    for the whole script (set -f), the scope arguments are carried in the positional parameter list
    and not a string, there is no eval, and lease.py ECHOES the scope it actually RECEIVED at every
    acquisition. **BOUNDS BUT DOES NOT AUTHENTICATE --pid**: it DERIVES that the named pid is in
    the acquiring process's own session (os.getsid), refusing --pid 1; a long-lived SIBLING pid in
    the caller's own session would still pass and that residue is NOT CLOSED. ADMITS the disjoint
    launch concurrently, an EQUAL requirement. DOES NOT DECIDE a launcher that never asks for a
    lease. DOES NOT DECIDE a scope entry whose prefix traverses a SYMLINK and does not refuse a
    bare existing-directory literal — claim.py does both, lease.py does neither, and that asymmetry
    is DECLARED and NOT fixed at this increment.
  additional_plant: governance/coordination/plants/PLANT-COORD-07.run.sh
  additional_mutation: governance/coordination/plants/PLANT-COORD-07.mutation.patch
  increment_13_correction: >
    **CD-ASR-WO2R3-06-F05 + F11 — THE CARRIER CORRUPTED ITS OWN INPUT.** Unquoted expansion in
    POSIX sh performs FIELD SPLITTING **and PATHNAME EXPANSION**, and a write scope is a GLOB, so
