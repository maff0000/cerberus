- id: CD-CT-001-WORK-CLAIM-ATOMIC
  delivers: 'PO-DECISIONS-0021 ruling 3(a) — two seats can never take the same work'
  instrument: tools/coordination/claim.py
  supporting: [tools/coordination/registry.py, tools/coordination/liveness.py]
  contract: governance/coordination/contracts/CD-CT-001-WORK-CLAIM-ATOMIC.md
  plant: governance/coordination/plants/PLANT-COORD-01.run.sh
  mutation: governance/coordination/plants/PLANT-COORD-01.mutation.patch
  invocation: 'python3 -B tools/coordination/claim.py claim --task T --seat S --write-scope G'
  closes_class: false
  declared_limit: >
    DECIDES mutual exclusion on a TASK ID by O_EXCL create, MEASURED atomic at 6400 concurrent
    attempts / 200 rounds / 0 double-takes on this filesystem. DOES NOT DECIDE whether two
    DIFFERENT task ids name the same work; DOES NOT DECIDE work done with no claim at all; DOES NOT
    DECIDE a claim file edited by hand; REFUSES rather than proceeds on a network filesystem.
  residue_cd_rule_006: >
    TASK-ID SYNONYMY is NOT PROVED TO BE CARRIED ANYWHERE. The scope-overlap refusal is a PARTIAL
    carrier and that partiality is measured (PLANT-COORD-02 arm 1), not assumed.
  arms: 3
  last_run_verdict: 'LIVE — 3/3 arms contrasted'

- id: CD-CT-002-SCOPE-ALGEBRA-FAILS-CLOSED
  delivers: 'PO-DECISIONS-0021 ruling 3(b) — parallel writers never touch the same bytes'
  instrument: tools/coordination/scope.py
  supporting: [tools/coordination/test_scope.py]
  contract: governance/coordination/contracts/CD-CT-002-SCOPE-ALGEBRA-FAILS-CLOSED.md
  plant: governance/coordination/plants/PLANT-COORD-02.run.sh
  mutation: governance/coordination/plants/PLANT-COORD-02.mutation.patch
  invocation: 'python3 -B tools/coordination/scope.py --a G --b G [--expect overlap|disjoint]'
  unit_tests: 'python3 -B tools/coordination/test_scope.py    # 27 cases, 0 failures'
  closes_class: false
  declared_limit: >
    DECIDES literal paths, recursive `p/**` prefixes, and single-segment `*`/`?` globs — the last
    by EXACT product-automaton emptiness and not by a heuristic. REFUSES (fails closed to OVERLAP)
    `**` mid-pattern, character classes and brace expansion. REFUSES at parse time `..`, absolute
    paths and the empty entry. DECIDES case collision conservatively. DOES NOT DECIDE symlink
    aliasing textually.
  residue_cd_rule_006: >
    SYMLINK ALIASING, when the algebra is used WITHOUT a worktree, is NOT PROVED TO BE CARRIED
    ANYWHERE. With a worktree it is carried by check_scope_disjoint.py via
    scope.symlinked_components(), and that hand-off is MEASURED by PLANT-COORD-02 arm 3b.
  arms: 4
  last_run_verdict: 'LIVE — 4/4 arms contrasted'

- id: CD-CT-003-LIVE-SCOPE-DISJOINT
  delivers: 'PO-DECISIONS-0021 ruling 3(b) + CD-PL-F134 (write against a live reader''s READ scope)'
  instrument: tools/coordination/check_scope_disjoint.py
  contract: governance/coordination/contracts/CD-CT-003-LIVE-SCOPE-DISJOINT.md
  plant: governance/coordination/plants/PLANT-COORD-02.run.sh
  mutation: governance/coordination/plants/PLANT-COORD-02.mutation.patch
  invocation: 'python3 -B tools/coordination/check_scope_disjoint.py'
  closes_class: false
  declared_limit: >
    DECIDES pairwise WRITE x WRITE, and WRITE x READ in BOTH cross-seat directions. DELIBERATELY
    DOES NOT REFUSE READ x READ (two seats reading one file is the normal case, and refusing it
    would ban parallel audits — the vacuity ruling 3 rejects) nor a seat's own write-vs-own-read.
    DOES NOT DECIDE what a seat actually TOUCHED — it reads DECLARATIONS.
  residue_cd_rule_006: >
    The gap between a DECLARED scope and a TOUCHED path is carried by merge_reconcile.py assertion
    (1) CONTAINMENT, MEASURED by PLANT-COORD-03. The gap between a LIVE ACTOR and a CLAIM is
    carried by launch.sh for launches that go through it, and for every other route it is NOT
    PROVED TO BE CARRIED ANYWHERE.
  arms: 4
  last_run_verdict: 'LIVE — 4/4 arms contrasted (shares PLANT-COORD-02 with CD-CT-002)'

