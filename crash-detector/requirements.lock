# Crash Detector — dependency lockfile (PBG-CI-003, Standards Baseline §6).
#
# Format: pip --require-hashes compatible.
#     python3 -m pip install --require-hashes --no-deps -r requirements.lock
#
# NETWORK PROBE, recorded because PBG-CI-003 makes hashes conditional on it and the
# condition must be evidenced rather than assumed:
#
#   $ python3 -c "import socket; socket.create_connection(('pypi.org',443),timeout=6)"
#   pypi.org:443                REACHABLE
#   files.pythonhosted.org:443  REACHABLE
#
# The network permits hashes here, so hashes are recorded. No reason-for-absence
# clause is claimed, because none applies.
#
# HOW THESE DIGESTS WERE OBTAINED: read from the PyPI JSON metadata API
# (https://pypi.org/pypi/<name>/<version>/json, field urls[].digests.sha256) for the
# exact pinned versions. Nothing was installed, upgraded or resolved on this host to
# produce this file; the host environment is unchanged by its generation.
#
# DIGESTS VERIFIED, not merely transcribed: each of the 17 digests below was checked by
# fetching the artefact and recomputing sha256 over its bytes. All 17 matched. Nothing was
# installed or built to do it. (Baseline §6 — a download that succeeded is not a download
# that was authentic, and a digest copied out of an index is a claim, not an observation.)
#
# LOCKFILE PARSE, evidenced OFFLINE so the check cannot depend on the index:
#     $ python3 -m pip download --no-deps --no-index --require-hashes \
#           -d /tmp/cd-lockcheck -r requirements.lock
#     ERROR: Could not find a version that satisfies the requirement jsonschema==4.10.3
#     exit 1
# pip reached RESOLUTION, which means it parsed this file and accepted its hash syntax.
# It does not mean the file installs; see NOT VERIFIED below.
#
# ARTEFACT SELECTION: for each pinned version, the source distribution plus the wheels
# applicable to this target — pure-python wheels, and CPython 3.11 manylinux x86_64
# wheels. Wheels for other interpreters and platforms are deliberately absent: this
# project targets CPython 3.11 on linux-x86_64 and an unpinned platform is not a pin.
#
# VERSION SELECTION: every version below is the version ALREADY INSTALLED on the DEV
# host, read from importlib.metadata, not chosen. That is the load-bearing property of
# deliverable A1 — every test and every register check runs on this host's interpreter
# with NO install step. This lockfile therefore describes what is running, and is not
# an instruction anyone needs to execute to run the suite.
#
# NOT VERIFIED BY THIS SEAT: that a clean environment built from this lockfile alone
# reproduces the host environment (PBG-SEC-004). That needs a clean environment, which
# is a container build, and container build is FORBIDDEN in WO-2 (dispatch RT-B). It is
# owed at WO-3, not done.
#
# pyrsistent 0.18.1 ships no CPython 3.11 wheel; the sdist is the only artefact for
# this target, so a clean install of it would need a compiler. Recorded, not hidden.

