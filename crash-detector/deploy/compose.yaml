    environment:
      CD_TICK_INTERVAL_SECONDS: "${CD_TICK_INTERVAL_SECONDS:-30.0}"
      CD_SHUTDOWN_GRACE_SECONDS: "${CD_SHUTDOWN_GRACE_SECONDS:-15.0}"
      CD_CONTRACTS_DIR: /contracts
