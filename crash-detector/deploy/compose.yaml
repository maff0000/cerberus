  # ----------------------------------------------------------------------------------------
  # cd-review — the one AI review, through its four validators. Doctrine §3.3: the only
  # component with model-API egress, and it can write no number.
  # ----------------------------------------------------------------------------------------
  cd-review:
    <<: *cd-python-service
    build:
      context: ..
      dockerfile: deploy/Dockerfile.review
      args:
        CD_PYTHON_BASE: "${CD_PYTHON_BASE:?CD_PYTHON_BASE must be a digest-pinned base image reference; see deploy/base-images.json}"
    user: "10006:10006"
    networks:
      - cd-net-private
    environment:
      CD_TICK_INTERVAL_SECONDS: "${CD_TICK_INTERVAL_SECONDS:-30.0}"
      CD_SHUTDOWN_GRACE_SECONDS: "${CD_SHUTDOWN_GRACE_SECONDS:-15.0}"
      CD_CONTRACTS_DIR: /contracts
      PYTHONPATH: /app/src
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
      CD_STORE_HOST: cd-store
      CD_STORE_PORT: "5432"
      CD_STORE_NAME: "${CD_STORE_NAME:?CD_STORE_NAME must be set}"
      CD_STORE_ROLE: cd_review
      CD_STORE_REVIEW_PASSWORD: "${CD_STORE_REVIEW_PASSWORD:?CD_STORE_REVIEW_PASSWORD must be set}"
      # The model API key, BY NAME. No value here, ever.
      CD_MODEL_API_KEY: "${CD_MODEL_API_KEY:?CD_MODEL_API_KEY must be set}"
    volumes:
      - <<: *cd-contracts-mount
    depends_on:
      cd-store:
        condition: service_healthy
    x-uid: 10006
    x-egress:
      policy: ALLOWLIST
      hosts: []
      pending:
        - declared_in: "BLUEPRINT §2 — 'allowlist: model API only'"
          blocked_by: >
            Which model, and therefore which host, is not decided in BLUEPRINT §16 and is
            not this seat's to choose. Recorded as owed rather than guessed.
      enforced_by:
        - "attached only to cd-net-private, which is internal: true — so the effective egress in WO-2 is none"
        - "OWED at WO-3: the egress lane that makes ALLOWLIST mean more than NONE"
    x-storage:
      image: "read-only root filesystem at /app"
      tmpfs:
        - /tmp
      durable: []
    x-authority:
      writes_numbers: false
      basis: "the cd_review role holds no INSERT or UPDATE on any dial or envelope number (BLUEPRINT §4, §9), and publication.review declares no numeric dial column"
