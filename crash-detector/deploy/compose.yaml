      CD_STORE_HOST: cd-store
      CD_STORE_PORT: "5432"
      CD_STORE_NAME: "${CD_STORE_NAME:?CD_STORE_NAME must be set}"
      CD_STORE_ROLE: cd_private
      CD_STORE_PRIVATE_PASSWORD: "${CD_STORE_PRIVATE_PASSWORD:?CD_STORE_PRIVATE_PASSWORD must be set}"
    volumes:
