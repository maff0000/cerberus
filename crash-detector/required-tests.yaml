        `elevated` or `acute` stop being admitted on a missing-data branch. A tree on which
        nothing can be published is not a tree on which PID §3.2 holds, and this row does not
        report it as one.
        AND THE CLASS GREW AT 16B-FIX, each new member a MEASURED ARM: a FOURTH branch appended
        to #/$defs/dial_reading.oneOf permitting the full vocabulary on a missing-data state
        (arm C6, FAIL — 6 violations); a missing-data branch that accepts a level OUTSIDE the
        declared vocabulary (arm C8, FAIL — 8); an OPTIONAL additional dial slot spelled with any
        $ref other than #/$defs/dial_reading (arm C9, FAIL — 2).
        ================================================================================
        *** THE SENTENCE THAT STOOD HERE WAS FALSE. SUPERSEDED AT 16B-FIX, NOT ERASED
        (CD-RULE-004, PBG-CONT-003). ***
        WHAT IT SAID, VERBATIM: "The instrument fails on all of these."
        IT DID NOT. CD-ASR-WO3-05 (F2) measured the member named three lines above — "the branch
        detail_level requirement dropped so that the parent dial_reading's full-vocabulary
        property is what applies" — on a tree with detail_level removed from `required` on
        dial_reading_unknown AND dial_reading_degraded on BOTH contracts: the instrument reported
        PASS — 67 assertions, 0 violations while the live gate ADMITTED an UNKNOWN dial carrying
        NO detail_level at all, on BOTH surfaces. The execution contract said the same thing in
        the same words and was equally false. A governed artefact stated something measurably
        untrue, and this project supersedes rather than deletes.
        WHY IT MATTERED MORE THAN THE HOLE ITSELF: tests/test_detail_level.py had asserted
        _dial_with_level(builder, None) == REFUSED and _dial_with_level(builder, "banana") ==
        REFUSED since before this instrument existed, and CD-ASR-WO3-04's 30-row probe covered
