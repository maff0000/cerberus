  # sha256 of PID.md as it stands at the WO-2 execution base 3f038665. Computed, not guessed:
  #     python3 -c "import hashlib,pathlib;print('sha256:'+hashlib.sha256(pathlib.Path('PID.md').read_bytes()).hexdigest())"
  # The validator recomputes it against the PID it resolves and reports a MISMATCH as a defect,
  # because a population derived from a different document than the one now governing is a
  # population nobody agreed to.
  content_hash: sha256:441d83166b2f3d0cf612baf58b96b8d8bf889a52169babc115fc7a7e26714f85

# NULL, AND NOT THIS SEAT'S TO FILL IN. See the header.
latest_admitted_run: null

criteria:

# --------------------------------------------------------------------------------------------- #
# DELIVERED IN WO-2 — the five doctrine-bearing criteria (BLUEPRINT §13, §15)
# --------------------------------------------------------------------------------------------- #

- criterion_id: CD-AC-001
  origin: PID
  obligation: MANDATORY
  criterion: Missing or stale input never renders as calm.
  acceptance_semantics: >
    PID §6: plant — kill a feed, and the affected dial shows UNKNOWN or DEGRADED within the
    assurance latency budget, NEVER a calm reading. The proposition has two halves and both are
    required: absence must have a name in the type system, and no route may exist by which
    absence becomes a number. A dial that reads 0.0 because a source did not answer is the exact
    failure PID §3.2 forbids — a stale dial saying calm — and it is worse than no dial, because
    somebody trusts it.
  pid_relation: DERIVES
  supersedes: []
  superseded_by: null
  tests:
  # DECLARED LIMIT — CD-RT-001-AST-NO-NUMERIC-DEFAULT. Required by CD-RULE-004, drawn in the
  # pattern of CD-RT-012-NO-EXECUTION-INTERFACE (CD-D-014/CD-D-015), which an independent
  # auditor examined and judged honestly and conservatively drawn.
  #
  # WHY THIS ENTRY CHANGED. At the WO-2 gate this test declared `scope: CLASS` while the check
  # enumerated four spellings of a numeric default. CD-ASR-F03 walked past all four with a
  # module-level constant. The check now carries RULE F, which inverts the question: instead of
  # enumerating ways a number can arrive, it enumerates the ONE way a dial magnitude is
  # PERMITTED to arrive — from the declared contribution model applied to present inputs — and
  # reports every other provenance, including ones nobody has thought of. RULE F DENIES BY
  # DEFAULT, so a route the check's author never imagined is a violation for being
  # unrecognised rather than a silence. That is why `scope: CLASS` is retained, and the residue
  # is written down here rather than left to be discovered.
  #
  # THIS CHECK IS A STATIC READ OF SOURCE TEXT AT ONE COMMIT, and CD-AC-001's proposition is a
  # RUNTIME property. Where a boundary below says the runtime layer carries it, that layer is
  # the sealed and slotted Reading types in src/crash_detector/dials/reading.py plus the
  # absence post-condition `refuse_a_number_without_its_inputs` in
  # src/crash_detector/engine/evaluate.py, and it is evidenced by the SIBLING test
  # CD-RT-001-ABSENCE-RENDERS-UNKNOWN. In summary, this check DOES NOT catch:
  #
  #   1. a construction it cannot see as a construction. RULE F recognises a value-bearing
  #      reading by the terminal name of its callee (`Value`, `Degraded`), resolved through the
  #      module's import aliases. MEASURED EXAMPLE, which exits 0 here:
  #        maker = getattr(sys.modules["crash_detector.dials.reading"], "Value")
  #        return maker(value=score, as_of_utc=now_utc, inputs_used=("carried",))
  #      THE RUNTIME LAYER CARRIES THIS: the post-condition inspects the returned object's TYPE
  #      and never reads the expression that produced it, so the same plant raises
  #      AbsenceYieldedAValue when the branch executes.
  #   2. tracing beyond one scope chain. A magnitude computed inside a helper is reported as
  #      UNRECOGNISED rather than followed — deny by default, so it is not an escape, but a
  #      LEGITIMATE future helper must be declared in DECLARED_MAGNITUDE_SOURCES or it is
  #      reported. MEASURED EXAMPLE: `score = _blend(payloads)` is reported.
  #   3. anything outside the two declared tiers. MEASURED EXAMPLE: the same plant in
  #      src/crash_detector/publication/summary.py exits 0 here. The declared set REFUSES if a
  #      declared path is missing, so it cannot be narrowed by deleting a module, but it does
  #      not grow on its own.
  #   4. class A (nullable-number annotations) outside the dial path — printed as a NOTE on
  #      every run, because BLUEPRINT §7 and §13 scope that ban to the dial path (CD-ENG-F26).
  #   5. a magnitude legitimately computed but WRONG. RULE F asks where a number came from,
  #      never whether it is right. scores.py deliberately imposes no range (CD-D-005 owed).
  #   6. runtime, configuration and data. A zero arriving from a config file, an environment
  #      variable or a database row is not in the source text. THE RUNTIME LAYER CARRIES THIS.
  #
  # FOR THE AUDITOR. Do not read a clean run of this check as proof that no route from absence
  # to a number exists. A variant landing beyond a boundary above is a finding against THIS
  # DECLARATION — was the limit honestly drawn? — and the pair to weigh is this check together
  # with CD-RT-001-ABSENCE-RENDERS-UNKNOWN, which is where the runtime property is evidenced.
  - test_id: CD-RT-001-AST-NO-NUMERIC-DEFAULT
    scope: CLASS
    execute: python3 tools/register/check_no_numeric_default.py --root .
    execution_contract: contracts/execution/CD-RT-001-AST-NO-NUMERIC-DEFAULT.md
    negative_control:
      violation: >
        A dial magnitude whose provenance is not the declared contribution model applied to
        inputs that were present. The class is WIDER than the four spellings this check
        enumerated at the WO-2 gate — a `float | None` or `Optional[float]` annotation, a
        `.get(key, <numeric literal>)`, an `or 0`, a bare `except` returning a number — because
        CD-ASR-F03 escaped all four with a module-level constant. RULE F reports any Value or
        Degraded construction on the scanned path whose magnitude traces to a literal, a
        module-level constant, a parameter, a configuration attribute, a lookup, a previous
        reading, an unrecognised helper call, or anything else it cannot name as declared.
        Unrecognised is a VIOLATION, not a silence, so a plant does not need to use a route the
        check anticipated.
        THIS CHECK HAS A DECLARED LIMIT, stated in full in the header of
        tools/register/check_no_numeric_default.py, in the comment above this entry, and in the
        execution contract, each boundary with an example an auditor can execute. It does NOT
        catch: a constructor obtained dynamically; a magnitude laundered through an undeclared
        helper (reported, not followed); anything outside the two declared tiers; class A
        outside the dial path; a legitimately computed but wrong magnitude; or anything about
        runtime, configuration or data. It is ONE OF TWO guards on CD-AC-001 and never a sole
        guard: the runtime property is carried by the sealed Reading types and the absence
        post-condition, and evidenced by CD-RT-001-ABSENCE-RENDERS-UNKNOWN.
      evidence_ref: RTR-WO2-0001
  # DECLARED LIMIT — CD-RT-001-ABSENCE-RENDERS-UNKNOWN. Required by CD-RULE-004.
  #
  # This is the RUNTIME arm, and after CD-ASR-F02 it is the arm that carries CD-AC-001's
  # "structurally incapable" half. The three Reading constructors now have a DECLARED attribute
  # surface asserted by EQUALITY (not by the absence of a blacklist — that blacklist is what
  # E03 walked past), are slotted against instance attribute injection, are closed against
  # subclassing, and are re-verified at every consumer boundary. Separately, the per-dial
  # evaluator carries a post-condition that refuses a value-bearing reading from a dial whose
  # required inputs were not all present, whatever the number is and wherever it came from.
  #
  # THE ONE RESIDUE, DECLARED RATHER THAN DENIED. `type.__setattr__` installs a class attribute
  # without going through a metaclass, and CPython offers no way to prevent that. MEASURED
  # EXAMPLE, which an auditor can execute:
  #   type.__setattr__(Unknown, "magnitude", property(lambda self: 0.0))
  #   Unknown(reason="R", since_utc=t, missing_inputs=()).magnitude   ->   0.0
  # What IS closed is every route by which such a number reaches a consumer: fold, is_value and
  # DialSet each re-verify the surface of the reading's class and raise ReadingSurfaceViolated.
  # So the claim this test evidences is: absence cannot acquire a numeric member through
  # construction, assignment, inheritance or definition, and a class mutated after import is
  # refused wherever a reading of it would be used. It is NOT the claim that a process which
  # rewrites class objects at runtime cannot read a number back out of one it mutated. Do not
  # read a clean run as proof of the stronger claim.
  - test_id: CD-RT-001-ABSENCE-RENDERS-UNKNOWN
    scope: CLASS
    execute: PYTHONPATH=src python3 -m pytest tests/test_reading.py tests/test_evaluate.py -q
    execution_contract: contracts/execution/CD-RT-001-ABSENCE-RENDERS-UNKNOWN.md
    negative_control:
      violation: >
        Absence made to yield a number at runtime, by ANY route, or a reading that carries a
        value produced by a dial that did not get its inputs. The class includes, and is not
        limited to: any member added to a Reading constructor's declared attribute surface —
        a property, a classvar, a method, a `__getattr__`, a slot, a dunder, numeric or not,
        added in the class body, by a decorator, by class assignment or by a metaclass; an
        undeclared instance attribute set through `object.__setattr__`; a subclass of a Reading
        constructor carrying a numeric member; and `evaluate()` returning Value or Degraded for
        a dial whose required inputs were absent, stale, future-dated, unregistered or lacking
        a contribution model — whether the number is a literal, a module-level constant, a
        configuration default, a previous magnitude carried across a gap, or a value read from
        the store. With the WO-2 empty source registry both dials must read Unknown; a plant
        that makes either read a value must fail this test.
        DECLARED LIMIT: post-import class mutation through `type.__setattr__` installs the
        attribute and is refused at every consumer boundary rather than prevented. The measured
        example is in the comment above this entry and in the header of
        src/crash_detector/dials/reading.py.
      evidence_ref: RTR-WO2-0001

- criterion_id: CD-AC-002
  origin: PID
  obligation: MANDATORY
  criterion: The two dials are never blended.
  acceptance_semantics: >
    PID §6: no code path combines them into one number, and a planted blend fails the register.

    THIS TEXT WAS REWRITTEN AT WO-2R, CLOSING CD-ASR-F01 (HIGH). It used to say the criterion was
    "enforced at three independent layers" and that "a blend that slips past any one layer must
    still fail the other two". THAT SPECIFIC CLAIM WAS REFUTED BY EXECUTION: an independent
    auditor produced two working blends that passed ALL THREE declared layers simultaneously and
    each returned 0.5 from equity 0.9 and monetary 0.1. It is not restated here, and the entries
    below claim only what their layers deliver (CD-RULE-004).

    WHAT THE LAYERS DELIVER NOW, each named with what it does NOT do.

    1 THE TYPE, and it is the load-bearing one. A dial magnitude is a NOMINAL, PER-DIAL,
    NON-COERCIBLE value (crash_detector.dials.magnitude.DialMagnitude) carrying which dial it came
    from as DATA. It defines no arithmetic or coercion dunder, so any arithmetic, comparison,
    aggregation, serialisation or reduction over two magnitudes raises TypeError from the
    interpreter — regardless of the route by which the two values were reached, which is what
    makes it a CLASS closure rather than a list of spellings. Cross-dial combination is refused at
    the POINT OF COMBINATION by comparing carried provenance, so the refusal does not depend on
    anyone having read the code. WHAT IT DOES NOT DO: once a number is released for its ONE named
    dial it is an ordinary float, and Python adds floats.

    2 THE RE-ENTRY, added closing CD-PL-F54 and it is now the one that carries the laundering
    class. Layer 1 was closed against the type being ASKED for a number and open to the number
    being READ OFF it: float(repr(m).split("quantity=")[1].rstrip(")")) names no dial, two of those
    add, and the sum re-wrapped as a magnitude of one dial passed every provenance comparison and
    published. A DialMagnitude is now built from a DeclaredQuantity
    (crash_detector.dials.provenance) — a number whose provenance was ESTABLISHED at one of two
    declared doors — and never from a bare float, with set equality between the quantity's dial set
    and the target dial. So a number that has left a magnitude by ANY exit, named or unnamed,
    cannot get back into one. MEASURED: PL-Q4, PL-Q5, PL-Q6, PL-Q9, V16a and V16b all raise
    QuantityProvenanceMissing. WHAT IT DOES NOT DO: the admission door observed_for_dial is a
    DECLARATION and believes what it is told; something has to be the first number. That residue is
    declared at boundary 7 of the CD-RT-002-AST-NO-BLEND entry and is guarded statically, by
    registry, by RULE 4.

    3 THE PUBLICATION BOUNDARY. crash_detector.publication.dial_scalar.number_for_dial_slot
    releases a number into a dial slot only from a magnitude whose provenance is exactly that
    slot's dial. WHAT IT DOES NOT DO — AND THIS ENTRY PREVIOUSLY CLAIMED OTHERWISE: it does NOT
    refuse a blend. The Project Lead re-wrapped a 0.4/0.6 blend as a magnitude of the equity dial
    and number_for_dial_slot RETURNED 0.5 (CD-PL-F54). What it refuses is a number arriving without
    a magnitude, or carrying the wrong dial's. It also cannot see a number that reaches a dial slot
    without coming through it.

    4 THE CLOSED PUBLIC ENVELOPE SCHEMA. additionalProperties is false at every level and
    properties is an allowlist, so a third combined field has nowhere to be written. The auditor
    tested this mitigation specifically and confirmed IT HOLDS. WHAT IT DOES NOT DO: it cannot
    tell a blended number assigned to equity_crash.score from an honest one, because that key is
    legitimately a number. Layer 3 refuses a number arriving without its magnitude; NOTHING here
    tells a blended number from an honest one once it is a magnitude, and layer 2 is why one cannot
    become a magnitude.

    5 THE AST SCAN IS A LOCATOR, NOT A CLOSURE, and its entry below carries a DECLARED LIMIT and
    a corrected scope. Its flavour propagation is intra-procedural and its read is purely static;
    both escaped blends walked past it and always will, and so does PL-Q9. Its RULE 4, added at
    CD-PL-F54, is the exception in kind rather than in strength: it denies BY DEFAULT over a
    declared registry of admission sites and therefore recognises nothing about a blend, which is
    why PL-Q9-with-the-door (V12) fails it. It remains static.

    Layers 1 to 4 are structural and independent of one another. None is claimed to be sole
    (BLUEPRINT §17 risk CD-BP-001, PO-accepted), and no claim is made here that a violation
    slipping past one must fail the others.
  pid_relation: DERIVES
  supersedes: []
  superseded_by: null
  tests:
  # CD-RT-002-TYPE-NO-ARITHMETIC is the RUNTIME arm, and after CD-ASR-F01 it is the arm that
  # carries CD-AC-002's "unrepresentable" half. Its declared command GREW at WO-2R by one module,
  # tests/test_dial_provenance.py, which executes escaped variants E01 and E02 in the auditor's own
  # shape and asserts the publication-boundary provenance refusal. The command grew because the
  # register may not claim a layer it declares no test for; NOTHING WAS REMOVED FROM IT, and
  # tests/test_scores.py and tests/test_dialset.py are unchanged in what they assert — only in how
  # they construct a magnitude, which now names its dial.
  - test_id: CD-RT-002-TYPE-NO-ARITHMETIC
    scope: CLASS
    execute: PYTHONPATH=src python3 -m pytest tests/test_scores.py tests/test_dialset.py tests/test_dial_provenance.py -q
    execution_contract: contracts/execution/CD-RT-002-TYPE-NO-ARITHMETIC.md
    negative_control:
      violation: >
        A scalar derived from BOTH dial types made representable or publishable, by ANY route.
        The class includes, and is not limited to: an arithmetic, bitwise, ordering or
        numeric-coercion dunder added to a score type or to the dial magnitude type, or inherited
        from an ancestor of either; a numeric base introduced under both types; a subclass of the
        magnitude type carrying a coercion; a member added to the magnitude type's declared
        attribute surface, by class body, decorator, class assignment or metaclass; a method added
        to DialSet that returns a scalar; a magnitude constructed without provenance, or with
        provenance that is not exactly one dial; a magnitude of one dial accepted into the other
        dial's score type or published into the other dial's envelope slot; a combinator that
        UNIONS provenance instead of comparing it; a same-dial helper that does not refuse when it
        is reused across dials; and a round trip through copy, pickle or JSON that strips
        provenance or yields a bare number.
        Since CD-PL-F54 the class ALSO includes a bare float re-entering a magnitude by any route:
        a magnitude is built only from a DeclaredQuantity whose dial set equals the target dial.
        DECLARED LIMIT: a number released through `quantity_for(<one dial id>)` is an ordinary
        float, and so is one read out of `repr`, `str`, `format`, an f-string, `json.dumps` over
        `__getstate__`, a pickle's bytes or `getattr` on the private slot — the exits are many and
        the list has no end. Two such floats can be added by ordinary Python arithmetic and this
        arm does not pretend otherwise; PL-Q1a returns 1.0. THE CLAIM THAT "reducing one to a
        number requires naming its single dial" IS WITHDRAWN — it was false and it contradicted
        this codebase's own disclosure that repr renders the quantity (CD-PL-F54). What replaced it
        is measured: THE SUM CANNOT BECOME A MAGNITUDE AGAIN. That residue and its closure are
        stated in the header of src/crash_detector/dials/magnitude.py (boundaries A and E), in
        src/crash_detector/dials/provenance.py, in the comment above the CD-RT-002-AST-NO-BLEND
        entry below (boundaries 6 and 7) and in both execution contracts, each with an example an
        auditor can execute. NOT refused, and declared: an explicit false declaration at the
        admission door observed_for_dial (boundary 7), over which RULE 4 is the only layer and RULE
        4 is static.
      evidence_ref: RTR-WO2-0001
  # DECLARED LIMIT — CD-RT-002-AST-NO-BLEND. Required by CD-RULE-004 and by the WO-2R dispatch,
  # drawn in the pattern of CD-RT-012-NO-EXECUTION-INTERFACE, whose declaration an independent
  # auditor examined and judged HONESTLY DRAWN AND DRAWN CONSERVATIVELY. That auditor's caveat is
  # why this block exists: "CD-AC-002's AST guard has comparable limitations (intra-procedural,
  # static) and NO comparable written declaration, which is why CD-ASR-F01 is reported at HIGH."
  #
  # THE SCOPE OF THIS ENTRY WAS CORRECTED FROM `CLASS` TO `INSTANCE` AT WO-2R, and that correction
  # is the point rather than a detail. A static intra-procedural checker cannot close this class
  # and no hardening will make it able to: E01 moved the arithmetic one call away into a function
  # whose parameters are annotated `float`, and E02 reached the dials through `getattr` with plain
  # string literals so that NO DIAL MARKER APPEARED IN ANY EXPRESSION. Deny-by-default is not
  # available here the way RULE F made it available to CD-RT-001-AST-NO-NUMERIC-DEFAULT, because
  # there is no single permitted provenance for an expression to be traced back to — every
  # expression in the application is a candidate. Claiming CLASS while enumerating what a static
  # checker can see is precisely the defect that produced this finding, so the entry now claims
  # INSTANCE and the CLASS closure is claimed by CD-RT-002-TYPE-NO-ARITHMETIC, which delivers it
  # at runtime.
  #
  # WHAT THIS CHECK DOES NOT CATCH. The full list with an executable example per boundary is in
  # the header of tools/register/check_no_blend.py and in
  # contracts/execution/CD-RT-002-AST-NO-BLEND.md, in the same words. In summary:
  #   1 INTER-PROCEDURAL FLOW. MEASURED EXAMPLE, exits 0 — this is escaped variant E01:
  #       def _fold(left: float, right: float) -> float: return (left + right) / 2.0
  #       def banner_figure(dials): return _fold(dials.equity.value.score, dials.monetary.value.score)
  #     Executed, the TYPE layer raises TypeError: unsupported operand type(s) for +:
  #     'DialMagnitude' and 'DialMagnitude'.
  #   2 DYNAMIC ATTRIBUTE ACCESS, which erases flavour entirely. MEASURED EXAMPLE, exits 0 — this
  #     is escaped variant E02, the stronger of the two because it needs no allowlisted path:
  #       _SLOTS = ("equity", "monetary")
  #       magnitudes = [getattr(dials, slot).value.score for slot in _SLOTS]
  #       return sum(magnitudes) / len(magnitudes)
  #     Executed, the TYPE layer raises TypeError: unsupported operand type(s) for +: 'int' and
  #     'DialMagnitude'.
  #   3 THE RULE 2 ALLOWLIST is a real hole in RULE 2 by design; six paths may consume both dials
  #     in one expression and E01 was planted in one of them (src/crash_detector/serving).
  #   4 THE SCANNED SET: only src/crash_detector/ and deploy/entrypoints/. A blend in tests/ or
  #     db/ exits 0 here. It cannot reach a shipped image — all six application Dockerfiles COPY
  #     exactly src/ and deploy/entrypoints/ — but this check does not see it.
  #   5 IT READS SOURCE, NOT BEHAVIOUR. A blend assembled at runtime is outside a static check.
  #   6 A NUMBER ALREADY RELEASED is an ordinary float, AND THE EXITS ARE MANY: quantity_for, and
  #     also repr, str, format, an f-string, %-formatting, pprint, a log line, json.dumps over
  #     __getstate__, a pickle's bytes and getattr on the private slot. MEASURED EXAMPLE, which
  #     RULE 1 catches when the dial ids are written and does NOT catch when reached dynamically:
  #       e = dials.equity.value.score.quantity_for(EQUITY_DIAL_ID)
  #       m = dials.monetary.value.score.quantity_for(MONETARY_DIAL_ID)
  #       blended = (e + m) / 2.0
  #     THIS BOUNDARY PREVIOUSLY READ "THE PUBLICATION BOUNDARY CARRIES THIS". THAT WAS MEASURED
  #     FALSE AND IS WITHDRAWN (CD-PL-F54; CD-RULE-006 exists because of it). Re-wrapped as
  #     DialMagnitude(dial_id="equity_crash", quantity=blended) the sum had provenance of exactly
  #     the slot's dial and number_for_dial_slot RETURNED 0.5.
  #     THE RE-ENTRY CARRIES THIS, WITH THE EVIDENCE (CD-RULE-006): executed on a pristine
  #     extraction from magnitudes of 0.4 and 0.6, PL-Q4, PL-Q5, PL-Q6, PL-Q9, V16a (f-string, no
  #     repr) and V16b (JSON round trip, no repr) each raise QuantityProvenanceMissing: "a bare
  #     number (0.5) was offered as dial 'equity_crash''s magnitude". NOT claimed: that the
  #     addition is refused. It is not, PL-Q1a returns 1.0, and that is the honest state.
  #   7 THE ADMISSION DOOR IS A DECLARATION, and RULE 4 guards it BY REGISTRY, not by truth.
  #     observed_for_dial is the base case and believes what it is told; a base case that had to
  #     prove itself would need a base case of its own. MEASURED EXAMPLE — V12, which is PL-Q9 with
  #     the door added: this check FAILS on it with two RULE 4 violations while its RUNTIME is NOT
  #     refused and publishes 0.5. NOT PROVED TO BE CARRIED ANYWHERE AT RUNTIME. RULE 4 is static,
  #     so this residue inherits every limitation above; its own residues are an edit to
  #     DECLARED_ADMISSION_SITES, a module outside the scanned set (boundary 4) and a dynamically
  #     assembled door name (boundary 5). V13, which reaches the door through importlib and getattr
  #     with a whole string, IS caught.
  #
  # EVERY "CARRIES THIS" ABOVE WAS RE-MEASURED AT THE COMMIT THAT WROTE IT, not inherited
  # (CD-RULE-006). Boundaries 1, 2, 3 and 5 hand their residue to the TYPE layer and E01 and E02
  # both raise TypeError when executed. Boundary 6 hands its residue to the RE-ENTRY and carries
  # six executed refusals. Boundary 7 hands its residue to NOBODY at runtime and says so.
  #
  # DO NOT READ A CLEAN RUN OF THIS CHECK AS PROOF THAT NO CODE PATH COMBINES THE TWO DIALS. It
  # was clean for both blends that produced CD-ASR-F01. The pair to weigh is this check together
  # with CD-RT-002-TYPE-NO-ARITHMETIC, which is where the runtime property is evidenced.
  #
  # FOR THE AUDITOR. A CD-AC-002 variant landing beyond a boundary above is a finding against THIS
  # DECLARATION — was the limit honestly drawn? — and not an automatic RED against the guard. A
  # variant reaching the violation by a route a boundary says is covered by the type layer or by
  # the re-entry, and NOT refused when EXECUTED, is a defect in the closure: report it. Boundary 7
  # makes no such claim, so a variant landing there is inside a declared limit, not outside one.
  - test_id: CD-RT-002-AST-NO-BLEND
    scope: INSTANCE
    execute: python3 tools/register/check_no_blend.py --root .
    execution_contract: contracts/execution/CD-RT-002-AST-NO-BLEND.md
    negative_control:
      violation: >
        A single expression consuming both dial types outside the allowlisted container and
        serving layer — the canonical form being `combined = (equity + monetary) / 2`, and what
        this check reaches being any arithmetic, comparison or aggregation over the two together
        WITHIN ONE SCOPE, including the three-statement spelling that its intra-procedural flavour
        propagation follows. RULE 3, added at WO-2R and carrying no allowlist beyond the module
        that declares the slot, additionally reports any expression naming the private slot in
        which a dial magnitude holds its number (`_DialMagnitude__quantity`), by attribute or as a
        string handed to getattr, AND any call of the pickle protocol that returns that slot as
        state (`__getstate__`, `__reduce__`, `__reduce_ex__`, as an attribute or through getattr).
        Reaching around the declared release obtains a number without naming which dial it belongs
        to, which is the first half of a blend. The reflection half was added closing
        CD-ENG-WO2R-F06, a finding the implementing seat raised against its own increment-2 work
        after `sum(m.__getstate__()["quantity"] for m in both) / 2` returned 0.5 with nothing
        refusing it; a magnitude's state is now keyed by the private slot names, so the same
        expression must name one. RULE 3 judges a dunder name held as DATA differently from a
        dunder name REACHED: ARITHMETIC_DUNDERS and TOLERATED_INTERPRETER_MACHINERY are legitimate
        tables of dunder names and are untouched.
        RULE 4, added closing CD-PL-F54, DENIES BY DEFAULT over a declared registry of admission
        sites: no module on the scanned path may name observed_for_dial, derived_within_one_dial or
        DeclaredQuantity — by call, attribute, IMPORT, annotation, default or a string handed to
        getattr — unless it is one of the four modules listed in DECLARED_ADMISSION_SITES with the
        reason it is there. It recognises nothing about a blend, which is the point: PL-Q9 named no
        dial and performed no arithmetic on a magnitude, and nothing static can recognise such a
        module; what it cannot avoid is getting the number back IN, and since CD-PL-F54 there is
        one way to do that. An unlisted module violates because it is not a place anybody declared
        that numbers enter.
        THIS CHECK HAS A DECLARED LIMIT, stated in full in the header of
        tools/register/check_no_blend.py, in the comment above this entry and in the execution
        contract, each boundary with an example an auditor can execute. It is never a sole guard:
        the class is closed at the type and at the RE-ENTRY, and evidenced by
        CD-RT-002-TYPE-NO-ARITHMETIC.
      evidence_ref: RTR-WO2-0001
  - test_id: CD-RT-002-SCHEMA-CLOSED
    scope: CLASS
    execute: python3 tools/register/check_schema_closed.py --root .
    execution_contract: contracts/execution/CD-RT-002-SCHEMA-CLOSED.md
    negative_control:
      violation: >
        The public envelope schema opened at any level — `additionalProperties` set true or
        removed — or a third combined dial field such as `combined_stress` added to its
        properties allowlist.
        THIS MITIGATION WAS TESTED BY AN INDEPENDENT AUDITOR AT THE WO-2 GATE AND HOLDS: neither
        of the two blends that produced CD-ASR-F01 could reach the published artefact through the
        validated envelope without also failing this check. Its LIMIT is stated in the schema's
        own description and is unchanged: it constrains the SHAPE of what is published, so it
        cannot see a blended number assigned to `equity_crash.score`, because that key is
        legitimately a number. That case is covered by the publication provenance gate
        (crash_detector.publication.dial_scalar), evidenced by CD-RT-002-TYPE-NO-ARITHMETIC.
      evidence_ref: RTR-WO2-0001

- criterion_id: CD-AC-003
  origin: PID
  obligation: MANDATORY
  criterion: Witnesses are side-by-side, never ingredients.
  acceptance_semantics: >
    PID §6: the score computed with witnesses unreachable is BYTE-IDENTICAL; remove the witness
    feeds and the dials are unchanged while the witness panel shows WITNESS UNAVAILABLE. The
    structure carrying it is stated in BLUEPRINT §13 — cd_engine holds NO GRANT OF ANY KIND on
    witness.*, the pipelines and containers are separate, and composition happens only at the
    serving layer. Two tests, because the code graph and the database catalogue are different
    facts: a GRANT that was written and a GRANT that is held are not the same thing, and where
    they disagree the catalogue wins.
  pid_relation: DERIVES
  supersedes: []
  superseded_by: null
  tests:
  # THIS CHECK WAS DEFEATED AND THE REPAIR IS STRUCTURAL (CD-ASR-F05, increment 4). The auditor
  # appended `from crash_detector.witness.panel import Agrees` to deploy/entrypoints/cd_engine.py —
  # THE MODULE THAT IS THE ENGINE CONTAINER'S PROCESS — and the check exited 0. The defect was a
  # MISMATCH OF SUBJECTS, not a missed spelling: the guard's subject was the engine PACKAGE, rooted
  # at the CONSTANT crash_detector.engine under src/, and the criterion's subject is the engine
  # CONTAINER. The file was never read, so no amount of extra import-route recognition would have
  # found it.
  #
  # THE REPAIR IS NOT "ALSO SCAN deploy/entrypoints/" — that is a second hard-coded path and the
  # next escape is a third one. The walk root and the scanned universe are now DERIVED: the root is
  # read out of deploy/compose.yaml's cd-engine service and the Dockerfile it names (entrypoint +
  # command, compose overriding the image, merge keys resolved), and the universe is what that
  # image's own COPY instructions ship, named against the sys.path roots the image declares. Change
  # the artefact and the guard's subject follows. The ROOT SET IS A UNION with the engine package,
  # deliberately: in WO-2 the container's process does NOT reach crash_detector.engine, so
  # replacing the package root would have deleted the guard that catches the original plant.
  #
  # BOUNDARY 5 WAS AMENDED AT CD-D-055 CLOSING CD-PL-F62. The walk roots are no longer the
  # NAME-matched service: they are every container built from the ENGINE'S IMAGE, identified by
  # build context plus a byte-identical Dockerfile (CD-ENGINE-ROOT-004). A name match let a sixth
  # service `cd-engine-worker`, built from deploy/Dockerfile.engine and importing witness code from
  # its entrypoint, exit 0 at be34fe4.
  #
  # THIS CHECK HAS A DECLARED LIMIT, in SIX numbered boundaries, stated identically in the header
  # of tools/register/check_engine_no_witness_reach.py, in the execution contract, and below
  # (CD-RULE-004). Boundary 6 is this structure's OWN residue and is measured, not asserted.
  - test_id: CD-RT-003-ENGINE-NO-WITNESS-REACH
    scope: CLASS
    execute: python3 tools/register/check_engine_no_witness_reach.py --root .
    execution_contract: contracts/execution/CD-RT-003-ENGINE-NO-WITNESS-REACH.md
    negative_control:
      violation: >
        Any import edge by which something reachable from the engine container's ROOT SET reaches
        witness code — module-level, function-local, aliased, relative or through an intermediate
        module. Import PLACEMENT must not evade it: a function-local import is the same edge. THE
        ROOT SET IS DERIVED AND IS A UNION: every module the declared process of EVERY CONTAINER
        BUILT FROM THE ENGINE'S IMAGE starts — read from deploy/compose.yaml and the Dockerfile it
        names, the image identified by artefact and not by service name (CD-ENGINE-ROOT-004) —
        TOGETHER WITH every
        module in src/crash_detector/engine/. So the plant may be placed in the engine package, in
        the module the ENTRYPOINT names, in anything either of them reaches transitively, in a
        module named by a compose `entrypoint:` or `command:` override, in one named through a
        YAML merge key, or in the entrypoint of a SECOND SERVICE BUILT FROM THE ENGINE'S IMAGE
        under any name at all — all of them are the same violation. A DERIVATION THAT CANNOT BE MADE is
        also a failure and not a pass: a shell-form ENTRYPOINT, `python -c`, a service with no
        `build`, a COPY from another build stage, an anchor the reader cannot locate, a module name
        claimed by two files, or Python shipped into the image that no declared sys.path root can
        name each terminate NON-ZERO with a stated clause id (CD-ENGINE-ROOT-101..110).
        THIS CHECK HAS A DECLARED LIMIT, stated in full in the header of
        tools/register/check_engine_no_witness_reach.py, in the execution contract and here, in SIX
        boundaries: (1) it is a STATIC READ OF DECLARATIONS at one commit — no image is built and
        no container started (RT-B is forbidden in WO-2), so a compose OVERRIDE file, `docker run
        --entrypoint`, `docker exec` or a non-compose orchestrator manifest are outside the
        subject, NOT PROVED TO BE CARRIED ANYWHERE, owed at WO-3 with the same override surface
        CD-RT-012-EGRESS-NO-BROKER declares at its own boundary 6. (2) A SECOND PROCESS STARTED AT
        RUN TIME — subprocess, os.execv — is not an import edge; PARTIALLY CARRIED, MEASURED, in
        that a dotted witness path in a string literal and a non-literal import_module both still
        fire, but for a second process named by a non-witness path, NOT PROVED TO BE CARRIED
        ANYWHERE. (3) IMPORTING WITNESS TYPES IS NOT READING WITNESS DATA and this check does not
        claim otherwise; that half is CARRIED by CD-RT-003-GRANT-MATRIX-LIVE, a different
        instrument on a different substrate. (4) The compose reader is a stdlib-only YAML subset: a
        non-empty FLOW collection raises and becomes CD-ENGINE-ROOT-101, a refusal — fail-closed
        but a shape a legitimate author could write; and the reader's known non-termination defect
        (CD-ENG-WO2R-F14 / CD-PL-F61, ruled to a separate bounded dispatch by CD-D-051) is shared
        here and NOT repaired in this increment. (5) Only the ENGINE service's process is a WALK
        ROOT; the other five are RESOLVED so a rename is loud, but witness code reachable from
        cd-witness is correct and not a violation. AMENDED AT CD-D-055 CLOSING CD-PL-F62: the
        previous text of this boundary distinguished services BY PURPOSE in prose while the code
        distinguished BY NAME, so it did not contemplate a SECOND SERVICE BUILT FROM THE ENGINE'S
        OWN IMAGE — incomplete, not false. THE WALK ROOTS ARE NOW THE ENGINE CONTAINER SET, DERIVED
        BY IMAGE IDENTITY: every service building the same context from a BYTE-IDENTICAL Dockerfile
        as cd-engine is an engine container whatever it is called (CD-ENGINE-ROOT-004), and its
        shipped files are scanned against ITS OWN declared sys.path roots. MEASURED FOUR WAYS: V42
        (cd-witness importing witness) exit 0 PASS 23, the criterion and not an escape; PL-U6b (a
        sixth service cd-engine-worker built from deploy/Dockerfile.engine whose entrypoint imports
        crash_detector.witness.panel) exit 0 PASS 24 at be34fe4 and exit 1 HERE, naming the route
        `crash_detector.witness.panel <- cd_worker`; V45 (a seventh service cd-engine-shadow from
        the same Dockerfile with a CLEAN entrypoint) exit 0 PASS 27, with the container set growing
        1 -> 2 and the derived roots growing cd_engine -> cd_engine, cd_shadow, so the subject
        follows the artefact and a legitimate second engine container is not a violation; V46 (a
        byte-identical COPY of Dockerfile.engine under another name, service cd-analytics, reaching
        witness through the top-level package) exit 1, so the identity is the image's CONTENT and
        not its path. WHAT REMAINS OUTSIDE IT: a service built from a Dockerfile that is NOT
        byte-identical — a near-copy differing by one comment — is a different image by the
        artefact's own account and is not a walk root; closing that means deciding when two
        different Dockerfiles MEAN the same image, which is a judgement and not a derivation.
        CARRIED, MEASURED BY THE IMPLEMENTING SEAT (CD-RULE-006): the container-set test layer
        asserts the declared service set by EQUALITY and refuses ANY added service whatever image
        it builds — on the PL-U6b tree at be34fe4 the seat observed 8 failed, 1184 passed, namely
        tests/test_runtime_lifecycle.py::test_there_is_one_entrypoint_per_application_service and
        seven in tests/test_deploy_container_set.py (test_all_seven_services_are_declared,
        test_every_service_declares_a_non_root_user,
        test_the_declared_uid_matches_the_machine_readable_one, test_every_service_has_a_distinct_uid,
        test_every_service_declares_its_three_storage_classes,
        test_only_the_store_declares_durable_storage,
        test_every_build_passes_the_base_image_through_as_a_required_variable), while the six other
        static register checks all exited 0. The carrier is the container-set TEST layer, not the
        register. (6) RUN-TIME
        sys.path MUTATION IS NOT DERIVED, and this is the derivation's own residue. MEASURED,
        variant V44: cd_engine.py inserts /app/src/crash_detector/witness into sys.path and writes
        `import panel`; panel.py IS scanned and IS witness code, but the edge is spelled `panel`,
        resolves to no module in the graph, and the check exits 0, PASS 23. PARTIALLY CARRIED,
        MEASURED: the string-literal and dynamic-import clauses still fire, and CD-ENGINE-ROOT-110
        closes the neighbouring route of shipping code OFF the declared path (variant V43, exit 3).
        FOR A SHORT-NAME IMPORT OF ALREADY-SCANNED WITNESS CODE AFTER A sys.path INSERT, NOT PROVED
        TO BE CARRIED ANYWHERE. It is deliberately not closed by refusing sys.path mutation,
        because the clean tree legitimately contains one in deploy/entrypoints/_service.py and a
        guard that fires on the product is a guard somebody switches off. Raised by the
        implementing seat against its own work as CD-ENG-WO2R-F17.
      evidence_ref: RTR-WO2-0001
  - test_id: CD-RT-003-GRANT-MATRIX-LIVE
    scope: CLASS
    execute: python3 tools/register/check_grant_matrix_live.py --root .
    execution_contract: contracts/execution/CD-RT-003-GRANT-MATRIX-LIVE.md
    negative_control:
      violation: >
        Any privilege of any kind reaching cd_engine on schema witness, planted in the subject
        tree's migrations. The class has seven routes and the plant may take any of them: the
        schema privilege, table or column privileges, sequence or function privileges, a grant to
        PUBLIC that cd_engine inherits, membership of a role that holds one, a default privilege
        that would grant it on a future object, ownership of the schema or of anything in it, or
        the SUPERUSER / BYPASSRLS role attributes.
      evidence_ref: RTR-WO2-0001

- criterion_id: CD-AC-005
  origin: PID
  obligation: MANDATORY
  criterion: WITNESS UNAVAILABLE is not WITNESS AGREES.
  acceptance_semantics: >
    PID §6: plant — kill the witness feed, and the panel degrades to UNAVAILABLE, NEVER to
    agreement. BLUEPRINT §13 adds the harder half: delete the panel row entirely and the result
    is the same. Both the explicit absence and the silent one land on UNAVAILABLE, and a panel row
    older than its staleness window is an absence too. There must be no input whatever — missing,
    stale, malformed or defaulted — from which the serving layer produces AGREES.
  pid_relation: DERIVES
  supersedes: []
  superseded_by: null
  tests:
  # CD-ASR-F06 (MEDIUM) CLOSED AT INCREMENT 5, AND THE SUBJECT GREW BY ONE MODULE.
  # The auditor passed staleness_window_seconds=1e18 with a panel row TEN YEARS OLD and
  # marked AGREES; it rendered WITNESS AGREES with NO SOURCE EDIT AT ALL (escaped variant
  # E07). `_require_usable_window` refused non-finite and non-positive windows and accepted
  # any finite positive number.
  #
  # TWO defects, and closing only the first would have closed the instance:
  #   1. THE WINDOW HAD NO CEILING. src/crash_detector/staleness.py now admits a window only
  #      through StalenessWindow, which REFUSES — never clamps — anything above
  #      STALENESS_WINDOW_CEILING_SECONDS = 900.0. That number is DERIVED and was not chosen
  #      (CD-RULE-003): PID.md §5's ratified assurance latency budget, marked RATIFIED
  #      2026-08-18 (CD-D-003 resolved), requires "pipeline/publication failure independently
  #      detectable <= 15 minutes", and a window wider than the detectability budget renders a
  #      dead feed as fresh for longer than the product permits failure to go undetected.
  #      IT IS A CEILING AND NOT AN OPERATING WINDOW: 900 s consumes the whole budget and
  #      leaves nothing for detection and alerting. The operating window is BLUEPRINT §7's
  #      window_for(regime), CD-AC-009, owed at WO-3. NO TIGHTER NUMBER IS IMPOSED HERE,
  #      because none is derivable from ratified text and choosing a prudent-looking one is
  #      the invention CD-RULE-003 forbids.
  #   2. AGREEMENT DID NOT REQUIRE FRESHNESS. `Agrees` now carries FreshnessEvidence, whose
  #      construction IS the age comparison and which is bound to the agreement's own
  #      as_of_utc. There is therefore no route to agreement that skips the comparison —
  #      including an exception handler, a fallback branch or a fast path — because there is
  #      no Agrees without the evidence and no evidence without the comparison.
  #
  # THE ADMISSION DOOR IS SHARED WITH THE DIAL PATH, deliberately. crash_detector.engine
  # performs its own age comparison against the window in the ConfigSnapshot, so bounding only
  # the resolver would have left a decade-old observation feeding a dial. ConfigSnapshot
  # admits through the same type and `_latest_usable_ok` takes a StalenessWindow rather than a
  # float. Two guarded comparison sites are an enumeration; one place a usable window can come
  # into existence is a closure. The dial-path arm is evidenced by CD-AC-001's declared
  # command over tests/test_evaluate.py.
  #
  # tests/test_staleness.py IS PART OF THE DECLARED COMMAND, because the structure that
  # carries the proposition now lives in a module of its own and a guard that does not run
  # over its own subject is not a guard.
  - test_id: CD-RT-005-PANEL-UNAVAILABLE-NEVER-AGREES
    scope: CLASS
    execute: PYTHONPATH=src python3 -m pytest tests/test_witness_panel.py tests/test_witness_resolver.py tests/test_staleness.py -q
    execution_contract: contracts/execution/CD-RT-005-PANEL-UNAVAILABLE-NEVER-AGREES.md
    negative_control:
      violation: >
        A missing or stale panel row defaulted to Agrees — whether by a default argument, a
        fallback branch, a truthiness test that treats absence as agreement, or a field added to
        the Unavailable constructor that a later edit could read as agreement; OR a configured
        staleness window wide enough to make staleness meaningless, which needs no source edit
        and is the CD-ASR-F06 route.
        THIS TEST HAS A DECLARED LIMIT (CD-RULE-004), stated identically here, in the header of
        src/crash_detector/staleness.py and in the execution contract, in FOUR boundaries:
        (1) THE CEILING BOUNDS THE WINDOW; IT DOES NOT ESTABLISH WHAT THE WINDOW SHOULD BE.
        Any window from 0.001 s to 900 s is admissible, and a deployment that configures 899 s
        has a window this guard does not question. The operating window is BLUEPRINT §7's
        window_for(regime), OWED AT WO-3 (CD-AC-009). NOT PROVED TO BE CARRIED ANYWHERE, and it
        is not a defect of this closure: deciding the operating window here would be inventing a
        product quantity (CD-RULE-003).
        (2) CLOCK TRUST IS NOT ESTABLISHED. FreshnessEvidence judges an age against the
        `observed_at_utc` it is handed, and `now_utc` is an argument everywhere on the freshness
        path by design, so that a historical evaluation replays exactly (BLUEPRINT §7). A caller
        that passes a false instant gets evidence about the world it described. MEASURED: with
        now_utc set ten years back, a ten-year-old row resolves to Agrees. NOT PROVED TO BE
        CARRIED ANYWHERE. It is pre-existing and project-wide, not introduced here.
        (3) `object.__setattr__` WALKS PAST FROZEN, as it does for every frozen value in Python
        and in this repository. Both StalenessWindow and FreshnessEvidence use __slots__, so an
        UNDECLARED attribute cannot be injected (measured: AttributeError); overwriting a
        DECLARED slot on an already-constructed value is not preventable at the Python level.
        This is the same residue already declared as boundary B of
        src/crash_detector/dials/magnitude.py and measured there. NOT PROVED TO BE CARRIED
        ANYWHERE.
        (4) THE ENVELOPE'S `staleness_window_seconds` FIELD IS NOT ADMITTED THROUGH THIS DOOR.
        The published envelope carries the window that was applied as a plain number validated
        by the JSON Schema, so a hand-built envelope declaring an inadmissible window is a
        publication-provenance question and not a staleness one. NOT PROVED TO BE CARRIED
        ANYWHERE.
      evidence_ref: RTR-WO2-0001

- criterion_id: CD-AC-012
  origin: PID
  obligation: MANDATORY
  criterion: No execution pathway exists.
  acceptance_semantics: >
    PID §6: a test asserts the codebase contains no broker, order or execution interface —
    advisory-only is STRUCTURAL, not policy. That distinction is the whole criterion. A policy
    saying "we do not trade" is a sentence somebody can change in an afternoon; a codebase with no
    order interface in it, no broker SDK in its lockfile and no container that may reach a broker
    is a different kind of promise. Three independent tests, because the pathway could be opened
    in source, in a dependency, or in the network posture, and closing two of the three closes
    nothing.
  pid_relation: DERIVES
  supersedes: []
  superseded_by: null
  tests:
  # DECLARED LIMIT — CD-RT-012-NO-EXECUTION-INTERFACE. Required by CD-D-014, bounded by CD-D-015.
  #
  # This check has a WRITTEN BOUNDARY, and it is stated here as well as in the header of
  # tools/register/check_no_execution_interface.py and in its execution contract, so that an
  # auditor reading the register sees it without having to discover it. The two texts are kept
  # consistent with each other; the check's header is the longer of the two and carries the
  # measured example for each item. In summary, this check DOES NOT catch:
  #
  #   1. deliberate euphemism — an act named in vocabulary the word lists do not hold. Two rounds
  #      of independent probing each found a fresh escape of this kind (CD-PL-F32, CD-PL-F35, and
  #      the residual CD-PL-F38, all since closed). That each round found ANOTHER is the evidence
  #      for this limit; CD-D-015 ends the hardening chase rather than pretend the next round ends it.
  #   2. code named to hide behind the `work_order` sequence-sense suppression. L1 suppresses the
  #      token `order` after any of the thirty-one modifiers in ORDER_SEQUENCE_MODIFIERS so the
  #      guard does not cry wolf on this project's own daily vocabulary. A pathway named
  #      `work_order_router` to sit inside that suppression escapes L1; it escapes the check only
  #      if it is ALSO shaped to avoid an order ticket, because L2 reads no names at all.
  #   3. any sentence L3 suppresses, and that list is wide — 46 negation words and 25 hypothetical
  #      words, including `must`, `free`, `advisory`, `zero`, `say`, `check` and `were`. MEASURED:
  #      "The engine must send each instruction to the broker" is not read by L3, on `must` alone.
  #   4. a motion chain longer than eight words between a verb of motion and its destination noun.
  #   5. anything that is not a .py or .sql file under src/, db/, deploy/, tests/ and tools/ — no
  #      YAML, shell, Markdown, CI job, template, vendored dependency or container image is read.
  #   6. runtime. This is a static read of source text at one commit.
  #
  # WHY THAT IS ACCEPTABLE. CD-BP-001, risk-accepted by the Product Owner at Blueprint acceptance:
  # the AST register checks are NEVER A SOLE GUARD. CD-AC-012 is defended by this check, by
  # CD-RT-012-LOCKFILE-DENYLIST (which no euphemism in our own source can evade — the SDK is named
  # by its publisher), by CD-RT-012-EGRESS-NO-BROKER, and structurally by the network posture of
  # BLUEPRINT §2 and §13: cd-engine, cd-public, cd-private and cd-store have no egress at all, so a
  # perfectly euphemised pathway inside the engine still has nowhere to send an order. Read a clean
  # run of THIS test as evidence about names, shapes and documented intent — not as proof of the
  # proposition. For the proposition, weigh the egress posture first: of the four it is the only one
  # that constrains what the software CAN DO rather than what it says.
  #
  # FOR THE AUDITOR. A CD-AC-012 variant that lands beyond this boundary is a finding against THIS
  # DECLARATION — was the limit honestly drawn? — and not an automatic RED against the guard
  # (CD-D-014). That is a fair test of a guard that says what it is, and it is available only
  # because the limit was written down first.
  - test_id: CD-RT-012-NO-EXECUTION-INTERFACE
    scope: CLASS
    execute: python3 tools/register/check_no_execution_interface.py --root .
    execution_contract: contracts/execution/CD-RT-012-NO-EXECUTION-INTERFACE.md
    negative_control:
      violation: >
        Any order-entry path in the application source or the store schema. The class is wider
        than a `place_order` stub and the guard is built for the wider class after CD-PL-F32: a
        callable or class whose FIELD SET is an order ticket (an instrument with a quantity and a
        side, a price or order type, or a venue) under a neutral name; a transmission verb applied
        to a tradeable noun in any spelling; a broker SDK import; an execution endpoint literal;
        an execution identifier in a SQL migration; or PROSE — a docstring or comment saying in
        plain English that the code routes orders to a broker, in any of five grammars (direct
        object, passive, nominalised, a trade-lifecycle act named with a party that performs it,
        or intransitive motion toward a destination).
        THIS CHECK HAS A DECLARED LIMIT, stated in full in the header of
        tools/register/check_no_execution_interface.py, in the comment above this entry, and in
        the execution contract. It does NOT catch: deliberate euphemism; a pathway named to hide
        behind the `work_order` sequence-sense suppression AND shaped to avoid an order ticket;
        any sentence carrying one of L3's 46 negation or 25 hypothetical words, `must` among them;
