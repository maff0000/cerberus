# Crash Detector — Required Test Register
# =============================================================================================
# REQUIRED-TEST-REGISTER-CONTRACT-v1, as implemented by pbg/tools/pbg/required_tests.py.
#
# THIS FILE CARRIES OBLIGATIONS. IT CARRIES NO RESULTS.
# There is no status field here and there may never be one: the validator REFUSES any register
# that grades itself (contract §4 check 5) and COMPUTES every status from the PID, this file and
# append-only run records. If you want to know whether a criterion is satisfied, run
#
#     PYTHONPATH=<pbg>/tools python3 -B -m pbg.cli required-tests verify --register required-tests.yaml
#
# and read what it computes. Anything written here about how a test behaves is a DECLARATION of
# what must be true, not a claim that it is.
#
# POPULATION IS NOT MINE TO SET. Every criterion below is derived from PID §6 and only from
# PID §6 — all sixteen of them, CD-AC-001 through CD-AC-016, whatever work order delivers them
# (BLUEPRINT §14: "every row above becomes a register entry"). The validator derives the same
# census from the PID text independently and compares; a register that quietly dropped the
# criteria it could not yet satisfy would be marking its own paper.
#
# ELEVEN OF THE SIXTEEN ARE NOT DELIVERED IN WO-2. They are here with the test that will
# evidence them and an execution contract that says plainly which work order owes them and that
# they are NOT YET EVIDENCED. The validator will compute NOT_EVALUATED or UNDECIDABLE for every
# one of them. THAT IS THE HONEST ANSWER at this baseline and it is not a defect to be dressed
# up — the gate stays shut, which is exactly what a gate is for.
#
# latest_admitted_run IS NULL, AND THIS SEAT CANNOT CHANGE THAT. The Engineer does not admit its
# own evidence (PBG-SOD-001, non-waivable). An independent Assurance seat produces the run record
# and someone other than its author admits it.
#
# EVERY WO-2 TEST NAMES negative_control.evidence_ref: RTR-WO2-0001 — the run record the
# INDEPENDENT Assurance seat will produce. It does not exist yet. That is correct and deliberate:
# this seat declares WHICH RUN MUST EVIDENCE ITS GUARD and cannot supply that run itself. Until it
# exists the validator computes UNDECIDABLE, never PASS.
#
# THE DECLARED COMMANDS ARE VERBATIM. Each `execute` is the exact line an auditor types with the
# working directory set to the root of a subject tree THE AUDITOR EXTRACTED ITSELF —
# `git archive <sha> | tar -x -C <tmpdir>`. No path fixing, no editing, no wrapper. There is no
# run-everything harness in this repository and there may not be one: an auditor verifying through
# a harness the project wrote is verifying the harness (PBG-ASSURE-001).
#
# TWO DELIVERED GUARDS ARE DELIBERATELY ABSENT FROM THIS REGISTER: CD-BASE-IMAGE-DIGEST-PIN and
# CD-BUILD-CONTEXT-RESTRICTED (tools/register/check_base_image_digest_pin.py and
# check_dockerignore.py). They are real and they run clean, but neither derives from any criterion
# in PID §6, and inventing a criterion so a guard has somewhere to live would be writing product
# requirements from the Engineer's seat (PBG-AUTH-005; and the validator blocks NEW_REQUIREMENT
# for the same reason). They are recorded in the Build Log as guards without a register row, which
# is a disclosure for the Product Owner rather than a gap to paper over.
# =============================================================================================

register_version: 1

pid:
  ref: PID.md
  # sha256 of PID.md as it stands at the WO-2 execution base 3f038665. Computed, not guessed:
  #     python3 -c "import hashlib,pathlib;print('sha256:'+hashlib.sha256(pathlib.Path('PID.md').read_bytes()).hexdigest())"
  # The validator recomputes it against the PID it resolves and reports a MISMATCH as a defect,
  # because a population derived from a different document than the one now governing is a
  # population nobody agreed to.
  content_hash: sha256:441d83166b2f3d0cf612baf58b96b8d8bf889a52169babc115fc7a7e26714f85

# NULL, AND NOT THIS SEAT'S TO FILL IN. See the header.
latest_admitted_run: null

criteria:

# --------------------------------------------------------------------------------------------- #
# DELIVERED IN WO-2 — the five doctrine-bearing criteria (BLUEPRINT §13, §15)
# --------------------------------------------------------------------------------------------- #

- criterion_id: CD-AC-001
  origin: PID
  obligation: MANDATORY
  criterion: Missing or stale input never renders as calm.
  acceptance_semantics: >
    PID §6: plant — kill a feed, and the affected dial shows UNKNOWN or DEGRADED within the
    assurance latency budget, NEVER a calm reading. The proposition has two halves and both are
    required: absence must have a name in the type system, and no route may exist by which
    absence becomes a number. A dial that reads 0.0 because a source did not answer is the exact
    failure PID §3.2 forbids — a stale dial saying calm — and it is worse than no dial, because
    somebody trusts it.
  pid_relation: DERIVES
  supersedes: []
  superseded_by: null
  tests:
  # DECLARED LIMIT — CD-RT-001-AST-NO-NUMERIC-DEFAULT. Required by CD-RULE-004, drawn in the
  # pattern of CD-RT-012-NO-EXECUTION-INTERFACE (CD-D-014/CD-D-015), which an independent
  # auditor examined and judged honestly and conservatively drawn.
  #
  # WHY THIS ENTRY CHANGED. At the WO-2 gate this test declared `scope: CLASS` while the check
  # enumerated four spellings of a numeric default. CD-ASR-F03 walked past all four with a
  # module-level constant. The check now carries RULE F, which inverts the question: instead of
  # enumerating ways a number can arrive, it enumerates the ONE way a dial magnitude is
  # PERMITTED to arrive — from the declared contribution model applied to present inputs — and
  # reports every other provenance, including ones nobody has thought of. RULE F DENIES BY
  # DEFAULT, so a route the check's author never imagined is a violation for being
  # unrecognised rather than a silence. That is why `scope: CLASS` is retained, and the residue
  # is written down here rather than left to be discovered.
  #
  # THIS CHECK IS A STATIC READ OF SOURCE TEXT AT ONE COMMIT, and CD-AC-001's proposition is a
  # RUNTIME property. Where a boundary below says the runtime layer carries it, that layer is
  # the sealed and slotted Reading types in src/crash_detector/dials/reading.py plus the
  # absence post-condition `refuse_a_number_without_its_inputs` in
  # src/crash_detector/engine/evaluate.py, and it is evidenced by the SIBLING test
  # CD-RT-001-ABSENCE-RENDERS-UNKNOWN. In summary, this check DOES NOT catch:
  #
  #   1. a construction it cannot see as a construction. RULE F recognises a value-bearing
  #      reading by the terminal name of its callee (`Value`, `Degraded`), resolved through the
  #      module's import aliases. MEASURED EXAMPLE, which exits 0 here:
  #        maker = getattr(sys.modules["crash_detector.dials.reading"], "Value")
  #        return maker(value=score, as_of_utc=now_utc, inputs_used=("carried",))
  #      THE RUNTIME LAYER CARRIES THIS: the post-condition inspects the returned object's TYPE
  #      and never reads the expression that produced it, so the same plant raises
  #      AbsenceYieldedAValue when the branch executes.
  #   2. tracing beyond one scope chain. A magnitude computed inside a helper is reported as
  #      UNRECOGNISED rather than followed — deny by default, so it is not an escape, but a
  #      LEGITIMATE future helper must be declared in DECLARED_MAGNITUDE_SOURCES or it is
  #      reported. MEASURED EXAMPLE: `score = _blend(payloads)` is reported.
  #   3. anything outside the two declared tiers. MEASURED EXAMPLE: the same plant in
  #      src/crash_detector/publication/summary.py exits 0 here. The declared set REFUSES if a
  #      declared path is missing, so it cannot be narrowed by deleting a module, but it does
  #      not grow on its own.
  #   4. class A (nullable-number annotations) outside the dial path — printed as a NOTE on
  #      every run, because BLUEPRINT §7 and §13 scope that ban to the dial path (CD-ENG-F26).
  #   5. a magnitude legitimately computed but WRONG. RULE F asks where a number came from,
  #      never whether it is right. scores.py deliberately imposes no range (CD-D-005 owed).
  #   6. runtime, configuration and data. A zero arriving from a config file, an environment
  #      variable or a database row is not in the source text. THE RUNTIME LAYER CARRIES THIS.
  #
  # FOR THE AUDITOR. Do not read a clean run of this check as proof that no route from absence
  # to a number exists. A variant landing beyond a boundary above is a finding against THIS
  # DECLARATION — was the limit honestly drawn? — and the pair to weigh is this check together
  # with CD-RT-001-ABSENCE-RENDERS-UNKNOWN, which is where the runtime property is evidenced.
  - test_id: CD-RT-001-AST-NO-NUMERIC-DEFAULT
    scope: CLASS
    execute: python3 tools/register/check_no_numeric_default.py --root .
    execution_contract: contracts/execution/CD-RT-001-AST-NO-NUMERIC-DEFAULT.md
    negative_control:
      violation: >
        A dial magnitude whose provenance is not the declared contribution model applied to
        inputs that were present. The class is WIDER than the four spellings this check
        enumerated at the WO-2 gate — a `float | None` or `Optional[float]` annotation, a
        `.get(key, <numeric literal>)`, an `or 0`, a bare `except` returning a number — because
        CD-ASR-F03 escaped all four with a module-level constant. RULE F reports any Value or
        Degraded construction on the scanned path whose magnitude traces to a literal, a
        module-level constant, a parameter, a configuration attribute, a lookup, a previous
        reading, an unrecognised helper call, or anything else it cannot name as declared.
        Unrecognised is a VIOLATION, not a silence, so a plant does not need to use a route the
        check anticipated.
        THIS CHECK HAS A DECLARED LIMIT, stated in full in the header of
        tools/register/check_no_numeric_default.py, in the comment above this entry, and in the
        execution contract, each boundary with an example an auditor can execute. It does NOT
        catch: a constructor obtained dynamically; a magnitude laundered through an undeclared
        helper (reported, not followed); anything outside the two declared tiers; class A
        outside the dial path; a legitimately computed but wrong magnitude; or anything about
        runtime, configuration or data. It is ONE OF TWO guards on CD-AC-001 and never a sole
        guard: the runtime property is carried by the sealed Reading types and the absence
        post-condition, and evidenced by CD-RT-001-ABSENCE-RENDERS-UNKNOWN.
      evidence_ref: RTR-WO2-0001
  # DECLARED LIMIT — CD-RT-001-ABSENCE-RENDERS-UNKNOWN. Required by CD-RULE-004.
  #
  # This is the RUNTIME arm, and after CD-ASR-F02 it is the arm that carries CD-AC-001's
  # "structurally incapable" half. The three Reading constructors now have a DECLARED attribute
  # surface asserted by EQUALITY (not by the absence of a blacklist — that blacklist is what
  # E03 walked past), are slotted against instance attribute injection, are closed against
  # subclassing, and are re-verified at every consumer boundary. Separately, the per-dial
  # evaluator carries a post-condition that refuses a value-bearing reading from a dial whose
  # required inputs were not all present, whatever the number is and wherever it came from.
  #
  # THE ONE RESIDUE, DECLARED RATHER THAN DENIED. `type.__setattr__` installs a class attribute
  # without going through a metaclass, and CPython offers no way to prevent that. MEASURED
  # EXAMPLE, which an auditor can execute:
  #   type.__setattr__(Unknown, "magnitude", property(lambda self: 0.0))
  #   Unknown(reason="R", since_utc=t, missing_inputs=()).magnitude   ->   0.0
  # What IS closed is every route by which such a number reaches a consumer: fold, is_value and
  # DialSet each re-verify the surface of the reading's class and raise ReadingSurfaceViolated.
  # So the claim this test evidences is: absence cannot acquire a numeric member through
  # construction, assignment, inheritance or definition, and a class mutated after import is
  # refused wherever a reading of it would be used. It is NOT the claim that a process which
  # rewrites class objects at runtime cannot read a number back out of one it mutated. Do not
  # read a clean run as proof of the stronger claim.
  - test_id: CD-RT-001-ABSENCE-RENDERS-UNKNOWN
    scope: CLASS
    execute: PYTHONPATH=src python3 -m pytest tests/test_reading.py tests/test_evaluate.py -q
    execution_contract: contracts/execution/CD-RT-001-ABSENCE-RENDERS-UNKNOWN.md
    negative_control:
      violation: >
        Absence made to yield a number at runtime, by ANY route, or a reading that carries a
        value produced by a dial that did not get its inputs. The class includes, and is not
        limited to: any member added to a Reading constructor's declared attribute surface —
        a property, a classvar, a method, a `__getattr__`, a slot, a dunder, numeric or not,
        added in the class body, by a decorator, by class assignment or by a metaclass; an
        undeclared instance attribute set through `object.__setattr__`; a subclass of a Reading
        constructor carrying a numeric member; and `evaluate()` returning Value or Degraded for
        a dial whose required inputs were absent, stale, future-dated, unregistered or lacking
        a contribution model — whether the number is a literal, a module-level constant, a
        configuration default, a previous magnitude carried across a gap, or a value read from
        the store. With the WO-2 empty source registry both dials must read Unknown; a plant
        that makes either read a value must fail this test.
        DECLARED LIMIT: post-import class mutation through `type.__setattr__` installs the
        attribute and is refused at every consumer boundary rather than prevented. The measured
        example is in the comment above this entry and in the header of
        src/crash_detector/dials/reading.py.
      evidence_ref: RTR-WO2-0001

- criterion_id: CD-AC-002
  origin: PID
  obligation: MANDATORY
  criterion: The two dials are never blended.
  acceptance_semantics: >
    PID §6: no code path combines them into one number, and a planted blend fails the register.

    THIS TEXT WAS REWRITTEN AT WO-2R, CLOSING CD-ASR-F01 (HIGH). It used to say the criterion was
    "enforced at three independent layers" and that "a blend that slips past any one layer must
    still fail the other two". THAT SPECIFIC CLAIM WAS REFUTED BY EXECUTION: an independent
    auditor produced two working blends that passed ALL THREE declared layers simultaneously and
    each returned 0.5 from equity 0.9 and monetary 0.1. It is not restated here, and the entries
    below claim only what their layers deliver (CD-RULE-004).

    WHAT THE LAYERS DELIVER NOW, each named with what it does NOT do.

    1 THE TYPE, and it is the load-bearing one. A dial magnitude is a NOMINAL, PER-DIAL,
    NON-COERCIBLE value (crash_detector.dials.magnitude.DialMagnitude) carrying which dial it came
    from as DATA. It defines no arithmetic or coercion dunder, so any arithmetic, comparison,
    aggregation, serialisation or reduction over two magnitudes raises TypeError from the
    interpreter — regardless of the route by which the two values were reached, which is what
    makes it a CLASS closure rather than a list of spellings. Cross-dial combination is refused at
    the POINT OF COMBINATION by comparing carried provenance, so the refusal does not depend on
    anyone having read the code. WHAT IT DOES NOT DO: once a number is released for its ONE named
    dial it is an ordinary float, and Python adds floats.

    2 THE PUBLICATION BOUNDARY. crash_detector.publication.dial_scalar.number_for_dial_slot
    releases a number into a dial slot only from a magnitude whose provenance is exactly that
    slot's dial, so a blend cannot be OFFERED to the envelope. WHAT IT DOES NOT DO: it cannot see
    a number that reaches a dial slot without coming through it.

    3 THE CLOSED PUBLIC ENVELOPE SCHEMA. additionalProperties is false at every level and
    properties is an allowlist, so a third combined field has nowhere to be written. The auditor
    tested this mitigation specifically and confirmed IT HOLDS. WHAT IT DOES NOT DO: it cannot
    tell a blended number assigned to equity_crash.score from an honest one, because that key is
    legitimately a number. Layer 2 is what covers that.

    4 THE AST SCAN IS A LOCATOR, NOT A CLOSURE, and its entry below carries a DECLARED LIMIT and
    a corrected scope. Its flavour propagation is intra-procedural and its read is purely static;
    both escaped blends walked past it and always will.

    Layers 1 to 3 are structural and independent of one another. None is claimed to be sole
    (BLUEPRINT §17 risk CD-BP-001, PO-accepted), and no claim is made here that a violation
    slipping past one must fail the others.
  pid_relation: DERIVES
  supersedes: []
  superseded_by: null
  tests:
  # CD-RT-002-TYPE-NO-ARITHMETIC is the RUNTIME arm, and after CD-ASR-F01 it is the arm that
  # carries CD-AC-002's "unrepresentable" half. Its declared command GREW at WO-2R by one module,
  # tests/test_dial_provenance.py, which executes escaped variants E01 and E02 in the auditor's own
  # shape and asserts the publication-boundary provenance refusal. The command grew because the
  # register may not claim a layer it declares no test for; NOTHING WAS REMOVED FROM IT, and
  # tests/test_scores.py and tests/test_dialset.py are unchanged in what they assert — only in how
  # they construct a magnitude, which now names its dial.
  - test_id: CD-RT-002-TYPE-NO-ARITHMETIC
    scope: CLASS
    execute: PYTHONPATH=src python3 -m pytest tests/test_scores.py tests/test_dialset.py tests/test_dial_provenance.py -q
    execution_contract: contracts/execution/CD-RT-002-TYPE-NO-ARITHMETIC.md
    negative_control:
      violation: >
        A scalar derived from BOTH dial types made representable or publishable, by ANY route.
        The class includes, and is not limited to: an arithmetic, bitwise, ordering or
        numeric-coercion dunder added to a score type or to the dial magnitude type, or inherited
        from an ancestor of either; a numeric base introduced under both types; a subclass of the
        magnitude type carrying a coercion; a member added to the magnitude type's declared
        attribute surface, by class body, decorator, class assignment or metaclass; a method added
        to DialSet that returns a scalar; a magnitude constructed without provenance, or with
        provenance that is not exactly one dial; a magnitude of one dial accepted into the other
        dial's score type or published into the other dial's envelope slot; a combinator that
        UNIONS provenance instead of comparing it; a same-dial helper that does not refuse when it
        is reused across dials; and a round trip through copy, pickle or JSON that strips
        provenance or yields a bare number.
        DECLARED LIMIT: a number released through `quantity_for(<one dial id>)` is an ordinary
        float, and two of them can be added by ordinary Python arithmetic. That residue is stated
        in the header of src/crash_detector/dials/magnitude.py (boundary A), in the comment above
        the CD-RT-002-AST-NO-BLEND entry below (boundary 6) and in both execution contracts, each
        with an example an auditor can execute. What IS refused is publishing the result: the
        publication gate takes only a magnitude whose provenance is exactly the slot's dial.
      evidence_ref: RTR-WO2-0001
  # DECLARED LIMIT — CD-RT-002-AST-NO-BLEND. Required by CD-RULE-004 and by the WO-2R dispatch,
  # drawn in the pattern of CD-RT-012-NO-EXECUTION-INTERFACE, whose declaration an independent
  # auditor examined and judged HONESTLY DRAWN AND DRAWN CONSERVATIVELY. That auditor's caveat is
  # why this block exists: "CD-AC-002's AST guard has comparable limitations (intra-procedural,
  # static) and NO comparable written declaration, which is why CD-ASR-F01 is reported at HIGH."
  #
  # THE SCOPE OF THIS ENTRY WAS CORRECTED FROM `CLASS` TO `INSTANCE` AT WO-2R, and that correction
  # is the point rather than a detail. A static intra-procedural checker cannot close this class
  # and no hardening will make it able to: E01 moved the arithmetic one call away into a function
  # whose parameters are annotated `float`, and E02 reached the dials through `getattr` with plain
  # string literals so that NO DIAL MARKER APPEARED IN ANY EXPRESSION. Deny-by-default is not
  # available here the way RULE F made it available to CD-RT-001-AST-NO-NUMERIC-DEFAULT, because
  # there is no single permitted provenance for an expression to be traced back to — every
  # expression in the application is a candidate. Claiming CLASS while enumerating what a static
  # checker can see is precisely the defect that produced this finding, so the entry now claims
  # INSTANCE and the CLASS closure is claimed by CD-RT-002-TYPE-NO-ARITHMETIC, which delivers it
  # at runtime.
  #
  # WHAT THIS CHECK DOES NOT CATCH. The full list with an executable example per boundary is in
  # the header of tools/register/check_no_blend.py and in
  # contracts/execution/CD-RT-002-AST-NO-BLEND.md, in the same words. In summary:
  #   1 INTER-PROCEDURAL FLOW. MEASURED EXAMPLE, exits 0 — this is escaped variant E01:
  #       def _fold(left: float, right: float) -> float: return (left + right) / 2.0
  #       def banner_figure(dials): return _fold(dials.equity.value.score, dials.monetary.value.score)
  #     Executed, the TYPE layer raises TypeError: unsupported operand type(s) for +:
  #     'DialMagnitude' and 'DialMagnitude'.
  #   2 DYNAMIC ATTRIBUTE ACCESS, which erases flavour entirely. MEASURED EXAMPLE, exits 0 — this
  #     is escaped variant E02, the stronger of the two because it needs no allowlisted path:
  #       _SLOTS = ("equity", "monetary")
  #       magnitudes = [getattr(dials, slot).value.score for slot in _SLOTS]
  #       return sum(magnitudes) / len(magnitudes)
  #     Executed, the TYPE layer raises TypeError: unsupported operand type(s) for +: 'int' and
  #     'DialMagnitude'.
  #   3 THE RULE 2 ALLOWLIST is a real hole in RULE 2 by design; six paths may consume both dials
  #     in one expression and E01 was planted in one of them (src/crash_detector/serving).
  #   4 THE SCANNED SET: only src/crash_detector/ and deploy/entrypoints/. A blend in tests/ or
  #     db/ exits 0 here. It cannot reach a shipped image — all six application Dockerfiles COPY
  #     exactly src/ and deploy/entrypoints/ — but this check does not see it.
  #   5 IT READS SOURCE, NOT BEHAVIOUR. A blend assembled at runtime is outside a static check.
  #   6 A NUMBER ALREADY RELEASED is an ordinary float. MEASURED EXAMPLE, which RULE 1 catches
  #     when the dial ids are written and does NOT catch when they are reached dynamically:
  #       e = dials.equity.value.score.quantity_for(EQUITY_DIAL_ID)
  #       m = dials.monetary.value.score.quantity_for(MONETARY_DIAL_ID)
  #       blended = (e + m) / 2.0
  #     THE PUBLICATION BOUNDARY CARRIES THIS: number_for_dial_slot takes only a magnitude whose
  #     provenance is exactly the slot's dial, so `blended` cannot be offered for publication, and
  #     the closed envelope schema has no third key for it.
  #
  # DO NOT READ A CLEAN RUN OF THIS CHECK AS PROOF THAT NO CODE PATH COMBINES THE TWO DIALS. It
  # was clean for both blends that produced CD-ASR-F01. The pair to weigh is this check together
  # with CD-RT-002-TYPE-NO-ARITHMETIC, which is where the runtime property is evidenced.
  #
  # FOR THE AUDITOR. A CD-AC-002 variant landing beyond a boundary above is a finding against THIS
  # DECLARATION — was the limit honestly drawn? — and not an automatic RED against the guard. A
  # variant reaching the violation by a route a boundary says is covered by the type layer or the
  # publication boundary, and NOT refused when EXECUTED, is a defect in the closure: report it.
  - test_id: CD-RT-002-AST-NO-BLEND
    scope: INSTANCE
    execute: python3 tools/register/check_no_blend.py --root .
    execution_contract: contracts/execution/CD-RT-002-AST-NO-BLEND.md
    negative_control:
      violation: >
        A single expression consuming both dial types outside the allowlisted container and
        serving layer — the canonical form being `combined = (equity + monetary) / 2`, and what
        this check reaches being any arithmetic, comparison or aggregation over the two together
        WITHIN ONE SCOPE, including the three-statement spelling that its intra-procedural flavour
        propagation follows. RULE 3, added at WO-2R and carrying no allowlist beyond the module
        that declares the slot, additionally reports any expression naming the private slot in
        which a dial magnitude holds its number (`_DialMagnitude__quantity`), by attribute or as a
        string handed to getattr: reaching around the declared release obtains a number without
        naming which dial it belongs to, which is the first half of a blend.
        THIS CHECK HAS A DECLARED LIMIT, stated in full in the header of
        tools/register/check_no_blend.py, in the comment above this entry and in the execution
        contract, each boundary with an example an auditor can execute. It is never a sole guard:
        the class is closed at the type and at the publication boundary, and evidenced by
        CD-RT-002-TYPE-NO-ARITHMETIC.
      evidence_ref: RTR-WO2-0001
  - test_id: CD-RT-002-SCHEMA-CLOSED
    scope: CLASS
    execute: python3 tools/register/check_schema_closed.py --root .
    execution_contract: contracts/execution/CD-RT-002-SCHEMA-CLOSED.md
    negative_control:
      violation: >
        The public envelope schema opened at any level — `additionalProperties` set true or
        removed — or a third combined dial field such as `combined_stress` added to its
        properties allowlist.
        THIS MITIGATION WAS TESTED BY AN INDEPENDENT AUDITOR AT THE WO-2 GATE AND HOLDS: neither
        of the two blends that produced CD-ASR-F01 could reach the published artefact through the
        validated envelope without also failing this check. Its LIMIT is stated in the schema's
        own description and is unchanged: it constrains the SHAPE of what is published, so it
        cannot see a blended number assigned to `equity_crash.score`, because that key is
        legitimately a number. That case is covered by the publication provenance gate
        (crash_detector.publication.dial_scalar), evidenced by CD-RT-002-TYPE-NO-ARITHMETIC.
      evidence_ref: RTR-WO2-0001

- criterion_id: CD-AC-003
  origin: PID
  obligation: MANDATORY
  criterion: Witnesses are side-by-side, never ingredients.
  acceptance_semantics: >
    PID §6: the score computed with witnesses unreachable is BYTE-IDENTICAL; remove the witness
    feeds and the dials are unchanged while the witness panel shows WITNESS UNAVAILABLE. The
    structure carrying it is stated in BLUEPRINT §13 — cd_engine holds NO GRANT OF ANY KIND on
    witness.*, the pipelines and containers are separate, and composition happens only at the
    serving layer. Two tests, because the code graph and the database catalogue are different
    facts: a GRANT that was written and a GRANT that is held are not the same thing, and where
    they disagree the catalogue wins.
  pid_relation: DERIVES
  supersedes: []
  superseded_by: null
  tests:
  - test_id: CD-RT-003-ENGINE-NO-WITNESS-REACH
    scope: CLASS
    execute: python3 tools/register/check_engine_no_witness_reach.py --root .
    execution_contract: contracts/execution/CD-RT-003-ENGINE-NO-WITNESS-REACH.md
    negative_control:
      violation: >
        Any import edge by which something reachable from src/crash_detector/engine/ reaches
        witness code — module-level, function-local, aliased, relative or through an intermediate
        module. Import PLACEMENT must not evade it: a function-local import is the same edge.
      evidence_ref: RTR-WO2-0001
  - test_id: CD-RT-003-GRANT-MATRIX-LIVE
