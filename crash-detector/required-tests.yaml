- criterion_id: CD-AC-005
  origin: PID
  obligation: MANDATORY
  criterion: WITNESS UNAVAILABLE is not WITNESS AGREES.
  acceptance_semantics: >
    PID §6: plant — kill the witness feed, and the panel degrades to UNAVAILABLE, NEVER to
    agreement. BLUEPRINT §13 adds the harder half: delete the panel row entirely and the result
    is the same. Both the explicit absence and the silent one land on UNAVAILABLE, and a panel row
    older than its staleness window is an absence too. There must be no input whatever — missing,
    stale, malformed or defaulted — from which the serving layer produces AGREES.
  pid_relation: DERIVES
  supersedes: []
  superseded_by: null
  tests:
  # CD-ASR-F06 (MEDIUM) CLOSED AT INCREMENT 5, AND THE SUBJECT GREW BY ONE MODULE.
  # The auditor passed staleness_window_seconds=1e18 with a panel row TEN YEARS OLD and
  # marked AGREES; it rendered WITNESS AGREES with NO SOURCE EDIT AT ALL (escaped variant
  # E07). `_require_usable_window` refused non-finite and non-positive windows and accepted
  # any finite positive number.
  #
  # TWO defects, and closing only the first would have closed the instance:
  #   1. THE WINDOW HAD NO CEILING. src/crash_detector/staleness.py now admits a window only
  #      through StalenessWindow, which REFUSES — never clamps — anything above
  #      STALENESS_WINDOW_CEILING_SECONDS = 900.0. That number is DERIVED and was not chosen
  #      (CD-RULE-003): PID.md §5's ratified assurance latency budget, marked RATIFIED
  #      2026-08-18 (CD-D-003 resolved), requires "pipeline/publication failure independently
  #      detectable <= 15 minutes", and a window wider than the detectability budget renders a
  #      dead feed as fresh for longer than the product permits failure to go undetected.
  #      IT IS A CEILING AND NOT AN OPERATING WINDOW: 900 s consumes the whole budget and
  #      leaves nothing for detection and alerting. The operating window is BLUEPRINT §7's
  #      window_for(regime), CD-AC-009, owed at WO-3. NO TIGHTER NUMBER IS IMPOSED HERE,
  #      because none is derivable from ratified text and choosing a prudent-looking one is
  #      the invention CD-RULE-003 forbids.
  #   2. AGREEMENT DID NOT REQUIRE FRESHNESS. `Agrees` now carries FreshnessEvidence, whose
  #      construction IS the age comparison and which is bound to the agreement's own
  #      as_of_utc. There is therefore no route to agreement that skips the comparison —
  #      including an exception handler, a fallback branch or a fast path — because there is
  #      no Agrees without the evidence and no evidence without the comparison.
  #
  # THE ADMISSION DOOR IS SHARED WITH THE DIAL PATH, deliberately. crash_detector.engine
  # performs its own age comparison against the window in the ConfigSnapshot, so bounding only
  # the resolver would have left a decade-old observation feeding a dial. ConfigSnapshot
  # admits through the same type and `_latest_usable_ok` takes a StalenessWindow rather than a
  # float. Two guarded comparison sites are an enumeration; one place a usable window can come
  # into existence is a closure. The dial-path arm is evidenced by CD-AC-001's declared
  # command over tests/test_evaluate.py.
  #
  # tests/test_staleness.py IS PART OF THE DECLARED COMMAND, because the structure that
  # carries the proposition now lives in a module of its own and a guard that does not run
  # over its own subject is not a guard.
  - test_id: CD-RT-005-PANEL-UNAVAILABLE-NEVER-AGREES
    scope: CLASS
    execute: PYTHONPATH=src python3 -m pytest tests/test_witness_panel.py tests/test_witness_resolver.py tests/test_staleness.py -q
    execution_contract: contracts/execution/CD-RT-005-PANEL-UNAVAILABLE-NEVER-AGREES.md
    negative_control:
      violation: >
        A missing or stale panel row defaulted to Agrees — whether by a default argument, a
        fallback branch, a truthiness test that treats absence as agreement, or a field added to
        the Unavailable constructor that a later edit could read as agreement; OR a configured
        staleness window wide enough to make staleness meaningless, which needs no source edit
        and is the CD-ASR-F06 route.
        THE STRUCTURAL INVARIANT OF RECORD, NARROWED — CD-PL-F76, AT WO-2R2 INCREMENT 3.
        The invariant that landed this closure (commit 27e3794, carried forward unchanged by
        2802924, 7edb84e and 6641252) opens: "No method defined by a caller-supplied class
        executes during the computation of an age...". THAT SENTENCE IS WIDER THAN THE CLOSURE IT
        DESCRIBES, and the counterexample is this closure's OWN declared boundary 5 below. It is
        narrowed HERE and FORWARD. Commit 27e3794 is NOT rewritten and its message stands as
        written (PBG-CONT-003, non-waivable); this text SUPERSEDES, it does not edit.
        WHAT THE CLOSURE ACTUALLY HOLDS: no method of type(value) executes during the computation
        of an age, the comparison of an age against a window, the selection of a panel constructor
        from a stored state, or the admission of a divergence measurement — because every one of
        those operates on a value of exact base type that crash_detector.own_terms constructed
        from primitives it read out of the supplied object through the base type's own descriptors.
        WHAT STILL EXECUTES, AND IT IS EXACTLY ONE THING: tzinfo.utcoffset. It is a method of a
        supplied OBJECT — the tzinfo instance reached through value.tzinfo — and NOT a method of
        type(value); and it DETERMINES the age. A row whose stated wall clock is 22 HOURS OLD
        resolves to Agrees and renders WITNESS AGREES against a 600-second window when its tzinfo
        reports a compensating offset. MEASURED — boundary 5 below, variant CD-ENG-WO2R2-V10,
        identical at 50fc231 and at the closure. THE CPYTHON INTERPRETER BOUNDS IT to strictly
        under 24 hours, MEASURED. BEYOND THAT BOUND, NOT PROVED TO BE CARRIED ANYWHERE.
        WHY IT IS NOT CLOSED HERE: a tzinfo cannot be refused without refusing zoneinfo, pytz and
        pandas, which all supply their own — that trades a defect for a defect. Closing it needs a
        clock-trust instrument, and CD-RULE-003 forbids a seat inventing a skew tolerance, or the
        CD-D-005 ingredient register. Both are Product Authority territory. It is REPORTED upward
        under CD-D-081 as a pre-existing, bounded, declared residue, and NOT guarded. NO CODE
        CHANGED FOR THIS NARROWING: the code is right; the sentence was too wide.
        THIS TEST HAS A DECLARED LIMIT (CD-RULE-004), stated identically here, in the header of
        src/crash_detector/staleness.py and in the execution contract, in FIVE boundaries:
        (1) THE CEILING BOUNDS THE WINDOW; IT DOES NOT ESTABLISH WHAT THE WINDOW SHOULD BE.
        Any window from 0.001 s to 900 s is admissible, and a deployment that configures 899 s
        has a window this guard does not question. The operating window is BLUEPRINT §7's
        window_for(regime), OWED AT WO-3 (CD-AC-009). NOT PROVED TO BE CARRIED ANYWHERE, and it
        is not a defect of this closure: deciding the operating window here would be inventing a
        product quantity (CD-RULE-003).
        (2) CLOCK TRUST IS NOT ESTABLISHED. FreshnessEvidence judges an age against the
        `observed_at_utc` it is handed, and `now_utc` is an argument everywhere on the freshness
        path by design, so that a historical evaluation replays exactly (BLUEPRINT §7). A caller
        that passes a false instant gets evidence about the world it described. MEASURED: with
        now_utc set ten years back, a ten-year-old row resolves to Agrees. NOT PROVED TO BE
        CARRIED ANYWHERE. It is pre-existing and project-wide, not introduced here.
        (3) `object.__setattr__` WALKS PAST FROZEN, as it does for every frozen value in Python
        and in this repository. AMENDED AT INCREMENT 6, CD-PL-F65 / CD-D-058, and the previous
        text is why: this boundary read "Both StalenessWindow and FreshnessEvidence use
        __slots__", which is TRUE of those two and was REASSURING ABOUT A THIRD VALUE IT NEVER
        NAMED. Incomplete, not false — the CD-PL-F62 shape — and the correction is carried in the
        text rather than made silently (PBG-CONT-003).
        THE TWO SLOTTED VALUES: StalenessWindow and FreshnessEvidence are both
        @dataclass(frozen=True, slots=True), so an UNDECLARED attribute cannot be injected —
        MEASURED: object.__setattr__(window, "ceiling", 1e18) raises AttributeError, and so does
        "smuggled". Overwriting a DECLARED slot on an already-constructed value is NOT
        preventable at the Python level — MEASURED: object.__setattr__(window, "seconds", 1e18)
        sticks, and object.__setattr__(evidence, "as_of_utc", <2016-08-21>) makes its derived
        age_seconds read 315360000.0.
        `Agrees` IS NOT ONE OF THEM AND THE __slots__ HALF DOES NOT HOLD THERE.
        crash_detector.witness.panel.Agrees is @dataclass(frozen=True) with NO slots=True. It
        carries a __dict__, so on Agrees even the UNDECLARED-attribute protection is ABSENT —
        MEASURED: object.__setattr__(agrees, "smuggled", 1e18) STICKS and agrees.smuggled reads
        1e+18, where the identical write on StalenessWindow raises.
        AND THE ROUTE REACHES THE PRODUCT OWNER'S OWN FORBIDDEN SENTENCE — MEASURED (PL-W5), on a
        LAWFULLY constructed fresh Agrees followed by ONE post-construction write:
        row = PanelRow(state="AGREES", as_of_utc=NOW, published_utc=NOW,
        measures={"divergence_measure": 0.01}); a = resolve_panel(row, now_utc=NOW,
        staleness_window_seconds=600.0); object.__setattr__(a, "as_of_utc", datetime(2016, 8, 21,
        12, 0, tzinfo=utc)); render_panel(a) -> 'WITNESS AGREES'.
        That is WITNESS AGREES on a DECADE-OLD TIMESTAMP. render_panel dispatches on TYPE and
        re-validates nothing, so once a value of type Agrees exists no later layer looks at it
        again. Carrying the forgery into the evidence as well makes it internally consistent —
        MEASURED: a.freshness.age_seconds 315360000.0 (3650 days),
        a.freshness.window.covers(315360000.0) True, render_panel(a) still 'WITNESS AGREES'.
        NOT PROVED TO BE CARRIED ANYWHERE — no layer was measured refusing a forged Agrees.
        THE THREE ROUTES THAT ARE REFUSED, UNCHANGED: the decade-old row itself resolves to
        Unavailable / WITNESS UNAVAILABLE, StalenessWindow(seconds=1e18) raises
        StalenessWindowOutOfRange, and Agrees(...) with evidence for a different instant raises
        AgreementWithoutFreshnessEvidence. Same residue as boundary B of
        src/crash_detector/dials/magnitude.py, measured there against a forged magnitude; a
        property of the language, not of this design.
        WHAT IT IS NOT — CORRECTED AT WO-2R2 INCREMENT 2, AND THE PREVIOUS TEXT IS WHY. It read
        "not a route from ordinary input. Every route measured that goes through a CONSTRUCTOR is
        refused, and THREE IS THE DENOMINATOR rather than a proof that no fourth exists".
        THE FOURTH EXISTED: CD-ASR-WO2-02's variant ASR2-005-A, a datetime subclass overriding
        __rsub__ and astimezone, goes through EVERY constructor on the path and reaches Agrees —
        a row dated 2016-08-21 read at 2026-08-19 with a 600 s window rendered WITNESS AGREES
        while THIS TEST exited 0 with 152 passed. The hedge was honest and did its job; what it
        could not do was say what the denominator WAS. The old sentence is quoted rather than
        removed (PBG-CONT-003).
        THE DENOMINATOR IS NOW STATED WITH ITS METHOD. METHOD: parse every module of
        src/crash_detector; compute the transitive intra-package IMPORT CLOSURE of the six
        modules that host a judgement about staleness, agreement or reading-ness
        (serving.witness_resolver, witness.panel, staleness, engine.evaluate, dials.reading,
        serving.dial_presentation); enumerate every AST node in that closure at which an
        operation could be executed by an object the module did not construct, in two tiers —
        ADMISSION (isinstance, issubclass, hasattr, getattr) and THE DECIDING OPERATION
        (comparison, membership, arithmetic, ordering calls, coercion calls, set operations,
        truthiness, identity). The closure is over MODULES, not functions, so it is OVER-inclusive
        by construction. DENOMINATOR: 16 subject modules, 402 sites — tier 1, 30 distinct sites /
        33 occurrences (ISINSTANCE 24, ISSUBCLASS 0, DUCK 9); tier 2, 369 occurrences
        (TRUTHINESS 103, COERCION 101, IDENTITY 47, COMPARE 36, ORDERING 30, MEMBERSHIP 26,
        ARITH 18, SETOP 8). Every tier-1 site carries a written disposition and every subject
        module carries one for tier 2, asserted BY SET EQUALITY IN BOTH DIRECTIONS.
        EXECUTABLE EXAMPLE, from the root of a tree the auditor extracted itself:
        `python3 -B tools/sweep/delegated_judgement_sweep.py --root . --list`. AT f30e63c THIS
        EXITED 0 WITH "402 sites enumerated over 16 modules". THAT IS NO LONGER TRUE AND THE
        CORRECTION IS THE POINT (CD-ENG-WO2R3-F15, raised by the implementing seat against its
        own work). RE-MEASURED AT INCREMENT 4, one pristine extraction per SHA, same command:
          f30e63c  exit 0  PASS — 402 sites over 16 modules
          7b00ce9  exit 0  PASS — 471 sites over 17 modules   (increment 1 UPDATED the dispositions)
          995ec3e  exit 1  FAIL — 514 sites, 11 violations    (increment 2 DID NOT)
          04cdd34  exit 1  FAIL — 514 sites, 11 violations    (unchanged by increment 3)
        ALL ELEVEN VIOLATIONS ARE THE ONE MODULE WO-2R3 INCREMENT 2 CREATED,
        `crash_detector.admission`: one UNDECLARED MODULE (33 tier-2 sites) and ten UNDECLARED
        ADMISSION sites, every one of them an `isinstance`/`getattr`/`hasattr` inside the
        admission mechanism itself. THE INSTRUMENT IS BEHAVING CORRECTLY — a module entered the
        judgement closure without a written disposition and it said so, deny-by-default, exactly
        as designed. WHAT IS WRONG IS THAT NOBODY ANSWERED IT FOR TWO INCREMENTS.
        NOT CLOSED HERE AND DELIBERATELY SO: the remedy is to WRITE ELEVEN DISPOSITIONS in
        tools/sweep/declared_dispositions.py, each asserting how a deciding operand is
        established — substantive claims an auditor will test, made by the seat that wrote the
        module being dispositioned — and WO-2R3 increment 4 is reconciliation-and-return with NO
        NEW LOGIC (CD-D-122). Writing them here would be resolving a finding against this seat's
