- criterion_id: CD-AC-012
  origin: PID
  obligation: MANDATORY
  criterion: No execution pathway exists.
  acceptance_semantics: >
    PID §6: a test asserts the codebase contains no broker, order or execution interface —
    advisory-only is STRUCTURAL, not policy. That distinction is the whole criterion. A policy
    saying "we do not trade" is a sentence somebody can change in an afternoon; a codebase with no
    order interface in it, no broker SDK in its lockfile and no container that may reach a broker
    is a different kind of promise. Three independent tests, because the pathway could be opened
    in source, in a dependency, or in the network posture, and closing two of the three closes
    nothing.
  pid_relation: DERIVES
  supersedes: []
  superseded_by: null
  tests:
  # DECLARED LIMIT — CD-RT-012-NO-EXECUTION-INTERFACE. Required by CD-D-014, bounded by CD-D-015.
  #
  # This check has a WRITTEN BOUNDARY, and it is stated here as well as in the header of
  # tools/register/check_no_execution_interface.py and in its execution contract, so that an
  # auditor reading the register sees it without having to discover it. The two texts are kept
  # consistent with each other; the check's header is the longer of the two and carries the
  # measured example for each item. In summary, this check DOES NOT catch:
  #
  #   1. deliberate euphemism — an act named in vocabulary the word lists do not hold. Two rounds
  #      of independent probing each found a fresh escape of this kind (CD-PL-F32, CD-PL-F35, and
  #      the residual CD-PL-F38, all since closed). That each round found ANOTHER is the evidence
  #      for this limit; CD-D-015 ends the hardening chase rather than pretend the next round ends it.
  #   2. code named to hide behind the `work_order` sequence-sense suppression. L1 suppresses the
  #      token `order` after any of the thirty-one modifiers in ORDER_SEQUENCE_MODIFIERS so the
  #      guard does not cry wolf on this project's own daily vocabulary. A pathway named
  #      `work_order_router` to sit inside that suppression escapes L1; it escapes the check only
  #      if it is ALSO shaped to avoid an order ticket, because L2 reads no names at all.
  #   3. any sentence L3 suppresses, and that list is wide — 46 negation words and 25 hypothetical
  #      words, including `must`, `free`, `advisory`, `zero`, `say`, `check` and `were`. MEASURED:
  #      "The engine must send each instruction to the broker" is not read by L3, on `must` alone.
  #   4. a motion chain longer than eight words between a verb of motion and its destination noun.
  #   5. anything that is not a .py or .sql file under src/, db/, deploy/, tests/ and tools/ — no
  #      YAML, shell, Markdown, CI job, template, vendored dependency or container image is read.
  #   6. runtime. This is a static read of source text at one commit.
  #
  # WHY THAT IS ACCEPTABLE. CD-BP-001, risk-accepted by the Product Owner at Blueprint acceptance:
  # the AST register checks are NEVER A SOLE GUARD. CD-AC-012 is defended by this check, by
  # CD-RT-012-LOCKFILE-DENYLIST (which no euphemism in our own source can evade — the SDK is named
  # by its publisher), by CD-RT-012-EGRESS-NO-BROKER, and structurally by the network posture of
  # BLUEPRINT §2 and §13: cd-engine, cd-public, cd-private and cd-store have no egress at all, so a
  # perfectly euphemised pathway inside the engine still has nowhere to send an order. Read a clean
  # run of THIS test as evidence about names, shapes and documented intent — not as proof of the
  # proposition. For the proposition, weigh the egress posture first: of the four it is the only one
  # that constrains what the software CAN DO rather than what it says.
  #
  # FOR THE AUDITOR. A CD-AC-012 variant that lands beyond this boundary is a finding against THIS
  # DECLARATION — was the limit honestly drawn? — and not an automatic RED against the guard
  # (CD-D-014). That is a fair test of a guard that says what it is, and it is available only
  # because the limit was written down first.
  - test_id: CD-RT-012-NO-EXECUTION-INTERFACE
    scope: CLASS
    execute: python3 tools/register/check_no_execution_interface.py --root .
    execution_contract: contracts/execution/CD-RT-012-NO-EXECUTION-INTERFACE.md
    negative_control:
      violation: >
        Any order-entry path in the application source or the store schema. The class is wider
        than a `place_order` stub and the guard is built for the wider class after CD-PL-F32: a
        callable or class whose FIELD SET is an order ticket (an instrument with a quantity and a
        side, a price or order type, or a venue) under a neutral name; a transmission verb applied
        to a tradeable noun in any spelling; a broker SDK import; an execution endpoint literal;
        an execution identifier in a SQL migration; or PROSE — a docstring or comment saying in
        plain English that the code routes orders to a broker, in any of five grammars (direct
        object, passive, nominalised, a trade-lifecycle act named with a party that performs it,
        or intransitive motion toward a destination).
        THIS CHECK HAS A DECLARED LIMIT, stated in full in the header of
        tools/register/check_no_execution_interface.py, in the comment above this entry, and in
        the execution contract. It does NOT catch: deliberate euphemism; a pathway named to hide
        behind the `work_order` sequence-sense suppression AND shaped to avoid an order ticket;
        any sentence carrying one of L3's 46 negation or 25 hypothetical words, `must` among them;
        a motion chain longer than eight words; anything that is not .py or .sql under the five
        scanned roots; or anything about runtime. It is ONE OF THREE guards on CD-AC-012 and never
        a sole guard (CD-BP-001, PO-accepted). A planted variant landing beyond that boundary is a
        finding against the DECLARATION, not an automatic RED against the guard (CD-D-014).
        ================================================================================
        BOUNDARY 7 — NEW AT WO-2R3 INCREMENT 8 (PO-DECISIONS-0015 ruling 3, the CD-RT-012 FALSE
        POSITIVE). This is one of that limit's three CD-RULE-004 places; the others are the
        header of tools/register/check_no_execution_interface.py and
        contracts/execution/CD-RT-012-NO-EXECUTION-INTERFACE.md.
        WHY IT EXISTS. tests/test_tree_fingerprint.py:61 says, of a governance record telling a
        person to run a test, that the record ORDERS the auditor to do it. The first of those two
        words is a TRANSMISSION_VERB and the second is a TRADEABLE_NOUN, so L3's pattern A read
        them as a claim about what the code does and THIS ROW SHIPPED EXIT 1. It went EXIT 0 ->
        EXIT 1 inside increment 7 and no document said so until an auditor ran one command
        (F-06-A). In that sentence the first word is a NOUN and the second is a VERB: the two
        roles the pattern assigned are exactly swapped. A determiner introduces a NOUN PHRASE, so
        pattern A no longer fires on a transmission verb a determiner introduces directly.
        THREE NARROWINGS BOUND IT, EACH MEASURED, and the third exists because the residue was
        measured rather than reasoned about: (i) the determiner set excludes every determiner
        that can also be a subject pronoun — `this`, `that`, `these`, `those`, `each`, `one`,
        `some`; (ii) a participial or gerund form is untouched; (iii) THE SUPPRESSION DOES NOT
        APPLY AT ALL TO A SENTENCE THAT NAMES A PARTY WHICH ACTS ON INSTRUCTIONS — a broker, a
        venue, a counterparty — because this product has no reason to name one.
        WHAT ESCAPES: a sentence in the suppressed shape that names NO party at all. Strained
        English, and a real residue. CARRIER MEASURED (CD-RULE-006) AND IT ASSERTS THE RESIDUE
        TRUE, so this text cannot go stale in the reassuring direction:
        tests/test_no_execution_interface_prose.py::test_the_residue_of_this_correction_is_declared_and_measured.
        THE PAIRED CONTRAST THE RULING MADE THE CONDITION OF THE CORRECTION is in the same file:
        a baseline arm where the false positive reads clean, and TEN violated arms where a true
        declaration is still caught — the first of which differs from the false positive in
        EXACTLY ONE WORD, a subject noun between the determiner and the verb. AND the carrier
        assembles every arm from single words at run time, because that file is inside the
        scanned set and spelling them as sentences put ELEVEN violations into tests/ and took
        this row RED (MEASURED). Excluding the carrier from the check would have widened this
        guard's blind spot in order to test the guard, and it was refused.
        ================================================================================
      evidence_ref: RTR-WO2-0001
  # REWRITTEN AT WO-2R2 INCREMENT 3, CLOSING CD-ASR-WO2R-F05 (MEDIUM). The entry below
  # previously claimed the class as "a broker, exchange or order-routing SDK added to any
  # dependency manifest" WITH NO DECLARED LIMIT ANYWHERE, and an independent auditor refuted
  # the claim by execution: `tastytrade-sdk==1.2.0` — a REAL, currently-operating US
  # brokerage's REAL order-entry SDK — in requirements.txt AND requirements.lock exited 0,
  # PASS, 17 assertions, 0 violations. REPLICATED BY CD-ENG-WO2R2-02 AT THE AUDITED TREE
  # 50fc231 before anything was repaired, with the auditor's own controls in the same batch:
  # clean exit 0 / 15 assertions; tastytrade exit 0 / 17, ESCAPED; meridian-fix-connect exit 1,
  # CAUGHT on the `fix` token; lattice-client exit 0 / 17, ESCAPED. The guard recognised
  # brokers BY NAME — 61 names plus nine tokens matched as WORDS — and a brand name is neither.
  #
  # THE REPAIR IS NOT A LONGER DENYLIST. The dispatch prohibits it in terms and it is the
  # instance game with more instances: the next name is Robinhood, Webull, Tradier, or a brand
  # founded next year. THE STRUCTURE IS NOW DENY BY DEFAULT over deploy/dependency-registry.yaml,
  # an in-tree registry of declared dependencies (CD-DEP-001) — the same move that closed the
  # egress allowlist at WO-2R increment 3 and has held since. A distribution is admissible only
  # by being, after PEP 503 normalisation, the `distribution` of a registered entry carrying a
  # purpose, an authorising clause and a needing surface. NOTHING IS RECOGNISED ABOUT AN
  # UNREGISTERED DISTRIBUTION, so there is no pattern to write around, and `tastytrade-sdk` is
  # refused for the same reason a typosquat, a renamed fork and a brand invented tomorrow are.
  # The denylist and the token rule SURVIVE as a second layer over the registry AND at the
  # manifest site (CD-DEP-002), and set equality is asserted in BOTH directions (CD-DEP-003) so
  # the manifest line a complaint names cannot be deleted to silence it. NEITHER LAYER IS SOLE.
  #
  # NO NETWORK. Resolution is prohibited (CD-PL-F48): deciding whether an arbitrary package can
  # reach a broker is undecidable offline, and a check whose verdict depends on PyPI or DNS
  # cannot be run by an auditor and cannot be a gate. This check opens no socket.
  #
  # ON `scope: CLASS`, AND THIS IS THE ONE JUDGEMENT CALL IN THIS ITEM — ATTACK IT FIRST.
  # The auditor's finding was compound: (a) no CD-RULE-004 declared limit existed, unlike both
  # sibling CD-AC-012 checks; and (b) the register said `scope: CLASS`, telling a reader the
  # class was closed. (a) IS REPAIRED BELOW — five numbered boundaries, executable examples,
  # carriers measured or NOT PROVED. For (b): the framework's vocabulary is
  # SCOPES = {"INSTANCE", "CLASS"} (pbg/tools/pbg/required_tests.py:62) and pbg/ is protected,
  # so THERE IS NO THIRD VALUE TO MOVE TO. `INSTANCE` would be a different falsehood — a
  # deny-by-default registry is the opposite of instance-catching. `scope: CLASS` is RETAINED
  # and the entry now NAMES WHICH CLASS IS CLOSED and which is not, on the CD-D-014/CD-D-015
  # precedent that governs the sibling CD-RT-012-NO-EXECUTION-INTERFACE — which also declares
  # CLASS and also carries a written boundary. A seat that disagrees should say so: this is
  # recorded as CD-ENG-WO2R2-02-F02 rather than settled by the seat that benefits from it.
  - test_id: CD-RT-012-LOCKFILE-DENYLIST
    scope: CLASS
    execute: python3 tools/register/check_lockfile_denylist.py --root .
    execution_contract: contracts/execution/CD-RT-012-LOCKFILE-DENYLIST.md
    negative_control:
      violation: >
        THE CLASS THAT IS CLOSED: A DISTRIBUTION NOBODY DECLARED. Any distribution named in any
        dependency manifest — pyproject.toml, requirements.txt, requirements.lock, or any
        requirements*.txt, *.lock or constraints*.txt the check finds — whose PEP 503 normalised
        name is not the `distribution` of a registered entry in deploy/dependency-registry.yaml.
        It is refused BY DEFAULT, without anything being recognised about it. ALSO IN THE CLASS:
        a REGISTERED distribution that is on the broker denylist or carries an execution token; a
        registered distribution that appears in no manifest; a malformed registry entry, which
        registers nothing; and a missing or unparseable registry, which refuses rather than
        reading as empty.
        THE CLASS THAT IS NOT CLOSED, STATED HERE SO NO READER INFERS IT: "a dependency that can
        reach a broker". That is not decidable from this tree at all — see boundary 1.
        THIS TEST HAS A DECLARED LIMIT (CD-RULE-004), stated identically here, in the header of
        tools/register/check_lockfile_denylist.py and in the execution contract, in FIVE
        boundaries:
        (1) A REGISTERED DISTRIBUTION IS A HUMAN CLAIM AND A FALSE ONE IS NOT DETECTABLE HERE.
        A person who registers a distribution whose code in fact reaches a broker, under a name
        the denylist does not hold and carrying no execution token, is admitted by layer 1
        because it is registered and cleared by layer 2 because it is not recognisable.
        EXECUTABLE EXAMPLE: add `quiet-market-client==1.0.0` to requirements.txt and
        requirements.lock AND a matching six-key entry to deploy/dependency-registry.yaml; the
        check exits 0. What the structure buys is that the claim must be WRITTEN DOWN, given a
        purpose, cited to a clause, attributed to a consuming surface and reviewed by a person at
        a named line — not that it is true. NOT PROVED TO BE CARRIED ANYWHERE.
        (2) `purpose` AND `declared_in` ARE NOT JUDGED FOR CONTENT. The guard asserts they are
        present and non-empty and can decide neither whether the English is honest nor whether
        the cited clause says what the entry claims. A purpose reading "market data for the
        equity dial" on an order-entry SDK is refused by layer 2 IF the name is recognisable and
        by nothing at all if it is not. NOT PROVED TO BE CARRIED ANYWHERE.
        (3) THIS IS A STATIC READ OF DECLARED MANIFESTS AT ONE COMMIT. It does not read the
        installed environment, site-packages, a vendored directory, a git submodule, a wheel
        committed into the tree, a `pip install` in a Dockerfile RUN line, or anything a base
        image brings. A broker SDK VENDORED AS SOURCE under src/ is not a dependency and never
        appears in a manifest. CARRIER MEASURED (CD-RULE-006): CD-RT-012-NO-EXECUTION-INTERFACE
        reads .py and .sql under src/, db/, deploy/, tests/ and tools/, so vendored SOURCE is in
        ITS subject set — MEASURED at this SHA, exit 0 over 42812 assertions on the clean tree,
        and its own six declared boundaries apply unchanged. FOR A BROKER SDK ARRIVING AS A
        COMPILED WHEEL OR INSIDE A BASE IMAGE, NOT PROVED TO BE CARRIED ANYWHERE.
        (4) A DEPENDENCY IS PERMISSION TO IMPORT, NOT A PATHWAY. The pathway needs somewhere to
        go, and this is why F05 is MEDIUM and not HIGH. CARRIER MEASURED BY THIS SEAT ON ITS OWN
        EXTRACTION, not transcribed from the auditor's numbers (CD-RULE-006):
        deploy/egress-destinations.yaml declares `destinations: []` — the admissible set is
        EMPTY, 0 registered destinations — every service's x-egress.hosts in deploy/compose.yaml
        is empty, and CD-RT-012-EGRESS-NO-BROKER exits 0 over 69 assertions. ITS SCOPE, STATED
        HONESTLY: it carries the PATHWAY and NOT the DEPENDENCY — it says nothing about what may
        be imported, only that there is nowhere registered to send anything. AND IT IS A
        WO-2-STATE FACT THAT WO-3 WILL CHANGE: the lane that makes ALLOWLIST mean more than NONE
        is owed at WO-3, and the moment a destination is registered this carrier weakens by
        exactly that much. It is not a permanent property and must not be read as one.
        (5) THE REGISTRY IS AN IN-TREE FILE AND A COMMIT MAY EDIT IT. Registering a broker SDK is
        a two-line diff: the manifest line and the registry entry. That is the SAME residue the
        egress destination registry carries and it is the deliberate design — the structure makes
        the permission EXPLICIT, ATTRIBUTED AND REVIEWABLE AT A NAMED LINE, not unforgeable. What
        it removes is the SILENT admission, which is exactly what F05 exercised: `tastytrade-sdk`
        needed no registry edit and produced no diff anyone had to justify. CARRIER MEASURED:
        layer 2 over the registry itself refuses a registered `ib-insync` (CD-DEP-002) and a
        registered `meridian-fix-connect` on the `fix` token. FOR A REGISTERED DISTRIBUTION LAYER
        2 DOES NOT RECOGNISE, see boundary 1: NOT PROVED TO BE CARRIED ANYWHERE.
        DO NOT read a clean run of this check as proof that no dependency of this project can
        reach a broker. Read it as proof of exactly three things: that every distribution in
        every declared manifest was REGISTERED by somebody, with a purpose and a cited clause;
        that no registered or manifest distribution is on the denylist or carries an execution
        token; and that the registry holds no permission no manifest uses. It is NOT proof about
        boundaries 1, 2 or 5.
      evidence_ref: RTR-WO2-0001
  # REWRITTEN AT WO-2R INCREMENT 3, CLOSING CD-ASR-F04 (MEDIUM). The entry below previously
  # claimed the class as "a broker host added to any container's egress allowlist" WITHOUT
  # QUALIFICATION and with no declared limit anywhere, and an independent auditor refuted the
  # claim by execution: `198.51.100.24` in place of `api.ibkr.com` exited 0. The guard recognised
  # brokers BY NAME and an address has no name to recognise. The auditor's own words were "not
  # covered by any declared limit", and that — an entry claiming the class while the guard
  # enumerated recognisable instances — is precisely what CD-RULE-004 prohibits.
  #
  # THE STRUCTURE IS NOW DENY BY DEFAULT over deploy/egress-destinations.yaml, an in-tree registry
  # of declared destinations (CD-EGRESS-004). An allowlist entry is admissible only by being,
  # character for character, the `host` of a registered destination whose `services` list names
  # that service. Nothing is recognised about an entry that is not; there is therefore no pattern
  # to write around, and an IP literal is refused for the same reason a CIDR, a URL, a wildcard
  # and a hostname nobody has thought of are — not one of them is a destination anyone declared.
  # The registry itself is judged by the broker vocabulary and the known-operator denylist over
  # its `host` and `operator` fields (CD-EGRESS-002, SURVIVING as a second layer), by a POSITIVE
  # hostname shape (CD-EGRESS-006) and by closed key sets (CD-EGRESS-005). NEITHER LAYER IS SOLE.
  #
  # NO NETWORK. Resolution is prohibited (CD-PL-F48): a check whose verdict depends on DNS is not
  # reproducible, cannot be run offline by an auditor, and cannot be a gate. "What an entry
  # reaches" is decided from data in the tree.
  #
  # AND THEN IT WAS DEFEATED AGAIN, ONE FIELD ACROSS (CD-PL-F59, increment 3b). Deny by default
  # closed `hosts` and left the adjacent `pending` field carrying only the broker vocabulary — the
  # layer CD-ASR-F04 had already proved insufficient. Measured by the Project Lead: `api.ibkr.com`
  # in cd-collectors' `pending` was refused, `198.51.100.24` IN THE SAME SLOT PASSED at exit 0.
  # CD-EGRESS-007 is now layer 1 over `pending`, and it is deliberately NOT the registry: a pending
  # entry exists BECAUSE the host is unknown, so requiring it to name a registered destination is
  # either unsatisfiable or forces a seat to invent a hostname this project recorded as owed
  # (CD-RULE-003). A HOST IS THE ONE THING A PENDING ENTRY CANNOT CARRY, so the entry's key set is
  # closed by EQUALITY to {declared_in, blocked_by} and there is no field left that could hold one.
  #
  # THIS CHECK HAS A DECLARED LIMIT, in NINE numbered boundaries (1..8, 8b and 9), stated
  # identically in the header of tools/register/check_egress_no_broker.py, in the execution
  # contract, and below (CD-RULE-004). Every hand-off in it names a layer that was MEASURED, or
  # says "NOT PROVED TO BE CARRIED ANYWHERE" (CD-RULE-006). Boundary 4 was CORRECTED at increment
  # 3b: it named a compensating layer 1 that did not exist for `pending`, which is the defect
  # CD-RULE-006 forbids. Boundary 8 was CLOSED and replaced by 8b under CD-DISPATCH-WO2R-READER.
  # BOUNDARY 9 WAS ADDED at increment 6 under CD-D-062 — the shared reader's silent flattening of
  # a mapping nested beneath a sequence item's INLINE key. It is DECLARED, DELIBERATELY NOT FIXED,
  # and dispatched at WO-3 bound together with the V27 re-measurement.
  - test_id: CD-RT-012-EGRESS-NO-BROKER
    scope: CLASS
    execute: python3 tools/register/check_egress_no_broker.py --root .
    execution_contract: contracts/execution/CD-RT-012-EGRESS-NO-BROKER.md
    negative_control:
      violation: >
        ANY entry in ANY service's egress allowlist that is not a registered destination for that
        service; any destination registered in deploy/egress-destinations.yaml whose host or
        operator is a broker, exchange or order-routing operator; any registered destination that
        is not a well-formed, attributable DNS hostname, or that is registered for cd-engine,
        cd-public, cd-private or cd-store — the four services BLUEPRINT §13 requires to have no
        egress at all; any unknown key in an `x-egress` block or in a registry entry; ANY
        `pending` THAT IS NOT A LIST, AND ANY PENDING ENTRY THAT IS NOT A MAPPING DECLARING
        EXACTLY `declared_in` AND `blocked_by` AS NON-EMPTY SCALARS (CD-EGRESS-007); and any
        egress at all granted to those four services by policy, by hosts or by attachment to a
        network that is not `internal: true`. The class is DENY BY DEFAULT: the violation is an
        entry NOBODY DECLARED, not an entry that matched something. In `hosts` that means an
        entry nobody REGISTERED; in `pending` it means an entry that is not the declared SHAPE,
        because a pending entry records that a host is NOT KNOWN, so there is nothing to
        register and no field in it that may hold one.
        THIS CHECK HAS A DECLARED LIMIT, stated in full in the header of
        tools/register/check_egress_no_broker.py, in the execution contract and here, in EIGHT
        boundaries: (1) it is a DECLARATION and stops no packet — Compose has no per-host egress
        primitive and the enforcement lane is owed at WO-3; what makes egress structurally absent
        today is the topology, measured by CD-EGRESS-001 here and by
        tests/test_deploy_container_set.py::test_both_networks_are_internal. (2) A registered
        destination is a HUMAN CLAIM and a false one — an innocent-looking hostname that in fact
        resolves to a brokerage edge — is NOT PROVED TO BE CARRIED ANYWHERE, because detecting it
        needs the network. What the structure buys is attribution and review, not detection.
        (3) The `purpose` prose is not judged; the `operator` field is, which is measured to carry
        the archetypal case. (4) The vocabulary and denylist are a FLOOR, not an oracle, AND LAYER
        1 IS A DIFFERENT RULE IN EACH FIELD: a brokerage on nobody's list passes layer 2
        everywhere, and what stops it is CD-EGRESS-004 in `hosts` (measured, E05), CD-EGRESS-006
        in the registry (measured, V20), CD-EGRESS-007 in `pending` (measured, PL-S3a and PL-S3c)
        — and in `pending` PROSE, NOTHING; see boundary 7. CORRECTED at increment 3b: as first
        written this boundary named no field and asserted a layer-1 compensation that did not
        exist for `pending`, which is CD-PL-F59 and the defect CD-RULE-006 forbids. (5) The
        subject is TWO FILES — egress obtained through `extra_hosts`, a Dockerfile `RUN curl`, a
        sidecar, host networking or a runtime flag is outside it, and for `extra_hosts`
        specifically NOT PROVED TO BE CARRIED ANYWHERE (CD-ENG-WO2R-F12, owed at WO-3). (6) It is
        a static read of two files at one commit; a compose override file is outside the subject.
        (7) The PROSE inside a pending entry is not judged for addresses: CD-EGRESS-007 closes the
        SHAPE, so no FIELD can hold a destination, but `blocked_by: "the source will be
        198.51.100.24 once ruled"` passes at exit 0 (measured, V29a). PARTIALLY CARRIED, MEASURED:
        the same sentence naming api.ibkr.com is refused by CD-EGRESS-002 (V29b). For an ADDRESS
        LITERAL in prose, NOT PROVED TO BE CARRIED ANYWHERE — closing it would mean recognising
        which tokens look like endpoints, which is the spelling recognition that IS this defect.
        (8) CLOSED, and replaced by the narrower boundary 8b. This read "a document shape exists
        on which this check DOES NOT TERMINATE": tools/register/_yamlmin.py re-entered a parse
        loop at a cursor that had not moved. Repaired at the reader under
        CD-DISPATCH-WO2R-READER (CD-PL-F61, confirming CD-ENG-WO2R-F14) by making progress a
        property of the loops rather than of the documents they happen to meet. The examples that
        hung — the three lines `top:` / `  - key:` / `      - nested`, and V30 through `pending`
        — now return exit 3 PRECONDITION_NOT_MET naming the line that could not be read.
        CORRECTION, superseding not editing (PBG-CONT-003): the earlier text said the reader was
        shared with ONE other check; it is shared with TWO, check_base_image_digest_pin.py AND
        check_engine_no_witness_reach.py, so THREE declared gate commands returned no verdict on
        the same input, not two. Raised as CD-ENG-READER-F01.
        (8b) A document nested deeper than the interpreter's recursion limit raises
        RecursionError rather than a stated refusal. It TERMINATES — not a hang, not a false
        clean — but it reports a traceback instead of a line number and what could not be read,
        and it exits 1 rather than the 3 this check uses for "I could not read my subject".
        MEASURED EXAMPLE: ~600 levels of block mapping under cd-collectors' `pending`; the exact
        generator is row R08 of variants/WO-2R/MANIFEST.md. Observed exit 1, RecursionError,
        IDENTICALLY before and after the reader repair, on all three checks that share the
        reader. DELIBERATELY NOT REPAIRED: converting it would move this check from exit 1 to
        exit 3 on an input that already has a verdict, which the reader dispatch puts out of
        bounds and instructs the seat to report rather than take. Raised as CD-ENG-READER-F02.
        (9) THE SHARED READER SILENTLY FLATTENS A MAPPING NESTED BENEATH A SEQUENCE ITEM'S INLINE
        KEY — a QUIET WRONG PARSE, DECLARED at increment 6 under CD-D-062 and DELIBERATELY NOT
        FIXED. EXECUTABLE EXAMPLE (PL-X10a): `top:` / `  - key:` / `      sub: 1` reads as
        {'top': [{'key': None, 'sub': '1'}]} where the correct reading is
        {'top': [{'key': {'sub': 1}}]}; the nested mapping is flattened into the sequence item and
        the inline key reads ABSENT. MEASURED by this seat at 253c38b and byte-identical at
        f22d120 — PRE-EXISTING, neither introduced nor changed by the reader repair
        (CD-ENG-READER-F05/F08, re-raised from CD-ENG-WO2R-F15). It REACHES this check, because
        both of its subjects contain sequences of mappings: `x-egress.pending` in compose and
        `destinations` in the registry. WHAT CARRIES IT (CD-RULE-006, all RUN not reasoned): the
        Project Lead's three attempts to weaponise it into a FALSE CLEAN were ALL REFUSED —
        PL-X12a exit 1 with CD-EGRESS-007 key set AND CD-EGRESS-002 broker host; PL-X12b exit 1
        with CD-EGRESS-007 non-empty scalar; PL-X12c exit 1 with CD-EGRESS-007 key set; the other
