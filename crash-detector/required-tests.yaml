# Crash Detector — Required Test Register
# =============================================================================================
# REQUIRED-TEST-REGISTER-CONTRACT-v1, as implemented by pbg/tools/pbg/required_tests.py.
#
# THIS FILE CARRIES OBLIGATIONS. IT CARRIES NO RESULTS.
# There is no status field here and there may never be one: the validator REFUSES any register
# that grades itself (contract §4 check 5) and COMPUTES every status from the PID, this file and
# append-only run records. If you want to know whether a criterion is satisfied, run
#
#     PYTHONPATH=<pbg>/tools python3 -B -m pbg.cli required-tests verify --register required-tests.yaml
#
# and read what it computes. Anything written here about how a test behaves is a DECLARATION of
# what must be true, not a claim that it is.
#
# POPULATION IS NOT MINE TO SET. Every criterion below is derived from PID §6 and only from
# PID §6 — all sixteen of them, CD-AC-001 through CD-AC-016, whatever work order delivers them
# (BLUEPRINT §14: "every row above becomes a register entry"). The validator derives the same
# census from the PID text independently and compares; a register that quietly dropped the
# criteria it could not yet satisfy would be marking its own paper.
#
# ELEVEN OF THE SIXTEEN ARE NOT DELIVERED IN WO-2. They are here with the test that will
# evidence them and an execution contract that says plainly which work order owes them and that
# they are NOT YET EVIDENCED. The validator will compute NOT_EVALUATED or UNDECIDABLE for every
# one of them. THAT IS THE HONEST ANSWER at this baseline and it is not a defect to be dressed
# up — the gate stays shut, which is exactly what a gate is for.
#
# latest_admitted_run IS NULL, AND THIS SEAT CANNOT CHANGE THAT. The Engineer does not admit its
# own evidence (PBG-SOD-001, non-waivable). An independent Assurance seat produces the run record
# and someone other than its author admits it.
#
# EVERY WO-2 TEST NAMES negative_control.evidence_ref: RTR-WO2-0001 — the run record the
# INDEPENDENT Assurance seat will produce. It does not exist yet. That is correct and deliberate:
# this seat declares WHICH RUN MUST EVIDENCE ITS GUARD and cannot supply that run itself. Until it
# exists the validator computes UNDECIDABLE, never PASS.
#
# THE DECLARED COMMANDS ARE VERBATIM. Each `execute` is the exact line an auditor types with the
# working directory set to the root of a subject tree THE AUDITOR EXTRACTED ITSELF —
# `git archive <sha> | tar -x -C <tmpdir>`. No path fixing, no editing, no wrapper. There is no
# run-everything harness in this repository and there may not be one: an auditor verifying through
# a harness the project wrote is verifying the harness (PBG-ASSURE-001).
#
# TWO DELIVERED GUARDS ARE DELIBERATELY ABSENT FROM THIS REGISTER: CD-BASE-IMAGE-DIGEST-PIN and
# CD-BUILD-CONTEXT-RESTRICTED (tools/register/check_base_image_digest_pin.py and
# check_dockerignore.py). They are real and they run clean, but neither derives from any criterion
# in PID §6, and inventing a criterion so a guard has somewhere to live would be writing product
# requirements from the Engineer's seat (PBG-AUTH-005; and the validator blocks NEW_REQUIREMENT
# for the same reason). They are recorded in the Build Log as guards without a register row, which
# is a disclosure for the Product Owner rather than a gap to paper over.
# =============================================================================================

register_version: 1

