        replacement that quietly narrows what it checks is how a guard becomes a certificate.
        WHAT IS TRUE INSTEAD, BY MEASUREMENT AND NOT BY ASSERTION: the instrument now carries a
        FIELD-ABSENT row and an OFF-VOCABULARY row for every missing-data branch, on every slot,
        on both surfaces, and it FAILS on that tree — arm C7, FAIL — 8 violation(s), all
        CD-CALM-GATE-001. EVERY member of the class above is now a measured arm of
        plants/WO3-INC16B/MANIFEST.md with its violation count and the assertion that caught it,
        run from its own pristine extraction. A member of this class that is not a measured arm
        is a claim, and this row no longer makes one.
        ================================================================================
        The instrument's own CD-CALM-VACUITY-000 assertion fails if the VALUE/calm admitting row,
