# ==================================================================================================
- criterion_id: CD-AC-017
  origin: PID
  obligation: MANDATORY
  criterion: Admission by declared-door provenance.
  acceptance_semantics: >
    PID §6, carried verbatim: plant — hand a judgement path a forged object of exact type that
    never left a declared door -> admission refuses it; genuine article from the declared door ->
    admitted. (RESISTED tier, BLUEPRINT §17 CD-BP-005.)

    AND IT IS NOT DISCHARGED BY THE REFUSAL ALONE. BLUEPRINT §17, as corrected by the Product Owner
    at v0.4.0 and again at v0.4.2, measured the RESISTED tier INSUFFICIENT ON ITS OWN: a value
    forged AFTER admission defeats an admission door at zero cost. WO-3-SCOPE §5.7 carries that as
    an acceptance obligation in terms — "CD-AC-017 IS NOT DONE WHEN THE DOOR REFUSES A FORGERY. It
    is done when the door refuses a forgery AND the admitted value cannot be mutated afterwards."
    BOTH ARMS OR THE CRITERION IS NOT MET. Admission-provenance is DEFENCE-IN-DEPTH AND NOT THE
    PRIMARY; the load-bearing defence is the DETECTED tier carried by CD-AC-018 below.
  pid_relation: DERIVES
  supersedes: []
  superseded_by: null
  tests:
  - test_id: CD-RT-017-ADMISSION-BY-DECLARED-DOOR-PROVENANCE
    scope: CLASS
    execute: PYTHONPATH=src python3 -m pytest tests/test_admission_provenance.py -q
    execution_contract: contracts/execution/CD-RT-017-ADMISSION-BY-DECLARED-DOOR-PROVENANCE.md
    negative_control:
      violation: >
        A judgement path that admits a value whose provenance is not a declared door — an object of
        the exact admitted type, assembled by any route other than the declared construction door
        and accepted because its TYPE checks out — OR an admitted value whose provenance record can
        be rewritten after admission, so that a forgery becomes indistinguishable from the genuine
        article everywhere downstream. THE CLASS COVERS BOTH DIRECTIONS DELIBERATELY: a door that
        refuses the forged object at entry and then permits post-admission mutation of what it
        admitted HAS NOT MET THIS CRITERION, and a check that exercised only the entry arm would be
        measuring one half while reporting the whole — the exact vacuity BLUEPRINT §17 was
        corrected for.
        NOT YET EVIDENCED, AND THAT IS THE POINT OF WRITING IT DOWN. To be planted in WO-3
        INCREMENT 17, which owes the mechanism, the execution contract and both arms. AT THIS SHA
        THERE IS NO DOOR, NO TEST FILE AND NO EXECUTION CONTRACT.
      evidence_ref: RTR-WO3-0001

# ==================================================================================================
# CD-AC-018 — ADDED AT WO-3 INCREMENT 14 BY CD-ENG-WO3-01 (dispatch D4). A REGISTER-ONLY ENTRY.
#
# IT HAS NO PID ROW, AND THAT ABSENCE IS THE RULING RATHER THAN AN OMISSION. PO-DECISIONS-0020
# ruling 1, carried verbatim beneath the PID §6 table: "CD-AC-018 STRENGTHENS CD-AC-004. §6 already
# carries CD-AC-004 — 'witness divergence raises the alarm' — and CD-AC-018 ... belongs as a
# STRENGTHENS relation on CD-AC-004, not as a free-standing requirement; the DETECTED tier is not
# new doctrine, it is CD-AC-004 named at the exit." The ruling also says, in terms, "CD-AC-018
# GAINS NO ROW AND THE ABSENCE IS THE RULING".
#
# MEASURED AT THIS INCREMENT with the instrument's own `derive_pid_census`, against the PID carried
# at D0: `CD-AC-018 in census: False` — CORRECTLY ABSENT — and `CD-AC-004 in census: True`. THE
# SECOND MEASUREMENT IS THE ONE THAT MATTERS: an unresolvable STRENGTHENS target is sent to
# `untraced` and THE ROW IS DROPPED ENTIRELY (required_tests.py:718-721), so a dangling trace would
# have made this row invisible rather than red. CD-AC-004's presence is what makes it resolve.
#
# *** THIS ROW IS NOT YET EVIDENCED. *** The publication-boundary witness panel is owed by WO-3
# INCREMENT 18. NO SOURCE IS REGISTERED AT THIS SHA — so there are no witnesses to diverge from —
# AND THIS SEAT REGISTERED NONE: the source set is HELD FOR THE PRODUCT AUTHORITY
# (PO-DECISIONS-0024 ruling 4, Q25). Not one row, not a placeholder, not a test fixture.
# ==================================================================================================
- criterion_id: CD-AC-018
  origin: PO_RULING
  obligation: MANDATORY
  criterion: Witness divergence is raised at the publication boundary.
  acceptance_semantics: >
    BLUEPRINT §17 CD-BP-005, DETECTED tier: the residual and the catastrophic-blast case, carried
    by witness divergence raised AT PUBLICATION. This is THE LOAD-BEARING DEFENCE of the three-tier
    perimeter, with admission-provenance (CD-AC-017) as defence-in-depth and not as the primary —
    the Product Owner's correction at BLUEPRINT v0.4.2, after the eighth Assurance seat's RED
    proved a two-tier perimeter false.

    IT STRENGTHENS CD-AC-004 AND DOES NOT REPLACE IT. CD-AC-004 requires that divergence RAISES THE
    ALARM; CD-AC-018 fixes WHERE — at the publication boundary, the last point before a number is
    exposed, so that a value forged anywhere upstream of publication is still caught on the way
    out. CD-AC-004's own discipline binds unchanged and is the thing most easily lost here:
    DIVERGENCE IS AN ALARM, NEVER AN ADJUSTMENT. In a divergence cycle the published dial numbers
    must be BYTE-IDENTICAL to what they would have been with no witness data at all — checkable,
    because the computing process holds no grant on the witness schema.
  pid_relation: STRENGTHENS CD-AC-004
  supersedes: []
  superseded_by: null
  tests:
  - test_id: CD-RT-018-PUBLICATION-BOUNDARY-RAISES-DIVERGENCE
    scope: CLASS
    execute: PYTHONPATH=src python3 -m pytest tests/test_publication_divergence.py -q
    execution_contract: contracts/execution/CD-RT-018-PUBLICATION-BOUNDARY-RAISES-DIVERGENCE.md
    negative_control:
      violation: >
        A value reaching the publication surface while a witness disagrees with it and no
        divergence is raised — the witness panel unread at the boundary, the comparison performed
        upstream only and trusted downstream, a witness that is absent being treated as a witness
        that AGREES, or the divergence recorded somewhere that never reaches the exit. THE CLASS
        ALSO INCLUDES THE OPPOSITE FAILURE, WHICH IS THE MORE TEMPTING ONE: a divergence that is
        raised AND THEN USED TO ADJUST THE PUBLISHED NUMBER. A cycle in which divergence changes
        the magnitude by so much as one bit violates CD-AC-004 and this criterion together, and a
        check that only proved the alarm fires would not see it.
        AND `Unavailable` MUST NEVER ROUTE TO `Agrees` (CD-AC-005), by the explicit path or the
        implicit one — an absent witness that silently satisfies the comparison is this criterion
        defeated without any alarm being suppressed.
        NOT YET EVIDENCED. To be planted in WO-3 INCREMENT 18, which owes the publication boundary,
        the witness panel at it, the execution contract and both arms. AT THIS SHA THERE IS NO
        PUBLICATION LAYER, NO REGISTERED SOURCE, NO TEST FILE AND NO EXECUTION CONTRACT.
      evidence_ref: RTR-WO3-0001
