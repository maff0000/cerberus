criteria:

# --------------------------------------------------------------------------------------------- #
# DELIVERED IN WO-2 — the five doctrine-bearing criteria (BLUEPRINT §13, §15)
# --------------------------------------------------------------------------------------------- #

- criterion_id: CD-AC-001
  origin: PID
  obligation: MANDATORY
  criterion: Missing or stale input never renders as calm.
  acceptance_semantics: >
    PID §6: plant — kill a feed, and the affected dial shows UNKNOWN or DEGRADED within the
    assurance latency budget, NEVER a calm reading. The proposition has two halves and both are
    required: absence must have a name in the type system, and no route may exist by which
    absence becomes a number. A dial that reads 0.0 because a source did not answer is the exact
    failure PID §3.2 forbids — a stale dial saying calm — and it is worse than no dial, because
    somebody trusts it.
  pid_relation: DERIVES
  supersedes: []
  superseded_by: null
  tests:
  # DECLARED LIMIT — CD-RT-001-AST-NO-NUMERIC-DEFAULT. Required by CD-RULE-004, drawn in the
  # pattern of CD-RT-012-NO-EXECUTION-INTERFACE (CD-D-014/CD-D-015), which an independent
  # auditor examined and judged honestly and conservatively drawn.
  #
  # WHY THIS ENTRY CHANGED. At the WO-2 gate this test declared `scope: CLASS` while the check
  # enumerated four spellings of a numeric default. CD-ASR-F03 walked past all four with a
  # module-level constant. The check now carries RULE F, which inverts the question: instead of
  # enumerating ways a number can arrive, it enumerates the ONE way a dial magnitude is
  # PERMITTED to arrive — from the declared contribution model applied to present inputs — and
  # reports every other provenance, including ones nobody has thought of. RULE F DENIES BY
  # DEFAULT, so a route the check's author never imagined is a violation for being
  # unrecognised rather than a silence. That is why `scope: CLASS` is retained, and the residue
  # is written down here rather than left to be discovered.
  #
  # THIS CHECK IS A STATIC READ OF SOURCE TEXT AT ONE COMMIT, and CD-AC-001's proposition is a
  # RUNTIME property. Where a boundary below says the runtime layer carries it, that layer is
  # the sealed and slotted Reading types in src/crash_detector/dials/reading.py plus the
  # absence post-condition `refuse_a_number_without_its_inputs` in
  # src/crash_detector/engine/evaluate.py, and it is evidenced by the SIBLING test
  # CD-RT-001-ABSENCE-RENDERS-UNKNOWN. In summary, this check DOES NOT catch:
  #
  #   1. a construction it cannot see as a construction. RULE F recognises a value-bearing
  #      reading by the terminal name of its callee (`Value`, `Degraded`), resolved through the
  #      module's import aliases. MEASURED EXAMPLE, which exits 0 here:
  #        maker = getattr(sys.modules["crash_detector.dials.reading"], "Value")
  #        return maker(value=score, as_of_utc=now_utc, inputs_used=("carried",))
  #      THE RUNTIME LAYER CARRIES THIS: the post-condition inspects the returned object's TYPE
  #      and never reads the expression that produced it, so the same plant raises
  #      AbsenceYieldedAValue when the branch executes.
  #   2. tracing beyond one scope chain. A magnitude computed inside a helper is reported as
  #      UNRECOGNISED rather than followed — deny by default, so it is not an escape, but a
  #      LEGITIMATE future helper must be declared in DECLARED_MAGNITUDE_SOURCES or it is
  #      reported. MEASURED EXAMPLE: `score = _blend(payloads)` is reported.
  #   3. anything outside the two declared tiers. MEASURED EXAMPLE: the same plant in
  #      src/crash_detector/publication/summary.py exits 0 here. The declared set REFUSES if a
  #      declared path is missing, so it cannot be narrowed by deleting a module, but it does
  #      not grow on its own.
  #   4. class A (nullable-number annotations) outside the dial path — printed as a NOTE on
  #      every run, because BLUEPRINT §7 and §13 scope that ban to the dial path (CD-ENG-F26).
  #   5. a magnitude legitimately computed but WRONG. RULE F asks where a number came from,
  #      never whether it is right. scores.py deliberately imposes no range (CD-D-005 owed).
  #   6. runtime, configuration and data. A zero arriving from a config file, an environment
  #      variable or a database row is not in the source text. THE RUNTIME LAYER CARRIES THIS.
  #   7. A CONSUMER THAT **ANSWERS** AN ABSENCE WITH A NUMBER. Boundaries 1, 2, 3, 5 and 6 are
  #      every one of them about a value-bearing reading being CONSTRUCTED. NONE OF THEM
  #      RESERVED THE CONSUMPTION ROUTE, and that enumeration was MEASURED INCOMPLETE by
  #      CD-ASR-WO2R-F03. MEASURED EXAMPLE, which exits 0 here — ASR2-001-A verbatim, in the
  #      ADJACENT tier this check declares it scans:
  #        def surface_scalar(reading):
  #            return fold(reading, on_value=lambda s: s.value,
  #                        on_degraded=lambda s: s.value, on_unknown=lambda s: 0.0)
  #      It uses none of the enumerated spellings and never constructs a value-bearing
  #      reading, so RULE F has nothing to look at. `fold` guarantees a caller cannot FORGET
  #      Unknown; it never guaranteed a caller cannot ANSWER Unknown with a number.
  #      WHO CARRIES IT — MEASURED, AND ONLY IN PART (CD-RULE-006):
  #      src/crash_detector/serving/dial_presentation.py carries the PRESENTATION half.
  #      `Shown` admits only a DialMagnitude of its own dial by exact type, so that 0.0
  #      cannot be presented as a dial (DialPresentationRefused, measured on a pristine
  #      extraction with ASR2-001-A present), and `present_dial` performs the elimination
  #      itself so no surface writes its own on_unknown. Evidenced by
  #      CD-RT-001-ABSENCE-RENDERS-UNKNOWN, whose declared command GREW by
  #      tests/test_dial_presentation.py in the same increment; nothing was removed from it.
  #      NOT CARRIED: a module that computes a number for an absence and renders it ITSELF
  #      without coming through the presentation type. NOT PROVED TO BE CARRIED ANYWHERE —
  #      the rendering LAYER is WO-3 and there is nothing in WO-2 to refuse it. ASR2-001-A's
  #      surface_scalar still returns 0.0, asserted rather than hidden by
  #      test_asr2_001_a_still_computes_its_number_and_that_is_declared.
  #      `fold` was DELIBERATELY NOT given a guard: banning a numeric return from on_unknown
  #      is a ban on a spelling (on_unknown=lambda u: Box(0.0) walks past it) and would
  #      forbid a legitimate numeric answer ABOUT an absence, such as a count of missing
  #      inputs.
  #
  # FOR THE AUDITOR. Do not read a clean run of this check as proof that no route from absence
  # to a number exists. A variant landing beyond a boundary above is a finding against THIS
  # DECLARATION — was the limit honestly drawn? — and the pair to weigh is this check together
  # with CD-RT-001-ABSENCE-RENDERS-UNKNOWN, which is where the runtime property is evidenced.
  - test_id: CD-RT-001-AST-NO-NUMERIC-DEFAULT
    scope: CLASS
    execute: python3 tools/register/check_no_numeric_default.py --root .
    execution_contract: contracts/execution/CD-RT-001-AST-NO-NUMERIC-DEFAULT.md
    negative_control:
      violation: >
        A dial magnitude whose provenance is not the declared contribution model applied to
        inputs that were present. The class is WIDER than the four spellings this check
        enumerated at the WO-2 gate — a `float | None` or `Optional[float]` annotation, a
        `.get(key, <numeric literal>)`, an `or 0`, a bare `except` returning a number — because
        CD-ASR-F03 escaped all four with a module-level constant. RULE F reports any Value or
        Degraded construction on the scanned path whose magnitude traces to a literal, a
        module-level constant, a parameter, a configuration attribute, a lookup, a previous
        reading, an unrecognised helper call, or anything else it cannot name as declared.
        Unrecognised is a VIOLATION, not a silence, so a plant does not need to use a route the
        check anticipated.
        THIS CHECK HAS A DECLARED LIMIT, stated in full in the header of
        tools/register/check_no_numeric_default.py, in the comment above this entry, and in the
        execution contract, each boundary with an example an auditor can execute. It does NOT
        catch: a constructor obtained dynamically; a magnitude laundered through an undeclared
        helper (reported, not followed); anything outside the two declared tiers; class A
        outside the dial path; a legitimately computed but wrong magnitude; anything about
        runtime, configuration or data; OR A CONSUMER THAT ANSWERS AN ABSENCE WITH A NUMBER
        RATHER THAN CONSTRUCTING ONE (boundary 7, added at WO-2R2 increment 1c closing
        CD-ASR-WO2R-F03 — the first six boundaries were all about CONSTRUCTION and that
        enumeration was measured INCOMPLETE). It is ONE OF TWO guards on CD-AC-001 and never a sole
        guard: the runtime property is carried by the sealed Reading types and the absence
        post-condition, and evidenced by CD-RT-001-ABSENCE-RENDERS-UNKNOWN.
      evidence_ref: RTR-WO2-0001
  # DECLARED LIMIT — CD-RT-001-ABSENCE-RENDERS-UNKNOWN. Required by CD-RULE-004.
  #
  # This is the RUNTIME arm, and after CD-ASR-F02 it is the arm that carries CD-AC-001's
  # "structurally incapable" half. ITS DECLARED COMMAND GREW AT WO-2R2 INCREMENT 1c by
  # tests/test_dial_presentation.py, closing CD-ASR-WO2R-F03: this arm evidenced that absence
  # could not be CONSTRUCTED as a number and NOT that a number a consumer CHOSE for an absence
  # could not be PRESENTED as a dial, and the criterion's words are about rendering. Nothing
  # was removed from the command and tests/test_reading.py and tests/test_evaluate.py are
  # unchanged in what they assert.
  #
  # AND IT GREW AGAIN AT WO-3 INCREMENT 16B, BY tests/test_detail_level.py, IN THE SAME FORM AND
  # FOR THE SAME REASON. NOTHING WAS REMOVED FROM THE COMMAND AND NOTHING WAS REORDERED; the
  # three files already named are unchanged in what they assert. WHY: that file holds NINE
  # assertions of PID §3.2 — "missing data must never render as calm" — and MEASURED at
  # CD-DISPATCH-INC16B-ENGINEER §2, THE REGISTER RAN NONE OF THEM. On a tree with the whole of
  # 16A-FIX's constitutional narrowing reverted, all fourteen register instruments still exited
  # as they do clean, and the only failures anywhere in `pytest tests/ -q` were those nine. The
  # register declared 29 `execute:` lines, 14 of them naming pytest files, and this file was not
  # one of the 14. A memorial nobody reads. WHY IT BELONGS ON THIS ENTRY AND NOT ANOTHER: this is
  # the entry that already carries the RENDERING half of CD-AC-001 — that is exactly what the
  # WO-2R2 growth above was for, and "renders as calm" is the same clause as "renders as a
  # number" one level up: the level a dial is drawn at rather than the number in it. The scope
  # stays CLASS and the entry's claim is UNCHANGED AND NOT WIDENED by this growth.
  # *** THIS GROWTH IS THE SECONDARY DELIVERABLE AND IS NOT OFFERED AS THE GUARD. *** It stops
  # the memorial being unread; it does not make the guarantee live, because a pytest file is
  # still a file the gate happens to name. The LIVE instrument the PO's ruling 9 required is the
  # SIBLING ENTRY CD-RT-001-MISSING-DATA-NEVER-CALM below, which drives
  # refuse_unless_publishable itself. Do not read this line as the discharge of ruling 9.
  #
  # The residue that remains — a module that renders its own
  # number for an absence, with no renderer in WO-2 to refuse it — is boundary 7 of the
  # CD-RT-001-AST-NO-NUMERIC-DEFAULT entry above and is NOT PROVED TO BE CARRIED ANYWHERE. The three Reading constructors now have a DECLARED attribute
  # surface asserted by EQUALITY (not by the absence of a blacklist — that blacklist is what
  # E03 walked past), are slotted against instance attribute injection, are closed against
  # subclassing, and are re-verified at every consumer boundary. Separately, the per-dial
  # evaluator carries a post-condition that refuses a value-bearing reading from a dial whose
  # required inputs were not all present, whatever the number is and wherever it came from.
  #
  # THE ONE RESIDUE, DECLARED RATHER THAN DENIED. `type.__setattr__` installs a class attribute
  # without going through a metaclass, and CPython offers no way to prevent that. MEASURED
  # EXAMPLE, which an auditor can execute:
  #   type.__setattr__(Unknown, "magnitude", property(lambda self: 0.0))
  #   Unknown(reason="R", since_utc=t, missing_inputs=()).magnitude   ->   0.0
  # What IS closed is every route by which such a number reaches a consumer: fold, is_value and
  # DialSet each re-verify the surface of the reading's class and raise ReadingSurfaceViolated.
  # So the claim this test evidences is: absence cannot acquire a numeric member through
  # construction, assignment, inheritance or definition, and a class mutated after import is
  # refused wherever a reading of it would be used. It is NOT the claim that a process which
  # rewrites class objects at runtime cannot read a number back out of one it mutated. Do not
  # read a clean run as proof of the stronger claim.
  - test_id: CD-RT-001-ABSENCE-RENDERS-UNKNOWN
    scope: CLASS
    execute: PYTHONPATH=src python3 -m pytest tests/test_reading.py tests/test_evaluate.py tests/test_dial_presentation.py tests/test_detail_level.py -q
    execution_contract: contracts/execution/CD-RT-001-ABSENCE-RENDERS-UNKNOWN.md
    negative_control:
      violation: >
        Absence made to yield a number at runtime, by ANY route, or a reading that carries a
        value produced by a dial that did not get its inputs. The class includes, and is not
        limited to: any member added to a Reading constructor's declared attribute surface —
        a property, a classvar, a method, a `__getattr__`, a slot, a dunder, numeric or not,
        added in the class body, by a decorator, by class assignment or by a metaclass; an
        undeclared instance attribute set through `object.__setattr__`; a subclass of a Reading
        constructor carrying a numeric member; and `evaluate()` returning Value or Degraded for
        a dial whose required inputs were absent, stale, future-dated, unregistered or lacking
        a contribution model — whether the number is a literal, a module-level constant, a
        configuration default, a previous magnitude carried across a gap, or a value read from
        the store. With the WO-2 empty source registry both dials must read Unknown; a plant
        that makes either read a value must fail this test.
        SINCE WO-2R2 INCREMENT 1c the class also includes THE CONSUMPTION HALF, which is what
        CD-ASR-WO2R-F03 walked through: a number a consumer CHOSE for an Unknown presented as
        a dial. `Shown` admits only a DialMagnitude of its own dial by exact type, `NotShown`
        carries no numeric field at all, and `present_dial` performs the elimination itself so
        no surface writes its own `on_unknown`. A plant that makes an absence PRESENTABLE as a
        number must fail this test.
        DECLARED LIMIT: post-import class mutation through `type.__setattr__` installs the
        attribute and is refused at every consumer boundary rather than prevented. AND: a
        module that computes a number for an absence and renders it ITSELF, without coming
        through the presentation type, is NOT refused and is NOT PROVED TO BE CARRIED
        ANYWHERE — the rendering LAYER is WO-3. ASR2-001-A's `surface_scalar` still returns
        0.0 and a declared test asserts that it does, rather than hiding it. The measured
        example is in the comment above this entry and in the header of
        src/crash_detector/dials/reading.py.
        ================================================================================
        DECLARED LIMITS 10 AND 11 — NEW AT WO-2R3 INCREMENT 8, AND THIS IS ONE OF THEIR THREE
        CD-RULE-004 PLACES (the other two are the header of
        src/crash_detector/engine/evaluate.py and
        contracts/execution/CD-RT-001-ABSENCE-RENDERS-UNKNOWN.md). PO-DECISIONS-0015 ruling 1
        made `guarded` a DOOR and REDESIGNED this control; these are the residues the redesign
        leaves, and they are numbered into the SAME 1..11 sequence that runs across
        tools/register/check_judgement_path_doors.py (1-4, 7-9) and
        src/crash_detector/admission.py (5-6), because they are one row's limits and not
        three lists.
        LIMIT 10 — THE BODY CAN BE RECONSTITUTED FROM ITS CODE OBJECT. Property (a) is met as
        the ruling states it: after the decorator returns, NO UNDECORATED EVALUATOR OBJECT
        EXISTS — every closure cell holds data, `__wrapped__` is never created, and the walk
        across `__closure__`, `__wrapped__`, `__globals__` and the module namespace finds
        nothing callable. THAT IS NOT THE CLAIM THAT THE `__closure__` REACH IS CLOSED.
        Anything that can read the cells can write
        `types.FunctionType(code, globals)(spec, usable, now, None)` and reach the judgement
        with neither the establishment nor the post-condition applied. EXECUTABLE EXAMPLE AND
        CARRIER MEASURED, and it asserts the residue TRUE so this text cannot go stale in the
        reassuring direction: tests/test_the_absence_door.py::
        test_the_reconstitution_residue_is_real_and_is_declared_limit_10. What changed is the
        COST — construct a callable rather than read one out of a cell — and nothing else.
        CARRIER FOR PREVENTING THE RECONSTITUTION: NOT PROVED TO BE CARRIED ANYWHERE, and
        CPython offers no way to prevent it (the same sentence admission.py's DECLARED LIMIT
        6 (a) carries about the closure reach in general).
        LIMIT 11 — THE DERIVATION DROPS A GENERIC'S SUBSCRIPT. `usable: dict[str, OK]` derives
        to "exactly a dict" and says nothing about the keys or the values. EXECUTABLE EXAMPLE:
        `_evaluate_dial(spec, {"src.a": object()}, now)` passes this door. CARRIER MEASURED
        one level up: `_latest_usable_ok` admits an outcome only when `type(outcome) is OK`
        and builds the only `usable` any product caller supplies. FOR A DIRECT CALLER
        SUPPLYING ITS OWN dict: NOT PROVED TO BE CARRIED ANYWHERE — the post-condition
        re-derives from `spec` and from the KEYS of `usable` only. AND THE ANNOTATION CHANGE
        THIS SITS ON IS DECLARED (CD-PL-F109): `Mapping[str, OK]` -> `dict[str, OK]` is NOT a
        narrowing of what the product accepts. MEASURED, two arms, both trees: at the base
        commit a `collections.abc.Mapping` that is not a `dict` was ALREADY refused with
        NotAdmitted by `refuse_a_number_without_its_inputs`, whose @admits declared
        `usable=dict` and fired on every call. The accepted set is identical; only the point
        of refusal moves, from after the body has run to before it binds.
        ================================================================================
        DECLARED LIMIT 12 — THIS COMMAND IS NAME-COUPLED TO THE CONTRACT'S $defs, BY DESIGN AND
        NOT BY ACCIDENT. NEW AT WO-3 INCREMENT 16B-FIX, ruled by PROJECT_LEAD_SEAT_02 on
        CD-ASR-WO3-05 F6.
        *** THIS LIMIT IS STATED IN ONE PLACE AND CD-RULE-004 WANTS THREE. DECLARED SHORTFALL,
        NOT AN OVERSIGHT, AND IT IS RAISED AS A FINDING RATHER THAN QUIETLY LIVED WITH. *** The
        natural other two places are contracts/execution/CD-RT-001-ABSENCE-RENDERS-UNKNOWN.md and
        the header of tests/test_detail_level.py. NEITHER IS IN CD-ENG-WO3-06's WRITABLE SCOPE:
        the dispatch's §1 grants this file's CD-AC-001 block only, and tests/** is explicitly
        PROTECTED by the very ruling this limit records ("DO NOT EDIT THE TESTS"). An Engineer
        does not widen scope on its own initiative (PBG-GIT-004), so the paragraph stands here
