  - test_id: CD-RT-001-MISSING-DATA-NEVER-CALM
    scope: CLASS
    execute: python3 tools/register/check_missing_data_never_calm.py --root .
    execution_contract: contracts/execution/CD-RT-001-MISSING-DATA-NEVER-CALM.md
    negative_control:
      violation: >
        An envelope carrying detail_level "calm" on a dial in the UNKNOWN or DEGRADED state
        ADMITTED by refuse_unless_publishable on either surface, by ANY route. PID §3.2 is
        constitutional — "Missing data must never render as calm" — and with zero registered
        sources every dial reads UNKNOWN, so this is not an edge case: it is the only state
        this product can currently publish. The class includes, and is not limited to: either
        $ref on either contract's dial_reading_degraded or dial_reading_unknown branch restored
        to #/$defs/detail_level, INCLUDING ONLY ONE BRANCH ON ONE SURFACE; "calm" added back
        into the #/$defs/absent_data_detail_level enum, so the $ref target keeps its name and
        loses its meaning; the branch detail_level requirement dropped so that the parent
        dial_reading's full-vocabulary property is what applies; and any change to
        refuse_unless_publishable that stops the closed schema being applied to the candidate.
        *** AND THE VACUOUS DIRECTION IS EQUALLY A VIOLATION OF THIS ROW, WHICH IS THE HALF
