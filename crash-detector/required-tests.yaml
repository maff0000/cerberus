  criterion: Witnesses are side-by-side, never ingredients.
  acceptance_semantics: >
    PID §6: the score computed with witnesses unreachable is BYTE-IDENTICAL; remove the witness
    feeds and the dials are unchanged while the witness panel shows WITNESS UNAVAILABLE. The
    structure carrying it is stated in BLUEPRINT §13 — cd_engine holds NO GRANT OF ANY KIND on
    witness.*, the pipelines and containers are separate, and composition happens only at the
    serving layer. Two tests, because the code graph and the database catalogue are different
    facts: a GRANT that was written and a GRANT that is held are not the same thing, and where
    they disagree the catalogue wins.
  pid_relation: DERIVES
  supersedes: []
  superseded_by: null
  tests:
  # THIS CHECK WAS DEFEATED AND THE REPAIR IS STRUCTURAL (CD-ASR-F05, increment 4). The auditor
  # appended `from crash_detector.witness.panel import Agrees` to deploy/entrypoints/cd_engine.py —
  # THE MODULE THAT IS THE ENGINE CONTAINER'S PROCESS — and the check exited 0. The defect was a
  # MISMATCH OF SUBJECTS, not a missed spelling: the guard's subject was the engine PACKAGE, rooted
