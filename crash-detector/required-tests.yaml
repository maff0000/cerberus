- criterion_id: CD-AC-002
  origin: PID
  obligation: MANDATORY
  criterion: The two dials are never blended.
  acceptance_semantics: >
    PID §6: no code path combines them into one number, and a planted blend fails the register.

    THIS TEXT WAS REWRITTEN AT WO-2R, CLOSING CD-ASR-F01 (HIGH). It used to say the criterion was
    "enforced at three independent layers" and that "a blend that slips past any one layer must
    still fail the other two". THAT SPECIFIC CLAIM WAS REFUTED BY EXECUTION: an independent
    auditor produced two working blends that passed ALL THREE declared layers simultaneously and
    each returned 0.5 from equity 0.9 and monetary 0.1. It is not restated here, and the entries
    below claim only what their layers deliver (CD-RULE-004).

    THE TRACE WAS RESTRUCTURED AT WO-2R3 INCREMENT 4, AS BP-AMENDMENT-0001 §F.3 REQUIRES:
    "CD-AC-002's trace changes from three refusals (type / AST / schema) to FOUR, THE FIRST
    STRUCTURAL: no door, plus the three that already stand." Refusal 1 below is that first,
    structural one and it is NEW HERE; what were layers 1..5 are now 2..6, renumbered and
    otherwise unaltered in what they claim. The amendment's FOUR are this entry's 1 (the
    absent door), 2 (the type), 6 (the AST scan) and 5 (the closed schema); this register
    enumerates the same ground more finely because it also carries the two layers WO-2R and
    WO-2R2 added — 3 (the re-entry) and 4 (the publication boundary) — which post-date the
    Blueprint's three-refusal sentence.

    WHAT THE LAYERS DELIVER NOW, each named with what it does NOT do.

    1 THE ABSENT DOOR, AND IT IS THE FIRST BECAUSE IT IS THE ONLY ONE THAT IS NOT A CHECK.
    Every other refusal below is something the system DOES when a value arrives. This one is
    the absence of a place for the value to arrive AT. BP-AMENDMENT-0001 §C (in force)
    deleted `ContributionModel` (the Protocol) and `CONTRIBUTION_MODELS` (the dict), and
    `DialSpec.contribution_model` — the field that held a caller's object — DOES NOT EXIST.
    The line ASR3-F02 published a laundered number through,
    `spec.contribution_model.compute(payloads)`, cannot be written: there is no attribute to
    name. A dial names a model with `model_ref: ModelId | None`, A NAME resolved by the
    engine against a ModelRegistry that is a required field of the ConfigSnapshot with no
    default, and an object is not a name. THE CROSS-DIAL MECHANISM IS CLOSED BY THE SHAPE OF
    THE DATA: ASR3-F02 was ONE STATEFUL OBJECT PLACED IN BOTH DialSpecs, which saw the equity
    payloads on the first call and the monetary payloads on the second and blended them in
    its own memory while every downstream layer stamped the result with honest single-dial
    provenance. After §C there is no object to place in both specs; ModelSpec.dial_id binds a
    model to ONE dial and resolving it for the other is refused AT SNAPSHOT CONSTRUCTION; and
    the executor, engine.mapping.compute, is handed one dial's spec and one dial's payloads
    and holds no state between dials or between runs. THE REFUSALS ARE FOUR AND THREE OF THEM
    ARE AT CONSTRUCTION — DialSpec, ModelSpec, ConfigSnapshot, then resolution — and every one
    is demonstrable OVER THE SHIPPED EMPTY_MODEL_REGISTRY. WHAT IT DOES NOT DO: it says
    nothing about a REGISTERED model computing a wrong number. A `MEAN` that is not a mean is
    a defect this architecture does not prevent, the amendment's §E residue says so in terms,
    and CD-D-005 owes the registry rows; concentrating all computation in one executor is
    recorded at BLUEPRINT §17 as CD-BP-002, A RISK AND NOT A WIN. It also says nothing about
    any route that does not go through a DialSpec at all — layers 2 to 6 are what stand
    there.

    2 THE TYPE, and it is the load-bearing one of the runtime layers. A dial magnitude is a NOMINAL, PER-DIAL,
    NON-COERCIBLE value (crash_detector.dials.magnitude.DialMagnitude) carrying which dial it came
    from as DATA. It defines no arithmetic or coercion dunder, so any arithmetic, comparison,
    aggregation, serialisation or reduction over two magnitudes raises TypeError from the
    interpreter — regardless of the route by which the two values were reached, which is what
    makes it a CLASS closure rather than a list of spellings. Cross-dial combination is refused at
    the POINT OF COMBINATION by comparing carried provenance, so the refusal does not depend on
    anyone having read the code. WHAT IT DOES NOT DO: once a number is released for its ONE named
    dial it is an ordinary float, and Python adds floats.

    3 THE RE-ENTRY, added closing CD-PL-F54 and it is now the one that carries the laundering
    class. Layer 2 was closed against the type being ASKED for a number and open to the number
    being READ OFF it: float(repr(m).split("quantity=")[1].rstrip(")")) names no dial, two of those
    add, and the sum re-wrapped as a magnitude of one dial passed every provenance comparison and
    published. A DialMagnitude is now built from a DeclaredQuantity
    (crash_detector.dials.provenance) — a number whose provenance was ESTABLISHED at one of two
    declared doors — and never from a bare float, with set equality between the quantity's dial set
    and the target dial. So a number that has left a magnitude by ANY exit, named or unnamed,
    cannot get back into one. MEASURED: PL-Q4, PL-Q5, PL-Q6, PL-Q9, V16a and V16b all raise
    QuantityProvenanceMissing.

    THIS LAYER WAS MEASURED INCOMPLETE AT THE WO-2R GATE AND WAS EXTENDED AT WO-2R2 INCREMENT 1a
    (CD-ASR-WO2R-F01, HIGH). What it closed was the number being READ OFF a magnitude and RE-WRAPPED.
    What it left open was the number being HANDED TO THE DERIVATION DOOR, which validated the dial
    set it was given — honestly, and computed from real magnitudes — and never validated the VALUE
    beside it. ASR2-002-A reached that door through combine_within_one_dial, a PUBLIC re-exported
    function in no registry, and published an equity 0.5 out of an equity 0.9 and a monetary 0.1
    with check_no_blend PASS on 4873 assertions. SINCE INCREMENT 1a: derived_within_one_dial takes
    NO number and NO dial set — it takes DeclaredQuantity values this module established, refused by
    EXACT TYPE, computes the provenance union itself, and computes the number itself from a CLOSED
    set of NAMED reductions (SameDialReduction); combine_within_one_dial's `using` is a named
    reduction and not a callable; and DeclaredQuantity's own constructor refuses always, because its
    two former parameters were exactly the two things a caller can simply write. MEASURED: ASR2-002-A
    raises UndeclaredReduction, and so does CD-ENG-WO2R2-V01, which is ASR2-002-A with every
    identifier renamed and the door aliased — the rename test, executed rather than asserted.

    WHAT IT DOES NOT DO: the admission door observed_for_dial is a DECLARATION and believes what it
    is told; something has to be the first number. That residue is declared at boundary 7 of the
    CD-RT-002-AST-NO-BLEND entry. For a module OUTSIDE a declared site it is guarded statically, by
    registry, by RULE 4 — A NAME VOCABULARY THAT DOES NOT SURVIVE A RENAME, labelled as such per
    CD-PL-F74/CD-D-073 and never to be read as evidence about the class. For a module INSIDE a
    declared site it is guarded by NOTHING BY THIS LAYER, and that is unchanged.
    WHAT IS CHANGED, AND IT IS A DECLARATION WO-2R3 INVALIDATED RATHER THAN A NEW CLAIM: the
    ROUTE this slot named is CD-ENG-WO2R2-V05 — one stateful ContributionModel given to BOTH
    DialSpecs, publishing a blend as a monetary reading of 0.5 with every declared layer green
    — and BP-AMENDMENT-0001 §C DELETED THE FIELD IT TRAVELLED THROUGH. It is now refused by
    REFUSAL 1 ABOVE, at construction, by the dataclass constructor itself. MEASURED at
    04cdd34 on a pristine extraction with V05 applied,
    `PYTHONPATH=src python3 -B <driver>`:
    `DialSpec(..., contribution_model=model)` -> TypeError: DialSpec.__init__() got an
    unexpected keyword argument 'contribution_model'; the same object offered to the field
    that replaced it, `DialSpec(..., model_ref=model)` -> NotEstablishedOnOwnTerms: "a model
    reference is a NAME, and CarryingModel is not a name"; and `hasattr(spec,
    'contribution_model')` is False. REFUSING LAYER NAMED AND SCOPED (CD-PL-F74): the
    DialSpec CONSTRUCTOR and `own_model_id`, whose scope is what may be placed in a DialSpec
    and NOT what a model computes once one is registered.
    THE RESIDUE THIS SLOT DECLARES IS THEREFORE NARROWER BUT IT HAS NOT GONE: for a module
    INSIDE a declared site, an honest-looking `observed_for_dial` claim over a number the
    module chose is still guarded by nothing at THIS layer, and a REGISTERED model computing
    a wrong number is CD-BP-002 and CD-D-005's, not this layer's. NOT PROVED TO BE CARRIED
    ANYWHERE for that narrower residue.

    4 THE PUBLICATION BOUNDARY. crash_detector.publication.dial_scalar.number_for_dial_slot
    releases a number into a dial slot only from a magnitude whose provenance is exactly that
    slot's dial. WHAT IT DOES NOT DO — AND THIS ENTRY PREVIOUSLY CLAIMED OTHERWISE: it does NOT
    refuse a blend. The Project Lead re-wrapped a 0.4/0.6 blend as a magnitude of the equity dial
    and number_for_dial_slot RETURNED 0.5 (CD-PL-F54). What it refuses is a number arriving without
    a magnitude, or carrying the wrong dial's. It also cannot see a number that reaches a dial slot
    without coming through it.

    5 THE CLOSED PUBLIC ENVELOPE SCHEMA. additionalProperties is false at every level and
    properties is an allowlist, so a third combined field has nowhere to be written. The auditor
    tested this mitigation specifically and confirmed IT HOLDS. WHAT IT DOES NOT DO: it cannot
    tell a blended number assigned to equity_crash.score from an honest one, because that key is
    legitimately a number. Layer 4 refuses a number arriving without its magnitude; NOTHING here
    tells a blended number from an honest one once it is a magnitude, and layer 3 is why one cannot
    become a magnitude.

    6 THE AST SCAN IS A LOCATOR, NOT A CLOSURE, and its entry below carries a DECLARED LIMIT and
    a corrected scope. Its flavour propagation is intra-procedural and its read is purely static;
    both escaped blends walked past it and always will, and so does PL-Q9. Its RULE 4, added at
    CD-PL-F54, denies BY DEFAULT over a declared registry of admission sites and therefore
    recognises nothing about a blend, which is why PL-Q9-with-the-door (V12) fails it.

    RULE 4 WAS DESCRIBED HERE AS "THE EXCEPTION IN KIND RATHER THAN IN STRENGTH". THAT DESCRIPTION
    IS WITHDRAWN, AND SO IS THE SENTENCE IN THE CHECK ITSELF THAT A LAUNDERING MODULE "CANNOT AVOID
    COMING HERE" — withdrawn as a claim by the Product Owner at CD-D-073 and refuted by execution as
    CD-ASR-WO2R-F01. ASR2-002-A avoided coming there entirely, through a public function that was
    not in the vocabulary and did not need to be. THE PROPERTY THAT IS TRUE, AND ALL THAT IS NOW
    CLAIMED FOR RULE 4: a module on the scanned path that NAMES one of the three names, in any
    scanned spelling, and is not a declared site, is reported — without the check recognising
    anything about a blend. That is a fact about NAMES. It is not a bound on the set of routes, and
    IT DOES NOT SURVIVE A RENAME. A refusal from RULE 4 is a VOCABULARY result and must be recorded
    as one (CD-PL-F74, adopted project-wide at CD-D-073). It remains static, and it remains useful
    as a locator.

    Layers 1 to 5 are structural and independent of one another. None is claimed to be sole
    (BLUEPRINT §17 risk CD-BP-001, PO-accepted), and no claim is made here that a violation
    slipping past one must fail the others.
  pid_relation: DERIVES
  supersedes: []
  superseded_by: null
  tests:
  # CD-RT-002-TYPE-NO-ARITHMETIC is the RUNTIME arm, and after CD-ASR-F01 it is the arm that
  # carries CD-AC-002's "unrepresentable" half. Its declared command GREW at WO-2R by one module,
