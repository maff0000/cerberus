# STABLE REFERENCE-BEARING FIELD CONTRACT, VERSION 4. ADDITIONS TO VERSIONS 2 AND 3.
#
# WHAT THIS IS. Every field in the committed PBGv2 governed corpus that carries a Git object
# reference and is NOT already declared by v2 or v3, and the object type each one actually carries.
# Nothing else.
#
# WHY IT EXISTS. dispatch-temporal-contract-v1 requires a BASE_DECLARATION to bind
# governance_source_commit, resulting_execution_base_commit and resulting_execution_base_tree. None
# of the three is declared by v2 or v3, and v3's disposition for an undeclared reference field is
# FAIL_CLOSED / UNDECLARED_REFERENCE_FIELD. Two frozen governance contracts therefore demanded
# opposite things: one mandated fields the other refused. A base declaration could not satisfy both.
#
# WHY IT IS THE WHOLE CORPUS AND NOT THE THREE FIELDS THAT BLOCKED TODAY. Product Authority ruling of
# 2026-08-08: a deliberately incomplete vocabulary becomes the next blocker, exactly as v2 became the
# blocker that required v3. "Narrow" means OBSERVED REALITY ONLY, not "only what today's draft
# happens to need". Every field below is already in committed history. Not one is speculative.
#
# NO INFERENCE. EVER. The v2 rules are inherited unchanged:
#     do NOT infer types from suffixes
#     do NOT use generic _commit / _tree / _tip / _blob conventions
#     do NOT silently classify undeclared fields
# `completely_new_commit` carrying a VALID 40-hex commit SHA must still be REFUSED as
# UNDECLARED_REFERENCE_FIELD. It is not declared in v2, not in v3, and deliberately not here. This
# contract must not become suffix inference through the back door: forty-three of the forty-five
# entries below were typed by asking Git what the committed object IS, and the two that could not be
# are labelled with the contract that names their type, not with the shape of their name.
#
# HOW THIS LIST WAS BUILT. Mechanically, not by hand — the v2 method, with one fix. Walk every YAML
# under governance/ and evidence/ at the governed revision, take every 40-hex string, ask
# `git cat-file -t`. The type is the OBSERVED type, never the type the name suggests.
#
# THE FIX, AND THE MISCOUNT IT CORRECTS. The Project Lead's first scan of this corpus reported FORTY-
# TWO undeclared fields. The true number is FORTY-THREE. The scanner recursed into YAML lists only
# for non-string items, so a 40-hex SHA appearing as a BARE LIST ITEM was skipped —
# `N7_authority_is_not_an_ancestor.subjects_used` carries two such SHAs and was invisible. The number
# reported to Product Authority was wrong and is corrected here rather than quietly matched.
#
# ZERO fields carry more than one object type anywhere in the corpus, which is what makes enumeration
# safe. One field carries a value that resolves to NO object at all; it is declared with that fact
# attached rather than omitted, because the corpus preserves that defect deliberately.
#
# SCOPE. Additions only. v2 is not edited. v3 is not edited. Nothing is pruned, renamed, retyped or
# tidied. No existing declaration changes, because no contradiction was found to justify one.
#
# FROZEN. v1, v2 and v3 stay immutable and so does this. A later need is version 5 in its own file,
# committed BEFORE the authority permitted to use it. Every historical artefact remains testable
# against the exact vocabulary that existed when it was created.

