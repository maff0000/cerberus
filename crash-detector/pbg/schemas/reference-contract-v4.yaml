    Walked every YAML under governance/ and evidence/ at the governed revision, took every 40-hex
    string including bare list items, and asked `git cat-file -t` what each object actually is. The
    Project Lead did not hand-type these entries; hand-typing forty-five entries is precisely where a
    Project Lead introduces errors.
