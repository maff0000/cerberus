extends: [pbg:schemas/reference-contract-v2.yaml, pbg:schemas/reference-contract-v3.yaml]
extends_commits:
- {path: schemas/reference-contract-v2.yaml, commit: "c5dccc6b9ea3e920ce49dec8df2efe2a08c102c9", blob: "8cfe77c2e8e0ef69739ec9dd25a0fd994e57ca8b"}
- {path: schemas/reference-contract-v3.yaml, commit: "c08028eab5767cdb80fd6a1d56136d6f16c3f96c", blob: "aa2fd17b3b158cbe2eda6083a5a79b43dc622d49"}
extends_rule: >
  v2 and v3 remain in force in full. v4 ADDS fields. It widens nothing, removes nothing and narrows
  nothing. An artefact claiming v2 is judged by v2 as committed; an artefact claiming v4 is judged by
  v2 plus v3 plus these additions.
immutability_rule: >
  These bytes never change. A later need is version 5 in its own file, committed before the authority
  that may use it.

policy:
  inherited_from_v2_and_v3: [suffix_inference PROHIBITED, default_object_type null,
    undeclared_field_disposition FAIL_CLOSED, undeclared_field_code UNDECLARED_REFERENCE_FIELD,
    abbreviated_references PROHIBITED]
  mandatory_negative_test_still_applies: >
    `completely_new_commit` carrying a VALID 40-hex commit SHA must still be REFUSED with
    UNDECLARED_REFERENCE_FIELD. It is not declared in v2, not in v3, and not here.
  naming_convention_inherited_from_v2: >
    A nested field is named by its last TWO path segments, a top-level field by its leaf. This is v2's
    convention, kept so that the three versions read as one vocabulary.

widens_from_v2_or_v3: NONE
retypes_from_v2_or_v3: NONE
prunes: NONE

