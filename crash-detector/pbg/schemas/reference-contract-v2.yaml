# STABLE REFERENCE-BEARING FIELD CONTRACT, VERSION 2.
#
# WHAT THIS IS. The complete, EXPLICIT, ENUMERATED list of fields in PBGv2 governed evidence that
# carry a Git object reference, and the object type each one carries. Nothing else.
#
# WHY IT EXISTS. FWK-OBS-016, REFERENCE_CONTRACT_BOOTSTRAP_CIRCULARITY. The reference vocabulary
# lived inside the candidate, so a new governed field could only exist if an Engineer widened the
# contract that judges that same candidate's evidence:
#
#     new governed field -> the contract must declare it -> the candidate changes the contract
#                        -> the candidate then judges evidence using the contract it changed
#
# That is the trust shape removed from SEAT_DELIVERY by seat-delivery-contract-v1.yaml, one layer
# lower. THE RULE: a candidate must not be able to widen the reference vocabulary used to judge that
# same candidate's governed evidence. So this contract is committed as a GOVERNANCE BOOTSTRAP
# ARTEFACT, on the governance lineage, BEFORE the authority that will reference it.
#
# NO INFERENCE. EVER. Product Authority ruling of 2026-08-07:
#     do NOT infer types from suffixes
#     do NOT use generic _commit / _tree / _tip / _blob conventions
#     do NOT silently classify undeclared fields
# A field whose name ends in `_commit` gets NO type from that fact. `completely_new_commit` carrying a
# valid commit SHA must be REFUSED as UNDECLARED_REFERENCE_FIELD, and there is a mandatory negative
# test for exactly that, because a convention that usually works is how `candidate_treeish_thing`
# silently acquires semantics.
#
# HOW THIS LIST WAS BUILT. Mechanically, not by hand. Every field below was found by walking every
# YAML under governance/ and evidence/ in the governed corpus, taking each 40-hex string, and asking
# GIT what the object actually is with `git cat-file -t`. The type is the OBSERVED type, never the
# type the name suggests. 141 fields; ZERO carry more than one object type anywhere in the corpus,
# which is what makes enumeration safe here. Hand-typing 141 entries is precisely where a Project
# Lead introduces errors, so the Project Lead did not hand-type them.
#
# SCOPE. What currently exists, and nothing speculative. This is not an attempt to enumerate every
# conceivable Git-related field. When a genuinely new governed reference-bearing field is needed, it
# requires reference-contract-v3.yaml committed BEFORE the Engineer authority allowed to use it.
#
# FROZEN. Version 2 is immutable once committed. v1 (delivery contract) stays immutable, v2 stays
# immutable, v3 will stay immutable. Every historical artefact remains testable against the exact
# vocabulary that existed when it was created. That is the leverage: the schema becomes the stable
# API of governance evidence.

schema_version: 2
schema_id: pbg:schemas/reference-contract-v2.yaml
title: PBGv2 Reference-Bearing Field Contract, version 2
status: STABLE_FROZEN
record_origin: GOVERNANCE_BOOTSTRAP_ARTEFACT
recorded_by: PROJECT_LEAD
authorised_by: >
  PRODUCT_AUTHORITY ruling of 2026-08-07 — NARROW, EXPLICIT, ENUMERATED. Option 1 selected over
  suffix inference, on the grounds that "v3 exists" is a cheaper failure than a field silently
  acquiring semantics from its name.
supersedes: null
supersedes_note: >
  This does NOT edit or replace any earlier contract. seat-delivery-contract-v1.yaml remains frozen
  and untouched. A future v3 will not edit this file either.
immutability_rule: >
  These bytes never change. A later need is version 3 in its own file, committed before the authority
  that may use it.

policy:
  suffix_inference: PROHIBITED
  default_object_type: null
  undeclared_field_disposition: FAIL_CLOSED
  undeclared_field_code: UNDECLARED_REFERENCE_FIELD
  undeclared_field_note: >
    An undeclared reference-bearing field is a POLICY failure, not a resolution failure. The value may
    resolve perfectly in Git and the field is still refused, because nothing declared what it means.
  abbreviated_references: PROHIBITED unless a field explicitly declares otherwise below.
  mandatory_negative_test: >
    A field named `completely_new_commit` carrying a VALID 40-hex commit SHA must be REFUSED with
    UNDECLARED_REFERENCE_FIELD. If that test ever passes, suffix inference has been reintroduced.

field_declaration_shape:
  object_type: the Git object type the value must resolve to — commit, tree or blob
  full_40_hex_mandatory: whether an abbreviated reference is refused
  permitted_sentinels: non-SHA values lawful in this position, exhaustively listed; empty means none
  legally_used_in: the evidence areas where this field may lawfully appear
  declared_in_contract_version: the contract version that first declared it
  observed_occurrences: how many times it was found in the corpus when this contract was built

