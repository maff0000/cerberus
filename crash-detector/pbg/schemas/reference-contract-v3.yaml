# STABLE REFERENCE-BEARING FIELD CONTRACT, VERSION 3. ADDITIONS ONLY.
#
# WHAT THIS IS. The vocabulary v2 could not express, and nothing else. v2 is FROZEN and is NOT edited,
# NOT pruned, NOT normalised and NOT redesigned by this file. Its 141 declarations stand exactly as
# committed at c5dccc6b9ea3e920ce49dec8df2efe2a08c102c9, and any artefact that ever claimed v2
# conformance remains testable against the bytes it claimed conformance to.
#
# WHY IT EXISTS. Two proven gaps, both found by composing the lineages for the first time:
#
#   1. TERMINAL OUTCOME VOCABULARY. FWK-OBS-018. The framework requires a terminal ENGINEER authority
#      to state WHY no candidate exists, from a named set. v2 permits only NOT_YET_PRODUCED and
#      NOT_LAWFULLY_ADOPTABLE, and NEITHER IS TRUE of AUTH-0028, which never spawned. The truthful
#      value could not lawfully be written. That is a PROJECT_LEAD defect in v2: it was built by
#      enumerating the VALUES OBSERVED IN THE CORPUS rather than the VOCABULARY THE FRAMEWORK ACCEPTS
#      — the right method for object types and the wrong one for sentinels.
#
#   2. SYNTHESIS PROVENANCE. The candidate-base synthesis architecture introduces reference-bearing
#      fields v2 does not declare. The Engineer correctly REFUSED to widen a frozen contract that
#      judges its own evidence — that is FWK-OBS-016 — and raised them as a v3 request instead.
#
# THE COUNT IS TEN, NOT SEVEN. The Engineer's prose summary listed seven fields from the design. A
# mechanical scan of the two committed synthesis artefacts finds TEN, adding
# `carried_governance_records.blob`, `parents`, and the `frozen_contracts.commit` / `.blob` pair that
# the specification carries alongside the provenance's `frozen_contracts_intact.blob`. Enumerated
# from the artefacts, with every type taken from `git cat-file -t` on the actual value, never from
# the field name and never from a summary. Same discipline that built v2, applied to the summary of
# v2's own successor.
#
# NO INFERENCE. EVER. Inherited from v2 unchanged: suffix_inference PROHIBITED, default_object_type
# null, undeclared fields FAIL CLOSED as UNDECLARED_REFERENCE_FIELD. A field named
# `completely_new_commit` carrying a valid commit SHA is still REFUSED, and is deliberately not
# declared here either.
#
# SCOPE. Additions proven necessary. Nothing speculative. Nothing tidied.
#
# FROZEN. v1 immutable, v2 immutable, v3 immutable. v3 must predate every authority permitted to use
# its additions.

