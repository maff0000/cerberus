status: STABLE_FROZEN
record_origin: GOVERNANCE_BOOTSTRAP_ARTEFACT
recorded_by: PROJECT_LEAD
authorised_by: >
  PRODUCT_AUTHORITY ruling of 2026-08-08 — reference-contract v3 authorised, additions only, never
  edit v2, do not use v3 to clean up or redesign the 141 existing declarations.
extends: pbg:schemas/reference-contract-v2.yaml
