extends_blob: "8cfe77c2e8e0ef69739ec9dd25a0fd994e57ca8b"
extends_rule: >
  v2 remains in force in full. v3 ADDS fields and, for exactly one field named below, WIDENS a
  declaration. An artefact claiming v2 is judged by v2 as committed; an artefact claiming v3 is
  judged by v2 plus these additions. v3 removes nothing and narrows nothing.
immutability_rule: >
  These bytes never change. A later need is version 4 in its own file, committed before the authority
  that may use it.

policy:
  inherited_from_v2: [suffix_inference PROHIBITED, default_object_type null,
    undeclared_field_disposition FAIL_CLOSED, undeclared_field_code UNDECLARED_REFERENCE_FIELD,
    abbreviated_references PROHIBITED]
  mandatory_negative_test_still_applies: >
    `completely_new_commit` carrying a VALID 40-hex commit SHA must still be REFUSED with
    UNDECLARED_REFERENCE_FIELD. It is not declared in v2 and it is not declared here.

# --- THE WIDENED DECLARATION. Exactly one. ------------------------------------------------------ #
widens_from_v2:
  new_candidate:
    v2_permitted_sentinels: [NOT_YET_PRODUCED, NOT_LAWFULLY_ADOPTABLE]
    v3_permitted_sentinels: [NOT_YET_PRODUCED, NOT_LAWFULLY_ADOPTABLE, NO_CANDIDATE_PRODUCED,
      SUPERSEDED_BEFORE_DELIVERY]
    object_type: commit
    full_40_hex_mandatory: true
    legally_used_in: [governance, evidence]
    declared_in_contract_version: 3
    source_of_the_added_values: >
      tools/pbg/authority.py NO_CANDIDATE_SENTINELS, read from the framework rather than invented
      here. Each is a DECLARED NON-PRODUCTION OUTCOME and each requires a stated reason, which the
      framework demands from NO_CANDIDATE_REASON_FIELDS. A label without a reason is silence with
      extra steps.
    meanings:
      NOT_LAWFULLY_ADOPTABLE: the cycle produced work that may not lawfully be adopted
      NO_CANDIDATE_PRODUCED: the cycle concluded without producing a candidate
      SUPERSEDED_BEFORE_DELIVERY: the authority was replaced before the seat delivered
    these_are_not_synonyms: >
      AUTH-0023 produced work that could not be adopted — NOT_LAWFULLY_ADOPTABLE. AUTH-0028 never
      spawned and produced nothing at all — NO_CANDIDATE_PRODUCED, because it was
      SUPERSEDED_BEFORE_DELIVERY. Writing NOT_LAWFULLY_ADOPTABLE on AUTH-0028 would be FALSE, and the
      absence of a truthful option is why that record still carries no value today.
    why_widening_v2_would_have_been_wrong: >
      Editing v2 to add these would have changed the vocabulary against which already-committed
      artefacts claimed conformance. The whole point of freezing is that it cannot be done.

