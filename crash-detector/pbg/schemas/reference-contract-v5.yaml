# STABLE REFERENCE-BEARING FIELD CONTRACT, VERSION 5. ADDITIONS TO VERSIONS 2, 3 AND 4.
#
# WHY THIS EXISTS, AND WHY IT IS BEING FROZEN BEFORE ANY AUTHORITY NEEDS IT.
#
# seat-delivery-contract-v1 lists `base_commit` among its FIFTEEN REQUIRED FIELDS. `base_commit` is
# declared in NEITHER v2, v3 NOR v4, whose inherited disposition for an undeclared reference field is
# FAIL_CLOSED / UNDECLARED_REFERENCE_FIELD. Two frozen contracts therefore demand opposite things:
# one MANDATES a field the other REFUSES. Every SEAT_DELIVERY attestation this programme still owes
# is structurally unsatisfiable until that is resolved.
#
# AND IT CANNOT BE RESOLVED LATE. A vocabulary frozen AFTER an authority exists cannot lawfully
# rescue that authority — the rule is
#     contract vocabulary -> authority allowed to use it -> seat / candidate / evidence
# and inverting it is FWK-OBS-016, the bootstrap circularity this programme spent several cycles
# eliminating. So v5 is frozen NOW, before the successor authority exists, rather than discovered at
# delivery when it would be too late to help.
#
# SCOPE, RULED BY PRODUCT AUTHORITY 2026-08-08:
#     all currently observed undeclared reference-bearing fields
#   + all fields MANDATED by already-frozen contracts
#     and nothing speculative.
# The alternative — declare `base_commit` alone — buys one cycle and then discovers the next mandated
# field, which is the v2 -> v3 -> v4 pattern repeating. This freeze is meant to end the vocabulary
# debt in one bounded act.
#
# NO INFERENCE. EVER. The v2 rules are inherited unchanged: no suffix inference, no generic
# _commit/_tree/_blob conventions, no silent classification. `completely_new_commit` carrying a VALID
# 40-hex SHA must still be REFUSED as UNDECLARED_REFERENCE_FIELD; it is declared in no version and
# deliberately not here.
#
# HOW THIS LIST WAS BUILT. Mechanically. Every YAML under governance/ and evidence/ across BOTH live
# lanes — the governance lane and the root-repair seat lane, since neither alone is the whole corpus —
# walked for every 40-hex string including bare list items, each resolved with `git cat-file -t`. The
# type is the OBSERVED type. Fields that no artefact has yet been able to carry are typed from THE
# FROZEN CONTRACT THAT MANDATES THEM, named per entry, never from the shape of the name.
#
# TWO THINGS THIS SWEEP FOUND THAT NO GATE IN THIS PROGRAMME HAD EVER CHECKED:
#
#   1. THE FIRST MULTI-TYPE FIELD. v2 recorded that zero fields carried more than one object type.
#      That was true of v2's corpus and is no longer true. Declared explicitly as multi-type.
#
#   2. A FABRICATED SHA IN A GOVERNANCE RECORD. `base_declaration_blob` carried a value that is not a
#      git object — twelve correct characters and twenty-eight fabricated ones, the identical
#      signature to the AUTH-0018 defect. It was the PROJECT_LEAD's, introduced by reading a
#      display-truncated twelve-character value off its own gate output instead of resolving it
#      afresh. Corrected append-only; the superseded value is PRESERVED and declared here WITH the
#      defect attached. Every gate this programme built checks ancestry, presence, identity,
#      chronology and vocabulary. NONE resolves whether an asserted reference is a real object. This
#      sweep does, because it enumerates SUBJECTS rather than checking ASSERTIONS.
#
# FROZEN. v1, v2, v3 and v4 stay immutable and so does this. A later need is version 6 in its own
# file, committed BEFORE the authority permitted to use it.

