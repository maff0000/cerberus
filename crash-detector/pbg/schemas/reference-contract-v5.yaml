field_provenance:
  method: >
    Walked every YAML under governance/ and evidence/ across BOTH live lanes, took every 40-hex string
    including bare list items, and resolved each with `git cat-file -t`. Contract-mandated fields that
    no artefact has yet carried are typed from the mandating contract, named per entry.
  lanes_scanned: [repair/PBGV2-REPAIR-0001, bootstrap/PBGV2-ROOT-REPAIR-0003]
  lanes_scanned_reason: >
    Neither lane alone is the whole corpus. The governance lane carries records the seat lane branched
    before; the seat lane carries the merged base plus its own evidence.
  files_scanned: 259
  fields_declared: 32
  observed: 25
  mandated_not_yet_observed: 7
  multi_type_fields: 1
  unresolvable_values: 2, both the same fabricated SHA — the superseded value and its correction entry

what_this_contract_does_not_decide:
- how the vocabulary is enforced. That is a validator, and validators are ENGINEER work.
- whether any particular historical artefact complies. It declares a vocabulary, not a verdict.
- whether an asserted reference RESOLVES. Declaring a field says what type it carries, not that any
  particular value exists. The sweep that built this list resolves values; the contract does not.

