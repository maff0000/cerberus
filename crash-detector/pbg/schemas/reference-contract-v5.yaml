status: STABLE_FROZEN
record_origin: GOVERNANCE_BOOTSTRAP_ARTEFACT
recorded_by: PROJECT_LEAD
authorised_by: >
  PRODUCT_AUTHORITY ruling of 2026-08-08 — REFERENCE-CONTRACT-v5 PREPARATION AUTHORISED NOW, frozen
  BEFORE the successor authority exists. Additions only; observed reality plus contract-mandated
  fields; no speculative vocabulary; do not edit v2, v3 or v4; do not prune; do not retype without a
  proven contradiction.
extends: [pbg:schemas/reference-contract-v2.yaml, pbg:schemas/reference-contract-v3.yaml,
  pbg:schemas/reference-contract-v4.yaml]
extends_commits:
- {path: schemas/reference-contract-v2.yaml, commit: "c5dccc6b9ea3e920ce49dec8df2efe2a08c102c9", blob: "8cfe77c2e8e0ef69739ec9dd25a0fd994e57ca8b"}
- {path: schemas/reference-contract-v3.yaml, commit: "c08028eab5767cdb80fd6a1d56136d6f16c3f96c", blob: "aa2fd17b3b158cbe2eda6083a5a79b43dc622d49"}
- {path: schemas/reference-contract-v4.yaml, commit: "1fafefa7e3e95600e57820c5bc4399197b6b0446", blob: "d947fb89cd4055f733e52f882c7af3d5ce25fcdb"}
extends_rule: >
  v2, v3 and v4 remain in force in full. v5 ADDS fields. It widens nothing, removes nothing, narrows
  nothing and retypes nothing.
immutability_rule: >
  These bytes never change. A later need is version 6 in its own file, committed before the authority
  that may use it.

policy:
  inherited: [suffix_inference PROHIBITED, default_object_type null,
    undeclared_field_disposition FAIL_CLOSED, undeclared_field_code UNDECLARED_REFERENCE_FIELD,
    abbreviated_references PROHIBITED]
  mandatory_negative_test_still_applies: >
    `completely_new_commit` carrying a VALID 40-hex commit SHA must still be REFUSED with
    UNDECLARED_REFERENCE_FIELD. Declared in no version, and deliberately not here.
  abbreviated_references_note: >
    PROHIBITED was already the rule and it was still violated, by padding a twelve-character display
    value to forty. The prohibition is on the VALUE being abbreviated; this version adds the observed
    lesson that an abbreviated value must be RESOLVED AFRESH, never extended.

widens_from_earlier_versions: NONE
retypes_from_earlier_versions: NONE
prunes: NONE

