policy_id: POL-SECRETS-AND-SENSITIVE-DATA
title: Secrets and sensitive data
version: 1
status: DRAFT
authority: PBGV2-FOUNDATION-0001

purpose: >
  Prevent a secret ever entering a governed record. Exposure is not undone by deletion, so the only
  reliable control is that the value never arrives.

scope: All code, records, evidence, logs, documentation and agent output.
actors: [PROJECT_LEAD, ENGINEER, ASSURANCE_ENGINEER]

required_behaviour:
- Refer to secrets by reference — name, path or store key. Never by value.
- Read secrets at the point of use, from the environment or a secret store.
- Report scanner findings as class and location only; never print the matched value.
- Treat any secret that has ever been committed as compromised, and rotate it.
- Mark deliberate test fixtures explicitly so a scanner exemption is visible where it is used.
- Apply the same discipline to personal data — collect the minimum, know where it lives.

prohibited_behaviour:
- Writing a secret into code, Git, evidence, logs, SQL, cache records, documentation or chat.
- Echoing a command whose rendered form would contain a credential.
- Including a real credential in an example, a test or an error message.
- Exempting a whole directory from secret scanning.
- Copying a production secret into a development environment.

evidence: [secret scan reporting zero findings, or findings classified by type and location]
exception_posture: NONE_EXPECTED — PBG-EVID-003 is non-waivable.
failure_route: >
  Stop immediately, do not commit, report the exposure class without reproducing the value, and
  treat rotation as the remedy rather than deletion.
related_controls: [PBG-SEC-001, PBG-SEC-002, PBG-SEC-003, PBG-SEC-004, PBG-EVID-003, PBG-DATA-001]
