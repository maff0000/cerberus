policy_id: POL-EXCEPTIONS-AND-HELD-ACTIONS
title: Exceptions and held actions
version: 1
status: DRAFT
authority: PBGV2-FOUNDATION-0001

purpose: >
  Make every deviation visible, owned and time-bounded, and make a deferred action stay deferred.
  An exception nobody can see is indistinguishable from a defect.

scope: All control exceptions, Temporary Operating Controls and held actions.
actors: [PRODUCT_AUTHORITY, PROJECT_LEAD, ENGINEER, ASSURANCE_ENGINEER]

required_behaviour:
- Record every exception with its authority, reason, scope, expiry and closing authority.
- Give every Temporary Operating Control a mandatory expiry.
- Carry held actions through every boot and surface them in every verdict.
- Record silent_execution PROHIBITED on each held action, with the actor expected to act next.
- Re-authorise explicitly when a held action becomes executable.
- Declare a framework limitation as a limitation rather than working around it locally.

prohibited_behaviour:
- Waiving a non-waivable control under any circumstances.
- Executing a held action because it survived a migration, a boot or a handover.
- Creating an exception without an expiry.
- Granting yourself an exception to your own blocker.
- Clearing a held action as part of unrelated work.

evidence: [exception record with expiry, held actions listed in the boot verdict]
exception_posture: >
  Exceptions are themselves governed. The seven non-waivable controls have none, and the
  exception mechanism cannot be used to reach them.
failure_route: Escalate to Product Authority with options, a recommendation and a default safe action.
related_controls: [PBG-CTRL-002, PBG-CTRL-003, PBG-FWK-001, PBG-FWK-002, PBG-AUTH-006]
